encies with respect to their records on these Veterans' readjustment appointments and resulting conversions to career-conditional positions.\n\nI am concerned with the wide disparity between agencies in the utilization of Veterans readjustment and resulting careerconditional conversion appointments. While some agencies have done a commendable job others have virtually ignored the Veterans readjustment and career-conditional appointment program. Access to Federal employment can be enhanced for Vietnam-era and disabled Veterans with fuller utilization of the Veterans readjustment appointment authority outlined in 38 U.S.C. section 2014.\n\nI have directed the Chairman of the Civil Service Commission to contact each agency with a request for a specific plan of action to include goals and timetables for the implementation of the Veterans readjustment program. I expect your full cooperation on this matter.\n\nJIMMY CARTER","chunks":{"1":"section 2014. I have directed the Chairman of the Civil Service Commission to contact each agency with a request for a specific plan of action to include goals and timetables for the implementation of the Veterans readjustment program. I expect your full cooperation on this matter."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P6":{"metadata":{"president":"Gerald R. Ford","date":"January 30, 1975","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nAMENDING PROCLAMATION No. 4313 OF SEPTEMBER 16, 1974, TO EXTEND THE APPLICATION PERIOD OF THE PROGRAM FOR THE RETURN OF VIETNAM ERA DRAFT EVADERS AND MILITARY DESERTERS\n\nOn September 16, 1974, I issued Proclamation No. 4313, announcing a program of earned return for those convicted and accused of violating certain provisions of the Selective Service Act or the Uniform Code of Military Justice during the Vietnam conflict.\n\nUpon careful review of the progress of this program, I believe that many of those persons who could benefit from this program are only now learning of its application to their cases. Therefore, I am extending the date by which all applications must be received.\n\nNow, Therefore, I, Gerald R. Ford, President of the United States of America, pursuant to my powers under Article II of the Constitution, do hereby proclaim that Proclamation No. 4313 is amended as follows:\n\nSECTION 1. Paragraph (i) of Section 1 is amended to read as follows:\n\n\"presents himself to a United States Attorney before March 1, 1975,\".\n\nSEC. 2. The first paragraph of Section 2 is amended by striking out the date \"January 31, 1975,\" after the words \"offenses directly related thereto if before\" and inserting in place thereof \"March 1, 1975,\".\n\nIn Witness Whereof, I have hereunto set my hand this thirtieth day of January, in the year of our Lord nineteen hundred seventy-five, and of the Independence of the United States of America the one hundred ninety-ninth.\n\nGERALD R. FORD","chunks":{"1":"SECTION 1. Paragraph (i) of Section 1 is amended to read as follows: \"presents himself to a United States Attorney before March 1, 1975,\"."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO9":{"metadata":{"president":"John F. Kennedy","date":"February 28, 1963","type":"executive_order"},"text":"By virtue of the authority vested in me by the Constitution and statutes of the United States, and as President of the United States, and deeming such action necessary in the best interest of the national security, it is hereby ordered as follows:\n\nSECTION 1. Section 2 of Executive Order No. 10501 of November 5, 1953, as amended by Executive Order No. 10901 of January 9, 1961, and by Executive Order No. 10985 of January 12, 1962, is hereby further amended (A) by adding at the end of Subsection (a) thereof \"Export-Import Bank of Washington\", \"Office of Science and Technology\", and \"The Special Representative for Trade Negotiations\"; and (B) by deleting from Subsection (b) thereof \"Subversive Activities Control Board.\"\n\nSEC. 2. The Export-Import Bank of Washington, the Office of Science and Technology, and The Special Representative for Trade Negotiations shall be deemed to have had authority for the original classification of information and material from the respective dates on which such agencies were established.\n\nTHE WHITE HOUSE,\n\nFebruary 28, 1963","chunks":{"1":"SECTION 1. Section 2 of Executive Order No. 10501 of November 5, 1953, as amended by Executive Order No. 10901 of January 9, 1961, and by Executive Order No. 10985 of January 12, 1962, is hereby further amended (A) by adding at the end of Subsection (a) thereof \"Export-Import Bank of Washington\", \"Office of Science and Technology\", and \"The Special Representative for Trade Negotiations\"; and (B) by deleting from Subsection (b) thereof \"Subversive Activities Control Board.\"","2":"SEC. 2. The Export-Import Bank of Washington, the Office of Science and Technology, and The Special Representative for Trade Negotiations shall be deemed to have had authority for the original classification of information and material from the respective dates on which such agencies were established."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M3":{"metadata":{"president":"Dwight D. Eisenhower","date":"February 05, 1960","type":"memorandum"},"text":"To the Heads of Executive Departments and Agencies:\n\nOur government faces the possible loss of two-thirds of its top career managers over the next ten years. A survey of 751 career officials in grades GS-16, 17 and 18, indicates that two out of every three will be eligible for retirement during the next decade. Further, two out of every five will be eligible for retirement by 1963. In addition, of course, there will be certain losses because of death, disability and resignation. This situation emphatically and clearly points to the importance of instituting a positive program which will assure the filling of the anticipated vacancies with persons of outstanding leadership ability, creative imagination and sound judgment.\n\nUpon each of us rests the responsibility for seeing to it that the critically important functions of the top career management positions continue to be carried out by persons of the highest competence. Nothing less will satisfy our obligation to the American people for effective and efficient administration of their government's programs.\n\nTo properly discharge this responsibility, careful planning will be needed in each agency and on a government-wide scale. Employees with executive potential in positions below the top career levels must be identified, trained and developed over a period of time to increase their capacity to perform the complex functions of career managers.\n\nThe success or failure of our efforts to identify, select and develop competent career managers will determine the future effectiveness of government operations, both here and abroad. I have asked my Special Assistant for Personnel Management to provide leadership to the departments and agencies in taking such steps as may be necessary to see to it that we continue to have the best available executive talent for these top civil service posts. He will work with you and the Civil Service Commission toward this goal.\n\nIn the last analysis, however, the results of the quest for topnotch administrators in the career service will depend on the steps each agency takes to find persons of executive potential and to train and develop them for the responsibilities that lie ahead. I know each of you shares my concern that the ablest persons are selected for top career civil service positions. I expect you to give personal leadership towards the achievement of this objective within your organization.\n\nDWIGHT D. EISENHOWER","chunks":{"1":"Upon each of us rests the responsibility for seeing to it that the critically important functions of the top career management positions continue to be carried out by persons of the highest competence. Nothing less will satisfy our obligation to the American people for effective and efficient administration of their government's programs. To properly discharge this responsibility, careful planning will be needed in each agency and on a government-wide scale. Employees with executive potential in positions below the top career levels must be identified, trained and developed over a period of time to increase their capacity to perform the complex functions of career managers. The success or failure of our efforts to identify, select and develop competent career managers will determine the future effectiveness of government operations, both here and abroad. I have asked my Special Assistant for Personnel Management to provide leadership to the departments and agencies in taking such steps as may be necessary to see to it that we continue to have the best available executive talent for these top civil service posts. He will work with you and the Civil Service Commission toward this goal. In the last analysis, however, the results of the quest for topnotch administrators in the career service will depend on the steps each agency takes to find persons of executive potential and to train and develop them for the responsibilities that lie ahead. I know each of you shares my concern that the ablest persons are selected for top career civil service positions. I expect you to give personal leadership towards the achievement of this objective within your organization."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO19":{"metadata":{"president":"George W. Bush","date":"March 28, 2003","type":"executive_order"},"text":"By the authority vested in me as President of the United States and as Commander in Chief of the Armed Forces of the United States, and in order to extend eligibility for the award of the National Defense Service Medal to members in good standing in the Selected Reserve of the Armed Forces of the United States, it is hereby ordered that Executive Order 10448 of April 22, 1953, as amended, is further amended:\n\nby inserting \"or service in good standing in the Selected Reserve of the Armed Forces\" after \"active military service\" each place it appears; and by striking \"additional period of active duty\" and inserting in lieu thereof \"additional period.\"\n\nNothing in this order shall be construed to <script>
(function(){
'use strict';
var P=JSON.parse(document.getElementById('payload-data').textContent);
var groups=P.groups,annotators=P.annotators,docs=P.docs;
var fields=P.fields,fieldLabels=P.fieldLabels,valueLabels=P.valueLabels;
var mode='directive',activeTab=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function label(v){return v==null?null:(valueLabels[v]||v);}

function rowAgreement(vals){
  var nn=vals.filter(function(v){return v!=null;});
  if(!nn.length)return 'missing';
  return(new Set(nn)).size>1?'disagree':(nn.length<vals.length?'missing':'agree');
}

function docAgreement(docId){
  var d=docs[docId];if(!d)return 'missing';
  var ann=d.annotations;
  var hasMissing=false;
  for(var fi=0;fi<fields.length;fi++){
    var f=fields[fi];
    var vals=ann.map(function(a){return a.directive?(a.directive[f]!=null?a.directive[f]:null):null;});
    var ag=rowAgreement(vals);
    if(ag==='disagree')return 'disagree';
    if(ag==='missing')hasMissing=true;
  }
  return hasMissing?'missing':'agree';
}

function annTable(rowData){
  var out='<table class="ann-table"><thead><tr><th>Field</th>';
  annotators.forEach(function(n){out+='<th>'+esc(n)+'</th>';});
  out+='</tr></thead><tbody>';
  rowData.forEach(function(row){
    var ag=rowAgreement(row.vals);
    out+='<tr class="row-'+ag+'"><td class="field-label">'+esc(row.label)+'</td>';
    row.vals.forEach(function(v){
      var cls='val-cell'+(v==null?' val-missing':'');
      out+='<td class="'+cls+'">'+(v==null?'—':esc(label(v)))+'</td>';
    });
    out+='</tr>';
  });
  return out+'</tbody></table>';
}

function makeRowData(getVal){
  return fields.map(function(f){
    return{field:f,label:fieldLabels[f],vals:annotators.map(function(_,i){return getVal(i,f);})};
  });
}

function directiveTable(ann){
  return annTable(makeRowData(function(i,f){
    var d=ann[i].directive;return d?(d[f]!=null?d[f]:null):null;
  }));
}

function chunkTable(chunkN,ann){
  return annTable(makeRowData(function(i,f){
    var c=ann[i].chunks?ann[i].chunks[chunkN]:null;return c?(c[f]!=null?c[f]:null):null;
  }));
}

function wpComments(ann){
  var items=ann.map(function(a,i){return{who:annotators[i],txt:a.wp_comment};}).filter(function(x){return x.txt;});
  if(!items.length)return '';
  var out='<div class="comments"><div class="comment-heading">Discussion notes</div>';
  items.forEach(function(x){out+='<div class="comment-item"><span class="comment-who">'+esc(x.who)+':</span> '+esc(x.txt)+'</div>';});
  return out+'</div>';
}

function rightCol(docId){
  var d=docs[docId];if(!d)return '<div class="no-chunks">No data.</div>';
  var ann=d.annotations;
  if(mode==='directive')return directiveTable(ann)+wpComments(ann);
  // subdirective
  var ckKeys=Object.keys(d.chunks||{}).sort(function(a,b){return+a-+b;});
  var out='';
  if(!ckKeys.length)out+='<div class="no-chunks">No sub-directive chunks — showing directive-level.</div>';
  else{
    ckKeys.forEach(function(n){
      out+='<div class="chunk-block"><div class="chunk-label">Chunk '+esc(n)+'</div>';
      out+='<div class="chunk-text">'+esc(d.chunks[n])+'</div>';
      out+=chunkTable(n,ann)+'</div>';
    });
  }
  out+=wpComments(ann);
  if(!ckKeys.length)out+=directiveTable(ann);
  return out;
}

function renderDoc(docId){
  var d=docs[docId];if(!d)return '';
  var m=d.metadata||{};
  var ag=docAgreement(docId);
  var badgeText=ag==='agree'?'Agreement':ag==='disagree'?'Disagreement':'Incomplete';
  var colHead=mode==='directive'?'Directive annotation':'Sub-directive annotation';
  return '<details class="doc-card" open>'
    +'<summary>'
    +'<span class="doc-id">'+esc(docId)+'</span>'
    +'<span class="doc-prez">'+esc(m.president||'')+'</span>'
    +'<span class="doc-date">'+esc(m.date||'')+'</span>'
    +'<span class="doc-type">'+esc((m.type||'').replace(/_/g,' '))+'</span>'
    +'<span class="doc-badge '+ag+'">'+badgeText+'</span>'
    +'</summary>'
    +'<div class="doc-body">'
    +'<div class="col"><p class="col-heading">Document text</p><div class="doc-text">'+esc(d.text||'(text not found)')+'</div></div>'
    +'<div class="col"><p class="col-heading">'+esc(colHead)+'</p>'+rightCol(docId)+'</div>'
    +'</div></details>';
}

function renderPanel(){
  var g=groups[activeTab];
  var seen=new Set();
  return g.docs.map(function(id){
    if(seen.has(id))return '';seen.add(id);return renderDoc(id);
  }).join('');
}

function renderTabs(){
  document.getElementById('tab-bar').innerHTML=groups.map(function(g,i){
    return'<button class="tab-btn'+(i===activeTab?' active':'')+'" data-idx="'+i+'" type="button">'
      +esc(g.label)+' <span class="tab-count">('+g.docs.length+')</span></button>';
  }).join('');
}

function render(){renderTabs();document.getElementById('content').innerHTML=renderPanel();}

document.getElementById('tab-bar').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  activeTab=+btn.dataset.idx;render();
});
document.getElementById('btn-directive').addEventListener('click',function(){
  mode='directive';
  document.getElementById('btn-directive').classList.add('active');
  document.getElementById('btn-subdirective').classList.remove('active');
  document.getElementById('content').innerHTML=renderPanel();
});
document.getElementById('btn-subdirective').addEventListener('click',function(){
  mode='subdirective';
  document.getElementById('btn-directive').classList.remove('active');
  document.getElementById('btn-subdirective').classList.add('active');
  document.getElementById('content').innerHTML=renderPanel();
});

render();

function setBarHeight(){
  var h=document.getElementById('tab-bar').getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--bar-height',h+'px');
}
setBarHeight();
window.addEventListener('resize',setBarHeight);
})();
</script>
</body>
</html>
