ins to information that may otherwise remain classified beyond","EO15":"The Emergency Planning and Community Right-to-Know Act of 1986 (42 U.S.C. 11001-11050) (\"EPCRA\") and the Pollution Prevention Act of 1990 (42 U.S.C. 13101-13109) (\"PPA\") established programs to protect public health and the environment by providing the public with important information on the toxic chemicals being released into the air, land, and water in their communities by manufacturing facilities.\n\nThe Toxics Release Inventory (\"TRI\") established pursuant to section 313(j) of EPCRA, 42 U.S.C. 11023(j), based on information required to be reported under section 313 of EPCRA and section 6607 of PPA, 42 U.S.C. 13106, provides the public, industry, and Federal, State, and local governments with a basic tool for making risk-based decisions about management and control of toxic chemicals, that can have significant adverse effects on human health and the environment. TRI data allow the public, industry, and government to gauge the progress of industry and government efforts to reduce toxic chemical wastes.\n\nSharing vital TRI information with the public has provided a strong incentive for reduction in the generation, and, ultimately, release into the environment, of toxic chemicals. Since the inception of the TRI program, reported releases to the environment under TRI have decreased significantly.\n\nThe efficiency of the Federal Government is served when it purchases high quality supplies and services that have been produced with a minimum impact on the public health and environment of communities surrounding government contractors. Savings associated with reduced raw materials usage, reduced use of costly, inefficient end-of-pipeline pollution controls, and reduced liability and remediation costs from worker and community claims all serve to increase the economic and efficient provision of essential supplies and services to the government. As a result of TRI reporting, many manufacturers have learned of previously unrecognized significant efficiencies and cost savings in their production processes.\n\nThe Federal Government's receipt of timely and quality supplies and services is also served by the general enhancement of relations between government contractors and the communities in which they are situated, as well as the cooperative working relationship between employers and employees who may be subject to exposure to toxic materials.\n\nInformation concerning chemical release and transfer can assist the government to purchase efficiently produced, lower cost, and higher quality supplies and services that also have a minimum adverse impact on community health and the environment.\n\nNow, Therefore, to promote economy and efficiency in government procurement of supplies and services, and by the authority vested in me as President by the Constitution and the laws of the United States of America, including EPCRA, 42 U.S.C. 11001 et seq., PPA, 42 U.S.C. 13101 et seq., 40 U.S.C. 471 and 486(a), and 3 U.S.C. 301, it is hereby ordered as follows:\n\nSection 1. Policy. It is the policy of the executive branch in procuring supplies and services that, to ensure the economical and efficient procurement of Federal Government contracts, Federal agencies, to the greatest extent practicable, shall contract with companies that report in a public manner on toxic chemicals released to the environment.\n\nSec. 2. Definitions. 2-201. All definitions found in EPCRA and PPA and implementing regulations are incorporated into this order by reference, with the following exceptions for purposes of this order.\n\n2-202. \"Federal agency\" means an \"Executive agency,\" as defined in 5 U.S.C. 105. For purposes of this order, military departments, as defined in 5 U.S.C. 102, are covered under the auspices of the Department of Defense.\n\n2-203. \"Acquisition\" means the acquiring by contract with appropriated funds of supplies or services (including construction) by and for the use of the Federal Government through purchase or lease, whether the supplies or services are already in existence or must be created, developed, demonstrated, and evaluated. Acquisition begins at the point when the Federal department or agency needs are established and includes the description of requirements to satisfy agency needs, solicitation and selection of sources, award of contracts, contract financing, contract performance, contract administration, and those technical and management functions directly related to the process of fulfilling agency needs by contract.\n\n2-204. \"Toxic chemical\" means a substance on the list described in section 313(c) of EPCRA, 42 U.S.C. 11023(c), as it exists on the effective date of this order.\n\n2-205. \"Administrator\" means the Administrator of the United States Environmental Protection Agency (\"EPA\").\n\n2-206. \"Federal contractor\" means an entity that has submitted the successful bid or proposal in response to a competitive acquisition solicitation.\n\nSec. 3. Applicability. 3-301. Each Federal agency shall, to the maximum extent practicable, include in contract solicitations as an eligibility criterion for the award of competitive acquisition contracts expected to equal or exceed $100,000 with the Federal contractors described in subsection 3-302, the requirement that such contractors must file (and continue to file for the life of the contract) a Toxic Chemical Release Form (\"Form R\"), as described in sections 313 (a) and (g) of EPCRA, 42 U.S.C. 11023 (a) and (g), for each toxic chemical manufactured, processed, or otherwise used by the Federal contractor at a facility, as described in section 313 of EPCRA, 42 U.S.C. 11023, and section 6607 of PPA, 42 U.S.C. 13106.\n\n3-302. The Federal contractors subject to the eligibility criterion described in subsection 3-301 above are those who currently report to the TRI pursuant to section 313(b)(1)(A) of EPCRA, 42 U.S.C. 11023(b)(1)(A), that is, manufacturers having Standard Industrial Classification Code (\"SIC\") designations of 20 through 39 (as in effect on July 1, 1985).\n\n3-303. Each Federal agency shall find that a prospective Federal contractor has satisfied the requirement in subsection 3-301 if the contractor certifies in a solicitation that it:\n\n(a) Does not manufacture, process, or otherwise use any toxic chemicals listed under section 313(c) of EPCRA, 42 U.S.C. 11023(c);\n\n(b) Does not have 10 or more full-time employees as specified in section 313(b)(1)(A) of EPCRA, 42 U.S.C. 11023(b)(1)(A);\n\n(c) Does not meet the reporting thresholds established under section 313(f) of the EPCRA, 42 U.S.C. 11023(f); or\n\n(d) Has complied fully with the reporting requirements of subsection 4-404.\n\n3-304. Each Federal agency shall require the filings described in subsection 3-301 above to include information on all chemicals identified by the Administrator pursuant to section 313(c) of EPCRA, 42 U.S.C. 11023(c), as of the date of this order.\n\n3-305. Each Federal agency may amend existing contracts, to the extent permitted by law and where practicable, to require the reporting of information specified in subsection 3-301 above.\n\n3-306. As consistent with Title IV of the Federal Acquisition Streamlining Act of 1994 (FASA), Public Law 103-355, and section 4(11) of the Office of Federal Procurement Policy Act, 41 U.S.C. 403(11), the requirements of this order are only applicable to competitive acquisition contracts expected to equal or exceed $100,000.\n\nSec. 4. Implementation. 4-401. Not later than September 30, 1995, the EPA shall publish in the Federal Register guidance for compliance with this order, including applicability with respect to subcontractors.\n\n4-402. Within 30 days of the issuance of the guidance provided for in subsection 4-401 above, each Federal agency shall include in all acquisition solicitations issued on or after the effective date of this order, the provisions necessary to effect this order.\n\n4-403. For all contracts expected to exceed $500,000, each Federal agency shall consult with the Administrator or the Administrator's designee when the agency believes it is not practicable to include the eligibility requirement of section 3-301 in the contract solicitation or award.\n\n4-404. Each Federal agency shall require each Federal contractor designated in subsection 3-302 above to:\n\n(a) Have included in its response to the contract solicitation a certification, as specified in the guidelines published pursuant to subsection 4-401 of this order, that it will (if awarded the contract) comply with the requirements of subsection 3-301; and\n\n(b) File with the Administrator and each appropriate State pursuant to section 313(a) of EPCRA, 42 U.S.C. 11023(a), the information required by subsection 3-301, beginning on the next July 1 after the date on which the contract is awarded.\n\n4-405. Information submitted to the EPA pursuant to subsection 4-404(b) above shall be subject to the trade secret protections provided by section 322 of EPCRA, 42 U.S.C. 11042. Information that is not trade secret shall be made available to the public pursuant to sections 313 (h) and (j) of EPCRA, 42 U.S.C. 11023 (h) and (j). The Administrator is directed to review reports submitted pursuant to this order to determine the appropriateness of any claims for trade secret protection.\n\n4-406. When the Administrator determines that a Federal contractor has not filed the necessary forms or complete information as required by subsection 3-301 above, the Administrator or the Administrator's designee may recommend termination of the contract for convenience. The Administrator shall transmit that recommendation to the head of the contracting agency, and that agency shall consider the recommendation and determine whether to terminate the contract. In carrying out this responsibility, the Administrator may investigate any subject Federal contractor to determine the adequacy of compliance with the provisions of this order and the Administrator's designee may hold such hearings, public or private, as the Administrator deems advisable to assist in the Administrator's determination of compliance.\n\n4-407. Each contracting agency shall cooperate with the Administrator and provide such information and assistance as the Administrator may require in the performance of the Administrator's functions under this order.\n\n4-408. Upon request and to the extent practicable, the Administrator shall provide technical advice and assistance to Federal agencies in order to assist in full compliance with this order.\n\nSec. 5. General Provisions. 5-501. The requirements of this order shall be implemented and incorporated in acquisition regulations, including the Federal Acquisition Regulations (FAR), within 90 days after the effective date of this order.\n\n5-502. This order is not intended, and should not be construed, to create any right or benefit, substantive or procedural, enforceable at law by a party against the United States, its agencies, its officers, or its employees. This order is not intended, however, to preclude judicial review of final agency decisions in accordance with the Administrative Procedure Act, 5 U.S.C. 701 et seq.\n\n5-503. This order shall be effective immediately and shall continue to be in effect until revoked.\n\nWilliam J. Clinton\n\nThe White House,\n\nAugust 8, 1995.\n\n[Filed with the Office of the Federal Register, 5:01 p.m., August 8, 1995]","L15":"Dear Mr. Speaker: (Dear Mr. President:)\n\nThe Soviet invasion of Afghanistan and the installation of a puppet government is an extremely serious threat to peace. It threatens vital U.S. security and foreign policy interests:\n\n—It places the Soviets within aircraft striking range of the vital oil resources of the Persian Gulf;\n\n—It threatens a strategically located country, Pakistan;\n\n—It poses the prospect of increased Soviet pressure on Iran and on other nations in the Middle East;\n\n—Above all, it shows that the Soviets will use force to take over a neighboring country.\n\nThe Soviet invasion requires a firm and vigorous .response by the United States. We must make clear to the Soviet Union that it cannot trample on the independence of other states and at the same time carry on business as usual with the rest of the world.\n\nI have therefore taken several measures. I have directed the Secretary of Commerce to restrict exports and reexports of identified agricultural commodities from the United States to the U.S.S.R., except for exports of wheat and corn authorized under Article I of the Agreement on the Supply of Grain of October 20, 1975. These restrictions became effective January 7, 1980 under regulations issued by the Department of Commerce. The restrictions were initially made applicable to a broadly described group of agricultural commodities and products as a means of quickly achieving the objective of stopping exports of any items which are significant in terms of the grounds on which I acted. The Department of Commerce is revising the list to eliminate items for which controls are not warranted.\n\nI have acted in the national security and foreign policy interests of the United States under the authority of the Export Administration Act of 1979. I transmit herewith my report pursuant to Sections 6(e) and 7(g) (3) of the Act.\n\nI have recognized that other countries are major exporters of agricultural commodities. At my direction, United States officials promptly began consultations with other major agricultural exporters to seek their cooperation in restricting exports in harmony with our actions. These consultations and negotiations have been fruitful and will' continue. We have also consulted with U.S. farm organizations and trading companies, and these consultations have contributed valuable information concerning the domestic impact of these export restrictions, their adverse impact on the Soviet Union, and the availability of identified items from foreign sources. I have considered the possibility that some of the agricultural commodities involved might be obtained by the Soviet Union from other countries. I have also assessed the threat to our national security and foreign policy posed by the Soviet aggression and the consequences of a failure to take prompt and decisive action. I have determined pursuant to Section 4(c) of the Act that the absence of such controls would prove detrimental to the foreign policy and national security interests of the United States.\n\nPursuant to Section 6(d) of the Act, I have determined that although reasonable efforts have been made to achieve the purposes of these controls through alternative means, available alternatives would not comparably advance the foreign policy and national security interests of the United States.\n\nI have also directed that the Secretary of Commerce, in consultation with the Secretary of Defense and other appropriate officials, review and revise our policy with respect to the export of high technology and other strategic items to the Soviet Union. This review is to proceed with the utmost urgency. Effective January 11, 1980 the Department of Commerce suspended all outstanding licenses and authorizations for exports to the Soviet Union and announced that it has suspended the issuance of new licenses and authorizations. The review I have directed will also consider what our policy should be on future applications for licenses, whether existing special licenses should be amended or revoked, and whether validated licenses should be required for any other exports currently permitted to the Soviet Union under general license. The Secretary of Commerce announced on January 11, 1980 his denial on national security grounds of eight license applications for export of high technology items to the Soviet Union.\n\nWhen the review and revision of our policy on high technology and other strategic items is completed, I will submit a further report to the Congress concerning any additional controls that may be imposed.\n\nSincerely,\n\nJIMMY CARTER\n\nRESTRICTIONS ON AGRICULTURAL COMMODITY EXPORTS TO THE USSR: REPORT TO THE CONGRESS PURSUANT TO THE EXPORT ADMINISTRATION ACT OF 1979\n\nActing pursuant to a Presidential directive issued on January 7, 1980 under the authority of the Export Administration Act of 1979, the Department of Commerce has issued rules effective p.m. January 7, 1980, restricting the export of identified agricultural commodities and products to the Soviet Union. (45 Fed. Reg. 1883, Jan. 9, 1980). This is the Report required by Sections 6(e) and 7(g) (3) of the Act with respect to the imposition of these export controls.\n\nThese Restrictions Further Significantly U.S. National Security and Foreign Policy Interests\n\nThe Soviet invasion of Afghanistan and the installation of a puppet government is an extraordinary and grave act of aggression which threatens vital U.S. security and foreign policy interests. This invasion is an extremely serious threat to peace.\n\n—It places the Soviets within aircraft striking range of the vital oil resources of the Persian Gulf;\n\n—It threatens a strategically located country, Pakistan;\n\n—It poses the prospect of increased Soviet pressure on Iran and on other nations of the Middle East;\n\n—Above all, it is the first Soviet invasion of a previously independent and unoccupied nation since World War II.\n\nThese extraordinary circumstances demand prompt and forceful response by the United States. We must show the Soviet Union that it cannot expect to continue to do business as usual with the United States while it is invading and occupying an independent nation. Accordingly, restrictions have been placed on agricultural exports to the USSR. These exports make a substantial contribution to Soviet strength. U.S. security interests are affected when that strength is devoted to the military invasion of previously independent nations. Curtailment of these exports is a critical element in our efforts to demonstrate to the USSR in tangible ways that it cannot engage in armed aggression with impunity and without cost to itself.\n\nAs President and Commander-in-Chief of the Armed Forces of the United States, I find that the exports being curtailed by this action make a significant contribution to the military potential of the Soviet Union that is detrimental to the national security of the United States.\n\nProbability of Success. The restrictions can reasonably be expected to bring home to the Soviet leaders that they cannot act as they have in Afghanistan without paying a significant price. The controls are expected to have a significant impact on the Soviet economy. They will impress upon the Soviet people the consequences of their government's actions. Absent substitutes from other sources, the restrictions will mean the loss of up to half of projected grain imports for FY 1980. Combined with the 48 million ton shortfall from planned 1979 production, the effect will be a major reduction in the availability of livestock feed, the slaughter of livestock that cannot be fed, and in due course .a significant reduction in USSR meat production below planned levels. Moreover, contacts with the governments of other major grain supplier countries indicate that there will be substantial cooperation in limiting the Soviet Union's ability to replace the curtailed U.S. shipments with imports from other sources.\n\nCompatibility with Foreign Policy. The controls are essential to achieve U.S. national security and foreign policy objectives and are compatible with overall U.S. policy toward the USSR, for the reasons given above.\n\nForeign Reaction. Many countries have expressed support for these actions by the United States, and United States officials are urgently consulting with other suppliers to seek complementary actions.\n\nEconomic Impact of Controls. The most significant effect of the control on U.S. exports relates to the 17 million tons of grain previously authorized for the Soviet Union, valued at about $2.3 billion. In FY 1978 U.S. exports of all agricultural commodities to the USSR were $1.9 billion, and in FY 1979 $2.2 billion. These exports constituted 6.8% of total U.S. agricultural exports in FY 1978 and 6.9% in FY 1979. Grain exports accounted for about 80% of the value of U.S. agricultural exports to the USSR in FY 1979. Soybeans accounted for another 15%.\n\nThe U.S. provided 65.1% of Soviet grain imports in FY 1978 and 77.8% in FY 1979.\n\nTotal Soviet grain utilization is estimated at 231 million metric tons from July, 1978 to June, 1979, and—before imposition of these restrictions—was projected to be 228 million tons for July, 1979 to June, 1980. U.S. grain exports (11.1 million tons) accounted for 4.8% of the 1978/1979 Soviet use. Before these restrictions, U.S. exports were projected to provide 11.2% (25.5 million tons) of the Soviets' projected 1979/1980 utilization (228 million tons).\n\nThe United States is the world's largest. exporter of wheat and corn and will remain so even after the suspension of most agricultural commodity exports to the Soviet Union. The United States has been undertaking consultations with other governments to reduce the possibility that other suppliers would take advantage of U.S. action to build up their own competitive position at U.S. expense. Because the export restriction has been imposed on agricultural commodities destined to the USSR in response to a Soviet act of aggression and on the basis of fundamental U.S. national security and foreign policy interests, it is unlikely that such action will diminish the overall reputation of the United States as a reliable supplier.\n\nWith respect to foreign availability of wheat and corn, the United States is the major supplier of these commodities in world trade. At this time, it appears that additional supplies available in the world market are limited. With respect to soybeans and soybean products, there is substantially greater foreign availability. The availability of these commodities to the Soviet Union will depend therefore, in part, upon the cooperation of foreign suppliers.\n\nIn the absence of offsetting domestic policies the restriction on agricultural exports to the USSR would have an economic impact primarily on grain farmers, on firms and employees in the grain sector, on certain rail and barge lines, and on communities in grain producing areas.\n\nAbsent offsetting action, it is estimated that the restrictions on the export of agricultural commodities to the Soviet Union would reduce 1980 farm income by approximately $3.0 billion.\n\nThe Secretary of Agriculture has been directed to take a number of actions, using authorities already available under current law, to ensure that the suspension of exports to the USSR will not fall unfairly on farmers and on grain marketing systems. To assure that it does not, he has taken the following actions:\n\nTo prevent immediate market congestion\n\nThe Department of Agriculture:\n\n• has requested that future trading in wheat and corn be suspended for the market days, January 7 and January 8;\n\n• has announced that it will purchase up to 4 million tons (150 million bushels) of wheat, including the assumption of the contractual obligations on up to 3.7 million tons (135 million bushels) that will not be shipped to the Soviet Union;\n\n• is preparing to assume the contractual obligation on up to 10.0 million tons (395 million bushels) of corn.\n\nNone of these grain purchases will be resold on the domestic market until it can be done without adversely affecting market prices. All contractual assumptions will be made at prices that will protect against losses, but will not guarantee profits.\n\nTo fully offset the intermediate term impacts of the suspension of sales to the USSR\n\nThe Department of Agriculture has taken action to:\n\n• increase the wheat loan price to $2.50 a bushel;\n\n• increase the corn loan price to $2.10 a bushel, with comparable increases in loan prices for the other feed grains;\n\n• increase the reserve release price to $3.75 a bushel for wheat—representing 150 percent of the new loan price;\n\n• increase the reserve call price to $4.63 a bushel for wheat—representing 185 percent of the new loan price;\n\n• increase the reserve release price to $2.63 a bushel for corn—representing 125 percent of the new loan price;\n\n• increase the reserve call price to $3.05 a bushel for corn—representing 145 percent of the new loan;\n\n• make comparable increases in reserve release and call prices for the other feed grains;\n\n• waive first-year interest costs for the next 13 million tons of corn (corn only) entering the reserve;\n\n• increase reserve storage payments from 25 to 26 1/2 cents a bushel for all reserve commodities except oats, which is increased from 19 to 20 cents a bushel.\n\nTo facilitate long-term supply and demand adjustments\n\nThe Department of Agriculture is now evaluating:\n\n• increased commercial grain exports, and increased food donations under P.L. 480 where appropriate;\n\n• increased production of fuel alcohols from grain and other agricultural commodities;\n\n• acreage diversion programs.\n\nThese steps are intended to offset the reduction in farm income and, assuming a suspension through 1980, will limit the reduction in value of agricultural exports to approximately $2.0 to $2.25 billion (instead of $3 billion). It is anticipated that these actions will result in increased budgetary costs of $2.5 to $3.0 billion during FY 1980 and 1981. Most of the increase in budget outlays will be associated with removal of wheat and corn from the market and, therefore, the budget impact will be lessened when these commodities move back into the market and loans are repaid or sales proceeds are obtained.\n\nENFORCEMENT\n\nNo unusual problem is anticipated in enforcing the control on United States direct sales of agricultural products. With respect to reexports from third countries to the USSR, the fungible nature of the commodities makes it somewhat difficult to control their ultimate destination. The Department of Commerce and other agencies will watch this situation closely and will take enforcement action in case of violations.\n\nFOREIGN POLICY CONSEQUENCES OF NOT IMPOSING CONTROLS\n\nIf this and other measures which have immediate and practical effect had not been imposed, United States reactions to Soviet aggression would have been limited largely to words. Vigorous and far-reaching action was required to confirm to the Soviets that they cannot with impunity engage in acts of aggression that threaten the foreign policy and national security interests of the United States.","EO17":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Federal Property and Administrative Services Act, 40 U.S.C. 101 et seq., and in order to take further steps to promote economy and efficiency in Federal Government procurement, it is hereby ordered as follows:\n\nSection 1. Policy. This order is designed to promote economy and efficiency in Federal Government procurement. It is the policy of the executive branch to enforce vigorously the civil rights laws of the United States, including those laws that prohibit discriminatory practices with respect to compensation. Federal contractors that employ such practices are subject to enforcement action, increasing the risk of disruption, delay, and increased expense in Federal contracting. Compensation discrimination also can lead to labor disputes that are burdensome and costly.\n\nWhen employees are prohibited from inquiring about, disclosing, or discussing their compensation with fellow workers, compensation discrimination is much more difficult to discover and remediate, and more likely to persist. Such prohibitions (either express or tacit) also restrict the amount of information available to participants in the Federal contracting labor pool, which tends to diminish market efficiency and decrease the likelihood that the most qualified and productive workers are hired at the market efficient price. Ensuring that employees of Federal contractors may discuss their compensation without fear of adverse action will enhance the ability of Federal contractors and their employees to detect and remediate unlawful discriminatory practices, which will contribute to a more efficient market in Federal contracting.\n\nSec. 2. Amending Executive Order 11246. Section 202 of Executive Order 11246 of September 24, 1965, as amended, is hereby further amended as follows:\n\n(a) Paragraphs (3) through (7) are redesignated as paragraphs (4) through (8).\n\n(b) A new paragraph (3) is added to read as follows:\n\n\"The contractor will not discharge or in any other manner discriminate against any employee or applicant for employment because such employee or applicant has inquired about, discussed, or disclosed the compensation of the employee or applicant or another employee or applicant. This provision shall not apply to instances in which an employee who has access to the compensation information of other employees or applicants as a part of such employee''s essential job functions discloses the compensation of such other employees or applicants to individuals who do not otherwise have access to such information, unless such disclosure is in response to a formal complaint or charge, in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or is consistent with the contractor''s legal duty to furnish information.\"\n\nSec. 3. Regulations. Within 160 days of the date of this order, the Secretary of Labor shall propose regulations to implement the requirements of this order.\n\nSec. 4. Severability. If any provision of this order, or the application of such provision or amendment to any person or circumstance, is held to be invalid, the remainder of this order and the application of the provisions of such to any person or circumstances shall not be affected thereby.\n\nSec. 5. General Provisions. (a) Nothing in this order shall be construed to limit the rights of an employee or applicant for employment provided under any provision of law. It also shall not be construed to prevent a Federal contractor covered by this order from pursuing a defense, as long as the defense is not based on a rule, policy, practice, agreement, or other instrument that prohibits employees or applicants from discussing or disclosing their compensation or the compensation of other employees or applicants, subject to paragraph (3) of section 202 of Executive Order 11246, as added by this order.\n\n(b) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to a department, agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(c) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(d) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nSec. 6. Effective Date. This order shall become effective immediately, and shall apply to contracts entered into on or after the effective date of rules promulgated by the Department of Labor under section 3 of this order.\n\nBARACK OBAMA\n\nThe White House,\n\nApril 8, 2014.","P49":"By the President of the United States of America A Proclamation\n\nIn the heart of California's Central Coast, the former Fort Ord encompasses a sweeping landscape of vivid beauty and rich natural diversity. One of the few remaining expanses of large, contiguous open space in the increasingly developed Monterey Bay area, this area is a rolling landscape long treasured for recreation, scientific research, outdoor education, and historical significance. Originating in the Pleistocene Epoch, ancient dunes provide the foundation for this landscape's unique array of plant and wildlife communities. The area is also notable for its historical significance, including its role in the Spanish settlement of California and in the military training of generations of American soldiers.\n\nNearly two and a half centuries ago, as Americans fought for independence far to the east, these lands were traversed by a group of settlers led by Spanish Lieutenant Colonel Juan Bautista de Anza. In 1775-1776, Anza established the first overland route from \"New Spain,\" as Mexico was then known, to San Francisco, opening the way for expanded Spanish settlement of California. The diaries kept on this nearly 2,000-mile journey were used to identify the Juan Bautista de Anza National Historic Trail, approximately 6 miles of which pass through the Fort Ord area. Although much of the historic route currently passes through urban areas, the undeveloped expanse of the Fort Ord area is likely quite similar to the open landscape experienced by Anza and by the Costanoan (now commonly referred to as Ohlone) peoples who lived in what is now the Central Coast region of California.\n\nThe area's open, contiguous landscape owes its undeveloped state in large part to its role as a U.S. Army facility. From World War I through the early 1990s, the area's rugged terrain served as a military training ground and introduced as many as a million and a half American soldiers to the rigors of military service. From its origins in 1917 as a training ground for troops stationed at the nearby Presidio of Monterey, Fort Ord had grown into a major Army installation by the beginning of World War II. During the Vietnam War, it served as a leading training center and deployment staging ground. While the former Fort Ord has few remaining historic structures, today thousands of veterans carry the memory of its dramatic landscape as their first taste of Army life, as a final stop before deploying to war, or as a home base during their military career. These lands are an historical link to the heroism and dedication of the men and women who served our Nation and fought in the major conflicts of the 20th century.\n\nToday, this expansive, historic landscape provides opportunities for solitude and adventure to nearly 100,000 visitors each year. By bicycle, horse, and foot visitors can explore the Fort Ord area's scenic and natural resources along trails that wind over lush grasslands, between gnarled oaks, and through scrub-lined canyons. Within the boundaries of the Fort Ord area, visitors admire the landscape and scenery and are exposed to wildlife and a diverse group of rare and endemic plants and animals. Because visitors travel from areas near and far, these lands support a growing travel and tourism sector that is a source of economic opportunity for the community, especially businesses in the region. They also help to attract new residents, retirees, and businesses that will further diversify the local economy.\n\nScientists are also drawn here, seeking out opportunities to better understand once-widespread species and vegetative communities, and their ongoing restoration. The Fort Ord area is significant because of its rich biodiversity and important Central Coast habitats, supporting a diverse group of rare and endemic species of plants and animals that are managed across the base through a multi-agency, community-led management plan. It is one of the few remaining places in the world where large expanses of coastal scrub and live oak woodland and savanna habitat, mixed with rare vernal pools, exist in a contiguous, interconnected landscape.\n\nThe protection of the Fort Ord area will maintain its historical and cultural significance, attract tourists and recreationalists from near and far, and enhance its unique natural resources, for the enjoyment of all Americans.\n\nWHEREAS section 2 of the Act of June 8, 1906 (34 Stat. 225, 16 U.S.C. 431) (the \"Antiquities Act\"), authorizes the President, in his discretion, to declare by public proclamation historic landmarks, historic and prehistoric structures, and other objects of historic or scientific interest that are situated upon the lands owned or controlled by the Government of the United States to be national monuments, and to reserve as a part thereof parcels of land, the limits of which in all cases shall be confined to the smallest area compatible with the proper care and management of the objects to be protected;\n\nWHEREAS the 1991 Defense Base Closure and Realignment Commission recommended that Fort Ord cease to be used as an Army installation, and pursuant to the Defense Base Closure and Realignment Act of 1990 (Public Law 101-510), Fort Ord closed on September 30, 1994;\n\nWHEREAS it is in the public interest to reserve such lands as a national monument to be known as the Fort Ord National Monument;\n\nNow, Therefore, I, Barack Obama, President of the United States of America, by the authority vested in me by section 2 of the Antiquities Act, hereby proclaim that all lands and interests in lands owned or controlled by the Government of the United States within the boundaries described on the map entitled \"Fort Ord National Monument,\" which is attached to and forms a part of this proclamation, are hereby set apart and reserved as the Fort Ord National Monument (monument) for the purpose of protecting and restoring the objects identified above. The reserved Federal lands and interests in lands consist of approximately 14,651 acres, which is the smallest area compatible with the proper care and management of the objects to be protected and restored.\n\nAll Federal lands and interests in lands within the boundaries of this monument are hereby appropriated and withdrawn from all forms of entry, location, selection, sale, leasing, or other disposition under the public lands laws, including withdrawal from location, entry, and patent under the mining laws, and from disposition under all laws relating to mineral and geothermal leasing other than by exchange that furthers the protective purposes of the monument.\n\nThe establishment of this monument is subject to valid existing rights. Lands and interests in lands within the monument boundaries not owned or controlled by the United States shall be reserved as part of the monument upon acquisition of ownership or control by the United States.\n\nOf the approximately 14,651 acres of Federal lands and interests in lands reserved by this proclamation, approximately 7,205 acres are currently managed by the Secretary of the Interior through the Bureau of Land Management (BLM) and approximately 7,446 acres are currently managed by the Secretary of the Army. The Secretary of the Army, in consultation with the Secretary of the Interior, through the BLM, shall continue to manage the lands and interests in lands under the Secretary's jurisdiction within the monument boundaries until the Army transfers those lands and interests in lands to the BLM in accordance with the 1995 Memorandum of Understanding (MOU) between the Department of the Army and the BLM, as amended, that describes the responsibilities of each agency related to such lands and interests in lands, the implementing actions required of each agency, the process for transferring administrative jurisdiction over such lands and interests in lands to the Secretary of the Interior, and the processes for resolving interagency disputes. The Secretary of the Interior, through the BLM, shall manage that portion of the monument under the Secretary's administrative jurisdiction, pursuant to applicable legal authorities and the MOU, to implement the purposes of this proclamation.\n\nFor purposes of protecting and restoring the objects identified above, the Secretary of the Interior, through the BLM, shall prepare and maintain a transportation plan, in coordination with the Secretary of the Army and consistent with the MOU, that provides for visitor enjoyment and understanding of the scientific and historic objects on lands within the monument boundaries that are under the administrative jurisdiction of the Secretary of the Interior. The transportation plan shall include the designation of roads and trails for bicycling and other purposes. Except for emergency or authorized administrative purposes, under the transportation plan motorized vehicle use shall be permitted only on designated roads, and non-motorized mechanized vehicle use shall be permitted only on designated roads and trails. The plan shall be revised upon the transfer of lands now under the administrative jurisdiction of the Secretary of the Army to the Secretary of the Interior in accordance with the MOU.\n\nNothing in this proclamation shall be deemed to enlarge or diminish the rights of any Indian tribe.\n\nNothing in this proclamation shall affect the responsibility of the Department of the Army under applicable environmental laws, including the remediation of hazardous substances or munitions and explosives of concern within the monument boundaries; nor affect the Department of the Army's statutory authority to control public access or statutory responsibility to make other measures for environmental remediation, monitoring, security, safety, or emergency preparedness purposes; nor affect any Department of the Army activities on lands not included within the monument. Nothing in this proclamation shall affect the implementation of the Installation-Wide Multispecies Habitat Management Plan for the former Fort Ord including interagency agreements implementing that plan.\n\nNothing in this proclamation shall be deemed to enlarge or diminish the jurisdiction of the State of California with respect to fish and wildlife management.\n\nNothing in this proclamation shall be deemed to revoke any existing withdrawal, reservation, or appropriation; however, the monument shall be the dominant reservation.\n\nWarning is hereby given to all unauthorized persons not to appropriate, injure, destroy, or remove any feature of this monument and not to locate or settle upon any of the lands thereof.\n\nIn Witness Whereof, I have hereunto set my hand this twentieth day of April, in the year of our Lord two thousand twelve, and of the Independence of the United States of America the two hundred and thirty-sixth.\n\nBARACK OBAMA","P35":"By the President of the United States of America A Proclamation\n\n1. On February 17, 2019, the Secretary of Commerce (Secretary) transmitted to me a report on his investigation into the effects of imports of passenger vehicles (sedans, sport utility vehicles, crossover utility vehicles, minivans, and cargo vans) and light trucks (collectively, automobiles) and certain automobile parts (engines and engine parts, transmissions and powertrain parts, and electrical components) (collectively, automobile parts) on the national security of the United States under section 232 of the Trade Expansion Act of 1962, as amended (19 U.S.C. 1862) (section 232). Based on the facts considered in that investigation, the Secretary found and advised me of his opinion that automobiles and certain automobile parts are being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States.\n\n2. In Proclamation 9888 of May 17, 2019 (Adjusting Imports of Automobiles and Automobile Parts Into the United States), I concurred with the Secretary's finding in the February 17, 2019, report that automobiles and certain automobile parts are being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States. I also directed the United States Trade Representative (Trade Representative), in consultation with other executive branch officials, to pursue negotiation of agreements to address the threatened impairment of the national security of the United States with respect to imported automobiles and certain automobile parts from the European Union, Japan, and any other country the Trade Representative deems appropriate.\n\n3. The Trade Representative's negotiations did not lead to any agreements of the type contemplated by section 232.\n\n4. In Proclamation 9888, I also directed the Secretary to monitor imports of automobiles and certain automobile parts and inform me of any circumstances that, in the Secretary's opinion, might indicate the need for further action under section 232 with respect to such imports.\n\n5. The Secretary has informed me that, since the February 17, 2019, report, the national security concerns remain and have escalated. The COVID-19 pandemic exposed critical vulnerabilities and choke points in global supply chains, undermining our ability to maintain a resilient domestic industrial base. In recent years, American-owned automotive manufacturers have experienced numerous supply chain challenges, including material and parts input shortages, labor shortages and strikes, and electrical-component shortages. Meanwhile, foreign automotive industries, propelled by unfair subsidies and aggressive industrial policies, have grown substantially. Today, only about half of the vehicles sold in the United States are manufactured domestically, a decline that jeopardizes our domestic industrial base and national security, and the United States' share of worldwide automobile production has remained stagnant since the February 17, 2019, report. The number of employees in the domestic automotive industry has also not improved since the February 17, 2019, report.\n\n6. I am also advised that agreements entered into before the issuance of Proclamation 9888, such as the revisions to the United States-Korea Free Trade Agreement and the United States-Mexico-Canada Agreement (USMCA), have not yielded sufficient positive outcomes. The threat to national security posed by imports of automobiles and certain automobile parts remains and has increased. Investments resulting from other efforts, such as legislation, have also not yielded sufficient positive outcomes to eliminate the threat to national security from such imports.\n\n7. After considering the current information newly provided by the Secretary, among other things, I find that imports of automobiles and certain automobile parts continue to threaten to impair the national security of the United States and deem it necessary and appropriate to impose tariffs, as defined below, to adjust imports of automobiles and certain automobile parts so that such imports will not threaten to impair national security.\n\n8. To ensure that the imposition of tariffs on automobiles and certain automobile parts in this proclamation are not circumvented and that the purpose of this action to eliminate the threat to the national security of the United States by imports of automobiles and certain automobile parts is not undermined, I also deem it necessary and appropriate to establish processes to identify and impose tariffs on additional automobile parts, as further described below.\n\n9. Section 232 provides that, in this situation, the President shall take such other actions as the President deems necessary to adjust the imports of the relevant article so that such imports will not threaten to impair national security.\n\n10. Section 604 of the Trade Act of 1974, as amended (19 U.S.C. 2483), authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTSUS) the substance of statutes affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code; section 604 of the Trade Act of 1974, as amended; and section 232 of the Trade Expansion Act of 1962, as amended, do hereby proclaim as follows:\n\n(1) Except as otherwise provided in this proclamation, all imports of articles specified in Annex I to this proclamation or in any subsequent annex to this proclamation, as set out in a subsequent notice in the Federal Register, shall be subject to a 25 percent tariff with respect to goods entered for consumption or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on April 3, 2025, for automobiles, and on the date specified in the Federal Register for automobile parts, but no later than May 3, 2025, and shall continue in effect, unless such actions are expressly reduced, modified, or terminated. The above ad valorem tariff is in addition to any other duties, fees, exactions, and charges applicable to such imported automobiles and certain automobile parts articles.\n\n(2) For automobiles that qualify for preferential tariff treatment under the USMCA, importers of such automobiles may submit documentation to the Secretary identifying the amount of U.S. content in each model imported into the United States. \"U.S. content\" refers to the value of the automobile attributable to parts wholly obtained, produced entirely, or substantially transformed in the United States. Thereafter, the Secretary may approve imports of such automobiles to be eligible to apply the ad valorem tariff of 25 percent in clause (1) of this proclamation exclusively to the value of the non-U.S. content of the automobile. The non-U.S. content of the automobile shall be calculated by subtracting the value of the U.S. content in an automobile from the total value of the automobile.\n\n(3) If U.S. Customs and Border Protection (CBP) determines that the declared value of non-U.S. content of an automobile, as described in clause (2) of this proclamation, is inaccurate due to an overstatement of U.S. content, the 25 percent tariff shall apply to the full value of the automobile, regardless of the actual U.S. content of the automobile. In addition, the 25 percent tariff shall be applied retroactively (from April 3, 2025, to the date of the inaccurate overstatement) and prospectively (from the date of the inaccurate overstatement to the date the importer corrects the overstatement, as verified by CBP) to the full value of all automobiles of the same model imported by the same importer. This clause does not apply to or otherwise affect any other applicable fees or penalties.\n\n(4) The ad valorem tariff of 25 percent described in clause (1) of this proclamation shall not apply to automobile parts that qualify for preferential treatment under the USMCA until such time that the Secretary, in consultation with CBP, establishes a process to apply the tariff exclusively to the value of the non-U.S. content of such automobile parts and publishes notice in the Federal Register.\n\n(5) For avoidance of doubt, clause (4) of this proclamation does not apply to automobile knock-down kits or parts compilations. Clause (4) of this proclamation applies only to individual automobile parts as defined by Annex I to this proclamation that otherwise meet the requirements of clause (4) of this proclamation.\n\n(6) The Secretary, in consultation with the United States International Trade Commission and CBP, shall determine the modifications necessary to the HTSUS to effectuate this proclamation and shall make such modifications to the HTSUS through notice in the Federal Register.\n\n(7) Within 90 days of the date of this proclamation, the Secretary shall establish a process for including additional automobile parts articles within the scope of the tariffs described in clause (1) of this proclamation. In addition to inclusions made by the Secretary, this process shall provide for including additional automobile parts articles at the request of a domestic producer of an automobile or automobile parts article, or an industry association representing one or more such producers, where the request establishes that imports of additional automobile parts articles have increased in a manner that threatens to impair the national security or otherwise undermines the objectives set forth in any proclamation issued on the basis of the Secretary's February 17, 2019, report or any additional information submitted to the President under clause (3) of Proclamation 9888 or clause (9) of this proclamation. When the Secretary receives such a request from a domestic producer or industry association, the Secretary, after consultation with the United States International Trade Commission and CBP, shall issue a determination regarding whether to include the articles within 60 days of receiving the request. Any additional automobile parts articles that the Secretary has determined to be included within the scope of the tariffs described in clause (1) of this proclamation shall be so included on or after 12:01 a.m. eastern daylight time the day after a notice in the Federal Register describing the determination of the Secretary. The notice in the Federal Register shall be made as soon as practicable but no later than 14 days after the Secretary's determination.\n\n(8) Any automobile or automobile part, except those eligible for admission under \"domestic status\" as defined in 19 CFR 146.43, that is subject to the duty imposed by this proclamation and that is admitted into a United States foreign trade zone on or after the effective date of this proclamation, in accordance with clause (1) of this proclamation, must be admitted as \"privileged foreign status\" as defined in 19 CFR 146.41, and will be subject upon entry for consumption to any ad valorem rates of duty related to the classification under the applicable HTSUS subheading.\n\n(9) The Secretary shall continue to monitor imports of automobiles and automobile parts. The Secretary also shall, from time to time, in consultation with any senior executive branch officials the Secretary deems appropriate, review the status of such imports with respect to national security. The Secretary shall inform the President of any circumstances that, in the Secretary's opinion, might indicate the need for further action by the President under section 232. The Secretary shall also inform the President of any circumstance that, in the Secretary's opinion, might indicate that the increase in duty rate provided for in this proclamation is no longer necessary.\n\n(10) No drawback shall be available with respect to the duties imposed pursuant to this proclamation.\n\n(11) The Secretary may issue regulations and guidance consistent with this proclamation, including to address operational necessity.\n\n(12) CBP may take any necessary or appropriate measures to administer the tariffs imposed by this proclamation.\n\n(13) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-sixth day of March, in the year of our Lord two thousand twenty-five, and of the Independence of the United States of America the two hundred and forty-ninth.\n\nDONALD J. TRUMP","P20":"By the President of the United States of America A Proclamation\n\nOver the last 4 years, the United States has endured a full-scale invasion of aliens entering and remaining in the country illegally, causing a relentless onslaught of crime, vagrancy, violence, and death in countless American communities. This lawless invasion has also limited the capacity of American schools and hospitals to provide for American citizens and has diverted billions of dollars in Federal, State, and local social services from Americans in need.\n\nThe continued presence of illegal aliens in our Nation forces American taxpayers to bear a tremendous fiscal burden to support them, including through costs related to healthcare, food stamps, public housing, emergency medical services, education, and shelter, as well as the costs of crimes committed by illegal aliens. In Fiscal Year 2023 alone, these costs were estimated to exceed $150 billion in taxpayer dollars. Removal flights of illegal aliens are a necessary aspect of immigration enforcement and upholding the rule of law, but they require substantial resources and manpower.\n\nTherefore, the provision of financial incentives to encourage and assist aliens illegally in the country to elect to depart from the United States has the potential to save tremendous taxpayer resources, while restoring the sovereignty of our country.\n\nAs President, it is my legal obligation to exercise all tools at my disposal to end this invasion, remove the illegal-alien invaders from the United States, and protect the American people. This proclamation establishes Project Homecoming, which will present illegal aliens with a choice: either leave the United States voluntarily, with the support and financial assistance of the Federal Government, or remain and face the consequences.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including the Immigration and Nationality Act (INA) (8 U.S.C. 1101 et seq), hereby proclaim and direct as follows:\n\nSection 1. Free Return Home and CBP Home Application. (a) In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, I direct, pursuant to section 215(a)(1) of the INA (8 U.S.C. 1185(a)(1)), the Secretary of State and the Secretary of Homeland Security, in consultation with the heads of other relevant executive departments and agencies (agencies), to create seamless processes for illegal aliens to rapidly depart the United States, including through available technological resources, such as the \"CBP Home\" application.\n\n(b) Any flights provided to illegal aliens voluntarily and permanently departing the United States pursuant to processes established under subsection (a) of this section shall be funded by the Federal Government.\n\n(c) In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, I direct, pursuant to section 215(a)(1) of the INA (8 U.S.C. 1185(a)(1)), the Secretary of State and the Secretary of Homeland Security to take all appropriate actions to enable the rapid departure of illegal aliens from the United States who currently lack a valid travel document from their countries of citizenship or nationality or who desire to travel to any other country willing to accept their entry.\n\n(d) The Secretary of State and the Secretary of Homeland Security shall create a concierge service whereby any alien illegally present in the United States may arrive at an airport, with or without appropriate travel documents, book air travel to permanently relocate to a different country, and claim the exit bonus described in section 2 of this proclamation upon their successful return.\n\nSec. 2. Exit Bonus. In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, the Secretary of State and the Secretary of Homeland Security, in consultation with the heads of all relevant agencies, shall provide financial incentives in the form of an \"exit bonus\" for each illegal alien who voluntarily and permanently departs the United States.\n\nSec. 3. Penalties for Aliens Who Fail to Depart. (a) The Secretary of State and the Secretary of Homeland Security, in consultation with the heads of other relevant agencies, shall conduct a nationwide communications campaign to notify illegal aliens of the availability of cost-free travel to other countries; the exit bonus; and the sweeping consequences for those who choose to remain illegally present, including removal, prosecution, incarceration, and fines as consistent with applicable law for immigration-related crimes; the garnishment of wages; and the confiscation of savings and personal property, including homes and vehicles.\n\n(b) No later than 60 days after the date of this proclamation, the Secretary of Homeland Security shall supplement existing enforcement and removal operations by deputizing and contracting with State and local law enforcement officers, former Federal officers, officers and personnel within other Federal agencies, and other individuals to increase the enforcement and removal operations force of the Department of Homeland Security by no less than 20,000 officers in order to conduct an intensive campaign to remove illegal aliens who have failed to depart voluntarily.\n\nIn Witness Whereof, I have hereunto set my hand this ninth day of May, in the year of our Lord two thousand twenty-five, and of the Independence of the United States of America the two hundred and forty-ninth.\n\nDONALD J. TRUMP","EO6":"WHEREAS Executive Order No. 589 of March 14, 1907, recited in part that passports issued by the Government of Japan to Japanese or Korean citizens who were skilled or unskilled laborers to go to Mexico, Canada, or Hawaii were being used for the purpose of enabling the holders thereof to come to the continental territory of the United States to the detriment of labor conditions therein, and ordered that such citizens of Japan or Korea be refused permission to enter the continental territory of the United States; and\n\nWHEREAS Executive Order No. 1712 of February 24, 1913, recited that passports issued by certain foreign governments to their citizens or subjects, skilled or unskilled laborers, to go to countries or places other than the continental territory of the United States were being used for the purpose of enabling the holders thereof to come to the continental territory of the United States; and\n\nWHEREAS the continued restraint imposed by the said Executive orders upon the freedom of Japanese or Korean citizens or subjects who entered the Territory of Hawaii under the passports referred to above to come to the continental United States has resulted in considerable personal hardship to such persons; and\n\nWHEREAS the number of Japanese or Korean citizens or subjects thus prohibited from entering the continental United States from the Territory of Hawaii is so small, and the age of such persons is so advanced, that their entry into the continental United States would no longer be a detriment to labor conditions therein:\n\nNOW, THEREFORE, by virtue of the authority vested in me by section 3 of the Immigration Act of 1917 (39 Stat. 875; 8 U.S.C. 136), I hereby revoke the said Executive Orders No. 589 of March 14, 1907, and No. 1712 of February 24, 1913, to the extent that they are applicable to Japanese or Korean citizens or subjects who entered the Territory of Hawaii under the aforesaid passports and who are now precluded from legally entering or remaining in the continental territory of the United States by reason of such Executive orders.\n\nThe Commissioner of Immigration and Naturalization is hereby authorized and directed, with the approval of the Attorney General, to take such action and to issue such rules and regulations as may be necessary for carrying out the provisions of this order.\n\nHARRY S. TRUMAN\n\nTHE WHITE HOUSE,\n\nOctober 18, 1948","L7":"Dear Acting Secretary Wolf, Secretary Mnuchin, Secretary Azar, and Administrator Gaynor:\n\nI have determined that the ongoing Coronavirus Disease 2019 (COVID–19) pandemic is of sufficient severity and magnitude to warrant an emergency determination under section 501(b) of the Robert T. Stafford Disaster Relief and Emergency Assistance Act, 42 U.S.C. 5121–5207 (the \"Stafford Act\").\n\nMy decision to make this determination pursuant to section 501(b) of the Stafford Act is based on the fact that our entire country is now facing a significant public health emergency. The World Health Organization has officially declared that we are in the midst of a global pandemic. As of the date of this declaration, 32 states, 3 territories, 4 tribes, and 1 tribal nation, spread geographically across our country, have declared a state of emergency as a result of the virus.\n\nOnly the Federal Government can provide the necessary coordination to address a pandemic of this national size and scope caused by a pathogen introduced into our country. It is the preeminent responsibility of the Federal Government to take action to stem a nationwide pandemic that has its origins abroad, which implicates its authority to regulate matters related to interstate matters and foreign commerce and to conduct the foreign relations of the United States. For example, the Federal Government, through the Department of Health and Human Services (HHS) and its component, the Centers for Disease Control and Prevention (CDC), has authority to take the necessary steps \"to prevent the introduction, transmission, or spread of communicable diseases from foreign countries into the States or possessions, or from one State or possession into any other State or possession,\" 42 U.S.C. § 264(a), in close coordination with State, local, and tribal officials. In addition, the Federal Government has responsibility for securing our borders and overseeing entry of foreign nationals into our country in the interest of the United States.\n\nThis pandemic has the potential to cause severe consequences for our country's national and economic security. Based on the advice of public health officials, I have already taken stringent measures to restrict travel to the United States of foreign nationals who have been recently physically present in certain countries that pose a threat of intensifying the spread of COVID–19 within our country. And HHS and CDC have taken effective action to address the public health threat posed by COVID–19. While these actions have been in the best interest of the health of our people, COVID–19 has the potential to impose a temporary financial hardship on all Americans. It is therefore critical that we deploy all powers and authorities available to the Federal Government to provide needed relief.\n\nTherefore, as an initial step, I hereby determine, under section 501(b) of the Stafford Act, that an emergency exists nationwide.\n\nIn accordance with this determination, the Federal Emergency Management Agency may provide, as appropriate, assistance pursuant to section 502 and 503 of the Stafford Act for emergency protective measures not authorized under other Federal statutes. Administrator Gaynor shall coordinate and direct other Federal agencies in providing needed assistance under the Stafford Act, subject to the Department of Health and Human Services' role as the lead Federal agency for the Federal Government's response to COVID–19.\n\nIn order to meet the challenges caused by this emergency pandemic, I have encouraged all State and local governments to activate their Emergency Operations Centers and to review their emergency preparedness plans. In the meantime, I expect FEMA to continue to review all ways in which it can provide assistance to States consistent with the authorities provided to it by this letter and by statute.\n\nI am also instructing Secretary Mnuchin to provide relief from tax deadlines to Americans who have been adversely affected by the COVID–19 emergency, as appropriate, pursuant to 26 U.S.C. 7508A(a).\n\nIn addition, after careful consideration, I believe that the disaster is of such severity and magnitude nationwide that requests for a declaration of a major disaster as set forth in section 401(a) of the Stafford Act may be appropriate.\n\nI encourage all governors and tribal leaders to consider requesting Federal assistance under this provision of the Stafford Act, pursuant to the statutory criteria. I stand ready to expeditiously consider any such request.\n\nSincerely,\n\nDONALD J. TRUMP\n\nThe White House, March 13, 2020.","M7":"National Security Presidential Memorandum/NSPM-11\n\nMemorandum for the Secretary of State, the Secretary of the Treasury, the Secretary of Defense, the Attorney General, the Secretary of Energy, the Secretary of Homeland Security, the Assistant to the President and Chief of Staff, the United States Trade Representative, the United States Permanent Representative to the United Nations, the Director of National Intelligence, the Director of the Central Intelligence Agency, the Assistant to the President for National Security Affairs, the Counsel to the President, the Assistant to the President for Economic Policy, the Chairman of the Joint Chiefs of Staff, and the Director of the Federal Bureau of Investigation\n\nSubject: Ceasing United States Participation in the Joint Comprehensive Plan of Action and Taking Additional Action to Counter Iran's Malign Influence and Deny Iran All Paths to a Nuclear Weapon\n\nAs President, my highest priority is to ensure the safety and security of the United States and the American people. Since its inception in 1979 as a revolutionary theocracy, the Islamic Republic of Iran has declared its hostility to the United States and its allies and partners. Iran remains the world's leading state sponsor of terrorism, and provides assistance to Hezbollah, Hamas, the Taliban, al-Qa'ida, and other terrorist networks. Iran also continues to fuel sectarian violence in Iraq, and support vicious civil wars in Yemen and Syria. It commits grievous human rights abuses, and arbitrarily detains foreigners, including United States citizens, on spurious charges without due process of law.\n\nThere is no doubt that Iran previously attempted to bolster its revolutionary aims through the pursuit of nuclear weapons and that Iran's uranium enrichment program continues to give it the capability to reconstitute its weapons-grade uranium program if it so chooses. As President, I have approved an integrated strategy for Iran that includes the strategic objective of denying Iran all paths to a nuclear weapon.\n\nThe preceding administration attempted to meet the threat of Iran's pursuit of nuclear capabilities through United States participation in the Joint Comprehensive Plan of Action (JCPOA) on Iran's nuclear program. The JCPOA lifted nuclear-related sanctions on Iran and provided it with other significant benefits in exchange for its temporary commitments to constrain its uranium enrichment program and to not conduct work related to nuclear fuel reprocessing, the two critical pathways to acquiring weapons-grade nuclear material. Some believed the JCPOA would moderate Iran's behavior. Since the JCPOA's inception, however, Iran has only escalated its destabilizing activities in the surrounding region. Iranian or Iran-backed forces have gone on the march in Syria, Iraq, and Yemen, and continue to control parts of Lebanon and Gaza. Meanwhile, Iran has publicly declared it would deny the International Atomic Energy Agency (IAEA) access to military sites in direct conflict with the Additional Protocol to its Comprehensive Safeguards Agreement with the IAEA. In 2016, Iran also twice violated the JCPOA's heavy water stockpile limits. This behavior is unacceptable, especially for a regime known to have pursued nuclear weapons in violation of its obligations under the Treaty on the Non-Proliferation of Nuclear Weapons.\n\nIran's behavior threatens the national interest of the United States. On October 13, 2017, consistent with certification procedures stipulated in the Iran Nuclear Agreement Review Act, I determined that I was unable to certify that the suspension of sanctions related to Iran pursuant to the JCPOA was appropriate and proportionate to the specific and verifiable measures taken by Iran with respect to terminating its illicit nuclear program. On January 12, 2018, I outlined two possible paths forward—the JCPOA's disastrous flaws would be fixed by May 12, 2018, or, failing that, the United States would cease participation in the agreement. I made clear that this was a last chance, and that absent an understanding to fix the JCPOA, the United States would not continue to implement it.\n\nThat understanding has not materialized, and I am today making good on my pledge to end the participation of the United States in the JCPOA. I do not believe that continuing to provide JCPOA-related sanctions relief to Iran is in the national interest of the United States, and I will not affirm what I know to be false. Further, I have determined that it is in the national interest of the United States to re-impose sanctions lifted or waived in connection with the JCPOA as expeditiously as possible.\n\nSection 1. Policy. It is the policy of the United States that Iran be denied a nuclear weapon and intercontinental ballistic missiles; that Iran's network and campaign of regional aggression be neutralized; to disrupt, degrade, or deny the Islamic Revolutionary Guards Corps and its surrogates access to the resources that sustain their destabilizing activities; and to counter Iran's aggressive development of missiles and other asymmetric and conventional weapons capabilities. The United States will continue to pursue these aims and the objectives contained in the Iran strategy that I announced on October 13, 2017, adjusting the ways and means to achieve them as required.\n\nSec. 2. Ending United States Participation in the JCPOA. The Secretary of State shall, in consultation with the Secretary of the Treasury and the Secretary of Energy, take all appropriate steps to cease the participation of the United States in the JCPOA.\n\nSec. 3. Restoring United States Sanctions. The Secretary of State and the Secretary of the Treasury shall immediately begin taking steps to re-impose all United States sanctions lifted or waived in connection with the JCPOA, including those under the National Defense Authorization Act for Fiscal Year 2012, the Iran Sanctions Act of 1996, the Iran Threat Reduction and Syria Human Rights Act of 2012, and the Iran Freedom and Counter-proliferation Act of 2012. These steps shall be accomplished as expeditiously as possible, and in no case later than 180 days from the date of this memorandum. The Secretary of State and the Secretary of the Treasury shall coordinate, as appropriate, on steps needed to achieve this aim. They shall, for example, coordinate with respect to preparing any recommended executive actions, including appropriate documents to re-impose sanctions lifted by Executive Order 13716 of January 16, 2016; preparing to re-list persons removed, in connection with the JCPOA, from any relevant sanctions lists, as appropriate; revising relevant sanctions regulations; issuing limited waivers during the wind-down period, as appropriate; and preparing guidance necessary to educate United States and non-United States business communities on the scope of prohibited and sanctionable activity and the need to unwind any such dealings with Iranian persons. Those steps should be accomplished in a manner that, to the extent reasonably practicable, shifts the financial burden of unwinding any transaction or course of dealing primarily onto Iran or the Iranian counterparty. Sec. 4. Preparing for Regional Contingencies. The Secretary of Defense and heads of any other relevant agencies shall prepare to meet, swiftly and decisively, all possible modes of Iranian aggression against the United States, our allies, and our partners. The Department of Defense shall ensure that the United States develops and retains the means to stop Iran from developing or acquiring a nuclear weapon and related delivery systems.\n\nSec. 5. Monitoring Iran's Nuclear Conduct and Consultation with Allies and Partners. Agencies shall take appropriate steps to enable the United States to continue to monitor Iran's nuclear conduct. I am open to consultations with allies and partners on future international agreements to counter the full range of Iran's threats, including the nuclear weapon and intercontinental ballistic missile threats, and the heads of agencies shall advise me, as appropriate, regarding opportunities for such consultations.\n\nSec. 6. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This memorandum shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP","EO22":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the laws cited herein, it is hereby ordered as follows:\n\nSection 1. Statutory Pay Systems. The rates of basic pay or salaries of the statutory pay systems (as defined in 5 U.S.C. 5302(1)), as adjusted under 5 U.S.C. 5303(a), are set forth on the schedules attached hereto and made a part hereof:\n\n(a) The General Schedule (5 U.S.C. 5332(a)) at Schedule 1;\n\n(b) The Foreign Service Schedule (22 U.S.C. 3963) at Schedule 2; and\n\n(c) The schedules for the Veterans Health Administration of the Department of Veterans Affairs (38 U.S.C. 7306, 7404; section 301(a) of Public Law 102-40) at Schedule 3.\n\nSec. 2. Senior Executive Service. The ranges of rates of basic pay for senior executives in the Senior Executive Service, as established pursuant to 5 U.S.C. 5382, are set forth on Schedule 4 attached hereto and made a part hereof.\n\nSec. 3. Certain Executive, Legislative and Judicial Salaries. The rates of basic pay or salaries for the following offices and positions are set forth on the schedules attached hereto and made a part hereof:\n\n(a) The Executive Schedule (5 U.S.C. 5312-5318) at Schedule 5;\n\n(b) The Vice President (3 U.S.C. 104) and the Congress (2 U.S.C. 31) at Schedule 6; and\n\n(c) Justices and judges (28 U.S.C. 5, 44(d), 135, 252, and 461(a), section 140 of Public Law 97-92, and section 305 of Division D of the Consolidated Appropriations Act, 2008), at Schedule 7.\n\nSec. 4. Uniformed Services. The rates of monthly basic pay (37 U.S.C. 203(a)) for members of the uniformed services, as adjusted under 37 U.S.C. 1009, and the rate of monthly cadet or midshipman pay (37 U.S.C. 203(c)) are set forth on Schedule 8 attached hereto and made a part hereof.\n\nSec. 5. Locality-Based Comparability Payments.\n\n(a) Pursuant to section 5304 of title 5, United States Code, and section 740 of Division D of the Consolidated Appropriations Act, 2008, locality-based comparability payments shall be paid in accordance with Schedule 9 attached hereto and made a part hereof.\n\n(b) The Director of the Office of Personnel Management shall take such actions as may be necessary to implement these payments and to publish appropriate notice of such payments in the Federal Register.\n\nSec. 6. Administrative Law Judges. The rates of basic pay for administrative law judges, as adjusted under 5 U.S.C. 5372(b)(4), are set forth on Schedule 10 attached hereto and made a part hereof.\n\nSec. 7. Effective Dates. Schedule 8 is effective on January 1, 2008. The other schedules contained herein are effective on the first day of the first applicable pay period beginning on or after January 1, 2008.
