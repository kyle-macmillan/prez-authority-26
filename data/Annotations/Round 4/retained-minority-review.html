dule production capacity, production, and market share. Proclamation 10101 also:\n\n(a) revoked the exclusion of bifacial modules from application of the safeguard measure on the basis that it had impaired and was likely to continue to impair the effectiveness of the safeguard action; and\n\n(b) adjusted the safeguard tariff for the fourth year of the safeguard measure from 15 percent to 18 percent on the basis that the exclusion of bifacial modules from application of the safeguard tariff had impaired the remedial effectiveness of the 4-year action proclaimed in Proclamation 9693, and to achieve the full remedial effect envisaged in that action.\n\n3. On November 16, 2021, the United States Court of International Trade (CIT) held in Solar Energy Industries Association et al. v. United States that the President acted outside of his statutory authority in issuing Proclamation 10101, and enjoined the Government from enforcing that proclamation. However, in November 2023, a panel of the United States Court of Appeals for the Federal Circuit reversed the CIT's decision.\n\n4. After receiving the USITC's December 8, 2021, determination and report pursuant to section 204(c) of the Trade Act (19 U.S.C. 2254(c)), which found that the safeguard action continues to be necessary to prevent or remedy the serious injury to the domestic industry and that there was evidence that the domestic industry was making a positive adjustment to import competition (USITC, Crystalline Silicon Photovoltaic Cells, Whether or Not Partially or Fully Assembled Into Other Products, Investigation No. TA-201-75 (Extension)), and after taking into account the information provided in the USITC's report and the information received from the public through the process published in the Federal Register on September 30, 2021 (86 FR 54279), pursuant to section 203(e)(1)(B) of the Trade Act (19 U.S.C. 2253(e)(1)(B)), I issued Proclamation 10339 on February 4, 2022. In Proclamation 10339, I determined that the safeguard action on imports of CSPV cells, whether or not partially or fully assembled into other products, continued to be necessary to prevent or remedy the serious injury to the domestic industry, and that there was evidence that the domestic industry was making a positive adjustment to import competition. I further determined to extend the safeguard measure proclaimed in Proclamation 9693, as modified by Proclamation 10101, in relevant part, as follows:\n\n(a) continuation of the TRQ on imports of solar cells not partially or fully assembled into other products imposed by Proclamation 9693, as described in paragraph 1 of Proclamation 10339 and paragraph 1 of this proclamation, for an additional period of 4 years, with unchanging within-quota quantities of 5.0 gigawatts (GW) for each year and annual reductions in the rates of duty applicable to goods entered in excess of those quantities of cells in the fifth, sixth, seventh, and eighth years, as described in Annex I to Proclamation 10339; and\n\n(b) continuation of the safeguard tariff on imports of modules imposed by Proclamation 9693, as described in paragraph 1 of Proclamation 10339 and paragraph 1 of this proclamation, for an additional period of 4 years, with annual reductions in the fifth, sixth, seventh, and eighth years, as described in Annex I to Proclamation 10339.\n\n5. If an extension of an action taken under section 203 of the Trade Act (19 U.S.C. 2253) exceeds 3 years, section 204(a)(2) of the Trade Act (19 U.S.C. 2254(a)(2)) requires the USITC to issue a report to the President and the Congress on its monitoring of developments with respect to the domestic industry, including the progress and specific efforts made by workers and firms in the domestic industry to make a positive adjustment to import competition, no later than the midpoint of the period of the extension.\n\n6. On February 6, 2024, the USITC issued its midterm report pursuant to section 204(a)(2) of the Trade Act (19 U.S.C. 2254(a)(2)) on its monitoring of developments within the industry producing CSPV products since the President's extension of the safeguard measure (USITC, Crystalline Silicon Photovoltaic Cells, Whether or Not Partially or Fully Assembled Into Other Products: Monitoring Developments in the Domestic Industry, No. TA-201-075 (Second Monitoring)). In its report, the USITC found that the safeguard measure has resulted in positive adjustments from the domestic industry in light of increased actual and planned module production; various announcements of planned domestic cell production; and improvements in several of the domestic industry's financial, trade, and employment indicators.\n\n7. On September 19, 2023, a majority of the representatives of the domestic industry submitted a petition under section 204(b) of the Trade Act (19 U.S.C. 2254(b)(1)(B)) to modify the safeguard measure by eliminating the TRQ and providing for tariff-free treatment of all imports of CSPV cells, or alternatively to increase the TRQ from 5 GW to 20 GW annually. The petition explains how the domestic industry has continued to make a positive adjustment to import competition. It also explains that expected domestic module production coupled with current lack of sufficient domestic cell production will require domestic module producers to rely on imports in the near term, in excess of the current 5 GW within-quota TRQ amount.\n\n8. Section 204(b)(1)(B) of the Trade Act (19 U.S.C. 2254(b)(1)(B)) authorizes the President, upon submission of a petition from a majority of the representatives of the domestic industry, to reduce, modify, or terminate an action taken under section 203 of the Trade Act when the President determines that the domestic industry has made a positive adjustment to import competition.\n\n9. After taking into account the information provided in the USITC's midterm report, and after receiving a petition from a majority of the representatives of the domestic industry requesting expansion or elimination of the TRQ on imports of certain CSPV cells, I have determined that the domestic industry has been making and is continuing to make a positive adjustment to import competition, shown by increased actual and planned module production; various announcements of planned domestic cell production; and improvements in several of the domestic industry's financial, trade, and employment indicators. Furthermore, I have determined that expected domestic module production and associated imports of CSPV cells have increased such that it is necessary to modify the action taken in Proclamation 9693, as extended by Proclamation 10339, by expanding the TRQ to unchanging within-quota quantities of 12.5 GW.\n\n10. The in-quota quantity in each year of the TRQ described in paragraph 9 of this proclamation shall be allocated among all countries except those countries the products of which are excluded from such TRQ pursuant to clause (4) of Proclamation 10339 or paragraph 10 of Proclamation 9693.\n\nNow, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States, including sections 203, 204, and 604 of the Trade Act, do proclaim that:\n\n(1) In order to modify the action applicable to imports of CSPV cells under HTS subheading 8541.42.0010 and other CSPV products, such as modules under HTS subheading 8541.43.0010, subchapter III of chapter 99 of the HTS is modified as set forth in Annex I to this proclamation.\n\n(2) The modifications to the HTS made by this proclamation, including Annex I hereto, shall be effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on August 1, 2024, and shall continue in effect as provided in Annex I to this proclamation, unless such actions are earlier expressly reduced, modified, or terminated.\n\n(3) CSPV products that are subject to the modifications described in clause (1) of this proclamation, and which are entered into the United States above the prior TRQ limit of 5 GW on or after August 1, 2024, shall be included within the modified TRQ limit of 12.5 GW and shall not be assessed safeguard tariffs unless they enter into the United States above the modified TRQ limit of 12.5 GW.\n\n(4) U.S. Customs and Border Protection shall take such actions as are necessary to ensure proper application of clauses (1), (2), and (3) of this proclamation.\n\n(5) One year from the termination of the safeguard measure referenced in this proclamation, as modified by this proclamation, the U.S. note and tariff provisions established in Annex I to this proclamation shall be deleted from the HTS.\n\n(6) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency.\n\nIn Witness Whereof, I have hereunto set my hand this twelfth day of August, in the year of our Lord two thousand twenty-four, and of the Independence of the United States of America the two hundred and forty-ninth.\n\nJOSEPH R. BIDEN, JR.","M8":"Memorandum for the Heads of Executive Departments and Agencies\n\nSubject: Assistance for Federal Employees Affected by the Fires in the Los Alamos Area\n\nI am deeply concerned about the devastating losses suffered by many as a result of the fires in the Los Alamos, New Mexico, area. Many parts of the Federal Government have been mobilized to respond to this disaster.\n\nAs part of this effort, I ask the heads of executive departments and agencies to excuse from duty without charge to leave or loss of pay those Federal civilian employees who are affected by the fires in the Los Alamos area and their aftermath and who can be spared from their usual responsibilities. Specifically, I request that excused absence be granted to employees who are needed for emergency law enforcement, relief, or cleanup efforts authorized by Federal, State, or other officials having jurisdiction and employees who are prevented from reporting for work or faced with a personal emergency because of the fires and their aftermath.\n\nI am also authorizing the Office of Personnel Management (OPM) to determine whether there is a need to establish an emergency leave transfer program to assist employees affected by this major disaster. An emergency leave transfer program would permit employees in an executive agency to donate their unused annual leave for transfer to employees of the same or other agencies who were adversely affected by the fires in the Los Alamos area and who need additional time off for recovery. If the need for donated annual leave becomes evident, I direct the OPM to establish the emergency leave transfer program and provide additional information to agencies on the program's administration.\n\nWILLIAM J. CLINTON","EO26":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to improve the Nation's resilience to current and future flood risk, I hereby direct the following:\n\nSection 1. Policy. It is the policy of the United States to improve the resilience of communities and Federal assets against the impacts of flooding. These impacts are anticipated to increase over time due to the effects of climate change and other threats. Losses caused by flooding affect the environment, our economic prosperity, and public health and safety, each of which affects our national security.\n\nThe Federal Government must take action, informed by the best-available and actionable science, to improve the Nation's preparedness and resilience against flooding. Executive Order 11988 of May 24, 1977 (Floodplain Management), requires executive departments and agencies (agencies) to avoid, to the extent possible, the long- and short-term adverse impacts associated with the occupancy and modification of floodplains and to avoid direct or indirect support of floodplain development wherever there is a practicable alternative. The Federal Government has developed processes for evaluating the impacts of Federal actions in or affecting floodplains to implement Executive Order 11988.\n\nAs part of a national policy on resilience and risk reduction consistent with my Climate Action Plan, the National Security Council staff coordinated an interagency effort to create a new flood risk reduction standard for federally funded projects. The views of Governors, mayors, and other stakeholders were solicited and considered as efforts were made to establish a new flood risk reduction standard for federally funded projects. The result of these efforts is the Federal Flood Risk Management Standard (Standard), a flexible framework to increase resilience against flooding and help preserve the natural values of floodplains. Incorporating this Standard will ensure that agencies expand management from the current base flood level to a higher vertical elevation and corresponding horizontal floodplain to address current and future flood risk and ensure that projects funded with taxpayer dollars last as long as intended.\n\nThis order establishes the Standard and sets forth a process for further solicitation and consideration of public input, including from Governors, mayors, and other stakeholders, prior to implementation of the Standard.\n\nSec. 2. Amendments to Executive Order 11988. Executive Order 11988 is amended as follows:\n\n(a) Section 2 is amended by inserting \", to the extent permitted by law\" after \"as follows\".\n\n(b) Section 2(a)(1) is amended by striking \"This Determination shall be made according to a Department of Housing and Urban Development (HUD) floodplain map or a more detailed map of an area, if available. If such maps are not available, the agency shall make a determination of the location of the floodplain based on the best-available information. The Water Resources Council shall issue guidance on this information not later than October 1, 1977\" and inserting in lieu thereof \"To determine whether the action is located in a floodplain, the agency shall use one of the approaches in Section 6(c) of this Order based on the best-available information and the Federal Emergency Management Agency's effective Flood Insurance Rate Map\".\n\n(c) Section 2(a)(2) is amended by inserting the following sentence after the first sentence:\n\n\"Where possible, an agency shall use natural systems, ecosystem processes, and nature-based approaches when developing alternatives for consideration.\".\n\n(d) Section 2(d) is amended by striking \"Director\" and inserting \"Administrator\" in lieu thereof.\n\n(e) Section 3(a) is amended by inserting the following sentence after the first sentence:\n\n\"The regulations and procedures must also be consistent with the Federal Flood Risk Management Standard (FFRMS).\".\n\n(f) Section 3(a) is further amended by inserting \"and FFRMS\" after \"Flood Insurance Program\".\n\n(g) Section 3(b) is amended by striking \"base flood level\" and inserting \"elevation of the floodplain as defined in Section 6(c) of this Order\" in lieu thereof.\n\n(h) Section 4 is revised to read as follows:\n\n\"In addition to any responsibilities under this Order and Sections 102, 202, and 205 of the Flood Disaster Protection Act of 1973, as amended (42 U.S.C. 4012a, 4106, and 4128), agencies which guarantee, approve, regulate, or insure any financial transaction which is related to an area located in an area subject to the base flood shall, prior to completing action on such transaction, inform any private parties participating in the transaction of the hazards of locating structures in the area subject to the base flood.\".\n\n(i) Section 6(c) is amended by striking \", including at a minimum, that area subject to a one percent or greater chance of flooding in any given year\" and inserting in lieu thereof:\n\n\". The floodplain shall be established using one of the following approaches:\n\n\"(1) Unless an exception is made under paragraph (2), the floodplain shall be:\n\n\"(i) the elevation and flood hazard area that result from using a climate-informed science approach that uses the best-available, actionable hydrologic and hydraulic data and methods that integrate current and future changes in flooding based on climate science. This approach will also include an emphasis on whether the action is a critical action as one of the factors to be considered when conducting the analysis;\n\n\"(ii) the elevation and flood hazard area that result from using the freeboard value, reached by adding an additional 2 feet to the base flood elevation for non-critical actions and by adding an additional 3 feet to the base flood elevation for critical actions;\n\n\"(iii) the area subject to flooding by the 0.2 percent annual chance flood; or\n\n\"(iv) the elevation and flood hazard area that result from using any other method identified in an update to the FFRMS. \"(2) The head of an agency may except an agency action from paragraph (1) where it is in the interest of national security, where the agency action is an emergency action, where application to a Federal facility or structure is demonstrably inappropriate, or where the agency action is a mission-critical requirement related to a national security interest or an emergency action. When an agency action is excepted from paragraph (1) because it is in the interest of national security, it is an emergency action, or it is a mission-critical requirement related to a national security interest or an emergency action, the agency head shall rely on the area of land subject to the base flood\".\n\n(j) Section 6 is further amended by adding the following new subsection (d) at the end:\n\n\"(d) The term 'critical action' shall mean any activity for which even a slight chance of flooding would be too great.\".\n\n(k) Section 8 is revised to read as follows:\n\n\"Nothing in this Order shall apply to assistance provided for emergency work essential to save lives and protect property and public health and safety, performed pursuant to Sections 403 and 502 of the Robert T. Stafford Disaster Relief and Emergency Assistance Act of 1988 (42 U.S.C. 5170b and 5192).\".\n\nSec. 3. Agency Action. (a) Prior to any action to implement the Standard, additional input from stakeholders shall be solicited and considered. To carry out this process:\n\n(i) the Federal Emergency Management Agency, on behalf of the Mitigation Framework Leadership Group, shall publish for public comment draft amended Floodplain Management Guidelines for Implementing Executive Order 11988 (Guidelines) to provide guidance to agencies on the implementation of Executive Order 11988, as amended, consistent with the Standard;\n\n(ii) during the comment period, the Mitigation Framework Leadership Group shall host public meetings with stakeholders to solicit input; and\n\n(iii) after the comment period closes, and based on the comments received on the draft Guidelines during the comment period, in accordance with subsections (a)(i) and (ii) of this section, the Mitigation Framework Leadership Group shall provide recommendations to the Water Resources Council.\n\n(b) After additional input from stakeholders has been solicited and considered as set forth in subsections (a)(i) and (ii) of this section and after consideration of the recommendations made by the Mitigation Framework Leadership Group pursuant to subsection (a)(iii) of this section, the Water Resources Council shall issue amended Guidelines to provide guidance to agencies on the implementation of Executive Order 11988, as amended, consistent with the Standard.\n\n(c) To the extent permitted by law, each agency shall, in consultation with the Water Resources Council, Federal Interagency Floodplain Management Task Force, Federal Emergency Management Agency, and Council on Environmental Quality, issue or amend existing regulations and procedures to comply with this order, and update those regulations and procedures as warranted. Within 30 days of the closing of the public comment period for the draft amendments to the Guidelines as described in subsection (a) of this section, each agency shall submit an implementation plan to the National Security Council staff that contains milestones and a timeline for implementation of this order and the Standard, by the agency as it applies to the agency's processes and mission. Agencies shall not issue or amend existing\n\nregulations and procedures pursuant to this subsection until after the Water Resources Council has issued amended Guidelines pursuant to subsection (b) of this order.\n\nSec. 4. Reassessment. (a) The Water Resources Council shall issue any further amendments to the Guidelines as warranted.\n\n(b) The Mitigation Framework Leadership Group in consultation with the Federal Interagency Floodplain Management Task Force shall reassess the Standard annually, after seeking stakeholder input, and provide recommendations to the Water Resources Council to update the Standard if warranted based on accurate and actionable science that takes into account changes to climate and other changes in flood risk. The Water Resources Council shall issue an update to the Standard at least every 5 years.\n\nSec. 5. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department, agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\n(d) The Water Resources Council shall carry out its responsibilities under this order in consultation with the Mitigation Framework Leadership Group.\n\nBARACK OBAMA","P34":"By the President of the United States Of America\n\nA Proclamation\n\nThe Chairman of the Oil Policy Committee maintains a constant surveillance of imports of petroleum and its primary derivatives in respect to the national security.\n\nHe informs me that, in the course of his surveillance, he has reviewed the status of imports under Proclamation 3279, as amended, of petroleum and its primary derivatives in their relation to the national security and that further Presidential action under section 232 of the Trade Expansion Act of 1962, as amended, is required.\n\nHe recommends, after consultation with the Oil Policy Committee, that the method of adjusting imports of petroleum and petroleum products be modified by immediately suspending tariffs on imports of petroleum and petroleum products and by shifting to a system whereby fees for licenses covering such imports shall be charged and whereby such fees may be adjusted from time to time, as required in order to discourage the importation into the United States of petroleum and petroleum products in such quantities or under such circumstances as to threaten to impair the national security; to create conditions favorable, in the long range, to domestic production needed for projected national security requirements; to increase the capacity of domestic refineries and Petro-chemical plants to meet such requirements; and to encourage investment, exploration, and development necessary to assure such growth.\n\nThe Chairman informs me further, that the levels of imports heretofore fixed in calendar year 1973, with respect to Districts I—IV, District V, and Puerto Rico, reflect application of the established policy that for each such area the maximum level of imports shall be the difference between estimated supply and estimated demand, and that he finds that such levels of imports should be continued to be permitted without payment of the fees otherwise provided for in this proclamation.\n\nI agree with the recommendations of the Chairman, and I deem it necessary and consistent with the national security objectives of the Trade Expansion Act of 1962, as amended, that provision be made for a gradual transition from the existing quota method of adjusting imports of petroleum and petroleum products to a long-term program for adjustment of imports of petroleum and petroleum products through the suspension of existing tariffs and the institution of a system of fees applicable to imports of crude oil, unfinished oils, and finished products, which fees may be adjusted from time to time.\n\nNow, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that, effective as of this date, that portion of Proclamation 3279, as amended, beginning with section 1 thereof, is hereby amended to read as follows:\n\n\"SEC. 1 (a) In Districts I—IV, in District V, and in Puerto Rico, no crude oil, unfinished oils, or finished products may be entered for consumption or withdrawn from warehouse for consumption, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries or withdrawals may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section, or (4) as provided in paragraph (c) of this section, or (5) as otherwise provided in this proclamation.\n\n(b) The Secretary of the Interior may, in his discretion, authorize entries, without allocation or license, of small quantities of crude oil, unfinished oils, or finished products.\n\n(c) In Districts I—IV, District V, and in Puerto Rico, no department, establishment, or agency of the United States shall without prior payment of the fees provided for in this proclamation, import finished products in excess of the respective allocations made to them by the Secretary of the Interior. Such allocations shall, except as otherwise provided in this proclamation, be within the maximum levels of imports established in section 2 of this proclamation.\n\n(d) The Secretary may, by regulation, provide that no allocation or license shall be required in connection with the transportation to the United States by pipeline through a foreign country of crude oil, unfinished oils, or finished products produced in the customs territory of the United States or, in the event of commingling with foreign oils of like kind and qualities incidental to such transportation, of quantities equivalent to the quantities produced in and shipped from such customs territory.\"\n\n\"SEC. 2(a) Except as otherwise provided in this proclamation, the maximum level of imports, from sources other than Canada and Mexico which may be made without prior payment of the fees provided in this proclamation, of crude oil, unfinished oils, and finished products (other than residual fuel oil to be used as fuel) shall be:\n\n(1) for Districts I—IV, 1,992,000 average barrels per day per calendar year: Provided, That, in addition to the foregoing, there may be imported into District I an average of 50,000 barrels per day of No. 2 fuel oil, manufactured in the Western Hemisphere from crude oil produced in the Western Hemisphere under allocations made by the Secretary, pursuant to regulations of the Secretary, to deepwater terminal operators currently receiving allocations and who do not have crude oil import allocations into Districts I—IV; Provided Further, That, whenever the Chairman of the Oil Policy Committee finds that, because of supply, price, or other considerations, the requirement that No. 2 fuel oil be manufactured in the Western Hemisphere from crude oil produced in the Western Hemisphere is unduly restricting the availability of such oil for importation into District I and is not required for the national security, he shall so advise the Secretary who shall then suspend such requirement by appropriate regulation. No such suspension shall be renewed except upon a new finding by the Chairman as required by the preceding sentence; Provided Further, That, the Secretary may, by regulation, provide that a holder of an allocation for the importation of No. 2 fuel oil may import crude oil produced in the Western Hemisphere in lieu of No. 2 fuel oil, barrel for barrel, and exchange such crude oil for No. 2 fuel oil.\n\n(2) for District V, 670,000 average barrels per day per calendar year.\n\n(3) for Puerto Rico 227,221 average barrels per day per year commencing April 1, 1973; Provided, That no person who manufactures in Puerto Rico No. 2 fuel oil from crude oil produced in the Western Hemisphere shall incur a reduction of an allocation or be deemed to have violated a condition of an allocation by reason of a shipment of such oil to a person who holds an allocation of imports of No. 2 fuel oil into District I and who does not have a crude oil import allocation into District I; Provided Further, That, this limitation shall not apply to long-term allocations of imports into Puerto Rico.\n\n(4) for District I, 2,900,000 average barrels per day per year, commencing April 1, 1973, of residual fuel oil to be used as fuel.\n\n(5) for Districts II—IV, 42,000 average barrels per day per calendar year of residual fuel oil to be used as fuel.\n\n(6) for District V, 75,600 average barrels per day per calendar year of residual fuel oil to be used as fuel.\n\n(b) Imports of asphalt, ethane, propane, and butanes shall not be subject to the levels established in this proclamation nor shall any allocation or license be required for their importation.\n\n(c) Crude oil may be imported into District I to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. The quantities of crude oil, unfinished oils, and finished products that may be imported into the United States under the provisions of this proclamation shall not be reduced by reason of imports of crude oil used as fuel under this paragraph.\n\n(d) (1) Except as otherwise provided in this proclamation, the maximum levels of imports from Canada of crude oil and unfinished oils to which license fees are not applicable shall be:\n\n(i) for Districts I—IV, 960,000 average barrels per day per calendar year; Provided, That, the Secretary may, within the limits established by subparagraph (1) of paragraph (a) of this section, increase the quantity of crude oil, unfinished oils, and finished products which may be imported from Canada so long as such increase is consonant with the purposes of this proclamation.\n\n(ii) for District V, 280,000 average barrels per day per calendar year; Provided, That, the Secretary may, within the limits established by subparagraph (1) of paragraph (a) of this section, increase the quantity of crude oil, unfinished oils, and finished products which may be imported from Canada so long as such increase is consonant with the purposes of this proclamation.\n\n(2) Entries for consumption of imports from Canada by pipeline may be made until midnight January 15 of the calendar year following the calendar year in which any license authorizing such imports from Canada was issued.\n\n(e) Except as otherwise provided in this proclamation, the maximum level of imports from Mexico of crude oil produced in Mexico and unfinished oils and finished products produced in Mexico wholly from Mexican crude oil shall be 32,500 average barrels per day per calendar year.\n\n(f) The levels established, and the total demand referred to, in this section do not include free withdrawals by persons pursuant to section 309 of the Tariff Act of 1930, as amended (19 U.S.C. 1309), or petroleum supplies for vessels or aircraft operated by the United States between points referred to in said section 309 (as to vessels or aircraft, respectively) or between any point in the United States or its possessions and any point in a foreign country.\"\n\n\"SEC. 3(a) Effective May 1, 1973, the Secretary shall, by regulation, establish a system of fees for licenses issued under allocations of imports of crude oil, unfinished oils, and finished products, over the above levels of imports established by section 2 of this proclamation. Such regulations shall require, among other appropriate provisions, that such fees shall be:\n\nProvided, That, license fees paid for imports of crude oil or unfinished oils will be refunded to the extent that such crude oils or unfinished oils have been incorporated into petro-chemical or finished products subsequently exported or that asphalt as defined in this proclamation was produced from the imported feedstocks.\n\n(b) Except for allocation and licenses to which the license fee is not applicable, applications for allocations of imports of crude oil, unfinished oils, or finished products shall be accompanied by the applicant's certified check or a cashier's check payable to the order of the Treasurer of the United States in the appropriate amount chargeable pursuant to this section. Applications not accompanied by a certified or cashier's check in the amount required shall not be considered.\n\n(c) (1) All monies received by the Secretary under the terms of paragraph (b) of this section shall be held by the Secretary of the Interior in a suspense account and may be drawn upon by the Secretary for the payment of any refunds of refundable license fees and for payments to Puerto Rico of sums collected by way of license fees for imports into Puerto Rico. Balances remaining in such suspense account not required for payment hereinabove provided shall be deposited at the end of each fiscal year in the Treasury of the United States and credited to miscellaneous receipts.\n\n(2) Refunds pursuant to subparagraph (1) of paragraph (c) of this section shall be made without interest.\"\n\n\"SEC. 4 (a) The Secretary of the Interior is hereby authorized to issue regulations for the purpose of implementing this proclamation.\n\n(b) (1) With respect to the allocation of imports of crude oil and unfinished oils into Districts I—IV and into District V, such regulations shall provide for a fair and equitable distribution of allocations of imports for which license fees are not applicable among eligible persons having refinery capacity in relation to refinery inputs or in relation to storage capacities of such allocation holders. The Secretary may, by regulation, also provide for the making of allocations of imports for which license fees are not applicable, of crude oil and unfinished oils into Districts I—IV and into District V to persons having petrochemical plants in these districts in relation to the outputs of such plants or in relation to inputs to such plants. Provision may be made in the regulations for the making of such allocations on the basis of graduated scales. Notwithstanding the levels prescribed in section 2 of this proclamation, the Secretary may also by regulation make such provisions as he deems consonant with the objectives of this proclamation for the making of allocations of imports of crude oil and unfinished oils to which the license fee is not applicable into Districts I—IV and into District V to persons who manufacture from crude oil and unfinished oils and who export finished products and petrochemicals, subject to such designations as the Secretary may make. Notwithstanding the levels established in section 2 of this proclamation the Secretary may make allocations to which license fees shall not be applicable to new, expanded, or reactivated refinery capacity and petrochemical plants for a period of five years from the date such facility comes on stream. Such allocations shall not exceed 75 percent of estimated refinery inputs or the percentage of petrochemical plant inputs applicable.\n\n(2) Such regulations shall provide for the allocations of imports with respect to which license fees are not applicable of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in the calendar year 1964 on the basis of the allocation of crude and unfinished oils received by such persons for the allocation period commencing April 1, 1973; Provided, That, in respect of imports for which license fees are applicable, license fees paid for imports of crude oil and unfinished oils into Puerto Rico will be refunded to the extent that such crude oil or unfinished oils have been incorporated into finished products consumed in Puerto Rico or petrochemicals or finished products exported therefrom.\n\n(3) Except for crude oil or unfinished oils imported under license or licenses for which a fee has been charged, or pursuant to specific relief granted pursuant to section 5, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that exchanges for domestic crude or unfinished oils may be made, if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant.\n\n(4) With respect to the allocation of imports of finished products (other than residual fuel oil to be used as fuel) in respect of which license fees are not applicable into Puerto Rico, such regulations shall provide, to the extent possible for a fair and equitable distribution of imports of such finished products among persons who were importers of such finished products into Puerto Rico during all or part of the calendar year 1958, or such higher level as the Secretary may have determined to be required to meet demand in Puerto Rico for finished products that would not otherwise have been met, during the calendar year 1973.\n\n(5) With respect to the allocation of imports to which license fees are not applicable of residual fuel oil to be used as fuel in Puerto Rico, such regulations shall, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel among persons who were importers of that product into Puerto Rico during all or part of the calendar year 1958. In addition, the Secretary by regulation may, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel, the maximum sulphur content of which is acceptable to the Secretary\n\n(i) among persons who are in the business in the respective districts or Puerto Rico of selling residual fuel oil to be used as fuel and who had inputs of that product to deepwater terminals located in the respective districts or Puerto Rico and (ii) among persons who are in the business in the respective districts or Puerto Rico of selling residual fuel oil to be used as fuel and who have throughput agreements (warehouse agreements) with deepwater terminal operators. With respect to the allocation of imports into District I of residual fuel oil to be used as fuel, such regulations shall, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel (i) among persons who are in the business in District I of selling residual fuel oil to be used as fuel and who have had inputs of that product to deepwater terminals located in District I, and (ii) among persons who are in the business in District I of selling residual fuel oil to be used as fuel and have throughput agreements (warehouse agreements) with deepwater terminal operators. With respect to the allocation of imports of residual fuel oil to be used as fuel into District I, Districts II—IV, District V, and Puerto Rico, such regulations shall also provide, to the extent possible, for the granting of allocations of imports of residual fuel oil to be used as fuel in accordance with procedures established pursuant to section 5 of this proclamation.\n\n(c) Such regulations may provide for the revocation or suspension by the Secretary of any allocation or license on grounds relating to the national security, or the violation of the terms of this proclamation, or of any regulation, allocation, or license issued pursuant to this proclamation.\n\n(d) For the balance of the calendar year 1973, notwithstanding the levels established in section 2 of this proclamation and the provisions of paragraph (b) of this section, the Secretary may provide by regulation for additional allocations of imports in respect of which license fees are not applicable of crude oil and unfinished oils to persons in District I—IV, and District V who manufacture in the United States residual fuel oil to be used as fuel, the maximum sulphur content of which is acceptable to the Secretary, in consultation with the Secretary of Health, Education and Welfare. These allocations to each of such persons shall not exceed the amount of such residual fuel oil manufactured by that person.\"\n\n\"SEC. 5 (a) The Secretary of the Interior is authorized to provide for the establishment and operation of an Appeals Board to consider petitions by persons affected by the regulations issued pursuant to this proclamation. The Appeals Board shall be comprised of a representative each from the Departments of the Interior, Justice, and Commerce to be designated respectively by the heads of such Departments.\n\n(b) The Appeals Board may be empowered, subject to the general direction of the Chairman of the Oil Policy Committee, (1) within the limits of the maximum levels of imports established in this proclamation, to modify on the grounds of error any allocation made to any person under such regulations; (2) without regard to the limits of the maximum levels of imports established in this proclamation, (i) to modify, on the grounds of exceptional hardship, any allocation with respect to which license fees are not applicable made to any person under such regulations; (ii) to grant allocations of imports to which license fees will not be applicable of crude oil and unfinished oils in special circumstances to persons with importing histories who do not qualify for allocations under such regulations; and (iii) to grant allocations of imports, to which license fees shall not be applicable, of finished products on the grounds of exceptional hardship; and to assure that adequate supplies of crude oil, unfinished oils, and finished products are made available to independent refiners or established marketers who are experiencing exceptional hardship or in emergencies requiring, in its judgment, the grant of allocations to them, and (3) to review the revocation or suspension of any allocation or license. The Secretary may provide that the Board may take such action on petitions as it deems appropriate and that the decisions by the Appeals Board shall be final.\n\n(c) Effective April 30, 1980, the jurisdiction of the Oil Import Appeals Board shall expire.\"\n\n\"SEC. 6 Persons who apply for allocations of crude oil, unfinished oils, or finished products, persons to whom such allocations have been made, and persons who hold such allocations shall furnish to the Secretary of the Interior such information and shall make such reports as he may require, by regulations or otherwise, in the discharge of his responsibilities under this proclamation.\"\n\n\"SEC. 7 The Chairman of the Oil Policy Committee shall provide policy direction, coordination, and surveillance of the oil import control program, including approval of regulations issued pursuant to this proclamation. He shall perform those functions after receiving the advice of the Oil Policy Committee and in accordance with guidance from the Assistant to the President with responsibility in the area of economic affairs.\"\n\n\"SEC. 8 The Oil Policy Committee shall consist of the Deputy Secretary of the Treasury, as Chairman, and the Secretaries of State, Defense, Interior, and Commerce, the Attorney General, and the Chairman of the Council of Economic Advisers, as members. The President may, from time to time, designate other officials to serve as members of the Committee. The Chairman may create subcommittees of the Committee to study and report to the Committee concerning specified subject matters.\"\n\n\"SEC. 9 The Oil Policy Committee shall consult with and advise the Chairman on oil import policy, including. the operation of the control program under Proclamation 3279, as amended, and on recommendations for changes. in the program by the issuance of new proclamations with respect to it, or otherwise.\"\n\n\"SEC. 10 The Chairman of the Oil Policy Committee shall from time to time, as in his judgment is required, review the status of imports of petroleum and its primary derivatives in respect to the national security, and, after consultation with the Oil Policy Committee, he shall inform the President of any circumstances which, in the Chairman's opinion, might indicate the need for further Presidential action under section 232 of the Trade Expansion Act of 1962 (19 U.S.C. 1862), as amended. In the event prices of crude de oil or its products or derivatives should be increased after the effective date of this proclamation, beyond the limits contemplated by the Cost of Living Council, such review may include a determination as to whether such increase or increases are necessary to accomplish the national security objectives of section 232 of the Trade Expansion Act of 1962, as amended, and this proclamation.\"\n\n\"SEC. 11 Annually, beginning May 1, 1974, the maximum levels of imports subject to allocation and license, to which license fees shall not be applicable, shall be reduced as follows:\n\nFor the year commencing May 1, 1974, the maximum levels of such imports shall be ninety percent (90%), in barrels per day, of the levels established during the calendar year 1973;\n\nFor the year commencing May 1, 1975, the maximum levels of such imports shall be eighty percent (80%), in barrels per day, of the levels established during the calendar year 1973;\n\nFor the year commencing May 1, 1976, the maximum levels of such imports shall be sixty-five percent (65%), in barrels per day, of the levels established during the calendar year 1973;\n\nFor the year commencing May 1, 1977, the maximum levels of such imports shall be fifty percent (50%), in barrels per day, of the levels established during the calendar year 1973;\n\nFor the year commencing May 1, 1978, the maximum levels of such imports shall be thirty-five percent (35%), in barrels per day, of the levels established during the calendar year 1973;\n\nFor the year commencing May 1, 1979, the maximum levels of such imports shall be twenty percent (20%), in barrels per day, of the levels established during the calendar year 1g73.\n\nEffective April 30, 1980, the system of issuing allocations and licenses not subject to license fee shall be abolished;\n\nProvided, That, with respect to any allocation period expiring prior to May 1, 1974, such allocation period shall be extended to April 30, 1974, and the Secretary shall issue appropriate regulations to issue additional oil import licenses to reflect such extension.\n\n\"SEC. 12 (a) Commitments and obligations contained in.. long-term allocations heretofore made of imports of crude oil into Puerto Rico shall be unimpaired by this proclamation or regulations issued thereunder.\n\n(b) Commitments and obligations contained in that certain allocation made to Hess Oil and Chemical Corporation of imports of finished products into Districts I—IV, dated December 12, 1967, effective January 1, 1968, shall be unimpaired by this proclamation or regulations issued thereunder.\"\n\n\"SEC. 13 The Secretary of the Interior may delegate, and provide for successive redelegation of, the authority conferred upon him by this proclamation. All departments and agencies of the Executive Branch of the Government shall cooperate with and assist the Secretary of the Interior in carrying out the purposes of this proclamation.\"\n\n\"SEC. 14 Executive Order 10761 of March 27, 1958, entitled \"Government Purchases of Crude Petroleum and Petroleum Products\" (23 F.R. 2067) is revoked.\"\n\n\"SEC. 15 As used in this proclamation:\n\n(a) \"Person\" includes an individual, a corporation, firm, or other business organization or legal entity, and an agency of a state, territorial or local government, but does not include a department, establishment, or agency of the United States.\n\n(b) \"District I\" means the states of Maine, New Hampshire, Vermont, Massachusetts, Connecticut, Rhode Island, New York, New Jersey, Pennsylvania, Maryland, Delaware, West Virginia, Virginia, North Carolina, South Carolina, Georgia, Florida, and the District of Columbia.\n\n(c) \"Districts II—IV\" means all of the states of the United States except those states within District I and District V.\n\n(d) \"Districts I—IV\" means the District of Columbia and all of the states of the United States except those states within District V.\n\n(e) \"District V\" means the states of Arizona, Nevada, California, Oregon, Washington, Alaska, and Hawaii.\n\n(f) \"Crude oil\" means a mixture of hydrocarbons that existed in natural underground reservoirs and which is liquid at atmospheric pressure after passing through surface separating processes and does not include natural gas products. It includes the initial liquid hydrocarbons produced from tar sands, gilsonite, and oil shale.\n\n(g) \"Finished products\" means any one or more of the following petroleum oils, or a mixture or combination of such oils, or any component or components of such oils which are to be used without further processing by any one or more of the processes described in subparagraphs (1) through (3) of paragraph (h) of this section, and which, as of January 1, 1973, under the Tariff Schedules of the United States, were not subject to a duty of more than one cent ($0.01) per pound of the hydrocarbons therein contained:\n\n(1) The term \"liquefied gases\" means the following liquefied or liquefiable gases, namely, ethane, propane, butanes, ethylene, propylene, and butylenes which are derived by refining or other processing of natural gas, crude oil, or unfinished oils.\n\n(2) \"Gasoline\" means a refined petroleum distillate, including naphtha, jet fuel or other petroleum oils (but not isoprene or cumene having a purity of 50 percent or more by weight, or benzene which meets the ASTM distillation standards for nitration grade) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, and having a boiling range at atmospheric pressure from 80° to 400°F.\n\n(3) \"Kerosene\" means any jet fuel, diesel fuel, fuel oil or other petroleum oils derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure from 400° to 550°F.\n\n(4) \"Distillate fuel oil\" means any fuel oil, gas oil, topped crude oil, or other petroleum oils, derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure from 550° to 1200°F.\n\n(5) \"Residual fuel oil\" means a petroleum oil, which is (i) any topped crude or viscous residuum of crude or unfinished oils or one or more of the petroleum oils defined in subparagraphs (2) through (4) of this paragraph (g), which has a viscosity of not less than 45 seconds Saybolt Universal at 100°F. to be used as fuel without further processing other than by mechanical blending or (ii) crude oil to be used as fuel without further processing other than by blending by mechanical means.\n\n(6) \"Asphalt\" means a solid or semi-solid cementitious crude oil or derivative of crude oil, 50 percent or more of the constituents of which are bitumins, which is not to be used as fuel and which is to be used without further processing except airblowing or blending by mechanical means.\n\n(7) \"Lubricating oils\" means any lubricant containing more than 50 percent by volume of refined petroleum distillates or specially treated petroleum residuum.\n\n(8) \"Natural gas products\" means liquids (under atmospheric conditions), including natural gasoline, which are recovered by process of absorption, adsorption, compression, refrigeration, cycling, or a combination of such processes, from mixtures of hydrocarbons that existed in a reservoir and which, when recovered and without processing in a refinery or other plant, fall within any of the definitions of products contained in clauses (2) through (4) of this paragraph (g).\n\n(h) \"Unfinished oils\" means one or more of the petroleum oils listed in clauses (1) through (4) and clause (8) of paragraph (g) of this section or a mixture or combination of such oils, or any component or components of such oils, which are to be further processed in one or more of the following ways:\n\n(1) By distillation with a resulting yield of at least two distinct finished products or unfinished oils, two of which must be equal to not less than 10 percent of the total charge of such imported unfinished oils to a distillation unit. Different grades or specifications of finished products or unfinished oils will not constitute distinct finished products or unfinished oils for purposes of this subparagraph. Distillation of petroleum oils which have been reconstituted by blending of two or more finished products or unfinished oils does not constitute processing for the purposes of this subparagraph.\n\n(2) By catalytic or thermal conversion in process units such as alkylation, coking, cracking, hydrofining, hydro-desulfurization, polymerization, isomerization, dehydrogenation, or refining.\n\n(3) By physical separation established by means of solvent dewaxing, solvent deasphalting, solvent extraction, or extractive distillation.\n\n(i) As used in paragraphs (g) and (h) of this section, the term \"petroleum oil\" includes only hydrocarbons derived from crude oil or natural gas.\n\n(j) The term \"imports from Canada\" as used in this proclamation, means entries for consumption or withdrawals from warehouse for consumption of the following items which have been transported into the United States from Canada, by overland means (pipeline, rail, or other means of overland transportation) or over waterways other than ocean waterways, to-wit: crude oil produced in Canada, unfinished oils which have deriv","L9":"[Released July 2, 1949. Dated July 1, 1949]\n\nTo all Executive Agencies:\n\nBy virtue of the authority vested in me by section 205 (a) of the Act entitled \"An Act to simplify the procurement, utilization and disposal of Government property, to reorganize certain agencies of the Government, and for other purposes,\" approved June 30, 1949 (the Federal Property and Administrative Services Act of 1949) it is hereby directed that:\n\n1. In cooperation with other interested agencies, the Administrator of General Services shall institute studies and surveys to determine the extent to which existing policies, procedures and directives heretofore promulgated and remaining in force under section 501 of the Act, should be modified or revoked in the interest of promoting greater economy and efficiency in accomplishing the purposes of this Act. Careful attention shall be given to determining the degree of centralization in the General Services Administration to be attained in the performance of the functions involved. When these studies and surveys have been completed and after consulting with the interested agencies, the Administrator shall prescribe such regulations as may be necessary to implement the determinations resulting from such studies and surveys.\n\n2. After consultation with the Bureau of the Budget and other Executive agencies, and also with the General Accounting Office in respect of such matters as may be appropriate, including matters affecting its functions under sections 205(b) and 206(c) of the Act, and at the earliest possible date, the Administrator of General Services shall establish such standards, prescribe such regulations, and prepare and issue such manuals and procedures as may be necessary to guide all Executive agencies in ascertaining whether their operations in the field of property and records management are efficient and economical as well as consistent with established Government policies.\n\n3. In accordance with directives to be issued by the Administrator of General Services, each Executive agency shall promptly institute surveys to determine excess personal property and that portion of excess real property, including unimproved property, under their control which might be suitable for office, storage, and related facilities, and shall promptly report to the Administrator as soon as each survey is completed.\n\n4. Each Executive agency shall carefully plan and schedule its requirements for supplies, equipment, materials and all other personal property in order that necessary stocks may be maintained at minimum levels and high-cost small-lot purchasing avoided.\n\n5. Under section 201 (c) of the Act, Executive agencies are permitted to apply exchange allowances and proceeds of sale in payment of property acquired. The Administrator shall promptly prescribe regulations specifying the extent to which Executive agencies may exercise this authority, and pending the issuance of such regulations, no Executive agency shall exercise this authority except to the extent permitted by, and in accordance with the provisions of, statutes in force prior to the taking effect of this Act.\n\n6. Section 502(d) of the Act provides that certain programs and functions now being carried on by various Executive agencies shall not be impaired or affected by the provisions of the Act. However, the attention of these agencies is called specifically to the purposes of this legislation and they shall, insofar as practicable, procure, utilize and dispose of property in accordance with the provisions of the Act and the regulations issued thereunder in order that the greatest overall efficiency and economy may be effected. These same agencies shall also cooperate with the Administrator of General Services in the making of surveys of property and property management practices and in the establishment of inventory levels as provided in section 206(a) (1) and (2) of the Act.\n\nHARRY S. TRUMAN","L4":"Dear Mr. Secretary:\n\nPursuant to Arrangements between the United States and the European Coal and Steel Community (ECSC) and the European Economic Community (EEC), dated October 21, 1982, the ECSC and the EEC have agreed to establish export licenses or other export measures with respect to steel mill products specified under these Arrangements, which are exported after October 31, 1982 and before January 1, 1986, and are exported to, or destined for consumption in, the United States. Accordingly, I request under section 626 of the Tariff Act of 1930, as amended by section 153 of Public Law 97-27.6, that you monitor and enforce the measures taken within these Arrangements by requiring when necessary the presentation of valid export certificates or other documents issued by appropriate authorities within the European Communities or their member states as a condition for entry into the United States of steel mill products from the European Communities.\n\nSincerely,\n\nRONALD REAGAN\n\n[The Honorable Donald Regan, Secretary of the Treasury, Washington, D.C. 20220]","EO1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to establish policies and procedures implementing section 2204 of title 44 of the United States Code with respect to constitutionally based privileges, including those that apply to Presidential records reflecting military, diplomatic, or national security secrets, Presidential communications, legal advice, legal work, or the deliberative processes of the President and the President's advisors, and to do so in a manner consistent with the Supreme Court's decisions in Nixon v. Administrator of General Services, 433 U.S. 425 (1977), and other cases, it is hereby ordered as follows:\n\nSection 1. Definitions.\n\nFor purposes of this order:\n\n(a) \"Archivist\" refers to the Archivist of the United States or his designee.\n\n(b) \"Presidential records\" refers to those documentary materials maintained by the National Archives and Records Administration pursuant to the Presidential Records Act, 44 U.S.C. 2201-2207.\n\n(c) \"Former President\" refers to the former President during whose term or terms of office particular Presidential records were created.\n\nSec. 2. Constitutional and Legal Background.\n\n(a) For a period not to exceed 12 years after the conclusion of a Presidency, the Archivist administers records in accordance with the limitations on access imposed by section 2204 of title 44. After expiration of that period, section 2204(c) of title 44 directs that the Archivist administer Presidential records in accordance with section 552 of title 5, the Freedom of Information Act, including by withholding, as appropriate, records subject to exemptions (b)(1), (b)(2), (b)(3), (b)(4), (b)(6), (b)(7), (b)(8), and (b)(9) of section 552. Section 2204(c)(1) of title 44 provides that exemption (b)(5) of section 552 is not available to the Archivist as a basis for withholding records, but section 2204(c)(2) recognizes that the former President or the incumbent President may assert any constitutionally based privileges, including those ordinarily encompassed within exemption (b)(5) of section 552. The President's constitutionally based privileges subsume privileges for records that reflect: military, diplomatic, or national security secrets (the state secrets privilege); communications of the President or his advisors (the presidential communications privilege); legal advice or legal work (the attorney-client or attorney work product privileges); and the deliberative processes of the President or his advisors (the deliberative process privilege).\n\n(b) In Nixon v. Administrator of General Services, the Supreme Court set forth the constitutional basis for the President's privileges for confidential communications: \"Unless [the President] can give his advisers some assurance of confidentiality, a President could not expect to receive the full and frank submissions of facts and opinions upon which effective discharge of his duties depends.\" 433 U.S. at 448-49. The Court cited the precedent of the Constitutional Convention, the records of which were \"sealed for more than 30 years after the Convention.\" Id. at 447 n.11. Based on those precedents and principles, the Court ruled that constitutionally based privileges available to a President \"survive[] the individual President's tenure.\" Id. at 449. The Court also held that a former President, although no longer a Government official, may assert constitutionally based privileges with respect to his Administration's Presidential records, and expressly rejected the argument that \"only an incumbent President can assert the privilege of the Presidency.\" Id. at 448.\n\n(c) The Supreme Court has held that a party seeking to overcome the constitutionally based privileges that apply to Presidential records must establish at least a \"demonstrated, specific need\" for particular records, a standard that turns on the nature of the proceeding and the importance of the information to that proceeding. See United States v. Nixon, 418 U.S. 683, 713 (1974). Notwithstanding the constitutionally based privileges that apply to Presidential records, many former Presidents have authorized access, after what they considered an appropriate period of repose, to those records or categories of records (including otherwise privileged records) to which the former Presidents or their representatives in their discretion decided to authorize access. See Nixon v. Administrator of General Services, 433 U.S. at 450- 51.\n\nSec. 3. Procedure for Administering Privileged Presidential Records.\n\nConsistent with the requirements of the Constitution and the Presidential Records Act, the Archivist shall administer Presidential records under section 2204(c) of title 44 in the following manner:\n\n(a) At an appropriate time after the Archivist receives a request for access to Presidential records under section 2204(c)(1), the Archivist shall provide notice to the former President and the incumbent President and, as soon as practicable, shall provide the former President and the incumbent President copies of any records that the former President and the incumbent President request to review.\n\n(b) After receiving the records he requests, the former President shall review those records as expeditiously as possible, and for no longer than 90 days for requests that are not unduly burdensome. The Archivist shall not permit access to the records by a requester during this period of review or when requested by the former President to extend the time for review.\n\n(c) After review of the records in question, or of any other potentially privileged records reviewed by the former President, the former President shall indicate to the Archivist whether the former President requests withholding of or authorizes access to any privileged records.\n\n(d) Concurrent with or after the former President's review of the records, the incumbent President or his designee may also review the records in question, or may utilize whatever other procedures the incumbent President deems appropriate to decide whether to concur in the former President's decision to request withholding of or authorize access to the records.\n\n(1) When the former President has requested withholding of the records:\n\n(i) If under the standard set forth in section 4 below, the incumbent President concurs in the former President's decision to request withholding of records as privileged, the incumbent President shall so inform the former President and the Archivist. The Archivist shall not permit access to those records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order.\n\n(ii) If under the standard set forth in section 4 below, the incumbent President does not concur in the former President's decision to request withholding of the records as privileged, the incumbent President shall so inform the former President and the Archivist. Because the former President independently retains the right to assert constitutionally based privileges, the Archivist shall not permit access to the records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order.\n\n(2) When the former President has authorized access to the records:\n\n(i) If under the standard set forth in section 4 below, the incumbent President concurs in the former President's decision to authorize access to the records, the Archivist shall permit access to the records by the requester.\n\n(ii) If under the standard set forth in section 4 below, the incumbent President does not concur in the former President's decision to authorize access to the records, the incumbent President may independently order the Archivist to withhold privileged records. In that instance, the Archivist shall not permit access to the records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order.\n\nSec. 4. Concurrence by Incumbent President.\n\nAbsent compelling circumstances, the incumbent President will concur in the privilege decision of the former President in response to a request for access under section 2204(c)(1). When the incumbent President concurs in the decision of the former President to request withholding of records within the scope of a constitutionally based privilege, the incumbent President will support that privilege claim in any forum in which the privilege claim is challenged.\n\nSec. 5. Incumbent President's Right to Obtain Access.\n\nThis order does not expand or limit the incumbent President's right to obtain access to the records of a former President pursuant to section 2205(2)(B).\n\nSec. 6. Right of Congress and Courts to Obtain Access.\n\nThis order does not expand or limit the rights of a court, House of Congress, or authorized committee or subcommittee of Congress to obtain access to the records of a former President pursuant to section 2205(2)(A) or section 2205(2)(C). With respect to such requests, the former President shall review the records in question and, within 21 days of receiving notice from the Archivist, indicate to the Archivist his decision with respect to any privilege. The incumbent President shall indicate his decision with respect to any privilege within 21 days after the former President has indicated his decision. Those periods may be extended by the former President or the incumbent President for requests that are burdensome. The Archivist shall not permit access to the records unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order.\n\nSec. 7. No Effect on Right to Withhold Records.\n\nThis order does not limit the former President's or the incumbent President's right to withhold records on any ground supplied by the Constitution, statute, or regulation.\n\nSec. 8. Withholding of Privileged Records During 12-Year Period.\n\nIn the period not to exceed 12 years after the conclusion of a Presidency during which section 2204(a) and section 2204(b) of title 44 apply, a former President or the incumbent President may request withholding of any privileged records not already protected from disclosure under section 2204. If the former President or the incumbent President so requests, the Archivist shall not permit access to any such privileged records unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order.\n\nSec. 9. Establishment of Procedures.\n\nThis order is not intended to indicate whether and under what circumstances a former President should assert or waive any privilege. The order is intended to establish procedures for former and incumbent Presidents to make privilege determinations.\n\nSec. 10. Designation of Representative.\n\nThe former President may designate a representative (or series or group of alternative representatives, as the former President in his discretion may determine) to act on his behalf for purposes of the Presidential Records Act and this order. Upon the death or disability of a former President, the former President's designated representative shall act on his behalf for purposes of the Act and this order, including with respect to the assertion of constitutionally based privileges. In the absence of any designated representative after the former President's death or disability, the family of the former President may designate a representative (or series or group of alternative representatives, as they in their discretion may determine) to act on the former President's behalf for purposes of the Act and this order, including with respect to the assertion of constitutionally based privileges.\n\nSec. 11. Vice Presidential Records.\n\n(a) Pursuant to section 2207 of title 44 of the United States Code, the Presidential Records Act applies to the executive records of the Vice President. Subject to subsections (b) and (c), this order shall also apply with respect to any such records that are subject to any constitutionally based privilege that the former Vice President may be entitled to invoke, but in the administration of this order with respect to such records, references in this order to a former President shall be deemed also to be references to the relevant former Vice President.\n\n(b) Subsection (a) shall not be deemed to authorize a Vice President or former Vice President to invoke any constitutional privilege of a President or former President except as authorized by that President or former President.\n\n(c) Nothing in this section shall be construed to grant, limit, or otherwise affect any privilege of a President, Vice President, former President, or former Vice President.\n\nSec. 12. Judicial Review.\n\nThis order is intended to improve the internal management of the executive branch and is not intended to create any right or benefit, substantive or procedural, enforceable at law by a party, other than a former President or his designated representative, against the United States, its agencies, its officers, or any person.\n\nSec. 13. Revocation.\n\nExecutive Order 12667 of January 18, 1989, is revoked.\n\nGeorge W. Bush\n\nThe White House,\n\nNovember 1, 2001.","P31":"By the President of the United States Of America\n\nA Proclamation\n\nThe Director of the Office of Emergency Preparedness, with the advice of the Oil Policy Committee, has under consideration a number of substantial proposals relating to the management of the oil import program under Proclamation No. 3279, as amended. Pending final decisions and announcements on those proposals, he has recommended that the Secretary of the Interior be delegated authority to provide interim allocations for the allocation period commencing January 1, 1973, and for succeeding allocation periods.\n\nThe Director, with the advice of the Oil Policy Committee, has also recommended that occasional shortages of certain finished petroleum products important to the national security should be relieved by delegating authority to the Secretary of the Interior to permit additional imports from the United States Virgin Islands. Such delegated authority then could be used with the Director's existing authorities relating to Puerto Rico and the use of Western Hemisphere crude oil in the development of programs to assist in meeting these shortages.\n\nThe Director, with the advice of the Oil Policy Committee, has found that such changes would not adversely affect the national security.\n\nI agree with the findings and recommendations of the Director and deem it necessary and consistent with the security objectives of Proclamation No. 3279, as amended, to adjust the imports of petroleum and petroleum products, and to improve the administration of the program, as hereinafter provided.\n\nNow, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that, effective as of the date of this Proclamation, Proclamation No. 3279, as amended, is further amended as follows:\n\n1. Subparagraph (4) of paragraph (b) of section 3 is amended by adding the following sentence at the end thereof:\n\n\"Whenever the Secretary, upon recommendation of the Director of the Office of Emergency Preparedness, finds that there may be shortages in the supply of any finished product or products in Districts I—IV, which products are deemed by the Director of the Office of Emergency Preparedness to be important to the national security, the Secretary may allocate imports of any such product or products manufactured in the Virgin Islands in excess of the limitation in the preceding sentence for such product or products, for such time and under such conditions as he may deem consistent with the purposes of this proclamation.\"\n\n2. Section 3A is amended to read as follows:\n\n\"Commencing with the allocation period January 1, 1973, through December 31, 1973, the Secretary, with the concurrence of the Director of the Office of Emergency Preparedness, is authorized to make an interim allocation for any allocation period or portion thereof to any person who held an allocation of imports of crude oil and unfinished oils or of No. 2 fuel oil during the preceding allocation period. No such interim allocation shall exceed the like allocation held in such preceding allocation period by such person. However, the Secretary may adjust the allocation to any person limited by the previous sentence if such person would have been eligible for a larger allocation in 1973 under the regulations applicable during the allocation period commencing January 1, 1972. Any license issued under such interim allocation may be utilized for imports hereafter entering the United States prior to December 31, 1972, if authorized by the Secretary. Any allocation subsequently made to any person who receives an interim allocation pursuant to this section, shall be reduced by an amount equal to the interim allocation made pursuant to this section.\"\n\nIn Witness Whereof, I have hereunto set my hand this 16th day of December, in the year of our Lord nineteen hundred seventy-two and of the Independence of the United States of America the one hundred ninety-seventh.\n\nRICHARD NIXON","M24":"Memorandum for the Heads of Executive Departments and Agencies\n\nSubject: Driving Innovation and Creating Jobs in Rural America through Biobased and Sustainable Product Procurement\n\nThe BioPreferred program—established by the Farm Security and Rural Investment Act of 2002 (Public Law 107-171)(2002 Farm Bill), and strengthened by the Food, Conservation and Energy Act of 2008 (Public Law 110-234)(2008 Farm Bill)—is intended to increase Federal procurement of biobased products to promote rural economic development, create new jobs, and provide new markets for farm commodities. Biobased and sustainable products help to increase our energy security and independence.\n\nThe Federal Government, with leadership from the Department of Agriculture (USDA), has made significant strides in implementing the BioPreferred program. It is one of the key elements in my efforts to promote sustainable acquisition throughout the Government under Executive Order 13514 of October 5, 2009 (Federal Leadership in Environmental, Energy, and Economic Performance). Further efforts will drive innovation and economic growth and create jobs at marginal cost to the American public.\n\nThe goal of this memorandum is to ensure that executive departments and agencies (agencies) effectively execute Federal procurement requirements for biobased products, including those requirements identified in Executive Order 13514 and prescribed in the 2002 Farm Bill, as amended by the 2008 Farm Bill. It is vital that these efforts are in accord and carefully coordinated with other Federal procurement requirements.\n\nTherefore, I direct that agencies take the following steps to
