693 of July 24, 2011 (Suspension of Entry of Aliens Subject to United Nations Security Council Travel Bans and International Emergency Economic Powers Act Sanctions). Sec. 7. For the purposes of this order: (a) the term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization; (b) the term \"noncitizen\" means any person who is not a citizen or noncitizen national of the United States; (c) the term \"person\" means an individual or entity; and (d) the term \"United States person\" means any United States citizen, lawful permanent resident, entity organized under the laws of the United States or any jurisdiction within the United States (including foreign branches), or any person in the United States. Sec. 8.","7":"For those persons whose property and interests in property are blocked pursuant to this order who might have a constitutional presence in the United States, I find that because of the ability to transfer funds or other assets instantaneously, prior notice to such persons of measures to be taken pursuant to this order would render those measures ineffectual.","8":"I therefore determine that for these measures to be effective in addressing the national emergency declared in Executive Order 13067, and expanded by Executive Order 13400 and this order, there need be no prior notice of a listing or determination made pursuant to section 1 of this order.","9":"Sec. 9.","10":"The Secretary of the Treasury, in consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to the President by IEEPA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may, consistent with applicable law, redelegate any of these functions within the Department of the Treasury.","11":"All agencies of the United States shall take all appropriate measures within their authority to implement this order. Sec. 10. Nothing in this order shall prohibit transactions for the conduct of the official business of the Federal Government or the United Nations (including its specialized agencies, programs, funds, and related organizations) by employees, grantees, or contractors thereof. Sec. 11. Nothing in this order is intended to affect the continued effectiveness of any action taken pursuant to Executive Order 13761 of January 13, 2017 (Recognizing Positive Actions by the Government of Sudan and Providing for the Revocation of Certain Sudan-Related Sanctions), and Executive Order 13804 of July 11, 2017 (Allowing Additional Time for Recognizing Positive Actions by the Government of Sudan and Amending Executive Order 13761). Sec. 12. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"M13":{"1":"In December 1994, I directed the National Institutes of Health not to fund the creation of human embryos for research purposes. The Congress extended this prohibition in FY 1996 and FY 1997 appropriations bills, barring the Department of Health and Human Services from supporting certain human embryo research. However, these restrictions do not explicitly cover human embryos created for implantation and do not cover all Federal agencies. I want to make it absolutely clear that no Federal funds will be used for human cloning.","2":"Therefore, I hereby direct that no Federal funds shall be allocated for cloning of human beings."},"P50":{"1":"In Proclamation 9705, I further stated that any country with which we have a security relationship is welcome to discuss with the United States alternative ways to address the threatened impairment of the national security caused by imports from that country, and noted that, should the United States and any such country arrive at a satisfactory alternative means to address the threat to the national security such that I determine that imports from that country no longer threaten to impair the national security, I may remove or modify the restriction on steel article imports from that country and, if necessary, adjust the tariff as it applies to other countries, as the national security interests of the United States require. 4. In Proclamation 9740 of April 30, 2018 (Adjusting Imports of Steel Into the United States), I noted that the United States had agreed in principle with the Federative Republic of Brazil (Brazil) on satisfactory alternative means to address the threatened impairment to our national security posed by steel articles imported from Brazil. In Proclamation 9759 of May 31, 2018 (Adjusting Imports of Steel Into the United States), I noted that the United States had agreed on measures with Brazil that would provide effective, long-term alternative means to address Brazil's contribution to the threatened impairment to our national security. These included quantitative limitations that restrict the volume of steel articles imported into the United States from Brazil.","2":"In light of these agreed-upon measures, I determined that steel article imports from Brazil would no longer threaten to impair the national security and decided to exclude Brazil from the tariff proclaimed in Proclamation 9705, as amended. I further noted that the United States would monitor the implementation and effectiveness of those measures to address our national security needs. 5.","3":"In Proclamation 9759, I also directed the Secretary to monitor implementation of quantitative limitations applicable to steel article imports from Brazil and inform me of any circumstance that in the Secretary's opinion might indicate that an adjustment of the quantitative limitations is necessary. 6. The Secretary has advised me that there have been significant changes in the United States steel market since the time I decided to exclude, on a long-term basis, Brazil from the tariff proclaimed in Proclamation 9705, as amended. The United States steel market has contracted in 2020. After increasing in 2018 and 2019, steel shipments by domestic producers through June of this year are approximately 15 percent lower than shipments for the same time period in 2019, with shipments in April and May of this year more than 30 percent lower than the shipments in the same months in 2019. The Secretary has further advised me that domestic producers' adjusted year-to-date capacity utilization rate through August 15, 2020, is below 70 percent and that the current rate has been near or below 60 percent since the second week of April. Brazil is also the second largest source of steel imports to the United States and the largest source of imports of semi-finished steel products. Moreover, imports from most countries have declined this year in a manner commensurate with this contraction, whereas imports from Brazil have decreased only slightly. 7.","4":"In light of these significantly changed market conditions, I have determined that the alternative measures regarding Brazilian steel imports, without any modifications, will be ineffective in eliminating the threat to the national security posed by imports of such articles, in the current environment. The United States and Brazil have held consultations regarding Brazil's steel exports to the United States. As a result of these discussions, the United States will lower, for the remainder of 2020, one of the quantitative limitations set forth in Proclamation 9759 applicable to certain steel articles imported from Brazil. In my judgment, this modification will preserve the effectiveness of the alternative means to address the threatened impairment to our national security by further restraining steel article exports to the United States from Brazil during this period of market contraction.","5":"In light of this modification, I have determined that steel article imports from Brazil will not threaten to impair the national security and thus have decided to continue to exclude Brazil from the tariff proclaimed in Proclamation 9705, as amended. The United States and Brazil will hold further consultations in December 2020 to discuss the state of the steel trade between the two countries in light of then-prevailing market conditions. 8. I have been informed that a reduction in this quantitative limitation set forth in Proclamation 9759 applicable to certain steel article imports from Brazil may delay or disrupt specific production activities in the United States for which imports of the steel articles covered by the quantitative limitation have already been contracted for delivery in the fourth quarter of this year.","6":"In light of these circumstances, and after considering the impact on the economy and the national security objectives of section 232 of the Trade Expansion Act of 1962, as amended, I have determined to direct the Secretary to provide relief from the quantitative limitation set forth in this proclamation in certain limited circumstances specified in more detail below, in addition to the relief from the quantitative limitations that the Secretary is already authorized to provide pursuant to clause 1 of Proclamation 9777 of August 29, 2018 (Adjusting Imports of Steel Into the United States). 9. Section 232 of the Trade Expansion Act of 1962, as amended, authorizes the President to adjust the imports of an article and its derivatives that are being imported into the United States in such quantities or under such circumstances as to threaten to impair the national security of the United States. 10. Section 604 of the Trade Act of 1974, as amended (19 U.S.C. 2483), authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTSUS) the substance of statutes affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.","7":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including section 232 of the Trade Expansion Act of 1962, as amended, section 301 of title 3, United States Code, and section 604 of the Trade Act of 1974, as amended, do hereby proclaim as follows: (1) For purposes of administering the quantitative limitation applicable to subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil, the annual aggregate limit for Brazil set out in the Annex to this proclamation shall apply for calendar year 2020.","8":"This aggregate limit, which shall take into account all steel article imports from Brazil covered by this subheading since January 1, 2020, shall be effective for steel articles entered for consumption, or withdrawn from warehouse for consumption, under this subheading, between August 28, 2020 and December 31, 2020. For calendar year 2021 and for subsequent years, the annual aggregate limit for Brazil shall revert to the aggregate limit for Brazil set forth in the Annex to Proclamation 9759, unless that limit is further modified or terminated. (2) The Secretary shall, on an expedited basis, grant relief from the quantitative limitation applicable to subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil, as set out in the Annex to this proclamation, for any steel article where (i) the party requesting relief entered into a contract or other written agreement for the production and shipment of such steel article before August 28, 2020; (ii) such agreement specifies the quantity of such steel article that is to be produced and shipped to the United States prior to December 31, 2020; (iii) such steel article is to be used in production activities in the United States and such steel article cannot be procured from another supplier to meet the delivery schedule and specifications contained in such agreement; and (iv) lack of relief from the quantitative limitation on such steel article would significantly disrupt the production activity in the United States for which the steel article specified in such agreement is intended. The volume of imports for which the Secretary grants relief under this clause shall not exceed 60,000,000 kilograms in the aggregate. (3) The Secretary shall grant relief under clause 2 of this proclamation only upon receipt of a sworn statement signed by the chief executive officer and the chief legal officer of the party requesting relief, attesting that (i) the steel article for which relief is sought and the associated contract or other written agreement meet the criteria for relief set forth in clause 2(i) through (iv) of this proclamation; (ii) the party requesting relief will accurately report to U.S. Customs and Border Protection (CBP), in the manner that CBP prescribes, the quantity of steel articles entered for consumption, or withdrawn from warehouse for consumption, pursuant to any grant of relief; and (iii) the quantity of steel articles entered pursuant to a grant of relief will not exceed the quantity for which the Secretary has granted relief. The Secretary shall notify CBP of any grant of relief made pursuant to this proclamation. The Secretary shall revoke any grant of relief under clause 2 of this proclamation if the Secretary determines at any time after such grant that the criteria for relief have not been met and may, if the Secretary deems it appropriate, notify the Attorney General of the facts that led to such revocation.","9":"(4) As soon as practicable, the Secretary shall issue procedures for the requests for relief described in clauses 2 and 3 of this proclamation. The issuance of such procedures is exempt from Executive Order 13771 of January 30, 2017 (Reducing Regulation and Controlling Regulatory Costs).","10":"CBP shall implement relief provided under clause 2 of this proclamation as soon as practicable. (5) Until such time as the applicable quantitative limitation provided in subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil has been reached, CBP shall count any steel article for which relief is granted under clause 2 of this proclamation toward such quantitative limitation at the time when such steel article is entered for consumption or withdrawn from warehouse for consumption. Any steel article for which relief is granted under clause 2 of this proclamation must be entered for consumption, or withdrawn from warehouse for consumption, on or before December 31, 2020, and, before January 1, 2021, further relief may not be granted for such article by the Secretary under clause 1 of Proclamation 9777.","11":"Steel articles for which relief is granted under clause 2 of this proclamation shall be subject to the duty treatment provided in subheading 9903.80.62 of subchapter III of chapter 99 of the HTSUS for Brazil, as established by the Annex to this proclamation.","12":"(6) Subdivision (a)(iii) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking \"9903.80.61\" and inserting in its place \"9903.80.62\".","13":"(7) Subdivision (c) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking, in the last sentence, \"and 9903.80.61\" and inserting in its place: \", 9903.80.61, and 9903.80.62\".","14":"(8) Subdivision (d) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking, in the first sentence, \"and 9903.80.61\" and inserting in its place: \"through 9903.80.62\".","15":"(9) The superior text to subheadings 9903.80.05 through 9903.80.58 of subchapter III of chapter 99 of the HTSUS is amended by striking \"and 9903.80.61\" and inserting in its place: \"through 9903.80.62\". (10) To implement clause 2 of this proclamation, subchapter III of chapter 99 of the HTSUS is modified as provided in the Annex to this proclamation. (11) The modifications to the HTSUS made by clauses 6 through 10 of this proclamation and the Annex to this proclamation shall be effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on August 28, 2020, and shall continue in effect, unless such actions are expressly reduced, modified, or terminated. (12) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency."},"P36":{"1":"Whereas I find and declare that adjustments must be made in the imports of crude oil, unfinished oils, and finished products, so that such imports will not so threaten to impair the national security; and","2":"Whereas I find and declare that within the continental United States there are two areas, one, east of the Rocky Mountains (Districts I-IV), in which there is substantial oil production capacity in excess of actual production, and the other. west of the Rocky Mountains (District V), in which production is declining and in which, due to the absence of any significant inter-area flow of oil, limited imports are necessary to meet demand, and that accordingly, imports into such areas must be treated differently to avoid discouragement of and decrease in domestic oil production, exploration and development to the detriment of the national security; and","3":"Whereas I find and declare that the Commonwealth of Puerto Rico largely depends upon imported crude oil, unfinished oils, and finished products and that any system for the adjustment of imports of such commodities should permit imports into Puerto Rico adequate for the purposes of local consumption, export to foreign areas, and limited shipment of finished products to the continental United States:","4":"(a) In Districts I-IV, District V, and in Puerto Rico, on and after March 11, 1959, no crude oil or unfinished oils may be entered for consumption or withdrawn from warehouse for consumption, and on and after April 1, 1959, no finished products may be entered for consumption or withdrawn from warehouse for consumption, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries and withdrawals may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section. (b) Until the Secretary of the Interior is able to make allocations and issue licenses, he may, subject to such conditions as he may deem appropriate, temporarily authorize such entries and withdrawals without licenses and the quantities so entered or withdrawn shall be deducted from any allocation subsequently made by the Secretary to any person who has made any such entry or withdrawal. (c) In Districts I-IV, District V, and in Puerto Rico, on and after April 1, 1959, no department, establishment, or agency of the United States shall import finished products in excess of the respective allocations made to them by the Secretary of the Interior. Such allocations shall be within the maximum levels of imports established in section 2 of this proclamation. SEC. 2. (a) (1) In Districts I-IV the maximum level of imports of crude oil, unfinished oils, and finished products, except residual fuel oil to be used as fuel, shall be approximately 9% of total demand in these districts, as estimated by the Bureau of Mines for periods fixed by the Secretary of the Interior. Within this maximum level, imports of finished products, exclusive of residual fuel oil to be used as fuel, shall not exceed the level of imports of such products into these districts during the calendar year 1957 and imports of unfinished oils shall not exceed 10% of the permissible imports of crude oil and unfinished oils. (2) In Districts I-IV the imports of residual fuel oil to be used as fuel shall not exceed the level of imports of that product into these districts during the calendar year 1957. (b) In District V the maximum level of imports of crude oil, unfinished oils, and finished products shall be an amount which, together with domestic production and supply, will approximate total demand in this district as estimated by the Bureau of Mines for periods fixed by the Secretary. Within this maximum level imports of finished products shall not exceed the level of imports of such products into this district during the calendar year 1957 and imports of unfinished oils shall not exceed 10% of the permissible imports of crude oil and unfinished oils. (c) Such additional imports of crude oil may be permitted in addition to the maximum levels established in paragraphs (a) and (b) of this section as are necessary to meet the minimum requirements of refiners, and pipeline companies using crude oil directly as fuel, which are not able to obtain sufficient quantities of domestic crude oil by ordinary and continuous means, such as by barges, pipelines, or tankers. (d) The maximum level of imports of crude oil, unfinished oils, and finished products into Puerto Rico shall be approximately the level of imports into Puerto Rico during all or part of the calendar year 1958, as determined by the Secretary of the Interior to be consonant with the purposes of this proclamation, or such lower or higher levels as the Secretary may subsequently determine are required to meet increases or decreases in local demand in Puerto Rico or demand for export to foreign areas. (e) The Secretary of the Interior shall keep under review the imports into Districts I-IV and into District V of residual fuel oil to be used as fuel and the Secretary may make, on a monthly basis if required, such adjustments in the maximum level of such imports as he may determine to be consonant with the objectives of this proclamation. (f) The levels established, and the total demand referred to, in this section do not include free withdrawals by persons pursuant to section 309 of the Tariff Act of 1930, as amended (19 U.S.C. 1309), or petroleum supplies for vessels or aircraft operated by the United States between points referred to in said section 309 (as to vessels or aircraft, respectively) or between any point in the United States or its possessions and any point in a foreign country. SEC. 3.","5":"(a) The Secretary of the Interior is hereby authorized to issue regulations for the purpose of implementing this proclamation.","6":"Such regulations shall be consistent with the levels established in this proclamation for imports of crude oil, unfinished oils, and finished products into Districts I-IV, into District V, and into Puerto Rico, and shall provide for a system of allocation of the authorized imports of such crude oil, unfinished oils and finished products and for the issuance of licenses pursuant to such system, with such restrictions upon the transfer of allocations and licenses as may be deemed appropriate to further the purposes of this proclamation.","7":"(b) (1) With respect to the allocations of imports of crude oil and unfinished oils into Districts I-IV, and into District V, such regulations shall provide, to the extent possible, for a fair and equitable distribution among persons having refinery capacity in these districts in relation to refinery inputs during an appropriate period or periods selected by the Secretary and may provide for distribution in such manner as to avoid drastic reductions below the last allocations under the Voluntary Oil Import Program.","8":"Such regulations also shall provide for allocations of crude oil to persons having operating refinery capacity or having pipeline facilities using crude oil directly as fuel who show inability to obtain sufficient quantities of domestic crude oil by ordinary and continuous means, such as barges, pipelines, or tankers.","9":"(2) Such regulations shall provide for the allocation of imports of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in relation to refinery inputs during all or a part of the calendar year 1958 as the Secretary may determine. (3) Such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery except that exchanges for domestic crude or unfinished oils may be made if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery. However, persons receiving allocations of crude oil on the basis of inability to obtain sufficient domestic crude by ordinary and continuous means shall not be permitted to make exchanges. (4) With respect to the allocations of imports of finished products into Districts I—IV, District V, and Puerto Rico, such regulations shall, to the extent possible, result in a fair and equitable distribution of such products among persons who have been importers of finished products during the respective base periods specified in section 2 of this proclamation. (c) Such regulations may provide for the revocation or suspension by the Secretary of any allocation or license on grounds relating to the national security, or the violation of the terms of this proclamation, or of any regulation or license issued pursuant to this proclamation. SEC. 4.","10":"For the purpose of hearing and considering appeals or petitions by persons affected by the regulations issued by the Secretary of the Interior, he is authorized to provide for the establishment and operation of an Appeal Board, comprised of one representative each from the Departments of the Interior, Defense, and Commerce to be designated, respectively, by the heads of such Departments. Such representatives shall be of the rank of Deputy Assistant Secretary or higher. The Appeal Board may be empowered, on grounds of hardship, error, or other relevant special consideration, but within the limits of the maximum levels of imports established in section 2 of this proclamation (1) to modify any allocation made to any person under the regulations issued pursuant to section 3 of this proclamation, (2) to grant allocations of crude oil and unfinished oils in special circumstances to persons with importing histories who do not qualify for allocations under such regulations; and (3) to review the revocation or suspension of any allocation or license. The Secretary may provide that such decisions by the Appeal Board shall be final. SEC. 5.","11":"Persons who apply for allocations of crude oil, unfinished oils, or finished products and persons to whom such allocations have been made shall furnish to the Secretary of the Interior such information and shall make such reports as he may require, by regulation or otherwise, in the discharge of his responsibilities under this proclamation. SEC. 6. (a) The Director of the Office of Civil and Defense Mobilization shall maintain a constant surveillance of imports of petroleum and its primary derivatives in respect of the national security and, after consultation with the Secretaries of State, Defense, Treasury, the Interior, Commerce, and Labor, he shall inform the President of any circumstances which, in the Director's opinion might indicate the need for further Presidential action under section 2 of the act of July 1, 1954, as amended. In the event prices of crude oil or its products or derivatives should be increased after the effective date of this proclamation, such surveillance shall include a determination as to whether such increase or increases are necessary to accomplish the national security objectives of the act of July 1, 1954, as amended, and of this proclamation. (b) The Special Committee to Investigate Crude Oil Imports is hereby discharged of its responsibilities. SEC. 7. The Secretary of the Interior may delegate, and provide for successive redelegation of, the authority conferred upon him by this proclamation.","12":"All departments and agencies of the Executive branch of the Government shall cooperate with and assist the Secretary of the Interior in carrying out the purposes of this proclamation. SEC. 8.","13":"Executive Order 10761 of March 27, 1958, entitled \"Government Purchases of Crude Petroleum and Petroleum Products\" (23 F.R. 2067) is hereby revoked as of April 1, 1959. SEC. 9. As used in this proclamation: (a) \"Person\" includes an individual, a corporation, firm, or other business organization or legal entity, and an agency of a state, territorial, or local government, but does not include a department, establishment, or agency of the United States; (b) \"Districts I-IV\" means the District of Columbia and all of the States of the United States except those States within District V; (c) \"District V\" means the States of Arizona, Nevada, California, Oregon, Washington, Alaska, and the Territory of Hawaii; (d) \"Crude oil\" means crude petroleum as it is produced at the wellhead; (e) \"Finished Products\" means any one or more of the following petroleum oils, or a mixture or combination of such oils, which are to be used without further processing except blending by mechanical means: (1) liquefied gases—hydrocarbon gases recovered from natural gas or produced from petroleum refining and kept under pressure to maintain a liquid state at ambient temperatures; (2) gasoline—a refined petroleum distillate which, by its composition, is suitable for use as a carburant in internal combustion engines; (3) jet fuel—a refined petroleum distillate used to fuel jet propulsion engines; (4) naphtha—a refined petroleum distillate falling within a distillation range overlapping the higher gasoline and the lower kerosenes; (5) fuel oil—a liquid or liquefiable petroleum product burned for lighting or for the generation of heat or power and derived directly or indirectly from crude oil, such as kerosene, range oil, distillate fuel oils, gas oil, diesel fuel, topped crude oil, residues; (6) lubricating oil—a refined petroleum distillate or specially treated petroleum residue used to lessen friction between surfaces; (7) residual fuel oil—a topped crude oil or viscous residuum which, as obtained in refining or after blending with other fuel oil, meets or is the equivalent of Military Specification Mil-F-859 for Navy Special Fuel Oil and any other more viscous fuel oil, such as No. 5 or Bunker C; (8) asphalt—a solid or semi-solid cementitious material which gradually liquefies when heated, in which the predominating constituents are bitumins, and which is obtained in refining crude oil. (f) \"Unfinished Oils\" means one or more of the petroleum oils listed in paragraph (e) of this section, or a mixture or combination of such oils, which are to be further processed other than by blending by mechanical means."},"M19":{"1":"I direct that you, in consultation with the Secretary of Defense and other appropriate officials, review and revise our policy with respect to the export of high technology and other strategic items to the Soviet Union. Pending review, no validated export licenses for shipment of goods or technical data to the Soviet Union are to be approved. This review is to reassess what exports will make a significant contribution to the military potential of the Soviet Union and therefore prove detrimental to the security of the United States in light of the Soviet intervention in Afghanistan.","2":"In addition, I direct that you immediately review those transactions for which validated licenses have already been issued but export has not occurred to determine whether any such licenses should be suspended or revoked in light of the changed national security circumstances.","3":"Finally, I direct that you, in consultation with the Secretary of State and other appropriate officials, determine whether certain transactions now under general license requirements should be subject to validated license requirements."},"EO30":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including sections 3301 and 3302 of title 5, United States Code, it is hereby ordered as follows: Section 1. Policy. The Federal Government benefits from a diverse workforce that includes students and recent graduates, who infuse the workplace with their enthusiasm, talents, and unique perspectives. The existing competitive hiring process for the Federal civil service, however, is structured in a manner that, even at the entry level, favors job applicants who have significant previous work experience. This structure, along with the complexity of the rules governing admission to the career civil service, creates a barrier to recruiting and hiring students and recent graduates. It places the Federal Government at a competitive disadvantage compared to private-sector employers when it comes to hiring qualified applicants for entry-level positions. To compete effectively for students and recent graduates, the Federal Government must improve its recruiting efforts; offer clear paths to Federal internships for students from high school through post-graduate school; offer clear paths to civil service careers for recent graduates; and provide meaningful training, mentoring, and career-development opportunities. Further, exposing students and recent graduates to Federal jobs through internships and similar programs attracts them to careers in the Federal Government and enables agency employers to evaluate them on the job to determine whether they are likely to have successful careers in Government.","2":"Accordingly, pursuant to my authority under 5 U.S.C. 3302(1), and in order to achieve a workforce that represents all segments of society as provided in 5 U.S.C. 2301(b)(1), I find that conditions of good administration (specifically, the need to promote employment opportunities for students and recent graduates in the Federal workforce) make necessary an exception to the competitive hiring rules for certain positions in the Federal civil service. Sec. 2. Establishment.","3":"There are hereby established the Internship Program and the Recent Graduates Program, which, along with the Presidential Management Fellows Program, as modified herein, shall collectively be known as the Pathways Programs.","4":"I therefore direct the Director of the Office of Personnel Management (OPM) to issue regulations implementing the Pathways Programs consistent with this order, including: (a) a description of the positions that executive departments and agencies (agencies) may fill through the Pathways Programs because conditions of good administration necessitate excepting those positions from the competitive hiring rules; (b) rules governing whether, to what extent, and in what manner public notice should be provided of job opportunities in the Pathways Programs; (c) a description of career-development, training, and mentorship opportunities for participants in the Pathways Programs;","5":"(d) requirements that managers meaningfully assess the performance of participants in the Pathways Programs to identify those who should be considered for conversion to career civil service positions; (e) a description of OPM oversight of agency use of the Pathways Programs to ensure that (i) they serve as a supplement to, and not a substitute for, the competitive hiring process, and (ii) agencies are using the Pathways Programs in a genuine effort to develop talent for careers in the civil service; (f) a description of OPM plans to evaluate agencies' effectiveness in recruiting and retaining talent using the Pathways Programs and of the satisfaction of Pathways Programs participants and their hiring managers; and (g) standard naming conventions across agencies, so that students and recent graduates can clearly understand and compare the career pathway opportunities available to them in the Federal Government. Sec. 3. Internship Program.","6":"The Internship Program shall provide students in high schools, community colleges, 4-year colleges, trade schools, career and technical education programs, and other qualifying educational institutions and programs, as determined by OPM, with paid opportunities to work in agencies and explore Federal careers while still in school. The Internship Program would replace the existing Student Career Experience Program, established pursuant to Executive Order 12015 of October 26, 1977. The following principles and policies shall govern the Internship Program: (a) Participants in the program shall be referred to as \"Interns\" and shall be students enrolled, or accepted for enrollment, in qualifying educational institutions and programs, as determined by OPM.","7":"(b) Subject to any exceptions OPM may establish by regulation, agencies shall provide Interns with meaningful developmental work and set clear expectations regarding the work experience of the intern. (c) Students employed by third-party internship providers but placed in agencies may, to the extent permitted by OPM regulations, be treated as participants in the Internship Program. Sec. 4. Recent Graduates Program.","8":"The Recent Graduates Program shall provide individuals who have recently graduated from qualifying educational institutions or programs with developmental experiences in the Federal Government intended to promote possible careers in the civil service. The following principles and policies shall govern the Recent Graduates Program: (a) Participants in the program shall be referred to as \"Recent Graduates\" and must have obtained a qualifying degree, or completed a qualifying career or technical education program, as determined by OPM, within the preceding 2 years, except that veterans who, due to their military service obligation, were precluded from participating in the Recent Graduates Program during the 2-year period after obtaining a qualifying degree or completing a qualifying program shall be eligible to participate in the Program within 6 years of obtaining a qualifying degree or completing a qualifying program. (b) Responsibilities assigned to a Recent Graduate shall be consistent with his or her qualifications, educational background, and career interests, the purpose of the Recent Graduates Program, and agency needs. Sec. 5. Presidential Management Fellows Program. The Presidential Management Fellows (PMF) Program is an existing program established pursuant to Executive Order 13318 of November 21, 2003, that aims to attract to the Federal service outstanding men and women from a variety of academic disciplines at the graduate level who have a clear interest in, and commitment to, the leadership and management of public policies and programs. The following requirements shall govern the PMF Program upon the revocation of Executive Order 13318, as provided in section 8 of this order: (a) Participants in this program shall continue to be known as Presidential Management Fellows (PMFs or Fellows) and must have received, within the preceding 2 years, a qualifying advanced degree, as determined by OPM. (b) Responsibilities assigned to a PMF shall be consistent with the PMF's qualifications, educational background, and career interests, the purposes of the PMF Program, and agency needs.","9":"(c) OPM shall establish the eligibility requirements and minimum qualifications for the program, as well as a process for assessing eligible individuals for consideration for appointment as PMFs. Sec. 6. Appointment and Conversion. (a) Appointments to any of the Pathways Programs shall be under Schedule D of the excepted service, as established by section 7 of this order. (b) Appointments to the Recent Graduates or PMF Programs shall not exceed 2 years, unless extended by the employing agency for up to 120 days thereafter. (c) Appointment to a Pathways Program shall confer no right to further Federal employment in either the competitive or excepted service upon the expiration of the appointment, except that agencies may convert eligible participants noncompetitively to term, career, or career conditional appointments after satisfying requirements to be established by OPM, and agencies may noncompetitively convert participants who were initially converted to a term appointment under this section to a career or career-conditional appointment before the term appointment expires. Sec. 7. Implementation.","10":"(i) 5 CFR 6.1(a) is amended to read: OPM may except positions from the competitive service when it determines that (A) appointments thereto through competitive examination are not practicable, or (B) recruitment from among students attending qualifying educational institutions or individuals who have recently completed qualifying educational programs can better be achieved by devising additional means for recruiting and assessing candidates that diverge from the processes generally applicable to the competitive service. These positions shall be listed in OPM's annual report for the fiscal year in which the exceptions are made.","11":"(ii) 5 CFR 6.2 is amended to read: OPM shall list positions that it excepts from the competitive service in Schedules A, B, C, and D, which schedules shall constitute parts of this rule, as follows: Schedule A. Positions other than those of a confidential or policy-determining character for which it is not practicable to examine shall be listed in Schedule A.","12":"Schedule B. Positions other than those of a confidential or policy-determining character for which it is not practicable to hold a competitive examination shall be listed in Schedule B. Appointments to these positions shall be subject to such noncompetitive examination as may be prescribed by OPM. Schedule C. Positions of a confidential or policy-determining character shall be listed in Schedule C. Schedule D. Positions other than those of a confidential or policy-determining character for which the competitive service requirements make impracticable the adequate recruitment of sufficient numbers of students attending qualifying educational institutions or individuals who have recently completed qualifying educational programs. These positions, which are temporarily placed in the excepted service to enable more effective recruitment from all segments of society by using means of recruiting and assessing candidates that diverge from the rules generally applicable to the competitive service, shall be listed in Schedule D.","13":"(iii) The first sentence of 5 CFR 6.4 is amended to read: Except as may be required by statute, the Civil Service Rules and Regulations shall not apply to removals from positions listed in Schedules A, C, or D or from positions excepted from the competitive service by statute. The second sentence of 5 CFR 6.4 is to remain unchanged.","14":"(iv) The first sentence of 5 CFR 6.6 is amended to read: OPM may remove any position from or may revoke in whole or in part any provision of Schedule A, B, C, or D. The second sentence of 5 CFR 6.6 is to remain unchanged. (b) The Director of OPM shall: (i) promulgate such regulations as the Director determines may be necessary to implement this order; (ii) provide oversight of the Pathways Programs; (iii) establish, if appropriate, a Government-wide cap on the number of noncompetitive conversions to the competitive service of Interns, Recent Graduates, or PMFs (or a Government-wide combined conversion cap applicable to all three categories together); (iv) administer, and review and revise annually or as needed, any Government-wide cap established pursuant to this subsection; (v) provide guidance on conducting an orderly transition from existing student and internship programs to the Pathways Programs established pursuant to this order; and (vi) consider for publication in the Federal Register at an appropriate time a proposed rule seeking public comment on the elimination of the Student Temporary Employment Program, established through OPM regulations at 5 CFR 213.3202(a). (c) In accordance with regulations prescribed pursuant to this order and applicable law, agencies shall: (i) use appropriate merit-based procedures for recruitment, assessment, placement, and ongoing career development for participants in the Pathways Programs; (ii) provide for equal employment opportunity in the Pathways Programs without Regard to race, ethnicity, color, religion, sex, national origin, age, disability, sexual orientation, or any other non-merit-based factor; (iii) apply veterans' preference criteria; and (iv) within 45 days of the date of this order, designate a Pathways Programs Officer (at the agency level, or at bureaus or components within the agency) to administer Pathways Programs, to serve as liaison with OPM, and to report to OPM on the implementation of the Pathways Programs and the individuals hired under them. Sec. 8. Prior Executive Orders. (a) Effective March 1, 2011, Executive Order 13162 (Federal Career Intern Program) is superseded and revoked. Any individuals serving in appointments under that order on March 1, 2011, shall be converted to the competitive service, effective on that date, with no loss of pay or benefits. (b) On the effective date of final regulations promulgated by the Director of OPM to implement the Internship Program, Executive Order 12015 (pursuant to which the Student Career Experience Program was established), as amended, is superseded and revoked. (c) On the effective date of final regulations promulgated by the Director of OPM to implement changes to the PMF Program required by this order, Executive Order 13318 (Presidential Management Fellows Program), as amended, is superseded and revoked. Sec. 9. General Provisions.","15":"(a) This order shall be implemented consistent with applicable law and subject to the availability of appropriations. (b) Nothing in this order shall be construed to impair or otherwise affect: (i) authority granted by law, regulation, Executive Order, or Presidential Directive to an executive department, agency, or head thereof; or (ii) functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"P41":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, by the authority vested in me by section 2 of the Act of June 8, 1906 (34 Stat. 225, 16 U.S.C. 431), do proclaim that there are hereby set apart and reserved as the Northwestern Hawaiian Islands Marine National Monument (the \"monument\" or \"national monument\") for the purpose of protecting the objects described above, all lands and interests in lands owned or controlled by the Government of the United States within the boundaries described on the accompanying map entitled \"Northwestern Hawaiian Islands Marine National Monument\" attached to and forming a part of this proclamation. The Federal land and interests in land reserved includes approximately 139,793 square miles of emergent and submerged lands and waters of the Northwestern Hawaiian Islands, which is the smallest area compatible with the proper care and management of the objects to be protected. All Federal lands and interests in lands within the boundaries of this monument are hereby appropriated and withdrawn from all forms of entry, location, selection, sale, or leasing or other disposition under the public land laws, including, but not limited to, withdrawal from location, entry, and patent under mining laws, and from disposition under all laws relating to mineral and geothermal leasing. The Secretary of Commerce, through the National Oceanic and Atmospheric Administration (NOAA), will have primary responsibility regarding management of the marine areas, in consultation with the Secretary of the Interior. The Secretary of the Interior, through the Fish and Wildlife Service (FWS), will have sole responsibility for management of the areas of the monument that overlay the Midway Atoll National Wildlife Refuge, the Battle of Midway National Memorial, and the Hawaiian Islands National Wildlife Refuge, in consultation with the Secretary of Commerce.","2":"The Secretary of Commerce and the Secretary of the Interior (collectively, the \"Secretaries\") shall review and, as appropriate, modify the interagency agreement developed for coordinated management of the Northwestern Hawaiian Islands Coral Reef Ecosystem Reserve, signed on May 19, 2006. To manage the monument, the Secretary of Commerce, in consultation with the Secretary of the Interior and the State of Hawaii, shall modify, as appropriate, the plan developed by NOAA's National Marine Sanctuary Program through the public sanctuary designation process, and will provide for public review of that plan. To the extent authorized by law, the Secretaries, acting through the FWS and NOAA, shall promulgate any additional regulations needed for the proper care and management of the objects identified above.","3":"The Secretary of State, in consultation with the Secretaries, shall take appropriate action to enter into negotiations with other governments to make necessary arrangements for the protection of the monument and to promote the purposes for which the monument is established.","4":"The Secretary of State, in consultation with the Secretaries, shall seek the cooperation of other governments and international organizations in furtherance of the purposes of this proclamation and consistent with applicable regional and multilateral arrangements for the protection and management of special marine areas. Furthermore, this proclamation shall be applied in accordance with international law. No restrictions shall apply to or be enforced against a person who is not a citizen, national, or resident alien of the United States (including foreign flag vessels) unless in accordance with international law.","5":"All activities and exercises of the Armed Forces shall be carried out in a manner that avoids, to the extent practicable and consistent with operational requirements, adverse impacts on monument resources and qualities. 4. In the event of threatened or actual destruction of, loss of, or injury to a monument resource or quality resulting from an incident, including but not limited to spills and groundings, caused by a component of the Department of Defense or the USCG, the cognizant component shall promptly coordinate with the Secretaries for the purpose of taking appropriate actions to respond to and mitigate the harm and, if possible, restore or replace the monument resource or quality. Commercial Fishing 1.","6":"The Secretaries shall ensure that any commercial lobster fishing permit","7":"shall be subject to a zero annual harvest limit. 2. Fishing for bottomfish and pelagic species.","8":"The Secretaries shall ensure that: a. Commercial fishing for bottomfish and associated pelagic species may continue within the monument for not longer than 5 years from the date of this proclamation provided that: (i) The fishing is conducted in accordance with a valid commercial bottomfish permit issued by NOAA; and (ii) Such permit is in effect on the date of this proclamation and is subsequently renewed pursuant to NOAA regulations at 50 CFR part 660 subpart E as necessary. b. Total landings for each fishing year may not exceed the following amounts: (i) 350,000 pounds for bottomfish species; and (ii) 180,000 pounds for pelagic species. c. Commercial fishing for bottomfish and associated pelagic species is prohibited in the monument after 5 years from the date of this proclamation. General Requirements","9":"The Secretaries shall ensure that any commercial fishing within the monument is conducted in accordance with the following restrictions and conditions: 1. A valid permit or facsimile of a valid permit is on board the fishing vessel and is available for inspection by an authorized officer; 2. No attempt is made to falsify or fail to make, keep, maintain, or submit any logbook or logbook form or other required record or report; 3. Only gear specifically authorized by the relevant permit issued under the Magnuson-Stevens Fishery Conservation and Management Act is allowed to be in the possession of a person conducting commercial fishing under this section; 4. Any person conducting commercial fishing notifies the Secretaries by telephone, facsimile, or electronic mail at least 72 hours before entering the monument and within 12 hours after leaving the monument; 5. All fishing vessels must carry an activated and functioning VMS unit on board at all times whenever the vessel is in the monument; 6. All fishing vessels must carry an observer when requested to do so by the Secretaries; and 7. The activity does not take place within any Ecological Reserve, any Special Preservation Area, or the Midway Atoll Special Management Area. Permitting Procedures and Criteria Subject to such terms and conditions as the Secretaries deem appropriate, a person may conduct an activity regulated by this proclamation if such activity is specifically authorized by a permit. The Secretaries, in their discretion, may issue a permit under this proclamation if the Secretaries find that the activity: (i) is research designed to further understanding of monument resources and qualities; (ii) will further the educational value of the monument; (iii) will assist in the conservation and management of the monument; (iv) will allow Native Hawaiian practices; (v) will allow a special ocean use; or (vi) will allow recreational activities. Findings 1. The Secretaries may not issue any permit unless the Secretaries find: a. The activity can be conducted with adequate safeguards for the resources and ecological integrity of the monument; b. The activity will be conducted in a manner compatible with the management direction of this proclamation, considering the extent to which the conduct of the activity may diminish or enhance monument resources, qualities, and ecological integrity, any indirect, secondary, or cumulative effects of the activity, and the duration of such effects; c. There is no practicable alternative to conducting the activity within the monument; d. The end value of the activity outweighs its adverse impacts on monument resources, qualities, and ecological integrity; e. The duration of the activity is no longer than necessary to achieve its stated purpose; f. The applicant is qualified to conduct and complete the activity and mitigate any potential impacts resulting from its conduct; g. The applicant has adequate financial resources available to conduct and complete the activity and mitigate any potential impacts resulting from its conduct; h. The methods and procedures proposed by the applicant are appropriate to achieve the proposed activity's goals in relation to their impacts to monument resources, qualities, and ecological integrity; i. The applicant's vessel has been outfitted with a mobile transceiver unit approved by OLE and complies with the requirements of this proclamation; and j. There are no other factors that would make the issuance of a permit for the activity inappropriate. 2. Additional Findings for Native Hawaiian Practice Permits. In addition to the findings listed above, the Secretaries shall not issue a permit to allow Native Hawaiian practices unless the Secretaries find: a. The activity is non-commercial and will not involve the sale of any organism or material collected; b. The purpose and intent of the activity are appropriate and deemed necessary by traditional standards in the Native Hawaiian culture (pono), and demonstrate an understanding of, and background in, the traditional practice, and its associated values and protocols; c. The activity benefits the resources of the Northwestern Hawaiian Islands and the Native Hawaiian community; d. The activity supports or advances the perpetuation of traditional knowledge and ancestral connections of Native Hawaiians to the Northwestern Hawaiian Islands; and e. Any monument resource harvested from the monument will be consumed in the monument. 3. Additional Findings, Criteria, and Requirements for Special Ocean Use Permits a. In addition to the findings listed above, the following requirements apply to the issuance of a permit for a special ocean use: (i) Any permit for a special ocean use issued under this section: (A) Shall authorize the conduct of an activity only if that activity is compatible with the purposes for which the monument is designated and with protection of monument resources; (B) Shall not authorize the conduct of any activity for a period of more than 5 years unless renewed by the Secretaries; (C) Shall require that activities carried out under the permit be conducted in a manner that does not destroy, cause the loss of, or injure monument resources; and (D) Shall require the permittee to purchase and maintain comprehensive general liability insurance, or post an equivalent bond, against claims arising out of activities conducted under the permit and to agree to hold the United States harmless against such claims; and","10":"(ii) Each person issued a permit for a special ocean use under this section shall submit an annual report to the Secretaries not later than December 31 of each year that describes activities conducted under that permit and revenues derived from such activities during the year. b. The Secretaries may not issue a permit for a special ocean use unless they determine that the proposed activity will be consistent with the findings listed above for the issuance of any permit. c. Categories of special ocean use being permitted for the first time under this section will be restricted in duration and permitted as a special ocean use pilot project. Subsequent permits for any category of special ocean use may be issued only if a special ocean use pilot project for that category has been determined by the Secretaries to meet the criteria in this proclamation and any terms and conditions placed on the permit for the pilot project. d.","11":"The Secretaries shall provide public notice prior to requiring a special ocean use permit for any category of activity not previously identified as a special ocean use. e. The following requirements apply to permits for a special ocean use for an activity within the Midway Atoll Special Management Area. (i) The Secretaries may issue a permit for a special ocean use for activities within the Midway Atoll Special Management Area provided: (A) The Secretaries find the activity furthers the conservation and management of the monument; and (B) The Director of the United States Fish and Wildlife Service or his or her designee has determined that the activity is compatible with the purposes for which the Midway Atoll National Wildlife Refuge was designated. (ii) As part of a permit, the Secretaries may allow vessels to transit the monument as necessary to enter the Midway Atoll Special Management Area. f. The Secretaries may issue a permit for a special ocean use for activities outside the Midway Atoll Special Management Area provided: (i) The Secretaries find the activity will directly benefit the conservation and management of the monument; (ii) The Secretaries determine the purpose of the activity is for research or education related to the resources or qualities of the monument; (iii)The Secretaries provide public notice of the application and an opportunity to provide comments at least 30 days prior to issuing the permit; and (iv) The activity does not involve the use of a commercial passenger vessel. 4. Additional Findings for Recreation Permits. The Secretaries may issue a permit only for recreational activities to be conducted within the Midway Atoll Special Management Area. In addition to the general findings listed above for any permit, the Secretaries may not issue such permit unless the Secretaries find: a. The activity is for the purpose of recreation as defined in regulation; b. The activity is not associated with any for-hire operation; and c. The activity does not involve any extractive use. Sustenance Fishing Sustenance fishing means fishing for bottomfish or pelagic species that are consumed within the monument, and is incidental to an activity permitted under this proclamation. The Secretaries may permit sustenance fishing outside of any Special Preservation Area as a term or condition of any permit issued under this proclamation. The Secretaries may not permit sustenance fishing in the Midway Atoll Special Management Area unless the activity has been determined by the Director of the United States Fish and Wildlife Service or his or her designee to be compatible with the purposes for which the Midway Atoll National Wildlife Refuge was established. Sustenance fishing must be conducted in a manner compatible with this proclamation, including considering the extent to which the conduct of the activity may diminish monument resources, qualities, and ecological integrity, as well as any indirect, secondary, or cumulative effects of the activity and the duration of such effects. The Secretaries will develop procedures for systematic reporting of sustenance fishing. Definitions For purposes of this proclamation: Attract or Attracting means luring or attempting to lure a living resource by any means, except the mere presence of human beings (e.g., swimmers, divers, boaters). Bottomfish Species means bottomfish management unit species as defined at 50 CFR 660.12. Commercial Bottomfishing means commercial fishing for bottomfish species. Commercial Passenger Vessel means a vessel that carries individuals who have paid for such carriage. Commercial Pelagic Trolling means commercial fishing for pelagic species. Deserting a vessel means: 1. Leaving a vessel aground or adrift: (i) Without notifying the Secretaries of the vessel going aground or adrift within 12 hours of its discovery and developing and presenting to the Secretaries a preliminary salvage plan within 24 hours of such notification; (ii) After expressing or manifesting intention to not undertake or to cease salvage efforts; or (iii)When the Secretaries are unable, after reasonable efforts, to reach the owner/operator within 12 hours of the vessels condition being reported to authorities. 2. Leaving a vessel at anchor when its condition creates potential for a grounding, discharge, or deposit and the owner/operator fails to secure the vessel in a timely manner. Ecological Reserve means an area of the monument consisting of contiguous, diverse habitats that provide natural spawning, nursery, and permanent residence areas for the replenishment and genetic protection of marine life, and also to protect and preserve natural assemblages of habitats and species within areas representing a broad diversity of resources and habitats found within the monument. Ecological Integrity means a condition determined to be characteristic of an ecosystem that has the ability to maintain the function, structure, and abundance of natural biological communities, including rates of change in response to natural environmental variation. Fishing Year means the year beginning at 0001 local time on January 1 and ending at 2400 local time on December 31. Introduced Species means: 1. A species (including, but not limited to, any of its biological matter capable of propagation) that is non-native to the ecosystem(s) protected by the monument; or 2. Any organism into which genetic matter from another species has been transferred in order that the host organism acquires the genetic traits of the transferred genes. Landing means offloading fish from a fishing vessel or causing fish to be offloaded from a fishing vessel. Midway Atoll Special Management Area means the area of the monument surrounding Midway Atoll out to a distance of 12 nautical miles, established for the enhanced management, protection, and preservation of monument wildlife and historical resources. Mobile Transceiver Unit means a vessel monitoring system or VMS device installed on board a vessel that is used for vessel monitoring and transmitting the vessel's position as required by this proclamation. Native Hawaiian Practices means cultural activities conducted for the purposes of perpetuating traditional knowledge, caring for and protecting the environment, and strengthening cultural and spiritual connections to the Northwestern Hawaiian Islands that have demonstrable benefits to the Native Hawaiian community. This may include, but is not limited to, the non-commercial use of monument resources for direct personal consumption while in the monument. Ocean-Based Ecotourism means a class of fee-for-service activities that involves visiting the monument for study, enjoyment, or volunteer assistance for purposes of conservation and management. Pelagic Species means Pacific Pelagic Management Unit Species as defined at 50 CFR 660.12. Pono means appropriate, correct, and deemed necessary by traditional standards in the Hawaiian culture. Recreational Activity means an activity conducted for personal enjoyment that does not result in the extraction of monument resources and that does not involve a fee-for-service transaction. This includes, but is not limited to, wildlife viewing, SCUBA diving, snorkeling, and boating. Special Preservation Area (SPA) means discrete, biologically important areas of the monument within which uses are subject to conditions, restrictions, and prohibitions, including but not limited to access restrictions. SPAs are used to avoid concentrations of uses that could result in declines in species populations or habitat, to reduce conflicts between uses, to protect areas that are critical for sustaining important marine species or habitats, or to provide opportunities for scientific research. Special Ocean Use means an activity or use of the monument that is engaged in to generate revenue or profits for one or more of the persons associated with the activity or use, and does not destroy, cause the loss of, or injure monument resources. This includes ocean-based ecotourism and other activities such as educational and research activities that are engaged in to generate revenue, but does not include commercial fishing for bottomfish or pelagic species conducted pursuant to a valid permit issued by NOAA. Stowed and Not Available for Immediate Use means not readily accessible for immediate use, e.g., by being securely covered and lashed to a deck or bulkhead, tied down, unbaited, unloaded, or partially disassembled (such as spear shafts being kept separate from spear guns). Sustenance Fishing means fishing for bottomfish or pelagic species in which all catch is consumed within the monument, and that is incidental to an activity permitted under this proclamation. Vessel Monitoring System or VMS means a vessel monitoring system or mobile transceiver unit approved by the Office for Law Enforcement for use on vessels permitted to access the monument, as required by this subpart."},"P7":{"1":"On the basis of the information submitted to me, I find and declare that: (a) Sugars classified under items 155.20 and 155.30 of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202) are being or are practically certain to be imported into the United States under such conditions and in such quantities as to render or tend to render ineffective, or materially interfere with, the price support operations being conducted by the Department of Agriculture for sugar cane and sugar beets. (b) The imposition of the import fees hereinafter proclaimed is necessary in order that the entry, or withdrawal from warehouse for consumption, of such sugars will not render or tend to render ineffective, or materially interfere with, the price support operations being conducted by the Department of Agriculture for sugar beets and sugar cane.","2":"Now, Therefore, I, Ronald Reagan, President of the United States of America, by the authority vested in me by section 22 of the Agricultural Adjustment Act of 1933, as amended, and the statutes of the United States, including section 301 of Title 3 of the United States Code, do hereby proclaim until otherwise superseded by law: A. Headnote 4 of part 3 of the Appendix to the TSUS is continued in effect and amended, effective 12:01 a.m. Eastern Standard Time of the day following the date of the signing of this proclamation, by changing paragraph (c) to read as follows: (c)(i) The quarterly adjusted fee provided for in items 956.05 and 957.15 shall be the amount of the fee for item 956.15 plus one cent per pound. (ii) The quarterly adjusted fee provided for in item 956.15 shall be the amount by which the average of the adjusted daily spot (domestic) price quotations for raw sugar for the 20 consecutive market days immediately preceding the 20th day of the month preceding the calendar quarter during which the fee shall be applicable (as reported by the New York Coffee, Sugar and Cocoa Exchange) expressed in United States cents per pound, in bulk, is less than the applicable market stabilization price: Provided, That whenever the average of the daily spot (domestic) price quotations for 10 consecutive market days within any calendar quarter (1) exceeds the market stabilization price by more than one cent, the fee then in effect shall be decreased by one cent per pound, or (2) is less than the market stabilization price by more than one cent, the fee then in effect shall be increased by one cent per pound. The adjusted daily spot (domestic) price quotation for any market day shall be the daily spot (domestic) price quotation for such market day less the amount of the fee for item 956.15 that is in effect on that day. For any market day for which the New York Coffee, Sugar and Cocoa Exchange does not report a daily spot (domestic) price for raw sugar, then the Secretary of Agriculture (the Secretary) shall use such other price as he determines appropriate. (iii) The market stabilization price that shall be applicable to each fiscal year (October 1-September 30) shall be determined and announced by the Secretary in accordance with this headnote no later than 30 days prior to the beginning of the fiscal year for which such market stabilization price shall be applicable. The market stabilization price shall be equal to the sum of; (1) the price support level for the applicable fiscal year, expressed in cents per pound of raw cane sugar; (2) adjusted average transportation costs; (3) interest costs, if applicable; and (4) 0.2 cent. The adjusted average transportation costs shall be the weighted average cost of handling and transporting domestically produced raw cane sugar from Hawaii to Gulf and Atlantic Coast ports, as determined by the Secretary. Interest costs shall be the amount of interest, as determined or estimated by the Secretary, that would be required to be paid by a recipient of a price support loan for raw cane sugar upon repayment of the loan at full maturity. Interest costs shall only be applicable if a price support loan recipient is not required to pay interest upon forfeiture of the loan collateral. (iv) Notwithstanding the provisions of paragraph (iii) hereof, if the Secretary determines that there is a significant change in any one or more of the elements comprising the market stabilization price during the fiscal year, the Secretary shall adjust the market stabilization price within the fiscal year to reflect such change. The Secretary shall announce any such adjusted market stabilization price and file notice thereof with the Federal Register. This adjusted market stabilization price will become effective the first calendar quarter following its announcement or, if the Secretary announced it less than 30 days before the beginning of a new calendar quarter, then it will become effective the second calendar quarter following its announcement. Any adjusted market stabilization price, once effective, shall remain in effect through the remainder of the fiscal year unless it is adjusted further in accordance with this paragraph.","3":"(v) The Secretary shall determine the amount of the quarterly fees in accordance with this headnote and shall announce such fees not later than the 25th day of the month preceding the calendar quarter during which the fees shall be applicable. The Secretary shall certify the amount of such fees to the Commissioner of Customs and file notice thereof with the Federal Register prior to the beginning of the calendar quarter during which the fees shall be applicable.","4":"The Secretary shall determine and announce any adjustment in the fees made within a calendar quarter in accordance with the proviso of paragraph (ii) hereof, shall certify such adjusted fees to the Commissioner of Customs, and shall file notice thereof with the Federal Register within 3 market days of the fulfillment of that proviso. (vi) If an adjustment is made in the fee in accordance with the proviso of paragraph (ii) hereof, any subsequent adjustment made within that quarter shall only be made on the basis of the average spot price for any 10 consecutive market day period following the effective date of the immediately preceding fee adjustment. No adjustment shall be made in any fee in accordance with the proviso of paragraph (ii) hereof during the last 15 market days of a calendar quarter. (vii) Any adjustment made in a fee during a quarter in accordance with the proviso of paragraph (ii) hereof shall be effective only with respect to sugar entered or withdrawn from warehouse for consumption after 12:01 a.m. (local time at point of entry) on the day following the filing of notice thereof with the Federal Register: Provided, That such adjustment in the fee shall not apply to sugar exported (as defined by Customs in accordance with 19 CFR 152.1) on a through bill of lading to the United States from the country of origin before such time. The exemption contained in the preceding proviso shall apply regardless of whether the adjustment in the fee is upward or downward. B. Items 956.05, 956.15 and 957.15 of part 3 of the Appendix to the TSUS are continued in effect and the \"Rates of Duty (Section 22 Fees)\" are amended to read as follows: Item Articles Rates of duty (section 22 fees) Sugars, sirups and molasses derived from sugar cane or sugar beets, except those entered pursuant to a license issued by the Secretary of Agriculture in accordance with headnote 4(a): Principally of crystalline structure or in dry amorphous form, provided for in item 155.20, 956.05 part 10A, schedule 1: Not to be further refined or improved in quality An amount determined and adjusted in accordance with headnote 4(c), but not in excess of 50% ad val. 956.15 To be further refined or improved in quality An amount determined and adjusted in accordance with headnote 4(c), but not in excess of 50% ad val. 957.15 Not principally of crystalline structure and not An amount determined and adjusted in accordance with headnote 4(c) per pound of total sugars, but not in excess of 50% ad val. in dry amorphous form, containing soluble nonsugar solids (excluding any foreign substance that may have been added or developed in the product) equal to 6% or less by weight of the total soluble solids, provided for in item 155.30, part 10A, schedule 1","5":"C. The Secretary of Agriculture, in consultation with other appropriate agencies, shall review the fee system established by this Proclamation on a quarterly basis and","6":"shall submit to me any recommendations for any changes determined to be necessary or appropriate. D. The provisions of this proclamation shall terminate upon the filing of a notice in the Federal Register by the Secretary of Agriculture that the Department of Agriculture is no longer conducting a price support program for sugar beets and sugar cane.","7":"E. The provisions of Proclamation 4940 of May 5, 1982, are hereby terminated, except that the import fees on items 956.15, 956.05 and 957.15 presently in effect and the market stabilization price determined and announced by the Secretary of Agriculture for fiscal year 1984 (October 1, 1983-September 30, 1984) shall remain in effect, unless adjusted by the Secretary of Agriculture in accordance with paragraph (c) of Headnote 4 of part 3 of the Appendix to the TSUS, as modified herein. F. This proclamation shall be effective as of 12:01 a.m. Eastern Standard Time on the day following the date of its signing, and shall apply to articles entered, or withdrawn from warehouse for consumption, on or after such effective date."}},"valueLabels":{"0":"0 – Outside scope","1":"1 – Discretionary / internal","2":"2 – Dictated agency outcome","3":"3 – Self-executing","4":"4 – Unclear / mixed"}}</script>

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function unitKey(g,u){return g.annotatorIndex+'|'+u.docId+'|'+u.chunkNumber}function gtKey(u){return u.docId+'|'+u.chunkNumber}function gtCode(u){return(groundTruthAnswers[gtKey(u)]||{}).code||u.groundTruthCode||''}function label(code){return P.valueLabels[code]||code}

function options(selected,allowBlank){var out=allowBlank?'<option value="">— choose category —</option>':'';Object.keys(P.valueLabels).forEach(function(code){out+='<option value="'+code+'"'+(selected===code?' selected':'')+'>'+esc(label(code))+'</option>'});return out}
function card(g,u){var m=P.metadata[u.docId]||{},k=unitKey(g,u),chosen=(answers[k]||{}).reviewedCode||'',minority=g.groundTruth?u.minorityIndex:g.annotatorIndex;var votes=u.codes.map(function(code,i){return'<div class="vote '+(u.allThree?'':i===minority?'minority':'majority')+'"><span>'+esc(P.annotators[i])+'</span><span>'+esc(label(code))+'</span></div>'}).join(''),outcome=u.allThree?'Three-way disagreement · provisional code from notes':esc(u.reviewedBy)+' · '+(u.groundTruthCode===u.majorityCode?'Changed to majority':'Kept original'),gtEdit=groundTruthAnswers[gtKey(u)],gtStatus=(gtEdit?'Saved locally · ':'')+outcome,gtDecision=!u.allThree&&u.groundTruthCode===u.majorityCode?'<div class="vote majority">'+esc(label(u.groundTruthCode))+'</div>':'<select data-ground-truth-key="'+esc(gtKey(u))+'">'+options(gtCode(u),!u.groundTruthCode)+'</select>',decision=g.groundTruth?'<label>Ground truth category</label>'+gtDecision+'<div class="saved">'+gtStatus+'</div>':'<label for="decision-'+esc(k)+'">Your reviewed category</label><select id="decision-'+esc(k)+'" data-key="'+esc(k)+'">'+options(chosen,true)+'</select><div class="saved">'+(chosen?'Saved':'')+'</div>';return'<article class="card"><div class="heading"><span class="unit">'+esc(u.docId)+' · Sub-directive '+esc(u.chunkNumber)+'</span><span class="meta">'+esc(m.president||'')+' · '+esc(m.date||'')+' · '+esc((m.type||'').replace(/_/g,' '))+'</span></div><div class="body"><div><div class="chunk">'+esc((P.chunks[u.docId]||{})[u.chunkNumber]||'')+'</div><details class="context"><summary>Show full directive context</summary><div class="full">'+esc(P.docTexts[u.docId]||'')+'</div></details></div><div><div class="votes">'+votes+'</div>'+decision+'</div></div></article>'}
function updateProgress(){var g=P.groups[active];if(g.groundTruth){var three=g.units.filter(function(u){return u.allThree}).length;document.getElementById('progress').textContent=(g.units.length-three)+' reviewed + '+three+' three-way';return}var done=g.units.filter(function(u){return(answers[unitKey(g,u)]||{}).reviewedCode}).length;document.getElementById('progress').textContent=done+' of '+g.units.length+' reviewed'}

document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(b){active=+b.dataset.i;render()}});document.getElementById('content').addEventListener('change',function(e){var s=e.target;if(s.matches('select[data-ground-truth-key]')){var g=P.groups[active],u=g.units.find(function(unit){return gtKey(unit)===s.dataset.groundTruthKey});if(!s.value||s.value===u.groundTruthCode)delete groundTruthAnswers[gtKey(u)];else groundTruthAnswers[gtKey(u)]={code:s.value,editedAt:new Date().toISOString()};localStorage.setItem(groundTruthKey,JSON.stringify(groundTruthAnswers));s.nextElementSibling.textContent=(groundTruthAnswers[gtKey(u)]?'Saved locally · ':'')+(u.allThree?'Three-way disagreement · provisional code from notes':u.reviewedBy+' · Kept original');return}if(!s.matches('select[data-key]'))return;if(s.value)answers[s.dataset.key]={reviewedCode:s.value,reviewedAt:new Date().toISOString()};else delete answers[s.dataset.key];localStorage.setItem(key,JSON.stringify(answers));s.nextElementSibling.textContent=s.value?'Saved':'';updateProgress()});
document.getElementById('export').addEventListener('click',function(){var g=P.groups[active],records,out,name;if(g.groundTruth){records=g.units.map(function(u){var edit=groundTruthAnswers[gtKey(u)]||{};return{round_id:u.docId,chunk_number:u.chunkNumber,disagreement_type:u.allThree?'all_three':'minority',reviewed_by:u.reviewedBy||null,original_code:u.originalCode||null,majority_code:u.majorityCode||null,reviewed_code:u.groundTruthCode||null,ground_truth_code:gtCode(u)||null,ground_truth_edited_at:edit.editedAt||null}});out={schema:'round4-retained-minority-review',schema_version:1,exported_at:new Date().toISOString(),records:records};name='round4-retained-minority-review.json'}else{records=g.units.map(function(u){var a=answers[unitKey(g,u)]||{};return{annotator:g.label,round_id:u.docId,chunk_number:u.chunkNumber,original_code:u.originalCode,majority_code:u.majorityCode,reviewed_code:a.reviewedCode||null,reviewed_at:a.reviewedAt||null}});out={schema:'round4-minority-subdirective-review',schema_version:1,exported_at:new Date().toISOString(),annotator:g.label,records:records};name='round4-minority-review-'+g.label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json'}var blob=new Blob([JSON.stringify(out,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)});render()})();</script></body></html>
