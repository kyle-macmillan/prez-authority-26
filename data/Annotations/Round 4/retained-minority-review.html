significantly increase Federal procurement of biobased and other sustainable products.\n\nSection 1. Actions Related to Executive Order 13514. (a) Agencies shall include and report on biobased acquisition as part of the sustainable acquisition goals and milestones in the Strategic Sustainability Performance Plan required by section 8 of Executive Order 13514.\n\n(b) As required by section 2(h) of Executive Order 13514, agencies shall ensure that 95 percent of applicable new contract actions for products and services advance sustainable acquisition, including biobased acquisition, where such products and services meet agency performance requirements. In doing so, agencies shall:\n\n(i) include acquisition of biobased products in their Affirmative Procurement Programs and Preferable Purchasing Programs, as applicable (as originally required by Executive Order 13101 of September 14, 1998 (Greening the Government Through Waste Prevention, Recycling, and Federal Acquisition) and reinforced by Executive Order 13423 of January 24, 2007 (Strengthening Federal Environmental, Energy, and Transportation Management) and Executive Order 13514);\n\n(ii) include biobased products as part of their procurement review and monitoring program required by section 9002(a) of the 2008 Farm Bill, incorporating data collection and reporting requirements as part of their program evaluation; and\n\n(iii) provide appropriate training on procurement of biobased products for all acquisition personnel including requirements and procurement staff.\n\n(c) The Office of Management and Budget (OMB) shall emphasize biobased purchasing in the fiscal year 2012 and 2013 Sustainability/Energy scorecard, which is the periodic evaluation of agency performance on sustainable acquisition pursuant to section 4 of Executive Order 13514.\n\nSec. 2. Biobased Product Designations. The USDA has already designated 64 categories of biobased products for preferred Federal procurement. Although these categories represent an estimated 9,000 individual products, less than half of the known biobased products are currently included in the preference program. Increasing the number of products subject to the Federal procurement preference will increase procurement of biobased products. Therefore, I direct the Secretary of Agriculture to:\n\n(a) increase both the number of categories of biobased products designated and individual products eligible for preferred purchasing by 50 percent within 1 year of the date of this memorandum; and\n\n(b) establish a web-based process whereby biobased product manufacturers can request USDA to establish a new product category for designation. The USDA shall determine the merit of the request and, if the product category is deemed eligible, propose designation within 180 days of the request.\n\nSec. 3. Changes in Procurement Mechanisms. Several actions can be taken to facilitate improvement in and compliance with the requirements to purchase biobased products. To achieve these changes, I direct:\n\n(a) the Senior Sustainability Officers and Chief Acquisition Officers of all agencies to randomly sample procurement actions (such as solicitations and awards) to verify that biobased considerations are included as appropriate. Agencies shall include results of these sampling efforts in the Sustainability/Energy scorecard reported to OMB;\n\n(b) the Secretary of Agriculture to work with relevant officials in agencies that have electronic product procurement catalogs to identify and implement solutions to increase the visibility of biobased and other sustainable products;\n\n(c) the Senior Sustainability Officers of all agencies that have established agency-specific product specifications, in coordination with any other appropriate officials, to review and revise all specifications under their control to assure that, wherever possible and appropriate, such specifications require the use of sustainable products, including USDA-designated biobased products, and that any language prohibiting the use of biobased products is removed. The review shall be on a 4-year cycle. Significant review should be completed within 1 year of the date of this memorandum, and the results of the reviews shall be annually reported to OMB and the Office of Science and Technology Policy (OSTP); and\n\n(d) the Secretary of Agriculture to amend USDA's automated contract writing system, the Integrated Acquisition System, to serve as a model for biobased product procurement throughout the Federal Government by adding elements related to acquisition planning, evaluation factors for source selection, and specifications and requirements. Once completed, USDA shall share the model with all agencies and, as appropriate, assist any agency efforts to adopt similar mechanisms.\n\nSec. 4. Small Business Assistance. A majority of the biobased product manufacturers and vendors selling biobased products and services that use biobased products to the Federal Government are small businesses. To improve the ability of small businesses to sell these products and services to the Federal Government, I direct:\n\n(a) the Secretary of Commerce, in consultation with the Secretary of Agriculture, to use relevant programs of the Department, such as the Manufacturing Extension Partnership network, to improve the performance and competitiveness of biobased product manufacturers;\n\n(b) the Secretary of Agriculture to work cooperatively with Procurement Technical Assistance Center programs located across the Nation to provide training and assistance to biobased product companies to make these companies aware of the BioPreferred program and opportunities to sell biobased products to Federal, State, and local government agencies; and\n\n(c) the Secretary of Agriculture to develop training within 6 months of the date of this memorandum for small businesses on the BioPreferred program and the opportunities it presents, and the Administrator of the Small Business Administration (SBA) to disseminate that training to Small Business Development Centers and feature it on the SBA website.\n\nSec. 5. Reporting. The Federal Government should obtain the most reliable information to gauge its progress in purchasing biobased products, including measuring the annual number of procurements that include direct purchase of biobased products, the annual number of construction and service contracts that include the purchase of biobased products, and the annual volume and type of biobased products the Federal Government purchases. I direct that:\n\n(a) within 1 year of the date of this memorandum, the Federal Acquisition Regulatory Council shall propose an amendment to the Federal Acquisition Regulation to require reporting of biobased product purchases, to be made public on an annual basis; and\n\n(b) following the promulgation of the proposed amendment referenced in subsection (a) of this section, the Secretary of Agriculture, in consultation with the Chief Acquisition Officers Council, shall develop a reporting template to facilitate the annual reporting requirement.\n\nSec. 6. Jobs Creation Research. Biobased products are creating jobs across America. These innovative products are creating new markets for agriculture and expanding opportunities in rural America. Therefore, I direct the Secretary of Agriculture to prepare a report on job creation and the economic impact associated with the biobased product industry to be submitted to the President through the Domestic Policy Council and OSTP within 2 years of the date of this memorandum. The study shall include:\n\n(a) the number of American jobs originating from the biobased product industry annually over the last 10 years, including the job changes in specific sectors;\n\n(b) the dollar value of the current domestic biobased products industry, including intermediates, feedstocks, and finished products, but excluding biofuels;\n\n(c) a forecast for biobased job creation potential over the next 10 years;\n\n(d) a forecast for growth in the biobased industry over the next 10 years; and\n\n(e) jobs data for both biofuels and biobased products, but shall generate separate data for each category.\n\nSec. 7. Education and Outreach. In compliance with the 2002 Farm Bill, several agencies established agency promotion programs to support the biobased products procurement preference. The Federal Acquisition Institute has added biobased procurement training to its course offerings. To assure both formal and informal educational and outreach instruction on the BioPreferred program are in place and being implemented by each agency, I direct:\n\n(a) the Secretary of Agriculture to update all existing USDA BioPreferred and related sustainable acquisition training materials within 1 year of the date of this memorandum;\n\n(b) the Senior Sustainability Officers and Chief Acquisition Officers of agencies to work cooperatively with the Secretary of Agriculture to immediately implement such BioPreferred program agency education and outreach programs as are necessary to meet the requirements of this memorandum and relevant statutes; and\n\n(c) the Secretary of Agriculture to work actively with the Committee for Purchase From People Who Are Blind or Severely Disabled to promote education and outreach to program, technical, and contracting personnel, and to purchase card holders on BioPreferred AbilityOne products.\n\nSec. 8. General Provisions. (a) This memorandum shall apply to an agency with respect to the activities, personnel, resources, and facilities of the agency that are located within the United States. The head of an agency may provide that this memorandum shall apply in whole or in part with respect to the activities, personnel, resources, and facilities of the agency that are not located within the United States, if the head of the agency determines that such application is in the interest of the United States.\n\n(b) The head of an agency shall manage activities, personnel, resources, and facilities of the agency that are not located within the United States, and with respect to which the head of the agency has not made a determination under subsection (a) of this section, in a manner consistent with the policies set forth in this memorandum, to the extent the head of the agency determines practicable.\n\n(c) For purposes of this memorandum, \"biobased product\" shall have the meaning set forth in section 8101(4) of title 7, United States Code.\n\n(d) This memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\n(e) The Secretary of Agriculture is hereby authorized and directed to publish this memorandum in the Federal Register.\n\nBARACK OBAMA","M14":"Memorandum for the United States Trade Representative Subject: Determination Under Section 301 of the Trade Act of 1974\n\nPursuant to Section 301(d)(2) of the Trade Act of 1974, as amended (19 U.S.C. 2411(d)(2)), I have determined that the Agreement between the Governments of Japan and the United States of America Regarding Trade in Semiconductors, to be implemented by an exchange of letters, is an appropriate and feasible response to the practices of the Government of Japan with respect to trade in semiconductors. These practices have been investigated by the United States Trade Representative in response to a petition filed under Section 301 on June 14, 1985, by the Semiconductor Industry Association.\n\nThe Agreement, which will be in effect until March 31, 1991, will open up the Japanese market to U.S. exports of semiconductors and will help prevent dumping of semiconductors in the United States and third country markets. It achieves a key objective of Section 301, which is to open foreign markets to U.S. exports. The satisfactory resolution of this problem demonstrates our ability to help U.S. industries and to resolve contentious trade disputes through the negotiating process.\n\nFulfillment of the objectives and commitments in the Agreement is of critical importance. Therefore, I hereby determine that any future failure by the Government of Japan to meet the commitments and objectives of the Agreement would be inconsistent with a trade agreement or an unjustifiable act that would burden or restrict U.S. commerce. Therefore, I instruct the United States Trade Representative to report to me on: (1) the results of each of the periodic consultations held pursuant to the Agreement; and (2) annual improvements in foreign-based semiconductor firms' access to the Japanese market. I also direct the United States Trade Representative and the Secretary of Commerce to take any further action that may become appropriate to implement the Agreement. Finally, the Section 301 proceeding on semiconductors shall be suspended and shall remain suspended as long as the objectives and commitments of the Agreement are fulfilled.\n\nThis determination shall be published in the Federal Register.\n\nRONALD REAGAN\n\n[Filed with the Office of the Federal Register, 10:37 a. m., August 1, 1986]","EO21":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 7902(c) of title 5, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy. It is the policy of my Administration to halt the spread of coronavirus disease 2019 (COVID-19) by relying on the best available data and science-based public health measures. Such measures include wearing masks when around others, physical distancing, and other related precautions recommended by the Centers for Disease Control and Prevention (CDC). Put simply, masks and other public health measures reduce the spread of the disease, particularly when communities make widespread use of such measures, and thus save lives.\n\nAccordingly, to protect the Federal workforce and individuals interacting with the Federal workforce, and to ensure the continuity of Government services and activities, on-duty or on-site Federal employees, on-site Federal contractors, and other individuals in Federal buildings and on Federal lands should all wear masks, maintain physical distance, and adhere to other public health measures, as provided in CDC guidelines.\n\nSec. 2. Immediate Action Regarding Federal Employees, Contractors, Buildings, and Lands. (a) The heads of executive departments and agencies (agencies) shall immediately take action, as appropriate and consistent with applicable law, to require compliance with CDC guidelines with respect to wearing masks, maintaining physical distance, and other public health measures by: on-duty or on-site Federal employees; on-site Federal contractors; and all persons in Federal buildings or on Federal lands.\n\n(b) The Director of the Office of Management and Budget (OMB), the Director of the Office of Personnel Management (OPM), and the Administrator of General Services, in coordination with the President's Management Council and the Coordinator of the COVID-19 Response and Counselor to the President (COVID-19 Response Coordinator), shall promptly issue guidance to assist heads of agencies with implementation of this section.\n\n(c) Heads of agencies shall promptly consult, as appropriate, with State, local, Tribal, and territorial government officials, Federal employees, Federal employee unions, Federal contractors, and any other interested parties concerning the implementation of this section.\n\n(d) Heads of agencies may make categorical or case-by-case exceptions in implementing subsection (a) of this section to the extent that doing so is necessary or required by law, and consistent with applicable law. If heads of agencies make such exceptions, they shall require appropriate alternative safeguards, such as additional physical distancing measures, additional testing, or reconfiguration of workspace, consistent with applicable law. Heads of agencies shall document all exceptions in writing.\n\n(e) Heads of agencies shall review their existing authorities and, to the extent permitted by law and subject to the availability of appropriations and resources, seek to provide masks to individuals in Federal buildings when needed.\n\n(f) The COVID-19 Response Coordinator shall coordinate the implementation of this section. Heads of the agencies listed in 31 U.S.C. 901(b) shall update the COVID-19 Response Coordinator on their progress in implementing this section, including any categorical exceptions established under subsection (d) of this section, within 7 days of the date of this order and regularly thereafter. Heads of agencies are encouraged to bring to the attention of the COVID-19 Response Coordinator any questions regarding the scope or implementation of this section.\n\nSec. 3. Encouraging Masking Across America. (a) The Secretary of Health and Human Services (HHS), including through the Director of CDC, shall engage, as appropriate, with State, local, Tribal, and territorial officials, as well as business, union, academic, and other community leaders, regarding mask-wearing and other public health measures, with the goal of maximizing public compliance with, and addressing any obstacles to, mask-wearing and other public health best practices identified by CDC.\n\n(b) The COVID-19 Response Coordinator, in coordination with the Secretary of HHS, the Secretary of Homeland Security, and the heads of other relevant agencies, shall promptly identify and inform agencies of options to incentivize, support, and encourage widespread mask-wearing consistent with CDC guidelines and applicable law.\n\nSec. 4. Safer Federal Workforce Task Force.\n\n(a) Establishment. There is hereby established the Safer Federal Workforce Task Force (Task Force).\n\n(b) Membership. The Task Force shall consist of the following members:\n\n(i) the Director of OPM, who shall serve as Co-Chair;\n\n(ii) the Administrator of General Services, who shall serve as Co-Chair;\n\n(iii) the COVID-19 Response Coordinator, who shall serve as Co-Chair;\n\n(iv) the Director of OMB;\n\n(v) the Director of the Federal Protective Service;\n\n(vi) the Director of the United States Secret Service;\n\n(vii) the Administrator of the Federal Emergency Management Agency;\n\n(viii) the Director of CDC; and\n\n(ix) the heads of such other agencies as the Co-Chairs may individually or jointly invite to participate.\n\n(c) Organization. A member of the Task Force may designate, to perform the Task Force functions of the member, a senior-level official who is a full-time officer or employee of the member's agency. At the direction of the Co-Chairs, the Task Force may establish subgroups consisting exclusively of Task Force members or their designees, as appropriate.\n\n(d) Administration. The General Services Administration shall provide funding and administrative support for the Task Force to the extent permitted by law and within existing appropriations. The Co-Chairs shall convene regular meetings of the Task Force, determine its agenda, and direct its work.\n\n(e) Mission. The Task Force shall provide ongoing guidance to heads of agencies on the operation of the Federal Government, the safety of its employees, and the continuity of Government functions during the COVID-19 pandemic. Such guidance shall be based on public health best practices as determined by CDC and other public health experts, and shall address, at a minimum, the following subjects as they relate to the Federal workforce:\n\n(i) testing methodologies and protocols;\n\n(ii) case investigation and contact tracing; (iii) requirements of and limitations on physical distancing, including recommended occupancy and density standards;\n\n(iv) equipment needs and requirements, including personal protective equipment;\n\n(v) air filtration;\n\n(vi) enhanced environmental disinfection and cleaning;\n\n(vii) safe commuting and telework options;\n\n(viii) enhanced technological infrastructure to support telework;\n\n(ix) vaccine prioritization, distribution, and administration;\n\n(x) approaches for coordinating with State, local, Tribal, and territorial health officials, as well as business, union, academic, and other community leaders;\n\n(xi) any management infrastructure needed by agencies to implement public health guidance; and\n\n(xii) circumstances under which exemptions might appropriately be made to agency policies in accordance with CDC guidelines, such as for mission-critical purposes.\n\n(f) Agency Cooperation. The head of each agency listed in 31 U.S.C. 901(b) shall, consistent with applicable law, promptly provide the Task Force a report on COVID-19 safety protocols, safety plans, or guidance regarding the operation of the agency and the safety of its employees, and any other information that the head of the agency deems relevant to the Task Force's work.\n\nSec. 5. Federal Employee Testing. The Secretary of HHS, through the Director of CDC, shall promptly develop and submit to the COVID-19 Response Coordinator a testing plan for the Federal workforce. This plan shall be based on community transmission metrics and address the populations to be tested, testing types, frequency of testing, positive case protocols, and coordination with local public health authorities for contact tracing.\n\nSec. 6. Research and Development. The Director of the Office of Science and Technology Policy, in consultation with the Secretary of HHS (through the National Science and Technology Council), the Director of OMB, the Director of CDC, the Director of the National Institutes of Health, the Director of the National Science Foundation, and the heads of any other appropriate agencies, shall assess the availability of Federal research grants to study best practices for implementing, and innovations to better implement, effective mask-wearing and physical distancing policies, with respect to both the Federal workforce and the general public.\n\nSec. 7. Scope. (a) For purposes of this order:\n\n(i) \"Federal employees\" and \"Federal contractors\" mean employees (including members of the Armed Forces and members of the National Guard in Federal service) and contractors (including such contractors' employees) working for the executive branch;\n\n(ii) \"Federal buildings\" means buildings, or office space within buildings, owned, rented, or leased by the executive branch of which a substantial portion of occupants are Federal employees or Federal contractors; and\n\n(iii) \"Federal lands\" means lands under executive branch control.\n\n(b) The Director of OPM and the Administrator of General Services shall seek to consult, in coordination with the heads of any other relevant agencies and the COVID-19 Response Coordinator, with the Sergeants at Arms of the Senate and the House of Representatives and the Director of the Administrative Office of the United States Courts (or such other persons designated by the Majority and Minority Leaders of the Senate, the Speaker and Minority Leader of the House, or the Chief Justice of the United States, respectively), to promote mask-wearing, physical distancing, and adherence to other public health measures within the legislative and judicial branches, and shall provide requested technical assistance as needed to facilitate compliance with CDC guidelines.\n\nSec. 8. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) Independent agencies are strongly encouraged to comply with the requirements of this order.\n\n(d) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nJOSEPH R. BIDEN, JR.\n\nThe White House,\n\nJanuary 20, 2021.","EO24":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), the National Emergencies Act (50 U.S.C. 1601 et seq.), section 212(f) of the Immigration and Nationality Act of 1952 (8 U.S.C. 1182(f)), and section 301 of title 3, United States Code,\n\nI, Joseph R. Biden Jr., President of the United States of America, hereby expand the scope of the national emergency declared in Executive Order 13067 of November 3, 1997 (Blocking Sudanese Government Property and Prohibiting Transactions With Sudan), and expanded by Executive Order 13400 of April 26, 2006 (Blocking Property of Persons in Connection With the Conflict in Sudan's Darfur Region), finding that the situation in Sudan, including the military's seizure of power in October 2021 and the outbreak of inter-service fighting in April 2023, constitutes an unusual and extraordinary threat to the national security and foreign policy of the United States.\n\nIt is the policy of the United States to support a transition to democracy and civilian transitional government in Sudan, to defend such a transitional government from those who would prevent its initial formation through violence and other methods, and, once formed, to protect it from those who would undermine it. The United States, in cooperation with like-minded partners, will help such a transitional government, when formed, meet the needs of the Sudanese people and prepare for democratic elections.\n\nAccordingly, to address the threat described in this order and to take further steps with respect to this national emergency, I hereby order:\n\nSection 1. (a) All property and interests in property that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of any United States person of the following persons are blocked and may not be transferred, paid, exported, withdrawn, or otherwise dealt in:\n\n(i) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be responsible for, or complicit in, or to have directly or indirectly engaged or attempted to engage in, any of the following:\n\n(A) actions or policies that threaten the peace, security, or stability of Sudan;\n\n(B) actions or policies that obstruct, undermine, delay, or impede, or pose a significant risk of obstructing, undermining, delaying, or impeding, the formation or operation of a civilian transitional government, Sudan's transition to democracy, or a future democratically elected government;\n\n(C) actions or policies that have the purpose or effect of undermining democratic processes or institutions in Sudan;\n\n(D) censorship or other actions or policies that prohibit, limit, or penalize the exercise of freedoms of expression, association, or peaceful assembly by individuals in Sudan, or that limit access to free and independent news or information in or with respect to Sudan;\n\n(E) corruption, including bribery, misappropriation of state assets, and interference with public processes such as government oversight of parastatal budgets and revenues for personal benefit;\n\n(F) serious human rights abuse, including serious human rights abuse related to political repression, in or with respect to Sudan;\n\n(G) the targeting of women, children, or any other civilians through the commission of acts of violence (including killing, maiming, torture, or rape or other sexual violence), abduction, forced displacement, or attacks on schools, hospitals, religious sites, or locations where civilians are seeking refuge, or through conduct that would constitute a serious abuse or violation of human rights or a violation of international humanitarian law;\n\n(H) the obstruction of the activities of United Nations missions—including peacekeeping missions, as well as diplomatic or humanitarian missions—in Sudan, or of the delivery of, distribution of, or access to humanitarian assistance; or\n\n(I) attacks against United Nations missions, including peacekeeping operations;\n\n(ii) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be or have been a leader, official, senior executive officer, or member of the board of directors of any entity:\n\n(A) that has, or whose members have, engaged in any activity described in subsection (a)(i) of this section relating to the tenure of such leader, official, senior executive officer, or member of the board of directors; or\n\n(B) whose property and interests in property are blocked pursuant to this order relating to the tenure of such leader, official, senior executive officer, or member of the board of directors;\n\n(iii) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be a spouse or adult child of any person whose property and interests in property are blocked pursuant to this order;\n\n(iv) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to have materially assisted, sponsored, or provided financial, material, or technological support for, or goods or services to or in support of, any activity described in subsection (a)(i) of this section or any person whose property and interests in property are blocked pursuant to this order; or\n\n(v) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be owned or controlled by, or to have acted or purported to act for or on behalf of, directly or indirectly, any person whose property and interests in property are blocked pursuant to this order.\n\n(b) The prohibitions in subsection (a) of this section apply except to the extent provided by statutes, or in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted before the date of this order.\n\nSec. 2. Following the issuance of a determination by the Secretary of State, in consultation with the Secretary of the Treasury and the Administrator of the United States Agency for International Development, that a civilian transitional government has been formed in Sudan, the Assistant to the President for National Security Affairs shall coordinate, through the interagency process identified in National Security Memorandum 2 of February 4, 2021 (Renewing the National Security Council System), or any successor memorandum, the executive branch actions necessary to implement the policy set forth in this order, including coordinating executive departments and agencies (agencies) to mobilize international assistance to support such a civilian transitional government in implementing political, economic, security, and human rights-related reforms essential for completing a democratic transition.\n\nSec. 3. The prohibitions in section 1 of this order include:\n\n(a) the making of any contribution or provision of funds, goods, or services by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to this order; and\n\n(b) the receipt of any contribution or provision of funds, goods, or services from any such person.\n\nSec. 4. I hereby determine that the making of donations of the types of articles specified in section 203(b)(2) of IEEPA (50 U.S.C. 1702(b)(2)) by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to section 1 of this order would seriously impair my ability to deal with the national emergency declared in Executive Order 13067, and expanded by Executive Order 13400 and this order, and I hereby prohibit such donations as provided by section 1 of this order.\n\nSec. 5. (a) Any transaction that evades or avoids, has the purpose of evading or avoiding, causes a violation of, or attempts to violate any of the prohibitions set forth in this order is prohibited.\n\n(b) Any conspiracy formed to violate any of the prohibitions set forth in this order is prohibited.\n\nSec. 6. (a) The unrestricted immigrant and nonimmigrant entry into the United States of noncitizens determined to meet one or more of the criteria set forth in section 1(a) of this order would be detrimental to the interests of the United States, and the entry of such persons into the United States, as immigrants or nonimmigrants, is hereby suspended, except when the Secretary of State or the Secretary of Homeland Security, as appropriate, determines that the person's entry would not be contrary to the interests of the United States, including when the Secretary of State or the Secretary of Homeland Security, as appropriate, so determines, based on a recommendation of the Attorney General, that the person's entry would further important United States law enforcement objectives.\n\n(b) The Secretary of State shall implement this authority as it applies to visas pursuant to such procedures as the Secretary of State, in consultation with the Secretary of Homeland Security, may establish.\n\n(c) The Secretary of Homeland Security shall implement this order as it applies to the entry of noncitizens pursuant to such procedures as the Secretary of Homeland Security, in consultation with the Secretary of State, may establish.\n\n(d) Such persons shall be treated by this section in the same manner as persons covered by section 1 of Proclamation 8693 of July 24, 2011 (Suspension of Entry of Aliens Subject to United Nations Security Council Travel Bans and International Emergency Economic Powers Act Sanctions).\n\nSec. 7. For the purposes of this order:\n\n(a) the term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization;\n\n(b) the term \"noncitizen\" means any person who is not a citizen or noncitizen national of the United States;\n\n(c) the term \"person\" means an individual or entity; and\n\n(d) the term \"United States person\" means any United States citizen, lawful permanent resident, entity organized under the laws of the United States or any jurisdiction within the United States (including foreign branches), or any person in the United States.\n\nSec. 8. For those persons whose property and interests in property are blocked pursuant to this order who might have a constitutional presence in the United States, I find that because of the ability to transfer funds or other assets instantaneously, prior notice to such persons of measures to be taken pursuant to this order would render those measures ineffectual. I therefore determine that for these measures to be effective in addressing the national emergency declared in Executive Order 13067, and expanded by Executive Order 13400 and this order, there need be no prior notice of a listing or determination made pursuant to section 1 of this order.\n\nSec. 9. The Secretary of the Treasury, in consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to the President by IEEPA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may, consistent with applicable law, redelegate any of these functions within the Department of the Treasury. All agencies of the United States shall take all appropriate measures within their authority to implement this order.\n\nSec. 10. Nothing in this order shall prohibit transactions for the conduct of the official business of the Federal Government or the United Nations (including its specialized agencies, programs, funds, and related organizations) by employees, grantees, or contractors thereof.\n\nSec. 11. Nothing in this order is intended to affect the continued effectiveness of any action taken pursuant to Executive Order 13761 of January 13, 2017 (Recognizing Positive Actions by the Government of Sudan and Providing for the Revocation of Certain Sudan-Related Sanctions), and Executive Order 13804 of July 11, 2017 (Allowing Additional Time for Recognizing Positive Actions by the Government of Sudan and Amending Executive Order 13761).\n\nSec. 12. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nJOSEPH R. BIDEN, JR.\n\nThe White House,\n\nMay 4, 2023.","M13":"Memorandum for the Heads of Executive Departments and Agencies\n\nSubject: Prohibition on Federal Funding for Cloning of Human Beings\n\nRecent accounts of advances in cloning technology, including the first successful cloning of an adult sheep, raise important questions. They potentially represent enormous scientific breakthroughs that could offer benefits in such areas as medicine and agriculture. But the new technology also raises profound ethical issues, particularly with respect to its possible use to clone humans. That is why last week I asked our National Bioethics Advisory Commission to thoroughly review the legal and ethical issues associated with the use of this technology and report back to me in 90 days.\n\nFederal funds should not be used for cloning of human beings. The current restrictions on the use of Federal funds for research involving human embryos do not fully assure this result. In December 1994, I directed the National Institutes of Health not to fund the creation of human embryos for research purposes. The Congress extended this prohibition in FY 1996 and FY 1997 appropriations bills, barring the Department of Health and Human Services from supporting certain human embryo research. However, these restrictions do not explicitly cover human embryos created for implantation and do not cover all Federal agencies. I want to make it absolutely clear that no Federal funds will be used for human cloning. Therefore, I hereby direct that no Federal funds shall be allocated for cloning of human beings.\n\nWILLIAM J. CLINTON","P50":"By the President of the United States of America A Proclamation\n\n1. On January 11, 2018, the Secretary of Commerce (Secretary) transmitted to me a report on his investigation into the effect of imports of steel mill articles (steel articles) on the national security of the United States under section 232 of the Trade Expansion Act of 1962, as amended (19 U.S.C. 1862). The Secretary found and advised me of his opinion that steel articles were being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States.\n\n2. In Proclamation 9705 of March 8, 2018 (Adjusting Imports of Steel Into the United States), I concurred in the Secretary's finding that steel articles, as defined in clause 1 of Proclamation 9705, as amended by clause 8 of Proclamation 9711 of March 22, 2018 (Adjusting Imports of Steel Into the United States), were being imported into the United States in such quantities and under such circumstances as to threaten to impair the national security of the United States, and decided to adjust the imports of these steel articles by imposing a 25 percent ad valorem tariff on such articles imported from most countries.\n\n3. In Proclamation 9705, I further stated that any country with which we have a security relationship is welcome to discuss with the United States alternative ways to address the threatened impairment of the national security caused by imports from that country, and noted that, should the United States and any such country arrive at a satisfactory alternative means to address the threat to the national security such that I determine that imports from that country no longer threaten to impair the national security, I may remove or modify the restriction on steel article imports from that country and, if necessary, adjust the tariff as it applies to other countries, as the national security interests of the United States require.\n\n4. In Proclamation 9740 of April 30, 2018 (Adjusting Imports of Steel Into the United States), I noted that the United States had agreed in principle with the Federative Republic of Brazil (Brazil) on satisfactory alternative means to address the threatened impairment to our national security posed by steel articles imported from Brazil. In Proclamation 9759 of May 31, 2018 (Adjusting Imports of Steel Into the United States), I noted that the United States had agreed on measures with Brazil that would provide effective, long-term alternative means to address Brazil's contribution to the threatened impairment to our national security. These included quantitative limitations that restrict the volume of steel articles imported into the United States from Brazil. In light of these agreed-upon measures, I determined that steel article imports from Brazil would no longer threaten to impair the national security and decided to exclude Brazil from the tariff proclaimed in Proclamation 9705, as amended. I further noted that the United States would monitor the implementation and effectiveness of those measures to address our national security needs.\n\n5. In Proclamation 9759, I also directed the Secretary to monitor implementation of quantitative limitations applicable to steel article imports from Brazil and inform me of any circumstance that in the Secretary's opinion might indicate that an adjustment of the quantitative limitations is necessary.\n\n6. The Secretary has advised me that there have been significant changes in the United States steel market since the time I decided to exclude, on a long-term basis, Brazil from the tariff proclaimed in Proclamation 9705, as amended. The United States steel market has contracted in 2020. After increasing in 2018 and 2019, steel shipments by domestic producers through June of this year are approximately 15 percent lower than shipments for the same time period in 2019, with shipments in April and May of this year more than 30 percent lower than the shipments in the same months in 2019. The Secretary has further advised me that domestic producers' adjusted year-to-date capacity utilization rate through August 15, 2020, is below 70 percent and that the current rate has been near or below 60 percent since the second week of April. Brazil is also the second largest source of steel imports to the United States and the largest source of imports of semi-finished steel products. Moreover, imports from most countries have declined this year in a manner commensurate with this contraction, whereas imports from Brazil have decreased only slightly.\n\n7. In light of these significantly changed market conditions, I have determined that the alternative measures regarding Brazilian steel imports, without any modifications, will be ineffective in eliminating the threat to the national security posed by imports of such articles, in the current environment. The United States and Brazil have held consultations regarding Brazil's steel exports to the United States. As a result of these discussions, the United States will lower, for the remainder of 2020, one of the quantitative limitations set forth in Proclamation 9759 applicable to certain steel articles imported from Brazil. In my judgment, this modification will preserve the effectiveness of the alternative means to address the threatened impairment to our national security by further restraining steel article exports to the United States from Brazil during this period of market contraction. In light of this modification, I have determined that steel article imports from Brazil will not threaten to impair the national security and thus have decided to continue to exclude Brazil from the tariff proclaimed in Proclamation 9705, as amended. The United States and Brazil will hold further consultations in December 2020 to discuss the state of the steel trade between the two countries in light of then-prevailing market conditions.\n\n8. I have been informed that a reduction in this quantitative limitation set forth in Proclamation 9759 applicable to certain steel article imports from Brazil may delay or disrupt specific production activities in the United States for which imports of the steel articles covered by the quantitative limitation have already been contracted for delivery in the fourth quarter of this year. In light of these circumstances, and after considering the impact on the economy and the national security objectives of section 232 of the Trade Expansion Act of 1962, as amended, I have determined to direct the Secretary to provide relief from the quantitative limitation set forth in this proclamation in certain limited circumstances specified in more detail below, in addition to the relief from the quantitative limitations that the Secretary is already authorized to provide pursuant to clause 1 of Proclamation 9777 of August 29, 2018 (Adjusting Imports of Steel Into the United States).\n\n9. Section 232 of the Trade Expansion Act of 1962, as amended, authorizes the President to adjust the imports of an article and its derivatives that are being imported into the United States in such quantities or under such circumstances as to threaten to impair the national security of the United States.\n\n10. Section 604 of the Trade Act of 1974, as amended (19 U.S.C. 2483), authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTSUS) the substance of statutes affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including section 232 of the Trade Expansion Act of 1962, as amended, section 301 of title 3, United States Code, and section 604 of the Trade Act of 1974, as amended, do hereby proclaim as follows:\n\n(1) For purposes of administering the quantitative limitation applicable to subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil, the annual aggregate limit for Brazil set out in the Annex to this proclamation shall apply for calendar year 2020. This aggregate limit, which shall take into account all steel article imports from Brazil covered by this subheading since January 1, 2020, shall be effective for steel articles entered for consumption, or withdrawn from warehouse for consumption, under this subheading, between August 28, 2020 and December 31, 2020. For calendar year 2021 and for subsequent years, the annual aggregate limit for Brazil shall revert to the aggregate limit for Brazil set forth in the Annex to Proclamation 9759, unless that limit is further modified or terminated.\n\n(2) The Secretary shall, on an expedited basis, grant relief from the quantitative limitation applicable to subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil, as set out in the Annex to this proclamation, for any steel article where (i) the party requesting relief entered into a contract or other written agreement for the production and shipment of such steel article before August 28, 2020; (ii) such agreement specifies the quantity of such steel article that is to be produced and shipped to the United States prior to December 31, 2020; (iii) such steel article is to be used in production activities in the United States and such steel article cannot be procured from another supplier to meet the delivery schedule and specifications contained in such agreement; and (iv) lack of relief from the quantitative limitation on such steel article would significantly disrupt the production activity in the United States for which the steel article specified in such agreement is intended. The volume of imports for which the Secretary grants relief under this clause shall not exceed 60,000,000 kilograms in the aggregate.\n\n(3) The Secretary shall grant relief under clause 2 of this proclamation only upon receipt of a sworn statement signed by the chief executive officer and the chief legal officer of the party requesting relief, attesting that (i) the steel article for which relief is sought and the associated contract or other written agreement meet the criteria for relief set forth in clause 2(i) through (iv) of this proclamation; (ii) the party requesting relief will accurately report to U.S. Customs and Border Protection (CBP), in the manner that CBP prescribes, the quantity of steel articles entered for consumption, or withdrawn from warehouse for consumption, pursuant to any grant of relief; and (iii) the quantity of steel articles entered pursuant to a grant of relief will not exceed the quantity for which the Secretary has granted relief. The Secretary shall notify CBP of any grant of relief made pursuant to this proclamation. The Secretary shall revoke any grant of relief under clause 2 of this proclamation if the Secretary determines at any time after such grant that the criteria for relief have not been met and may, if the Secretary deems it appropriate, notify the Attorney General of the facts that led to such revocation.\n\n(4) As soon as practicable, the Secretary shall issue procedures for the requests for relief described in clauses 2 and 3 of this proclamation. The issuance of such procedures is exempt from Executive Order 13771 of January 30, 2017 (Reducing Regulation and Controlling Regulatory Costs). CBP shall implement relief provided under clause 2 of this proclamation as soon as practicable.\n\n(5) Until such time as the applicable quantitative limitation provided in subheading 9903.80.57 of subchapter III of chapter 99 of the HTSUS for Brazil has been reached, CBP shall count any steel article for which relief is granted under clause 2 of this proclamation toward such quantitative limitation at the time when such steel article is entered for consumption or withdrawn from warehouse for consumption. Any steel article for which relief is granted under clause 2 of this proclamation must be entered for consumption, or withdrawn from warehouse for consumption, on or before December 31, 2020, and, before January 1, 2021, further relief may not be granted for such article by the Secretary under clause 1 of Proclamation 9777. Steel articles for which relief is granted under clause 2 of this proclamation shall be subject to the duty treatment provided in subheading 9903.80.62 of subchapter III of chapter 99 of the HTSUS for Brazil, as established by the Annex to this proclamation.\n\n(6) Subdivision (a)(iii) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking \"9903.80.61\" and inserting in its place \"9903.80.62\".\n\n(7) Subdivision (c) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking, in the last sentence, \"and 9903.80.61\" and inserting in its place: \", 9903.80.61, and 9903.80.62\".\n\n(8) Subdivision (d) of U.S. note 16 to subchapter III of chapter 99 of the HTSUS is amended by striking, in the first sentence, \"and 9903.80.61\" and inserting in its place: \"through 9903.80.62\".\n\n(9) The superior text to subheadings 9903.80.05 through 9903.80.58 of subchapter III of chapter 99 of the HTSUS is amended by striking \"and 9903.80.61\" and inserting in its place: \"through 9903.80.62\".\n\n(10) To implement clause 2 of this proclamation, subchapter III of chapter 99 of the HTSUS is modified as provided in the Annex to this proclamation.\n\n(11) The modifications to the HTSUS made by clauses 6 through 10 of this proclamation and the Annex to this proclamation shall be effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on August 28, 2020, and shall continue in effect, unless such actions are expressly reduced, modified, or terminated.\n\n(12) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-eighth day of August, in the year of our Lord two thousand twenty, and of the Independence of the United States of America the two hundred and forty-fifth.\n\nDONALD J. TRUMP","P36":"By the President of the United States of America\n\nA Proclamation\n\nWhereas, pursuant to section 2 of the act of July 1, 1954, as amended (72 Stat. 678, 19 U.S.C. 1352a), the Director of the Office of Civil and Defense Mobilization has made an appropriate investigation to determine the effects on the national security of imports of crude oil and crude oil derivatives and products and, having considered the matters required by him to be considered by the said act of July 1, 1954, as amended, has advised me of his opinion \"that crude oil and the principal crude oil derivatives and products are being imported in such quantities and under such circumstances as to threaten to impair the national security\"; and\n\nWhereas, having considered the matters required by me to be considered by the said act of July 1, 1954, as amended, I agree with the said advice; and\n\nWhereas I find and declare that adjustments must be made in the imports of crude oil, unfinished oils, and finished products, so that such imports will not so threaten to impair the national security; and\n\nWhereas I find and declare that within the continental United States there are two areas, one, east of the Rocky Mountains (Districts I-IV), in which there is substantial oil production capacity in excess of actual production, and the other. west of the Rocky Mountains (District V), in which production is declining and in which, due to the absence of any significant inter-area flow of oil, limited imports are necessary to meet demand, and that accordingly, imports into such areas must be treated differently to avoid discouragement of and decrease in domestic oil production, exploration and development to the detriment of the national security; and\n\nWhereas I find and declare that the Commonwealth of Puerto Rico largely depends upon imported crude oil, unfinished oils, and finished products and that any system for the adjustment of imports of such commodities should permit imports into Puerto Rico adequate for the purposes of local consumption, export to foreign areas, and limited shipment of finished products to the continental United States:\n\nNow, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under and by virtue of the authority vested in me by section 2 of the act of July 1, 1954, as amended, do hereby proclaim as follows:\n\nSECTION 1. (a) In Districts I-IV, District V, and in Puerto Rico, on and after March 11, 1959, no crude oil or unfinished oils may be entered for consumption or withdrawn from warehouse for consumption, and on and after April 1, 1959, no finished products may be entered for consumption or withdrawn from warehouse for consumption, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries and withdrawals may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section.\n\n(b) Until the Secretary of the Interior is able to make allocations and issue licenses, he may, subject to such conditions as he may deem appropriate, temporarily authorize such entries and withdrawals without licenses and the quantities so entered or withdrawn shall be deducted from any allocation subsequently made by the Secretary to any person who has made any such entry or withdrawal.\n\n(c) In Districts I-IV, District V, and in Puerto Rico, on and after April 1, 1959, no department, establishment, or agency of the United States shall import finished products in excess of the respective allocations made to them by the Secretary of the Interior. Such allocations shall be within the maximum levels of imports established in section 2 of this proclamation.\n\nSEC. 2. (a) (1) In Districts I-IV the maximum level of imports of crude oil, unfinished oils, and finished products, except residual fuel oil to be used as fuel, shall be approximately 9% of total demand in these districts, as estimated by the Bureau of Mines for periods fixed by the Secretary of the Interior. Within this maximum level, imports of finished products, exclusive of residual fuel oil to be used as fuel, shall not exceed the level of imports of such products into these districts during the calendar year 1957 and imports of unfinished oils shall not exceed 10% of the permissible imports of crude oil and unfinished oils.\n\n(2) In Districts I-IV the imports of residual fuel oil to be used as fuel shall not exceed the level of imports of that product into these districts during the calendar year 1957.\n\n(b) In District V the maximum level of imports of crude oil, unfinished oils, and finished products shall be an amount which, together with domestic production and supply, will approximate total demand in this district as estimated by the Bureau of Mines for periods fixed by the Secretary. Within this maximum level imports of finished products shall not exceed the level of imports of such products into this district during the calendar year 1957 and imports of unfinished oils shall not exceed 10% of the permissible imports of crude oil and unfinished oils.\n\n(c) Such additional imports of crude oil may be permitted in addition to the maximum levels established in paragraphs (a) and (b) of this section as are necessary to meet the minimum requirements of refiners, and pipeline companies using crude oil directly as fuel, which are not able to obtain sufficient quantities of domestic crude oil by ordinary and continuous means, such as by barges, pipelines, or tankers.\n\n(d) The maximum level of imports of crude oil, unfinished oils, and finished products into Puerto Rico shall be approximately the level of imports into Puerto Rico during all or part of the calendar year 1958, as determined by the Secretary of the Interior to be consonant with the purposes of this proclamation, or such lower or higher levels as the Secretary may subsequently determine are required to meet increases or decreases in local demand in Puerto Rico or demand for export to foreign areas.\n\n(e) The Secretary of the Interior shall keep under review the imports into Districts I-IV and into District V of residual fuel oil to be used as fuel and the Secretary may make, on a monthly basis if required, such adjustments in the maximum level of such imports as he may determine to be consonant with the objectives of this proclamation.\n\n(f) The levels established, and the total demand referred to, in this section do not include free withdrawals by persons pursuant to section 309 of the Tariff Act of 1930, as amended (19 U.S.C. 1309), or petroleum supplies for vessels or aircraft operated by the United States between points referred to in said section 309 (as to vessels or aircraft, respectively) or between any point in the United States or its possessions and any point in a foreign country.\n\nSEC. 3. (a) The Secretary of the Interior is hereby authorized to issue regulations for the purpose of implementing this proclamation. Such regulations shall be consistent with the levels established in this proclamation for imports of crude oil, unfinished oils, and finished products into Districts I-IV, into District V, and into Puerto Rico, and shall provide for a system of allocation of the authorized imports of such crude oil, unfinished oils and finished products and for the issuance of licenses pursuant to such system, with such restrictions upon the transfer of allocations and licenses as may be deemed appropriate to further the purposes of this proclamation.\n\n(b) (1) With respect to the allocations of imports of crude oil and unfinished oils into Districts I-IV, and into District V, such regulations shall provide, to the extent possible, for a fair and equitable distribution among persons having refinery capacity in these districts in relation to refinery inputs during an appropriate period or periods selected by the Secretary and may provide for distribution in such manner as to avoid drastic reductions below the last allocations under the Voluntary Oil Import Program. Such regulations also shall provide for allocations of crude oil to persons having operating refinery capacity or having pipeline facilities using crude oil directly as fuel who show inability to obtain sufficient quantities of domestic crude oil by ordinary and continuous means, such as barges, pipelines, or tankers.\n\n(2) Such regulations shall provide for the allocation of imports of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in relation to refinery inputs during all or a part of the calendar year 1958 as the Secretary may determine.\n\n(3) Such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery except that exchanges for domestic crude or unfinished oils may be made if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery. However, persons receiving allocations of crude oil on the basis of inability to obtain sufficient domestic crude by ordinary and continuous means shall not be permitted to make exchanges.\n\n(4) With respect to the allocations of imports of finished products into Districts I—IV, District V, and Puerto Rico, such regulations shall, to the extent possible, result in a fair and equitable distribution of such products among persons who have been importers of finished products during the respective base periods specified in section 2 of this proclamation.\n\n(c) Such regulations may provide for the revocation or suspension by the Secretary of any allocation or license on grounds relating to the national security, or the violation of the terms of this proclamation, or of any regulation or license issued pursuant to this proclamation.\n\nSEC. 4. For the purpose of hearing and considering appeals or petitions by persons affected by the regulations issued by the Secretary of the Interior, he is authorized to provide for the establishment and operation of an Appeal Board, comprised of one representative each from the Departments of the Interior, Defense, and Commerce to be designated, respectively, by the heads of such Departments. Such representatives shall be of the rank of Deputy Assistant Secretary or higher. The Appeal Board may be empowered, on grounds of hardship, error, or other relevant special consideration, but within the limits of the maximum levels of imports established in section 2 of this proclamation (1) to modify any allocation made to any person under the regulations issued pursuant to section 3 of this proclamation, (2) to grant allocations of crude oil and unfinished oils in special circumstances to persons with importing histories who do not qualify for allocations under such regulations; and (3) to review the revocation or suspension of any allocation or license. The Secretary may provide that such decisions by the Appeal Board shall be final.\n\nSEC. 5. Persons who apply for allocations of crude oil, unfinished oils, or finished products and persons to whom such allocations have been made shall furnish to the Secretary of the Interior such information and shall make such reports as he may require, by regulation or otherwise, in the discharge of his responsibilities under this proclamation.\n\nSEC. 6. (a) The Director of the Office of Civil and Defense Mobilization shall maintain a constant surveillance of imports of petroleum and its primary derivatives in respect of the national security and, after consultation with the Secretaries of State, Defense, Treasury, the Interior, Commerce, and Labor, he shall inform the President of any circumstances which, in the Director's opinion might indicate the need for further Presidential action under section 2 of the act of July 1, 1954, as amended. In the event prices of crude oil or its products or derivatives should be increased after the effective date of this proclamation, such surveillance shall include a determination as to whether such increase or increases are necessary to accomplish the national security objectives of the act of July 1, 1954, as amended, and of this proclamation.\n\n(b) The Special Committee to Investigate Crude Oil Imports is hereby discharged of its responsibilities.\n\nSEC. 7. The Secretary of the Interior may delegate, and provide for successive redelegation of, the authority conferred upon him by this proclamation. All departments and agencies of the Executive branch of the Government shall cooperate with and assist the Secretary of the Interior in carrying out the purposes of this proclamation.\n\nSEC. 8. Executive Order 10761 of March 27, 1958, entitled \"Government Purchases of Crude Petroleum and Petroleum Products\" (23 F.R. 2067) is hereby revoked as of April 1, 1959.\n\nSEC. 9. As used in this proclamation:\n\n(a) \"Person\" includes an individual, a corporation, firm, or other business organization or legal entity, and an agency of a state, territorial, or local government, but does not include a department, establishment, or agency of the United States;\n\n(b) \"Districts I-IV\" means the District of Columbia and all of the States of the United States except those States within District V;\n\n(c) \"District V\" means the States of Arizona, Nevada, California, Oregon, Washington, Alaska, and the Territory of Hawaii;\n\n(d) \"Crude oil\" means crude petroleum as it is produced at the wellhead;\n\n(e) \"Finished Products\" means any one or more of the following petroleum oils, or a mixture or combination of such oils, which are to be used without further processing except blending by mechanical means:\n\n(1) liquefied gases—hydrocarbon gases recovered from natural gas or produced from petroleum refining and kept under pressure to maintain a liquid state at ambient temperatures;\n\n(2) gasoline—a refined petroleum distillate which, by its composition, is suitable for use as a carburant in internal combustion engines;\n\n(3) jet fuel—a refined petroleum distillate used to fuel jet propulsion engines;\n\n(4) naphtha—a refined petroleum distillate falling within a distillation range overlapping the higher gasoline and the lower kerosenes;\n\n(5) fuel oil—a liquid or liquefiable petroleum product burned for lighting or for the generation of heat or power and derived directly or indirectly from crude oil, such as kerosene, range oil, distillate fuel oils, gas oil, diesel fuel, topped crude oil, residues;\n\n(6) lubricating oil—a refined petroleum distillate or specially treated petroleum residue used to lessen friction between surfaces;\n\n(7) residual fuel oil—a topped crude oil or viscous residuum which, as obtained in refining or after blending with other fuel oil, meets or is the equivalent of Military Specification Mil-F-859 for Navy Special Fuel Oil and any other more viscous fuel oil, such as No. 5 or Bunker C;\n\n(8) asphalt—a solid or semi-solid cementitious material which gradually liquefies when heated, in which the predominating constituents are bitumins, and which is obtained in refining crude oil.\n\n(f) \"Unfinished Oils\" means one or more of the petroleum oils listed in paragraph (e) of this section, or a mixture or combination of such oils, which are to be further processed other than by blending by mechanical means.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDONE at the City of Washington this 10th day of March in the year of our Lord nineteen hundred and fifty-nine, and of the Independence of the United States of America the one hundred and eighty-third.\n\nDWIGHT D. EISENHOWER\n\nBy the President:\n\nCHRISTIAN A. HERTER,\n\nActing Secretary of State","M19":"Memorandum for the Secretary of Commerce\n\nSubject: Policy on Technology Transfers to the USSR\n\nI direct that you, in consultation with the Secretary of Defense and other appropriate officials, review and revise our policy with respect to the export of high technology and other strategic items to the Soviet Union. Pending review, no validated export licenses for shipment of goods or technical data to the Soviet Union are to be approved. This review is to reassess what exports will make a significant contribution to the military potential of the Soviet Union and therefore prove detrimental to the security of the United States in light of the Soviet intervention in Afghanistan.\n\nIn addition, I direct that you immediately review those transactions for which validated licenses have already been issued but export has not occurred to determine whether any such licenses should be suspended or revoked in light of the changed national security circumstances.\n\nFinally, I direct that you, in consultation with the Secretary of State and other appropriate officials, determine whether certain transactions now under general license requirements should be subject to validated license requirements.\n\nJIMMY CARTER\n\nMemorandum for the Secretary of State, the Secretary of Defense\n\nSubject: Policy on Technology Transfers to the USSR\n\nI have directed the Secretary of Commerce to review and revise our policy with respect to the export of high technology and other strategic items to the Soviet Union. This review is to reassess what exports will make a significant contribution to the military potential of the Soviet Union and therefore prove detrimental to the security of the United States in light of the Soviet intervention in Afghanistan.\n\nOur COCOM partners should be consulted on this review, which will reexamine precedents established in the past for COCOM exceptions, in order to secure their cooperation. These consultations should make clear that the basis for review and revision is the Soviet intervention in Afghanistan which has changed the nature of the potential danger to our common military security.\n\nJIMMY CARTER","EO30":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including sections 3301 and 3302 of title 5, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy. The Federal Government benefits from a diverse workforce that includes students and recent graduates, who infuse the workplace with their enthusiasm, talents, and unique perspectives. The existing competitive hiring process for the Federal civil service, however, is structured in a manner that, even at the entry level, favors job applicants who have significant previous work experience. This structure, along with the complexity of the rules governing admission to the career civil service, creates a barrier to recruiting and hiring students and recent graduates. It places the Federal Government at a competitive disadvantage compared to private-sector employers when it comes to hiring qualified applicants for entry-level positions.\n\nTo compete effectively for students and recent graduates, the Federal Government must improve its recruiting efforts; offer clear paths to Federal internships for students from high school through post-graduate school; offer clear paths to civil service careers for recent graduates; and provide meaningful training, mentoring, and career-development opportunities. Further, exposing students and recent graduates to Federal jobs through internships and similar programs attracts them to careers in the Federal Government and enables agency employers to evaluate them on the job to determine whether they are likely to have successful careers in Government.\n\nAccordingly, pursuant to my authority under 5 U.S.C. 3302(1), and in order to achieve a workforce that represents all segments of society as provided in 5 U.S.C. 2301(b)(1), I find that conditions of good administration (specifically, the need to promote employment opportunities for students and recent graduates in the Federal workforce) make necessary an exception to the competitive hiring rules for certain positions in the Federal civil service.\n\nSec. 2. Establishment. There are hereby established the Internship Program and the Recent Graduates Program, which, along with the Presidential Management Fellows Program, as modified herein, shall collectively be known as the Pathways Programs. I therefore direct the Director of the Office of Personnel Management (OPM) to issue regulations implementing the Pathways Programs consistent with this order, including:\n\n(a) a description of the positions that executive departments and agencies (agencies) may fill through the Pathways Programs because conditions of good administration necessitate excepting those positions from the competitive hiring rules;\n\n(b) rules governing whether, to what extent, and in what manner public notice should be provided of job opportunities in the Pathways Programs;\n\n(c) a description of career-development, training, and mentorship opportunities for participants in the Pathways Programs;\n\n(d) requirements that managers meaningfully assess the performance of participants in the Pathways Programs to identify those who should be considered for conversion to career civil service positions;\n\n(e) a description of OPM oversight of agency use of the Pathways Programs to ensure that (i) they serve as a supplement to, and not a substitute for, the competitive hiring process, and (ii) agencies are using the Pathways Programs in a genuine effort to develop talent for careers in the civil service;\n\n(f) a description of OPM plans to evaluate agencies' effectiveness in recruiting and retaining talent using the Pathways Programs and of the satisfaction of Pathways Programs participants and their hiring managers; and\n\n(g) standard naming conventions across agencies, so that students and recent graduates can clearly understand and compare the career pathway opportunities available to them in the Federal Government.\n\nSec. 3. Internship Program. The Internship Program shall provide students in high schools, community colleges, 4-year colleges, trade schools, career and technical education programs, and other qualifying educational institutions and programs, as determined by OPM, with paid opportunities to work in agencies and explore Federal careers while still in school. The Internship Program would replace the existing Student Career Experience Program, established pursuant to Executive Order 12015 of October 26, 1977. The following principles and policies shall govern the Internship Program:\n\n(a) Participants in the program shall be referred to as \"Interns\" and shall be students enrolled, or accepted for enrollment, in qualifying educational institutions and programs, as determined by OPM.\n\n(b) Subject to any exceptions OPM may establish by regulation, agencies shall provide Interns with meaningful developmental work and set clear expectations regarding the work experience of the intern.\n\n(c) Students employed by third-party internship providers but placed in agencies may, to the extent permitted by OPM regulations, be treated as participants in the Internship Program.\n\nSec. 4. Recent Graduates Program. The Recent Graduates Program shall provide individuals who have recently graduated from qualifying educational institutions or programs with developmental experiences in the Federal Government intended to promote possible careers in the civil service. The following principles and policies shall govern the Recent Graduates Program:\n\n(a) Participants in the program shall be referred to as \"Recent Graduates\" and must have obtained a qualifying degree, or completed a qualifying career or technical education program, as determined by OPM, within the preceding 2 years, except that veterans who, due to their military service obligation, were precluded from participating in the Recent Graduates Program during the 2-year period after obtaining a qualifying degree or completing a qualifying program shall be eligible to participate in the Program within 6 years of obtaining a qualifying degree or completing a qualifying program.\n\n(b) Responsibilities assigned to a Recent Graduate shall be consistent with his or her qualifications, educational background, and career interests, the purpose of the Recent Graduates Program, and agency needs.\n\nSec. 5. Presidential Management Fellows Program. The Presidential Management Fellows (PMF) Program is an existing program established pursuant to Executive Order 13318 of November 21, 2003, that aims to attract to the Federal service outstanding men and women from a variety of academic disciplines at the graduate level who have a clear interest in, and commitment to, the leadership and management of public policies and programs. The following requirements shall govern the PMF Program upon the revocation of Executive Order 13318, as provided in section 8 of this order:\n\n(a) Participants in this program shall continue to be known as Presidential Management Fellows (PMFs or Fellows) and must have received, within the preceding 2 years, a qualifying advanced degree, as determined by OPM.\n\n(b) Responsibilities assigned to a PMF shall be consistent with the PMF's qualifications, educational background, and career interests, the purposes of the PMF Program, and agency needs.\n\n(c) OPM shall establish the eligibility requirements and minimum qualifications for the program, as well as a process for assessing eligible individuals for consideration for appointment as PMFs.\n\nSec. 6. Appointment and Conversion. (a) Appointments to any of the Pathways Programs shall be under Schedule D of the excepted service, as established by section 7 of this order.\n\n(b) Appointments to the Recent Graduates or PMF Programs shall not exceed 2 years, unless extended by the employing agency for up to 120 days thereafter.\n\n(c) Appointment to a Pathways Program shall confer no right to further Federal employment in either the competitive or excepted service upon the expiration of the appointment, except that agencies may convert eligible participants noncompetitively to term, career, or career conditional appointments after satisfying requirements to be established by OPM, an
