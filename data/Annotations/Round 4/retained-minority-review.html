d overseeing entry of foreign nationals into our country in the interest of the United States. This pandemic has the potential to cause severe consequences for our country's national and economic security. Based on the advice of public health officials, I have already taken stringent measures to restrict travel to the United States of foreign nationals who have been recently physically present in certain countries that pose a threat of intensifying the spread of COVID–19 within our country. And HHS and CDC have taken effective action to address the public health threat posed by COVID–19. While these actions have been in the best interest of the health of our people, COVID–19 has the potential to impose a temporary financial hardship on all Americans. It is therefore critical that we deploy all powers and authorities available to the Federal Government to provide needed relief.","2":"Therefore, as an initial step, I hereby determine, under section 501(b) of the Stafford Act, that an emergency exists nationwide. In accordance with this determination, the Federal Emergency Management Agency may provide, as appropriate, assistance pursuant to section 502 and 503 of the Stafford Act for emergency protective measures not authorized under other Federal statutes.","3":"Administrator Gaynor shall coordinate and direct other Federal agencies in providing needed assistance under the Stafford Act, subject to the Department of Health and Human Services' role as the lead Federal agency for the Federal Government's response to COVID–19. In order to meet the challenges caused by this emergency pandemic, I have encouraged all State and local governments to activate their Emergency Operations Centers and to review their emergency preparedness plans.","4":"In the meantime, I expect FEMA to continue to review all ways in which it can provide assistance to States consistent with the authorities provided to it by this letter and by statute.","5":"I am also instructing Secretary Mnuchin to provide relief from tax deadlines to Americans who have been adversely affected by the COVID–19 emergency, as appropriate, pursuant to 26 U.S.C. 7508A(a).","6":"In addition, after careful consideration, I believe that the disaster is of such severity and magnitude nationwide that requests for a declaration of a major disaster as set forth in section 401(a) of the Stafford Act may be appropriate. I encourage all governors and tribal leaders to consider requesting Federal assistance under this provision of the Stafford Act, pursuant to the statutory criteria. I stand ready to expeditiously consider any such request."},"M7":{"1":"On October 13, 2017, consistent with certification procedures stipulated in the Iran Nuclear Agreement Review Act, I determined that I was unable to certify that the suspension of sanctions related to Iran pursuant to the JCPOA was appropriate and proportionate to the specific and verifiable measures taken by Iran with respect to terminating its illicit nuclear program. On January 12, 2018, I outlined two possible paths forward—the JCPOA's disastrous flaws would be fixed by May 12, 2018, or, failing that, the United States would cease participation in the agreement. I made clear that this was a last chance, and that absent an understanding to fix the JCPOA, the United States would not continue to implement it. That understanding has not materialized, and I am today making good on my pledge to end the participation of the United States in the JCPOA. I do not believe that continuing to provide JCPOA-related sanctions relief to Iran is in the national interest of the United States, and I will not affirm what I know to be false.","2":"Further, I have determined that it is in the national interest of the United States to re-impose sanctions lifted or waived in connection with the JCPOA as expeditiously as possible. Section 1. Policy. It is the policy of the United States that Iran be denied a nuclear weapon and intercontinental ballistic missiles; that Iran's network and campaign of regional aggression be neutralized; to disrupt, degrade, or deny the Islamic Revolutionary Guards Corps and its surrogates access to the resources that sustain their destabilizing activities; and to counter Iran's aggressive development of missiles and other asymmetric and conventional weapons capabilities. The United States will continue to pursue these aims and the objectives contained in the Iran strategy that I announced on October 13, 2017, adjusting the ways and means to achieve them as required. Sec. 2.","3":"Ending United States Participation in the JCPOA. The Secretary of State shall, in consultation with the Secretary of the Treasury and the Secretary of Energy, take all appropriate steps to cease the participation of the United States in the JCPOA. Sec. 3. Restoring United States Sanctions. The Secretary of State and the Secretary of the Treasury shall immediately begin taking steps to re-impose all United States sanctions lifted or waived in connection with the JCPOA, including those under the National Defense Authorization Act for Fiscal Year 2012, the Iran Sanctions Act of 1996, the Iran Threat Reduction and Syria Human Rights Act of 2012, and the Iran Freedom and Counter-proliferation Act of 2012. These steps shall be accomplished as expeditiously as possible, and in no case later than 180 days from the date of this memorandum.","4":"The Secretary of State and the Secretary of the Treasury shall coordinate, as appropriate, on steps needed to achieve this aim. They shall, for example, coordinate with respect to preparing any recommended executive actions, including appropriate documents to re-impose sanctions lifted by Executive Order 13716 of January 16, 2016; preparing to re-list persons removed, in connection with the JCPOA, from any relevant sanctions lists, as appropriate; revising relevant sanctions regulations; issuing limited waivers during the wind-down period, as appropriate; and preparing guidance necessary to educate United States and non-United States business communities on the scope of prohibited and sanctionable activity and the need to unwind any such dealings with Iranian persons. Those steps should be accomplished in a manner that, to the extent reasonably practicable, shifts the financial burden of unwinding any transaction or course of dealing primarily onto Iran or the Iranian counterparty. Sec. 4. Preparing for Regional Contingencies.","5":"The Secretary of Defense and heads of any other relevant agencies shall prepare to meet, swiftly and decisively, all possible modes of Iranian aggression against the United States, our allies, and our partners.","6":"The Department of Defense shall ensure that the United States develops and retains the means to stop Iran from developing or acquiring a nuclear weapon and related delivery systems. Sec. 5. Monitoring Iran's Nuclear Conduct and Consultation with Allies and Partners.","7":"Agencies shall take appropriate steps to enable the United States to continue to monitor Iran's nuclear conduct. I am open to consultations with allies and partners on future international agreements to counter the full range of Iran's threats, including the nuclear weapon and intercontinental ballistic missile threats, and the heads of agencies shall advise me, as appropriate, regarding opportunities for such consultations. Sec. 6. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"EO22":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the laws cited herein, it is hereby ordered as follows: Section 1. Statutory Pay Systems. The rates of basic pay or salaries of the statutory pay systems (as defined in 5 U.S.C. 5302(1)), as adjusted under 5 U.S.C. 5303(a), are set forth on the schedules attached hereto and made a part hereof: (a) The General Schedule (5 U.S.C. 5332(a)) at Schedule 1; (b) The Foreign Service Schedule (22 U.S.C. 3963) at Schedule 2; and (c) The schedules for the Veterans Health Administration of the Department of Veterans Affairs (38 U.S.C. 7306, 7404; section 301(a) of Public Law 102-40) at Schedule 3. Sec. 2. Senior Executive Service. The ranges of rates of basic pay for senior executives in the Senior Executive Service, as established pursuant to 5 U.S.C. 5382, are set forth on Schedule 4 attached hereto and made a part hereof. Sec. 3. Certain Executive, Legislative and Judicial Salaries. The rates of basic pay or salaries for the following offices and positions are set forth on the schedules attached hereto and made a part hereof: (a) The Executive Schedule (5 U.S.C. 5312-5318) at Schedule 5; (b) The Vice President (3 U.S.C. 104) and the Congress (2 U.S.C. 31) at Schedule 6; and (c) Justices and judges (28 U.S.C. 5, 44(d), 135, 252, and 461(a), section 140 of Public Law 97-92, and section 305 of Division D of the Consolidated Appropriations Act, 2008), at Schedule 7. Sec. 4. Uniformed Services. The rates of monthly basic pay (37 U.S.C. 203(a)) for members of the uniformed services, as adjusted under 37 U.S.C. 1009, and the rate of monthly cadet or midshipman pay (37 U.S.C. 203(c)) are set forth on Schedule 8 attached hereto and made a part hereof. Sec. 5. Locality-Based Comparability Payments. (a) Pursuant to section 5304 of title 5, United States Code, and section 740 of Division D of the Consolidated Appropriations Act, 2008, locality-based comparability payments shall be paid in accordance with Schedule 9 attached hereto and made a part hereof.","2":"(b) The Director of the Office of Personnel Management shall take such actions as may be necessary to implement these payments and to publish appropriate notice of such payments in the Federal Register. Sec. 6. Administrative Law Judges. The rates of basic pay for administrative law judges, as adjusted under 5 U.S.C. 5372(b)(4), are set forth on Schedule 10 attached hereto and made a part hereof. Sec. 7. Effective Dates. Schedule 8 is effective on January 1, 2008. The other schedules contained herein are effective on the first day of the first applicable pay period beginning on or after January 1, 2008. Sec. 8. Prior Order Superseded. Executive Order 13420 of December 21, 2006, is superseded."},"L14":{"1":"Consistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b) (IEEPA), I hereby report that I have issued an Executive Order (this \"order\") in which I terminate the national emergency declared in Executive Order 12722 of August 2, 1990, amend Executive Order 13290 of March 20, 2003, and take additional steps regarding the national emergency I declared in Executive Order 13303 of May 22, 2003, and expanded in Executive Order 13315 of August 28, 2003.","2":"I have determined that the situations that gave rise to these national emergencies have been significantly altered by the removal of the regime of Saddam Hussein and other developments. Executive Order 12722 of August 2, 1990, imposed sanctions on Iraq in response to its invasion of Kuwait and other actions. Those sanctions were modified in Executive Order 12724 of August 9, 1990, in light of United Nations Security Council Resolution (UNSCR) 661 of August 6, 1990, which also imposed sanctions on Iraq.","3":"I have determined that the removal of the regime of Saddam Hussein warrants the termination altogether of the national emergency declared in Executive Order 12722. This action is consistent with United Nations Security Council Resolutions 1483 and 1546, of May 22, 2003, and June 8, 2004, respectively, which substantially lifted the multilateral economic sanctions against Iraq.","4":"Although I am terminating the national emergency declared in Executive Order 12722, pursuant to my authority under IEEPA,","5":"I am continuing for the near future certain prohibitions with respect to property previously blocked pursuant to Executive Orders 12722 and 12724. Such prohibitions are necessary on account of claims involving Iraq. Consistent with section 203(a)(1)(C) of IEEPA, 50 U.S.C. 1702(a)(1)(C), in Executive Order 13290 of March 20, 2003, I ordered that certain blocked funds held in the United States in accounts in the name of the Government of Iraq, the Central Bank of Iraq, Rafidain Bank, Rasheed Bank, or the State Organization for Marketing Oil be confiscated and vested in the Department of the Treasury. I originally exercised these authorities in furtherance of Executive Order 12722. In light of the changed circumstances in Iraq, and my decision to terminate the national emergency declared in Executive Order 12722, I have now determined that the exercise of authorities in Executive Order 13290 should continue in order to address the national emergency I declared in Executive Order 13303 of May 22, 2003, and expanded in Executive Order 13315 of August 28, 2003, regarding the obstacles posed to the orderly reconstruction of Iraq. This order amends Executive Order 13290 to that effect. In Executive Order 13303 of May 22, 2003, I declared a national emergency to address the unusual and extraordinary threat to the national security and foreign policy of the United States posed by obstacles to the orderly reconstruction of Iraq, the restoration and maintenance of peace and security in that country, and the development of political, administrative, and economic institutions in Iraq. I expanded that emergency in Executive Order 13315 of August 28, 2003, in light of UNSCR 1483 of May 22, 2003, in which the Security Council decided that states shall freeze the assets of the former Iraqi regime, Saddam Hussein, and other senior officials of the former Iraqi regime, and their immediate family members, among others, and cause the transfer of certain of those assets to the Development Fund for Iraq. Executive Order 13315 implements this provision of UNSCR 1483. This order further modifies the actions taken to address the national emergency declared in Executive Order 13303, as expanded in Executive Order 13315, by amending the Annex to Executive Order 13315 to include certain persons determined to have been subject to economic sanctions pursuant to Executive Orders 12722 and 12724.","6":"Because of their association with the prior Iraqi regime, I have determined that these persons present an obstacle to the orderly reconstruction of Iraq, the restoration and maintenance of peace and security in that country, and the development of political, administrative, and economic institutions in Iraq and, therefore,","7":"I have determined that such persons should be subject to sanctions under Executive Order 13315.","8":"Additionally, in UNSCR 1483, the Security Council decided that states shall take appropriate steps to facilitate the safe return to Iraqi institutions of Iraqi cultural property or other items of archeological, historical, cultural, rare scientific, and religious importance that were illegally removed from the Iraq National Museum, the National Library, and other locations in Iraq since August 6, 1990, including by establishing a prohibition on trade in or transfer of such items and items with respect to which reasonable suspicion exists that they have been illegally removed. This order, among other actions, implements this international legal obligation. I have delegated to the Secretary of the Treasury, in consultation with the Secretary of State, the authority to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by IEEPA and the United Nations Participation Act of 1945, as amended, as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government consistent with applicable law. I have directed all agencies of the United States Government to take all appropriate measures within their authority to carry out the provisions of this order. I have enclosed a copy of this order, which became effective at 12:01 a.m. eastern daylight time on July 30, 2004."},"EO3":{"1":"By virtue of the authority vested in me by section 5(d) of the Act of March 18, 1959, providing for the admission of the State of Hawaii into the Union (73 Stat. 5), and as President of the United States, it is hereby ordered as follows— 1.","2":"All lands and other property hereinafter described, being lands and property which were ceded to the United States by the Republic of Hawaii under the joint resolution of annexation, approved July 7, 1898 (30 Stat. 750), or which have been acquired in exchange for lands or properties so ceded, are hereby set aside for the use of the United States* in fee simple subject to valid existing rights— Portion Of Tract B, Makua Military Reservation Being portions of the Government Lands of Makua and Eahanahaiki, and a portion of the Makua Forest Reserve. Situated at Makua and Kahanahaiki, Waianae, Oahu, Hawaii. Beginning at a point on the westerly boundary of this piece of land, also being on the northerly boundary of Plot 1 of Parcel 5 of the U.S. Condemnation Civil Action No. 485 (Land Commission Award 6092:1), the coordinates of said point of beginning from Government Survey Triangulation Station \"Makua U. S. E.\" being 4,950.50 feet North and 1,246.93 feet East, thence running by azimuths measured clockwise from true South: Proceeding along the remainder of the land of Kahanahaiki for the next four courses: 1. 171°08'642.12 feet; 2. 159°36'2,440.00 feet; 3. 149°28' 1,438.00 feet; 4. 242°51'40\" 1,991.74 feet; 5. 230°00' 1,100.00 feet along the remainder of Land of Kahanahaiki and MakuaKeaau Forest Reserve to the top of the ridge separating the Kuaokala Forest Reserve and Makua-Keaau Forest Reserve; thence along Kuaokala Forest Reserve, along the ridge, direct azimuth and distance being: 6. 261°32' 895.30 feet; thence along Mokuleia Forest Reserve, along the ridge for the next two courses, the direct azimuths and distances being: 7. 291°00' 7,070.00 feet; 8. 316°15' 10,870.00 feet; thence along Land Court Application 1052, along the ridge for the next five courses, the direct azimuths and distances being: 9. 58°10' 1,426.10 feet; 10. 65°42' 1,299.60feet; 11. 69°51' 2,347.20 feet; 12. 60°11' 994.30 feet; 13. 96°42' 817.90 feet; thence along the remainders of Makua-Keaau Forest Reserve, along the ridge, the direct azimuth and distance being: 14. 97°31'06\" 7,713.10 feet; thence along the Land of Ohikilolo, along the ridge, the direct azimuth and distance being: 15. 105°31'30\" 1 600 00 feet 16. 180°30' 2,360.00 feet along the remainder of the Land of Makua; 17. 171°08' 3,213.88 feet along the remainders of the Land of Makua, Kahanahaiki and Plot 1 of Parcel 5 of U.S. Condemnation Civil Action No. 485 (Land Commission Award 6092:1) to the point of beginning and containing a gross area of 3,273 acres, less 5.95 acres of Tract 1 of Makua Military Reservation (State fee land) and 30.57 acres of Condemned Land, leaving a net area of 3,236.48 acres, more or less. 2.","3":"Access rights to and from the nearest public highway to the above described land in, upon, over, and across, such of the lands and properties adjoining thereto which were ceded to the United States by the Republic of Hawaii under the joint resolution of annexation, approved July 7, 1898 (30 Stat. 750), or which have been acquired in exchange for lands or properties so ceded are also hereby set aside for the use of the United States."},"P43":{"1":"Accordingly, I have determined that the risks from the classes of aliens covered by this proclamation cannot be satisfactorily mitigated absent resolution of the predominating country-specific concerns, and any extraordinary cases can be appropriately addressed through the national-interest exceptions provided for in this proclamation and Proclamation 10949.","2":"As a result of these reviews and considerations, I have decided—as described in sections 2 and 3 of this proclamation—to continue to impose and modify the limitations set forth in sections 2 and 3 of Proclamation 10949 on the entry into the United States by certain classes of foreign nationals.","3":"Also, I have decided—as described in sections 4 and 5 of this proclamation—to impose the limitations set forth below on the entry into the United States by certain other classes of foreign nationals.","4":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including sections 212(f) and 215(a) of the INA, 8 U.S.C. 1182(f) and 1185(a), and section 301 of title 3, United States Code, hereby find that, absent the measures set forth in this proclamation, the immigrant and nonimmigrant entry into the United States of persons described in sections 2, 3, 4, and 5 of this proclamation would be detrimental to the interests of the United States, and that their entry should be subject to certain restrictions, limitations, and exceptions.","5":"I therefore hereby proclaim the following: Section 1. Policy and Purpose. (a) It is the policy of the United States to protect its citizens from terrorist attacks and other national security and public safety threats. Screening and vetting protocols and procedures associated with visa adjudications and other immigration processes play a critical role in implementing that policy. These protocols and procedures enhance our ability to detect foreign nationals who may commit, aid, or support acts of terrorism, or otherwise pose a safety threat, and they aid our efforts to prevent such foreign nationals from entering the United States. (b) Identity-management and information-sharing standards and practices of foreign governments impact the effectiveness of the screening and vetting protocols and procedures of the United States. Foreign governments manage the identity and travel documents of their nationals and residents. They also control the circumstances under which they provide information about their nationals and residents to other governments, including information about known and suspected terrorists and criminals. It is, therefore, the policy of the United States to take all necessary and appropriate steps to encourage foreign governments to improve their identity-management and information-sharing protocols and procedures and to regularly share their identity and threat information with the screening and vetting systems of the United States. (c) Proclamation 10949 directed the United States Government to fully restrict and limit the entry of nationals of the following 12 countries: Afghanistan, Burma, Chad, Republic of the Congo, Equatorial Guinea, Eritrea, Haiti, Iran, Libya, Somalia, Sudan, and Yemen. The proclamation directed the United States Government to partially restrict and limit the entry of nationals of the following 7 countries: Burundi, Cuba, Laos, Sierra Leone, Togo, Turkmenistan, and Venezuela. Additionally, the proclamation directed the Secretary of State, in consultation with the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, to immediately engage each of the countries identified in the proclamation on measures that must be taken to comply with United States screening, vetting, immigration, and security requirements. (d) Proclamation 10949 directed the Secretary of State, in consultation with the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, to submit a report to the President, through the Assistant to the President for Homeland Security, describing his assessment and recommending whether any suspensions and limitations imposed by the proclamation should be continued, terminated, modified, or supplemented. (e) The Secretary of State, with the Assistant to the President for Homeland Security, presented the report described in subsection (d) of this section, recommending that entry restrictions and limitations continue to apply to foreign nationals of several countries. The report also identified additional countries for which vetting and screening information is so deficient as to warrant a full or partial suspension of admission.","6":"These recommendations follow the engagement with foreign countries that I directed in Proclamation 10949. (f) In evaluating the recommendations from the Secretary of State and determining whether and to what extent to impose, or continue to impose, restrictions for each country, I consulted with the Secretary of State, the Secretary of War, the Attorney General, the Secretary of Homeland Security, the Director of National Intelligence, appropriate Assistants to the President, and the Director of the Central Intelligence Agency. I considered foreign policy, national security, and counterterrorism goals. I further considered various factors, including each country's screening and vetting capabilities, information-sharing policies, and country-specific risk factors, including whether each country has a significant terrorist presence within its territory, its visa-overstay rate, and its cooperation with accepting back its removable nationals. Each of these factors, including visa-overstay rates, was just one of the factors considered in making the determinations in this proclamation, and the determinations in this proclamation are based on the totality of the circumstances with respect to each country after a review of all relevant factors. I also considered the different risks posed by aliens admitted on immigrant visas and those admitted on nonimmigrant visas. Persons admitted on immigrant visas are, or can become, lawful permanent residents of the United States. Such persons admitted on immigrant visas may present national security or public safety concerns that may be distinct from those admitted as nonimmigrants. The United States affords lawful permanent residents more enduring rights than it does to nonimmigrants. Lawful permanent residents are more difficult to remove than nonimmigrants, even after national security or public safety concerns arise, which increases the costs and aggravates the dangers of errors associated with admitting such individuals. And although immigrants are generally subject to more extensive vetting than nonimmigrants, such vetting is far less reliable when the country from which someone seeks to emigrate maintains inadequate identity-management or information-sharing policies or otherwise poses risks to the national security or public safety of the United States. I reviewed these factors and assessed these goals, with a particular focus on crafting country-specific restrictions. This approach was designed to encourage cooperation with the relevant countries in recognition of each country's unique circumstances. The restrictions and limitations imposed by this proclamation are, in my judgment, necessary to prevent the entry or admission of foreign nationals about whom the United States Government lacks sufficient information to assess the risks they pose to the United States. The restrictions and limitations imposed by this proclamation are necessary: to garner cooperation from foreign governments, including as to reducing overstay rates of their nationals; enforce our immigration laws; and advance other important foreign policy, national security, and counterterrorism objectives. Under the current circumstances, without the restrictions and limitations imposed in this proclamation, the entry or admission of such foreign nationals is detrimental to the national interest.","7":"(g) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to continue to fully restrict and limit the entry of nationals of the following 12 countries: Afghanistan, Burma, Chad, Republic of the Congo, Equatorial Guinea, Eritrea, Haiti, Iran, Libya, Somalia, Sudan, and Yemen. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants.","8":"(h) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to fully restrict and limit the entry of nationals of 7 additional countries: Burkina Faso, Laos, Mali, Niger, Sierra Leone, South Sudan, and Syria. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants. I have also determined to fully restrict and limit the entry of individuals using travel documents issued or endorsed by the Palestinian Authority (PA). (i) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to continue to partially restrict and limit the entry of nationals of the following 4 countries: Burundi, Cuba, Togo, and Venezuela. I have also decided to modify the partial restriction and limitation on the entry of nationals of Turkmenistan. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants.","9":"(j) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to partially restrict and limit the entry of nationals of the following 15 countries: Angola, Antigua and Barbuda, Benin, Cote d 'Ivoire, Dominica, Gabon, The Gambia, Malawi, Mauritania, Nigeria, Senegal, Tanzania, Tonga, Zambia, and Zimbabwe. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants. (k) Sections 4 and 5 of this proclamation describe some of the identity-management and information-sharing inadequacies that led me to impose, or continue to impose, the restrictions described in this proclamation. These inadequacies are sufficient to justify my finding that unrestricted entry of nationals from the named countries would be detrimental to the interests of the United States. Publicly disclosing additional details on which I relied in making these determinations, however, would cause serious damage to the national security of the United States, and many such details are classified. Sec. 2. Continued Full Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries continues to be suspended and limited as set forth in Proclamation 10949 and herein, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation: (a) Afghanistan; (b) Burma; (c) Chad; (d) Republic of the Congo; (e) Equatorial Guinea; (f) Eritrea; (g) Haiti; (h) Iran; (i) Libya; (j) Somalia; (k) Sudan; and (l) Yemen. Sec. 3. Continued Partial Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries continues to be suspended and limited as set forth in Proclamation 10949 and herein, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation: (a) Burundi; (b) Cuba; (c) Togo; and (d) Venezuela. Sec. 4. Full Suspension of Entry for Nationals of Countries of Identified Concern.","10":"The entry into the United States of nationals of the following countries is hereby suspended and limited, as follows, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation: (a) Burkina Faso (i) According to the Department of State, terrorist organizations continue to plan and conduct terrorist activities throughout Burkina Faso. According to the Fiscal Year 2024, Department of Homeland Security (DHS) Entry/Exit Overstay Report (\"Overstay Report\"), Burkina Faso had a B–1/B–2 visa overstay rate of 9.16 percent and a student (F), vocational (M), and exchange visitor (J) visa overstay rate of 22.95 percent. Additionally, Burkina Faso has historically refused to accept back its removable nationals. (ii) The entry into the United States of nationals of Burkina Faso as immigrants and as nonimmigrants is hereby fully suspended. (b) Laos (i) According to the Overstay Report, Laos had a B–1/B–2 visa overstay rate of 28.34 percent and an F, M, and J visa overstay rate of 11.41 percent. According to the Fiscal Year 2023, Department of Homeland Security (DHS) Entry/Exit Overstay Report (\"2023 Overstay Report\"), Laos had a B–1/B–2 visa overstay rate of 34.77 percent and an F, M, and J visa overstay rate of 6.49 percent. Additionally, Laos has historically failed to accept back its removable nationals. (ii) The entry into the United States of nationals of Laos as immigrants and as nonimmigrants is hereby fully suspended. (c) Mali (i) According to the Department of State, armed conflict between the Malian government and armed groups is common throughout the country. Terrorist organizations operate freely in certain areas of Mali. (ii) The entry into the United States of nationals of Mali as immigrants and as nonimmigrants is hereby fully suspended. (d) Niger (i) According to the Department of State, terrorists and their supporters are active in planning kidnappings in Niger, and they may attack anywhere in the country. According to the Overstay Report, Niger had a B–1/B–2 visa overstay rate of 13.41 percent and an F, M, and J visa overstay rate of 16.46 percent. (ii) The entry into the United States of nationals of Niger as immigrants and as nonimmigrants is hereby fully suspended. (e) Sierra Leone (i) According to the Overstay Report, Sierra Leone had a B–1/B–2 visa overstay rate of 16.48 percent and an F, M, and J visa overstay rate of 35.83 percent. According to the 2023 Overstay Report, Sierra Leone had a B–1/B–2 visa overstay rate of 15.43 percent and an F, M, and J visa overstay rate of 35.83 percent. Additionally, Sierra Leone has historically failed to accept back its removable nationals. (ii) The entry into the United States of nationals of Sierra Leone as immigrants and as nonimmigrants is hereby fully suspended. (f) South Sudan (i) According to the Overstay Report, South Sudan had a B–1/B–2 visa overstay rate of 6.99 percent and an F, M, and J visa overstay rate of 26.09 percent. Additionally, South Sudan has historically failed to accept back its removable nationals. (ii) The entry into the United States of nationals of South Sudan as immigrants and as nonimmigrants is hereby fully suspended. (g) Syria (i) Syria is emerging from a protracted period of civil unrest and internal strife. While the country is working to address its security challenges in close coordination with the United States, Syria still lacks an adequate central authority for issuing passports or civil documents and does not have appropriate screening and vetting measures. According to the Overstay Report, Syria had a B–1/B–2 visa overstay rate of 7.09 percent and a F, M, and J visa overstay rate of 9.34 percent. (ii) The entry into the United States of nationals of Syria as immigrants and nonimmigrants is hereby fully suspended. (h) Palestinian Authority Documents (i) Several United States-designated terrorist groups operate actively in the West Bank or Gaza Strip and have murdered American citizens. Also, the recent war in these areas likely resulted in compromised vetting and screening abilities. In light of these factors, and considering the weak or nonexistent control exercised over these areas by the PA, individuals attempting to travel on PA-issued or endorsed travel documents cannot currently be properly vetted and approved for entry into the United States. (ii) The entry into the United States of foreign nationals who seek to travel on any travel documents issued or endorsed by the PA, as immigrants and nonimmigrants, is hereby fully suspended. Sec. 5. Partial Suspension of Entry for Nationals of Countries of Identified Concern.","11":"The entry into the United States of nationals of the following countries is hereby suspended and limited, as follows, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation: (a) Angola (i) According to the Overstay Report, Angola had a B–1/B–2 visa overstay rate of 14.43 percent and an F, M, and J visa overstay rate of 21.92 percent.","12":"(ii) The entry into the United States of nationals of Angola as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Angola to the extent permitted by law. (b) Antigua and Barbuda (i) Antigua and Barbuda has historically had CBI without residency.","13":"(ii) The entry into the United States of nationals of Antigua and Barbuda as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Antigua and Barbuda to the extent permitted by law. (c) Benin (i) According to the Overstay Report, Benin had a B–1/B–2 overstay rate of 12.34 percent and an F, M, and J visa overstay rate of 36.77 percent.","14":"(ii) The entry into the United States of nationals of Benin as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Benin to the extent permitted by law. (d) Cote d'Ivoire (i) According to the Overstay Report, Cote d'Ivoire had a B–1/B–2 visa overstay rate of 8.47 percent and an F, M, and J visa overstay rate of 19.09 percent.","15":"(ii) The entry into the United States of nationals of Cote d 'Ivoire as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Cote d 'Ivoire to the extent permitted by law. (e) Dominica (i) Dominica has historically had CBI without residency.","16":"(ii) The entry into the United States of nationals of Dominica as immigrants, and as nonimmigrants on B 1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Dominica to the extent permitted by law. (f) Gabon (i) According to the Overstay Report, Gabon had a B–1/B–2 visa overstay rate of 13.72 percent and an F, M, and J visa overstay rate of 17.77 percent.","17":"(ii) The entry into the United States of nationals of Gabon as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Gabon to the extent permitted by law. (g) The Gambia (i) According to the Overstay Report, The Gambia had a B–1/B–2 visa overstay rate of 12.70 percent and an F, M, and J visa overstay rate of 38.79 percent. Additionally, The Gambia has historically refused to accept back its removable nationals.","18":"(ii) The entry into the United States of nationals of The Gambia as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of The Gambia to the extent permitted by law. (h) Malawi (i) According to the Overstay Report, Malawi had a B 1/B–2 visa overstay rate of 22.45 percent and an F, M, and J visa overstay rate of 31.99 percent.","19":"(ii) The entry into the United States of nationals of Malawi as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Malawi to the extent permitted by law. (i) Mauritania (i) According to the Overstay Report, Mauritania had a B–1/B–2 visa overstay rate of 9.49 percent. According to the Department of State, the Government of Mauritania has little presence in certain parts of the country, which creates substantial screening and vetting difficulties.","20":"(ii) The entry into the United States of nationals of Mauritania as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Mauritania to the extent permitted by law. (j) Nigeria (i) Radical Islamic terrorist groups such as Boko Haram and the Islamic State operate freely in certain parts of Nigeria, which creates substantial screening and vetting difficulties. According to the Overstay Report, Nigeria had a B–1/B–2 visa overstay rate of 5.56 percent and an F, M, and J visa overstay rate of 11.90 percent.","21":"(ii) The entry into the United States of nationals of Nigeria as immigrants, and as nonimmigrants on B–1, B 2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Nigeria to the extent permitted by law. (k) Senegal (i) According to the Overstay Report, Senegal had a B–1/B–2 visa overstay rate of 4.30 percent and an F, M, and J visa overstay rate of 13.07 percent.","22":"(ii) The entry into the United States of nationals of Senegal as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended. (iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Senegal to the extent permitted by law. (l) Tanzania (i) According to the Overstay Report, Tanzania had a B–1/B–2 visa overstay rate of 8.30 percent and an F, M, and J visa overstay rate of 13.97 p"},"P5":{"1":"On July 5, 1983, pursuant to section 202(b)(1) of the Trade Act of 1974 (the Act) (19 U.S.C. 2252(b)(1)) and after taking into account the considerations specified in section 202(c) of the Act (19 U.S.C. 2252(c)) and the report and recommendations of the United States International Trade Commission (the Commission), I determined to impose additional tariffs and quantitative restrictions on imports of certain bars; wire rods; and plates, sheets and strips, not cut, not pressed, and not stamped to nonrectangular shape; all the foregoing of stainless steel or certain alloy tool steel; and round wire of high-speed tool steel, provided for in specified items of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202). By Proclamation 5074 of July 19, 1983, pursuant to sections 203(a)(1), 203(a)(3), and 203(e)(1) of the Act (19 U.S.C. 2253(a)(1), 2253(a)(3), and 2253(e)(1)), I provided import relief through the temporary imposition of increased tariffs and quantitative restrictions on certain stainless steel and alloy tool steel as set forth in the Annex to that Proclamation. 2.","2":"Further, in Proclamation 5074 I directed the United States Trade Representative (USTR) to take such actions and perform such functions for the United States as may be necessary to administer and implement such relief, to negotiate orderly marketing agreements pursuant to section 203 of the Act (19 U.S.C. 2253), to modify such relief pursuant to section 203, and to make any changes in the headnote or TSUS items created in the Annex to that Proclamation that may be necessary to implement the foregoing authority.","3":"I also directed the USTR to conduct an annual review of the necessity for and effectiveness of such relief and to recommend any appropriate action under section 203(h)(4) of the Act (19 U.S.C. 2253(h)(4)). 3. On September 18, 1984, I established a national policy for the steel industry and directed the USTR to coordinate and direct the implementation of that policy, including the negotiation of new arrangements with exporting countries and the reaffirmation of existing measures limiting steel exports into the United States. Supplemental authority to enforce the national policy for the steel industry was provided in Title VIII of the Trade and Tariff Act of 1984 (19 U.S.C. 2253 note). 4. Pursuant to the above authority, the USTR concluded agreements with the European Community and 18 other exporting nations and made such modifications to the import relief proclaimed in Proclamation 5074 as were necessary to implement these agreements. 5. I have now determined that the relief provided in Proclamation 5074, as subsequently modified, should be extended through September 30, 1989, as set forth in the Annex to this Proclamation.","4":"Finally, I have determined to continue the authority of the USTR under the national policy for the steel industry to take such actions as he determines necessary and appropriate to carry out that policy, including further actions with respect to articles subject to the relief set forth in the Annex to this Proclamation.","5":"Now, Therefore, I, Ronald Reagan, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes of the United States, including but not limited to sections 203 and 604 of the Act (19 U.S.C. 2253 and 2483), and in accordance with Article XIX of the General Agreement on Tariffs and Trade (GATT) (16 Stat. [pt. 5] A58; 8 UST [pt. 2] 1786), do proclaim that- (1) Part I of Schedule XX of the GATE is modified to conform to the action taken in the Annex to this Proclamation. (2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation.","6":"(3) The authority delegated to the USTR by Proclamation 5074 is hereby continued throughout the duration of the relief set forth in the Annex to this Proclamation. (4) The President's authority to prescribe regulations concerning any restriction proclaimed in Proclamation 5074 and continued by this Proclamation, or governing the entry or withdrawal from warehouse of articles covered by orderly marketing agreements negotiated thereunder or of like articles that are the product of countries not parties to any such agreement, previously delegated by Proclamation 5074 to the Secretary of the Treasury, shall continue to be exercised under the terms provided in such Proclamation for the duration of the relief provided herein.","7":"(5) The Secretary of the Treasury shall take such actions as the USTR","8":"shall determine are necessary to implement any import relief under this Proclamation, or modifications thereof."},"P30":{"1":"Whereas, I find and determine that, in order to prevent total imports from impairing accomplishment of the purposes of Proclamation 3279, as amended, it is necessary to impose restrictions on the movement of crude oil, unfinished oils, and finished products into foreign trade zones; and","2":"Whereas, I find and determine that for reasons of equity and competitive capability, there should be authority to include petrochemical plants within the system of allocation of imports; and","3":"Whereas, it appears that, as represented by the Government of the Commonwealth of Puerto Rico, the development of a petrochemical industry in Puerto Rico will provide a substantial and much needed increase in opportunities for employment of its citizens, I find and determine that provisions should be made permitting the development, without impairment of the objectives of Proclamation 3279, as amended, of such an industry in Puerto Rico:","4":"I. Paragraph (a) of section 1 of Proclamation 3279, as amended, is amended to read as follows:","5":"(a) In Districts I—IV, in District V, and in Puerto Rico, no crude oil, unfinished oils, or finished products may be entered for consumption or withdrawn from warehouse for consumption, and no foreign crude oil, unfinished oils, or finished products may be brought into a foreign trade zone in Districts I—IV or in District V for processing within the zone, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries, withdrawals, and shipments into foreign trade zones may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section, or (4) crude oil, unfinished oils, or finished products which are transported into the United States by pipeline, rail, or other means of overland transportation from the country where they were produced, which country, in the case of unfinished oils or finished products, is also the country of production of the crude oil from which they were processed or manufactured. 2. Subparagraph (1) of paragraph (a) and paragraph (c) of section 2 of Proclamation 3279, as amended, are severally amended to read as follows: (a) (1) In Districts I—IV, for a particular allocation period the maximum level of imports, subject to allocation, of crude oil, unfinished oils, and finished products (other than residual fuel oil to be used as fuel) shall be an amount equal to the difference between (i) 12.2 percent of the quantity of crude oil and natural gas liquids which the Secretary estimates will be produced in these districts during the particular allocation period and (ii) the quantity of imports of crude oil, unfinished oils, and finished products excepted by clause (4) of paragraph (a) of section 1 which the Secretary estimates will be imported into these districts during that allocation period plus the quantity estimated by the Secretary by which shipments of unfinished oils and finished products (other than residual fuel oil to be used as fuel) from Puerto Rico to Districts I—IV during that allocation period will exceed the quantity so shipped during a comparable base period in the year 1965. As used in this subparagraph (1), the term \"natural gas liquids\" means natural gas products and other hydrocarbons such as isopentane, propane, and butane, or mixtures thereof, recovered from natural gas by means other than refining. Within such maximum level, imports of unfinished oils shall not exceed such per-centum of the permissible imports of crude oil and unfinished oils as the Secretary may determine and imports of finished products (other than residual fuel oil to be used as fuel) shall not exceed the level of imports of such products into these districts during the calendar year 1957.","6":"(c) The Secretary, having taken into account the standards prescribed for allocation of imports of crude oil and unfinished oils into Puerto Rico, any actions taken pursuant to section 4, and shipments from Puerto Rico into Districts I—IV, shall establish for each allocation period a maximum level of imports into Puerto Rico of crude oil and unfinished oils which, in his judgment, is consonant with the objectives of this proclamation. The maximum level of imports of finished products into Puerto Rico for a particular allocation period shall be approximately the level of such imports during all or part of the calendar year 1958 as determined by the Secretary to be consonant with the purposes of this proclamation or such higher level as the Secretary may determine is required to meet a demand in Puerto Rico for finished products that would not otherwise be met. 3. Subparagraphs 1, 2, and 3 of paragraph (b) of section 3 of Proclamation 3279, as amended, are severally amended to read as follows:","7":"(b) (1) With respect to the allocation of imports of crude oil and unfinished oils into Districts I—IV and into District V, such regulations shall provide, to the extent possible, for a fair and equitable distribution among persons having refinery capacity in these districts in relation to refinery inputs (excluding inputs of crude oil or unfinished oils imported pursuant to clause (4) of paragraph (a) of Section 1). The Secretary may by regulation also provide for the making of such allocations to persons having petrochemical plants in these districts in relation to inputs to such plants (excluding inputs of crude oil or unfinished oils imported pursuant to clause (4) of paragraph (a) of section 1). Provision may be made in the regulations for the making of such allocations on the basis of graduated scales of inputs. Provision shall be made in the regulations for the gradual reduction of allocations made on the basis of the last allocations of imports of crude oil under the Voluntary Oil Import Program, except that provision shall be made for a more rapid reduction of those allocations based on allocations under the Voluntary Oil Import Program which reflected imports of crude oil in the category now covered by clause (4) of paragraph (a) of section 1.","8":"(2) Such regulations shall provide for the allocation of imports of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in the calendar year 1964 on the basis of estimated requirements, acceptable to the Secretary, of each such person for crude oil and unfinished oils.","9":"The regulations shall provide also that if, during a period comprising the same number of months as an allocation period and ending three months before the beginning of the allocation period, any such person ships to Districts I—IV unfinished oils or finished products (other than residual fuel oil to be used as fuel) or sells unfinished oils or finished products (other than residual fuel oil to be used as fuel) which are shipped to Districts I—IV in excess of the volume of unfinished oils or finished products (other than residual fuel oil to be used as fuel) which he so shipped or which he sold and were so shipped during the corresponding base period in the years 1964 and 1965 or in the year 1965, as the case may be, the person's allocation for the next allocation period shall be reduced by the amount of the excess.","10":"In addition the Secretary may provide by regulation for the making, in instances in which the Secretary determines that such action would not impair the accomplishment of the objectives of this proclamation, of allocations of imports of crude oil and unfinished oils into Puerto Rico to persons as feedstocks for facilities which will be established or for the operation of facilities which are established and which in the judgment of the Secretary will promote substantial expansion of employment in Puerto Rico through industrial development, and such regulations shall provide for the imposition of such conditions and restrictions upon such allocations as the Secretary may deem necessary to assure that any imports so allocated are used for the purposes for which an allocation is made and that the holder of such an allocation fulfills commitments made in connection with the making of the allocation. (3) Except for crude oil or unfinished oils imported pursuant to special relief granted pursuant to section 4, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that exchanges for domestic crude or unfinished oils may be made if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant. 4.","11":"Subparagraph (1) of paragraph (g) of section 9 of Proclamation 3279, as amended, is amended to read as follows: (g) (1) Liquefied gases—hydrocarbon gases such as ethane, propane, propylene, butylene, and butanes (but not methane) which are recovered from natural gas or produced in the refining of petroleum and which, to be maintained in a liquid state at ambient temperatures, must be kept under greater than atmospheric pressures; 5. This amendatory proclamation shall become effective on January 1, 1966."},"EO33":{"1":"In light of these findings, and to take additional steps with respect to the national emergency declared in Executive Order 13338 of May 11, 2004, I hereby order: Section 1. (a) Except to the extent provided in section 203(b)(1), (3), and (4) of IEEPA (50 U.S.C. 1702(b)(1), (3) and (4)), the Trade Sanctions Reform and Export Enhancement Act of 2000 (title IX, Public Law 106-387), or regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of this order, all property and interests in property that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of any United States person, including any overseas branch, of the following persons are blocked and may not be transferred, paid, exported, withdrawn, or otherwise dealt in: persons determined by the Secretary of the Treasury, after consultation with the Secretary of State, to be responsible for, to have engaged in, to have facilitated, or to have secured improper advantage as a result of, public corruption by senior officials within the Government of Syria. (b) The prohibitions in paragraph (a) of this section include, but are not limited to, (i) the making of any contribution or provision of funds, goods, or services by, to, or for the benefit of any person designated pursuant to this order, and (ii) the receipt of any contribution or provision of funds, goods, or services from any such person. Sec. 2.","2":"Section 3(a)(iv) of Executive Order 13338 is hereby amended to read as follows: \"(iv)to be or to have been responsible for or otherwise significantly contributing to actions taken or decisions made by the Government of Syria that have the purpose or effect of undermining efforts to stabilize Iraq or of allowing the use of Syrian territory or facilities to undermine efforts to stabilize Iraq; or\". Sec. 3. (a) Any transaction by a United States person or within the United States that evades or avoids, has the purpose of evading or avoiding, or attempts to violate any of the prohibitions set forth in this order is prohibited. (b) Any conspiracy formed to violate any of the prohibitions set forth in this order is prohibited. Sec. 4. For purposes of this order: (a) the term \"person\" means any individual or entity; (b) the term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization; and (c) the term \"United States person\" means any United States citizen, permanent resident alien, entity organized under the laws of the United States or any jurisdiction within the United States (including foreign branches), or any person in the United States. Sec. 5.","3":"I hereby determine that the making of donations of the type specified in section 203(b)(2) of IEEPA (50 U.S.C. 1702(b)(2)) by, to, or for the benefit of, persons whose property and interests in property are blocked pursuant to section 1 of this order would seriously impair my ability to deal with the national emergency declared in Executive Order 13338 and relied upon for additional steps taken in Executive Order 13399 of April 25, 2006,","4":"and I hereby prohibit such donations as provided by section 1 of this order. Sec. 6.","5":"For those persons whose property and interests in property are blocked pursuant to section 1 of this order who might have a constitutional presence in the United States, I find that, because of the ability to transfer funds or other assets instantaneously, prior notice to such persons of measures to be taken pursuant to this order would render these measures ineffectual.","6":"I therefore determine that for these measures to be effective in addressing the national emergency declared in Executive Order 13338 and relied upon for additional steps taken in Executive Order 13399, there need be no prior notice of a determination made pursuant to this order. Sec. 7.","7":"The Secretary of the Treasury, after consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to the President by IEEPA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government, consistent with applicable law.","8":"All executive agencies of the United States Government are hereby directed to take all appropriate measures within their authority to carry out the provisions of this order and, where appropriate, to advise the Secretary of the Treasury in a timely manner of the measures taken. Sec. 8. Nothing in this order is intended to affect the continued effectiveness of any rules, regulations, orders, licenses, or other forms of administrative action issued, taken, or continued in effect heretofore or hereafter under 31 C.F.R. chapter V, except as expressly terminated, modified, or suspended by or pursuant to this order. Sec. 9. This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, instrumentalities, or entities, its officers or employees, or any other person."},"EO20":{"1":"I, GEORGE BUSH, President of the United States of America, find that proliferation of chemical and biological weapons constitutes an unusual and extraordinary threat to the national security and foreign policy of the United States and hereby declare a national emergency to deal with that threat.","2":"Accordingly, I hereby order: Section 1. International Negotiations. It is the policy of the United States to lead and seek multilaterally coordinated efforts with other countries to control the proliferation of chemical and biological weapons.","3":"The Secretary of State shall accordingly ensure that the early achievement of a comprehensive global convention to prohibit the production and stockpiling of chemical weapons, with adequate provisions for verification, shall be a top priority of the foreign policy of the United States, and the Secretary of State shall cooperate in and lead multilateral efforts to stop the proliferation of chemical weapons. Sec. 2. Imposition of Controls. As provided herein, the Secretary of State and the Secretary of Commerce shall use their authorities, including the Arms Export control Act and Executive Order No. 12730, respectively, to control any exports that either Secretary determines would assist a country in acquiring the capability to develop, produce, stockpile, deliver, or use chemical or biological weapons. The Secretary of State shall pursue early negotiations with foreign governments to adopt effective measures comparable to those imposed under this order. Sec. 3.Department of Commerce Controls. (a) The Secretary of Commerce shall prohibit the export of any goods, technology, or services subject to his export jurisdiction that the Secretary of Commerce and the Secretary of State determine, in accordance with regulations issued pursuant to this order, would assist a foreign country in acquiring the capability to develop, produce, stockpile, deliver, or use chemical or biological weapons.","4":"The Secretary of Commerce and the Secretary of State shall develop an initial list of such goods, technology, and services within 90 days of this order. The Secretary of State shall pursue early negotiations with foreign governments to adopt effective measures comparable to those imposed under this section. (b) Subsection (a) will not apply to exports if their destination is a country with whose government the United States has entered into a bilateral or multilateral arrangement for the control of chemical or biological weapons-related goods (including delivery systems) and technology, or maintains domestic export controls comparable to controls that are imposed by the United States with respect to such goods and technology or that are otherwise deemed adequate by the Secretary of State.","5":"(c) The Secretary of Commerce shall require validated licenses to implement this order and shall coordinate any license applications with the Secretary of State and the Secretary of Defense. Sec. 4 Sanctions Against Foreign Persons. (a) Sanctions shall be imposed on foreign persons with respect to chemical and biological weapons proliferation, as specified in subsections (b)(1) through (b)(5). (b)(1) Senctions shall be imposed on a foreign person if the Secretary of State determines that the foreign person on or after the effective date of this order knowingly and materially contributed to the efforts of a foreign country referred to in subsection (2) to use, develop, produce, stockpile, or otherwise acquire chemical or biological weapons. (2) The countries referred to in subsection (1) are those that the Secretary of State determines have either used chemical or biological weapons in violation of international law or have made substantial preparations to do so on or after the effective date of this order. (3) No department or agency of the United States Government may procure, or enter into any contract for the procurement of, any goods or services from any foreign person referred to in subsection (1). The Sectretary of the Treasury shall prohibit the importation into the United States of products produced by the foreign person. (4) Sanctions imposed pursuant to this section may be terminated or not imposed against foreign persons if the Secretary of State determines that there is reliable evidence that the foreign person concerned has ceased all activities referred to in subsection (1). (5) The Secretary of State and the Secretary of the Treasury may provide appropriate exemptions for procurement contracts necessary to meet U.S. operational military requirements or requirements under defense production agreements, sole source suppliers, spare parts, components, routine servicing and maintenance of products, and medical and humanitarian items. They may provide exemptions for contracts in existence on the date of this order under appropriate circumstances. Sec. 5. Sanctions Against Foreign Countries. (a) Sanctions shall be imposed on foreign countries with respect to chemical and biological weapons proliferation, as specified in subsections (b) and (c).","6":"(b) The Secretary of State shall determine whether any foreign country has, on or after the effective date of this order, (1) used chemical or biological weapons in violation of international law; or (2) made substantial preparations to use chemical or biological weapons in violation of international law; or (3) developed, produced, or stockpiled chemical or biological weapons in violation of international law. (c) The following sanctions shall be imposed on any foreign country identified in subsection (b)(1) unless the Secretary of State determines that any individual sanction should not be applied due to significant foreign policy or national security reasons. The sanctions specified in this section may be made applicable to the countries identified in subsections (b)(2) or (b)(3) when the Secretary of State determines that such action will further the objectives of this order pertaining to proliferation. The sanctions specified in subsection (c)(2) below shall be imposed with the concurrence of the Secretary of the Treasury. (1) Foreign Assistance. No assistance shall be provided to that country under the Foreign Assistance Act of 1961 or the Arms Export Control Act other than assistance that is intended to benefit the people of that country directly and that is not channeled through governmental agencies or entities of that country. (2) Multilateral Development Bank Assistance. The United States shall oppose any loan or financial or technical assistance to that country by international financial institutions in accordance with section 701 of the International Financial Institutions Act (3) Denial of Credit or Other Financial Assistance. The United States shall deny to that country any credit or financial assistance by any department, agency, or instrumentality of the United States Government. (4) Prohibition on Arms Sales. The United States Government shall not, under the Arms Export Control Act, sell to that country any defense articles or defense services or issue any license for the export of items on the United States Munitions List. (5) Exports of National Security-Sensitive Goods and Technology. No exports shall be permitted of any goods or technologies controlled for national security reasons under Export Administration Regulations. (6) Further Export Restrictions. The Secretary of Commerce shall prohibit or otherwise substantially restrict exports to that country of goods, technology, and services (excluding agricultural commodities and products otherwise subject to control). (7) Import Restrictions. Restrictions shall be imposed on the importation into the United States of articles (which may include petroleum or any petroleum product) that are the growth, product, or manufacture of that country. (8) Landing Rights. At the earliest practicable date, the Secretary of State shall terminate, in a manner consistent with international law, the authority of any air carrier that is controlled in fact by the government of that country to engage in air transportation (as defined in section 101(10) of the Federal Aviation Act of 1958 (10)). Sec. 6. Duration. Any sanctions imposed pursuant to section 4 or 5 shall remain in force until the Secretary of State determines that lifting any sanction is in the foreign policy or national security interests of the United States or, as to sanctions under section 4, until the Secretary has made the determination under section 4(b)(4). Sec. 7. Implementation.","7":"The Secretary of State, the Secretary of the Treasury, and the Secretary of Commerce are hereby authorized and directed to take such actions, including the promulgation of rules and regulations, as may be necessary to carry out the purposes of this order. These actions, and in particular those in sections 4 and 5, shall be made in consultation with the Secretary of Defense and, as appropriate, other agency heads. The Secretary concerned may redelegate any of these functions to other officers in agencies of the Federal Government. All heads of departments and agencies of the United States Government are directed to take all appropriate measures within their authority to carry out the provisions of this order, including the suspension or termination of licenses or other authorization. Sec. 8. Judicial Review. This order is not intended to create, nor does it create, any right or benefit, substantive or procedural, enforceable at law by a party against the United States, its agencies, officers, or any other person. Sec. 9. Effective Date. This order is effective immediately. This order shall be transmitted to the Congress and published in the Federal Register."},"P38":{"1":"Now, Therefore, I, Donald J. Trump, by the authority vested in me by the Constitution and the laws of the United States of America, including sections 201 and 301 of the National Emergencies Act (50 U.S.C. 1601 et seq.), hereby declare that a national emergency exists at the southern border of the United States, and that section 12302 of title 10, United States Code, is invoked and made available, according to its terms, to the Secretaries of the military departments concerned, subject to the direction of the Secretary of Defense in the case of the Secretaries of the Army, Navy, and Air Force.","2":"To provide additional authority to the Department of Defense to support the Federal Government's response to the emergency at the southern border, I hereby declare that this emergency requires use of the Armed Forces and, in accordance with section 301 of the National Emergencies Act (50 U.S.C. 1631), that the construction authority provided in section 2808 of title 10, United States Code, is invoked and made available, according to its terms, to the Secretary of Defense and, at the discretion of the Secretary of Defense, to the Secretaries of the military departments.","3":"I hereby direct as follows: Section 1. The Secretary of Defense, or the Secretary of each relevant military department, as appropriate and consistent with applicable law, shall order as many units or members of the Ready Reserve to active duty as the Secretary concerned, in the Secretary's discretion, determines to be appropriate to assist and support the activities of the Secretary of Homeland Security at the southern border. Sec. 2.","4":"The Secretary of Defense, the Secretary of the Interior, the Secretary of Homeland Security, and, subject to the discretion of the Secretary of Defense, the Secretaries of the military departments, shall take all appropriate actions, consistent with applicable law, to use or support the use of the authorities herein invoked, including, if necessary, the transfer and acceptance of jurisdiction over border lands. Sec. 3. This proclamation is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person."},"EO37":{"1":"The Secretary of Defense is authorized and directed to take all appropriate steps to disperse all persons engaged in the acts of violence described in the proclamation, to restore law and order, and to see that the property, personnel and functions of the Federal Government, of embassies of foreign governments, and of international organizations in the Washington metropolitan area are protected against violence or other interference. SEC. 2.","2":"In carrying out the provisions of Section 1, the Secretary of Defense is authorized to use such of the Armed Forces of the United States as he may deem necessary. SEC. 3.","3":"(a) The Secretary of Defense is hereby authorized and directed to call into the active military service of the United States, as he may deem appropriate to carry out the purposes of this order, units or members of the Army National Guard and of the Air National Guard to serve in the active military service of the United States for an indefinite period and until relieved by appropriate orders. Units or members may be relieved subject to recall at the discretion of the Secretary of Defense.","4":"In carrying out the provisions of Section 1, the Secretary of Defense is authorized to use units and members called or recalled into the active military service of the United States pursuant to this section.","5":"(b) In addition, in carrying out the provisions of Section 1, the Secretary of Defense is authorized to exercise any of the powers vested in me by law as commander-in-chief of the militia of the District of Columbia, during such time as any units or members of the Army National Guard or Air National Guard of the District shall not have been called into the active military service of the United States. SEC. 4.","6":"The Secretary of Defense is authorized to delegate to one or more of the Secretaries of the military Departments any of the authority conferred upon him by this order."},"EO8":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows: Section 1. Purpose. The United States collects signals intelligence so that its national security decisionmakers have access to the timely, accurate, and insightful information necessary to advance the national security interests of the United States and to protect its citizens and the citizens of its allies and partners from harm.","2":"Signals intelligence capabilities are a major reason we have been able to adapt to a dynamic and challenging security environment, and the United States must preserve and continue to develop robust and technologically advanced signals intelligence capabilities to protect our security and that of our allies and partners. At the same time, the United States recognizes that signals intelligence activities must take into account that all persons should be treated with dignity and respect, regardless of their nationality or wherever they might reside, and that all persons have legitimate privacy interests in the handling of their personal information. Therefore, this order establishes safeguards for such signals intelligence activities. Sec. 2. Signals Intelligence Activities. (a) Principles. Signals intelligence activities shall be authorized and conducted consistent with the following principles: (i) Signals intelligence activities shall be authorized by statute or by Executive Order, proclamation, or other Presidential directive and undertaken in accordance with the Constitution and with applicable statutes and Executive Orders, proclamations, and other Presidential directives.","3":"(ii) Signals intelligence activities shall be subject to appropriate safeguards,","4":"which shall ensure that privacy and civil liberties are integral considerations in the planning and implementation of such activities so that: (A) signals intelligence activities shall be conducted only following a determination, based on a reasonable assessment of all relevant factors, that the activities are necessary to advance a validated intelligence priority, although signals intelligence does not have to be the sole means available or used for advancing aspects of the validated intelligence priority; and (B) signals intelligence activities shall be conducted only to the extent and in a manner that is proportionate to the validated intelligence priority for which they have been authorized, with the aim of achieving a proper balance between the importance of the validated intelligence priority being advanced and the impact on the privacy and civil liberties of all persons, regardless of their nationality or wherever they might reside.","5":"(iii) Signals intelligence activities shall be subjected to rigorous oversight in order to ensure that they comport with the principles identified above. (b) Objectives. Signals intelligence collection activities shall be conducted in pursuit of legitimate objectives. (i) Legitimate objectives. (A) Signals intelligence collection activities shall be conducted only in pursuit of one or more of the following objectives: (1) understanding or assessing the capabilities, intentions, or activities of a foreign government, a foreign military, a faction of a foreign nation, a foreign-based political organization, or an entity acting on behalf of or controlled by any such foreign government, military, faction, or political organization, in order to protect the national security of the United States and of its allies and partners; (2) understanding or assessing the capabilities, intentions, or activities of foreign organizations, including international terrorist organizations, that pose a current or potential threat to the national security of the United States or of its allies or partners; (3) underst
