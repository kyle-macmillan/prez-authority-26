 of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section, or (4) as provided in paragraph (c) of this section, or (5) as otherwise provided in this proclamation. (b) The Secretary of the Interior may, in his discretion, authorize entries, without allocation or license, of small quantities of crude oil, unfinished oils, or finished products. (c) In Districts I—IV, District V, and in Puerto Rico, no department, establishment, or agency of the United States shall without prior payment of the fees provided for in this proclamation, import finished products in excess of the respective allocations made to them by the Secretary of the Interior. Such allocations shall, except as otherwise provided in this proclamation, be within the maximum levels of imports established in section 2 of this proclamation. (d) The Secretary may, by regulation, provide that no allocation or license shall be required in connection with the transportation to the United States by pipeline through a foreign country of crude oil, unfinished oils, or finished products produced in the customs territory of the United States or, in the event of commingling with foreign oils of like kind and qualities incidental to such transportation, of quantities equivalent to the quantities produced in and shipped from such customs territory.\" \"SEC. 2(a) Except as otherwise provided in this proclamation, the maximum level of imports, from sources other than Canada and Mexico which may be made without prior payment of the fees provided in this proclamation, of crude oil, unfinished oils, and finished products (other than residual fuel oil to be used as fuel) shall be: (1) for Districts I—IV, 1,992,000 average barrels per day per calendar year: Provided, That, in addition to the foregoing, there may be imported into District I an average of 50,000 barrels per day of No. 2 fuel oil, manufactured in the Western Hemisphere from crude oil produced in the Western Hemisphere under allocations made by the Secretary, pursuant to regulations of the Secretary, to deepwater terminal operators currently receiving allocations and who do not have crude oil import allocations into Districts I—IV; Provided Further, That, whenever the Chairman of the Oil Policy Committee finds that, because of supply, price, or other considerations, the requirement that No. 2 fuel oil be manufactured in the Western Hemisphere from crude oil produced in the Western Hemisphere is unduly restricting the availability of such oil for importation into District I and is not required for the national security, he shall so advise the Secretary who shall then suspend such requirement by appropriate regulation. No such suspension shall be renewed except upon a new finding by the Chairman as required by the preceding sentence; Provided Further, That, the Secretary may, by regulation, provide that a holder of an allocation for the importation of No. 2 fuel oil may import crude oil produced in the Western Hemisphere in lieu of No. 2 fuel oil, barrel for barrel, and exchange such crude oil for No. 2 fuel oil. (2) for District V, 670,000 average barrels per day per calendar year. (3) for Puerto Rico 227,221 average barrels per day per year commencing April 1, 1973; Provided, That no person who manufactures in Puerto Rico No. 2 fuel oil from crude oil produced in the Western Hemisphere shall incur a reduction of an allocation or be deemed to have violated a condition of an allocation by reason of a shipment of such oil to a person who holds an allocation of imports of No. 2 fuel oil into District I and who does not have a crude oil import allocation into District I; Provided Further, That, this limitation shall not apply to long-term allocations of imports into Puerto Rico. (4) for District I, 2,900,000 average barrels per day per year, commencing April 1, 1973, of residual fuel oil to be used as fuel. (5) for Districts II—IV, 42,000 average barrels per day per calendar year of residual fuel oil to be used as fuel. (6) for District V, 75,600 average barrels per day per calendar year of residual fuel oil to be used as fuel. (b) Imports of asphalt, ethane, propane, and butanes shall not be subject to the levels established in this proclamation nor shall any allocation or license be required for their importation. (c) Crude oil may be imported into District I to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. The quantities of crude oil, unfinished oils, and finished products that may be imported into the United States under the provisions of this proclamation shall not be reduced by reason of imports of crude oil used as fuel under this paragraph. (d) (1) Except as otherwise provided in this proclamation, the maximum levels of imports from Canada of crude oil and unfinished oils to which license fees are not applicable shall be: (i) for Districts I—IV, 960,000 average barrels per day per calendar year; Provided, That, the Secretary may, within the limits established by subparagraph (1) of paragraph (a) of this section, increase the quantity of crude oil, unfinished oils, and finished products which may be imported from Canada so long as such increase is consonant with the purposes of this proclamation. (ii) for District V, 280,000 average barrels per day per calendar year; Provided, That, the Secretary may, within the limits established by subparagraph (1) of paragraph (a) of this section, increase the quantity of crude oil, unfinished oils, and finished products which may be imported from Canada so long as such increase is consonant with the purposes of this proclamation. (2) Entries for consumption of imports from Canada by pipeline may be made until midnight January 15 of the calendar year following the calendar year in which any license authorizing such imports from Canada was issued. (e) Except as otherwise provided in this proclamation, the maximum level of imports from Mexico of crude oil produced in Mexico and unfinished oils and finished products produced in Mexico wholly from Mexican crude oil shall be 32,500 average barrels per day per calendar year. (f) The levels established, and the total demand referred to, in this section do not include free withdrawals by persons pursuant to section 309 of the Tariff Act of 1930, as amended (19 U.S.C. 1309), or petroleum supplies for vessels or aircraft operated by the United States between points referred to in said section 309 (as to vessels or aircraft, respectively) or between any point in the United States or its possessions and any point in a foreign country.\"","3":"\"SEC. 3(a) Effective May 1, 1973, the Secretary shall, by regulation, establish a system of fees for licenses issued under allocations of imports of crude oil, unfinished oils, and finished products, over the above levels of imports established by section 2 of this proclamation. Such regulations shall require, among other appropriate provisions, that such fees shall be: Provided, That, license fees paid for imports of crude oil or unfinished oils will be refunded to the extent that such crude oils or unfinished oils have been incorporated into petro-chemical or finished products subsequently exported or that asphalt as defined in this proclamation was produced from the imported feedstocks. (b) Except for allocation and licenses to which the license fee is not applicable, applications for allocations of imports of crude oil, unfinished oils, or finished products shall be accompanied by the applicant's certified check or a cashier's check payable to the order of the Treasurer of the United States in the appropriate amount chargeable pursuant to this section. Applications not accompanied by a certified or cashier's check in the amount required shall not be considered. (c) (1) All monies received by the Secretary under the terms of paragraph (b) of this section shall be held by the Secretary of the Interior in a suspense account and may be drawn upon by the Secretary for the payment of any refunds of refundable license fees and for payments to Puerto Rico of sums collected by way of license fees for imports into Puerto Rico. Balances remaining in such suspense account not required for payment hereinabove provided shall be deposited at the end of each fiscal year in the Treasury of the United States and credited to miscellaneous receipts. (2) Refunds pursuant to subparagraph (1) of paragraph (c) of this section shall be made without interest.\"","4":"\"SEC. 4 (a) The Secretary of the Interior is hereby authorized to issue regulations for the purpose of implementing this proclamation.","5":"(b) (1) With respect to the allocation of imports of crude oil and unfinished oils into Districts I—IV and into District V, such regulations shall provide for a fair and equitable distribution of allocations of imports for which license fees are not applicable among eligible persons having refinery capacity in relation to refinery inputs or in relation to storage capacities of such allocation holders. The Secretary may, by regulation, also provide for the making of allocations of imports for which license fees are not applicable, of crude oil and unfinished oils into Districts I—IV and into District V to persons having petrochemical plants in these districts in relation to the outputs of such plants or in relation to inputs to such plants. Provision may be made in the regulations for the making of such allocations on the basis of graduated scales. Notwithstanding the levels prescribed in section 2 of this proclamation, the Secretary may also by regulation make such provisions as he deems consonant with the objectives of this proclamation for the making of allocations of imports of crude oil and unfinished oils to which the license fee is not applicable into Districts I—IV and into District V to persons who manufacture from crude oil and unfinished oils and who export finished products and petrochemicals, subject to such designations as the Secretary may make. Notwithstanding the levels established in section 2 of this proclamation the Secretary may make allocations to which license fees shall not be applicable to new, expanded, or reactivated refinery capacity and petrochemical plants for a period of five years from the date such facility comes on stream. Such allocations shall not exceed 75 percent of estimated refinery inputs or the percentage of petrochemical plant inputs applicable. (2) Such regulations shall provide for the allocations of imports with respect to which license fees are not applicable of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in the calendar year 1964 on the basis of the allocation of crude and unfinished oils received by such persons for the allocation period commencing April 1, 1973; Provided, That, in respect of imports for which license fees are applicable, license fees paid for imports of crude oil and unfinished oils into Puerto Rico will be refunded to the extent that such crude oil or unfinished oils have been incorporated into finished products consumed in Puerto Rico or petrochemicals or finished products exported therefrom. (3) Except for crude oil or unfinished oils imported under license or licenses for which a fee has been charged, or pursuant to specific relief granted pursuant to section 5, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that exchanges for domestic crude or unfinished oils may be made, if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant. (4) With respect to the allocation of imports of finished products (other than residual fuel oil to be used as fuel) in respect of which license fees are not applicable into Puerto Rico, such regulations shall provide, to the extent possible for a fair and equitable distribution of imports of such finished products among persons who were importers of such finished products into Puerto Rico during all or part of the calendar year 1958, or such higher level as the Secretary may have determined to be required to meet demand in Puerto Rico for finished products that would not otherwise have been met, during the calendar year 1973. (5) With respect to the allocation of imports to which license fees are not applicable of residual fuel oil to be used as fuel in Puerto Rico, such regulations shall, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel among persons who were importers of that product into Puerto Rico during all or part of the calendar year 1958. In addition, the Secretary by regulation may, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel, the maximum sulphur content of which is acceptable to the Secretary (i) among persons who are in the business in the respective districts or Puerto Rico of selling residual fuel oil to be used as fuel and who had inputs of that product to deepwater terminals located in the respective districts or Puerto Rico and (ii) among persons who are in the business in the respective districts or Puerto Rico of selling residual fuel oil to be used as fuel and who have throughput agreements (warehouse agreements) with deepwater terminal operators. With respect to the allocation of imports into District I of residual fuel oil to be used as fuel, such regulations shall, to the extent possible, provide for a fair and equitable distribution of imports of residual fuel oil to be used as fuel (i) among persons who are in the business in District I of selling residual fuel oil to be used as fuel and who have had inputs of that product to deepwater terminals located in District I, and (ii) among persons who are in the business in District I of selling residual fuel oil to be used as fuel and have throughput agreements (warehouse agreements) with deepwater terminal operators. With respect to the allocation of imports of residual fuel oil to be used as fuel into District I, Districts II—IV, District V, and Puerto Rico, such regulations shall also provide, to the extent possible, for the granting of allocations of imports of residual fuel oil to be used as fuel in accordance with procedures established pursuant to section 5 of this proclamation. (c) Such regulations may provide for the revocation or suspension by the Secretary of any allocation or license on grounds relating to the national security, or the violation of the terms of this proclamation, or of any regulation, allocation, or license issued pursuant to this proclamation. (d) For the balance of the calendar year 1973, notwithstanding the levels established in section 2 of this proclamation and the provisions of paragraph (b) of this section, the Secretary may provide by regulation for additional allocations of imports in respect of which license fees are not applicable of crude oil and unfinished oils to persons in District I—IV, and District V who manufacture in the United States residual fuel oil to be used as fuel, the maximum sulphur content of which is acceptable to the Secretary, in consultation with the Secretary of Health, Education and Welfare. These allocations to each of such persons shall not exceed the amount of such residual fuel oil manufactured by that person.\"","6":"\"SEC. 5 (a) The Secretary of the Interior is authorized to provide for the establishment and operation of an Appeals Board to consider petitions by persons affected by the regulations issued pursuant to this proclamation. The Appeals Board shall be comprised of a representative each from the Departments of the Interior, Justice, and Commerce to be designated respectively by the heads of such Departments. (b) The Appeals Board may be empowered, subject to the general direction of the Chairman of the Oil Policy Committee, (1) within the limits of the maximum levels of imports established in this proclamation, to modify on the grounds of error any allocation made to any person under such regulations; (2) without regard to the limits of the maximum levels of imports established in this proclamation, (i) to modify, on the grounds of exceptional hardship, any allocation with respect to which license fees are not applicable made to any person under such regulations; (ii) to grant allocations of imports to which license fees will not be applicable of crude oil and unfinished oils in special circumstances to persons with importing histories who do not qualify for allocations under such regulations; and (iii) to grant allocations of imports, to which license fees shall not be applicable, of finished products on the grounds of exceptional hardship; and to assure that adequate supplies of crude oil, unfinished oils, and finished products are made available to independent refiners or established marketers who are experiencing exceptional hardship or in emergencies requiring, in its judgment, the grant of allocations to them, and (3) to review the revocation or suspension of any allocation or license. The Secretary may provide that the Board may take such action on petitions as it deems appropriate and that the decisions by the Appeals Board shall be final. (c) Effective April 30, 1980, the jurisdiction of the Oil Import Appeals Board shall expire.\"","7":"\"SEC. 6 Persons who apply for allocations of crude oil, unfinished oils, or finished products, persons to whom such allocations have been made, and persons who hold such allocations shall furnish to the Secretary of the Interior such information and shall make such reports as he may require, by regulations or otherwise, in the discharge of his responsibilities under this proclamation.\"","8":"\"SEC. 7 The Chairman of the Oil Policy Committee shall provide policy direction, coordination, and surveillance of the oil import control program, including approval of regulations issued pursuant to this proclamation.","9":"He shall perform those functions after receiving the advice of the Oil Policy Committee and in accordance with guidance from the Assistant to the President with responsibility in the area of economic affairs.\" \"SEC. 8 The Oil Policy Committee shall consist of the Deputy Secretary of the Treasury, as Chairman, and the Secretaries of State, Defense, Interior, and Commerce, the Attorney General, and the Chairman of the Council of Economic Advisers, as members. The President may, from time to time, designate other officials to serve as members of the Committee. The Chairman may create subcommittees of the Committee to study and report to the Committee concerning specified subject matters.\"","10":"\"SEC. 9 The Oil Policy Committee shall consult with and advise the Chairman on oil import policy, including. the operation of the control program under Proclamation 3279, as amended, and on recommendations for changes. in the program by the issuance of new proclamations with respect to it, or otherwise.\" \"SEC. 10 The Chairman of the Oil Policy Committee shall from time to time, as in his judgment is required, review the status of imports of petroleum and its primary derivatives in respect to the national security, and, after consultation with the Oil Policy Committee, he shall inform the President of any circumstances which, in the Chairman's opinion, might indicate the need for further Presidential action under section 232 of the Trade Expansion Act of 1962 (19 U.S.C. 1862), as amended. In the event prices of crude de oil or its products or derivatives should be increased after the effective date of this proclamation, beyond the limits contemplated by the Cost of Living Council, such review may include a determination as to whether such increase or increases are necessary to accomplish the national security objectives of section 232 of the Trade Expansion Act of 1962, as amended, and this proclamation.\" \"SEC. 11 Annually, beginning May 1, 1974, the maximum levels of imports subject to allocation and license, to which license fees shall not be applicable, shall be reduced as follows: For the year commencing May 1, 1974, the maximum levels of such imports shall be ninety percent (90%), in barrels per day, of the levels established during the calendar year 1973; For the year commencing May 1, 1975, the maximum levels of such imports shall be eighty percent (80%), in barrels per day, of the levels established during the calendar year 1973; For the year commencing May 1, 1976, the maximum levels of such imports shall be sixty-five percent (65%), in barrels per day, of the levels established during the calendar year 1973; For the year commencing May 1, 1977, the maximum levels of such imports shall be fifty percent (50%), in barrels per day, of the levels established during the calendar year 1973; For the year commencing May 1, 1978, the maximum levels of such imports shall be thirty-five percent (35%), in barrels per day, of the levels established during the calendar year 1973; For the year commencing May 1, 1979, the maximum levels of such imports shall be twenty percent (20%), in barrels per day, of the levels established during the calendar year 1g73. Effective April 30, 1980, the system of issuing allocations and licenses not subject to license fee shall be abolished;","11":"Provided, That, with respect to any allocation period expiring prior to May 1, 1974, such allocation period shall be extended to April 30, 1974, and the Secretary shall issue appropriate regulations to issue additional oil import licenses to reflect such extension. \"SEC. 12 (a) Commitments and obligations contained in.. long-term allocations heretofore made of imports of crude oil into Puerto Rico shall be unimpaired by this proclamation or regulations issued thereunder. (b) Commitments and obligations contained in that certain allocation made to Hess Oil and Chemical Corporation of imports of finished products into Districts I—IV, dated December 12, 1967, effective January 1, 1968, shall be unimpaired by this proclamation or regulations issued thereunder.\" \"SEC. 13 The Secretary of the Interior may delegate, and provide for successive redelegation of, the authority conferred upon him by this proclamation.","12":"All departments and agencies of the Executive Branch of the Government shall cooperate with and assist the Secretary of the Interior in carrying out the purposes of this proclamation.\" \"SEC. 14 Executive Order 10761 of March 27, 1958, entitled \"Government Purchases of Crude Petroleum and Petroleum Products\" (23 F.R. 2067) is revoked.\" \"SEC. 15 As used in this proclamation: (a) \"Person\" includes an individual, a corporation, firm, or other business organization or legal entity, and an agency of a state, territorial or local government, but does not include a department, establishment, or agency of the United States. (b) \"District I\" means the states of Maine, New Hampshire, Vermont, Massachusetts, Connecticut, Rhode Island, New York, New Jersey, Pennsylvania, Maryland, Delaware, West Virginia, Virginia, North Carolina, South Carolina, Georgia, Florida, and the District of Columbia. (c) \"Districts II—IV\" means all of the states of the United States except those states within District I and District V. (d) \"Districts I—IV\" means the District of Columbia and all of the states of the United States except those states within District V. (e) \"District V\" means the states of Arizona, Nevada, California, Oregon, Washington, Alaska, and Hawaii. (f) \"Crude oil\" means a mixture of hydrocarbons that existed in natural underground reservoirs and which is liquid at atmospheric pressure after passing through surface separating processes and does not include natural gas products. It includes the initial liquid hydrocarbons produced from tar sands, gilsonite, and oil shale. (g) \"Finished products\" means any one or more of the following petroleum oils, or a mixture or combination of such oils, or any component or components of such oils which are to be used without further processing by any one or more of the processes described in subparagraphs (1) through (3) of paragraph (h) of this section, and which, as of January 1, 1973, under the Tariff Schedules of the United States, were not subject to a duty of more than one cent ($0.01) per pound of the hydrocarbons therein contained: (1) The term \"liquefied gases\" means the following liquefied or liquefiable gases, namely, ethane, propane, butanes, ethylene, propylene, and butylenes which are derived by refining or other processing of natural gas, crude oil, or unfinished oils. (2) \"Gasoline\" means a refined petroleum distillate, including naphtha, jet fuel or other petroleum oils (but not isoprene or cumene having a purity of 50 percent or more by weight, or benzene which meets the ASTM distillation standards for nitration grade) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, and having a boiling range at atmospheric pressure from 80° to 400°F. (3) \"Kerosene\" means any jet fuel, diesel fuel, fuel oil or other petroleum oils derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure from 400° to 550°F. (4) \"Distillate fuel oil\" means any fuel oil, gas oil, topped crude oil, or other petroleum oils, derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure from 550° to 1200°F. (5) \"Residual fuel oil\" means a petroleum oil, which is (i) any topped crude or viscous residuum of crude or unfinished oils or one or more of the petroleum oils defined in subparagraphs (2) through (4) of this paragraph (g), which has a viscosity of not less than 45 seconds Saybolt Universal at 100°F. to be used as fuel without further processing other than by mechanical blending or (ii) crude oil to be used as fuel without further processing other than by blending by mechanical means. (6) \"Asphalt\" means a solid or semi-solid cementitious crude oil or derivative of crude oil, 50 percent or more of the constituents of which are bitumins, which is not to be used as fuel and which is to be used without further processing except airblowing or blending by mechanical means. (7) \"Lubricating oils\" means any lubricant containing more than 50 percent by volume of refined petroleum distillates or specially treated petroleum residuum. (8) \"Natural gas products\" means liquids (under atmospheric conditions), including natural gasoline, which are recovered by process of absorption, adsorption, compression, refrigeration, cycling, or a combination of such processes, from mixtures of hydrocarbons that existed in a reservoir and which, when recovered and without processing in a refinery or other plant, fall within any of the definitions of products contained in clauses (2) through (4) of this paragraph (g). (h) \"Unfinished oils\" means one or more of the petroleum oils listed in clauses (1) through (4) and clause (8) of paragraph (g) of this section or a mixture or combination of such oils, or any component or components of such oils, which are to be further processed in one or more of the following ways: (1) By distillation with a resulting yield of at least two distinct finished products or unfinished oils, two of which must be equal to not less than 10 percent of the total charge of such imported unfinished oils to a distillation unit. Different grades or specifications of finished products or unfinished oils will not constitute distinct finished products or unfinished oils for purposes of this subparagraph. Distillation of petroleum oils which have been reconstituted by blending of two or more finished products or unfinished oils does not constitute processing for the purposes of this subparagraph. (2) By catalytic or thermal conversion in process units such as alkylation, coking, cracking, hydrofining, hydro-desulfurization, polymerization, isomerization, dehydrogenation, or refining. (3) By physical separation established by means of solvent dewaxing, solvent deasphalting, solvent extraction, or extractive distillation. (i) As used in paragraphs (g) and (h) of this section, the term \"petroleum oil\" includes only hydrocarbons derived from crude oil or natural gas. (j) The term \"imports from Canada\" as used in this proclamation, means entries for consumption or withdrawals from warehouse for consumption of the following items which have been transported into the United States from Canada, by overland means (pipeline, rail, or other means of overland transportation) or over waterways other than ocean waterways, to-wit: crude oil produced in Canada, unfinished oils which have deriv"},"L9":{"1":"By virtue of the authority vested in me by section 205 (a) of the Act entitled \"An Act to simplify the procurement, utilization and disposal of Government property, to reorganize certain agencies of the Government, and for other purposes,\" approved June 30, 1949 (the Federal Property and Administrative Services Act of 1949) it is hereby directed that: 1. In cooperation with other interested agencies, the Administrator of General Services shall institute studies and surveys to determine the extent to which existing policies, procedures and directives heretofore promulgated and remaining in force under section 501 of the Act, should be modified or revoked in the interest of promoting greater economy and efficiency in accomplishing the purposes of this Act. Careful attention shall be given to determining the degree of centralization in the General Services Administration to be attained in the performance of the functions involved.","2":"When these studies and surveys have been completed and after consulting with the interested agencies, the Administrator shall prescribe such regulations as may be necessary to implement the determinations resulting from such studies and surveys. 2.","3":"After consultation with the Bureau of the Budget and other Executive agencies, and also with the General Accounting Office in respect of such matters as may be appropriate, including matters affecting its functions under sections 205(b) and 206(c) of the Act, and at the earliest possible date, the Administrator of General Services shall establish such standards, prescribe such regulations, and prepare and issue such manuals and procedures as may be necessary to guide all Executive agencies in ascertaining whether their operations in the field of property and records management are efficient and economical as well as consistent with established Government policies. 3. In accordance with directives to be issued by the Administrator of General Services, each Executive agency shall promptly institute surveys to determine excess personal property and that portion of excess real property, including unimproved property, under their control which might be suitable for office, storage, and related facilities, and shall promptly report to the Administrator as soon as each survey is completed. 4. Each Executive agency shall carefully plan and schedule its requirements for supplies, equipment, materials and all other personal property in order that necessary stocks may be maintained at minimum levels and high-cost small-lot purchasing avoided. 5. Under section 201 (c) of the Act, Executive agencies are permitted to apply exchange allowances and proceeds of sale in payment of property acquired.","4":"The Administrator shall promptly prescribe regulations specifying the extent to which Executive agencies may exercise this authority, and pending the issuance of such regulations, no Executive agency shall exercise this authority except to the extent permitted by, and in accordance with the provisions of, statutes in force prior to the taking effect of this Act. 6. Section 502(d) of the Act provides that certain programs and functions now being carried on by various Executive agencies shall not be impaired or affected by the provisions of the Act. However, the attention of these agencies is called specifically to the purposes of this legislation and they shall, insofar as practicable, procure, utilize and dispose of property in accordance with the provisions of the Act and the regulations issued thereunder in order that the greatest overall efficiency and economy may be effected. These same agencies shall also cooperate with the Administrator of General Services in the making of surveys of property and property management practices and in the establishment of inventory levels as provided in section 206(a) (1) and (2) of the Act."},"L4":{"1":"Accordingly, I request under section 626 of the Tariff Act of 1930, as amended by section 153 of Public Law 97-27.6, that you monitor and enforce the measures taken within these Arrangements by requiring when necessary the presentation of valid export certificates or other documents issued by appropriate authorities within the European Communities or their member states as a condition for entry into the United States of steel mill products from the European Communities."},"EO1":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to establish policies and procedures implementing section 2204 of title 44 of the United States Code with respect to constitutionally based privileges, including those that apply to Presidential records reflecting military, diplomatic, or national security secrets, Presidential communications, legal advice, legal work, or the deliberative processes of the President and the President's advisors, and to do so in a manner consistent with the Supreme Court's decisions in Nixon v. Administrator of General Services, 433 U.S. 425 (1977), and other cases, it is hereby ordered as follows: Section 1. Definitions. For purposes of this order: (a) \"Archivist\" refers to the Archivist of the United States or his designee. (b) \"Presidential records\" refers to those documentary materials maintained by the National Archives and Records Administration pursuant to the Presidential Records Act, 44 U.S.C. 2201-2207. (c) \"Former President\" refers to the former President during whose term or terms of office particular Presidential records were created. Sec. 2. Constitutional and Legal Background. (a) For a period not to exceed 12 years after the conclusion of a Presidency, the Archivist administers records in accordance with the limitations on access imposed by section 2204 of title 44. After expiration of that period, section 2204(c) of title 44 directs that the Archivist administer Presidential records in accordance with section 552 of title 5, the Freedom of Information Act, including by withholding, as appropriate, records subject to exemptions (b)(1), (b)(2), (b)(3), (b)(4), (b)(6), (b)(7), (b)(8), and (b)(9) of section 552. Section 2204(c)(1) of title 44 provides that exemption (b)(5) of section 552 is not available to the Archivist as a basis for withholding records, but section 2204(c)(2) recognizes that the former President or the incumbent President may assert any constitutionally based privileges, including those ordinarily encompassed within exemption (b)(5) of section 552. The President's constitutionally based privileges subsume privileges for records that reflect: military, diplomatic, or national security secrets (the state secrets privilege); communications of the President or his advisors (the presidential communications privilege); legal advice or legal work (the attorney-client or attorney work product privileges); and the deliberative processes of the President or his advisors (the deliberative process privilege). (b) In Nixon v. Administrator of General Services, the Supreme Court set forth the constitutional basis for the President's privileges for confidential communications: \"Unless [the President] can give his advisers some assurance of confidentiality, a President could not expect to receive the full and frank submissions of facts and opinions upon which effective discharge of his duties depends.\" 433 U.S. at 448-49. The Court cited the precedent of the Constitutional Convention, the records of which were \"sealed for more than 30 years after the Convention.\" Id. at 447 n.11. Based on those precedents and principles, the Court ruled that constitutionally based privileges available to a President \"survive[] the individual President's tenure.\" Id. at 449. The Court also held that a former President, although no longer a Government official, may assert constitutionally based privileges with respect to his Administration's Presidential records, and expressly rejected the argument that \"only an incumbent President can assert the privilege of the Presidency.\" Id. at 448. (c) The Supreme Court has held that a party seeking to overcome the constitutionally based privileges that apply to Presidential records must establish at least a \"demonstrated, specific need\" for particular records, a standard that turns on the nature of the proceeding and the importance of the information to that proceeding. See United States v. Nixon, 418 U.S. 683, 713 (1974). Notwithstanding the constitutionally based privileges that apply to Presidential records, many former Presidents have authorized access, after what they considered an appropriate period of repose, to those records or categories of records (including otherwise privileged records) to which the former Presidents or their representatives in their discretion decided to authorize access. See Nixon v. Administrator of General Services, 433 U.S. at 450- 51. Sec. 3. Procedure for Administering Privileged Presidential Records. Consistent with the requirements of the Constitution and the Presidential Records Act, the Archivist shall administer Presidential records under section 2204(c) of title 44 in the following manner:","2":"(a) At an appropriate time after the Archivist receives a request for access to Presidential records under section 2204(c)(1), the Archivist shall provide notice to the former President and the incumbent President and, as soon as practicable,","3":"shall provide the former President and the incumbent President copies of any records that the former President and the incumbent President request to review.","4":"(b) After receiving the records he requests, the former President shall review those records as expeditiously as possible, and for no longer than 90 days for requests that are not unduly burdensome. The Archivist shall not permit access to the records by a requester during this period of review or when requested by the former President to extend the time for review. (c) After review of the records in question, or of any other potentially privileged records reviewed by the former President, the former President shall indicate to the Archivist whether the former President requests withholding of or authorizes access to any privileged records. (d) Concurrent with or after the former President's review of the records, the incumbent President or his designee may also review the records in question, or may utilize whatever other procedures the incumbent President deems appropriate to decide whether to concur in the former President's decision to request withholding of or authorize access to the records. (1) When the former President has requested withholding of the records: (i) If under the standard set forth in section 4 below, the incumbent President concurs in the former President's decision to request withholding of records as privileged, the incumbent President shall so inform the former President and the Archivist. The Archivist shall not permit access to those records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order. (ii) If under the standard set forth in section 4 below, the incumbent President does not concur in the former President's decision to request withholding of the records as privileged, the incumbent President shall so inform the former President and the Archivist. Because the former President independently retains the right to assert constitutionally based privileges, the Archivist shall not permit access to the records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order. (2) When the former President has authorized access to the records: (i) If under the standard set forth in section 4 below, the incumbent President concurs in the former President's decision to authorize access to the records, the Archivist shall permit access to the records by the requester. (ii) If under the standard set forth in section 4 below, the incumbent President does not concur in the former President's decision to authorize access to the records, the incumbent President may independently order the Archivist to withhold privileged records. In that instance, the Archivist shall not permit access to the records by a requester unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order. Sec. 4. Concurrence by Incumbent President. Absent compelling circumstances, the incumbent President will concur in the privilege decision of the former President in response to a request for access under section 2204(c)(1). When the incumbent President concurs in the decision of the former President to request withholding of records within the scope of a constitutionally based privilege, the incumbent President will support that privilege claim in any forum in which the privilege claim is challenged. Sec. 5. Incumbent President's Right to Obtain Access. This order does not expand or limit the incumbent President's right to obtain access to the records of a former President pursuant to section 2205(2)(B). Sec. 6. Right of Congress and Courts to Obtain Access. This order does not expand or limit the rights of a court, House of Congress, or authorized committee or subcommittee of Congress to obtain access to the records of a former President pursuant to section 2205(2)(A) or section 2205(2)(C).","5":"With respect to such requests, the former President shall review the records in question and, within 21 days of receiving notice from the Archivist, indicate to the Archivist his decision with respect to any privilege. The incumbent President shall indicate his decision with respect to any privilege within 21 days after the former President has indicated his decision. Those periods may be extended by the former President or the incumbent President for requests that are burdensome. The Archivist shall not permit access to the records unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order. Sec. 7. No Effect on Right to Withhold Records. This order does not limit the former President's or the incumbent President's right to withhold records on any ground supplied by the Constitution, statute, or regulation. Sec. 8. Withholding of Privileged Records During 12-Year Period. In the period not to exceed 12 years after the conclusion of a Presidency during which section 2204(a) and section 2204(b) of title 44 apply, a former President or the incumbent President may request withholding of any privileged records not already protected from disclosure under section 2204. If the former President or the incumbent President so requests, the Archivist shall not permit access to any such privileged records unless and until the incumbent President advises the Archivist that the former President and the incumbent President agree to authorize access to the records or until so ordered by a final and nonappealable court order. Sec. 9. Establishment of Procedures. This order is not intended to indicate whether and under what circumstances a former President should assert or waive any privilege. The order is intended to establish procedures for former and incumbent Presidents to make privilege determinations. Sec. 10. Designation of Representative. The former President may designate a representative (or series or group of alternative representatives, as the former President in his discretion may determine) to act on his behalf for purposes of the Presidential Records Act and this order. Upon the death or disability of a former President, the former President's designated representative shall act on his behalf for purposes of the Act and this order, including with respect to the assertion of constitutionally based privileges. In the absence of any designated representative after the former President's death or disability, the family of the former President may designate a representative (or series or group of alternative representatives, as they in their discretion may determine) to act on the former President's behalf for purposes of the Act and this order, including with respect to the assertion of constitutionally based privileges. Sec. 11. Vice Presidential Records. (a) Pursuant to section 2207 of title 44 of the United States Code, the Presidential Records Act applies to the executive records of the Vice President. Subject to subsections (b) and (c), this order shall also apply with respect to any such records that are subject to any constitutionally based privilege that the former Vice President may be entitled to invoke, but in the administration of this order with respect to such records, references in this order to a former President shall be deemed also to be references to the relevant former Vice President. (b) Subsection (a) shall not be deemed to authorize a Vice President or former Vice President to invoke any constitutional privilege of a President or former President except as authorized by that President or former President."},"P31":{"1":"Now, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that, effective as of the date of this Proclamation, Proclamation No. 3279, as amended,","2":"Subparagraph (4) of paragraph (b) of section 3 is amended by adding the following sentence at the end thereof: \"Whenever the Secretary, upon recommendation of the Director of the Office of Emergency Preparedness, finds that there may be shortages in the supply of any finished product or products in Districts I—IV, which products are deemed by the Director of the Office of Emergency Preparedness to be important to the national security, the Secretary may allocate imports of any such product or products manufactured in the Virgin Islands in excess of the limitation in the preceding sentence for such product or products, for such time and under such conditions as he may deem consistent with the purposes of this proclamation.\" 2.","3":"\"Commencing with the allocation period January 1, 1973, through December 31, 1973, the Secretary, with the concurrence of the Director of the Office of Emergency Preparedness, is authorized to make an interim allocation for any allocation period or portion thereof to any person who held an allocation of imports of crude oil and unfinished oils or of No. 2 fuel oil during the preceding allocation period. No such interim allocation shall exceed the like allocation held in such preceding allocation period by such person. However, the Secretary may adjust the allocation to any person limited by the previous sentence if such person would have been eligible for a larger allocation in 1973 under the regulations applicable during the allocation period commencing January 1, 1972. Any license issued under such interim allocation may be utilized for imports hereafter entering the United States prior to December 31, 1972, if authorized by the Secretary. Any allocation subsequently made to any person who receives an interim allocation pursuant to this section, shall be reduced by an amount equal to the interim allocation made pursuant to this section.\""},"M24":{"1":"Therefore, I direct that agencies","2":"take the following steps to significantly increase Federal procurement of biobased and other sustainable products. Section 1. Actions Related to Executive Order 13514. (a) Agencies shall include and report on biobased acquisition as part of the sustainable acquisition goals and milestones in the Strategic Sustainability Performance Plan required by section 8 of Executive Order 13514.","3":"(b) As required by section 2(h) of Executive Order 13514, agencies shall ensure that 95 percent of applicable new contract actions for products and services advance sustainable acquisition, including biobased acquisition, where such products and services meet agency performance requirements. In doing so, agencies shall: (i) include acquisition of biobased products in their Affirmative Procurement Programs and Preferable Purchasing Programs, as applicable (as originally required by Executive Order 13101 of September 14, 1998 (Greening the Government Through Waste Prevention, Recycling, and Federal Acquisition) and reinforced by Executive Order 13423 of January 24, 2007 (Strengthening Federal Environmental, Energy, and Transportation Management) and Executive Order 13514); (ii) include biobased products as part of their procurement review and monitoring program required by section 9002(a) of the 2008 Farm Bill, incorporating data collection and reporting requirements as part of their program evaluation; and (iii) provide appropriate training on procurement of biobased products for all acquisition personnel including requirements and procurement staff. (c) The Office of Management and Budget (OMB) shall emphasize biobased purchasing in the fiscal year 2012 and 2013 Sustainability/Energy scorecard, which is the periodic evaluation of agency performance on sustainable acquisition pursuant to section 4 of Executive Order 13514. Sec. 2. Biobased Product Designations. The USDA has already designated 64 categories of biobased products for preferred Federal procurement. Although these categories represent an estimated 9,000 individual products, less than half of the known biobased products are currently included in the preference program. Increasing the number of products subject to the Federal procurement preference will increase procurement of biobased products.","4":"Therefore, I direct the Secretary of Agriculture to: (a) increase both the number of categories of biobased products designated and individual products eligible for preferred purchasing by 50 percent within 1 year of the date of this memorandum; and (b) establish a web-based process whereby biobased product manufacturers can request USDA to establish a new product category for designation.","5":"The USDA shall determine the merit of the request and, if the product category is deemed eligible, propose designation within 180 days of the request. Sec. 3. Changes in Procurement Mechanisms. Several actions can be taken to facilitate improvement in and compliance with the requirements to purchase biobased products.","6":"To achieve these changes, I direct: (a) the Senior Sustainability Officers and Chief Acquisition Officers of all agencies to randomly sample procurement actions (such as solicitations and awards) to verify that biobased considerations are included as appropriate. Agencies shall include results of these sampling efforts in the Sustainability/Energy scorecard reported to OMB; (b) the Secretary of Agriculture to work with relevant officials in agencies that have electronic product procurement catalogs to identify and implement solutions to increase the visibility of biobased and other sustainable products; (c) the Senior Sustainability Officers of all agencies that have established agency-specific product specifications, in coordination with any other appropriate officials, to review and revise all specifications under their control to assure that, wherever possible and appropriate, such specifications require the use of sustainable products, including USDA-designated biobased products, and that any language prohibiting the use of biobased products is removed. The review shall be on a 4-year cycle. Significant review should be completed within 1 year of the date of this memorandum, and the results of the reviews shall be annually reported to OMB and the Office of Science and Technology Policy (OSTP); and (d) the Secretary of Agriculture to amend USDA's automated contract writing system, the Integrated Acquisition System, to serve as a model for biobased product procurement throughout the Federal Government by adding elements related to acquisition planning, evaluation factors for source selection, and specifications and requirements. Once completed, USDA shall share the model with all agencies and, as appropriate, assist any agency efforts to adopt similar mechanisms. Sec. 4. Small Business Assistance. A majority of the biobased product manufacturers and vendors selling biobased products and services that use biobased products to the Federal Government are small businesses.","7":"To improve the ability of small businesses to sell these products and services to the Federal Government, I direct: (a) the Secretary of Commerce, in consultation with the Secretary of Agriculture, to use relevant programs of the Department, such as the Manufacturing Extension Partnership network, to improve the performance and competitiveness of biobased product manufacturers; (b) the Secretary of Agriculture to work cooperatively with Procurement Technical Assistance Center programs located across the Nation to provide training and assistance to biobased product companies to make these companies aware of the BioPreferred program and opportunities to sell biobased products to Federal, State, and local government agencies; and (c) the Secretary of Agriculture to develop training within 6 months of the date of this memorandum for small businesses on the BioPreferred program and the opportunities it presents, and the Administrator of the Small Business Administration (SBA) to disseminate that training to Small Business Development Centers and feature it on the SBA website. Sec. 5. Reporting. The Federal Government should obtain the most reliable information to gauge its progress in purchasing biobased products, including measuring the annual number of procurements that include direct purchase of biobased products, the annual number of construction and service contracts that include the purchase of biobased products, and the annual volume and type of biobased products the Federal Government purchases.","8":"I direct that: (a) within 1 year of the date of this memorandum, the Federal Acquisition Regulatory Council shall propose an amendment to the Federal Acquisition Regulation to require reporting of biobased product purchases, to be made public on an annual basis; and","9":"(b) following the promulgation of the proposed amendment referenced in subsection (a) of this section, the Secretary of Agriculture, in consultation with the Chief Acquisition Officers Council, shall develop a reporting template to facilitate the annual reporting requirement. Sec. 6. Jobs Creation Research. Biobased products are creating jobs across America. These innovative products are creating new markets for agriculture and expanding opportunities in rural America.","10":"Therefore, I direct the Secretary of Agriculture to prepare a report on job creation and the economic impact associated with the biobased product industry to be submitted to the President through the Domestic Policy Council and OSTP within 2 years of the date of this memorandum. The study shall include: (a) the number of American jobs originating from the biobased product industry annually over the last 10 years, including the job changes in specific sectors; (b) the dollar value of the current domestic biobased products industry, including intermediates, feedstocks, and finished products, but excluding biofuels; (c) a forecast for biobased job creation potential over the next 10 years; (d) a forecast for growth in the biobased industry over the next 10 years; and (e) jobs data for both biofuels and biobased products, but shall generate separate data for each category. Sec. 7. Education and Outreach. In compliance with the 2002 Farm Bill, several agencies established agency promotion programs to support the biobased products procurement preference. The Federal Acquisition Institute has added biobased procurement training to its course offerings.","11":"To assure both formal and informal educational and outreach instruction on the BioPreferred program are in place and being implemented by each agency, I direct: (a) the Secretary of Agriculture to update all existing USDA BioPreferred and related sustainable acquisition training materials within 1 year of the date of this memorandum; (b) the Senior Sustainability Officers and Chief Acquisition Officers of agencies to work cooperatively with the Secretary of Agriculture to immediately implement such BioPreferred program agency education and outreach programs as are necessary to meet the requirements of this memorandum and relevant statutes; and (c) the Secretary of Agriculture to work actively with the Committee for Purchase From People Who Are Blind or Severely Disabled to promote education and outreach to program, technical, and contracting personnel, and to purchase card holders on BioPreferred AbilityOne products. Sec. 8. General Provisions. (a) This memorandum shall apply to an agency with respect to the activities, personnel, resources, and facilities of the agency that are located within the United States. The head of an agency may provide that this memorandum shall apply in whole or in part with respect to the activities, personnel, resources, and facilities of the agency that are not located within the United States, if the head of the agency determines that such application is in the interest of the United States. (b) The head of an agency shall manage activities, personnel, resources, and facilities of the agency that are not located within the United States, and with respect to which the head of the agency has not made a determination under subsection (a) of this section, in a manner consistent with the policies set forth in this memorandum, to the extent the head of the agency determines practicable. (c) For purposes of this memorandum, \"biobased product\" shall have the meaning set forth in section 8101(4) of title 7, United States Code."},"M14":{"1":"Pursuant to Section 301(d)(2) of the Trade Act of 1974, as amended (19 U.S.C. 2411(d)(2)), I have determined that the Agreement between the Governments of Japan and the United States of America Regarding Trade in Semiconductors, to be implemented by an exchange of letters, is an appropriate and feasible response to the practices of the Government of Japan with respect to trade in semiconductors. These practices have been investigated by the United States Trade Representative in response to a petition filed under Section 301 on June 14, 1985, by the Semiconductor Industry Association. The Agreement, which will be in effect until March 31, 1991, will open up the Japanese market to U.S. exports of semiconductors and will help prevent dumping of semiconductors in the United States and third country markets. It achieves a key objective of Section 301, which is to open foreign markets to U.S. exports. The satisfactory resolution of this problem demonstrates our ability to help U.S. industries and to resolve contentious trade disputes through the negotiating process. Fulfillment of the objectives and commitments in the Agreement is of critical importance.","2":"Therefore, I hereby determine that any future failure by the Government of Japan to meet the commitments and objectives of the Agreement would be inconsistent with a trade agreement or an unjustifiable act that would burden or restrict U.S. commerce. Therefore, I instruct the United States Trade Representative to report to me on: (1) the results of each of the periodic consultations held pursuant to the Agreement; and (2) annual improvements in foreign-based semiconductor firms' access to the Japanese market.","3":"I also direct the United States Trade Representative and the Secretary of Commerce to take any further action that may become appropriate to implement the Agreement. Finally, the Section 301 proceeding on semiconductors shall be suspended and shall remain suspended as long as the objectives and commitments of the Agreement are fulfilled."},"EO21":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 7902(c) of title 5, United States Code, it is hereby ordered as follows: Section 1. Policy. It is the policy of my Administration to halt the spread of coronavirus disease 2019 (COVID-19) by relying on the best available data and science-based public health measures. Such measures include wearing masks when around others, physical distancing, and other related precautions recommended by the Centers for Disease Control and Prevention (CDC). Put simply, masks and other public health measures reduce the spread of the disease, particularly when communities make widespread use of such measures, and thus save lives. Accordingly, to protect the Federal workforce and individuals interacting with the Federal workforce, and to ensure the continuity of Government services and activities, on-duty or on-site Federal employees, on-site Federal contractors, and other individuals in Federal buildings and on Federal lands should all wear masks, maintain physical distance, and adhere to other public health measures, as provided in CDC guidelines. Sec. 2. Immediate Action Regarding Federal Employees, Contractors, Buildings, and Lands.","2":"(a) The heads of executive departments and agencies (agencies) shall immediately take action, as appropriate and consistent with applicable law, to require compliance with CDC guidelines with respect to wearing masks, maintaining physical distance, and other public health measures by: on-duty or on-site Federal employees; on-site Federal contractors; and all persons in Federal buildings or on Federal lands.","3":"(b) The Director of the Office of Management and Budget (OMB), the Director of the Office of Personnel Management (OPM), and the Administrator of General Services, in coordination with the President's Management Council and the Coordinator of the COVID-19 Response and Counselor to the President (COVID-19 Response Coordinator), shall promptly issue guidance to assist heads of agencies with implementation of this section. (c) Heads of agencies shall promptly consult, as appropriate, with State, local, Tribal, and territorial government officials, Federal employees, Federal employee unions, Federal contractors, and any other interested parties concerning the implementation of this section. (d) Heads of agencies may make categorical or case-by-case exceptions in implementing subsection (a) of this section to the extent that doing so is necessary or required by law, and consistent with applicable law. If heads of agencies make such exceptions, they shall require appropriate alternative safeguards, such as additional physical distancing measures, additional testing, or reconfiguration of workspace, consistent with applicable law. Heads of agencies shall document all exceptions in writing.","4":"(e) Heads of agencies shall review their existing authorities and, to the extent permitted by law and subject to the availability of appropriations and resources, seek to provide masks to individuals in Federal buildings when needed.","5":"(f) The COVID-19 Response Coordinator shall coordinate the implementation of this section. Heads of the agencies listed in 31 U.S.C. 901(b) shall update the COVID-19 Response Coordinator on their progress in implementing this section, including any categorical exceptions established under subsection (d) of this section, within 7 days of the date of this order and regularly thereafter. Heads of agencies are encouraged to bring to the attention of the COVID-19 Response Coordinator any questions regarding the scope or implementation of this section. Sec. 3. Encouraging Masking Across America. (a) The Secretary of Health and Human Services (HHS), including through the Director of CDC, shall engage, as appropriate, with State, local, Tribal, and territorial officials, as well as business, union, academic, and other community leaders, regarding mask-wearing and other public health measures, with the goal of maximizing public compliance with, and addressing any obstacles to, mask-wearing and other public health best practices identified by CDC.","6":"(b) The COVID-19 Response Coordinator, in coordination with the Secretary of HHS, the Secretary of Homeland Security, and the heads of other relevant agencies, shall promptly identify and inform agencies of options to incentivize, support, and encourage widespread mask-wearing consistent with CDC guidelines and applicable law. Sec. 4. Safer Federal Workforce Task Force. (a) Establishment.","7":"There is hereby established the Safer Federal Workforce Task Force (Task Force). (b) Membership. The Task Force shall consist of the following members: (i) the Director of OPM, who shall serve as Co-Chair; (ii) the Administrator of General Services, who shall serve as Co-Chair; (iii) the COVID-19 Response Coordinator, who shall serve as Co-Chair; (iv) the Director of OMB; (v) the Director of the Federal Protective Service; (vi) the Director of the United States Secret Service; (vii) the Administrator of the Federal Emergency Management Agency; (viii) the Director of CDC; and (ix) the heads of such other agencies as the Co-Chairs may individually or jointly invite to participate. (c) Organization. A member of the Task Force may designate, to perform the Task Force functions of the member, a senior-level official who is a full-time officer or employee of the member's agency. At the direction of the Co-Chairs, the Task Force may establish subgroups consisting exclusively of Task Force members or their designees, as appropriate. (d) Administration.","8":"The General Services Administration shall provide funding and administrative support for the Task Force to the extent permitted by law and within existing appropriations.","9":"The Co-Chairs shall convene regular meetings of the Task Force, determine its agenda, and direct its work. (e) Mission.","10":"The Task Force shall provide ongoing guidance to heads of agencies on the operation of the Federal Government, the safety of its employees, and the continuity of Government functions during the COVID-19 pandemic. Such guidance shall be based on public health best practices as determined by CDC and other public health experts, and shall address, at a minimum, the following subjects as they relate to the Federal workforce: (i) testing methodologies and protocols; (ii) case investigation and contact tracing; (iii) requirements of and limitations on physical distancing, including recommended occupancy and density standards; (iv) equipment needs and requirements, including personal protective equipment; (v) air filtration; (vi) enhanced environmental disinfection and cleaning; (vii) safe commuting and telework options; (viii) enhanced technological infrastructure to support telework; (ix) vaccine prioritization, distribution, and administration; (x) approaches for coordinating with State, local, Tribal, and territorial health officials, as well as business, union, academic, and other community leaders; (xi) any management infrastructure needed by agencies to implement public health guidance; and (xii) circumstances under which exemptions might appropriately be made to agency policies in accordance with CDC guidelines, such as for mission-critical purposes. (f) Agency Cooperation. The head of each agency listed in 31 U.S.C. 901(b) shall, consistent with applicable law, promptly provide the Task Force a report on COVID-19 safety protocols, safety plans, or guidance regarding the operation of the agency and the safety of its employees, and any other information that the head of the agency deems relevant to the Task Force's work. Sec. 5. Federal Employee Testing.","11":"The Secretary of HHS, through the Director of CDC, shall promptly develop and submit to the COVID-19 Response Coordinator a testing plan for the Federal workforce. This plan shall be based on community transmission metrics and address the populations to be tested, testing types, frequency of testing, positive case protocols, and coordination with local public health authorities for contact tracing. Sec. 6. Research and Development.","12":"The Director of the Office of Science and Technology Policy, in consultation with the Secretary of HHS (through the National Science and Technology Council), the Director of OMB, the Director of CDC, the Director of the National Institutes of Health, the Director of the National Science Foundation, and the heads of any other appropriate agencies, shall assess the availability of Federal research grants to study best practices for implementing, and innovations to better implement, effective mask-wearing and physical distancing policies, with respect to both the Federal workforce and the general public. Sec. 7. Scope. (a) For purposes of this order: (i) \"Federal employees\" and \"Federal contractors\" mean employees (including members of the Armed Forces and members of the National Guard in Federal service) and contractors (including such contractors' employees) working for the executive branch; (ii) \"Federal buildings\" means buildings, or office space within buildings, owned, rented, or leased by the executive branch of which a substantial portion of occupants are Federal employees or Federal contractors; and (iii) \"Federal lands\" means lands under executive branch control.","13":"(b) The Director of OPM and the Administrator of General Services shall seek to consult, in coordination with the heads of any other relevant agencies and the COVID-19 Response Coordinator, with the Sergeants at Arms of the Senate and the House of Representatives and the Director of the Administrative Office of the United States Courts (or such other persons designated by the Majority and Minority Leaders of the Senate, the Speaker and Minority Leader of the House, or the Chief Justice of the United States, respectively), to promote mask-wearing, physical distancing, and adherence to other public health measures within the legislative and judicial branches,","14":"and shall provide requested technical assistance as needed to facilitate compliance with CDC guidelines. Sec. 8. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"EO24":{"1":"Accordingly, to address the threat described in this order and to take further steps with respect to this national emergency, I hereby order: Section 1. (a) All property and interests in property that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of any United States person of the following persons are blocked and may not be transferred, paid, exported, withdrawn, or otherwise dealt in: (i) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be responsible for, or complicit in, or to have directly or indirectly engaged or attempted to engage in, any of the following: (A) actions or policies that threaten the peace, security, or stability of Sudan; (B) actions or policies that obstruct, undermine, delay, or impede, or pose a significant risk of obstructing, undermining, delaying, or impeding, the formation or operation of a civilian transitional government, Sudan's transition to democracy, or a future democratically elected government; (C) actions or policies that have the purpose or effect of undermining democratic processes or institutions in Sudan; (D) censorship or other actions or policies that prohibit, limit, or penalize the exercise of freedoms of expression, association, or peaceful assembly by individuals in Sudan, or that limit access to free and independent news or information in or with respect to Sudan; (E) corruption, including bribery, misappropriation of state assets, and interference with public processes such as government oversight of parastatal budgets and revenues for personal benefit; (F) serious human rights abuse, including serious human rights abuse related to political repression, in or with respect to Sudan; (G) the targeting of women, children, or any other civilians through the commission of acts of violence (including killing, maiming, torture, or rape or other sexual violence), abduction, forced displacement, or attacks on schools, hospitals, religious sites, or locations where civilians are seeking refuge, or through conduct that would constitute a serious abuse or violation of human rights or a violation of international humanitarian law; (H) the obstruction of the activities of United Nations missions—including peacekeeping missions, as well as diplomatic or humanitarian missions—in Sudan, or of the delivery of, distribution of, or access to humanitarian assistance; or (I) attacks against United Nations missions, including peacekeeping operations; (ii) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be or have been a leader, official, senior executive officer, or member of the board of directors of any entity: (A) that has, or whose members have, engaged in any activity described in subsection (a)(i) of this section relating to the tenure of such leader, official, senior executive officer, or member of the board of directors; or (B) whose property and interests in property are blocked pursuant to this order relating to the tenure of such leader, official, senior executive officer, or member of the board of directors; (iii) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be a spouse or adult child of any person whose property and interests in property are blocked pursuant to this order; (iv) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to have materially assisted, sponsored, or provided financial, material, or technological support for, or goods or services to or in support of, any activity described in subsection (a)(i) of this section or any person whose property and interests in property are blocked pursuant to this order; or (v) any foreign person determined by the Secretary of the Treasury, in consultation with the Secretary of State, to be owned or controlled by, or to have acted or purported to act for or on behalf of, directly or indirectly, any person whose property and interests in property are blocked pursuant to this order. (b) The prohibitions in subsection (a) of this section apply except to the extent provided by statutes, or in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted before the date of this order. Sec. 2.","2":"Following the issuance of a determination by the Secretary of State, in consultation with the Secretary of the Treasury and the Administrator of the United States Agency for International Development, that a civilian transitional government has been formed in Sudan, the Assistant to the President for National Security Affairs shall coordinate, through the interagency process identified in National Security Memorandum 2 of February 4, 2021 (Renewing the National Security Council System), or any successor memorandum, the executive branch actions necessary to implement the policy set forth in this order, including coordinating executive departments and agencies (agencies) to mobilize international assistance to support such a civilian transitional government in implementing political, economic, security, and human rights-related reforms essential for completing a democratic transition. Sec. 3. The prohibitions in section 1 of this order include: (a) the making of any contribution or provision of funds, goods, or services by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to this order; and (b) the receipt of any contribution or provision of funds, goods, or services from any such person. Sec. 4.","3":"I hereby determine that the making of donations of the types of articles specified in section 203(b)(2) of IEEPA (50 U.S.C. 1702(b)(2)) by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to section 1 of this order would seriously impair my ability to deal with the national emergency declared in Executive Order 13067, and expanded by Executive Order 13400 and this order,","4":"and I hereby prohibit such donations as provided by section 1 of this order. Sec. 5. (a) Any transaction that evades or avoids, has the purpose of evading or avoiding, causes a violation of, or attempts to violate any of the prohibitions set forth in this order is prohibited. (b) Any conspiracy formed to violate any of the prohibitions set forth in this order is prohibited. Sec. 6.","5":"(a) The unrestricted immigrant and nonimmigrant entry into the United States of noncitizens determined to meet one or more of the criteria set forth in section 1(a) of this order would be detrimental to the interests of the United States, and the entry of such persons into the United States, as immigrants or nonimmigrants, is hereby suspended, except when the Secretary of State or the Secretary of Homeland Security, as appropriate, determines that the person's entry would not be contrary to the interests of the United States, including when the Secretary of State or the Secretary of Homeland Security, as appropriate, so determines, based on a recommendation of the Attorney General, that the person's entry would further important United States law enforcement objectives.","6":"(b) The Secretary of State shall implement this authority as it applies to visas pursuant to such procedures as the Secretary of State, in consultation with the Secretary of Homeland Security, may establish. (c) The Secretary of Homeland Security shall implement this order as it applies to the entry of noncitizens pursuant to such procedures as the Secretary of Homeland Security, in consultation with the Secretary of State, may establish. (d) Such persons shall be treated by this section in the same manner as persons covered by section 1 of Proclamation 8
