\n\nSec. 8. Prior Order Superseded. Executive Order 13420 of December 21, 2006, is superseded.\n\nGeorge W. Bush\n\nThe White House,\n\nJanuary 4, 2008.","L14":"Dear Mr. Speaker: (Dear Mr. President:)\n\nConsistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b) (IEEPA), I hereby report that I have issued an Executive Order (this \"order\") in which I terminate the national emergency declared in Executive Order 12722 of August 2, 1990, amend Executive Order 13290 of March 20, 2003, and take additional steps regarding the national emergency I declared in Executive Order 13303 of May 22, 2003, and expanded in Executive Order 13315 of August 28, 2003. I have determined that the situations that gave rise to these national emergencies have been significantly altered by the removal of the regime of Saddam Hussein and other developments.\n\nExecutive Order 12722 of August 2, 1990, imposed sanctions on Iraq in response to its invasion of Kuwait and other actions. Those sanctions were modified in Executive Order 12724 of August 9, 1990, in light of United Nations Security Council Resolution (UNSCR) 661 of August 6, 1990, which also imposed sanctions on Iraq. I have determined that the removal of the regime of Saddam Hussein warrants the termination altogether of the national emergency declared in Executive Order 12722. This action is consistent with United Nations Security Council Resolutions 1483 and 1546, of May 22, 2003, and June 8, 2004, respectively, which substantially lifted the multilateral economic sanctions against Iraq.\n\nAlthough I am terminating the national emergency declared in Executive Order 12722, pursuant to my authority under IEEPA, I am continuing for the near future certain prohibitions with respect to property previously blocked pursuant to Executive Orders 12722 and 12724. Such prohibitions are necessary on account of claims involving Iraq.\n\nConsistent with section 203(a)(1)(C) of IEEPA, 50 U.S.C. 1702(a)(1)(C), in Executive Order 13290 of March 20, 2003, I ordered that certain blocked funds held in the United States in accounts in the name of the Government of Iraq, the Central Bank of Iraq, Rafidain Bank, Rasheed Bank, or the State Organization for Marketing Oil be confiscated and vested in the Department of the Treasury. I originally exercised these authorities in furtherance of Executive Order 12722. In light of the changed circumstances in Iraq, and my decision to terminate the national emergency declared in Executive Order 12722, I have now determined that the exercise of authorities in Executive Order 13290 should continue in order to address the national emergency I declared in Executive Order 13303 of May 22, 2003, and expanded in Executive Order 13315 of August 28, 2003, regarding the obstacles posed to the orderly reconstruction of Iraq. This order amends Executive Order 13290 to that effect.\n\nIn Executive Order 13303 of May 22, 2003, I declared a national emergency to address the unusual and extraordinary threat to the national security and foreign policy of the United States posed by obstacles to the orderly reconstruction of Iraq, the restoration and maintenance of peace and security in that country, and the development of political, administrative, and economic institutions in Iraq. I expanded that emergency in Executive Order 13315 of August 28, 2003, in light of UNSCR 1483 of May 22, 2003, in which the Security Council decided that states shall freeze the assets of the former Iraqi regime, Saddam Hussein, and other senior officials of the former Iraqi regime, and their immediate family members, among others, and cause the transfer of certain of those assets to the Development Fund for Iraq. Executive Order 13315 implements this provision of UNSCR 1483.\n\nThis order further modifies the actions taken to address the national emergency declared in Executive Order 13303, as expanded in Executive Order 13315, by amending the Annex to Executive Order 13315 to include certain persons determined to have been subject to economic sanctions pursuant to Executive Orders 12722 and 12724. Because of their association with the prior Iraqi regime, I have determined that these persons present an obstacle to the orderly reconstruction of Iraq, the restoration and maintenance of peace and security in that country, and the development of political, administrative, and economic institutions in Iraq and, therefore, I have determined that such persons should be subject to sanctions under Executive Order 13315.\n\nAdditionally, in UNSCR 1483, the Security Council decided that states shall take appropriate steps to facilitate the safe return to Iraqi institutions of Iraqi cultural property or other items of archeological, historical, cultural, rare scientific, and religious importance that were illegally removed from the Iraq National Museum, the National Library, and other locations in Iraq since August 6, 1990, including by establishing a prohibition on trade in or transfer of such items and items with respect to which reasonable suspicion exists that they have been illegally removed. This order, among other actions, implements this international legal obligation.\n\nI have delegated to the Secretary of the Treasury, in consultation with the Secretary of State, the authority to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by IEEPA and the United Nations Participation Act of 1945, as amended, as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government consistent with applicable law. I have directed all agencies of the United States Government to take all appropriate measures within their authority to carry out the provisions of this order.\n\nI have enclosed a copy of this order, which became effective at 12:01 a.m. eastern daylight time on July 30, 2004.\n\nSincerely,\n\nGEORGE W. BUSH","EO3":"By virtue of the authority vested in me by section 5(d) of the Act of March 18, 1959, providing for the admission of the State of Hawaii into the Union (73 Stat. 5), and as President of the United States, it is hereby ordered as follows—\n\n1. All lands and other property hereinafter described, being lands and property which were ceded to the United States by the Republic of Hawaii under the joint resolution of annexation, approved July 7, 1898 (30 Stat. 750), or which have been acquired in exchange for lands or properties so ceded, are hereby set aside for the use of the United States* in fee simple subject to valid existing rights—\n\nPortion Of Tract B, Makua Military Reservation\n\nBeing portions of the Government Lands of Makua and Eahanahaiki, and a portion of the Makua Forest Reserve.\n\nSituated at Makua and Kahanahaiki, Waianae, Oahu, Hawaii.\n\nBeginning at a point on the westerly boundary of this piece of land, also being on the northerly boundary of Plot 1 of Parcel 5 of the U.S. Condemnation Civil Action No. 485 (Land Commission Award 6092:1), the coordinates of said point of beginning from Government Survey Triangulation Station \"Makua U. S. E.\" being 4,950.50 feet North and 1,246.93 feet East, thence running by azimuths measured clockwise from true South:\n\nProceeding along the remainder of the land of Kahanahaiki for the next four courses:\n\n1. 171°08'642.12 feet;\n\n2. 159°36'2,440.00 feet;\n\n3. 149°28' 1,438.00 feet;\n\n4. 242°51'40\" 1,991.74 feet;\n\n5. 230°00' 1,100.00 feet along the remainder of Land of Kahanahaiki and MakuaKeaau Forest Reserve to the top of the ridge separating the Kuaokala Forest Reserve and Makua-Keaau Forest Reserve; thence along Kuaokala Forest Reserve, along the ridge, direct azimuth and distance being:\n\n6. 261°32' 895.30 feet; thence along Mokuleia Forest Reserve, along the ridge for the next two courses, the direct azimuths and distances being:\n\n7. 291°00' 7,070.00 feet;\n\n8. 316°15' 10,870.00 feet; thence along Land Court Application 1052, along the ridge for the next five courses, the direct azimuths and distances being:\n\n9. 58°10' 1,426.10 feet;\n\n10. 65°42' 1,299.60feet;\n\n11. 69°51' 2,347.20 feet;\n\n12. 60°11' 994.30 feet;\n\n13. 96°42' 817.90 feet; thence along the remainders of Makua-Keaau Forest Reserve, along the ridge, the direct azimuth and distance being:\n\n14. 97°31'06\" 7,713.10 feet; thence along the Land of Ohikilolo, along the ridge, the direct azimuth and distance being:\n\n15. 105°31'30\" 1 600 00 feet\n\n16. 180°30' 2,360.00 feet along the remainder of the Land of Makua;\n\n17. 171°08' 3,213.88 feet along the remainders of the Land of Makua, Kahanahaiki and Plot 1 of Parcel 5 of U.S. Condemnation Civil Action No. 485 (Land Commission Award 6092:1) to the point of beginning and containing a gross area of 3,273 acres, less 5.95 acres of Tract 1 of Makua Military Reservation (State fee land) and 30.57 acres of Condemned Land, leaving a net area of 3,236.48 acres, more or less.\n\n2. Access rights to and from the nearest public highway to the above described land in, upon, over, and across, such of the lands and properties adjoining thereto which were ceded to the United States by the Republic of Hawaii under the joint resolution of annexation, approved July 7, 1898 (30 Stat. 750), or which have been acquired in exchange for lands or properties so ceded are also hereby set aside for the use of the United States.\n\nLYNDON B. JOHNSON\n\nThe White House,\n\nAugust 15, 1964","P43":"By the President of the United States of America A Proclamation\n\nDuring my first Administration, I restricted the entry of certain foreign nationals into the United States to prevent national security and public safety threats from reaching our borders. The Supreme Court upheld these restrictions. I reinstated these successful policies in Executive Order 14161 of January 20, 2025 (Protecting the United States From Foreign Terrorists and Other National Security and Public Safety Threats), and Proclamation 10949 of June 4, 2025 (Restricting the Entry of Foreign Nationals To Protect the United States From Foreign Terrorists and Other National Security and Public Safety Threats).\n\nIt is the policy of the United States to protect its citizens from foreign nationals who intend to commit terrorist attacks, threaten our national security and public safety, incite hate crimes, or otherwise exploit the immigration laws for malevolent purposes.\n\nThe United States must exercise extreme vigilance during the visa-issuance and immigration processes to identify, prior to their admission or entry into the United States, foreign nationals who intend to harm Americans or our national interests. The United States Government must ensure that admitted aliens do not intend to threaten its citizens; undermine or destabilize its culture, government, institutions, or founding principles; or advocate for, aid, or support designated foreign terrorists or other threats to our national security.\n\nIn order to protect our Nation, as directed in Executive Order 14161, the Secretary of State, in coordination with the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, identified countries throughout the world for which screening and vetting information was so deficient as to warrant a full or partial suspension of the admission of nationals from those countries pursuant to section 212(f) of the Immigration and Nationality Act (INA), 8 U.S.C. 1182(f). Accordingly, in Proclamation 10949, I restricted the entry of foreign nationals into the United States from countries with deficient screening and vetting information to protect the national security and public safety of the United States and its people. The proclamation also directed the United States Government to immediately engage countries identified in the proclamation on measures that must be taken to comply with the screening, vetting, immigration, and security requirements of the United States.\n\nDespite those engagements, most of the countries identified in Proclamation 10949, as well as others, continue to exhibit woeful inadequacies in screening, vetting, and provision of information. At least one country lacks mechanisms in hospitals to ensure births are reported, and widespread corruption, combined with a general lack of vetting and poor recordkeeping, result in any non-citizen being able to obtain any civil document from that country, particularly if that person is willing to pay a fee or engage an individual that specializes in assisting in such fraud. In that same country, law enforcement records are not maintained with the accuracy or consistency necessary to provide representations of individuals' criminal histories to the United States Government. In another country, civil documents like marriage licenses and birth certificates are handwritten and stamped on regular paper, making them highly susceptible to alteration, and there is a fraudulent document market that produces all types of falsified records, making written corroboration of any visa application practically impossible. In yet another country, criminal records are widely unreliable and inaccessible. And in another, United States visas are used as a tool for illicit transborder movement of assets by corrupt government officials and organized criminal groups. Corruption in another country even extends to the national school system, which has provided falsified diplomas and grade information in the past to fraudsters who have tried to obtain student visas and eligibility for large athletic scholarships. The government of another country refuses to provide passport exemplars, undermining the United States Government's ability to detect fraudulent documents. In another country, the population, for the most part, does not formally document life events. This makes effective verification of basic biographical data such as birthdates, marriages, and parentage exceedingly difficult, if not impossible. Such countries warrant continued or new travel restrictions.\n\nFurther, after continuing their review, and in light of the experience gained since the issuance of Proclamation 10949 and the reaction of foreign countries to the issuance of that proclamation, the Secretary of State, the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence have identified additional countries that cannot meet basic criteria for identifying their nationals and residents who pose national security and public safety threats and for sharing information with the United States. For example, only 40 percent of one country's territory is under complete government control, and officials there have noted that their ability to securely process, house, or monitor non-citizens is constrained. In another country, corruption in various forms is pervasive. Other countries have been subject to successful efforts to overthrow or undermine their governments, with the result that radical terrorist groups operate with minimal, if any, interference from law enforcement, engaging in forced labor, sex trafficking, illegal drug manufacturing and distribution, and other activities that destabilize such countries. And, because of the poor documentation practices and corrupt governments in these countries, there can be little assurance that the foreign nationals from these countries who seek to come to America on immigrant or nonimmigrant visas are not bringing these criminal enterprises with them to the United States.\n\nAccording to United States law enforcement reporting, foreign nationals from countries named in this proclamation have been involved with crimes that include murder, terrorism, embezzling public funds, human smuggling, human trafficking, and other criminal activity. Many of these countries are ranked in the top third of countries for criminality, and widely unreliable foreign civil documents and lack of authoritative criminal information make it extremely difficult for United States screening and vetting authorities to assess prior criminal activity and other grounds of inadmissibility.\n\nFinally, some of these countries have offered Citizenship by Investment (CBI) without residency, which poses challenges for screening and vetting purposes. As an example, a foreign national from a country that is subject to travel restrictions could purchase CBI from a second country that is not subject to travel restrictions, obtain a passport in the citizenship of that second country, and subsequently apply for a United States visa for travel to the United States, thus evading the travel restrictions on his or her first country. Additionally, United States law enforcement and the Department of State have found that, historically, CBI programs have been susceptible to several risks. These risks include allowing an individual to conceal his or her identity and assets to circumvent travel restrictions or financial or banking restrictions.\n\nForeign nationals from the countries described above have also exploited the historic generosity of the United States and violated our Nation's immigration laws by not adhering to the terms of their nonimmigrant or immigrant visas. As cited in the Department of Homeland Security (DHS) Entry/Exit Overstay Report, foreign nationals from many countries have high nonimmigrant visa overstay rates. These visa overstays and other abuses flagrantly violate United States immigration laws, despite generous incentives offered by my Administration—for example, the ability to self-deport using the CBP Home app. To faithfully uphold United States immigration law, the flow of foreigners from countries with high overstay rates or significant fraud must stop.\n\nIn addition, the implementation of Proclamation 10949 counsels narrowing the categorical exceptions described in that proclamation to prevent exploitation by foreign nationals. For example, immigrant visas for family members of individuals in the United States will no longer be a broad categorical exception. As described above, the countries to which this proclamation applies have persistent, chronic vetting deficiencies that impede conclusive admissibility determinations and that are readily exploitable to threaten United States national security and public safety. These deficiencies include poor civil documentation and recordkeeping practices, widespread corruption and fraud, unreliable or inaccessible criminal records, and unreliable government travel documents. These pervasive risks concerning nationals from the covered countries apply with at least equal force to family-based visa applications—which comprise most of the immigrant visa applications from such countries—and potentially with even greater force. Familial ties can serve—and, in the past, have in fact served, based on concrete information provided by United States law enforcement and the Department of State—as unique vectors for fraudulent, criminal, or even terrorist activity through means such as the domestic or international financing of such activity. Broadly excepting most immigrant visa applicants from the countries whose risks and deficiencies most gravely threaten America is inconsistent with protecting our national security and with the purpose of driving greater cooperation and vetting improvements by these specific countries. This is particularly true in light of the large numbers of individuals granted United States immigration status during the prior administration without sufficient documentation and vetting mechanisms in place, whose family members might take advantage of such an exception, just as criminals have taken advantage of family-based visas in the past. Accordingly, I have determined that the risks from the classes of aliens covered by this proclamation cannot be satisfactorily mitigated absent resolution of the predominating country-specific concerns, and any extraordinary cases can be appropriately addressed through the national-interest exceptions provided for in this proclamation and Proclamation 10949.\n\nAs a result of these reviews and considerations, I have decided—as described in sections 2 and 3 of this proclamation—to continue to impose and modify the limitations set forth in sections 2 and 3 of Proclamation 10949 on the entry into the United States by certain classes of foreign nationals. Also, I have decided—as described in sections 4 and 5 of this proclamation—to impose the limitations set forth below on the entry into the United States by certain other classes of foreign nationals.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including sections 212(f) and 215(a) of the INA, 8 U.S.C. 1182(f) and 1185(a), and section 301 of title 3, United States Code, hereby find that, absent the measures set forth in this proclamation, the immigrant and nonimmigrant entry into the United States of persons described in sections 2, 3, 4, and 5 of this proclamation would be detrimental to the interests of the United States, and that their entry should be subject to certain restrictions, limitations, and exceptions. I therefore hereby proclaim the following:\n\nSection 1. Policy and Purpose. (a) It is the policy of the United States to protect its citizens from terrorist attacks and other national security and public safety threats. Screening and vetting protocols and procedures associated with visa adjudications and other immigration processes play a critical role in implementing that policy. These protocols and procedures enhance our ability to detect foreign nationals who may commit, aid, or support acts of terrorism, or otherwise pose a safety threat, and they aid our efforts to prevent such foreign nationals from entering the United States.\n\n(b) Identity-management and information-sharing standards and practices of foreign governments impact the effectiveness of the screening and vetting protocols and procedures of the United States. Foreign governments manage the identity and travel documents of their nationals and residents. They also control the circumstances under which they provide information about their nationals and residents to other governments, including information about known and suspected terrorists and criminals.\n\nIt is, therefore, the policy of the United States to take all necessary and appropriate steps to encourage foreign governments to improve their identity-management and information-sharing protocols and procedures and to regularly share their identity and threat information with the screening and vetting systems of the United States.\n\n(c) Proclamation 10949 directed the United States Government to fully restrict and limit the entry of nationals of the following 12 countries: Afghanistan, Burma, Chad, Republic of the Congo, Equatorial Guinea, Eritrea, Haiti, Iran, Libya, Somalia, Sudan, and Yemen. The proclamation directed the United States Government to partially restrict and limit the entry of nationals of the following 7 countries: Burundi, Cuba, Laos, Sierra Leone, Togo, Turkmenistan, and Venezuela. Additionally, the proclamation directed the Secretary of State, in consultation with the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, to immediately engage each of the countries identified in the proclamation on measures that must be taken to comply with United States screening, vetting, immigration, and security requirements.\n\n(d) Proclamation 10949 directed the Secretary of State, in consultation with the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, to submit a report to the President, through the Assistant to the President for Homeland Security, describing his assessment and recommending whether any suspensions and limitations imposed by the proclamation should be continued, terminated, modified, or supplemented.\n\n(e) The Secretary of State, with the Assistant to the President for Homeland Security, presented the report described in subsection (d) of this section, recommending that entry restrictions and limitations continue to apply to foreign nationals of several countries. The report also identified additional countries for which vetting and screening information is so deficient as to warrant a full or partial suspension of admission. These recommendations follow the engagement with foreign countries that I directed in Proclamation 10949.\n\n(f) In evaluating the recommendations from the Secretary of State and determining whether and to what extent to impose, or continue to impose, restrictions for each country, I consulted with the Secretary of State, the Secretary of War, the Attorney General, the Secretary of Homeland Security, the Director of National Intelligence, appropriate Assistants to the President, and the Director of the Central Intelligence Agency. I considered foreign policy, national security, and counterterrorism goals. I further considered various factors, including each country's screening and vetting capabilities, information-sharing policies, and country-specific risk factors, including whether each country has a significant terrorist presence within its territory, its visa-overstay rate, and its cooperation with accepting back its removable nationals. Each of these factors, including visa-overstay rates, was just one of the factors considered in making the determinations in this proclamation, and the determinations in this proclamation are based on the totality of the circumstances with respect to each country after a review of all relevant factors.\n\nI also considered the different risks posed by aliens admitted on immigrant visas and those admitted on nonimmigrant visas. Persons admitted on immigrant visas are, or can become, lawful permanent residents of the United States. Such persons admitted on immigrant visas may present national security or public safety concerns that may be distinct from those admitted as nonimmigrants. The United States affords lawful permanent residents more enduring rights than it does to nonimmigrants. Lawful permanent residents are more difficult to remove than nonimmigrants, even after national security or public safety concerns arise, which increases the costs and aggravates the dangers of errors associated with admitting such individuals. And although immigrants are generally subject to more extensive vetting than nonimmigrants, such vetting is far less reliable when the country from which someone seeks to emigrate maintains inadequate identity-management or information-sharing policies or otherwise poses risks to the national security or public safety of the United States.\n\nI reviewed these factors and assessed these goals, with a particular focus on crafting country-specific restrictions. This approach was designed to encourage cooperation with the relevant countries in recognition of each country's unique circumstances. The restrictions and limitations imposed by this proclamation are, in my judgment, necessary to prevent the entry or admission of foreign nationals about whom the United States Government lacks sufficient information to assess the risks they pose to the United States. The restrictions and limitations imposed by this proclamation are necessary: to garner cooperation from foreign governments, including as to reducing overstay rates of their nationals; enforce our immigration laws; and advance other important foreign policy, national security, and counterterrorism objectives. Under the current circumstances, without the restrictions and limitations imposed in this proclamation, the entry or admission of such foreign nationals is detrimental to the national interest.\n\n(g) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to continue to fully restrict and limit the entry of nationals of the following 12 countries: Afghanistan, Burma, Chad, Republic of the Congo, Equatorial Guinea, Eritrea, Haiti, Iran, Libya, Somalia, Sudan, and Yemen. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants.\n\n(h) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to fully restrict and limit the entry of nationals of 7 additional countries: Burkina Faso, Laos, Mali, Niger, Sierra Leone, South Sudan, and Syria. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants. I have also determined to fully restrict and limit the entry of individuals using travel documents issued or endorsed by the Palestinian Authority (PA).\n\n(i) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to continue to partially restrict and limit the entry of nationals of the following 4 countries: Burundi, Cuba, Togo, and Venezuela. I have also decided to modify the partial restriction and limitation on the entry of nationals of Turkmenistan. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants.\n\n(j) After reviewing the report described in subsection (d) of this section, and after accounting for the foreign policy, national security, and counterterrorism objectives of the United States, I have determined to partially restrict and limit the entry of nationals of the following 15 countries: Angola, Antigua and Barbuda, Benin, Cote d 'Ivoire, Dominica, Gabon, The Gambia, Malawi, Mauritania, Nigeria, Senegal, Tanzania, Tonga, Zambia, and Zimbabwe. These restrictions distinguish between, but apply to both, the entry of immigrants and nonimmigrants.\n\n(k) Sections 4 and 5 of this proclamation describe some of the identity-management and information-sharing inadequacies that led me to impose, or continue to impose, the restrictions described in this proclamation. These inadequacies are sufficient to justify my finding that unrestricted entry of nationals from the named countries would be detrimental to the interests of the United States. Publicly disclosing additional details on which I relied in making these determinations, however, would cause serious damage to the national security of the United States, and many such details are classified.\n\nSec. 2. Continued Full Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries continues to be suspended and limited as set forth in Proclamation 10949 and herein, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation:\n\n(a) Afghanistan;\n\n(b) Burma;\n\n(c) Chad;\n\n(d) Republic of the Congo;\n\n(e) Equatorial Guinea;\n\n(f) Eritrea;\n\n(g) Haiti;\n\n(h) Iran;\n\n(i) Libya;\n\n(j) Somalia;\n\n(k) Sudan; and\n\n(l) Yemen.\n\nSec. 3. Continued Partial Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries continues to be suspended and limited as set forth in Proclamation 10949 and herein, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation:\n\n(a) Burundi;\n\n(b) Cuba;\n\n(c) Togo; and\n\n(d) Venezuela.\n\nSec. 4. Full Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries is hereby suspended and limited, as follows, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation:\n\n(a) Burkina Faso\n\n(i) According to the Department of State, terrorist organizations continue to plan and conduct terrorist activities throughout Burkina Faso. According to the Fiscal Year 2024, Department of Homeland Security (DHS) Entry/Exit Overstay Report (\"Overstay Report\"), Burkina Faso had a B–1/B–2 visa overstay rate of 9.16 percent and a student (F), vocational (M), and exchange visitor (J) visa overstay rate of 22.95 percent. Additionally, Burkina Faso has historically refused to accept back its removable nationals.\n\n(ii) The entry into the United States of nationals of Burkina Faso as immigrants and as nonimmigrants is hereby fully suspended.\n\n(b) Laos\n\n(i) According to the Overstay Report, Laos had a B–1/B–2 visa overstay rate of 28.34 percent and an F, M, and J visa overstay rate of 11.41 percent. According to the Fiscal Year 2023, Department of Homeland Security (DHS) Entry/Exit Overstay Report (\"2023 Overstay Report\"), Laos had a B–1/B–2 visa overstay rate of 34.77 percent and an F, M, and J visa overstay rate of 6.49 percent. Additionally, Laos has historically failed to accept back its removable nationals.\n\n(ii) The entry into the United States of nationals of Laos as immigrants and as nonimmigrants is hereby fully suspended.\n\n(c) Mali\n\n(i) According to the Department of State, armed conflict between the Malian government and armed groups is common throughout the country. Terrorist organizations operate freely in certain areas of Mali.\n\n(ii) The entry into the United States of nationals of Mali as immigrants and as nonimmigrants is hereby fully suspended.\n\n(d) Niger\n\n(i) According to the Department of State, terrorists and their supporters are active in planning kidnappings in Niger, and they may attack anywhere in the country. According to the Overstay Report, Niger had a B–1/B–2 visa overstay rate of 13.41 percent and an F, M, and J visa overstay rate of 16.46 percent.\n\n(ii) The entry into the United States of nationals of Niger as immigrants and as nonimmigrants is hereby fully suspended.\n\n(e) Sierra Leone\n\n(i) According to the Overstay Report, Sierra Leone had a B–1/B–2 visa overstay rate of 16.48 percent and an F, M, and J visa overstay rate of 35.83 percent. According to the 2023 Overstay Report, Sierra Leone had a B–1/B–2 visa overstay rate of 15.43 percent and an F, M, and J visa overstay rate of 35.83 percent. Additionally, Sierra Leone has historically failed to accept back its removable nationals.\n\n(ii) The entry into the United States of nationals of Sierra Leone as immigrants and as nonimmigrants is hereby fully suspended.\n\n(f) South Sudan\n\n(i) According to the Overstay Report, South Sudan had a B–1/B–2 visa overstay rate of 6.99 percent and an F, M, and J visa overstay rate of 26.09 percent. Additionally, South Sudan has historically failed to accept back its removable nationals.\n\n(ii) The entry into the United States of nationals of South Sudan as immigrants and as nonimmigrants is hereby fully suspended.\n\n(g) Syria\n\n(i) Syria is emerging from a protracted period of civil unrest and internal strife. While the country is working to address its security challenges in close coordination with the United States, Syria still lacks an adequate central authority for issuing passports or civil documents and does not have appropriate screening and vetting measures. According to the Overstay Report, Syria had a B–1/B–2 visa overstay rate of 7.09 percent and a F, M, and J visa overstay rate of 9.34 percent.\n\n(ii) The entry into the United States of nationals of Syria as immigrants and nonimmigrants is hereby fully suspended.\n\n(h) Palestinian Authority Documents\n\n(i) Several United States-designated terrorist groups operate actively in the West Bank or Gaza Strip and have murdered American citizens. Also, the recent war in these areas likely resulted in compromised vetting and screening abilities. In light of these factors, and considering the weak or nonexistent control exercised over these areas by the PA, individuals attempting to travel on PA-issued or endorsed travel documents cannot currently be properly vetted and approved for entry into the United States.\n\n(ii) The entry into the United States of foreign nationals who seek to travel on any travel documents issued or endorsed by the PA, as immigrants and nonimmigrants, is hereby fully suspended.\n\nSec. 5. Partial Suspension of Entry for Nationals of Countries of Identified Concern. The entry into the United States of nationals of the following countries is hereby suspended and limited, as follows, subject to the categorical exceptions and case-by-case waivers described in section 6 of this proclamation:\n\n(a) Angola\n\n(i) According to the Overstay Report, Angola had a B–1/B–2 visa overstay rate of 14.43 percent and an F, M, and J visa overstay rate of 21.92 percent.\n\n(ii) The entry into the United States of nationals of Angola as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Angola to the extent permitted by law.\n\n(b) Antigua and Barbuda\n\n(i) Antigua and Barbuda has historically had CBI without residency.\n\n(ii) The entry into the United States of nationals of Antigua and Barbuda as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Antigua and Barbuda to the extent permitted by law.\n\n(c) Benin\n\n(i) According to the Overstay Report, Benin had a B–1/B–2 overstay rate of 12.34 percent and an F, M, and J visa overstay rate of 36.77 percent.\n\n(ii) The entry into the United States of nationals of Benin as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Benin to the extent permitted by law.\n\n(d) Cote d'Ivoire\n\n(i) According to the Overstay Report, Cote d'Ivoire had a B–1/B–2 visa overstay rate of 8.47 percent and an F, M, and J visa overstay rate of 19.09 percent.\n\n(ii) The entry into the United States of nationals of Cote d 'Ivoire as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Cote d 'Ivoire to the extent permitted by law.\n\n(e) Dominica\n\n(i) Dominica has historically had CBI without residency.\n\n(ii) The entry into the United States of nationals of Dominica as immigrants, and as nonimmigrants on B 1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Dominica to the extent permitted by law.\n\n(f) Gabon\n\n(i) According to the Overstay Report, Gabon had a B–1/B–2 visa overstay rate of 13.72 percent and an F, M, and J visa overstay rate of 17.77 percent.\n\n(ii) The entry into the United States of nationals of Gabon as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Gabon to the extent permitted by law.\n\n(g) The Gambia\n\n(i) According to the Overstay Report, The Gambia had a B–1/B–2 visa overstay rate of 12.70 percent and an F, M, and J visa overstay rate of 38.79 percent. Additionally, The Gambia has historically refused to accept back its removable nationals.\n\n(ii) The entry into the United States of nationals of The Gambia as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of The Gambia to the extent permitted by law.\n\n(h) Malawi\n\n(i) According to the Overstay Report, Malawi had a B 1/B–2 visa overstay rate of 22.45 percent and an F, M, and J visa overstay rate of 31.99 percent.\n\n(ii) The entry into the United States of nationals of Malawi as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Malawi to the extent permitted by law.\n\n(i) Mauritania\n\n(i) According to the Overstay Report, Mauritania had a B–1/B–2 visa overstay rate of 9.49 percent. According to the Department of State, the Government of Mauritania has little presence in certain parts of the country, which creates substantial screening and vetting difficulties.\n\n(ii) The entry into the United States of nationals of Mauritania as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Mauritania to the extent permitted by law.\n\n(j) Nigeria\n\n(i) Radical Islamic terrorist groups such as Boko Haram and the Islamic State operate freely in certain parts of Nigeria, which creates substantial screening and vetting difficulties. According to the Overstay Report, Nigeria had a B–1/B–2 visa overstay rate of 5.56 percent and an F, M, and J visa overstay rate of 11.90 percent.\n\n(ii) The entry into the United States of nationals of Nigeria as immigrants, and as nonimmigrants on B–1, B 2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Nigeria to the extent permitted by law.\n\n(k) Senegal\n\n(i) According to the Overstay Report, Senegal had a B–1/B–2 visa overstay rate of 4.30 percent and an F, M, and J visa overstay rate of 13.07 percent.\n\n(ii) The entry into the United States of nationals of Senegal as immigrants, and as nonimmigrants on B–1, B–2, B–1/B–2, F, M, and J visas, is hereby suspended.\n\n(iii) Consular officers shall reduce the validity for any other nonimmigrant visa issued to nationals of Senegal to the extent permitted by law.\n\n(l) Tanzania\n\n(i) According to the Overstay Report, Tanzania had a B–1/B–2 visa overstay rate of 8.30 percent and an F, M, and J visa overstay rate of 13.97 p","P5":"Extension of Temporary Duty Increases and Quantitative Limitations on the Importation Into the United States of Certain Stainless Steel and Alloy Tool Steel\n\nBy the President of the United States of America\n\nA Proclamation\n\n1. On July 5, 1983, pursuant to section 202(b)(1) of the Trade Act of 1974 (the Act) (19 U.S.C. 2252(b)(1)) and after taking into account the considerations specified in section 202(c) of the Act (19 U.S.C. 2252(c)) and the report and recommendations of the United States International Trade Commission (the Commission), I determined to impose additional tariffs and quantitative restrictions on imports of certain bars; wire rods; and plates, sheets and strips, not cut, not pressed, and not stamped to nonrectangular shape; all the foregoing of stainless steel or certain alloy tool steel; and round wire of high-speed tool steel, provided for in specified items of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202). By Proclamation 5074 of July 19, 1983, pursuant to sections 203(a)(1), 203(a)(3), and 203(e)(1) of the Act (19 U.S.C. 2253(a)(1), 2253(a)(3), and 2253(e)(1)), I provided import relief through the temporary imposition of increased tariffs and quantitative restrictions on certain stainless steel and alloy tool steel as set forth in the Annex to that Proclamation.\n\n2. Further, in Proclamation 5074 I directed the United States Trade Representative (USTR) to take such actions and perform such functions for the United States as may be necessary to administer and implement such relief, to negotiate orderly marketing agreements pursuant to section 203 of the Act (19 U.S.C. 2253), to modify such relief pursuant to section 203, and to make any changes in the headnote or TSUS items created in the Annex to that Proclamation that may be necessary to implement the foregoing authority. I also directed the USTR to conduct an annual review of the necessity for and effectiveness of such relief and to recommend any appropriate action under section 203(h)(4) of the Act (19 U.S.C. 2253(h)(4)).\n\n3. On September 18, 1984, I established a national policy for the steel industry and directed the USTR to coordinate and direct the implementation of that policy, including the negotiation of new arrangements with exporting countries and the reaffirmation of existing measures limiting steel exports into the United States. Supplemental authority to enforce the national policy for the steel industry was provided in Title VIII of the Trade and Tariff Act of 1984 (19 U.S.C. 2253 note).\n\n4. Pursuant to the above authority, the USTR concluded agreements with the European Community and 18 other exporting nations and made such modifications to the import relief proclaimed in Proclamation 5074 as were necessary to implement these agreements.\n\n5. I have now determined that the relief provided in Proclamation 5074, as subsequently modified, should be extended through September 30, 1989, as set forth in the Annex to this Proclamation. Finally, I have determined to continue the authority of the USTR under the national policy for the steel industry to take such actions as he determines necessary and appropriate to carry out that policy, including further actions with respect to articles subject to the relief set forth in the Annex to this Proclamation.\n\nNow, Therefore, I, Ronald Reagan, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes of the United States, including but not limited to sections 203 and 604 of the Act (19 U.S.C. 2253 and 2483), and in accordance with Article XIX of the General Agreement on Tariffs and Trade (GATT) (16 Stat. [pt. 5] A58; 8 UST [pt. 2] 1786), do proclaim that-\n\n(1) Part I of Schedule XX of the GATE is modified to conform to the action taken in the Annex to this Proclamation.\n\n(2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation.\n\n(3) The authority delegated to the USTR by Proclamation 5074 is hereby continued throughout the duration of the relief set forth in the Annex to this Proclamation.\n\n(4) The President's authority to prescribe regulations concerning any restriction proclaimed in Proclamation 5074 and continued by this Proclamation, or governing the entry or withdrawal from warehouse of articles covered by orderly marketing agreements negotiated thereunder or of like articles that are the product of countries not parties to any such agreement, previously delegated by Proclamation 5074 to the Secretary of the Treasury, shall continue to be exercised under the terms provided in such Proclamation for the duration of the relief provided herein.\n\n(5) The Secretary of the Treasury shall take such actions as the USTR shall determine are necessary to implement any import relief under this Proclamation, or modifications thereof.\n\n(6) Nothing in this Proclamation shall limit the authority delegated to the USTR pursuant to the national policy for the steel industry, including the authority to take such further action as he may determine to be necessary and appropriate to carry out that policy.\n\n(7) This Proclamation shall be effective with respect to articles entered, or withdrawn from warehouse for consumption, on or after July 20, 1987, and before the close of September 30, 1989, unless the period of its effectiveness is earlier expressly modified or terminated.\n\nIn Witness Whereof, I have hereunto set my hand this 16th day of July, in the year of our Lord nineteen hundred and eightyseven, and of the Independence of the United States of America the two hundred and twelfth.\n\nRONALD REAGAN","P30":"By the President of the United States of America\n\nA Proclamation\n\nWhereas, pursuant to section 2 of the act of July 1, 1954, as amended (72 Stat. 678), and section 232 of the Trade Expansion Act of 1962 (Public Law 87-794), findings and determinations have been made that adjustments in the imports of crude oil, unfinished oils, and finished products were necessary so that such imports would not threaten to impair the national security, such adjustments have been made by Proclamation 3279 (24 F.R. 1781) and modified by Proclamation 3290 (24 F.R. 3527), Proclamation 3328 (24 F.R. 10133), Proclamation 3386 (25 F.R. 13945), Proclamation 3389 (26 F.R. 507, 811), Proclamation 3509 (27 F.R. 11985), Proclamation 3531 (28 F.R. 4077), and Proclamation 3541 (28 F.R. 5931); and\n\nWhereas, I find and determine that, in order to prevent total imports from impairing accomplishment of the purposes of Proclamation 3279, as amended, it is necessary to impose restrictions on the movement of crude oil, unfinished oils, and finished products into foreign trade zones; and\n\nWhereas, I find and determine that for reasons of equity and competitive capability, there should be authority to include petrochemical plants within the system of allocation of imports; and\n\nWhereas, it appears that, as represented by the Government of the Commonwealth of Puerto Rico, the development of a petrochemical industry in Puerto Rico will provide a substantial and much needed increase in opportunities for employment of its citizens, I find and determine that provisions should be made permitting the development, without impairment of the objectives of Proclamation 3279, as amended, of such an industry in Puerto Rico:\n\nNow, Therefore, I, Lyndon B. Johnson, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and the statutes, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that:\n\nI. Paragraph (a) of section 1 of Proclamation 3279, as amended, is amended to read as follows:\n\n(a) In Districts I—IV, in District V, and in Puerto Rico, no crude oil, unfinished oils, or finished products may be entered for consumption or withdrawn from warehouse for consumption, and no foreign crude oil, unfinished oils, or finished products may be brought into a foreign trade zone in Districts I—IV or in District V for processing within the zone, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries, withdrawals, and shipments into foreign trade zones may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account of a department, establishment, or agency of the United States, which shall not be required to have such a license but which shall be subject to the provisions of paragraph (c) of this section, or (4) crude oil, unfinished oils, or finished products which are transported into the United States by pipeline, rail, or other means of overland transportation from the country where they were produced, which country, in the case of unfinished oils or finished products, is also the country of production of the crude oil from which they were processed or manufactured.\n\n2. Subparagraph (1) of paragraph (a) and paragraph (c) of section 2 of Proclamation 3279, as amended, are severally amended to read as follows:\n\n(a) (1) In Districts I—IV, for a particular allocation period the maximum level of imports, subject to allocation, of crude oil, unfinished oils, and finished products (other than residual fuel oil to be used as fuel) shall be an amount equal to the difference between (i) 12.2 percent of the quantity of crude oil and natural gas liquids which the Secretary estimates will be produced in these districts during the particular allocation period and (ii) the quantity of imports of crude oil, unfinished oils, and finished products excepted by clause (4) of paragraph (a) of section 1 which the Secretary estimates will be imported into these districts during that allocation period plus the quantity estimated by the Secretary by which shipments of unfinished oils and finished products (other than residual fuel oil to be used as fuel) from Puerto Rico to Districts I—IV during that allocation period will exceed the quantity so shipped during a comparable base period in the year 1965. As used in this subparagraph (1), the term \"natural gas liquids\" means natural gas products and other hydrocarbons such as isopentane, propane, and butane, or mixtures thereof, recovered from natural gas by means other than refining. Within such maximum level, imports of unfinished oils shall not exceed such per-centum of the permissible imports of crude oil and unfinished oils as the Secretary may determine and imports of finished products (other than residual fuel oil to be used as fuel) shall not exceed the level of imports of such products into these districts during the calendar year 1957.\n\n(c) The Secretary, having taken into account the standards prescribed for allocation of imports of crude oil and unfinished oils into Puerto Rico, any actions taken pursuant to section 4, and shipments from Puerto Rico into Districts I—IV, shall establish for each allocation period a maximum level of imports into Puerto Rico of crude oil and unfinished oils which, in his judgment, is consonant with the objectives of this proclamation. The maximum level of imports of finished products into Puerto Rico for a particular allocation period shall be approximately the level of such imports during all or part of the calendar year 1958 as determined by the Secretary to be consonant with the purposes of this proclamation or such higher level as the Secretary may determine is required to meet a demand in Puerto Rico for finished products that would not otherwise be met.\n\n3. Subparagraphs 1, 2, and 3 of paragraph (b) of section 3 of Proclamation 3279, as amended, are severally amended to read as follows:\n\n(b) (1) With respect to the allocation of imports of crude oil and unfinished oils into Districts I—IV and into District V, such regulations shall provide, to the extent possible, for a fair and equitable distribution among persons having refinery capacity in these districts in relation to refinery inputs (excluding inputs of crude oil or unfinished oils imported pursuant to clause (4) of paragraph (a) of Section 1). The Secretary may by regulation also provide for the making of such allocations to persons having petrochemical plants in these districts in relation to inputs to such plants (excluding inputs of crude oil or unfinished oils imported pursuant to clause (4) of paragraph (a) of section 1). Provision may be made in the regulations for the making of such allocations on the basis of graduated scales of inputs. Provision shall be made in the regulations for the gradual reduction of allocations made on the basis of the last allocations of imports of crude oil under the Voluntary Oil Import Program, except that provision shall be made for a more rapid reduction of those allocations based on allocations under the Voluntary Oil Import Program which reflected imports of crude oil in the category now covered by clause (4) of paragraph (a) of section 1.\n\n(2) Such regulations shall provide for the allocation of imports of crude oil and unfinished oils into Puerto Rico among persons having refinery capacity in Puerto Rico in the calendar year 1964 on the basis of estimated requirements, acceptable to the Secretary, of each such person for crude oil and unfinished oils. The regulations shall provide also that if, during a period comprising the same number of months as an allocation period and ending three months before the beginning of the allocation period, any such person ships to Districts I—IV unfinished oils or finished products (other than residual fuel oil to be used as fuel) or sells unfinished oils or finished products (other than residual fuel oil to be used as fuel) which are shipped to Districts I—IV in excess of the volume of unfinished oils or finished products (other than residual fuel oil to be used as fuel) which he so shipped or which he sold and were so shipped during the corresponding base period in the years 1964 and 1965 or in the year 1965, as the case may be, the person's allocation for the next allocation period shall be reduced by the amount of the excess. In addition the Secretary may provide by regulation for the making, in instances in which the Secretary determines that such action would not impair the accomplishment of the objectives of this proclamation, of allocations of imports of crude oil and unfinished oils into Puerto Rico to persons as feedstocks for facilities which will be established or for the operation of facilities which are established and which in the judgment of the Secretary will promote substantial expansion of employment in Puerto Rico through industrial development, and such regulations shall provide for the imposition of such conditions and restrictions upon such allocations as the Secretary may deem necessary to assure that any imports so allocated are used for the purposes for which an allocation is made and that the holder of such an allocation fulfills commitments made in connection with the making of the allocation.\n\n(3) Except for crude oil or unfinished oils imported pursuant to special relief granted pursuant to section 4, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that exchanges for domestic crude or unfinished oils may be made if otherwise lawful, if effected on a current basis and reported in advance to the Secretary, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant.\n\n4. Subparagraph (1) of paragraph (g) of section 9 of Proclamation 3279, as amended, is amended to read as follows:\n\n(g) (1) Liquefied gases—hydrocarbon gases such as ethane, propane, propylene, butylene, and butanes (but not methane) which are recovered from natural gas or produced in the refining of petroleum and which, to be maintained in a liquid state at ambient temperatures, must be kept under greater than atmospheric pressures;\n\n5. This amendatory proclamation shall become effective on January 1, 1966.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDONE at the City of Washington this tenth day of December in the year of our Lord nineteen hundred and sixty-five, and of the Independence of the United States of America the one hundred and ninetieth.\n\nLYNDON B. JOHNSON\n\nBy the President:\n\nGEORGE W. BALL\n\nActing Secretary of State","EO33":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.)(IEEPA), the National Emergencies Act (50 U.S.C. 1601 et seq.), and section 301 of title 3, United States Code,\n\nI, George W. Bush, President of the United States of America, find that the Government of Syria continues to engage in certain conduct that formed the basis for the national emergency declared in Executive Order 13338 of May 11, 2004, including but not limited to undermining efforts with respect to the stabilization of Iraq. I further find that the conduct of certain members of the Government of Syria and other persons contributing to public corruption related to Syria, including by misusing Syrian public assets or by misusing public authority, entrenches and enriches the Government of Syria and its supporters and thereby enables the Government of Syria to continue to engage in certain conduct that formed the basis for the national emergency declared in Executive Order 13338. In light of these findings, and to take additional steps with respect to the national emergency declared in Executive Order 13338 of May 11, 2004, I hereby order:\n\nSection 1. (a) Except to the extent provided in section 203(b)(1), (3), and (4) of IEEPA (50 U.S.C. 1702(b)(1), (3) and (4)), the Trade Sanctions Reform and Export Enhancement Act of 2000 (title IX, Public Law 106-387), or regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of this order, all property and interests in property that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of any United States person, including any overseas branch, of the following persons are blocked and may not be transferred, paid, exported, withdrawn, or otherwise dealt in: persons determined by the Secretary of the Treasury, after consultation with the Secretary of State, to be responsible for, to have engaged in, to have facilitated, or to have secured improper advantage as a result of, public corruption by senior officials within the Government of Syria.\n\n(b) The prohibitions in paragraph (a) of this section include, but are not limited to, (i) the making of any contribution or provision of funds, goods, or services by, to, or for the benefit of any person designated pursuant to this order, and (ii) the receipt of any contribution or provision of funds, goods, or services from any such person.\n\nSec. 2. Section 3(a)(iv) of Executive Order 13338 is hereby amended to read as follows:\n\n\"(iv)to be or to have been responsible for or otherwise significantly contributing to actions taken or decisions made by the Government of Syria that have the purpose or effect of undermining efforts to stabilize Iraq or of allowing the use of Syrian territory or facilities to undermine efforts to stabilize Iraq; or\".\n\nSec. 3. (a) Any transaction by a United States person or within the United States that evades or avoids, has the purpose of evading or avoiding, or attempts to violate any of the prohibitions set forth in this order is prohibited.\n\n(b) Any conspiracy formed to violate any of the prohibitions set forth in this order is prohibited.\n\nSec. 4. For purposes of this order:\n\n(a) the term \"person\" means any individual or entity;\n\n(b) the term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization; and\n\n(c) the term \"United States person\" means any United States citizen, permanent resident alien, entity organized under the laws of the United States or any jurisdiction within the United States (including foreign branches), or any person in the United States.\n\nSec. 5. I hereby determine that the making of donations of the type specified in section 203(b)(2) of IEEPA (50 U.S.C. 1702(b)(2)) by, to, or for the benefit of, persons whose property and interests in property are blocked pursuant to section 1 of this order would seriously impair my ability to deal with the national emergency declared in Executive Order 13338 and relied upon for additional steps taken in Executive Order 13399 of April 25, 2006, and I hereby prohibit such donations as provided by section 1 of this order.\n\nSec. 6. For those persons whose property and interests in property are blocked pursuant to section 1 of this order who might have a constitutional presence in the United States, I find that, because of the ability to transfer funds or other assets instantaneously, prior notice to such persons of measures to be taken pursuant to this order would render these measures ineffectual. I therefore determine that for these measures to be effective in addressing the national emergency declared in Executive Order 13338 and relied upon for additional steps taken in Executive Order 13399, there need be no prior notice of a determination made pursuant to this order.\n\nSec. 7. The Secretary of the Treasury, after consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to the President by IEEPA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government, consistent with applicable law. All executive agencies of the United States Government are hereby directed to take all appropriate measures within their authority to carry out the provisions of this order and, where appropriate, to advise the Secretary of the Treasury in a timely manner of the measures taken.\n\nSec. 8. Nothing in this order is intended to affect the continued effectiveness of any rules, regulations, orders, licenses, or other forms of administrative action issued, taken, or continued in effect heretofore or hereafter under 31 C.F.R. chapter V, except as expressly terminated, modified, or suspended by or pursuant to this order.\n\nSec. 9. This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, instrumentalities, or entities, its officers or employees, or any other person.\n\nGeorge W. Bush\n\nThe White House,\n\nFebruary 13, 2008.","EO20":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the International Emergency Economic Powers Act et seq.) the National Emergencies Act et seq.) and section 301 of title 3 of the United States Code,\n\nI, GEORGE BUSH, President of the United States of America, find that proliferation of chemical and biological weapons constitutes an unusual and extraordinary threat to the national security and foreign policy of the United States and hereby declare a national emergency to deal with that threat.\n\nAccordingly, I hereby order:\n\nSection 1. International Negotiations. It is the policy of the United States to lead and seek multilaterally coordinated efforts with other countries to control the proliferation of chemical and biological weapons. The Secretary of State shall accordingly ensure that the early achievement of a comprehensive global convention to prohibit the production and stockpiling of chemical weapons, with adequate provisions for verification, shall be a top priority of the foreign policy of the United States, and the Secretary of State shall cooperate in and lead multilateral efforts to stop the proliferation of chemical weapons.\n\nSec. 2. Imposition of Controls. As provided herein, the Secretary of State and the Secretary of Commerce shall use their authorities, including the Arms Export control Act and Executive Order No. 12730, respectively, to control any exports that either Secretary determines would assist a country in acquiring the capability to develop, produce, stockpile, deliver, or use chemical or biological weapons. The Secretary of State shall pursue early negotiations with foreign governments to adopt effective measures comparable to those imposed under this order.\n\nSec. 3.Department of Commerce Controls. (a) The Secretary of Commerce shall prohibit the export of any goods, technology, or services subject to his export jurisdiction that the Secretary of Commerce and the Secretary of State determine, in accordance with regulations issued pursuant to this order, would assist a foreign country in acquiring the capability to develop, produce, stockpile, deliver, or use chemical or biological weapons. The Secretary of Commerce and the Secretary of State shall develop an initial list of such goods, technology, and services within 90 days of this order. The Secretary of State shall pursue early negotiations with foreign governments to adopt effective measures comparable to those imposed under this section.\n\n(b) Subsection (a) will not apply to exports if their destination is a country with whose government the United States has entered into a bilateral or multilateral arrangement for the control of chemical or biological weapons-related goods (including delivery systems) and technology, or maintains domestic export controls comparable to controls that are imposed by the United States with respect to such goods and technology or that are otherwise deemed adequate by the Secretary of State.\n\n(c) The Secretary of Commerce shall require validated licenses to implement this order and shall coordinate any license applications with the Secretary of State and the Secretary of Defense.\n\nSec. 4 Sanctions Against Foreign Persons. (a) Sanctions shall be imposed on foreign persons with respect to chemical and biological weapons proliferation, as specified in subsections (b)(1) through (b)(5).\n\n(b)(1) Senctions shall be imposed on a foreign person if the Secretary of State determines that the foreign person on or after the effective date of this order knowingly and materially contributed to the efforts of a foreign country referred to in subsection (2) to use, develop, produce, stockpile, or otherwise acquire chemical or biological weapons.\n\n(2) The countries referred to in subsection (1) are those that the Secretary of State determines have either used chemical or biological weapons in violation of international law or have made substantial preparations to do so on or after the effective date of this order.\n\n(3) No department or agency of the United States Government may procure, or enter into any contract for the procurement of, any goods or services from any foreign person referred to in subsection (1). The Sectretary of the Treasury shall prohibit the importation into the United States of products produced by the foreign person.\n\n(4) Sanctions imposed pursuant to this section may be terminated or not imposed against foreign persons if the Secretary of State determines that there is reliable evidence that the foreign person concerned has ceased all activities referred to in subsection (1).\n\n(5) The Secretary of State and the Secretary of the Treasury may provide appropriate exemptions for procurement contracts necessary to meet U.S. operational military requirements or requirements under defense production agreements, sole source suppliers, spare parts, components, routine servicing and maintenance of products, and medical and humanitarian items. They may provide exemptions for contracts in existence on the date of this order under appropriate circumstances.\n\nSec. 5. Sanctions Against Foreign Countries. (a) Sanctions shall be imposed on foreign countries with respect to chemical and biological weapons proliferation, as specified in subsections (b) and (c).\n\n(b) The Secretary of State shall determine whether any foreign country has, on or after the effective date of this order, (1) used chemical or biological weapons in violation of international law; or (2) made substantial preparations to use chemical or biological weapons in violation of international law; or (3) developed, produced, or stockpiled chemical or biological weapons in violation of international law.\n\n(c) The following sanctions shall be imposed on any foreign country identified in subsection (b)(1) unless the Secretary of State determines that any individual sanction should not be applied due to significant foreign policy or national security reasons. The sanctions specified in this section may be made applicable to the countries identified in subsections (b)(2) or (b)(3) when the Secretary of State determines that such action will further the objectives of this order pertaining to proliferation. The sanctions specified in subsection (c)(2) below shall be imposed with the concurrence of the Secretary of the Treasury.\n\n(1) Foreign Assistance. No assistance shall be provided to that country under the Foreign Assistance Act of 1961 or the Arms Export Control Act other than assistance that is intended to benefit the people of that country directly and that is not channeled through governmental agencies or entities of that country.\n\n(2) Multilateral Development Bank Assistance. The United States shall oppose any loan or financial or technical assistance to that country by international financial institutions in accordance with section 701 of the International Financial Institutions Act\n\n(3) Denial of Credit or Other Financial Assistance. The United States shall deny to that country any credit or financial assistance by any department, agency, or instrumentality of the United States Government.\n\n(4) Prohibition on Arms Sales. The United States Government shall not, under the Arms Export Control Act, sell to that country any defense articles or defense services or issue any license for the export of items on the United States Munitions List.\n\n(5) Exports of National Security-Sensitive Goods and Technology. No exports shall be permitted of any goods or technologies controlled for national security reasons under Export Administration Regulations.\n\n(6) Further Export Restrictions. The Secretary of Commerce shall prohibit or otherwise substantially restrict exports to that country of goods, technology, and services (excluding agricultural commodities and products otherwise subject to control).\n\n(7) Import Restrictions. Restrictions shall be imposed on the importation into the United States of articles (which may include petroleum or any petroleum product) that are the growth, product, or manufacture of that country.\n\n(8) Landing Rights. At the earliest practicable date, the Secretary of State shall terminate, in a manner consistent with international law, the authority of any air carrier that is controlled in fact by the government of that country to engage in air transportation (as defined in section 101(10) of the Federal Aviation Act of 1958 (10)).\n\nSec. 6. Duration. Any sanctions imposed pursuant to section 4 or 5 shall remain in force until the Secretary of State determines that lifting any sanction is in the foreign policy or national security interests of the United States or, as to sanctions under section 4, until the Secretary has made the determination under section 4(b)(4).\n\nSec. 7. Implementation. The Secretary of State, the Secretary of the Treasury, and the Secretary of Commerce are hereby authorized and directed to take such actions, including the promulgation of rules and regulations, as may be necessary to carry out the purposes of this order. These actions, and in particular those in sections 4 and 5, shall be made in consultation with the Secretary of Defense and, as appropriate, other agency heads. The Secretary concerned may redelegate any of these functions to other officers in agencies of the Federal Government. All heads of departments and agencies of the United States Government are directed to take all appropriate measures within their authority to carry out the provisions of this order, including the suspension or termination of licenses or other authorization.\n\nSec. 8. Judicial Review. This order is not intended to create, nor does it create, any right or benefit, substantive or procedural, enforceable at law by a party against the United States, its agencies, officers, or any other person.\n\nSec. 9. Effective Date. This order is effective immediately.\n\nThis order shall be transmitted to the Congress and published in the Federal Register.\n\nGeorge Bush\n\nThe White House,\n\nNovember 16, 1990.","P38":"By the President of the United States of America A Proclamation\n\nThe current situation at the southern border presents a border security and humanitarian crisis that threatens core national security interests and constitutes a national emergency. The southern border is a major entry point for criminals, gang members, and illicit narcotics. The problem of large-scale unlawful migration through the southern border is long-standing, and despite the executive branch's exercise of existing statutory authorities, the situation has worsened in certain respects in recent years. In particular, recent years have seen sharp increases in the number of family units entering and seeking entry to the United States and an inability to provide detention space for many of these aliens while their removal proceedings are pending. If not detained, such aliens are often released into the country and are often difficult to remove from the United States because they fail to appear for hearings, do not comply with orders of removal, or are otherwise difficult to locate. In response to the directive in my April 4, 2018, memorandum and subsequent requests for support by the Secretary of Homeland Security, the Department of Defense has provided support and resources to the Department of Homeland Security at the southern border. Because of the gravity of the current emergency situation, it is necessary for the Armed Forces to provide additional support to address the crisis.\n\nNow, Therefore, I, Donald J. Trump, by the authority vested in me by the Constitution and the laws of the United States of America, including sections 201 and 301 of the National Emergencies Act (50 U.S.C. 1601 et seq.), hereby declare that a national emergency exists at the southern border of the United States, and that section 12302 of title 10, United States Code, is invoked and made available, according to its terms, to the Secretaries of the military departments concerned, subject to the direction of the Secretary of Defense in the case of the Secretaries of the Army, Navy, and Air Force. To provide additional authority to the Department of Defense to support the Federal Government's response to the emergency at the southern border, I hereby declare that this emergency requires use of the Armed Forces and, in accordance with section 301 of the National Emergencies Act (50 U.S.C. 1631), that the construction authority provided in section 2808 of title 10, United States Code, is invoked and made available, according to its terms, to the Secretary of Defense and, at the discretion of the Secretary of Defense, to the Secretaries of the military departments. I hereby direct as follows:\n\nSection 1. The Secretary of Defense, or the Secretary of each relevant military department, as appropriate and consistent with applicable law, shall order as many units or members of the Ready Reserve to active duty as the Secretary concerned, in the Secretary's discretion, determines to be appropriate to assist and support the activities of the Secretary of Homeland Security at the southern border.\n\nSec. 2. The Secretary of Defense, the Secretary of the Interior, the Secretary of Homeland Security, and, subject to the discretion of the Secretary of Defense, the Secretaries of the military departments, shall take all appropriate actions, consistent with applicable law, to use or support the use of the authorities herein invoked, including, if necessary, the transfer and acceptance of jurisdiction over border lands.\n\nSec. 3. This proclamation is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nIn Witness Whereof, I have hereunto set my hand this fifteenth day of February, in the year of our Lord two thousand nineteen, and of the Independence of the United States of A
