anding or assessing transnational threats that impact global security, including climate and other ecological change, public health risks, humanitarian threats, political instability, and geographic rivalry; (4) protecting against foreign military capabilities and activities; (5) protecting against terrorism, the taking of hostages, and the holding of individuals captive (including the identification, location, and rescue of hostages and captives) conducted by or on behalf of a foreign government, foreign organization, or foreign person; (6) protecting against espionage, sabotage, assassination, or other intelligence activities conducted by, on behalf of, or with the assistance of a foreign government, foreign organization, or foreign person; (7) protecting against threats from the development, possession, or proliferation of weapons of mass destruction or related technologies and threats conducted by, on behalf of, or with the assistance of a foreign government, foreign organization, or foreign person; (8) protecting against cybersecurity threats created or exploited by, or malicious cyber activities conducted by or on behalf of, a foreign government, foreign organization, or foreign person; (9) protecting against threats to the personnel of the United States or of its allies or partners; (10) protecting against transnational criminal threats, including illicit finance and sanctions evasion related to one or more of the other objectives identified in subsection (b)(i) of this section; (11) protecting the integrity of elections and political processes, government property, and United States infrastructure (both physical and electronic) from activities conducted by, on behalf of, or with the assistance of a foreign government, foreign organization, or foreign person; and (12) advancing collection or operational capabilities or activities in order to further a legitimate objective identified in subsection (b)(i) of this section. (B) The President may authorize updates to the list of objectives in light of new national security imperatives, such as new or heightened threats to the national security of the United States, for which the President determines that signals intelligence collection activities may be used. The Director of National Intelligence (Director) shall publicly release any updates to the list of objectives authorized by the President, unless the President determines that doing so would pose a risk to the national security of the United States. (ii) Prohibited objectives. (A) Signals intelligence collection activities shall not be conducted for the purpose of: (1) suppressing or burdening criticism, dissent, or the free expression of ideas or political opinions by individuals or the press; (2) suppressing or restricting legitimate privacy interests; (3) suppressing or restricting a right to legal counsel; or (4) disadvantaging persons based on their ethnicity, race, gender, gender identity, sexual orientation, or religion. (B) It is not a legitimate objective to collect foreign private commercial information or trade secrets to afford a competitive advantage to United States companies and United States business sectors commercially.","6":"The collection of such information is authorized only to protect the national security of the United States or of its allies or partners. (iii) Validation of signals intelligence collection priorities. (A) Under section 102A of the National Security Act of 1947, as amended (50 U.S.C. 3024), the Director must establish priorities for the Intelligence Community to ensure the timely and effective collection of national intelligence, including national intelligence collected through signals intelligence. The Director does this through the National Intelligence Priorities Framework (NIPF), which the Director maintains and presents to the President, through the Assistant to the President for National Security Affairs, on a regular basis. In order to ensure that signals intelligence collection activities are undertaken to advance legitimate objectives, before presenting the NIPF or any successor framework that identifies intelligence priorities to the President, the Director shall obtain from the Civil Liberties Protection Officer of the Office of the Director of National Intelligence (CLPO) an assessment as to whether, with regard to anticipated signals intelligence collection activities, each of the intelligence priorities identified in the NIPF or successor framework: (1) advances one or more of the legitimate objectives set forth in subsection (b)(i) of this section; (2) neither was designed nor is anticipated to result in signals intelligence collection in contravention of the prohibited objectives set forth in subsection (b)(ii) of this section; and (3) was established after appropriate consideration for the privacy and civil liberties of all persons, regardless of their nationality or wherever they might reside. (B) If the Director disagrees with any aspect of the CLPO's assessment with respect to any of the intelligence priorities identified in the NIPF or successor framework, the Director shall include the CLPO's assessment and the Director's views when presenting the NIPF to the President. (c) Privacy and civil liberties safeguards. The following safeguards shall fulfill the principles contained in subsections (a)(ii) and (a)(iii) of this section. (i) Collection of signals intelligence.","7":"(A) The United States shall conduct signals intelligence collection activities only following a determination that a specific signals intelligence collection activity, based on a reasonable assessment of all relevant factors, is necessary to advance a validated intelligence priority, although signals intelligence does not have to be the sole means available or used for advancing aspects of the validated intelligence priority; it could be used, for example, to ensure alternative pathways for validation or for maintaining reliable access to the same information. In determining whether to collect signals intelligence consistent with this principle, the United States—through an element of the Intelligence Community or through an interagency committee consisting in whole or in part of the heads of elements of the Intelligence Community, the heads of departments containing such elements, or their designees—shall consider the availability, feasibility, and appropriateness of other less intrusive sources and methods for collecting the information necessary to advance a validated intelligence priority, including from diplomatic and public sources, and shall prioritize such available, feasible, and appropriate alternatives to signals intelligence. (B) Signals intelligence collection activities shall be as tailored as feasible to advance a validated intelligence priority and, taking due account of relevant factors, not disproportionately impact privacy and civil liberties. Such factors may include, depending on the circumstances, the nature of the pursued objective; the feasible steps taken to limit the scope of the collection to the authorized purpose; the intrusiveness of the collection activity, including its duration; the probable contribution of the collection to the objective pursued; the reasonably foreseeable consequences to individuals, including unintended third parties; the nature and sensitivity of the data to be collected; and the safeguards afforded to the information collected. (C) For purposes of subsection (c)(i) of this section, the scope of a specific signals intelligence collection activity may include, for example, a specific line of effort or target, as appropriate. (ii) Bulk collection of signals intelligence. (A) Targeted collection shall be prioritized. The bulk collection of signals intelligence shall be authorized only based on a determination—by an element of the Intelligence Community or through an interagency committee consisting in whole or in part of the heads of elements of the Intelligence Community, the heads of departments containing such elements, or their designees—that the information necessary to advance a validated intelligence priority cannot reasonably be obtained by targeted collection. When it is determined to be necessary to engage in bulk collection in order to advance a validated intelligence priority, the element of the Intelligence Community shall apply reasonable methods and technical measures in order to limit the data collected to only what is necessary to advance a validated intelligence priority, while minimizing the collection of non-pertinent information. (B) Each element of the Intelligence Community that collects signals intelligence through bulk collection shall use such information only in pursuit of one or more of the following objectives: (1) protecting against terrorism, the taking of hostages, and the holding of individuals captive (including the identification, location, and rescue of hostages and captives) conducted by or on behalf of a foreign government, foreign organization, or foreign person; (2) protecting against espionage, sabotage, assassination, or other intelligence activities conducted by, on behalf of, or with the assistance of a foreign government, foreign organization, or foreign person; (3) protecting against threats from the development, possession, or proliferation of weapons of mass destruction or related technologies and threats conducted by, on behalf of, or with the assistance of a foreign government, foreign organization, or foreign person; (4) protecting against cybersecurity threats created or exploited by, or malicious cyber activities conducted by or on behalf of, a foreign government, foreign organization, or foreign person; (5) protecting against threats to the personnel of the United States or of its allies or partners; and (6) protecting against transnational criminal threats, including illicit finance and sanctions evasion related to one or more of the other objectives identified in subsection (c)(ii) of this section. (C) The President may authorize updates to the list of objectives in light of new national security imperatives, such as new or heightened threats to the national security of the United States, for which the President determines that bulk collection may be used. The Director shall publicly release any updates to the list of objectives authorized by the President, unless the President determines that doing so would pose a risk to the national security of the United States. (D) In order to minimize any impact on privacy and civil liberties, a targeted signals intelligence collection activity that temporarily uses data acquired without discriminants (for example, without specific identifiers or selection terms) shall be subject to the safeguards described in this subsection, unless such data is: (1) used only to support the initial technical phase of the targeted signals intelligence collection activity; (2) retained for only the short period of time required to complete this phase; and (3) thereafter deleted. (iii) Handling of personal information collected through signals intelligence. (A) Minimization.","8":"Each element of the Intelligence Community that handles personal information collected through signals intelligence shall establish and apply policies and procedures designed to minimize the dissemination and retention of personal information collected through signals intelligence. (1) Dissemination. Each element of the Intelligence Community that handles personal information collected through signals intelligence: (a) shall disseminate non-United States persons' personal information collected through signals intelligence only if it involves one or more of the comparable types of information that section 2.3 of Executive Order 12333 of December 4, 1981 (United States Intelligence Activities), as amended, states may be disseminated in the case of information concerning United States persons; (b) shall not disseminate personal information collected through signals intelligence solely because of a person's nationality or country of residence; (c) shall disseminate within the United States Government personal information collected through signals intelligence only if an authorized and appropriately trained individual has a reasonable belief that the personal information will be appropriately protected and that the recipient has a need to know the information;","9":"(d) shall take due account of the purpose of the dissemination, the nature and extent of the personal information being disseminated, and the potential for harmful impact on the person or persons concerned before disseminating personal information collected through signals intelligence to recipients outside the United States Government, including to a foreign government or international organization; and (e) shall not disseminate personal information collected through signals intelligence for the purpose of circumventing the provisions of this order. (2) Retention. Each element of the Intelligence Community that handles personal information collected through signals intelligence: (a) shall retain non-United States persons' personal information collected through signals intelligence only if the retention of comparable information concerning United States persons would be permitted under applicable law and shall subject such information to the same retention periods that would apply to comparable information concerning United States persons; (b) shall subject non-United States persons' personal information collected through signals intelligence for which no final retention determination has been made to the same temporary retention periods that would apply to comparable information concerning United States persons; and (c) shall delete non-United States persons' personal information collected through signals intelligence that may no longer be retained in the same manner that comparable information concerning United States persons would be deleted. (B) Data security and access. Each element of the Intelligence Community that handles personal information collected through signals intelligence: (1) shall process and store personal information collected through signals intelligence under conditions that provide appropriate protection and prevent access by unauthorized persons, consistent with the applicable safeguards for sensitive information contained in relevant Executive Orders, proclamations, other Presidential directives, Intelligence Community directives, and associated policies; (2) shall limit access to such personal information to authorized personnel who have a need to know the information to perform their mission and have received appropriate training on the requirements of applicable United States law, as described in policies and procedures issued under subsection (c)(iv) of this section; and","10":"(3) shall ensure that personal information collected through signals intelligence for which no final retention determination has been made is accessed only in order to make or support such a determination or to conduct authorized administrative, testing, development, security, or oversight functions. (C) Data quality. Each element of the Intelligence Community that handles personal information collected through signals intelligence shall include such personal information in intelligence products only as consistent with applicable Intelligence Community standards for accuracy and objectivity, with a focus on applying standards relating to the quality and reliability of the information, consideration of alternative sources of information and interpretations of data, and objectivity in performing analysis. (D) Queries of bulk collection. Each element of the Intelligence Community that conducts queries of unminimized signals intelligence obtained by bulk collection shall do so consistent with the permissible uses of signals intelligence obtained by bulk collection identified in subsection (c)(ii)(B) of this section and according to policies and procedures issued under subsection (c)(iv) of this section, which shall appropriately take into account the impact on the privacy and civil liberties of all persons, regardless of their nationality or wherever they might reside. (E) Documentation. In order to facilitate the oversight processes set forth in subsection (d) of this section and the redress mechanism set forth in section 3 of this order, each element of the Intelligence Community that engages in signals intelligence collection activities shall maintain documentation to the extent reasonable in light of the nature and type of collection at issue and the context in which it is collected. The content of any such documentation may vary based on the circumstances but shall, to the extent reasonable, provide the factual basis pursuant to which the element of the Intelligence Community, based on a reasonable assessment of all relevant factors, assesses that the signals intelligence collection activity is necessary to advance a validated intelligence priority. (iv) Update and publication of policies and procedures. The head of each element of the Intelligence Community: (A) shall continue to use the policies and procedures issued pursuant to Presidential Policy Directive 28 of January 17, 2014 (Signals Intelligence Activities) (PPD-28), until they are updated pursuant to subsection (c)(iv)(B) of this section; (B) shall, within 1 year of the date of this order, in consultation with the Attorney General, the CLPO, and the Privacy and Civil Liberties Oversight Board (PCLOB), update those policies and procedures as necessary to implement the privacy and civil liberties safeguards in this order; and (C) shall, within 1 year of the date of this order, release these policies and procedures publicly to the maximum extent possible, consistent with the protection of intelligence sources and methods, in order to enhance the public's understanding of, and to promote public trust in, the safeguards pursuant to which the United States conducts signals intelligence activities. (v) Review by the PCLOB. (A) Nature of review. Consistent with applicable law, the PCLOB is encouraged to conduct a review of the updated policies and procedures described in subsection (c)(iv)(B) of this section once they have been issued to ensure that they are consistent with the enhanced safeguards contained in this order. (B) Consideration of review.","11":"Within 180 days of completion of any review by the PCLOB described in subsection (c)(v)(A) of this section, the head of each element of the Intelligence Community shall carefully consider and shall implement or otherwise address all recommendations contained in such review, consistent with applicable law. (d) Subjecting signals intelligence activities to rigorous oversight. The actions directed in this subsection are designed to build on the oversight mechanisms that elements of the Intelligence Community already have in place, in order to further ensure that signals intelligence activities are subjected to rigorous oversight. (i) Legal, oversight, and compliance officials. Each element of the Intelligence Community that collects signals intelligence: (A) shall have in place senior-level legal, oversight, and compliance officials who conduct periodic oversight of signals intelligence activities, including an Inspector General, a Privacy and Civil Liberties Officer, and an officer or officers in a designated compliance role with the authority to conduct oversight of and ensure compliance with applicable United States law;","12":"(B) shall provide such legal, oversight, and compliance officials access to all information pertinent to carrying out their oversight responsibilities under this subsection, consistent with the protection of intelligence sources or methods, including their oversight responsibilities to ensure that any appropriate actions are taken to remediate an incident of non-compliance with applicable United States law; and (C) shall not take any actions designed to impede or improperly influence such legal, oversight, and compliance officials in carrying out their oversight responsibilities under this subsection. (ii) Training. Each element of the Intelligence Community shall maintain appropriate training requirements to ensure that all employees with access to signals intelligence know and understand the requirements of this order and the policies and procedures for reporting and remediating incidents of non-compliance with applicable United States law. (iii) Significant incidents of non-compliance.","13":"(A) Each element of the Intelligence Community shall ensure that, if a legal, oversight, or compliance official, as described in subsection (d)(i) of this section, or any other employee, identifies a significant incident of non-compliance with applicable United States law, the incident is reported promptly to the head of the element of the Intelligence Community, the head of the executive department or agency (agency) containing the element of the Intelligence Community (to the extent relevant), and the Director.","14":"(B) Upon receipt of such report, the head of the element of the Intelligence Community, the head of the agency containing the element of the Intelligence Community (to the extent relevant), and the Director shall ensure that any necessary actions are taken to remediate and prevent the recurrence of the significant incident of non-compliance. (e) Savings clause. Provided the signals intelligence collection is conducted consistent with and in the manner prescribed by this section of this order, this order does not limit any signals intelligence collection technique authorized under the National Security Act of 1947, as amended (50 U.S.C. 3001 et seq.), the Foreign Intelligence Surveillance Act of 1978, as amended (50 U.S.C. 1801 et seq.) (FISA), Executive Order 12333, or other applicable law or Presidential directive. Sec. 3. Signals Intelligence Redress Mechanism. (a) Purpose. This section establishes a redress mechanism to review qualifying complaints transmitted by the appropriate public authority in a qualifying state concerning United States signals intelligence activities for any covered violation of United States law and, if necessary, appropriate remediation. (b) Process for submission of qualifying complaints.","15":"Within 60 days of the date of this order, the Director, in consultation with the Attorney General and the heads of elements of the Intelligence Community that collect or handle personal information collected through signals intelligence, shall establish a process for the submission of qualifying complaints transmitted by the appropriate public authority in a qualifying state. (c) Initial investigation of qualifying complaints by the CLPO. (i) Establishment.","16":"The Director, in consultation with the Attorney General, shall establish a process that authorizes the CLPO to investigate, review, and, as necessary, order appropriate remediation for qualifying complaints.","17":"This process shall govern how the CLPO will review qualifying complaints in a manner that protects classified or otherwise privileged or protected information and shall ensure, at a minimum, that for each qualifying complaint the CLPO shall: (A) review information necessary to investigate the qualifying complaint; (B) exercise its statutory and delegated authority to determine whether there was a covered violation by: (i) taking into account both relevant national security interests and applicable privacy protections; (ii) giving appropriate deference to any relevant determinations made by national security officials; and (iii) applying the law impartially; (C) determine the appropriate remediation for any covered violation;","18":"(D) provide a classified report on information indicating a violation of any authority subject to the oversight of the Foreign Intelligence Surveillance Court (FISC) to the Assistant Attorney General for National Security, who shall report violations to the FISC in accordance with its rules of procedure; (E) after the review is completed, inform the complainant, through the appropriate public authority in a qualifying state and without confirming or denying that the complainant was subject to United States signals intelligence activities, that: (1) \"the review either did not identify any covered violations or the Civil Liberties Protection Officer of the Office of the Director of National Intelligence issued a determination requiring appropriate remediation\"; (2) the complainant or an element of the Intelligence Community may, as prescribed in the regulations issued by the Attorney General pursuant to section 3(d)(i) of this order, apply for review of the CLPO's determinations by the Data Protection Review Court described in subsection (d) of this section; and (3) if either the complainant or an element of the Intelligence Community applies for review by the Data Protection Review Court, a special advocate will be selected by the Data Protection Review Court to advocate regarding the complainant's interest in the matter; (F) maintain appropriate documentation of its review of the qualifying complaint and produce a classified decision explaining the basis for its factual findings, determination with respect to whether a covered violation occurred, and determination of the appropriate remediation in the event there was such a violation, consistent with its statutory and delegated authority; (G) prepare a classified ex parte record of review, which shall consist of the appropriate documentation of its review of the qualifying complaint and the classified decision described in subsection (c)(i)(F) of this section; and (H) provide any necessary support to the Data Protection Review Court. (ii) Binding effect. Each element of the Intelligence Community, and each agency containing an element of the Intelligence Community, shall comply with any determination by the CLPO to undertake appropriate remediation pursuant to subsection (c)(i)(C) of this section, subject to any contrary determination by the Data Protection Review Court. (iii) Assistance.","19":"Each element of the Intelligence Community shall provide the CLPO with access to information necessary to conduct the reviews described in subsection (c)(i) of this section, consistent with the protection of intelligence sources and methods, and shall not take any actions designed to impede or improperly influence the CLPO's reviews. Privacy and civil liberties officials within elements of the Intelligence Community shall also support the CLPO as it performs the reviews described in subsection (c)(i) of this section. (iv) Independence. The Director shall not interfere with a review by the CLPO of a qualifying complaint under subsection (c)(i) of this section; nor shall the Director remove the CLPO for any actions taken pursuant to this order, except for instances of misconduct, malfeasance, breach of security, neglect of duty, or incapacity. (d) Data Protection Review Court. (i) Establishment.","20":"The Attorney General is authorized to and","21":"shall establish a process to review determinations made by the CLPO under subsection (c)(i) of this section. In exercising that authority, the Attorney General shall, within 60 days of the date of this order, promulgate regulations establishing a Data Protection Review Court to exercise the Attorney General's authority to review such determinations. These regulations shall, at a minimum, provide that: (A) The Attorney General, in consultation with the Secretary of Commerce, the Director, and the PCLOB, shall appoint individuals to serve as judges on the Data Protection Review Court, who shall be legal practitioners with appropriate experience in the fields of data privacy and national security law, giving weight to individuals with prior judicial experience, and who shall not be, at the time of their initial appointment, employees of the United States Government. During their term of appointment on the Data Protection Review Court, such judges shall not have any official duties or employment within the United States Government other than their official duties and employment as judges on the Data Protection Review Court. (B) Upon receipt of an application for review filed by the complainant or an element of the Intelligence Community of a determination made by the CLPO under subsection (c) of this section, a three-judge panel of the Data Protection Review Court shall be convened to review the application. Service on the Data Protection Review Court panel shall require that the judge hold the requisite security clearances to access classified national security information. (C) Upon being convened, the Data Protection Review Court panel shall select a special advocate through procedures prescribed in the Attorney General's regulations. The"},"EO34":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows: Section 1. Policy. The United States must protect our citizens, critical infrastructure, military forces, and economy against outbreaks of emerging infectious diseases and chemical, biological, radiological, and nuclear (CBRN) threats. To achieve this, the United States must have a strong Public Health Industrial Base with resilient domestic supply chains for Essential Medicines, Medical Countermeasures, and Critical Inputs deemed necessary for the United States. These domestic supply chains must be capable of meeting national security requirements for responding to threats arising from CBRN threats and public health emergencies, including emerging infectious diseases such as COVID-19. It is critical that we reduce our dependence on foreign manufacturers for Essential Medicines, Medical Countermeasures, and Critical Inputs to ensure sufficient and reliable long-term domestic production of these products, to minimize potential shortages, and to mobilize our Nation's Public Health Industrial Base to respond to these threats. It is therefore the policy of the United States to: (a) accelerate the development of cost-effective and efficient domestic production of Essential Medicines and Medical Countermeasures and have adequate redundancy built into the domestic supply chain for Essential Medicines, Medical Countermeasures, and Critical Inputs; (b) ensure long-term demand for Essential Medicines, Medical Countermeasures, and Critical Inputs that are produced in the United States; (c) create, maintain, and maximize domestic production capabilities for Critical Inputs, Finished Drug Products, and Finished Devices that are essential to protect public safety and human health and to provide for the national defense; and (d) combat the trafficking of counterfeit Essential Medicines, Medical Countermeasures, and Critical Inputs over e commerce platforms and from third-party online sellers involved in the government procurement process.","2":"I am therefore directing each executive department and agency involved in the procurement of Essential Medicines, Medical Countermeasures, and Critical Inputs (agency) to consider a variety of actions to increase their domestic procurement of Essential Medicines, Medical Countermeasures, and Critical Inputs, and to identify vulnerabilities in our Nation's supply chains for these products. Under this order, agencies will have the necessary flexibility to increase their domestic procurement in appropriate and responsible ways, while protecting our Nation's service members, veterans, and their families from increases in drug prices and without interfering with our Nation's ability to respond to the spread of COVID-19. Sec. 2. Maximizing Domestic Production in Procurement. (a) Agencies shall, as appropriate, to the maximum extent permitted by applicable law, and in consultation with the Commissioner of Food and Drugs (FDA Commissioner) with respect to Critical Inputs, use their respective authorities under section 2304(c) of title 10, United States Code; section 3304(a) of title 41, United States Code; and subpart 6.3 of the Federal Acquisition Regulation, title 48, Code of Federal Regulations, to conduct the procurement of Essential Medicines, Medical Countermeasures, and Critical Inputs by: (i) using procedures to limit competition to only those Essential Medicines, Medical Countermeasures, and Critical Inputs that are produced in the United States; and (ii) dividing procurement requirements among two or more manufacturers located in the United States, as appropriate. (b) Within 90 days of the date of this order, the Director of the Office of Management and Budget (OMB), in consultation with appropriate agency heads, shall: (i) review the authority of each agency to limit the online procurement of Essential Medicines and Medical Countermeasures to e-commerce platforms that have: (A) adopted, and certified their compliance with, the applicable best practices published by the Department of Homeland Security in its Report to the President on \"Combating Trafficking in Counterfeit and Pirated Goods,\" dated January 24, 2020; and (B) agreed to permit the Department of Homeland Security's National Intellectual Property Rights Coordination Center to evaluate and confirm their compliance with such best practices; and (ii) report its findings to the President.","3":"(c) Within 90 days of the date of this order, the head of each agency shall, in consultation with the FDA Commissioner, develop and implement procurement strategies, including long-term contracts, consistent with law, to strengthen and mobilize the Public Health Industrial Base in order to increase the manufacture of Essential Medicines, Medical Countermeasures, and Critical Inputs in the United States.","4":"(d) No later than 30 days after the FDA Commissioner has identified, pursuant to section 3(c) of this order, the initial list of Essential Medicines, Medical Countermeasures, and Critical Inputs, the United States Trade Representative shall, to the extent permitted by law, take all appropriate action to modify United States Federal procurement product coverage under all relevant Free Trade Agreements and the World Trade Organization Agreement on Government Procurement to exclude coverage of Essential Medicines, Medical Countermeasures, and Critical Inputs. The United States Trade Representative shall further modify United States Federal procurement product coverage, as appropriate, to reflect updates by the FDA Commissioner.","5":"After the modifications to United States Federal procurement coverage take effect, the United States Trade Representative shall make any necessary, corresponding modifications of existing waivers under section 301 of the Trade Agreements Act of 1979. The United States Trade Representative shall notify the President, through the Director of OMB, once it has taken the actions described in this subsection. (e) No later than 60 days after the FDA Commissioner has identified, pursuant to section 3(c) of this order, the initial list of Essential Medicines, Medical Countermeasures, and Critical Inputs, and notwithstanding the public interest exception in subsection (f)(i)(1) of this section, the Secretary of Defense shall, to the maximum extent permitted by applicable law, use his authority under section 225.872-1(c) of the Defense Federal Acquisition Regulation Supplement to restrict the procurement of Essential Medicines, Medical Countermeasures, and Critical Inputs to domestic sources and to reject otherwise acceptable offers of such products from sources in Qualifying Countries in instances where considered necessary for national defense reasons. (f) Subsections (a), (d), and (e) of this section shall not apply: (i) where the head of the agency determines in writing, with respect to a specific contract or order, that (1) their application would be inconsistent with the public interest; (2) the relevant Essential Medicines, Medical Countermeasures, and Critical Inputs are not produced in the United States in sufficient and reasonably available commercial quantities and of a satisfactory quality; or (3) their application would cause the cost of the procurement to increase by more than 25 percent, unless applicable law requires a higher percentage, in which case such higher percentage shall apply; (ii) with respect to the procurement of items that are necessary to respond to any public health emergency declared under section 319 of the Public Health Service Act (42 U.S.C. 247d), any major disaster or emergency declared under the Stafford Disaster Relief and Emergency Assistance Act (42 U.S.C. 5121 et seq.), or any national emergency declared under the National Emergencies Act (50 U.S.C. 1601 et seq.). (g) To the maximum extent permitted by law, any public interest determination made pursuant to section 2(f)(i)(1) of this order shall be construed to maximize the procurement and use of Essential Medicines and Medical Countermeasures produced in the United States.","6":"(h) The head of an agency who makes any determination pursuant to section 2(f)(i) of this order shall submit an annual report to the President, through the Director of OMB and the Assistant to the President for Trade and Manufacturing Policy, describing the justification for each such determination. Sec. 3. Identifying Vulnerabilities in Supply Chains.","7":"(a) Within 180 days of the date of this order, the Secretary of Health and Human Services, through the FDA Commissioner and in consultation with the Director of OMB, shall take all necessary and appropriate action, consistent with law, to identify vulnerabilities in the supply chain for Essential Medicines, Medical Countermeasures, and Critical Inputs and to mitigate those vulnerabilities, including by: (i) considering proposing regulations or revising guidance on the collection of the following information from manufacturers of Essential Medicines and Medical Countermeasures as part of the application and regulatory approval process: (A) the sources of Finished Drug Products, Finished Devices, and Critical Inputs; (B) the use of any scarce Critical Inputs; and (C) the date of the last FDA inspection of the manufacturer's regulated facilities and the results of such inspection; (ii) entering into written agreements, pursuant to section 20.85 of title 21, Code of Federal Regulations, with the National Security Council, Department of State, Department of Defense, Department of Veterans Affairs, and other interested agencies, as appropriate, to disclose records regarding the security and vulnerabilities of the supply chains for Essential Medicines, Medical Countermeasures, and Critical Inputs; (iii) recommending to the President any changes in applicable law that may be necessary to accomplish the objectives of this subsection; and (iv) reviewing FDA regulations to determine whether any of those regulations may be a barrier to domestic production of Essential Medicines, Medical Countermeasures, and Critical Inputs, and by advising the President whether such regulations should be repealed or amended.","8":"(b) The Secretary of Health and Human Services, through the FDA Commissioner, shall take all appropriate action, consistent with applicable law, to: (i) accelerate FDA approval or clearance, as appropriate, for domestic producers of Essential Medicines, Medical Countermeasures, and Critical Inputs, including those needed for infectious disease and CBRN threat preparedness and response; (ii) issue guidance with recommendations regarding the development of Advanced Manufacturing techniques; (iii) negotiate with countries to increase site inspections and increase the number of unannounced inspections of regulated facilities manufacturing Essential Medicines, Medical Countermeasures, and Critical Inputs; and (iv) refuse admission, as appropriate, to imports of Essential Medicines, Medical Countermeasures, and Critical Inputs if the facilities in which they are produced refuse or unreasonably delay an inspection. (c) Within 90 days of the date of this order, and periodically updated as appropriate, the FDA Commissioner, in consultation with the Director of OMB, the Assistant Secretary for Preparedness and Response in the Department of Health and Human Services, the Assistant to the President for Economic Policy, and the Director of the Office of Trade and Manufacturing Policy, shall identify the list of Essential Medicines, Medical Countermeasures, and their Critical Inputs that are medically necessary to have available at all times in an amount adequate to serve patient needs and in the appropriate dosage forms. (d) Within 180 days of the date of this order, the Secretary of Defense, in consultation with the Director of OMB, shall take all necessary and appropriate action, consistent with law, to identify vulnerabilities in the supply chain for Essential Medicines, Medical Countermeasures, and Critical Inputs necessary to meet the unique needs of the United States Armed Forces and to mitigate the vulnerabilities identified in subsection (a) of this section.","9":"The Secretary of Defense shall provide to the Secretary of Health and Human Services, the FDA Commissioner, the Director of OMB, and the Director of the Office of Trade and Manufacturing Policy a list of defense-specific Essential Medicines, Medical Countermeasures, and Critical Inputs that are medically necessary to have available for defense use in adequate amounts and in appropriate dosage forms. The Secretary of Defense shall, as appropriate, periodically update this list. Sec. 4. Streamlining Regulatory Requirements.","10":"Consistent with law, the Administrator of the Environmental Protection Agency shall take all appropriate action to identify relevant requirements and guidance documents that can be streamlined to provide for the development of Advanced Manufacturing facilities and the expeditious domestic production of Critical Inputs, including by accelerating siting and permitting approvals. Sec. 5. Priorities and Allocation of Essential Medicines, Medical Countermeasures, and Critical Inputs. The Secretary of Health and Human Services shall, as appropriate and in accordance with the delegation of authority under Executive Order 13603 of March 16, 2012 (National Defense Resources Preparedness), use the authority under section 101 of the Defense Production Act of 1950, as amended (50 U.S.C. 4511), to prioritize the performance of Federal Government contracts or orders for Essential Medicines, Medical Countermeasures, or Critical Inputs over performance of any other contracts or orders, and to allocate such materials, services, and facilities as the Secretary deems necessary or appropriate to promote the national defense. Sec. 6. Reporting.","11":"(a) No later than December 15, 2021, and annually thereafter, the head of each agency shall submit a report to the President, through the Director of OMB and the Assistant to the President for Trade and Manufacturing Policy, detailing, for the preceding three fiscal years: (i) the Essential Medicines, Medical Countermeasures, and Critical Inputs procured by the agency; (ii) the agency's annual itemized and aggregated expenditures for all Essential Medicines, Medical Countermeasures, and Critical Inputs; (iii) the sources of these products and inputs; and (iv) the agency's plan to support domestic production of such products and inputs in the next fiscal year.","12":"(b) Within 180 days of the date of this order, the Secretary of Commerce shall submit a report to the Director of OMB, the Assistant to the President for National Security Affairs, the Director of the National Economic Council, and the Director of the Office of Trade and Manufacturing Policy, describing any change in the status of the Public Health Industrial Base and recommending initiatives to strengthen the Public Health Industrial Base."},"M12":{"1":"Having considered the determinations of both groups of commissioners with regard to tin mill products, tool steel, stainless steel wire, and stainless steel fittings, I have determined, pursuant to section 330(d)(1) of the Tariff Act of 1930, as amended, to consider the determinations of the groups of commissioners voting in the affirmative with regard to tin mill products and stainless steel wire to be the determination of the ITC, and the determinations of the groups of commissioners voting in the negative with regard to tool steel and stainless steel fittings to be the determination of the ITC. By Proclamation signed today (the \"Proclamation\") and after considering all relevant aspects of the investigation, including the factors set forth in section 203(a)(2) of the Trade Act and the supplemental report, I have implemented actions of a type described in section 203(a)(3).","2":"I have determined that the most appropriate actions are safeguard measures in the form of an increase in duties on imports of certain flat steel, other than slabs (including plate, hot-rolled steel, cold-rolled steel, and coated steel), hot-rolled bar, cold- finished bar, rebar, certain welded tubular products, carbon and alloy fittings, stainless steel bar, stainless steel rod, tin mill products, and stainless steel wire, as defined in paragraph 7 of the Proclamation, and in the form of a tariff rate quota (TRQ) on imports of slabs, with an increase in currently scheduled rates of duties for imports over the TRQ limits. I have implemented these safeguard measures for a period of 3 years plus 1 day. Specifically, I have established the following safeguard measures: (a) certain flat steel: with regard to slabs, a TRQ of 4.90 million metric tons in the first year of the measure, 5.35 million metric tons in the second year, and 5.81 million metric tons in the third year, with no increase in duties for imports below the within-quota level and an increase in duties of 30% ad valorem for imports above the within-quota level in the first year of the measure, 24% in the second year, and 18% in the third year; and with regard to certain flat steel, other than slab (including plate, hot-rolled steel, cold-rolled steel and coated steel), an increase in duties of 30% ad valorem in the first year, 24% in the second year, and 18% in the third year; (b) hot-rolled bar: an increase in duties of 30% ad valorem in the first year of the measure, 24% in the second year, and 18% in the third year; (c) cold-finished bar: a increase in duties of 30% ad valorem in the first year of the measure, 24% in the second year, and 18% in the third year; (d) rebar: an increase in duties of 15% ad valorem in the first year of the measure, 12% in the second year, and 9% in the third year; (e) certain welded tubular products: an increase in duties of 15% ad valorem in the first year of the measure, 12% in the second year, and 9% in the third year; (f) carbon and alloy fittings: an increase in duties of 13% ad valorem in the first year of the measure, 10% in the second year, and 7% in the third year; (g) stainless steel bar: an increase in duties of 15% ad valorem in the first year of the measure, 12% in the second year, and 9% in the third year; (h) stainless steel rod: an increase in duties of 15% ad valorem in the first year of the measure, 12% in the second year, and 9% in the third year; (i) tin mill products: an increase in duties of 30% ad valorem in the first year of the measure, 24% in the second year, and 18% in the third year; and (j) stainless steel wire: an increase in duties of 8% ad valorem in the first year of the measure, 7% in the second year, and 6% in the third year.","3":"Pursuant to section 312(a) of the NAFTA Implementation Act, after consideration of the report and supplemental reports of the ITC, I further determine that imports of certain flat steel, hot-rolled bar, cold-finished bar, rebar, certain tubular products, carbon and alloy fittings, stainless steel bar, stainless steel rod, tin mill products, and stainless steel wire that are products of Canada and Mexico either do not account for a substantial share of total imports of these products, or are not contributing importantly to serious injury or the threat of serious injury. Therefore, pursuant to section 312(b) of the NAFTA Implementation Act, the safeguard measure will not apply to imports of certain flat steel, hot-rolled bar, cold-finished bar, rebar, certain tubular products, carbon and alloy fittings, stainless steel bar, stainless steel rod, tin mill products, and stainless steel wire that are the product of Canada or Mexico. Similarly, the safeguard measures will not apply to imports of these products that are the product of Israel or Jordan. The safeguard measures also will not apply to imports of certain flat steel, tin mill products, hot-rolled bar, cold-finished bar, rebar, certain tubular products, carbon and alloy fittings, stainless steel bar, stainless steel rod, or stainless steel wire that are the product of a developing country that is a member of the World Trade Organization (WTO), as long as that country's share of imports into the United States of the product, based on a recent representative period, does not exceed 3 percent, provided that all such developing country WTO members collectively account for not more than 9 percent of total imports of that product.","4":"For purposes of the safeguard measures established under the Proclamation, I determine that the beneficiary countries under the Generalized System of Preferences are developing countries. Subdivision (d)(i) of U.S. Note 11 to subchapter III of chapter 99 of the Harmonized Tariff Schedule of the United States (Note 11) in the Annex to the Proclamation identifies those developing countries that are WTO members, and subdivision (d)(ii) identifies the products of such countries to which the safeguard measures shall not apply. I instruct the USTR to review data on imports of products listed in paragraph 7 of the Proclamation from countries listed in subdivision (d)(i) of Note 11 on a quarterly basis. If imports of such a product from such a country increase by a material amount, I instruct the USTR to initiate consultations with the country regarding the circumstances under which the increase occurred and whether the country plans to take action to reduce imports to historical levels.","5":"If, on the basis of the information exchanged during consultations, data on imports, domestic steel demand, growth in the U.S. economy, shifts in other countries' trade patterns, and any other relevant factors, the USTR determines that the increase in imports of such product from such country undermines the effectiveness of the pertinent safeguard measure, he is authorized, upon publication of a notice of such determination in the Federal Register, to modify subdivision (d)(ii) of Note 11 in the Annex to the Proclamation to include such product from such country. I also authorize the USTR, upon publication of a notice in the Federal Register, to change the list of developing countries to which the safeguard measures do not apply. The steel products listed in clauses (i) through (ix) of subdivision (b) of Note 11 in the Annex to the Proclamation were excluded from the determinations of the ITC described in paragraph 2 of that Proclamation, and are excluded from these safeguard measures. I have also determined to exclude from these safeguard measures the steel products listed in the subsequent clauses of subdivision (b) of Note 11 in the Annex to the Proclamation. The Trade Policy Staff Committee (TPSC) is currently evaluating requests, submitted in response to 66 Fed. Reg. 54321, 54322- 54323 (October 26, 2001), that particular products be excluded from any safeguard measure with regard to certain steel products. I instruct the USTR to determine whether these particular products should be excluded and, if so, within 120 days of the date of the Proclamation, to publish in the Federal Register a notice to modify subchapter III of chapter 99 to exclude them from the safeguard measures. In making this determination, the USTR shall consider any advice rendered by the TPSC. Similarly, I instruct the USTR, after receiving advice from the TPSC, to determine whether any particular products should be added to the list of those excluded from the safeguard measures and, if so, to publish a notice in the Federal Register in March of any year in which he receives such a recommendation to modify subchapter III of chapter 99 to exclude such particular products from the measures. I further instruct the USTR, no later than 90 days from today, to publish in the Federal Register a notice of the procedures by which interested persons may request the TPSC to recommend whether to exclude a particular product. I also instruct the USTR, prior to the effective date of the safeguard measures established in the Proclamation, to conduct consultations under Article 12.3 of the Agreement on Safeguards with any WTO member having a substantial interest as an exporter of a product subject to such safeguard measures, provided that the WTO member requests such consultations in a timely fashion. I instruct the USTR to report to me on the results of such consultations. I instruct the Secretary of the Treasury, pursuant to section 505(a) of the Tariff Act of 1930 (19 U.S.C. 1505(a)), to prescribe by regulation a date no later than 45 days after today at which estimated duties for merchandise entered, or withdrawn from warehouse for consumption, on or after 12:01 a.m., EST, March 20, 2002, and up to the 30th day after today, shall be deposited. I instruct the Secretary of the Treasury and the Secretary of Commerce to establish a system of import licensing to facilitate the monitoring of imports of certain steel products. Pursuant to the authority granted me by section 203(g) of the Trade Act to provide for the efficient and fair administration of all actions taken for the purpose of providing import relief under section 203, I further instruct the Secretary of Commerce, within 120 days of the effective date of the safeguard measures established by the Proclamation, to publish regulations in the Federal Register establishing such a system of import licensing.","6":"I have determined that the safeguard measures will facilitate efforts by the domestic industries to make a positive adjustment to import competition and will provide greater economic and social benefits than costs.","7":"If I determine that further action is appropriate and feasible to facilitate efforts by the pertinent domestic industry to make a positive adjustment to import competition and to provide greater economic and social benefits than costs,","8":"or if I determine that the conditions under section 204(b)(1) of the Trade Act are met, I shall reduce, modify, or terminate the safeguard measures. In making this determination, I shall consider the pertinent factors set out in section 203(a)(2) of the Trade Act and, in particular, changes in capital and labor productivity in the domestic industries; actual and planned permanent closures of inefficient steel production facilities in the United States and in other countries; consolidation of United States steel producers; capital expenditures in the domestic industries; prices for certain steel products in the United States; and the overall effect that maintaining the measure will have on consuming industries, workers, and the United States economy as a whole."},"EO25":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including sections 3301 and 3302 of title 5, United States Code, and section 301 of title 3, United States Code, it is hereby ordered as follows: Section 1. Policy. The Federal Government benefits from a workforce that can be recruited from the broadest and deepest pools of qualified candidates for merit-based positions. The issuance of an order granting Non-Competitive Eligibility to certain alumni of programs administered by the Corporation for National and Community Service (operating as AmeriCorps) would be in the best interest of the Federal Government. AmeriCorps alumni have demonstrated a sustained commitment to public service, have received extensive training and hands-on experience, and have developed leadership, communication, and technical skills that are aligned with the missions of many federal agencies and departments. It is in the interest of the Federal Government to retain the services of these highly skilled individuals, particularly given that the Federal Government aided them in the acquisition of their skills.","2":"Accordingly, pursuant to my authority under 5 U.S.C. 3302(1), and in order to achieve a workforce that is drawn from all segments of society as provided in 5 U.S.C. 2301(b)(1), I find that conditions of good administration make necessary an exception to the competitive hiring rules for certain positions in the Federal civil service. Sec. 2. Establishment. The head of any executive department or agency may appoint noncompetitively any individual who is certified under section 3 of this order to a position in the competitive service for which the individual is qualified. Sec. 3. Certifications.","3":"(a) The Chief Executive Officer (CEO) of AmeriCorps, or the CEO's designee, shall issue certificates to persons whom the CEO or designee deems to have satisfactorily completed: (i) a full-time term of national service of at least 1,700 hours as a Team Leader or Member, as specified in section 155(b)(1) or 155(b)(4) of the National and Community Service Act of 1990 (42 U.S.C. 12615(b)(1), 12615(b)(4)), or in the AmeriCorps National Civilian Community Corps program component specified in section 153 of that Act (42 U.S.C. 12613); or (ii) one or more terms of service that total at least 1,700 hours under section 139(b)(1) of that Act (42 U.S.C. 12593(b)(1)) as an AmeriCorps State and National participant under section 137 of that Act (42 U.S.C. 12591). (b) This order does not alter or otherwise affect the Non-Competitive Eligibility status for AmeriCorps Volunteers in Service to America participants, commonly known as VISTA members, who successfully complete their service, as described in section 415(d) of the Domestic Volunteer Service Act of 1973, as amended (42 U.S.C. 5055(d)). (c) In making any certification under this section, the CEO, or the CEO's designee, may rely on a confirmation made by the entity that selected the individual for, and supervised the individual in, the approved national service position in which such individual successfully completed a term of service, as specified in this section.","4":"If AmeriCorps determines that the certification is incorrect, the Corporation shall, after considering the full facts and circumstances surrounding the incorrect certification, take appropriate action. (d) Any appointment under this order shall be effected within 1 year after completion of the appointee's most recent term of service in the programs described in subsections (a)(i)—(ii) of this section. Such period may be extended to not more than 3 years for persons who, following participation in the programs described in subsections (a)(i)—(ii) of this section, are engaged in an additional term of AmeriCorps service, in military service, in the pursuit of studies at an institution of higher learning, or in other activities that, in the view of the appointing authority, warrant an extension of such period. Such period may also be extended to permit the adjudication of a background investigation. (e) Any law, Executive Order, or regulation that would disqualify an applicant for appointment in the competitive service shall also disqualify an applicant for appointment under this order. Examples of disqualifying criteria include restrictions on employing persons who are not United States citizens or nationals; who have violated 5 U.S.C. 2302(b)(7) and 3310 (the anti-nepotism provisions of the Civil Service Reform Act of 1978); who have knowingly and willfully failed to register for Selective Service when required to do so, 5 U.S.C. 3328(a)(2); who do not meet occupational qualifying standards prescribed by the Office of Personnel Management (OPM); or who do not meet suitability factors prescribed by OPM. Sec. 4. Regulations.","5":"The Director of OPM is authorized to issue such additional regulations as may be necessary to implement this order. Any individual who meets the terms of this order, however, is eligible for noncompetitive hiring with or without additional regulations. Sec. 5. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"P25":{"1":"In Proclamation 10339, I determined that the safeguard action on imports of CSPV cells, whether or not partially or fully assembled into other products, continued to be necessary to prevent or remedy the serious injury to the domestic industry, and that there was evidence that the domestic industry was making a positive adjustment to import competition.","2":"I further determined to extend the safeguard measure proclaimed in Proclamation 9693, as modified by Proclamation 10101, in relevant part, as follows: (a) continuation of the TRQ on imports of solar cells not partially or fully assembled into other products imposed by Proclamation 9693, as described in paragraph 1 of Proclamation 10339 and paragraph 1 of this proclamation, for an additional period of 4 years, with unchanging within-quota quantities of 5.0 gigawatts (GW) for each year and annual reductions in the rates of duty applicable to goods entered in excess of those quantities of cells in the fifth, sixth, seventh, and eighth years, as described in Annex I to Proclamation 10339; and (b) continuation of the safeguard tariff on imports of modules imposed by Proclamation 9693, as described in paragraph 1 of Proclamation 10339 and paragraph 1 of this proclamation, for an additional period of 4 years, with annual reductions in the fifth, sixth, seventh, and eighth years, as described in Annex I to Proclamation 10339. 5. If an extension of an action taken under section 203 of the Trade Act (19 U.S.C. 2253) exceeds 3 years, section 204(a)(2) of the Trade Act (19 U.S.C. 2254(a)(2)) requires the USITC to issue a report to the President and the Congress on its monitoring of developments with respect to the domestic industry, including the progress and specific efforts made by workers and firms in the domestic industry to make a positive adjustment to import competition, no later than the midpoint of the period of the extension. 6. On February 6, 2024, the USITC issued its midterm report pursuant to section 204(a)(2) of the Trade Act (19 U.S.C. 2254(a)(2)) on its monitoring of developments within the industry producing CSPV products since the President's extension of the safeguard measure (USITC, Crystalline Silicon Photovoltaic Cells, Whether or Not Partially or Fully Assembled Into Other Products: Monitoring Developments in the Domestic Industry, No. TA-201-075 (Second Monitoring)). In its report, the USITC found that the safeguard measure has resulted in positive adjustments from the domestic industry in light of increased actual and planned module production; various announcements of planned domestic cell production; and improvements in several of the domestic industry's financial, trade, and employment indicators. 7. On September 19, 2023, a majority of the representatives of the domestic industry submitted a petition under section 204(b) of the Trade Act (19 U.S.C. 2254(b)(1)(B)) to modify the safeguard measure by eliminating the TRQ and providing for tariff-free treatment of all imports of CSPV cells, or alternatively to increase the TRQ from 5 GW to 20 GW annually. The petition explains how the domestic industry has continued to make a positive adjustment to import competition. It also explains that expected domestic module production coupled with current lack of sufficient domestic cell production will require domestic module producers to rely on imports in the near term, in excess of the current 5 GW within-quota TRQ amount. 8. Section 204(b)(1)(B) of the Trade Act (19 U.S.C. 2254(b)(1)(B)) authorizes the President, upon submission of a petition from a majority of the representatives of the domestic industry, to reduce, modify, or terminate an action taken under section 203 of the Trade Act when the President determines that the domestic industry has made a positive adjustment to import competition. 9.","3":"After taking into account the information provided in the USITC's midterm report, and after receiving a petition from a majority of the representatives of the domestic industry requesting expansion or elimination of the TRQ on imports of certain CSPV cells, I have determined that the domestic industry has been making and is continuing to make a positive adjustment to import competition, shown by increased actual and planned module production; various announcements of planned domestic cell production; and improvements in several of the domestic industry's financial, trade, and employment indicators.","4":"Furthermore, I have determined that expected domestic module production and associated imports of CSPV cells have increased such that it is necessary to modify the action taken in Proclamation 9693, as extended by Proclamation 10339, by expanding the TRQ to unchanging within-quota quantities of 12.5 GW. 10. The in-quota quantity in each year of the TRQ described in paragraph 9 of this proclamation shall be allocated among all countries except those countries the products of which are excluded from such TRQ pursuant to clause (4) of Proclamation 10339 or paragraph 10 of Proclamation 9693.","5":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States, including sections 203, 204, and 604 of the Trade Act, do proclaim that: (1) In order to modify the action applicable to imports of CSPV cells under HTS subheading 8541.42.0010 and other CSPV products, such as modules under HTS subheading 8541.43.0010, subchapter III of chapter 99 of the HTS is modified as set forth in Annex I to this proclamation. (2) The modifications to the HTS made by this proclamation, including Annex I hereto, shall be effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on August 1, 2024, and shall continue in effect as provided in Annex I to this proclamation, unless such actions are earlier expressly reduced, modified, or terminated. (3) CSPV products that are subject to the modifications described in clause (1) of this proclamation, and which are entered into the United States above the prior TRQ limit of 5 GW on or after August 1, 2024, shall be included within the modified TRQ limit of 12.5 GW and shall not be assessed safeguard tariffs unless they enter into the United States above the modified TRQ limit of 12.5 GW.","6":"(4) U.S. Customs and Border Protection shall take such actions as are necessary to ensure proper application of clauses (1), (2), and (3) of this proclamation. (5) One year from the termination of the safeguard measure referenced in this proclamation, as modified by this proclamation, the U.S. note and tariff provisions established in Annex I to this proclamation shall be deleted from the HTS. (6) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency."},"M8":{"1":"Specifically, I request that excused absence be granted to employees who are needed for emergency law enforcement, relief, or cleanup efforts authorized by Federal, State, or other officials having jurisdiction and employees who are prevented from reporting for work or faced with a personal emergency because of the fires and their aftermath.","2":"I am also authorizing the Office of Personnel Management (OPM) to determine whether there is a need to establish an emergency leave transfer program to assist employees affected by this major disaster. An emergency leave transfer program would permit employees in an executive agency to donate their unused annual leave for transfer to employees of the same or other agencies who were adversely affected by the fires in the Los Alamos area and who need additional time off for recovery.","3":"If the need for donated annual leave becomes evident, I direct the OPM to establish the emergency leave transfer program and provide additional information to agencies on the program's administration."},"EO26":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to improve the Nation's resilience to current and future flood risk, I hereby direct the following: Section 1. Policy. It is the policy of the United States to improve the resilience of communities and Federal assets against the impacts of flooding. These impacts are anticipated to increase over time due to the effects of climate change and other threats. Losses caused by flooding affect the environment, our economic prosperity, and public health and safety, each of which affects our national security. The Federal Government must take action, informed by the best-available and actionable science, to improve the Nation's preparedness and resilience against flooding. Executive Order 11988 of May 24, 1977 (Floodplain Management), requires executive departments and agencies (agencies) to avoid, to the extent possible, the long- and short-term adverse impacts associated with the occupancy and modification of floodplains and to avoid direct or indirect support of floodplain development wherever there is a practicable alternative. The Federal Government has developed processes for evaluating the impacts of Federal actions in or affecting floodplains to implement Executive Order 11988. As part of a national policy on resilience and risk reduction consistent with my Climate Action Plan, the National Security Council staff coordinated an interagency effort to create a new flood risk reduction standard for federally funded projects. The views of Governors, mayors, and other stakeholders were solicited and considered as efforts were made to establish a new flood risk reduction standard for federally funded projects. The result of these efforts is the Federal Flood Risk Management Standard (Standard), a flexible framework to increase resilience against flooding and help preserve the natural values of floodplains. Incorporating this Standard will ensure that agencies expand management from the current base flood level to a higher vertical elevation and corresponding horizontal floodplain to address current and future flood risk and ensure that projects funded with taxpayer dollars last as long as intended. This order establishes the Standard and sets forth a process for further solicitation and consideration of public input, including from Governors, mayors, and other stakeholders, prior to implementation of the Standard. Sec. 2. Amendments to Executive Order 11988.","2":"(a) Section 2 is amended by inserting \", to the extent permitted by law\" after \"as follows\".","3":"(b) Section 2(a)(1) is amended by striking \"This Determination shall be made according to a Department of Housing and Urban Development (HUD) floodplain map or a more detailed map of an area, if available.","4":"If such maps are not available, the agency shall make a determination of the location of the floodplain based on the best-available information.","5":"The Water Resources Council shall issue guidance on this information not later than October 1, 1977\" and inserting in lieu thereof \"To determine whether the action is located in a floodplain, the agency shall use one of the approaches in Section 6(c) of this Order based on the best-available information and the Federal Emergency Management Agency's effective Flood Insurance Rate Map\".","6":"(c) Section 2(a)(2) is amended by inserting the following sentence after the first sentence: \"Where possible, an agency shall use natural systems, ecosystem processes, and nature-based approaches when developing alternatives for consideration.\".","7":"(d) Section 2(d) is amended by striking \"Director\" and inserting \"Administrator\" in lieu thereof.","8":"(e) Section 3(a) is amended by inserting the following sentence after the first sentence: \"The regulations and procedures must also be consistent with the Federal Flood Risk Management Standard (FFRMS).\".","9":"(f) Section 3(a) is further amended by inserting \"and FFRMS\" after \"Flood Insurance Program\".","10":"(g) Section 3(b) is amended by striking \"base flood level\" and inserting \"elevation of the floodplain as defined in Section 6(c) of this Order\" in lieu thereof. (h) Section 4 is revised to read as follows: \"In addition to any responsibilities under this Order and Sections 102, 202, and 205 of the Flood Disaster Protection Act of 1973, as amended (42 U.S.C. 4012a, 4106, and 4128), agencies which guarantee, approve, regulate, or insure any financial transaction which is related to an area located in an area subject to the base flood shall, prior to completing action on such transaction, inform any private parties participating in the transaction of the hazards of locating structures in the area subject to the base flood.\". (i) Section 6(c) is amended by striking \", including at a minimum, that area subject to a one percent or greater chance of flooding in any given year\" and inserting in lieu thereof: \". The floodplain shall be established using one of the following approaches: \"(1) Unless an exception is made under paragraph (2), the floodplain shall be: \"(i) the elevation and flood hazard area that result from using a climate-informed science approach that uses the best-available, actionable hydrologic and hydraulic data and methods that integrate current and future changes in flooding based on climate science. This approach will also include an emphasis on whether the action is a critical action as one of the factors to be considered when conducting the analysis; \"(ii) the elevation and flood hazard area that result from using the freeboard value, reached by adding an additional 2 feet to the base flood elevation for non-critical actions and by adding an additional 3 feet to the base flood elevation for critical actions; \"(iii) the area subject to flooding by the 0.2 percent annual chance flood; or \"(iv) the elevation and flood hazard area that result from using any other method identified in an update to the FFRMS. \"(2) The head of an agency may except an agency action from paragraph (1) where it is in the interest of national security, where the agency action is an emergency action, where application to a Federal facility or structure is demonstrably inappropriate, or where the agency action is a mission-critical requirement related to a national security interest or an emergency action. When an agency action is excepted from paragraph (1) because it is in the interest of national security, it is an emergency action, or it is a mission-critical requirement related to a national security interest or an emergency action, the agency head shall rely on the area of land subject to the base flood\".","11":"(j) Section 6 is further amended by adding the following new subsection (d) at the end: \"(d) The term 'critical action' shall mean any activity for which even a slight chance of flooding would be too great.\". (k) Section 8 is revised to read as follows:","12":"(iii) after the comment period closes, and based on the comments received on the draft Guidelines during the comment period, in accordance with subsections (a)(i) and (ii) of this section, the Mitigation Framework Leadership Group shall provide recommendations to the Water Resources Council.","13":"(b) After additional input from stakeholders has been solicited and considered as set forth in subsections (a)(i) and (ii) of this section and after consideration of the recommendations made by the Mitigation Framework Leadership Group pursuant to subsection (a)(iii) of this section, the Water Resources Council shall issue amended Guidelines to provide guidance to agencies on the implementation of Executive Order 11988, as amended, consistent with the Standard. (c) To the extent permitted by law, each agency shall, in consultation with the Water Resources Council, Federal Interagency Floodplain Management Task Force, Federal Emergency Management Agency, and Council on Environmental Quality, issue or amend existing regulations and procedures to comply with this order, and update those regulations and procedures as warranted.","14":"Within 30 days of the closing of the public comment period for the draft amendments to the Guidelines as described in subsection (a) of this section, each agency shall submit an implementation plan to the National Security Council staff that contains milestones and a timeline for implementation of this order and the Standard, by the agency as it applies to the agency's processes and mission. Agencies shall not issue or amend existing regulations and procedures pursuant to this subsection until after the Water Resources Council has issued amended Guidelines pursuant to subsection (b) of this order. Sec. 4. Reassessment.","15":"(a) The Water Resources Council shall issue any further amendments to the Guidelines as warranted. (b) The Mitigation Framework Leadership Group in consultation with the Federal Interagency Floodplain Management Task Force shall reassess the Standard annually, after seeking stakeholder input, and provide recommendations to the Water Resources Council to update the Standard if warranted based on accurate and actionable science that takes into account changes to climate and other changes in flood risk.","16":"The Water Resources Council shall issue an update to the Standard at least every 5 years. Sec. 5. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department, agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.","17":"(d) The Water Resources Council shall carry out its responsibilities under this order in consultation with the Mitigation Framework Leadership Group."},"P34":{"1":"Now, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that, effective as of this date, that portion of Proclamation 3279, as amended, beginning with section 1 thereof,","2":"\"SEC. 1 (a) In Districts I—IV, in District V, and in Puerto Rico, no crude oil, unfinished oils, or finished products may be entered for consumption or withdrawn from warehouse for consumption, except (1) by or for the account of a person to whom a license has been issued by the Secretary of the Interior pursuant to an allocation made to such person by the Secretary in accordance with regulations issued by the Secretary, and such entries or withdrawals may be made only in accordance with the terms of such license, or (2) as authorized by the Secretary pursuant to paragraph (b) of this section, or (3) as to finished products, by or for the account
