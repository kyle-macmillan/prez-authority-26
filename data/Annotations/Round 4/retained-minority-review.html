ed pursuant to section 2 of this order, specifically listed classes of personally identifiable data that are reasonably linked to an individual, and that—whether in combination with each other, with other sensitive personal data, or with other data that is disclosed by a transacting party pursuant to the transaction and that makes the personally identifiable data exploitable by a country of concern—could be used to identify an individual from a data set or link data across multiple data sets to an individual. The term \"covered personal identifiers\" does not include: (i) demographic or contact data that is linked only to another piece of demographic or contact data (such as first and last name, birth date, birthplace, zip code, residential street or postal address, phone number, and email address and similar public account identifiers); or (ii) a network-based identifier, account-authentication data, or call-detail data that is linked only to another network-based identifier, account-authentication data, or call-detail data for the provision of telecommunications, networking, or similar services. (f) The term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization. (g) The term \"foreign person\" means any person that is not a United States person. (h) The term \"human genomic data\" refers to data representing the nucleic acid sequences that constitute the entire set or a subset of the genetic instructions found in a cell. (i) The term \"human 'omic data\" means data generated from humans that characterizes or quantifies human biological molecule(s), such as human genomic data, epigenomic data, proteomic data, transcriptomic data, microbiomic data, or metabolomic data, as further defined by regulations issued by the Attorney General pursuant to section 2 of this order, which may be informed by the report described in section 6 of this order. (j) The term \"person\" means an individual or entity. (k) The term \"relevant agencies\" means the Department of State, the Department of the Treasury,"},"P52":{"1":"Hereby proclaim an embargo upon trade between the United States and Cuba in accordance with paragraphs 2 and 3 of this proclamation. 2.","2":"Hereby prohibit, effective 12:01 A.M., Eastern Standard Time, February 7, 1962, the importation into the United States of all goods of Cuban origin and all goods imported from or through Cuba;","3":"and I hereby authorize and direct the Secretary of the Treasury to carry out such prohibition, to make such exceptions thereto, by license or otherwise,","4":"as he determines to be consistent with the effective operation of the embargo hereby proclaimed, and to promulgate such rules and regulations as may be necessary to perform such functions. 3.","5":"AND FURTHER, I do hereby direct the Secretary of Commerce, under the provisions of the Export Control Act of 1949, as amended (50 U.S.C. App. 2021-2032), to continue to carry out the prohibition of all exports from the United States to Cuba,","6":"and I hereby authorize him, under that Act, to continue, make, modify, or revoke exceptions from such prohibition."},"M28":{"1":"Pursuant to the authority vested in me by Section 401 of the Mutual Security Act of 1954, as amended, it is hereby determined that the use of funds, available under said Act, for the purpose of carrying out the program of asylum for refugees from Hungary which was announced by my statement of December 1, 1956, is important to the security of the United States and that assistance to such refugees will contribute to the security of the United States.","2":"The Department of State, the Department of Defense, the International Cooperation Administration, and any other Executive Agencies which may participate in this program are authorized and directed to take such action and make such expenditures as may be necessary to perform such services and carry out such activities as are requested by my Representative for Hungarian Refugee Relief, and to be reimbursed from funds available under said Section for additional costs incurred and not otherwise provided for, to the extent agreed upon between such Agencies and ICA and approved by the Director of the Bureau of the Budget.","3":"It is my desire that the program be carried out forthwith and without awaiting completion of arrangements for reimbursements. The Director of the International Cooperation Administration is requested on my behalf to give appropriate notices, pursuant to Section 513 of the Mutual Security Act of 1954, as amended, to the Chairman of the Senate Committee on Foreign Relations, the Chairman of the House Committee on Foreign Affairs, and the respective Chairmen of the Senate and House Committees on Armed Services."},"EO36":{"1":"Now, Therefore, by the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows: Part 1 Original Classification Section 1.1. Definitions. For purposes of this order: (a) \"National security\" means the national defense or foreign relations of the United States. (b) \"Information\" means any knowledge that can be communicated or documentary material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. \"Control\" means the authority of the agency that originates information, or its successor in function, to regulate access to the information. (c) \"Classified national security information\" (hereafter \"classified information\") means information that has been determined pursuant to this order or any predecessor order to require protection against unauthorized disclosure and is marked to indicate its classified status when in documentary form. (d) \"Foreign Government Information\" means: (1) information provided to the United States Government by a foreign government or governments, an international organization of governments, or any element thereof, with the expectation that the information, the source of the information, or both, are to be held in confidence; (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments, or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence; or (3) information received and treated as \"Foreign Government Information\" under the terms of a predecessor order. (e) \"Classification\" means the act or process by which information is determined to be classified information. (f) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure. (g) \"Original classification authority\" means an individual authorized in writing, either by the President, or by agency heads or other officials designated by the President, to classify information in the first instance. (h) \"Unauthorized disclosure\" means a communication or physical transfer of classified information to an unauthorized recipient. (i) \"Agency\" means any \"Executive agency,\" as defined in 5 U.S.C. 105, and any other entity within the executive branch that comes into the possession of classified information. (j) \"Senior agency official\" means the official designated by the agency head under section 5.6(c) of this order to direct and administer the agency's program under which information is classified, safeguarded, and declassified. (k) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation that the information or relationship, or both, are to be held in confidence. (l) \"Damage to the national security\" means harm to the national defense or foreign relations of the United States from the unauthorized disclosure of information, to include the sensitivity, value, and utility of that information. Sec. 1.2. Classification Standards. (a) Information may be originally classified under the terms of this order only if all of the following conditions are met: (1) an original classification authority is classifying the information; (2) the information is owned by, produced by or for, or is under the control of the United States Government; (3) the information falls within one or more of the categories of information listed in section 1.5 of this order; and (4) the original classification authority determines that the unauthorized disclosure of the information reasonably could be expected to result in damage to the national security and the original classification authority is able to identify or describe the damage. (b) If there is significant doubt about the need to classify information, it shall not be classified. This provision does not: (1) amplify or modify the substantive criteria or procedures for classification; or (2) create any substantive or procedural rights subject to judicial review. (c) Classified information shall not be declassified automatically as a result of any unauthorized disclosure of identical or similar information. Sec. 1.3. Classification Levels. (a) Information may be classified at one of the following three levels: (1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security that the original classification authority is able to identify or describe. (2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security that the original classification authority is able to identify or describe. (3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security that the original classification authority is able to identify or describe. (b) Except as otherwise provided by statute, no other terms shall be used to identify United States classified information. (c) If there is significant doubt about the appropriate level of classification, it shall be classified at the lower level. Sec. 1.4. Classification Authority. (a) The authority to classify information originally may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register; or (3) United States Government officials delegated this authority pursuant to paragraph (c), below. (b) Officials authorized to classify information at a specified level are also authorized to classify information at a lower level. (c) Delegation of original classification authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) \"Top Secret\" original classification authority may be delegated only by the President or by an agency head or official designated pursuant to paragraph (a)(2), above. (3) \"Secret\" or \"Confidential\" original classification authority may be delegated only by the President; an agency head or official designated pursuant to paragraph (a)(2), above; or the senior agency official, provided that official has been delegated \"Top Secret\" original classification authority by the agency head. (4) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this order.","2":"Each delegation shall identify the official by name or position title. (d) Original classification authorities must receive training in original classification as provided in this order and its implementing directives. (e) Exceptional cases. When an employee, contractor, licensee, certificate holder, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this order and its implementing directives. The information shall be transmitted promptly as provided under this order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within 30 days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office.","3":"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.5. Classification Categories. Information may not be considered for classification unless it concerns: (a) military plans, weapons systems, or operations; (b) foreign government information; (c) intelligence activities (including special activities), intelligence sources or methods, or cryptology; (d) foreign relations or foreign activities of the United States, including confidential sources; (e) scientific, technological, or economic matters relating to the national security; (f) United States Government programs for safeguarding nuclear materials or facilities; or (g) vulnerabilities or capabilities of systems, installations, projects or plans relating to the national security. Sec. 1.6. Duration of Classification. (a) At the time of original classification, the original classification authority shall attempt to establish a specific date or event for declassification based upon the duration of the national security sensitivity of the information. The date or event shall not exceed the time frame in paragraph (b), below. (b) If the original classification authority cannot determine an earlier specific date or event for declassification, information shall be marked for declassification 10 years from the date of the original decision, except as provided in paragraph (d), below. (c) An original classification authority may extend the duration of classification or reclassify specific information for successive periods not to exceed 10 years at a time if such action is consistent with the standards and procedures established under this order. This provision does not apply to information contained in records that are more than 25 years old and have been determined to have permanent historical value under title 44, United States Code.","4":"(d) At the time of original classification, the original classification authority may exempt from declassification within 10 years specific information, the unauthorized disclosure of which could reasonably be expected to cause damage to the national security for a period greater than that provided in paragraph (b), above, and the release of which could reasonably be expected to: (1) reveal an intelligence source, method, or activity, or a cryptologic system or activity; (2) reveal information that would assist in the development or use of weapons of mass destruction; (3) reveal information that would impair the development or use of technology within a United States weapons system; (4) reveal United States military plans, or national security emergency preparedness plans; (5) reveal foreign government information; (6) damage relations between the United States and a foreign government, reveal a confidential source, or seriously undermine diplomatic activities that are reasonably expected to be ongoing for a period greater than that provided in paragraph (b), above; (7) impair the ability of responsible United States Government officials to protect the President, the Vice President, and other individuals for whom protection services, in the interest of national security, are authorized; or (8) violate a statute, treaty, or international agreement. (e) Information marked for an indefinite duration of classification under predecessor orders, for example, \"Originating Agency's Determination Required,\" or information classified under predecessor orders that contains no declassification instructions shall be declassified in accordance with part 3 of this order. Sec. 1.7. Identification and Markings. (a) At the time of original classification, the following shall appear on the face of each classified document, or shall be applied to other classified media in an appropriate manner: (1) one of the three classification levels defined in section 1.3 of this order; (2) the identity, by name or personal identifier and position, of the original classification authority; (3) the agency and office of origin, if not otherwise evident; (4) declassification instructions, which shall indicate one of the following: (A) the date or event for declassification, as prescribed in section 1.6(a) or section 1.6(c); or (B) the date that is 10 years from the date of original classification, as prescribed in section 1.6(b); or (C) the exemption category from declassification, as prescribed in section 1.6(d); and (5) a concise reason for classification which, at a minimum, cites the applicable classification categories in section 1.5 of this order. (b) Specific information contained in paragraph (a), above, may be excluded if it would reveal additional classified information. (c) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, which portions are exempt from declassification under section 1.6(d) of this order, and which portions are unclassified. In accordance with standards prescribed in directives issued under this order, the Director of the Information Security Oversight Office may grant waivers of this requirement for specified classes of documents or information. The Director shall revoke any waiver upon a finding of abuse. (d) Markings implementing the provisions of this order, including abbreviations and requirements to safeguard classified working papers, shall conform to the standards prescribed in implementing directives issued pursuant to this order. (e) Foreign government information shall retain its original classification markings or shall be assigned a U.S. classification that provides a degree of protection at least equivalent to that required by the entity that furnished the information. (f) Information assigned a level of classification under this or predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings.","5":"Whenever such information is used in the derivative classification process or is reviewed for possible declassification, holders of such information shall coordinate with an appropriate classification authority for the application of omitted markings. (g) The classification authority shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document. Sec. 1.8. Classification Prohibitions and Limitations. (a) In no case shall information be classified in order to: (1) conceal violations of law, inefficiency, or administrative error; (2) prevent embarrassment to a person, organization, or agency; (3) restrain competition; or (4) prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) Information may not be reclassified after it has been declassified and released to the public under proper authority. (d) Information that has not previously been disclosed to the public under proper authority may be classified or reclassified after an agency has received a request for it under the Freedom of Information Act (5 U.S.C. 552) or the Privacy Act of 1974 (5 U.S.C. 552a), or the mandatory review provisions of section 3.6 of this order only if such classification meets the requirements of this order and is accomplished on a document-by-document basis with the personal participation or under the direction of the agency head, the deputy agency head, or the senior agency official designated under section 5.6 of this order. This provision does not apply to classified information contained in records that are more than 25 years old and have been determined to have permanent historical value under title 44, United States Code. (e) Compilations of items of information which are individually unclassified may be classified if the compiled information reveals an additional association or relationship that: (1) meets the standards for classification under this order; and (2) is not otherwise revealed in the individual items of information. As used in this order, \"compilation\" means an aggregation of pre-existing unclassified items of information. Sec. 1.9. Classification Challenges. (a) Authorized holders of information who, in good faith, believe that its classification status is improper are encouraged and expected to challenge the classification status of the information in accordance with agency procedures established under paragraph (b), below.","6":"(b) In accordance with implementing directives issued pursuant to this order, an agency head or senior agency official shall establish procedures under which authorized holders of information are encouraged and expected to challenge the classification of information that they believe is improperly classified or unclassified. These procedures shall assure that: (1) individuals are not subject to retribution for bringing such actions; (2) an opportunity is provided for review by an impartial official or panel; and (3) individuals are advised of their right to appeal agency decisions to the Interagency Security Classification Appeals Panel established by section 5.4 of this order. Part 2 Derivative Classification Sec. 2.1. Definitions. For purposes of this order: (a) \"Derivative classification\" means the incorporating, paraphrasing, restating or generating in new form information that is already classified, and marking the newly developed material consistent with the classification markings that apply to the source information. Derivative classification includes the classification of information based on classification guidance. The duplication or reproduction of existing classified information is not derivative classification. (b) \"Classification guidance\" means any instruction or source that prescribes the classification of specific information. (c) \"Classification guide\" means a documentary form of classification guidance issued by an original classification authority that identifies the elements of information regarding a specific subject that must be classified and establishes the level and duration of classification for each such element. (d) \"Source document\" means an existing document that contains classified information that is incorporated, paraphrased, restated, or generated in new form into a new document. (e) \"Multiple sources\" means two or more source documents, classification guides, or a combination of both. Sec. 2.2. Use of Derivative Classification. (a) Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents the pertinent classification markings. For information derivatively classified based on multiple sources, the derivative classifier shall carry forward: (A) the date or event for declassification that corresponds to the longest period of classification among the sources; and (B) a listing of these sources on or attached to the official file or record copy. Sec. 2.3. Classification Guides.","7":"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. These guides shall conform to standards contained in directives issued under this order. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official; and (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agencies shall establish procedures to assure that classification guides are reviewed and updated as provided in directives issued under this order. Part 3 Declassification and Downgrading Sec. 3.1. Definitions. For purposes of this order: (a) \"Declassification\" means the authorized change in the status of information from classified information to unclassified information. (b) \"Automatic declassification\" means the declassification of information based solely upon: (1) the occurrence of a specific date or event as determined by the original classification authority; or (2) the expiration of a maximum time frame for duration of classification established under this order. (c) \"Declassification authority\" means: (1) the official who authorized the original classification, if that official is still serving in the same position; (2) the originator's current successor in function; (3) a supervisory official of either; or (4) officials delegated declassification authority in writing by the agency head or the senior agency official. (d) \"Mandatory declassification review\" means the review for declassification of classified information in response to a request for declassification that meets the requirements under section 3.6 of this order. (e) \"Systematic declassification review\" means the review for declassification of classified information contained in records that have been determined by the Archivist of the United States (\"Archivist\") to have permanent historical value in accordance with chapter 33 of title 44, United States Code. (f) \"Declassification guide\" means written instructions issued by a declassification authority that describes the elements of information regarding a specific subject that may be declassified and the elements that must remain classified. (g) \"Downgrading\" means a determination by a declassification authority that information classified and safeguarded at a specified level shall be classified and safeguarded at a lower level. (h) \"File series\" means documentary material, regardless of its physical form or characteristics, that is arranged in accordance with a filing system or maintained as a unit because it pertains to the same function or activity. Sec. 3.2. Authority for Declassification. (a) Information shall be declassified as soon as it no longer meets the standards for classification under this order. (b) It is presumed that information that continues to meet the classification requirements under this order requires continued protection. In some exceptional cases, however, the need to protect such information may be outweighed by the public interest in disclosure of the information, and in these cases the information should be declassified. When such questions arise, they shall be referred to the agency head or the senior agency official. That official will determine, as an exercise of discretion, whether the public interest in disclosure outweighs the damage to national security that might reasonably be expected from disclosure. This provision does not: (1) amplify or modify the substantive criteria or procedures for classification; or (2) create any substantive or procedural rights subject to judicial review. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the President through the Assistant to the President for National Security Affairs. The information shall remain classified pending a prompt decision on the appeal. (d) The provisions of this section shall also apply to agencies that, under the terms of this order, do not have original classification authority, but had such authority under predecessor orders. Sec. 3.3. Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this order. (b) In the case of classified information that is not officially transferred as described in paragraph (a), above, but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives and Records Administration (\"National Archives\") as of the effective date of this order shall be declassified or downgraded by the Archivist in accordance with this order, the directives issued pursuant to this order, agency declassification guides, and any existing procedural agreement between the Archivist and the relevant agency head. (d) The originating agency shall take all reasonable steps to declassify classified information contained in records determined to have permanent historical value before they are accessioned into the National Archives. However, the Archivist may require that records containing classified information be accessioned into the National Archives when necessary to comply with the provisions of the Federal Records Act. This provision does not apply to information being transferred to the Archivist pursuant to section 2203 of title 44, United States Code, or information for which the National Archives and Records Administration serves as the custodian of the records of an agency or organization that goes out of existence. (e) To the extent practicable, agencies shall adopt a system of records management that will facilitate the public release of documents at the time such documents are declassified pursuant to the provisions for automatic declassification in sections 1.6 and 3.4 of this order. Sec. 3.4. Automatic Declassification. (a) Subject to paragraph (b), below, within 5 years from the date of this order, all classified information contained in records that (1) are more than 25 years old, and (2) have been determined to have permanent historical value under title 44, United States Code, shall be automatically declassified whether or not the records have been reviewed. Subsequently, all classified information in such records shall be automatically declassified no longer than 25 years from the date of its original classification, except as provided in paragraph (b), below.","8":"(b) An agency head may exempt from automatic declassification under paragraph (a), above, specific information, the release of which should be expected to: (1) reveal the identity of a confidential human source, or reveal information about the application of an intelligence source or method, or reveal the identity of a human intelligence source when the unauthorized disclosure of that source would clearly and demonstrably damage the national security interests of the United States; (2) reveal information that would assist in the development or use of weapons of mass destruction; (3) reveal information that would impair U.S. cryptologic systems or activities; (4) reveal information that would impair the application of state of the art technology within a U.S. weapon system; (5) reveal actual U.S. military war plans that remain in effect; (6) reveal information that would seriously and demonstrably impair relations between the United States and a foreign government, or seriously and demonstrably undermine ongoing diplomatic activities of the United States; (7) reveal information that would clearly and demonstrably impair the current ability of United States Government officials to protect the President, Vice President, and other officials for whom protection services, in the interest of national security, are authorized; (8) reveal information that would seriously and demonstrably impair current national security emergency preparedness plans; or (9) violate a statute, treaty, or international agreement. (c) No later than the effective date of this order, an agency head shall notify the President through the Assistant to the President for National Security Affairs of any specific file series of records for which a review or assessment has determined that the information within those file series almost invariably falls within one or more of the exemption categories listed in paragraph (b), above, and which the agency proposes to exempt from automatic declassification. The notification shall include: (1) a description of the file series; (2) an explanation of why the information within the file series is almost invariably exempt from automatic declassification and why the information must remain classified for a longer period of time; and (3) except for the identity of a confidential human source or a human intelligence source, as provided in paragraph (b), above, a specific date or event for declassification of the information. The President may direct the agency head not to exempt the file series or to declassify the information within that series at an earlier date than recommended. (d) At least 180 days before information is automatically declassified under this section, an agency head or senior agency official shall notify the Director of the Information Security Oversight Office, serving as Executive Secretary of the Interagency Security Classification Appeals Panel, of any specific information beyond that included in a notification to the President under paragraph (c), above, that the agency proposes to exempt from automatic declassification. The notification shall include: (1) a description of the information; (2) an explanation of why the information is exempt from automatic declassification and must remain classified for a longer period of time; and (3) except for the identity of a confidential human source or a human intelligence source, as provided in paragraph (b), above, a specific date or event for declassification of the information. The Panel may direct the agency not to exempt the information or to declassify it at an earlier date than recommended. The agency head may appeal such a decision to the President through the Assistant to the President for National Security Affairs. The information will remain classified while such an appeal is pending.","9":"(e) No later than the effective date of this order, the agency head or senior agency official shall provide the Director of the Information Security Oversight Office with a plan for compliance with the requirements of this section, including the establishment of interim target dates. Each such plan shall include the requirement that the agency declassify at least 15 percent of the records affected by this section no later than 1 year from the effective date of this order, and similar commitments for subsequent years until the effective date for automatic declassification. (f) Information exempted from automatic declassification under this section shall remain subject to the mandatory and systematic declassification review provisions of this order.","10":"(g) The Secretary of State shall determine when the United States should commence negotiations with the appropriate officials of a foreign government or international organization of governments to modify any treaty or international agreement that requires the classification of information contained in records affected by this section for a period longer than 25 years from the date of its creation, unless the treaty or international agreement pertains to information that may otherwise remain classified beyond"},"EO15":{"1":"Now, Therefore, to promote economy and efficiency in government procurement of supplies and services, and by the authority vested in me as President by the Constitution and the laws of the United States of America, including EPCRA, 42 U.S.C. 11001 et seq., PPA, 42 U.S.C. 13101 et seq., 40 U.S.C. 471 and 486(a), and 3 U.S.C. 301, it is hereby ordered as follows: Section 1. Policy. It is the policy of the executive branch in procuring supplies and services that, to ensure the economical and efficient procurement of Federal Government contracts, Federal agencies, to the greatest extent practicable, shall contract with companies that report in a public manner on toxic chemicals released to the environment. Sec. 2. Definitions. 2-201. All definitions found in EPCRA and PPA and implementing regulations are incorporated into this order by reference, with the following exceptions for purposes of this order. 2-202. \"Federal agency\" means an \"Executive agency,\" as defined in 5 U.S.C. 105. For purposes of this order, military departments, as defined in 5 U.S.C. 102, are covered under the auspices of the Department of Defense. 2-203. \"Acquisition\" means the acquiring by contract with appropriated funds of supplies or services (including construction) by and for the use of the Federal Government through purchase or lease, whether the supplies or services are already in existence or must be created, developed, demonstrated, and evaluated. Acquisition begins at the point when the Federal department or agency needs are established and includes the description of requirements to satisfy agency needs, solicitation and selection of sources, award of contracts, contract financing, contract performance, contract administration, and those technical and management functions directly related to the process of fulfilling agency needs by contract. 2-204. \"Toxic chemical\" means a substance on the list described in section 313(c) of EPCRA, 42 U.S.C. 11023(c), as it exists on the effective date of this order. 2-205. \"Administrator\" means the Administrator of the United States Environmental Protection Agency (\"EPA\"). 2-206. \"Federal contractor\" means an entity that has submitted the successful bid or proposal in response to a competitive acquisition solicitation. Sec. 3. Applicability. 3-301. Each Federal agency shall, to the maximum extent practicable, include in contract solicitations as an eligibility criterion for the award of competitive acquisition contracts expected to equal or exceed $100,000 with the Federal contractors described in subsection 3-302, the requirement that such contractors must file (and continue to file for the life of the contract) a Toxic Chemical Release Form (\"Form R\"), as described in sections 313 (a) and (g) of EPCRA, 42 U.S.C. 11023 (a) and (g), for each toxic chemical manufactured, processed, or otherwise used by the Federal contractor at a facility, as described in section 313 of EPCRA, 42 U.S.C. 11023, and section 6607 of PPA, 42 U.S.C. 13106. 3-302. The Federal contractors subject to the eligibility criterion described in subsection 3-301 above are those who currently report to the TRI pursuant to section 313(b)(1)(A) of EPCRA, 42 U.S.C. 11023(b)(1)(A), that is, manufacturers having Standard Industrial Classification Code (\"SIC\") designations of 20 through 39 (as in effect on July 1, 1985). 3-303. Each Federal agency shall find that a prospective Federal contractor has satisfied the requirement in subsection 3-301 if the contractor certifies in a solicitation that it: (a) Does not manufacture, process, or otherwise use any toxic chemicals listed under section 313(c) of EPCRA, 42 U.S.C. 11023(c); (b) Does not have 10 or more full-time employees as specified in section 313(b)(1)(A) of EPCRA, 42 U.S.C. 11023(b)(1)(A); (c) Does not meet the reporting thresholds established under section 313(f) of the EPCRA, 42 U.S.C. 11023(f); or (d) Has complied fully with the reporting requirements of subsection 4-404. 3-304. Each Federal agency shall require the filings described in subsection 3-301 above to include information on all chemicals identified by the Administrator pursuant to section 313(c) of EPCRA, 42 U.S.C. 11023(c), as of the date of this order. 3-305. Each Federal agency may amend existing contracts, to the extent permitted by law and where practicable, to require the reporting of information specified in subsection 3-301 above. 3-306. As consistent with Title IV of the Federal Acquisition Streamlining Act of 1994 (FASA), Public Law 103-355, and section 4(11) of the Office of Federal Procurement Policy Act, 41 U.S.C. 403(11), the requirements of this order are only applicable to competitive acquisition contracts expected to equal or exceed $100,000. Sec. 4. Implementation. 4-401. Not later than September 30, 1995, the EPA shall publish in the Federal Register guidance for compliance with this order, including applicability with respect to subcontractors. 4-402. Within 30 days of the issuance of the guidance provided for in subsection 4-401 above, each Federal agency shall include in all acquisition solicitations issued on or after the effective date of this order, the provisions necessary to effect this order. 4-403.","2":"For all contracts expected to exceed $500,000, each Federal agency shall consult with the Administrator or the Administrator's designee when the agency believes it is not practicable to include the eligibility requirement of section 3-301 in the contract solicitation or award. 4-404. Each Federal agency shall require each Federal contractor designated in subsection 3-302 above to: (a) Have included in its response to the contract solicitation a certification, as specified in the guidelines published pursuant to subsection 4-401 of this order, that it will (if awarded the contract) comply with the requirements of subsection 3-301; and (b) File with the Administrator and each appropriate State pursuant to section 313(a) of EPCRA, 42 U.S.C. 11023(a), the information required by subsection 3-301, beginning on the next July 1 after the date on which the contract is awarded. 4-405.","3":"Information submitted to the EPA pursuant to subsection 4-404(b) above shall be subject to the trade secret protections provided by section 322 of EPCRA, 42 U.S.C. 11042. Information that is not trade secret shall be made available to the public pursuant to sections 313 (h) and (j) of EPCRA, 42 U.S.C. 11023 (h) and (j). The Administrator is directed to review reports submitted pursuant to this order to determine the appropriateness of any claims for trade secret protection. 4-406. When the Administrator determines that a Federal contractor has not filed the necessary forms or complete information as required by subsection 3-301 above, the Administrator or the Administrator's designee may recommend termination of the contract for convenience. The Administrator shall transmit that recommendation to the head of the contracting agency, and that agency shall consider the recommendation and determine whether to terminate the contract. In carrying out this responsibility, the Administrator may investigate any subject Federal contractor to determine the adequacy of compliance with the provisions of this order and the Administrator's designee may hold such hearings, public or private, as the Administrator deems advisable to assist in the Administrator's determination of compliance. 4-407.","4":"Each contracting agency shall cooperate with the Administrator and provide such information and assistance as the Administrator may require in the performance of the Administrator's functions under this order. 4-408.","5":"Upon request and to the extent practicable, the Administrator shall provide technical advice and assistance to Federal agencies in order to assist in full compliance with this order. Sec. 5. General Provisions. 5-501.","6":"The requirements of this order shall be implemented and incorporated in acquisition regulations, including the Federal Acquisition Regulations (FAR), within 90 days after the effective date of this order. 5-502. This order is not intended, and should not be construed, to create any right or benefit, substantive or procedural, enforceable at law by a party against the United States, its agencies, its officers, or its employees. This order is not intended, however, to preclude judicial review of final agency decisions in accordance with the Administrative Procedure Act, 5 U.S.C. 701 et seq. 5-503. This order shall be effective immediately and shall continue to be in effect until revoked."},"L15":{"1":"I have determined pursuant to Section 4(c) of the Act that the absence of such controls would prove detrimental to the foreign policy and national security interests of the United States.","2":"Pursuant to Section 6(d) of the Act, I have determined that although reasonable efforts have been made to achieve the purposes of these controls through alternative means, available alternatives would not comparably advance the foreign policy and national security interests of the United States. I have also directed that the Secretary of Commerce, in consultation with the Secretary of Defense and other appropriate officials, review and revise our policy with respect to the export of high technology and other strategic items to the Soviet Union. This review is to proceed with the utmost urgency. Effective January 11, 1980 the Department of Commerce suspended all outstanding licenses and authorizations for exports to the Soviet Union and announced that it has suspended the issuance of new licenses and authorizations. The review I have directed will also consider what our policy should be on future applications for licenses, whether existing special licenses should be amended or revoked, and whether validated licenses should be required for any other exports currently permitted to the Soviet Union under general license. The Secretary of Commerce announced on January 11, 1980 his denial on national security grounds of eight license applications for export of high technology items to the Soviet Union. When the review and revision of our policy on high technology and other strategic items is completed, I will submit a further report to the Congress concerning any additional controls that may be imposed.","3":"As President and Commander-in-Chief of the Armed Forces of the United States, I find that the exports being curtailed by this action make a significant contribution to the military potential of the Soviet Union that is detrimental to the national security of the United States. Probability of Success. The restrictions can reasonably be expected to bring home to the Soviet leaders that they cannot act as they have in Afghanistan without paying a significant price. The controls are expected to have a significant impact on the Soviet economy. They will impress upon the Soviet people the consequences of their government's actions. Absent substitutes from other sources, the restrictions will mean the loss of up to half of projected grain imports for FY 1980. Combined with the 48 million ton shortfall from planned 1979 production, the effect will be a major reduction in the availability of livestock feed, the slaughter of livestock that cannot be fed, and in due course .a significant reduction in USSR meat production below planned levels. Moreover, contacts with the governments of other major grain supplier countries indicate that there will be substantial cooperation in limiting the Soviet Union's ability to replace the curtailed U.S. shipments with imports from other sources. Compatibility with Foreign Policy. The controls are essential to achieve U.S. national security and foreign policy objectives and are compatible with overall U.S. policy toward the USSR, for the reasons given above. Foreign Reaction. Many countries have expressed support for these actions by the United States, and United States officials are urgently consulting with other suppliers to seek complementary actions. Economic Impact of Controls. The most significant effect of the control on U.S. exports relates to the 17 million tons of grain previously authorized for the Soviet Union, valued at about $2.3 billion. In FY 1978 U.S. exports of all agricultural commodities to the USSR were $1.9 billion, and in FY 1979 $2.2 billion. These exports constituted 6.8% of total U.S. agricultural exports in FY 1978 and 6.9% in FY 1979. Grain exports accounted for about 80% of the value of U.S. agricultural exports to the USSR in FY 1979. Soybeans accounted for another 15%. The U.S. provided 65.1% of Soviet grain imports in FY 1978 and 77.8% in FY 1979. Total Soviet grain utilization is estimated at 231 million metric tons from July, 1978 to June, 1979, and—before imposition of these restrictions—was projected to be 228 million tons for July, 1979 to June, 1980. U.S. grain exports (11.1 million tons) accounted for 4.8% of the 1978/1979 Soviet use. Before these restrictions, U.S. exports were projected to provide 11.2% (25.5 million tons) of the Soviets' projected 1979/1980 utilization (228 million tons). The United States is the world's largest. exporter of wheat and corn and will remain so even after the suspension of most agricultural commodity exports to the Soviet Union. The United States has been undertaking consultations with other governments to reduce the possibility that other suppliers would take advantage of U.S. action to build up their own competitive position at U.S. expense. Because the export restriction has been imposed on agricultural commodities destined to the USSR in response to a Soviet act of aggression and on the basis of fundamental U.S. national security and foreign policy interests, it is unlikely that such action will diminish the overall reputation of the United States as a reliable supplier. With respect to foreign availability of wheat and corn, the United States is the major supplier of these commodities in world trade. At this time, it appears that additional supplies available in the world market are limited. With respect to soybeans and soybean products, there is substantially greater foreign availability. The availability of these commodities to the Soviet Union will depend therefore, in part, upon the cooperation of foreign suppliers. In the absence of offsetting domestic policies the restriction on agricultural exports to the USSR would have an economic impact primarily on grain farmers, on firms and employees in the grain sector, on certain rail and barge lines, and on communities in grain producing areas. Absent offsetting action, it is estimated that the restrictions on the export of agricultural commodities to the Soviet Union would reduce 1980 farm income by approximately $3.0 billion. The Secretary of Agriculture has been directed to take a number of actions, using authorities already available under current law, to ensure that the suspension of exports to the USSR will not fall unfairly on farmers and on grain marketing systems. To assure that it does not, he has taken the following actions: To prevent immediate market congestion The Department of Agriculture: • has requested that future trading in wheat and corn be suspended for the market days, January 7 and January 8; • has announced that it will purchase up to 4 million tons (150 million bushels) of wheat, including the assumption of the contractual obligations on up to 3.7 million tons (135 million bushels) that will not be shipped to the Soviet Union; • is preparing to assume the contractual obligation on up to 10.0 million tons (395 million bushels) of corn. None of these grain purchases will be resold on the domestic market until it can be done without adversely affecting market prices. All contractual assumptions will be made at prices that will protect against losses, but will not guarantee profits. To fully offset the intermediate term impacts of the suspension of sales to the USSR The Department of Agriculture has taken action to: • increase the wheat loan price to $2.50 a bushel; • increase the corn loan price to $2.10 a bushel, with comparable increases in loan prices for the other feed grains; • increase the reserve release price to $3.75 a bushel for wheat—representing 150 percent of the new loan price; • increase the reserve call price to $4.63 a bushel for wheat—representing 185 percent of the new loan price; • increase the reserve release price to $2.63 a bushel for corn—representing 125 percent of the new loan price; • increase the reserve call price to $3.05 a bushel for corn—representing 145 percent of the new loan; • make comparable increases in reserve release and call prices for the other feed grains; • waive first-year interest costs for the next 13 million tons of corn (corn only) entering the reserve; • increase reserve storage payments from 25 to 26 1/2 cents a bushel for all reserve commodities except oats, which is increased from 19 to 20 cents a bushel. To facilitate long-term supply and demand adjustments The Department of Agriculture is now evaluating: • increased commercial grain exports, and increased food donations under P.L. 480 where appropriate; • increased production of fuel alcohols from grain and other agricultural commodities; • acreage diversion programs. These steps are intended to offset the reduction in farm income and, assuming a suspension through 1980, will limit the reduction in value of agricultural exports to approximately $2.0 to $2.25 billion (instead of $3 billion). It is anticipated that these actions will result in increased budgetary costs of $2.5 to $3.0 billion during FY 1980 and 1981. Most of the increase in budget outlays will be associated with removal of wheat and corn from the market and, therefore, the budget impact will be lessened when these commodities move back into the market and loans are repaid or sales proceeds are obtained."},"EO17":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Federal Property and Administrative Services Act, 40 U.S.C. 101 et seq., and in order to take further steps to promote economy and efficiency in Federal Government procurement, it is hereby ordered as follows: Section 1. Policy. This order is designed to promote economy and efficiency in Federal Government procurement. It is the policy of the executive branch to enforce vigorously the civil rights laws of the United States, including those laws that prohibit discriminatory practices with respect to compensation. Federal contractors that employ such practices are subject to enforcement action, increasing the risk of disruption, delay, and increased expense in Federal contracting. Compensation discrimination also can lead to labor disputes that are burdensome and costly. When employees are prohibited from inquiring about, disclosing, or discussing their compensation with fellow workers, compensation discrimination is much more difficult to discover and remediate, and more likely to persist. Such prohibitions (either express or tacit) also restrict the amount of information available to participants in the Federal contracting labor pool, which tends to diminish market efficiency and decrease the likelihood that the most qualified and productive workers are hired at the market efficient price. Ensuring that employees of Federal contractors may discuss their compensation without fear of adverse action will enhance the ability of Federal contractors and their employees to detect and remediate unlawful discriminatory practices, which will contribute to a more efficient market in Federal contracting. Sec. 2. Amending Executive Order 11246.","2":"Section 202 of Executive Order 11246 of September 24, 1965, as amended, is hereby further amended as follows: (a) Paragraphs (3) through (7) are redesignated as paragraphs (4) through (8). (b) A new paragraph (3) is added to read as follows: \"The contractor will not discharge or in any other manner discriminate against any employee or applicant for employment because such employee or applicant has inquired about, discussed, or disclosed the compensation of the employee or applicant or another employee or applicant. This provision shall not apply to instances in which an employee who has access to the compensation information of other employees or applicants as a part of such employee''s essential job functions discloses the compensation of such other employees or applicants to individuals who do not otherwise have access to such information, unless such disclosure is in response to a formal complaint or charge, in furtherance of an investigation, proceeding, hearing, or action, including an investigation conducted by the employer, or is consistent with the contractor''s legal duty to furnish information.\" Sec. 3. Regulations. Within 160 days of the date of this order, the Secretary of Labor shall propose regulations to implement the requirements of this order. Sec. 4. Severability. If any provision of this order, or the application of such provision or amendment to any person or circumstance, is held to be invalid, the remainder of this order and the application of the provisions of such to any person or circumstances shall not be affected thereby. Sec. 5. General Provisions. (a) Nothing in this order shall be construed to limit the rights of an employee or applicant for employment provided under any provision of law. It also shall not be construed to prevent a Federal contractor covered by this order from pursuing a defense, as long as the defense is not based on a rule, policy, practice, agreement, or other instrument that prohibits employees or applicants from discussing or disclosing their compensation or the compensation of other employees or applicants, subject to paragraph (3) of section 202 of Executive Order 11246, as added by this order. (b) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to a department, agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"P49":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, by the authority vested in me by section 2 of the Antiquities Act, hereby proclaim that all lands and interests in lands owned or controlled by the Government of the United States within the boundaries described on the map entitled \"Fort Ord National Monument,\" which is attached to and forms a part of this proclamation,","2":"are hereby set apart and reserved as the Fort Ord National Monument (monument) for the purpose of protecting and restoring the objects identified above. The reserved Federal lands and interests in lands consist of approximately 14,651 acres, which is the smallest area compatible with the proper care and management of the objects to be protected and restored. All Federal lands and interests in lands within the boundaries of this monument are hereby appropriated and withdrawn from all forms of entry, location, selection, sale, leasing, or other disposition under the public lands laws, including withdrawal from location, entry, and patent under the mining laws, and from disposition under all laws relating to mineral and geothermal leasing other than by exchange that furthers the protective purposes of the monument. The establishment of this monument is subject to valid existing rights. Lands and interests in lands within the monument boundaries not owned or controlled by the United States shall be reserved as part of the monument upon acquisition of ownership or control by the United States. Of the approximately 14,651 acres of Federal lands and interests in lands reserved by this proclamation, approximately 7,205 acres are currently managed by the Secretary of the Interior through the Bureau of Land Management (BLM) and approximately 7,446 acres are currently managed by the Secretary of the Army. The Secretary of the Army, in consultation with the Secretary of the Interior, through the BLM, shall continue to manage the lands and interests in lands under the Secretary's jurisdiction within the monument boundaries until the Army transfers those lands and interests in lands to the BLM in accordance with the 1995 Memorandum of Understanding (MOU) between the Department of the Army and the BLM, as amended, that describes the responsibilities of each agency related to such lands and interests in lands, the implementing actions required of each agency, the process for transferring administrative jurisdiction over such lands and interests in lands to the Secretary of the Interior, and the processes for resolving interagency disputes. The Secretary of the Interior, through the BLM, shall manage that portion of the monument under the Secretary's administrative jurisdiction, pursuant to applicable legal authorities and the MOU, to implement the purposes of this proclamation.","3":"For purposes of protecting and restoring the objects identified above, the Secretary of the Interior, through the BLM, shall prepare and maintain a transportation plan, in coordination with the Secretary of the Army and consistent with the MOU, that provides for visitor enjoyment and understanding of the scientific and historic objects on lands within the monument boundaries that are under the administrative jurisdiction of the Secretary of the Interior. The transportation plan shall include the designation of roads and trails for bicycling and other purposes. Except for emergency or authorized administrative purposes, under the transportation plan motorized vehicle use shall be permitted only on designated roads, and non-motorized mechanized vehicle use shall be permitted only on designated roads and trails. The plan shall be revised upon the transfer of lands now under the administrative jurisdiction of the Secretary of the Army to the Secretary of the Interior in accordance with the MOU."},"P35":{"1":"I also directed the United States Trade Representative (Trade Representative), in consultation with other executive branch officials, to pursue negotiation of agreements to address the threatened impairment of the national security of the United States with respect to imported automobiles and certain automobile parts from the European Union, Japan, and any other country the Trade Representative deems appropriate. 3. The Trade Representative's negotiations did not lead to any agreements of the type contemplated by section 232. 4.","2":"In Proclamation 9888, I also directed the Secretary to monitor imports of automobiles and certain automobile parts and inform me of any circumstances that, in the Secretary's opinion, might indicate the need for further action under section 232 with respect to such imports. 5. The Secretary has informed me that, since the February 17, 2019, report, the national security concerns remain and have escalated. The COVID-19 pandemic exposed critical vulnerabilities and choke points in global supply chains, undermining our ability to maintain a resilient domestic industrial base. In recent years, American-owned automotive manufacturers have experienced numerous supply chain challenges, including material and parts input shortages, labor shortages and strikes, and electrical-component shortages. Meanwhile, foreign automotive industries, propelled by unfair subsidies and aggressive industrial policies, have grown substantially. Today, only about half of the vehicles sold in the United States are manufactured domestically, a decline that jeopardizes our domestic industrial base and national security, and the United States' share of worldwide automobile production has remained stagnant since the February 17, 2019, report. The number of employees in the domestic automotive industry has also not improved since the February 17, 2019, report. 6. I am also advised that agreements entered into before the issuance of Proclamation 9888, such as the revisions to the United States-Korea Free Trade Agreement and the United States-Mexico-Canada Agreement (USMCA), have not yielded sufficient positive outcomes. The threat to national security posed by imports of automobiles and certain automobile parts remains and has increased. Investments resulting from other efforts, such as legislation, have also not yielded sufficient positive outcomes to eliminate the threat to national security from such imports. 7.","3":"After considering the current information newly provided by the Secretary, among other things, I find that imports of automobiles and certain automobile parts continue to threaten to impair the national security of the United States and deem it necessary and appropriate to impose tariffs, as defined below, to adjust imports of automobiles and certain automobile parts so that such imports will not threaten to impair national security. 8. To ensure that the imposition of tariffs on automobiles and certain automobile parts in this proclamation are not circumvented and that the purpose of this action to eliminate the threat to the national security of the United States by imports of automobiles and certain automobile parts is not undermined, I also deem it necessary and appropriate to establish processes to identify and impose tariffs on additional automobile parts, as further described below. 9.","4":"Section 232 provides that, in this situation, the President shall take such other actions as the President deems necessary to adjust the imports of the relevant article so that such imports will not threaten to impair national security. 10. Section 604 of the Trade Act of 1974, as amended (19 U.S.C. 2483), authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTSUS) the substance of statutes affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.","5":"(1) Except as otherwise provided in this proclamation, all imports of articles specified in Annex I to this proclamation or in any subsequent annex to this proclamation, as set out in a subsequent notice in the Federal Register, shall be subject to a 25 percent tariff with respect to goods entered for consumption or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on April 3, 2025, for automobiles, and on the date specified in the Federal Register for automobile parts, but no later than May 3, 2025, and shall continue in effect, unless such actions are expressly reduced, modified, or terminated. The above ad valorem tariff is in addition to any other duties, fees, exactions, and charges applicable to such imported automobiles and certain automobile parts articles. (2) For automobiles that qualify for preferential tariff treatment under the USMCA, importers of such automobiles may submit documentation to the Secretary identifying the amount of U.S. content in each model imported into the United States. \"U.S. content\" refers to the value of the automobile attributable to parts wholly obtained, produced entirely, or substantially transformed in the United States. Thereafter, the Secretary may approve imports of such automobiles to be eligible to apply the ad valorem tariff of 25 percent in clause (1) of this proclamation exclusively to the value of the non-U.S. content of the automobile. The non-U.S. content of the automobile shall be calculated by subtracting the value of the U.S. content in an automobile from the total value of the automobile. (3) If U.S. Customs and Border Protection (CBP) determines that the declared value of non-U.S. content of an automobile, as described in clause (2) of this proclamation, is inaccurate due to an overstatement of U.S. content, the 25 percent tariff shall apply to the full value of the automobile, regardless of the actual U.S. content of the automobile. In addition, the 25 percent tariff shall be applied retroactively (from April 3, 2025, to the date of the inaccurate overstatement) and prospectively (from the date of the inaccurate overstatement to the date the importer corrects the overstatement, as verified by CBP) to the full value of all automobiles of the same model imported by the same importer. This clause does not apply to or otherwise affect any other applicable fees or penalties. (4) The ad valorem tariff of 25 percent described in clause (1) of this proclamation shall not apply to automobile parts that qualify for preferential treatment under the USMCA until such time that the Secretary, in consultation with CBP, establishes a process to apply the tariff exclusively to the value of the non-U.S. content of such automobile parts and publishes notice in the Federal Register. (5) For avoidance of doubt, clause (4) of this proclamation does not apply to automobile knock-down kits or parts compilations. Clause (4) of this proclamation applies only to individual automobile parts as defined by Annex I to this proclamation that otherwise meet the requirements of clause (4) of this proclamation.","6":"(6) The Secretary, in consultation with the United States International Trade Commission and CBP, shall determine the modifications necessary to the HTSUS to effectuate this proclamation and","7":"shall make such modifications to the HTSUS through notice in the Federal Register.","8":"(7) Within 90 days of the date of this proclamation, the Secretary shall establish a process for including additional automobile parts articles within the scope of the tariffs described in clause (1) of this proclamation.","9":"In addition to inclusions made by the Secretary, this process shall provide for including additional automobile parts articles at the request of a domestic producer of an automobile or automobile parts article, or an industry association representing one or more such producers, where the request establishes that imports of additional automobile parts articles have increased in a manner that threatens to impair the national security or otherwise undermines the objectives set forth in any proclamation issued on the basis of the Secretary's February 17, 2019, report or any additional information submitted to the President under clause (3) of Proclamation 9888 or clause (9) of this proclamation.","10":"When the Secretary receives such a request from a domestic producer or industry association, the Secretary, after consultation with the United States International Trade Commission and CBP, shall issue a determination regarding whether to include the articles within 60 days of receiving the request. Any additional automobile parts articles that the Secretary has determined to be included within the scope of the tariffs described in clause (1) of this proclamation shall be so included on or after 12:01 a.m. eastern daylight time the day after a notice in the Federal Register describing the determination of the Secretary. The notice in the Federal Register shall be made as soon as practicable but no later than 14 days after the Secretary's determination. (8) Any automobile or automobile part, except those eligible for admission under \"domestic status\" as defined in 19 CFR 146.43, that is subject to the duty imposed by this proclamation and that is admitted into a United States foreign trade zone on or after the effective date of this proclamation, in accordance with clause (1) of this proclamation, must be admitted as \"privileged foreign status\" as defined in 19 CFR 146.41, and will be subject upon entry for consumption to any ad valorem rates of duty related to the classification under the applicable HTSUS subheading. (9) The Secretary shall continue to monitor imports of automobiles and automobile parts. The Secretary also shall, from time to time, in consultation with any senior executive branch officials the Secretary deems appropriate, review the status of such imports with respect to national security. The Secretary shall inform the President of any circumstances that, in the Secretary's opinion, might indicate the need for further action by the President under section 232. The Secretary shall also inform the President of any circumstance that, in the Secretary's opinion, might indicate that the increase in duty rate provided for in this proclamation is no longer necessary. (10) No drawback shall be available with respect to the duties imposed pursuant to this proclamation. (11) The Secretary may issue regulations and guidance consistent with this proclamation, including to address operational necessity. (12) CBP may take any necessary or appropriate measures to administer the tariffs imposed by this proclamation. (13) Any provision of previous proclamations and Executive Orders that is inconsistent with the actions taken in this proclamation is superseded to the extent of such inconsistency."},"P20":{"1":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by the authority vested in me by the Constitution and the laws of the United States of America, including the Immigration and Nationality Act (INA) (8 U.S.C. 1101 et seq), hereby proclaim and direct as follows: Section 1. Free Return Home and CBP Home Application.","2":"(a) In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, I direct, pursuant to section 215(a)(1) of the INA (8 U.S.C. 1185(a)(1)), the Secretary of State and the Secretary of Homeland Security, in consultation with the heads of other relevant executive departments and agencies (agencies), to create seamless processes for illegal aliens to rapidly depart the United States, including through available technological resources, such as the \"CBP Home\" application. (b) Any flights provided to illegal aliens voluntarily and permanently departing the United States pursuant to processes established under subsection (a) of this section shall be funded by the Federal Government.","3":"(c) In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, I direct, pursuant to section 215(a)(1) of the INA (8 U.S.C. 1185(a)(1)), the Secretary of State and the Secretary of Homeland Security to take all appropriate actions to enable the rapid departure of illegal aliens from the United States who currently lack a valid travel document from their countries of citizenship or nationality or who desire to travel to any other country willing to accept their entry. (d) The Secretary of State and the Secretary of Homeland Security shall create a concierge service whereby any alien illegally present in the United States may arrive at an airport, with or without appropriate travel documents, book air travel to permanently relocate to a different country, and claim the exit bonus described in section 2 of this proclamation upon their successful return. Sec. 2. Exit Bonus.","4":"In furtherance of the purposes of this proclamation, and to facilitate the rapid departure of illegal aliens from the United States, the Secretary of State and the Secretary of Homeland Security, in consultation with the heads of all relevant agencies, shall provide financial incentives in the form of an \"exit bonus\" for each illegal alien who voluntarily and permanently departs the United States. Sec. 3. Penalties for Aliens Who Fail to Depart.","5":"(a) The Secretary of State and the Secretary of Homeland Security, in consultation with the heads of other relevant agencies, shall conduct a nationwide communications campaign to notify illegal aliens of the availability of cost-free travel to other countries; the exit bonus; and the sweeping consequences for those who choose to remain illegally present, including removal, prosecution, incarceration, and fines as consistent with applicable law for immigration-related crimes; the garnishment of wages; and the confiscation of savings and personal property, including homes and vehicles. (b) No later than 60 days after the date of this proclamation, the Secretary of Homeland Security shall supplement existing enforcement and removal operations by deputizing and contracting with State and local law enforcement officers, former Federal officers, officers and personnel within other Federal agencies, and other individuals to increase the enforcement and removal operations force of the Department of Homeland Security by no less than 20,000 officers in order to conduct an intensive campaign to remove illegal aliens who have failed to depart voluntarily."},"EO6":{"1":"NOW, THEREFORE, by virtue of the authority vested in me by section 3 of the Immigration Act of 1917 (39 Stat. 875; 8 U.S.C. 136), I hereby revoke the said Executive Orders No. 589 of March 14, 1907, and No. 1712 of February 24, 1913, to the extent that they are applicable to Japanese or Korean citizens or subjects who entered the Territory of Hawaii under the aforesaid passports and who are now precluded from legally entering or remaining in the continental territory of the United States by reason of such Executive orders.","2":"The Commissioner of Immigration and Naturalization is hereby authorized and directed, with the approval of the Attorney General, to take such action and to issue such rules and regulations as may be necessary for carrying out the provisions of this order."},"L7":{"1":"I have determined that the ongoing Coronavirus Disease 2019 (COVID–19) pandemic is of sufficient severity and magnitude to warrant an emergency determination under section 501(b) of the Robert T. Stafford Disaster Relief and Emergency Assistance Act, 42 U.S.C. 5121–5207 (the \"Stafford Act\"). My decision to make this determination pursuant to section 501(b) of the Stafford Act is based on the fact that our entire country is now facing a significant public health emergency. The World Health Organization has officially declared that we are in the midst of a global pandemic. As of the date of this declaration, 32 states, 3 territories, 4 tribes, and 1 tribal nation, spread geographically across our country, have declared a state of emergency as a result of the virus. Only the Federal Government can provide the necessary coordination to address a pandemic of this national size and scope caused by a pathogen introduced into our country. It is the preeminent responsibility of the Federal Government to take action to stem a nationwide pandemic that has its origins abroad, which implicates its authority to regulate matters related to interstate matters and foreign commerce and to conduct the foreign relations of the United States. For example, the Federal Government, through the Department of Health and Human Services (HHS) and its component, the Centers for Disease Control and Prevention (CDC), has authority to take the necessary steps \"to prevent the introduction, transmission, or spread of communicable diseases from foreign countries into the States or possessions, or from one State or possession into any other State or possession,\" 42 U.S.C. § 264(a), in close coordination with State, local, and tribal officials. In addition, the Federal Government has responsibility for securing our borders an
