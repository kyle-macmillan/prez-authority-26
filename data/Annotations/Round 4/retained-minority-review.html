ald J. Trump","date":"August 06, 2020","type":"executive_order"},"M12":{"president":"George W. Bush","date":"March 05, 2002","type":"memorandum"},"EO25":{"president":"Joseph R. Biden, Jr.","date":"January 16, 2025","type":"executive_order"},"P25":{"president":"Joseph R. Biden, Jr.","date":"August 12, 2024","type":"proclamation"},"M8":{"president":"William J. Clinton","date":"May 16, 2000","type":"memorandum"},"EO26":{"president":"Barack Obama","date":"January 30, 2015","type":"executive_order"},"P34":{"president":"Richard Nixon","date":"April 18, 1973","type":"proclamation"},"L9":{"president":"Harry S Truman","date":"July 02, 1949","type":"letter"},"L4":{"president":"Ronald Reagan","date":"October 21, 1982","type":"letter"},"EO1":{"president":"George W. Bush","date":"November 01, 2001","type":"executive_order"},"P31":{"president":"Richard Nixon","date":"December 16, 1972","type":"proclamation"},"M24":{"president":"Barack Obama","date":"February 21, 2012","type":"memorandum"},"M14":{"president":"Ronald Reagan","date":"July 31, 1986","type":"memorandum"},"EO21":{"president":"Joseph R. Biden, Jr.","date":"January 20, 2021","type":"executive_order"},"EO24":{"president":"Joseph R. Biden, Jr.","date":"May 04, 2023","type":"executive_order"},"M13":{"president":"William J. Clinton","date":"March 04, 1997","type":"memorandum"},"P50":{"president":"Donald J. Trump","date":"August 28, 2020","type":"proclamation"},"P36":{"president":"Dwight D. Eisenhower","date":"March 10, 1959","type":"proclamation"},"M19":{"president":"Jimmy Carter","date":"January 08, 1980","type":"memorandum"},"EO30":{"president":"Barack Obama","date":"December 27, 2010","type":"executive_order"},"P41":{"president":"George W. Bush","date":"June 15, 2006","type":"proclamation"},"P7":{"president":"Ronald Reagan","date":"March 19, 1984","type":"proclamation"}},"docTexts":{"P9":"By the President of the United States of America\n\nA Proclamation\n\nMODIFYING PROCLAMATION No. 3279, RELATING TO IMPORTS OF PETROLEUM AND PETROLEUM PRODUCTS, PROVIDING FOR THE LONG-TERM CONTROL OF IMPORTS OF PETROLEUM AND PETROLEUM PRODUCTS THROUGH A SYSTEM OF LICENSE FEES AND PROVIDING FOR GRADUAL REDUCTION OF LEVELS OF IMPORTS OF CRUDE OIL, UNFINISHED OILS, AND FINISHED PRODUCTS\n\nI am advised by the Administrator of the Federal Energy Administration that certain technical changes to Proclamation No. 3279, as amended, are required. Among these technical changes are the clarification of certain definitions, a provision to eliminate conflict between the Oil Import Control Program and the Mandatory Petroleum Allocation Program, and the establishment of added capacity as the basis for import allocations to new, expanded, and reactivated refineries and petrochemical plants. In addition, the Administrator informs me that lowering the import fee schedule on natural gas products to the level assigned to crude oil will make United States interests more competitive in obtaining this valuable commodity in the world market.\n\nThe Administrator advises me that the changes set forth in this proclamation are consistent with the national security objectives of Proclamation No. 3279, as amended, and recommends that such changes be made.\n\nI agree with the foregoing recommendations and findings of the Administrator.\n\nNow, Therefore, I, Gerald R. Ford, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, as amended, do hereby proclaim that, effective the date of this proclamation, Proclamation No. 3279, as amended, is hereby amended as follows:\n\n1. Subparagraph (2) of paragraph (d) of Section 2 is amended to read as follows:\n\n\"(2) Entries for consumption of imports from Canada by pipeline may be made until midnight, May 15, of the allocation period following the allocation period in which any license authorizing such imports from Canada was issued.\"\n\n2. Subparagraph (3) of paragraph (b) of section (4) is amended to read ass follows:\n\n\"(3) Except for (i)-crude oil or unfinished oils imported under license or licenses for which a fee has been charged, (ii) crude oil sold, bought, or exchanged in order to comply with other Federal Energy Administration regulations, or (iii) crude oil or unfinished oils imported pursuant to specific relief granted pursuant to section 5, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that imported crude oil or unfinished oils other than Canadian imports may be exchanged for domestic crude or unfinished oils if such exchanges are otherwise lawful, are effected on a current basis and reported in advance to the Administrator, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant. Canadian imports may only be exchanged for other Canadian imports, in which case the Canadian imports obtained in the exchange must be processed in the licensee's own facility.\"\n\n3. Subparagraph (1) (i) of paragraph (a) of section 3 is amended to read as follows :\n\n\"(a) (1) Effective May 1, 1973, the Administrator shall, by regulation, establish a system of fees for licenses issued under allocations of imports of crude oil, unfinished oils, and finished products, over the above levels of imports established by section 2 of this proclamation. Such regulations shall require, among other appropriate provisions, that (i) with respect to imports, other than imports from Canada of motor gasoline and finished products, such fees shall be :\n\nFEE SCHEDULE\n\n[Cents per barrel]\n\nMay 1, 1973 \t Nov. 1, 1973 \t May 1, 1974 \t Nov. 1, 1974 \t May 1, 1975 \t Nov. 1, 1975\n\nCrude-------------------------------------------------------------\t 10.5 \t 13.0 \t 15.5 \t 18.0 \t 21.0 \t 21.0 \t Natural gas products-----------------------------------------\t 10.5 \t 13.0 \t 15.5 \t 18.0 \t 21.0 \t 21.0 \t Motor gasoline--------------------------------------------------\t 52.0 \t 54.5 \t 57.0 \t 59.5 \t 63.0 \t 63.0 \t All other finished products and unfinished oils (except ethane, propane, butanes, and asphalt) ------\t 15.0 \t 20.0 \t 30.0 \t 42.0 \t 52.0 \t 63.0\n\n4. A new subparagraph, (4), is added to paragraph (a) of section 3 to read as follows:\n\n\"(4) Persons seeking to import natural gas products under a duly issued natural gas products license shall certify the country of origin to the appropriate customs officer at the port of entry. Such natural gas products may be commingled with crude oil or other unfinished oils for purposes of transportation and may be reseparated prior to importation or imported as a mixture; Provided, that the importer certifies the volume of natural gas products contained.\"\n\n5. Paragraph (b) of section 3 thereof, is amended by inserting a new sentence between the first and second sentences to read as follows: \"In the event that such bond is terminated or the face value of the bond is reduced below the outstanding liability of licenses issued pursuant to the bond, the Administrator shall immediately revoke all licenses issued pursuant to the bond.\"\n\n6. The fifth sentence of subparagraph (1) of paragraph (b) of section 4 is amended to read as follows: \"Such allocations shall not exceed 75 percent of estimated refinery capacity or the percentage of petrochemical plant capacity applicable.\"\n\n7. Subparagraphs (2), (3) and (4) of paragraph (g) of section 15 are amended to read as follows:\n\n\"(2) `Gasoline' means a refined petroleum distillate, including naphtha, jet fuel, or other petroleum oils, (but not benzene which meets the ASTM distillation standards for nitration grade or cumene, ethylbenzene, isoprene, meta-xylene, ortho-xylene or para-xylene having a purity of 95 percent or more by weight) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, and having a boiling range at atmospheric pressure which falls completely or in part between 80° F and 400° F.\n\n\"(3) `Kerosene' means any jet fuel, diesel fuel, fuel oil, or other petroleum oils derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure which falls completely or in part between 400° F and 550° F.\n\n\"(4) 'Distillate fuel oil' means any fuel oil, gas oil, topped crude oil, or other petroleum oils (except refined petroleum wax) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure which falls completely or in part between 550° F and 1200° F.\"\n\n8. Section 12 is amended to read as follows :\n\n\"12. Commitments and obligations contained in long term allocations heretofore made shall be unimpaired by this proclamation or regulations issued thereunder.\"\n\nIn Witness Whereof, I have hereunto set my hand this twenty-seventh day of September, in the year of our Lord nineteen hundred seventy-four, and of the Independence of the United States of America the one hundred ninety-ninth.\n\nGERALD R. FORD","EO28":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), the National Emergencies Act (50 U.S.C. 1601 et seq.) (NEA), and section 301 of title 3, United States Code,\n\nI, Joseph R. Biden Jr., President of the United States of America, hereby expand the scope of the national emergency declared in Executive Order 13873 of May 15, 2019 (Securing the Information and Communications Technology and Services Supply Chain), and further addressed with additional measures in Executive Order 14034 of June 9, 2021 (Protecting Americans' Sensitive Data from Foreign Adversaries). The continuing effort of certain countries of concern to access Americans' sensitive personal data and United States Government-related data constitutes an unusual and extraordinary threat, which has its source in whole or substantial part outside the United States, to the national security and foreign policy of the United States. Access to Americans' bulk sensitive personal data or United States Government-related data increases the ability of countries of concern to engage in a wide range of malicious activities. Countries of concern can rely on advanced technologies, including artificial intelligence (AI), to analyze and manipulate bulk sensitive personal data to engage in espionage, influence, kinetic, or cyber operations or to identify other potential strategic advantages over the United States. Countries of concern can also use access to bulk data sets to fuel the creation and refinement of AI and other advanced technologies, thereby improving their ability to exploit the underlying data and exacerbating the national security and foreign policy threats. In addition, access to some categories of sensitive personal data linked to populations and locations associated with the Federal Government—including the military—regardless of volume, can be used to reveal insights about those populations and locations that threaten national security. The growing exploitation of Americans' sensitive personal data threatens the development of an international technology ecosystem that protects our security, privacy, and human rights.\n\nAccordingly, to address this threat and to take further steps with respect to the national emergency declared in Executive Order 13873, it is hereby ordered that:\n\nSection 1. Policy. It is the policy of the United States to restrict access by countries of concern to Americans' bulk sensitive personal data and United States Government-related data when such access would pose an unacceptable risk to the national security of the United States. At the same time, the United States continues to support open, global, interoperable, reliable, and secure flows of data across borders, as well as maintaining vital consumer, economic, scientific, and trade relationships that the United States has with other countries.\n\nThe continuing effort by countries of concern to access Americans' bulk sensitive personal data and United States Government-related data threatens the national security and foreign policy of the United States. Such countries' governments may seek to access and use sensitive personal data in a manner that is not in accordance with democratic values, safeguards for privacy, and other human rights and freedoms. Such countries' approach stands in sharp contrast to the practices of democracies with respect to sensitive personal data and principles reflected in the Organisation for Economic Co-operation and Development Declaration on Government Access to Personal Data Held by Private Sector Entities. Unrestricted transfers of Americans' bulk sensitive personal data and United States Government-related data to such countries of concern may therefore enable them to exploit such data for a variety of nefarious purposes, including to engage in malicious cyber-enabled activities. Countries of concern can use their access to Americans' bulk sensitive personal data and United States Government-related data to track and build profiles on United States individuals, including Federal employees and contractors, for illicit purposes, including blackmail and espionage. Access to Americans' bulk sensitive personal data and United States Government-related data by countries of concern through data brokerages, third-party vendor agreements, employment agreements, investment agreements, or other such arrangements poses particular and unacceptable risks to our national security given that these arrangements often can provide countries of concern with direct and unfettered access to Americans' bulk sensitive personal data. Countries of concern can use access to United States persons' bulk sensitive personal data and United States Government-related data to collect information on activists, academics, journalists, dissidents, political figures, or members of non-governmental organizations or marginalized communities in order to intimidate such persons; curb dissent or political opposition; otherwise limit freedoms of expression, peaceful assembly, or association; or enable other forms of suppression of civil liberties.\n\nThis risk of access to Americans' bulk sensitive personal data and United States Government-related data is not limited to direct access by countries of concern. Entities owned by, and entities or individuals controlled by or subject to the jurisdiction or direction of, a country of concern may enable the government of a country of concern to indirectly access such data. For example, a country of concern may have cyber, national security, or intelligence laws that, without sufficient legal safeguards, obligate such entities and individuals to provide that country's intelligence services access to Americans' bulk sensitive personal data and United States Government-related data.\n\nThese risks may be exacerbated when countries of concern use bulk sensitive personal data to develop AI capabilities and algorithms that, in turn, enable the use of large datasets in increasingly sophisticated and effective ways to the detriment of United States national security. Countries of concern can use AI to target United States persons for espionage or blackmail by, for example, recognizing patterns across multiple unrelated datasets to identify potential individuals whose links to the Federal Government would be otherwise obscured in a single dataset.\n\nWhile aspects of this threat have been addressed in previous executive actions, such as Executive Order 13694 of April 1, 2015 (Blocking the Property of Certain Persons Engaging in Significant Malicious Cyber-Enabled Activities), as amended, additional steps need to be taken to address this threat.\n\nAt the same time, the United States is committed to promoting an open, global, interoperable, reliable, and secure Internet; protecting human rights online and offline; supporting a vibrant, global economy by promoting cross-border data flows required to enable international commerce and trade; and facilitating open investment. To ensure that the United States continues to meet these important policy objectives, this order does not authorize the imposition of generalized data localization requirements to store Americans' bulk sensitive personal data or United States Government-related data within the United States or to locate computing facilities used to process Americans' bulk sensitive personal data or United States Government-related data within the United States. This order also does not broadly prohibit United States persons from conducting commercial transactions, including exchanging financial and other data as part of the sale of commercial goods and services, with entities and individuals located in or subject to the control, direction, or jurisdiction of countries of concern, or impose measures aimed at a broader decoupling of the substantial consumer, economic, scientific, and trade relationships that the United States has with other countries. In addition, my Administration has made commitments to increase public access to the results of taxpayer-funded scientific research, the sharing and interoperability of electronic health information, and patient access to their data. The national security restrictions established in this order are specific, carefully calibrated actions to minimize the risks associated with access to bulk sensitive personal data and United States Government-related data by countries of concern while minimizing disruption to commercial activity. This order shall be implemented consistent with these policy objectives, including by tailoring any regulations issued and actions taken pursuant to this order to address the national security threat posed by access to Americans' bulk sensitive personal data and United States Government-related data by countries of concern.\n\nSec. 2. Prohibited and Restricted Transactions. (a) To assist in addressing the national emergency described in this order, the Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, shall issue, subject to public notice and comment, regulations that prohibit or otherwise restrict United States persons from engaging in any acquisition, holding, use, transfer, transportation, or exportation of, or dealing in, any property in which a foreign country or national thereof has any interest (transaction), where the transaction:\n\n(i) involves bulk sensitive personal data or United States Government-related data, as further defined by regulations issued by the Attorney General pursuant to this section;\n\n(ii) is a member of a class of transactions that has been determined by the Attorney General, in regulations issued by the Attorney General pursuant to this section, to pose an unacceptable risk to the national security of the United States because the transactions may enable countries of concern or covered persons to access bulk sensitive personal data or United States Government-related data in a manner that contributes to the national emergency described in this order;\n\n(iii) was initiated, is pending, or will be completed after the effective date of the regulations issued by the Attorney General pursuant to this section;\n\n(iv) does not qualify for an exemption provided in, or is not authorized by a license issued pursuant to, the regulations issued by the Attorney General pursuant to this section; and\n\n(v) is not, as defined by regulations issued by the Attorney General pursuant to this section, ordinarily incident to and part of the provision of financial services, including banking, capital markets, and financial insurance services, or required for compliance with any Federal statutory or regulatory requirements, including any regulations, guidance, or orders implementing those requirements.\n\n(b) The Attorney General, in consultation with the heads of relevant agencies, is authorized to take such actions, including the promulgation of rules and regulations, and to employ all other powers granted to the President by IEEPA, as may be necessary or appropriate to carry out the purposes of this order. Executive departments and agencies (agencies) are directed to take all appropriate measures within their authority to implement the provisions of this order.\n\n(c) Within 180 days of the date of this order, the Attorney General, in coordination with the Secretary of Homeland Security, and in consultation with the heads of relevant agencies, shall publish the proposed rule described in subsection (a) of this section for notice and comment. This proposed rule shall:\n\n(i) identify classes of transactions that meet the criteria specified in subsection (a)(ii) of this section that are to be prohibited (prohibited transactions);\n\n(ii) identify classes of transactions that meet the criteria specified in subsection (a)(ii) of this section and for which the Attorney General determines that security requirements established by the Secretary of Homeland Security, through the Director of the Cybersecurity and Infrastructure Security Agency, in accordance with the process described in subsection (d) of this section, adequately mitigate the risk of access by countries of concern or covered persons to bulk sensitive personal data or United States Government-related data (restricted transactions);\n\n(iii) identify, with the concurrence of the Secretary of State and the Secretary of Commerce, countries of concern and, as appropriate, classes of covered persons for the purposes of this order;\n\n(iv) establish, as appropriate, mechanisms to provide additional clarity to persons affected by this order and any regulations implementing this order (including by designations of covered persons and licensing decisions);\n\n(v) establish a process to issue (including to modify or rescind), in concurrence with the Secretary of State, the Secretary of Commerce, and the Secretary of Homeland Security, and in consultation with the heads of other relevant agencies, as appropriate, licenses authorizing transactions that would otherwise be prohibited transactions or restricted transactions;\n\n(vi) further define the terms identified in section 7 of this order and any other terms used in this order or any regulations implementing this order;\n\n(vii) address, as appropriate, coordination with other United States Government entities, such as the Committee on Foreign Investment in the United States, the Office of Foreign Assets Control within the Department of the Treasury, the Bureau of Industry and Security within the Department of Commerce, and other entities implementing relevant programs, including those implementing Executive Order 13873; Executive Order 14034; and Executive Order 13913 of April 4, 2020 (Establishing the Committee for the Assessment of Foreign Participation in the United States Telecommunications Services Sector); and\n\n(viii) address the need for, as appropriate, recordkeeping and reporting of transactions to inform investigative, enforcement, and regulatory efforts.\n\n(d) The Secretary of Homeland Security, acting through the Director of the Cybersecurity and Infrastructure Security Agency, shall, in coordination with the Attorney General and in consultation with the heads of relevant agencies, propose, seek public comment on, and publish security requirements that address the unacceptable risk posed by restricted transactions, as identified by the Attorney General pursuant to this section. These requirements shall be based on the Cybersecurity and Privacy Frameworks developed by the National Institute of Standards and Technology.\n\n(i) The Secretary of Homeland Security, acting through the Director of the Cybersecurity and Infrastructure Security Agency, shall, in coordination with the Attorney General, issue any interpretive guidance regarding the security requirements.\n\n(ii) The Attorney General shall, in coordination with the Secretary of Homeland Security acting through the Director of the Cybersecurity and Infrastructure Security Agency, issue enforcement guidance regarding the security requirements.\n\n(e) The Secretary of Homeland Security, in coordination with the Attorney General, is hereby authorized to take such actions, including promulgating rules, regulations, standards, and requirements; issuing interpretive guidance; and employing all other powers granted to the President by IEEPA as may be necessary to carry out the purposes described in subsection (d) of this section.\n\n(f) In exercising the authority delegated in subsection (b) of this section, the Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, may, in addition to the rulemaking directed in subsection (c) of this section, propose one or more regulations to further implement this section, including to identify additional classes of prohibited transactions; to identify additional classes of restricted transactions; with the concurrence of the Secretary of State and the Secretary of Commerce, to identify new or remove existing countries of concern and, as appropriate, classes of covered persons for the purposes of this order; and to establish a mechanism for the Attorney General to monitor whether restricted transactions comply with the security requirements established under subsection (d) of this section.\n\n(g) Any proposed regulations implementing this section:\n\n(i) shall reflect consideration of the nature of the class of transaction involving bulk sensitive personal data or United States Government-related data, the volume of bulk sensitive personal data involved in the transaction, and other factors, as appropriate;\n\n(ii) shall establish thresholds and due diligence requirements for entities to use in assessing whether a transaction is a prohibited transaction or a restricted transaction;\n\n(iii) shall not establish generalized data localization requirements to store bulk sensitive personal data or United States Government-related data within the United States or to locate computing facilities used to process bulk sensitive personal data or United States Government-related data within the United States;\n\n(iv) shall account for any legal obligations applicable to the United States Government relating to public access to the results of taxpayer-funded scientific research, the sharing and interoperability of electronic health information, and patient access to their data; and\n\n(v) shall not address transactions to the extent that they involve types of human 'omic data other than human genomic data before the submission of the report described in section 6 of this order.\n\n(h) The prohibitions promulgated pursuant to this section apply except to the extent provided by law, including by statute or in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of the applicable regulations directed by this order.\n\n(i) Any transaction or other activity that has the purpose of evading or avoiding, causes a violation of, or attempts to violate any of the prohibitions promulgated pursuant to this section is prohibited.\n\n(j) Any conspiracy formed to violate any of the prohibitions promulgated pursuant to this section is prohibited.\n\n(k) In regulations issued by the Attorney General under this section, the Attorney General may prohibit United States persons from knowingly directing transactions if such transactions would be prohibited transactions under regulations issued pursuant to this order if engaged in by a United States person.\n\n(l) The Attorney General may, consistent with applicable law, redelegate any of the authorities conferred on the Attorney General pursuant to this section within the Department of Justice. The Secretary of Homeland Security may, consistent with applicable law, redelegate any of the authorities conferred on the Secretary of Homeland Security pursuant to this section within the Department of Homeland Security.\n\n(m) The Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, is hereby authorized to submit recurring and final reports to the Congress related to this order, consistent with section 401(c) of the NEA (50 U.S.C. 1641(c)) and section 204(c) of IEEPA (50 U.S.C. 1703(c)).\n\nSec. 3. Protecting Sensitive Personal Data. (a) Access to bulk sensitive personal data and United States Government-related data by countries of concern can be enabled through the transmission of data via network infrastructure that is subject to the jurisdiction or control of countries of concern. The risk of access to this data by countries of concern can be, and sometime is, exacerbated where the data transits a submarine cable that is owned or operated by persons owned by, controlled by, or subject to the jurisdiction or direction of a country of concern, or that connects to the United States and terminates in the jurisdiction of a country of concern. Additionally, the same risk of access by a country of concern is further exacerbated in instances where a submarine cable is designed, built, and operated for the express purpose of transferring data, including bulk sensitive personal data or United States Government-related data, to a specific data center located in a foreign jurisdiction. To address this threat, the Committee for the Assessment of Foreign Participation in the United States Telecommunications Services Sector (Committee) shall, to the extent consistent with its existing authority and applicable law:\n\n(i) prioritize, for purposes of and in reliance on the process set forth in section 6 of Executive Order 13913, the initiation of reviews of existing licenses for submarine cable systems that are owned or operated by persons owned by, controlled by, or subject to the jurisdiction or direction of a country of concern, or that terminate in the jurisdiction of a country of concern;\n\n(ii) issue policy guidance, in consultation with the Committee's Advisors as defined in section 3(d) of Executive Order 13913, regarding the Committee's reviews of license applications and existing licenses, including the assessment of third-party risks regarding access to data by countries of concern; and\n\n(iii) address, on an ongoing basis, the national security and law enforcement risks related to access by countries of concern to bulk sensitive personal data described in this order that may be presented by any new application or existing license reviewed by the Committee to land or operate a submarine cable system, including by updating the Memorandum of Understanding required under section 11 of Executive Order 13913 and by revising the Committee's standard mitigation measures, with the approval of the Committee's Advisors, which may include, as appropriate, any of the security requirements contemplated by section 2(d) of this order.\n\n(b) Entities in the United States healthcare market can access bulk sensitive personal data, including personal health data and human genomic data, through partnerships and agreements with United States healthcare providers and research institutions. Even if such data is anonymized, pseudonymized, or de-identified, advances in technology, combined with access by countries of concern to large data sets, increasingly enable countries of concern that access this data to re-identify or de-anonymize data, which may reveal the exploitable health information of United States persons. While the United States supports open scientific data and sample sharing to accelerate research and development through international cooperation and collaboration, the following additional steps must be taken to protect United States persons' sensitive personal health data and human genomic data from the threat identified in this order:\n\n(i) The Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall consider taking steps, including issuing regulations, guidance, or orders, as appropriate and consistent with the legal authorities authorizing relevant Federal assistance programs, to prohibit the provision of assistance that enables access by countries of concern or covered persons to United States persons' bulk sensitive personal data, including personal health data and human genomic data, or to impose mitigation measures with respect to such assistance, which may be consistent with the security requirements adopted under section 2(d) of this order, on the recipients of Federal assistance to address this threat. The Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall, in consultation with each other, develop and publish guidance to assist United States research entities in ensuring protection of their bulk sensitive personal data.\n\n(ii) Within 1 year of the date of this order, the Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall jointly submit a report to the President through the Assistant to the President for National Security Affairs (APNSA) detailing their progress in implementing this subsection.\n\n(c) Entities in the data brokerage industry enable access to bulk sensitive personal data and United States Government-related data by countries of concern and covered persons. These entities pose a particular risk of contributing to the national emergency described in this order because they routinely engage in the collection, assembly, evaluation, and dissemination of bulk sensitive personal data and of the subset of United States Government-related data regarding United States consumers. The Director of the Consumer Financial Protection Bureau (CFPB) is encouraged to consider taking steps, consistent with CFPB's existing legal authorities, to address this aspect of the threat and to enhance compliance with Federal consumer protection law, including by continuing to pursue the rulemaking proposals that CFPB identified at the September 2023 Small Business Advisory Panel for Consumer Reporting Rulemaking.\n\nSec. 4. Assessing the National Security Risks Arising from Prior Transfers of United States Persons' Bulk Sensitive Personal Data. Within 120 days of the effective date of the regulations issued pursuant to section 2(c) of this order, the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, in consultation with the heads of relevant agencies, shall recommend to the APNSA appropriate actions to detect, assess, and mitigate national security risks arising from prior transfers of United States persons' bulk sensitive personal data to countries of concern. Within 150 days of the effective date of the regulations issued pursuant to section 2(c) of this order, the APNSA shall review these recommendations and, as appropriate, consult with the Attorney General, the Secretary of Homeland Security, and the heads of relevant agencies on implementing the recommendations consistent with applicable law.\n\nSec. 5. Report to the President. (a) Within 1 year of the effective date of the regulations issued pursuant to section 2(c) of this order, the Attorney General, in consultation with the Secretary of State, the Secretary of the Treasury, the Secretary of Commerce, and the Secretary of Homeland Security, shall submit a report to the President through the APNSA assessing, to the extent practicable:\n\n(i) the effectiveness of the measures imposed under this order in addressing threats to the national security of the United States described in this order; and\n\n(ii) the economic impact of the implementation of this order, including on the international competitiveness of United States industry.\n\n(b) In preparing the report described in subsection (a) of this section, the Attorney General shall solicit and consider public comments concerning the economic impact of this order.\n\nSec. 6. Assessing Risks Associated with Human 'omic Data. Within 120 days of the date of this order, the APNSA, the Assistant to the President and Director of the Domestic Policy Council, the Director of the Office of Science and Technology Policy, and the Director of the Office of Pandemic Preparedness and Response Policy, in consultation with the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, the Director of the National Science Foundation, the Director of National Intelligence, and the Director of the Federal Bureau of Investigation, shall submit a report to the President, through the APNSA, assessing the risks and benefits of regulating transactions involving types of human 'omic data other than human genomic data, such as human proteomic data, human epigenomic data, and human metabolomic data, and recommending the extent to which such transactions should be regulated pursuant to section 2 of this order. This report and recommendation shall consider the risks to United States persons and national security, as well as the economic and scientific costs of regulating transactions that provide countries of concern or covered persons access to these data types.\n\nSec. 7. Definitions. For purposes of this order:\n\n(a) The term \"access\" means logical or physical access, including the ability to obtain, read, copy, decrypt, edit, divert, release, affect, alter the state of, or otherwise view or receive, in any form, including through information technology systems, cloud computing platforms, networks, security systems, equipment, or software.\n\n(b) The term \"bulk\" means an amount of sensitive personal data that meets or exceeds a threshold over a set period of time, as specified in regulations issued by the Attorney General pursuant to section 2 of this order.\n\n(c) The term \"country of concern\" means any foreign government that, as determined by the Attorney General pursuant to section 2(c)(iii) or 2(f) of this order, has engaged in a long-term pattern or serious instances of conduct significantly adverse to the national security of the United States or the security and safety of United States persons, and poses a significant risk of exploiting bulk sensitive personal data or United States Government-related data to the detriment of the national security of the United States or the security and safety of United States persons, as specified in regulations issued by the Attorney General pursuant to section 2 of this order.\n\n(d) The term \"covered person\" means an entity owned by, controlled by, or subject to the jurisdiction or direction of a country of concern; a foreign person who is an employee or contractor of such an entity; a foreign person who is an employee or contractor of a country of concern; a foreign person who is primarily resident in the territorial jurisdiction of a country of concern; or any person designated by the Attorney General as being owned or controlled by or subject to the jurisdiction or direction of a country of concern, as acting on behalf of or purporting to act on behalf of a country of concern or other covered person, or as knowingly causing or directing, directly or indirectly, a violation of this order or any regulations implementing this order.\n\n(e) The term \"covered personal identifiers\" means, as determined by the Attorney General in regulations issued pursuant to section 2 of this order, specifically listed classes of personally identifiable data that are reasonably linked to an individual, and that—whether in combination with each other, with other sensitive personal data, or with other data that is disclosed by a transacting party pursuant to the transaction and that makes the personally identifiable data exploitable by a country of concern—could be used to identify an individual from a data set or link data across multiple data sets to an individual. The term \"covered personal identifiers\" does not include:\n\n(i) demographic or contact data that is linked only to another piece of demographic or contact data (such as first and last name, birth date, birthplace, zip code, residential street or postal address, phone number, and email address and similar public account identifiers); or\n\n(ii) a network-based identifier, account-authentication data, or call-detail data that is linked only to another network-based identifier, account-authentication data, or call-detail data for the provision of telecommunications, networking, or similar services.\n\n(f) The term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization.\n\n(g) The term \"foreign person\" means any person that is not a United States person.\n\n(h) The term \"human genomic data\" refers to data representing the nucleic acid sequences that constitute the entire set or a subset of the genetic instructions found in a cell.\n\n(i) The term \"human 'omic data\" means data generated from humans that characterizes or quantifies human biological molecule(s), such as human genomic data, epigenomic data, proteomic data, transcriptomic data, microbiomic data, or metabolomic data, as further defined by regulations issued by the Attorney General pursuant to section 2 of this order, which may be informed by the report described in section 6 of this order.\n\n(j) The term \"person\" means an individual or entity.\n\n(k) The term \"relevant agencies\" means the Department of State, the Department of the Treasury,","P52":"By the President of the United States of America\n\nA Proclamation\n\nWhereas the Eighth Meeting of Consultation of Ministers of Foreign Affairs, Serving as Organ of Consultation in Application of the Inter-American Treaty of Reciprocal Assistance, in its Final Act resolved that the present Government of Cuba is incompatible with the principles and objectives of the Inter-American system; and, in light of the subversive offensive of Sino-Soviet Communism with which the Government of Cuba is publicly aligned, urged the member states to take those steps that they may consider appropriate for their individual and collective self-defense;\n\nWhereas the Congress of the United States, in section 620(a) of the Foreign Assistance Act of 1961 (75 Stat. 445), as amended, has authorized the President to establish and maintain an embargo upon all trade between the United States and Cuba; and\n\nWhereas the United States, in accordance with its international obligations, is prepared to take all necessary actions to promote national and hemispheric security by isolating the present Government of Cuba and thereby reducing the threat posed by its alignment with the communist powers:\n\nNow, Therefore, I, John F. Kennedy, President of the United States of America, acting under the authority of section 620(a) of the Foreign Assistance Act of 1961 (75 Stat. 445), as amended, do\n\n1. Hereby proclaim an embargo upon trade between the United States and Cuba in accordance with paragraphs 2 and 3 of this proclamation.\n\n2. Hereby prohibit, effective 12:01 A.M., Eastern Standard Time, February 7, 1962, the importation into the United States of all goods of Cuban origin and all goods imported from or through Cuba; and I hereby authorize and direct the Secretary of the Treasury to carry out such prohibition, to make such exceptions thereto, by license or otherwise, as he determines to be consistent with the effective operation of the embargo hereby proclaimed, and to promulgate such rules and regulations as may be necessary to perform such functions.\n\n3. AND FURTHER, I do hereby direct the Secretary of Commerce, under the provisions of the Export Control Act of 1949, as amended (50 U.S.C. App. 2021-2032), to continue to carry out the prohibition of all exports from the United States to Cuba, and I hereby authorize him, under that Act, to continue, make, modify, or revoke exceptions from such prohibition.\n\nIn Witness Whereof, I have hereunto set my hand and caused the seal of the United States of America to be affixed.\n\nDONE at the City of Washington this third day of February, in the year of our Lord nineteen hundred and sixty-two, and of the Independence of the United States of America the one hundred and eighty-sixth.\n\nJOHN F. KENNEDY\n\nBy the President:\n\nDean Rusk,\n\nSecretary of State","M28":"[ Released December 8, 1956. Dated December 6, 1956 ]\n\nMemorandum to the Heads of Executive Departments and Establishments:\n\nSubject: Hungarian Refugees\n\nPursuant to the authority vested in me by Section 401 of the Mutual Security Act of 1954, as amended, it is hereby determined that the use of funds, available under said Act, for the purpose of carrying out the program of asylum for refugees from Hungary which was announced by my statement of December 1, 1956, is important to the security of the United States and that assistance to such refugees will contribute to the security of the United States.\n\nThe Department of State, the Department of Defense, the International Cooperation Administration, and any other Executive Agencies which may participate in this program are authorized and directed to take such action and make such expenditures as may be necessary to perform such services and carry out such activities as are requested by my Representative for Hungarian Refugee Relief, and to be reimbursed from funds available under said Section for additional costs incurred and not otherwise provided for, to the extent agreed upon between such Agencies and ICA and approved by the Director of the Bureau of the Budget. It is my desire that the program be carried out forthwith and without awaiting completion of arrangements for reimbursements.\n\nThe Director of the International Cooperation Administration is requested on my behalf to give appropriate notices, pursuant to Section 513 of the Mutual Security Act of 1954, as amended, to the Chairman of the Senate Committee on Foreign Relations, the Chairman of the House Committee on Foreign Affairs, and the respective Chairmen of the Senate and House Committees on Armed Services.\n\nDWIGHT D. EISENHOWER","EO36":"This order prescribes a uniform system for classifying, safeguarding, and declassifying national security information. Our democratic principles require that the American people be informed of the activities of their Government. Also, our Nation's progress depends on the free flow of information. Nevertheless, throughout our history, the national interest has required that certain information be maintained in confidence in order to protect our citizens, our democratic institutions, and our participation within the community of nations. Protecting information critical to our Nation's security remains a priority. In recent years, however, dramatic changes have altered, although not eliminated, the national security threats that we confront. These changes provide a greater opportunity to emphasize our commitment to open Government.\n\nNow, Therefore, by the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nPart 1 Original Classification\n\nSection 1.1. Definitions. For purposes of this order:\n\n(a) \"National security\" means the national defense or foreign relations of the United States.\n\n(b) \"Information\" means any knowledge that can be communicated or documentary material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. \"Control\" means the authority of the agency that originates information, or its successor in function, to regulate access to the information.\n\n(c) \"Classified national security information\" (hereafter \"classified information\") means information that has been determined pursuant to this order or any predecessor order to require protection against unauthorized disclosure and is marked to indicate its classified status when in documentary form.\n\n(d) \"Foreign Government Information\" means:\n\n(1) information provided to the United States Government by a foreign government or governments, an international organization of governments, or any element thereof, with the expectation that the information, the source of the information, or both, are to be held in confidence;\n\n(2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments, or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence; or\n\n(3) information received and treated as \"Foreign Government Information\" under the terms of a predecessor order.\n\n(e) \"Classification\" means the act or process by which information is determined to be classified information.\n\n(f) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure.\n\n(g) \"Original classification authority\" means an individual authorized in writing, either by the President, or by agency heads or other officials designated by the President, to classify information in the first instance.\n\n(h) \"Unauthorized disclosure\" means a communication or physical transfer of classified information to an unauthorized recipient.\n\n(i) \"Agency\" means any \"Executive agency,\" as defined in 5 U.S.C. 105, and any other entity within the executive branch that comes into the possession of classified information.\n\n(j) \"Senior agency official\" means the official designated by the agency head under section 5.6(c) of this order to direct and administer the agency's program under which information is classified, safeguarded, and declassified.\n\n(k) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation that the information or relationship, or both, are to be held in confidence.\n\n(l) \"Damage to the national security\" means harm to the national defense or foreign relations of the United States from the unauthorized disclosure of information, to include the sensitivity, value, and utility of that information.\n\nSec. 1.2. Classification Standards. (a) Information may be originally classified under the terms of this order only if all of the following conditions are met:\n\n(1) an original classification authority is classifying the information;\n\n(2) the information is owned by, produced by or for, or is under the control of the United States Government;\n\n(3) the information falls within one or more of the categories of information listed in section 1.5 of this order; and\n\n(4) the original classification authority determines that the unauthorized disclosure of the information reasonably could be expected to result in damage to the national security and the original classification authority is able to identify or describe the damage.\n\n(b) If there is significant doubt about the need to classify information, it shall not be classified. This provision does not:\n\n(1) amplify or modify the substantive criteria or procedures for classification; or\n\n(2) create any substantive or procedural rights subject to judicial review.\n\n(c) Classified information shall not be declassified automatically as a result of any unauthorized disclosure of identical or similar information.\n\nSec. 1.3. Classification Levels. (a) Information may be classified at one of the following three levels:\n\n(1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security that the original classification authority is able to identify or describe.\n\n(2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security that the original classification authority is able to identify or describe.\n\n(3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security that the original classification authority is able to identify or describe.\n\n(b) Except as otherwise provided by statute, no other terms shall be used to identify United States classified information.\n\n(c) If there is significant doubt about the appropriate level of classification, it shall be classified at the lower level.\n\nSec. 1.4. Classification Authority. (a) The authority to classify information originally may be exercised only by:\n\n(1) the President;\n\n(2) agency heads and officials designated by the President in the Federal Register; or\n\n(3) United States Government officials delegated this authority pursuant to paragraph (c), below.\n\n(b) Officials authorized to classify information at a specified level are also authorized to classify information at a lower level.\n\n(c) Delegation of original classification authority.\n\n(1) Delegations of original classification authority shall be limited to the minimum required to administer this order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority.\n\n(2) \"Top Secret\" original classification authority may be delegated only by the President or by an agency head or official designated pursuant to paragraph (a)(2), above.\n\n(3) \"Secret\" or \"Confidential\" original classification authority may be delegated only by the President; an agency head or official designated pursuant to paragraph (a)(2), above; or the senior agency official, provided that official has been delegated \"Top Secret\" original classification authority by the agency head.\n\n(4) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this order. Each delegation shall identify the official by name or position title.\n\n(d) Original classification authorities must receive training in original classification as provided in this order and its implementing directives.\n\n(e) Exceptional cases. When an employee, contractor, licensee, certificate holder, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this order and its implementing directives. The information shall be transmitted promptly as provided under this order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within 30 days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office. The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination.\n\nSec. 1.5. Classification Categories.\n\nInformation may not be considered for classification unless it concerns:\n\n(a) military plans, weapons systems, or operations;\n\n(b) foreign government information;\n\n(c) intelligence activities (including special activities), intelligence sources or methods, or cryptology;\n\n(d) foreign relations or foreign activities of the United States, including confidential sources;\n\n(e) scientific, technological, or economic matters relating to the national security;\n\n(f) United States Government programs for safeguarding nuclear materials or facilities; or\n\n(g) vulnerabilities or capabilities of systems, installations, projects or plans relating to the national security.\n\nSec. 1.6. Duration of Classification. (a) At the time of original classification, the original classification authority shall attempt to establish a specific date or event for declassification based upon the duration of the national security sensitivity of the information. The date or event shall not exceed the time frame in paragraph (b), below.\n\n(b) If the original classification authority cannot determine an earlier specific date or event for declassification, information shall be marked for declassification 10 years from the date of the original decision, except as provided in paragraph (d), below.\n\n(c) An original classification authority may extend the duration of classification or reclassify specific information for successive periods not to exceed 10 years at a time if such action is consistent with the standards and procedures established under this order. This provision does not apply to information contained in records that are more than 25 years old and have been determined to have permanent historical value under title 44, United States Code. (d) At the time of original classification, the original classification authority may exempt from declassification within 10 years specific information, the unauthorized disclosure of which could reasonably be expected to cause damage to the national security for a period greater than that provided in paragraph (b), above, and the release of which could reasonably be expected to:\n\n(1) reveal an intelligence source, method, or activity, or a cryptologic system or activity;\n\n(2) reveal information that would assist in the development or use of weapons of mass destruction;\n\n(3) reveal information that would impair the development or use of technology within a United States weapons system;\n\n(4) reveal United States military plans, or national security emergency preparedness plans;\n\n(5) reveal foreign government information;\n\n(6) damage relations between the United States and a foreign government, reveal a confidential source, or seriously undermine diplomatic activities that are reasonably expected to be ongoing for a period greater than that provided in paragraph (b), above;\n\n(7) impair the ability of responsible United States Government officials to protect the President, the Vice President, and other individuals for whom protection services, in the interest of national security, are authorized; or\n\n(8) violate a statute, treaty, or international agreement.\n\n(e) Information marked for an indefinite duration of classification under predecessor orders, for example, \"Originating Agency's Determination Required,\" or information classified under predecessor orders that contains no declassification instructions shall be declassified in accordance with part 3 of this order.\n\nSec. 1.7. Identification and Markings. (a) At the time of original classification, the following shall appear on the face of each classified document, or shall be applied to other classified media in an appropriate manner:\n\n(1) one of the three classification levels defined in section 1.3 of this order;\n\n(2) the identity, by name or personal identifier and position, of the original classification authority;\n\n(3) the agency and office of origin, if not otherwise evident;\n\n(4) declassification instructions, which shall indicate one of the following:\n\n(A) the date or event for declassification, as prescribed in section 1.6(a) or section 1.6(c); or\n\n(B) the date that is 10 years from the date of original classification, as prescribed in section 1.6(b); or\n\n(C) the exemption category from declassification, as prescribed in section 1.6(d); and\n\n(5) a concise reason for classification which, at a minimum, cites the applicable classification categories in section 1.5 of this order.\n\n(b) Specific information contained in paragraph (a), above, may be excluded if it would reveal additional classified information.\n\n(c) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, which portions are exempt from declassification under section 1.6(d) of this order, and which portions are unclassified. In accordance with standards prescribed in directives issued under this order, the Director of the Information Security Oversight Office may grant waivers of this requirement for specified classes of documents or information. The Director shall revoke any waiver upon a finding of abuse.\n\n(d) Markings implementing the provisions of this order, including abbreviations and requirements to safeguard classified working papers, shall conform to the standards prescribed in implementing directives issued pursuant to this order.\n\n(e) Foreign government information shall retain its original classification markings or shall be assigned a U.S. classification that provides a degree of protection at least equivalent to that required by the entity that furnished the information.\n\n(f) Information assigned a level of classification under this or predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Whenever such information is used in the derivative classification process or is reviewed for possible declassification, holders of such information shall coordinate with an appropriate classification authority for the application of omitted markings.\n\n(g) The classification authority shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document.\n\nSec. 1.8. Classification Prohibitions and Limitations. (a) In no case shall information be classified in order to:\n\n(1) conceal violations of law, inefficiency, or administrative error;\n\n(2) prevent embarrassment to a person, organization, or agency;\n\n(3) restrain competition; or\n\n(4) prevent or delay the release of information that does not require protection in the interest of national security.\n\n(b) Basic scientific research information not clearly related to the national security may not be classified.\n\n(c) Information may not be reclassified after it has been declassified and released to the public under proper authority.\n\n(d) Information that has not previously been disclosed to the public under proper authority may be classified or reclassified after an agency has received a request for it under the Freedom of Information Act (5 U.S.C. 552) or the Privacy Act of 1974 (5 U.S.C. 552a), or the mandatory review provisions of section 3.6 of this order only if such classification meets the requirements of this order and is accomplished on a document-by-document basis with the personal participation or under the direction of the agency head, the deputy agency head, or the senior agency official designated under section 5.6 of this order. This provision does not apply to classified information contained in records that are more than 25 years old and have been determined to have permanent historical value under title 44, United States Code.\n\n(e) Compilations of items of information which are individually unclassified may be classified if the compiled information reveals an additional association or relationship that:\n\n(1) meets the standards for classification under this order; and\n\n(2) is not otherwise revealed in the individual items of information. As used in this order, \"compilation\" means an aggregation of pre-existing unclassified items of information.\n\nSec. 1.9. Classification Challenges. (a) Authorized holders of information who, in good faith, believe that its classification status is improper are encouraged and expected to challenge the classification status of the information in accordance with agency procedures established under paragraph (b), below.\n\n(b) In accordance with implementing directives issued pursuant to this order, an agency head or senior agency official shall establish procedures under which authorized holders of information are encouraged and expected to challenge the classification of information that they believe is improperly classified or unclassified. These procedures shall assure that:\n\n(1) individuals are not subject to retribution for bringing such actions;\n\n(2) an opportunity is provided for review by an impartial official or panel; and\n\n(3) individuals are advised of their right to appeal agency decisions to the Interagency Security Classification Appeals Panel established by section 5.4 of this order.\n\nPart 2 Derivative Classification\n\nSec. 2.1. Definitions. For purposes of this order: (a) \"Derivative classification\" means the incorporating, paraphrasing, restating or generating in new form information that is already classified, and marking the newly developed material consistent with the classification markings that apply to the source information. Derivative classification includes the classification of information based on classification guidance. The duplication or reproduction of existing classified information is not derivative classification.\n\n(b) \"Classification guidance\" means any instruction or source that prescribes the classification of specific information.\n\n(c) \"Classification guide\" means a documentary form of classification guidance issued by an original classification authority that identifies the elements of information regarding a specific subject that must be classified and establishes the level and duration of classification for each such element.\n\n(d) \"Source document\" means an existing document that contains classified information that is incorporated, paraphrased, restated, or generated in new form into a new document.\n\n(e) \"Multiple sources\" means two or more source documents, classification guides, or a combination of both.\n\nSec. 2.2. Use of Derivative Classification. (a) Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority.\n\n(b) Persons who apply derivative classification markings shall:\n\n(1) observe and respect original classification decisions; and\n\n(2) carry forward to any newly created documents the pertinent classification markings. For information derivatively classified based on multiple sources, the derivative classifier shall carry forward:\n\n(A) the date or event for declassification that corresponds to the longest period of classification among the sources; and\n\n(B) a listing of these sources on or attached to the official file or record copy.\n\nSec. 2.3. Classification Guides. (a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. These guides shall conform to standards contained in directives issued under this order.\n\n(b) Each guide shall be approved personally and in writing by an official who:\n\n(1) has program or supervisory responsibility over the information or is the senior agency official; and\n\n(2) is authorized to classify information originally at the highest level of classification prescribed in the guide.\n\n(c) Agencies shall establish procedures to assure that classification guides are reviewed and updated as provided in directives issued under this order.\n\nPart 3 Declassification and Downgrading\n\nSec. 3.1. Definitions. For purposes of this order: (a) \"Declassification\" means the authorized change in the status of information from classified information to unclassified information.\n\n(b) \"Automatic declassification\" means the declassification of information based solely upon:\n\n(1) the occurrence of a specific date or event as determined by the original classification authority; or\n\n(2) the expiration of a maximum time frame for duration of classification established under this order.\n\n(c) \"Declassification authority\" means:\n\n(1) the official who authorized the original classification, if that official is still serving in the same position;\n\n(2) the originator's current successor in function;\n\n(3) a supervisory official of either; or\n\n(4) officials delegated declassification authority in writing by the agency head or the senior agency official.\n\n(d) \"Mandatory declassification review\" means the review for declassification of classified information in response to a request for declassification that meets the requirements under section 3.6 of this order.\n\n(e) \"Systematic declassification review\" means the review for declassification of classified information contained in records that have been determined by the Archivist of the United States (\"Archivist\") to have permanent historical value in accordance with chapter 33 of title 44, United States Code.\n\n(f) \"Declassification guide\" means written instructions issued by a declassification authority that describes the elements of information regarding a specific subject that may be declassified and the elements that must remain classified.\n\n(g) \"Downgrading\" means a determination by a declassification authority that information classified and safeguarded at a specified level shall be classified and safeguarded at a lower level.\n\n(h) \"File series\" means documentary material, regardless of its physical form or characteristics, that is arranged in accordance with a filing system or maintained as a unit because it pertains to the same function or activity.\n\nSec. 3.2. Authority for Declassification. (a) Information shall be declassified as soon as it no longer meets the standards for classification under this order.\n\n(b) It is presumed that information that continues to meet the classification requirements under this order requires continued protection. In some exceptional cases, however, the need to protect such information may be outweighed by the public interest in disclosure of the information, and in these cases the information should be declassified. When such questions arise, they shall be referred to the agency head or the senior agency official. That official will determine, as an exercise of discretion, whether the public interest in disclosure outweighs the damage to national security that might reasonably be expected from disclosure. This provision does not:\n\n(1) amplify or modify the substantive criteria or procedures for classification; or\n\n(2) create any substantive or procedural rights subject to judicial review.\n\n(c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the President through the Assistant to the President for National Security Affairs. The information shall remain classified pending a prompt decision on the appeal.\n\n(d) The provisions of this section shall also apply to agencies that, under the terms of this order, do not have original classification authority, but had such authority under predecessor orders.\n\nSec. 3.3. Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this order.\n\n(b) In the case of classified information that is not officially transferred as described in paragraph (a), above, but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information.\n\n(c) Classified information accessioned into the National Archives and Records Administration (\"National Archives\") as of the effective date of this order shall be declassified or downgraded by the Archivist in accordance with this order, the directives issued pursuant to this order, agency declassification guides, and any existing procedural agreement between the Archivist and the relevant agency head.\n\n(d) The originating agency shall take all reasonable steps to declassify classified information contained in records determined to have permanent historical value before they are accessioned into the National Archives. However, the Archivist may require that records containing classified information be accessioned into the National Archives when necessary to comply with the provisions of the Federal Records Act. This provision does not apply to information being transferred to the Archivist pursuant to section 2203 of title 44, United States Code, or information for which the National Archives and Records Administration serves as the custodian of the records of an agency or organization that goes out of existence.\n\n(e) To the extent practicable, agencies shall adopt a system of records management that will facilitate the public release of documents at the time such documents are declassified pursuant to the provisions for automatic declassification in sections 1.6 and 3.4 of this order.\n\nSec. 3.4. Automatic Declassification. (a) Subject to paragraph (b), below, within 5 years from the date of this order, all classified information contained in records that (1) are more than 25 years old, and (2) have been determined to have permanent historical value under title 44, United States Code, shall be automatically declassified whether or not the records have been reviewed. Subsequently, all classified information in such records shall be automatically declassified no longer than 25 years from the date of its original classification, except as provided in paragraph (b), below.\n\n(b) An agency head may exempt from automatic declassification under paragraph (a), above, specific information, the release of which should be expected to:\n\n(1) reveal the identity of a confidential human source, or reveal information about the application of an intelligence source or method, or reveal the identity of a human intelligence source when the unauthorized disclosure of that source would clearly and demonstrably damage the national security interests of the United States;\n\n(2) reveal information that would assist in the development or use of weapons of mass destruction;\n\n(3) reveal information that would impair U.S. cryptologic systems or activities;\n\n(4) reveal information that would impair the application of state of the art technology within a U.S. weapon system;\n\n(5) reveal actual U.S. military war plans that remain in effect;\n\n(6) reveal information that would seriously and demonstrably impair relations between the United States and a foreign government, or seriously and demonstrably undermine ongoing diplomatic activities of the United States;\n\n(7) reveal information that would clearly and demonstrably impair the current ability of United States Government officials to protect the President, Vice President, and other officials for whom protection services, in the interest of national security, are authorized;\n\n(8) reveal information that would seriously and demonstrably impair current national security emergency preparedness plans; or\n\n(9) violate a statute, treaty, or international agreement.\n\n(c) No later than the effective date of this order, an agency head shall notify the President through the Assistant to the President for National Security Affairs of any specific file series of records for which a review or assessment has determined that the information within those file series almost invariably falls within one or more of the exemption categories listed in paragraph (b), above, and which the agency proposes to exempt from automatic declassification. The notification shall include:\n\n(1) a description of the file series;\n\n(2) an explanation of why the information within the file series is almost invariably exempt from automatic declassification and why the information must remain classified for a longer period of time; and\n\n(3) except for the identity of a confidential human source or a human intelligence source, as provided in paragraph (b), above, a specific date or event for declassification of the information. The President may direct the agency head not to exempt the file series or to declassify the information within that series at an earlier date than recommended.\n\n(d) At least 180 days before information is automatically declassified under this section, an agency head or senior agency official shall notify the Director of the Information Security Oversight Office, serving as Executive Secretary of the Interagency Security Classification Appeals Panel, of any specific information beyond that included in a notification to the President under paragraph (c), above, that the agency proposes to exempt from automatic declassification. The notification shall include:\n\n(1) a description of the information;\n\n(2) an explanation of why the information is exempt from automatic declassification and must remain classified for a longer period of time; and\n\n(3) except for the identity of a confidential human source or a human intelligence source, as provided in paragraph (b), above, a specific date or event for declassification of the information. The Panel may direct the agency not to exempt the information or to declassify it at an earlier date than recommended. The agency head may appeal such a decision to the President through the Assistant to the President for National Security Affairs. The information will remain classified while such an appeal is pending.\n\n(e) No later than the effective date of this order, the agency head or senior agency official shall provide the Director of the Information Security Oversight Office with a plan for compliance with the requirements of this section, including the establishment of interim target dates. Each such plan shall include the requirement that the agency declassify at least 15 percent of the records affected by this section no later than 1 year from the effective date of this order, and similar commitments for subsequent years until the effective date for automatic declassification.\n\n(f) Information exempted from automatic declassification under this section shall remain subject to the mandatory and systematic declassification review provisions of this order.\n\n(g) The Secretary of State shall determine when the United States should commence negotiations with the appropriate officials of a foreign government or international organization of governments to modify any treaty or international agreement that requires the classification of information contained in records affected by this section for a period longer than 25 years from the date of its creation, unless the treaty or international agreement perta
