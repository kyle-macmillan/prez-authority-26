d agencies may noncompetitively convert participants who were initially converted to a term appointment under this section to a career or career-conditional appointment before the term appointment expires.\n\nSec. 7. Implementation. (a) Civil Service Rule VI is amended as follows:\n\n(i) 5 CFR 6.1(a) is amended to read:\n\nOPM may except positions from the competitive service when it determines that (A) appointments thereto through competitive examination are not practicable, or (B) recruitment from among students attending qualifying educational institutions or individuals who have recently completed qualifying educational programs can better be achieved by devising additional means for recruiting and assessing candidates that diverge from the processes generally applicable to the competitive service. These positions shall be listed in OPM's annual report for the fiscal year in which the exceptions are made.\n\n(ii) 5 CFR 6.2 is amended to read:\n\nOPM shall list positions that it excepts from the competitive service in Schedules A, B, C, and D, which schedules shall constitute parts of this rule, as follows:\n\nSchedule A. Positions other than those of a confidential or policy-determining character for which it is not practicable to examine shall be listed in Schedule A.\n\nSchedule B. Positions other than those of a confidential or policy-determining character for which it is not practicable to hold a competitive examination shall be listed in Schedule B. Appointments to these positions shall be subject to such noncompetitive examination as may be prescribed by OPM.\n\nSchedule C. Positions of a confidential or policy-determining character shall be listed in Schedule C.\n\nSchedule D. Positions other than those of a confidential or policy-determining character for which the competitive service requirements make impracticable the adequate recruitment of sufficient numbers of students attending qualifying educational institutions or individuals who have recently completed qualifying educational programs. These positions, which are temporarily placed in the excepted service to enable more effective recruitment from all segments of society by using means of recruiting and assessing candidates that diverge from the rules generally applicable to the competitive service, shall be listed in Schedule D.\n\n(iii) The first sentence of 5 CFR 6.4 is amended to read:\n\nExcept as may be required by statute, the Civil Service Rules and Regulations shall not apply to removals from positions listed in Schedules A, C, or D or from positions excepted from the competitive service by statute.\n\nThe second sentence of 5 CFR 6.4 is to remain unchanged.\n\n(iv) The first sentence of 5 CFR 6.6 is amended to read:\n\nOPM may remove any position from or may revoke in whole or in part any provision of Schedule A, B, C, or D.\n\nThe second sentence of 5 CFR 6.6 is to remain unchanged.\n\n(b) The Director of OPM shall:\n\n(i) promulgate such regulations as the Director determines may be necessary to implement this order;\n\n(ii) provide oversight of the Pathways Programs;\n\n(iii) establish, if appropriate, a Government-wide cap on the number of noncompetitive conversions to the competitive service of Interns, Recent Graduates, or PMFs (or a Government-wide combined conversion cap applicable to all three categories together);\n\n(iv) administer, and review and revise annually or as needed, any Government-wide cap established pursuant to this subsection;\n\n(v) provide guidance on conducting an orderly transition from existing student and internship programs to the Pathways Programs established pursuant to this order; and\n\n(vi) consider for publication in the Federal Register at an appropriate time a proposed rule seeking public comment on the elimination of the Student Temporary Employment Program, established through OPM regulations at 5 CFR 213.3202(a).\n\n(c) In accordance with regulations prescribed pursuant to this order and applicable law, agencies shall:\n\n(i) use appropriate merit-based procedures for recruitment, assessment, placement, and ongoing career development for participants in the Pathways Programs;\n\n(ii) provide for equal employment opportunity in the Pathways Programs without Regard to race, ethnicity, color, religion, sex, national origin, age, disability, sexual orientation, or any other non-merit-based factor;\n\n(iii) apply veterans' preference criteria; and\n\n(iv) within 45 days of the date of this order, designate a Pathways Programs Officer (at the agency level, or at bureaus or components within the agency) to administer Pathways Programs, to serve as liaison with OPM, and to report to OPM on the implementation of the Pathways Programs and the individuals hired under them.\n\nSec. 8. Prior Executive Orders. (a) Effective March 1, 2011, Executive Order 13162 (Federal Career Intern Program) is superseded and revoked. Any individuals serving in appointments under that order on March 1, 2011, shall be converted to the competitive service, effective on that date, with no loss of pay or benefits.\n\n(b) On the effective date of final regulations promulgated by the Director of OPM to implement the Internship Program, Executive Order 12015 (pursuant to which the Student Career Experience Program was established), as amended, is superseded and revoked.\n\n(c) On the effective date of final regulations promulgated by the Director of OPM to implement changes to the PMF Program required by this order, Executive Order 13318 (Presidential Management Fellows Program), as amended, is superseded and revoked.\n\nSec. 9. General Provisions. (a) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(b) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) authority granted by law, regulation, Executive Order, or Presidential Directive to an executive department, agency, or head thereof; or\n\n(ii) functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nBARACK OBAMA\n\nTHE WHITE HOUSE,\n\nDecember 27, 2010.","P41":"By the President of the United States of America\n\nA Proclamation\n\nIn the Pacific Ocean northwest of the principal islands of Hawaii lies an approximately 1,200 nautical mile stretch of coral islands, seamounts, banks, and shoals. The area, including the Northwestern Hawaiian Islands Coral Reef Ecosystem Reserve, the Midway National Wildlife Refuge, the Hawaiian Islands National Wildlife Refuge, and the Battle of Midway National Memorial, supports a dynamic reef ecosystem with more than 7,000 marine species, of which approximately half are unique to the Hawaiian Island chain. This diverse ecosystem is home to many species of coral, fish, birds, marine mammals, and other flora and fauna including the endangered Hawaiian monk seal, the threatened green sea turtle, and the endangered leatherback and hawksbill sea turtles. In addition, this area has great cultural significance to Native Hawaiians and a connection to early Polynesian culture worthy of protection and understanding.\n\nWhereas Executive Order 13089 of June 11, 1998, Executive Order 13178 of December 4, 2000, and Executive Order 13196 of January 18, 2001, as well as the process for designation of a National Marine Sanctuary undertaken by the Secretary of Commerce, have identified objects of historic or scientific interest that are situated upon the lands owned or controlled by the Government of the United States in the area of the Northwestern Hawaiian Islands;\n\nWhereas section 2 of the Act of June 8, 1906 (34 Stat. 225, 16 U.S.C. 431) (the \"Antiquities Act\") authorizes the President, in his discretion, to declare by public proclamation historic landmarks, historic and prehistoric structures, and other objects of historic or scientific interest that are situated upon lands owned or controlled by the Government of the United States to be national monuments, and to reserve as a part thereof parcels of land, the limits of which in all cases shall be confined to the smallest area compatible with the proper care and management of the objects to be protected;\n\nWhereas it would be in the public interest to preserve the marine area of the Northwestern Hawaiian Islands and certain lands as necessary for the care and management of the historic and scientific objects therein,\n\nNow, Therefore, I, George W. Bush, President of the United States of America, by the authority vested in me by section 2 of the Act of June 8, 1906 (34 Stat. 225, 16 U.S.C. 431), do proclaim that there are hereby set apart and reserved as the Northwestern Hawaiian Islands Marine National Monument (the \"monument\" or \"national monument\") for the purpose of protecting the objects described above, all lands and interests in lands owned or controlled by the Government of the United States within the boundaries described on the accompanying map entitled \"Northwestern Hawaiian Islands Marine National Monument\" attached to and forming a part of this proclamation. The Federal land and interests in land reserved includes approximately 139,793 square miles of emergent and submerged lands and waters of the Northwestern Hawaiian Islands, which is the smallest area compatible with the proper care and management of the objects to be protected.\n\nAll Federal lands and interests in lands within the boundaries of this monument are hereby appropriated and withdrawn from all forms of entry, location, selection, sale, or leasing or other disposition under the public land laws, including, but not limited to, withdrawal from location, entry, and patent under mining laws, and from disposition under all laws relating to mineral and geothermal leasing.\n\nThe Secretary of Commerce, through the National Oceanic and Atmospheric Administration (NOAA), will have primary responsibility regarding management of the marine areas, in consultation with the Secretary of the Interior. The Secretary of the Interior, through the Fish and Wildlife Service (FWS), will have sole responsibility for management of the areas of the monument that overlay the Midway Atoll National Wildlife Refuge, the Battle of Midway National Memorial, and the Hawaiian Islands National Wildlife Refuge, in consultation with the Secretary of Commerce.\n\nThe Secretary of Commerce and the Secretary of the Interior (collectively, the \"Secretaries\") shall review and, as appropriate, modify the interagency agreement developed for coordinated management of the Northwestern Hawaiian Islands Coral Reef Ecosystem Reserve, signed on May 19, 2006. To manage the monument, the Secretary of Commerce, in consultation with the Secretary of the Interior and the State of Hawaii, shall modify, as appropriate, the plan developed by NOAA's National Marine Sanctuary Program through the public sanctuary designation process, and will provide for public review of that plan. To the extent authorized by law, the Secretaries, acting through the FWS and NOAA, shall promulgate any additional regulations needed for the proper care and management of the objects identified above.\n\nThe Secretary of State, in consultation with the Secretaries, shall take appropriate action to enter into negotiations with other governments to make necessary arrangements for the protection of the monument and to promote the purposes for which the monument is established. The Secretary of State, in consultation with the Secretaries, shall seek the cooperation of other governments and international organizations in furtherance of the purposes of this proclamation and consistent with applicable regional and multilateral arrangements for the protection and management of special marine areas. Furthermore, this proclamation shall be applied in accordance with international law. No restrictions shall apply to or be enforced against a person who is not a citizen, national, or resident alien of the United States (including foreign flag vessels) unless in accordance with international law.\n\nNothing in this proclamation shall be deemed to diminish or enlarge the jurisdiction of the State of Hawaii.\n\nThe establishment of this monument is subject to valid existing rights and use of the monument shall be administered as follows:\n\nAccess to the Monument\n\nThe Secretaries shall prohibit entering the monument except pursuant to permission granted by the Secretaries or their designees. Any person passing through the monument without interruption must notify an official designated by the Secretaries at least 72 hours, but no longer than 1 month, prior to the entry date. Notification of departure from the monument must be provided within 12 hours of leaving. A person providing notice must provide the following information, as applicable: (i) position when making report; (ii) vessel name and International Maritime Organization identification number; (iii) name, address, and telephone number of owner and operator; (iv) United States Coast Guard (USCG) documentation, State license, or registration number; (v) home port; (vi) intended and actual route through the monument; (vii) general categories of any hazardous cargo on board; and (viii) length of vessel and propulsion type (e.g., motor or sail).\n\nVessel Monitoring Systems\n\n1. As soon as possible but not later than 30 days following the issuance of this proclamation, NOAA shall publish in the Federal Register a list of approved transmitting units and associated communications service providers for purposes of this proclamation. An owner or operator of a vessel that has been issued a permit for accessing the monument must ensure that such a vessel has an operating vessel monitoring system (VMS) on board, approved by the Office of Legal Enforcement in the National Oceanic and Atmospheric Administration in the Department of Commerce (OLE) when voyaging within the monument. An operating VMS includes an operating mobile transmitting unit on the vessel and a functioning communication link between the unit and OLE as provided by an OLE-approved communication service provider.\n\n2. Only a VMS that has been approved by OLE may be used. When installing and activating the OLE-approved VMS, or when reinstalling and reactivating such VMS, the vessel owner or operator must:\n\na. Follow procedures indicated on an installation and activation checklist, which is available from OLE; and\n\nb. Submit to OLE a statement certifying compliance with the checklist, as prescribed on the checklist.\n\n3. No person may interfere with, tamper with, alter, damage, disable, or impede the operation of the VMS, or attempt any of the same.\n\n4. When a vessel's VMS is not operating properly, the owner or operator must immediately contact OLE, and follow instructions from that office. If notified by OLE that a vessel's VMS is not operating properly, the owner and operator must follow instructions from that office. In either event, such instructions may include, but are not limited to, manually communicating to a location designated by OLE the vessel's positions or returning to port until the VMS is operable.\n\n5. As a condition of authorized access to the monument, a vessel owner or operator subject to the requirements for a VMS in this section must allow OLE, the USCG, and their authorized officers and designees access to the vessels position data obtained from the VMS. Consistent with applicable law, including the limitations on access to, and use, of VMS data collected under the Magnuson-Stevens Fishery Conservation and Management Act (16 U.S.C. 1801 et seq.), the Secretaries may have access to, and use of, collected data for scientific, statistical, and management purposes.\n\n6. OLE has authority over the installation and operation of the VMS unit. OLE may authorize the connection or order the disconnection of additional equipment, including a computer, to any VMS unit, when deemed appropriate by OLE.\n\n7. The Secretaries shall prohibit any person from conducting or causing to be conducted:\n\na. Operating any vessel without an approved transmitting device within the monument area 45 days after the publication of the list of approved transmitting devices described in paragraph (1) above;\n\nb. Failing to install, activate, repair, or replace a mobile transceiver unit prior to leaving port;\n\nc. Failing to operate and maintain a mobile transceiver unit on board the vessel at all times;\n\nd. Tampering with, damaging, destroying, altering, or in any way distorting, rendering useless, inoperative, ineffective, or inaccurate the VMS, mobile transceiver unit, or VMS signal required to be installed on or transmitted by a vessel;\n\ne. Failing to contact OLE or follow OLE instructions when automatic position reporting has been interrupted;\n\nf. Registering a VMS or mobile transceiver unit registered to more than one vessel at the same time;\n\ng. Connecting or leaving connected additional equipment to a VMS unit or mobile transceiver unit without the prior approval of OLE;\n\nh. Making a false statement, oral or written, to an authorized officer regarding the installation, use, operation, or maintenance of a VMS unit or mobile transceiver unit or communication service provider.\n\nRestrictions\n\nProhibited Activities\n\nThe Secretaries shall prohibit persons from conducting or causing to be conducted the following activities:\n\n1. Exploring for, developing, or producing oil, gas, or minerals within the monument;\n\n2. Using or attempting to use poisons, electrical charges, or explosives in the collection or harvest of a monument resource;\n\n3. Introducing or otherwise releasing an introduced species from within or into the monument; and\n\n4. Anchoring on or having a vessel anchored on any living or dead coral with an anchor, anchor chain, or anchor rope.\n\nRegulated Activities\n\nExcept as otherwise provided in this proclamation, the Secretaries shall prohibit any person from conducting or causing to be conducted within the monument the following activities:\n\n1. Removing, moving, taking, harvesting, possessing, injuring, disturbing, or damaging; or attempting to remove, move, take, harvest, possess, injure, disturb, or damage any living or nonliving monument resource;\n\n2. Drilling into, dredging, or otherwise altering the submerged lands other than by anchoring a vessel; or constructing, placing, or abandoning any structure, material, or other matter on the submerged lands;\n\n3. Anchoring a vessel;\n\n4. Deserting a vessel aground, at anchor, or adrift;\n\n5. Discharging or depositing any material or other matter into Special Preservation Areas or the Midway Atoll Special Management Area except vessel engine cooling water, weather deck runoff, and vessel engine exhaust;\n\n6. Discharging or depositing any material or other matter into the monument, or discharging or depositing any material or other matter outside of the monument that subsequently enters the monument and injures any resources of the monument, except fish parts (i.e., chumming material or bait) used in and during authorized fishing operations, or discharges incidental to vessel use such as deck wash, approved marine sanitation device effluent, cooling water, and engine exhaust;\n\n7. Touching coral, living or dead;\n\n8. Possessing fishing gear except when stowed and not available for immediate use during passage without interruption through the monument;\n\n9. Swimming, snorkeling, or closed or open circuit SCUBA diving within any Special Preservation Area or the Midway Atoll Special Management Area; and\n\n10. Attracting any living monument resources.\n\nEmergencies and Law Enforcement Activities\n\nThe prohibitions required by this proclamation shall not apply to activities necessary to respond to emergencies threatening life, property, or the environment, or to activities necessary for law enforcement purposes.\n\nArmed Forces Actions\n\n1. The prohibitions required by this proclamation shall not apply to activities and exercises of the Armed Forces (including those carried out by the United States Coast Guard) that are consistent with applicable laws.\n\n2. Nothing in this proclamation shall limit agency actions to respond to emergencies posing an unacceptable threat to human health or safety or to the marine environment and admitting of no other feasible solution.\n\n3. All activities and exercises of the Armed Forces shall be carried out in a manner that avoids, to the extent practicable and consistent with operational requirements, adverse impacts on monument resources and qualities.\n\n4. In the event of threatened or actual destruction of, loss of, or injury to a monument resource or quality resulting from an incident, including but not limited to spills and groundings, caused by a component of the Department of Defense or the USCG, the cognizant component shall promptly coordinate with the Secretaries for the purpose of taking appropriate actions to respond to and mitigate the harm and, if possible, restore or replace the monument resource or quality.\n\nCommercial Fishing\n\n1. The Secretaries shall ensure that any commercial lobster fishing permit shall be subject to a zero annual harvest limit.\n\n2. Fishing for bottomfish and pelagic species. The Secretaries shall ensure that:\n\na. Commercial fishing for bottomfish and associated pelagic species may continue within the monument for not longer than 5 years from the date of this proclamation provided that:\n\n(i) The fishing is conducted in accordance with a valid commercial bottomfish permit issued by NOAA; and\n\n(ii) Such permit is in effect on the date of this proclamation and is subsequently renewed pursuant to NOAA regulations at 50 CFR part 660 subpart E as necessary.\n\nb. Total landings for each fishing year may not exceed the following amounts:\n\n(i) 350,000 pounds for bottomfish species; and\n\n(ii) 180,000 pounds for pelagic species.\n\nc. Commercial fishing for bottomfish and associated pelagic species is prohibited in the monument after 5 years from the date of this proclamation.\n\nGeneral Requirements\n\nThe Secretaries shall ensure that any commercial fishing within the monument is conducted in accordance with the following restrictions and conditions:\n\n1. A valid permit or facsimile of a valid permit is on board the fishing vessel and is available for inspection by an authorized officer;\n\n2. No attempt is made to falsify or fail to make, keep, maintain, or submit any logbook or logbook form or other required record or report;\n\n3. Only gear specifically authorized by the relevant permit issued under the Magnuson-Stevens Fishery Conservation and Management Act is allowed to be in the possession of a person conducting commercial fishing under this section;\n\n4. Any person conducting commercial fishing notifies the Secretaries by telephone, facsimile, or electronic mail at least 72 hours before entering the monument and within 12 hours after leaving the monument;\n\n5. All fishing vessels must carry an activated and functioning VMS unit on board at all times whenever the vessel is in the monument;\n\n6. All fishing vessels must carry an observer when requested to do so by the Secretaries; and\n\n7. The activity does not take place within any Ecological Reserve, any Special Preservation Area, or the Midway Atoll Special Management Area.\n\nPermitting Procedures and Criteria\n\nSubject to such terms and conditions as the Secretaries deem appropriate, a person may conduct an activity regulated by this proclamation if such activity is specifically authorized by a permit. The Secretaries, in their discretion, may issue a permit under this proclamation if the Secretaries find that the activity: (i) is research designed to further understanding of monument resources and qualities; (ii) will further the educational value of the monument; (iii) will assist in the conservation and management of the monument; (iv) will allow Native Hawaiian practices; (v) will allow a special ocean use; or (vi) will allow recreational activities.\n\nFindings\n\n1. The Secretaries may not issue any permit unless the Secretaries find:\n\na. The activity can be conducted with adequate safeguards for the resources and ecological integrity of the monument;\n\nb. The activity will be conducted in a manner compatible with the management direction of this proclamation, considering the extent to which the conduct of the activity may diminish or enhance monument resources, qualities, and ecological integrity, any indirect, secondary, or cumulative effects of the activity, and the duration of such effects;\n\nc. There is no practicable alternative to conducting the activity within the monument;\n\nd. The end value of the activity outweighs its adverse impacts on monument resources, qualities, and ecological integrity;\n\ne. The duration of the activity is no longer than necessary to achieve its stated purpose;\n\nf. The applicant is qualified to conduct and complete the activity and mitigate any potential impacts resulting from its conduct;\n\ng. The applicant has adequate financial resources available to conduct and complete the activity and mitigate any potential impacts resulting from its conduct;\n\nh. The methods and procedures proposed by the applicant are appropriate to achieve the proposed activity's goals in relation to their impacts to monument resources, qualities, and ecological integrity;\n\ni. The applicant's vessel has been outfitted with a mobile transceiver unit approved by OLE and complies with the requirements of this proclamation; and\n\nj. There are no other factors that would make the issuance of a permit for the activity inappropriate.\n\n2. Additional Findings for Native Hawaiian Practice Permits. In addition to the findings listed above, the Secretaries shall not issue a permit to allow Native Hawaiian practices unless the Secretaries find:\n\na. The activity is non-commercial and will not involve the sale of any organism or material collected;\n\nb. The purpose and intent of the activity are appropriate and deemed necessary by traditional standards in the Native Hawaiian culture (pono), and demonstrate an understanding of, and background in, the traditional practice, and its associated values and protocols;\n\nc. The activity benefits the resources of the Northwestern Hawaiian Islands and the Native Hawaiian community;\n\nd. The activity supports or advances the perpetuation of traditional knowledge and ancestral connections of Native Hawaiians to the Northwestern Hawaiian Islands; and\n\ne. Any monument resource harvested from the monument will be consumed in the monument.\n\n3. Additional Findings, Criteria, and Requirements for Special Ocean Use Permits\n\na. In addition to the findings listed above, the following requirements apply to the issuance of a permit for a special ocean use:\n\n(i) Any permit for a special ocean use issued under this section:\n\n(A) Shall authorize the conduct of an activity only if that activity is compatible with the purposes for which the monument is designated and with protection of monument resources;\n\n(B) Shall not authorize the conduct of any activity for a period of more than 5 years unless renewed by the Secretaries;\n\n(C) Shall require that activities carried out under the permit be conducted in a manner that does not destroy, cause the loss of, or injure monument resources; and\n\n(D) Shall require the permittee to purchase and maintain comprehensive general liability insurance, or post an equivalent bond, against claims arising out of activities conducted under the permit and to agree to hold the United States harmless against such claims; and\n\n(ii) Each person issued a permit for a special ocean use under this section shall submit an annual report to the Secretaries not later than December 31 of each year that describes activities conducted under that permit and revenues derived from such activities during the year.\n\nb. The Secretaries may not issue a permit for a special ocean use unless they determine that the proposed activity will be consistent with the findings listed above for the issuance of any permit.\n\nc. Categories of special ocean use being permitted for the first time under this section will be restricted in duration and permitted as a special ocean use pilot project. Subsequent permits for any category of special ocean use may be issued only if a special ocean use pilot project for that category has been determined by the Secretaries to meet the criteria in this proclamation and any terms and conditions placed on the permit for the pilot project.\n\nd. The Secretaries shall provide public notice prior to requiring a special ocean use permit for any category of activity not previously identified as a special ocean use.\n\ne. The following requirements apply to permits for a special ocean use for an activity within the Midway Atoll Special Management Area.\n\n(i) The Secretaries may issue a permit for a special ocean use for activities within the Midway Atoll Special Management Area provided:\n\n(A) The Secretaries find the activity furthers the conservation and management of the monument; and\n\n(B) The Director of the United States Fish and Wildlife Service or his or her designee has determined that the activity is compatible with the purposes for which the Midway Atoll National Wildlife Refuge was designated.\n\n(ii) As part of a permit, the Secretaries may allow vessels to transit the monument as necessary to enter the Midway Atoll Special Management Area.\n\nf. The Secretaries may issue a permit for a special ocean use for activities outside the Midway Atoll Special Management Area provided:\n\n(i) The Secretaries find the activity will directly benefit the conservation and management of the monument;\n\n(ii) The Secretaries determine the purpose of the activity is for research or education related to the resources or qualities of the monument;\n\n(iii)The Secretaries provide public notice of the application and an opportunity to provide comments at least 30 days prior to issuing the permit; and\n\n(iv) The activity does not involve the use of a commercial passenger vessel.\n\n4. Additional Findings for Recreation Permits. The Secretaries may issue a permit only for recreational activities to be conducted within the Midway Atoll Special Management Area. In addition to the general findings listed above for any permit, the Secretaries may not issue such permit unless the Secretaries find:\n\na. The activity is for the purpose of recreation as defined in regulation;\n\nb. The activity is not associated with any for-hire operation; and\n\nc. The activity does not involve any extractive use.\n\nSustenance Fishing\n\nSustenance fishing means fishing for bottomfish or pelagic species that are consumed within the monument, and is incidental to an activity permitted under this proclamation. The Secretaries may permit sustenance fishing outside of any Special Preservation Area as a term or condition of any permit issued under this proclamation. The Secretaries may not permit sustenance fishing in the Midway Atoll Special Management Area unless the activity has been determined by the Director of the United States Fish and Wildlife Service or his or her designee to be compatible with the purposes for which the Midway Atoll National Wildlife Refuge was established. Sustenance fishing must be conducted in a manner compatible with this proclamation, including considering the extent to which the conduct of the activity may diminish monument resources, qualities, and ecological integrity, as well as any indirect, secondary, or cumulative effects of the activity and the duration of such effects. The Secretaries will develop procedures for systematic reporting of sustenance fishing.\n\nDefinitions For purposes of this proclamation:\n\nAttract or Attracting means luring or attempting to lure a living resource by any means, except the mere presence of human beings (e.g., swimmers, divers, boaters).\n\nBottomfish Species means bottomfish management unit species as defined at 50 CFR 660.12.\n\nCommercial Bottomfishing means commercial fishing for bottomfish species.\n\nCommercial Passenger Vessel means a vessel that carries individuals who have paid for such carriage.\n\nCommercial Pelagic Trolling means commercial fishing for pelagic species.\n\nDeserting a vessel means:\n\n1. Leaving a vessel aground or adrift:\n\n(i) Without notifying the Secretaries of the vessel going aground or adrift within 12 hours of its discovery and developing and presenting to the Secretaries a preliminary salvage plan within 24 hours of such notification;\n\n(ii) After expressing or manifesting intention to not undertake or to cease salvage efforts; or\n\n(iii)When the Secretaries are unable, after reasonable efforts, to reach the owner/operator within 12 hours of the vessels condition being reported to authorities.\n\n2. Leaving a vessel at anchor when its condition creates potential for a grounding, discharge, or deposit and the owner/operator fails to secure the vessel in a timely manner.\n\nEcological Reserve means an area of the monument consisting of contiguous, diverse habitats that provide natural spawning, nursery, and permanent residence areas for the replenishment and genetic protection of marine life, and also to protect and preserve natural assemblages of habitats and species within areas representing a broad diversity of resources and habitats found within the monument.\n\nEcological Integrity means a condition determined to be characteristic of an ecosystem that has the ability to maintain the function, structure, and abundance of natural biological communities, including rates of change in response to natural environmental variation.\n\nFishing Year means the year beginning at 0001 local time on January 1 and ending at 2400 local time on December 31.\n\nIntroduced Species means:\n\n1. A species (including, but not limited to, any of its biological matter capable of propagation) that is non-native to the ecosystem(s) protected by the monument; or\n\n2. Any organism into which genetic matter from another species has been transferred in order that the host organism acquires the genetic traits of the transferred genes.\n\nLanding means offloading fish from a fishing vessel or causing fish to be offloaded from a fishing vessel.\n\nMidway Atoll Special Management Area means the area of the monument surrounding Midway Atoll out to a distance of 12 nautical miles, established for the enhanced management, protection, and preservation of monument wildlife and historical resources.\n\nMobile Transceiver Unit means a vessel monitoring system or VMS device installed on board a vessel that is used for vessel monitoring and transmitting the vessel's position as required by this proclamation.\n\nNative Hawaiian Practices means cultural activities conducted for the purposes of perpetuating traditional knowledge, caring for and protecting the environment, and strengthening cultural and spiritual connections to the Northwestern Hawaiian Islands that have demonstrable benefits to the Native Hawaiian community. This may include, but is not limited to, the non-commercial use of monument resources for direct personal consumption while in the monument.\n\nOcean-Based Ecotourism means a class of fee-for-service activities that involves visiting the monument for study, enjoyment, or volunteer assistance for purposes of conservation and management.\n\nPelagic Species means Pacific Pelagic Management Unit Species as defined at 50 CFR 660.12.\n\nPono means appropriate, correct, and deemed necessary by traditional standards in the Hawaiian culture.\n\nRecreational Activity means an activity conducted for personal enjoyment that does not result in the extraction of monument resources and that does not involve a fee-for-service transaction. This includes, but is not limited to, wildlife viewing, SCUBA diving, snorkeling, and boating.\n\nSpecial Preservation Area (SPA) means discrete, biologically important areas of the monument within which uses are subject to conditions, restrictions, and prohibitions, including but not limited to access restrictions. SPAs are used to avoid concentrations of uses that could result in declines in species populations or habitat, to reduce conflicts between uses, to protect areas that are critical for sustaining important marine species or habitats, or to provide opportunities for scientific research.\n\nSpecial Ocean Use means an activity or use of the monument that is engaged in to generate revenue or profits for one or more of the persons associated with the activity or use, and does not destroy, cause the loss of, or injure monument resources. This includes ocean-based ecotourism and other activities such as educational and research activities that are engaged in to generate revenue, but does not include commercial fishing for bottomfish or pelagic species conducted pursuant to a valid permit issued by NOAA.\n\nStowed and Not Available for Immediate Use means not readily accessible for immediate use, e.g., by being securely covered and lashed to a deck or bulkhead, tied down, unbaited, unloaded, or partially disassembled (such as spear shafts being kept separate from spear guns).\n\nSustenance Fishing means fishing for bottomfish or pelagic species in which all catch is consumed within the monument, and that is incidental to an activity permitted under this proclamation.\n\nVessel Monitoring System or VMS means a vessel monitoring system or mobile transceiver unit approved by the Office for Law Enforcement for use on vessels permitted to access the monument, as required by this subpart.\n\nNothing in this proclamation shall be deemed to revoke any existing withdrawal, reservation, or appropriation; however, the national monument shall be the dominant reservation.\n\nWarning is hereby given to all unauthorized persons not to appropriate, injure, destroy, or remove any feature of this monument and not to locate or settle upon any lands thereof.\n\nIn Witness Whereof, I have hereunto set my hand this fifteenth day of June, in the year of our Lord two thousand six, and of the Independence of the United States of America the two hundred and thirtieth.\n\nGEORGE W. BUSH","P7":"By the President of the United States of America\n\nA Proclamation\n\nBy Proclamation 4887 of December 23, 1981, and Proclamation 4940 of May 5, 1982, I imposed, on an emergency basis, import fees on certain sugars, sirups and molasses. These fees were to be effective pending my further action after receipt of the report of findings and recommendations of the United States International Trade Commission after its investigation with respect to this matter pursuant to section 22 of the Agricultural Adjustment Act of 1933, as amended (7 U.S.C. 624). The Commission has made its investigation and reported its findings and recommendations to me. On the basis of the information submitted to me, I find and declare that:\n\n(a) Sugars classified under items 155.20 and 155.30 of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202) are being or are practically certain to be imported into the United States under such conditions and in such quantities as to render or tend to render ineffective, or materially interfere with, the price support operations being conducted by the Department of Agriculture for sugar cane and sugar beets.\n\n(b) The imposition of the import fees hereinafter proclaimed is necessary in order that the entry, or withdrawal from warehouse for consumption, of such sugars will not render or tend to render ineffective, or materially interfere with, the price support operations being conducted by the Department of Agriculture for sugar beets and sugar cane.\n\nNow, Therefore, I, Ronald Reagan, President of the United States of America, by the authority vested in me by section 22 of the Agricultural Adjustment Act of 1933, as amended, and the statutes of the United States, including section 301 of Title 3 of the United States Code, do hereby proclaim until otherwise superseded by law:\n\nA. Headnote 4 of part 3 of the Appendix to the TSUS is continued in effect and amended, effective 12:01 a.m. Eastern Standard Time of the day following the date of the signing of this proclamation, by changing paragraph (c) to read as follows:\n\n(c)(i) The quarterly adjusted fee provided for in items 956.05 and 957.15 shall be the amount of the fee for item 956.15 plus one cent per pound.\n\n(ii) The quarterly adjusted fee provided for in item 956.15 shall be the amount by which the average of the adjusted daily spot (domestic) price quotations for raw sugar for the 20 consecutive market days immediately preceding the 20th day of the month preceding the calendar quarter during which the fee shall be applicable (as reported by the New York Coffee, Sugar and Cocoa Exchange) expressed in United States cents per pound, in bulk, is less than the applicable market stabilization price: Provided, That whenever the average of the daily spot (domestic) price quotations for 10 consecutive market days within any calendar quarter (1) exceeds the market stabilization price by more than one cent, the fee then in effect shall be decreased by one cent per pound, or (2) is less than the market stabilization price by more than one cent, the fee then in effect shall be increased by one cent per pound. The adjusted daily spot (domestic) price quotation for any market day shall be the daily spot (domestic) price quotation for such market day less the amount of the fee for item 956.15 that is in effect on that day. For any market day for which the New York Coffee, Sugar and Cocoa Exchange does not report a daily spot (domestic) price for raw sugar, then the Secretary of Agriculture (the Secretary) shall use such other price as he determines appropriate.\n\n(iii) The market stabilization price that shall be applicable to each fiscal year (October 1-September 30) shall be determined and announced by the Secretary in accordance with this headnote no later than 30 days prior to the beginning of the fiscal year for which such market stabilization price shall be applicable. The market stabilization price shall be equal to the sum of; (1) the price support level for the applicable fiscal year, expressed in cents per pound of raw cane sugar; (2) adjusted average transportation costs; (3) interest costs, if applicable; and (4) 0.2 cent. The adjusted average transportation costs shall be the weighted average cost of handling and transporting domestically produced raw cane sugar from Hawaii to Gulf and Atlantic Coast ports, as determined by the Secretary. Interest costs shall be the amount of interest, as determined or estimated by the Secretary, that would be required to be paid by a recipient of a price support loan for raw cane sugar upon repayment of the loan at full maturity. Interest costs shall only be applicable if a price support loan recipient is not required to pay interest upon forfeiture of the loan collateral.\n\n(iv) Notwithstanding the provisions of paragraph (iii) hereof, if the Secretary determines that there is a significant change in any one or more of the elements comprising the market stabilization price during the fiscal year, the Secretary shall adjust the market stabilization price within the fiscal year to reflect such change. The Secretary shall announce any such adjusted market stabilization price and file notice thereof with the Federal Register. This adjusted market stabilization price will become effective the first calendar quarter following its announcement or, if the Secretary announced it less than 30 days before the beginning of a new calendar quarter, then it will become effective the second calendar quarter following its announcement. Any adjusted market stabilization price, once effective, shall remain in effect through the remainder of the fiscal year unless it is adjusted further in accordance with this paragraph.\n\n(v) The Secretary shall determine the amount of the quarterly fees in accordance with this headnote and shall announce such fees not later than the 25th day of the month preceding the calendar quarter during which the fees shall be applicable. The Secretary shall certify the amount of such fees to the Commissioner of Customs and file notice thereof with the Federal Register prior to the beginning of the calendar quarter during which the fees shall be applicable. The Secretary shall determine and announce any adjustment in the fees made within a calendar quarter in accordance with the proviso of paragraph (ii) hereof, shall certify such adjusted fees to the Commissioner of Customs, and shall file notice thereof with the Federal Register within 3 market days of the fulfillment of that proviso.\n\n(vi) If an adjustment is made in the fee in accordance with the proviso of paragraph (ii) hereof, any subsequent adjustment made within that quarter shall only be made on the basis of the average spot price for any 10 consecutive market day period following the effective date of the immediately preceding fee adjustment. No adjustment shall be made in any fee in accordance with the proviso of paragraph (ii) hereof during the last 15 market days of a calendar quarter.\n\n(vii) Any adjustment made in a fee during a quarter in accordance with the proviso of paragraph (ii) hereof shall be effective only with respect to sugar entered or withdrawn from warehouse for consumption after 12:01 a.m. (local time at point of entry) on the day following the filing of notice thereof with the Federal Register: Provided, That such adjustment in the fee shall not apply to sugar exported (as defined by Customs in accordance with 19 CFR 152.1) on a through bill of lading to the United States from the country of origin before such time. The exemption contained in the preceding proviso shall apply regardless of whether the adjustment in the fee is upward or downward.\n\nB. Items 956.05, 956.15 and 957.15 of part 3 of the Appendix to the TSUS are continued in effect and the \"Rates of Duty (Section 22 Fees)\" are amended to read as follows:\n\nItem Articles Rates of duty (section 22 fees)\n\nSugars, sirups and molasses derived from sugar cane or sugar beets, except those entered pursuant to a license issued by the Secretary of Agriculture in accordance with headnote 4(a):\n\nPrincipally of crystalline structure or in dry amorphous form, provided for in item 155.20, 956.05 part 10A, schedule 1:\n\nNot to be further refined or improved in quality An amount determined and adjusted in accordance with headnote 4(c), but not in excess of 50% ad val.\n\n956.15 To be further refined or improved in quality An amount determined and adjusted in accordance with headnote 4(c), but not in excess of 50% ad val.\n\n957.15 Not principally of crystalline structure and not An amount determined and adjusted in accordance with headnote 4(c) per pound of total sugars, but not in excess of 50% ad val. in dry amorphous form, containing soluble nonsugar solids (excluding any foreign substance that may have been added or developed in the product) equal to 6% or less by weight of the total soluble solids, provided for in item 155.30, part 10A, schedule 1\n\nC. The Secretary of Agriculture, in consultation with other appropriate agencies, shall review the fee system established by this Proclamation on a quarterly basis and shall submit to me any recommendations for any changes determined to be necessary or appropriate.\n\nD. The provisions of this proclamation shall terminate upon the filing of a notice in the Federal Register by the Secretary of Agriculture that the Department of Agriculture is no longer conducting a price support program for sugar beets and sugar cane.\n\nE. The provisions of Proclamation 4940 of May 5, 1982, are hereby terminated, except that the import fees on items 956.15, 956.05 and 957.15 presently in effect and the market stabilization price determined and announced by the Secretary of Agriculture for fiscal year 1984 (October 1, 1983-September 30, 1984) shall remain in effect, unless adjusted by the Secretary of Agriculture in accordance with paragraph (c) of Headnote 4 of part 3 of the Appendix to the TSUS, as modified herein.\n\nF. This proclamation shall be effective as of 12:01 a.m. Eastern Standard Time on the day following the date of its signing, and shall apply to articles entered, or withdrawn from warehouse for consumption, on or after such effective date.\n\nIn Witness Whereof, I have hereunto set my hand this 19th day of March, in the year of our Lord nineteen hundred and eightyfour, and of the Independence of the United States of America the two hundred and eighth.\n\nRONALD REAGAN"},"chunks":{"P9":{"1":"Now, Therefore, I, Gerald R. Ford, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962, as amended, do hereby proclaim that, effective the date of this proclamation, Proclamation No. 3279, as amended,","2":"Subparagraph (2) of paragraph (d) of Section 2 is amended to read as follows: \"(2) Entries for consumption of imports from Canada by pipeline may be made until midnight, May 15, of the allocation period following the allocation period in which any license authorizing such imports from Canada was issued.\" 2.","3":"Subparagraph (3) of paragraph (b) of section (4) is amended to read ass follows: \"(3) Except for (i)-crude oil or unfinished oils imported under license or licenses for which a fee has been charged, (ii) crude oil sold, bought, or exchanged in order to comply with other Federal Energy Administration regulations, or (iii) crude oil or unfinished oils imported pursuant to specific relief granted pursuant to section 5, such regulations shall require that imported crude oil and unfinished oils be processed in the licensee's refinery or petrochemical plant, except that imported crude oil or unfinished oils other than Canadian imports may be exchanged for domestic crude or unfinished oils if such exchanges are otherwise lawful, are effected on a current basis and reported in advance to the Administrator, and if the domestic crude or unfinished oils are processed in the licensee's refinery or petrochemical plant. Canadian imports may only be exchanged for other Canadian imports, in which case the Canadian imports obtained in the exchange must be processed in the licensee's own facility.\" 3.","4":"Subparagraph (1) (i) of paragraph (a) of section 3 is amended to read as follows :","5":"\"(a) (1) Effective May 1, 1973, the Administrator shall, by regulation, establish a system of fees for licenses issued under allocations of imports of crude oil, unfinished oils, and finished products, over the above levels of imports established by section 2 of this proclamation. Such regulations shall require, among other appropriate provisions, that (i) with respect to imports, other than imports from Canada of motor gasoline and finished products, such fees shall be : FEE SCHEDULE","6":"Paragraph (b) of section 3 thereof, is amended by inserting a new sentence between the first and second sentences to read as follows: \"In the event that such bond is terminated or the face value of the bond is reduced below the outstanding liability of licenses issued pursuant to the bond, the Administrator shall immediately revoke all licenses issued pursuant to the bond.\" 6.","7":"The fifth sentence of subparagraph (1) of paragraph (b) of section 4 is amended to read as follows: \"Such allocations shall not exceed 75 percent of estimated refinery capacity or the percentage of petrochemical plant capacity applicable.\" 7. Subparagraphs (2), (3) and (4) of paragraph (g) of section 15 are amended to read as follows: \"(2) `Gasoline' means a refined petroleum distillate, including naphtha, jet fuel, or other petroleum oils, (but not benzene which meets the ASTM distillation standards for nitration grade or cumene, ethylbenzene, isoprene, meta-xylene, ortho-xylene or para-xylene having a purity of 95 percent or more by weight) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, and having a boiling range at atmospheric pressure which falls completely or in part between 80° F and 400° F. \"(3) `Kerosene' means any jet fuel, diesel fuel, fuel oil, or other petroleum oils derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure which falls completely or in part between 400° F and 550° F. \"(4) 'Distillate fuel oil' means any fuel oil, gas oil, topped crude oil, or other petroleum oils (except refined petroleum wax) derived by refining or processing crude oil or unfinished oils, in whatever type of plant such refining or processing may occur, which has a boiling range at atmospheric pressure which falls completely or in part between 550° F and 1200° F.\" 8.","8":"Section 12 is amended to read as follows : \"12. Commitments and obligations contained in long term allocations heretofore made shall be unimpaired by this proclamation or regulations issued thereunder.\""},"EO28":{"1":"Accordingly, to address this threat and to take further steps with respect to the national emergency declared in Executive Order 13873, it is hereby ordered that: Section 1. Policy. It is the policy of the United States to restrict access by countries of concern to Americans' bulk sensitive personal data and United States Government-related data when such access would pose an unacceptable risk to the national security of the United States. At the same time, the United States continues to support open, global, interoperable, reliable, and secure flows of data across borders, as well as maintaining vital consumer, economic, scientific, and trade relationships that the United States has with other countries. The continuing effort by countries of concern to access Americans' bulk sensitive personal data and United States Government-related data threatens the national security and foreign policy of the United States. Such countries' governments may seek to access and use sensitive personal data in a manner that is not in accordance with democratic values, safeguards for privacy, and other human rights and freedoms. Such countries' approach stands in sharp contrast to the practices of democracies with respect to sensitive personal data and principles reflected in the Organisation for Economic Co-operation and Development Declaration on Government Access to Personal Data Held by Private Sector Entities. Unrestricted transfers of Americans' bulk sensitive personal data and United States Government-related data to such countries of concern may therefore enable them to exploit such data for a variety of nefarious purposes, including to engage in malicious cyber-enabled activities. Countries of concern can use their access to Americans' bulk sensitive personal data and United States Government-related data to track and build profiles on United States individuals, including Federal employees and contractors, for illicit purposes, including blackmail and espionage. Access to Americans' bulk sensitive personal data and United States Government-related data by countries of concern through data brokerages, third-party vendor agreements, employment agreements, investment agreements, or other such arrangements poses particular and unacceptable risks to our national security given that these arrangements often can provide countries of concern with direct and unfettered access to Americans' bulk sensitive personal data. Countries of concern can use access to United States persons' bulk sensitive personal data and United States Government-related data to collect information on activists, academics, journalists, dissidents, political figures, or members of non-governmental organizations or marginalized communities in order to intimidate such persons; curb dissent or political opposition; otherwise limit freedoms of expression, peaceful assembly, or association; or enable other forms of suppression of civil liberties. This risk of access to Americans' bulk sensitive personal data and United States Government-related data is not limited to direct access by countries of concern. Entities owned by, and entities or individuals controlled by or subject to the jurisdiction or direction of, a country of concern may enable the government of a country of concern to indirectly access such data. For example, a country of concern may have cyber, national security, or intelligence laws that, without sufficient legal safeguards, obligate such entities and individuals to provide that country's intelligence services access to Americans' bulk sensitive personal data and United States Government-related data. These risks may be exacerbated when countries of concern use bulk sensitive personal data to develop AI capabilities and algorithms that, in turn, enable the use of large datasets in increasingly sophisticated and effective ways to the detriment of United States national security. Countries of concern can use AI to target United States persons for espionage or blackmail by, for example, recognizing patterns across multiple unrelated datasets to identify potential individuals whose links to the Federal Government would be otherwise obscured in a single dataset. While aspects of this threat have been addressed in previous executive actions, such as Executive Order 13694 of April 1, 2015 (Blocking the Property of Certain Persons Engaging in Significant Malicious Cyber-Enabled Activities), as amended, additional steps need to be taken to address this threat.","2":"(a) To assist in addressing the national emergency described in this order, the Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, shall issue, subject to public notice and comment, regulations that prohibit or otherwise restrict United States persons from engaging in any acquisition, holding, use, transfer, transportation, or exportation of, or dealing in, any property in which a foreign country or national thereof has any interest (transaction), where the transaction: (i) involves bulk sensitive personal data or United States Government-related data, as further defined by regulations issued by the Attorney General pursuant to this section; (ii) is a member of a class of transactions that has been determined by the Attorney General, in regulations issued by the Attorney General pursuant to this section, to pose an unacceptable risk to the national security of the United States because the transactions may enable countries of concern or covered persons to access bulk sensitive personal data or United States Government-related data in a manner that contributes to the national emergency described in this order; (iii) was initiated, is pending, or will be completed after the effective date of the regulations issued by the Attorney General pursuant to this section; (iv) does not qualify for an exemption provided in, or is not authorized by a license issued pursuant to, the regulations issued by the Attorney General pursuant to this section; and (v) is not, as defined by regulations issued by the Attorney General pursuant to this section, ordinarily incident to and part of the provision of financial services, including banking, capital markets, and financial insurance services, or required for compliance with any Federal statutory or regulatory requirements, including any regulations, guidance, or orders implementing those requirements.","3":"(b) The Attorney General, in consultation with the heads of relevant agencies, is authorized to take such actions, including the promulgation of rules and regulations, and to employ all other powers granted to the President by IEEPA, as may be necessary or appropriate to carry out the purposes of this order. Executive departments and agencies (agencies) are directed to take all appropriate measures within their authority to implement the provisions of this order. (c) Within 180 days of the date of this order, the Attorney General, in coordination with the Secretary of Homeland Security, and in consultation with the heads of relevant agencies, shall publish the proposed rule described in subsection (a) of this section for notice and comment. This proposed rule shall: (i) identify classes of transactions that meet the criteria specified in subsection (a)(ii) of this section that are to be prohibited (prohibited transactions); (ii) identify classes of transactions that meet the criteria specified in subsection (a)(ii) of this section and for which the Attorney General determines that security requirements established by the Secretary of Homeland Security, through the Director of the Cybersecurity and Infrastructure Security Agency, in accordance with the process described in subsection (d) of this section, adequately mitigate the risk of access by countries of concern or covered persons to bulk sensitive personal data or United States Government-related data (restricted transactions); (iii) identify, with the concurrence of the Secretary of State and the Secretary of Commerce, countries of concern and, as appropriate, classes of covered persons for the purposes of this order; (iv) establish, as appropriate, mechanisms to provide additional clarity to persons affected by this order and any regulations implementing this order (including by designations of covered persons and licensing decisions); (v) establish a process to issue (including to modify or rescind), in concurrence with the Secretary of State, the Secretary of Commerce, and the Secretary of Homeland Security, and in consultation with the heads of other relevant agencies, as appropriate, licenses authorizing transactions that would otherwise be prohibited transactions or restricted transactions; (vi) further define the terms identified in section 7 of this order and any other terms used in this order or any regulations implementing this order; (vii) address, as appropriate, coordination with other United States Government entities, such as the Committee on Foreign Investment in the United States, the Office of Foreign Assets Control within the Department of the Treasury, the Bureau of Industry and Security within the Department of Commerce, and other entities implementing relevant programs, including those implementing Executive Order 13873; Executive Order 14034; and Executive Order 13913 of April 4, 2020 (Establishing the Committee for the Assessment of Foreign Participation in the United States Telecommunications Services Sector); and (viii) address the need for, as appropriate, recordkeeping and reporting of transactions to inform investigative, enforcement, and regulatory efforts. (d) The Secretary of Homeland Security, acting through the Director of the Cybersecurity and Infrastructure Security Agency, shall, in coordination with the Attorney General and in consultation with the heads of relevant agencies, propose, seek public comment on, and publish security requirements that address the unacceptable risk posed by restricted transactions, as identified by the Attorney General pursuant to this section. These requirements shall be based on the Cybersecurity and Privacy Frameworks developed by the National Institute of Standards and Technology. (i) The Secretary of Homeland Security, acting through the Director of the Cybersecurity and Infrastructure Security Agency, shall, in coordination with the Attorney General, issue any interpretive guidance regarding the security requirements. (ii) The Attorney General shall, in coordination with the Secretary of Homeland Security acting through the Director of the Cybersecurity and Infrastructure Security Agency, issue enforcement guidance regarding the security requirements.","4":"(e) The Secretary of Homeland Security, in coordination with the Attorney General, is hereby authorized to take such actions, including promulgating rules, regulations, standards, and requirements; issuing interpretive guidance; and employing all other powers granted to the President by IEEPA as may be necessary to carry out the purposes described in subsection (d) of this section. (f) In exercising the authority delegated in subsection (b) of this section, the Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, may, in addition to the rulemaking directed in subsection (c) of this section, propose one or more regulations to further implement this section, including to identify additional classes of prohibited transactions; to identify additional classes of restricted transactions; with the concurrence of the Secretary of State and the Secretary of Commerce, to identify new or remove existing countries of concern and, as appropriate, classes of covered persons for the purposes of this order; and to establish a mechanism for the Attorney General to monitor whether restricted transactions comply with the security requirements established under subsection (d) of this section. (g) Any proposed regulations implementing this section: (i) shall reflect consideration of the nature of the class of transaction involving bulk sensitive personal data or United States Government-related data, the volume of bulk sensitive personal data involved in the transaction, and other factors, as appropriate; (ii) shall establish thresholds and due diligence requirements for entities to use in assessing whether a transaction is a prohibited transaction or a restricted transaction; (iii) shall not establish generalized data localization requirements to store bulk sensitive personal data or United States Government-related data within the United States or to locate computing facilities used to process bulk sensitive personal data or United States Government-related data within the United States; (iv) shall account for any legal obligations applicable to the United States Government relating to public access to the results of taxpayer-funded scientific research, the sharing and interoperability of electronic health information, and patient access to their data; and (v) shall not address transactions to the extent that they involve types of human 'omic data other than human genomic data before the submission of the report described in section 6 of this order. (h) The prohibitions promulgated pursuant to this section apply except to the extent provided by law, including by statute or in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of the applicable regulations directed by this order. (i) Any transaction or other activity that has the purpose of evading or avoiding, causes a violation of, or attempts to violate any of the prohibitions promulgated pursuant to this section is prohibited. (j) Any conspiracy formed to violate any of the prohibitions promulgated pursuant to this section is prohibited. (k) In regulations issued by the Attorney General under this section, the Attorney General may prohibit United States persons from knowingly directing transactions if such transactions would be prohibited transactions under regulations issued pursuant to this order if engaged in by a United States person. (l) The Attorney General may, consistent with applicable law, redelegate any of the authorities conferred on the Attorney General pursuant to this section within the Department of Justice. The Secretary of Homeland Security may, consistent with applicable law, redelegate any of the authorities conferred on the Secretary of Homeland Security pursuant to this section within the Department of Homeland Security. (m) The Attorney General, in coordination with the Secretary of Homeland Security and in consultation with the heads of relevant agencies, is hereby authorized to submit recurring and final reports to the Congress related to this order, consistent with section 401(c) of the NEA (50 U.S.C. 1641(c)) and section 204(c) of IEEPA (50 U.S.C. 1703(c)). Sec. 3. Protecting Sensitive Personal Data. (a) Access to bulk sensitive personal data and United States Government-related data by countries of concern can be enabled through the transmission of data via network infrastructure that is subject to the jurisdiction or control of countries of concern. The risk of access to this data by countries of concern can be, and sometime is, exacerbated where the data transits a submarine cable that is owned or operated by persons owned by, controlled by, or subject to the jurisdiction or direction of a country of concern, or that connects to the United States and terminates in the jurisdiction of a country of concern. Additionally, the same risk of access by a country of concern is further exacerbated in instances where a submarine cable is designed, built, and operated for the express purpose of transferring data, including bulk sensitive personal data or United States Government-related data, to a specific data center located in a foreign jurisdiction. To address this threat, the Committee for the Assessment of Foreign Participation in the United States Telecommunications Services Sector (Committee) shall, to the extent consistent with its existing authority and applicable law: (i) prioritize, for purposes of and in reliance on the process set forth in section 6 of Executive Order 13913, the initiation of reviews of existing licenses for submarine cable systems that are owned or operated by persons owned by, controlled by, or subject to the jurisdiction or direction of a country of concern, or that terminate in the jurisdiction of a country of concern; (ii) issue policy guidance, in consultation with the Committee's Advisors as defined in section 3(d) of Executive Order 13913, regarding the Committee's reviews of license applications and existing licenses, including the assessment of third-party risks regarding access to data by countries of concern; and (iii) address, on an ongoing basis, the national security and law enforcement risks related to access by countries of concern to bulk sensitive personal data described in this order that may be presented by any new application or existing license reviewed by the Committee to land or operate a submarine cable system, including by updating the Memorandum of Understanding required under section 11 of Executive Order 13913 and by revising the Committee's standard mitigation measures, with the approval of the Committee's Advisors, which may include, as appropriate, any of the security requirements contemplated by section 2(d) of this order. (b) Entities in the United States healthcare market can access bulk sensitive personal data, including personal health data and human genomic data, through partnerships and agreements with United States healthcare providers and research institutions. Even if such data is anonymized, pseudonymized, or de-identified, advances in technology, combined with access by countries of concern to large data sets, increasingly enable countries of concern that access this data to re-identify or de-anonymize data, which may reveal the exploitable health information of United States persons. While the United States supports open scientific data and sample sharing to accelerate research and development through international cooperation and collaboration, the following additional steps must be taken to protect United States persons' sensitive personal health data and human genomic data from the threat identified in this order: (i) The Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall consider taking steps, including issuing regulations, guidance, or orders, as appropriate and consistent with the legal authorities authorizing relevant Federal assistance programs, to prohibit the provision of assistance that enables access by countries of concern or covered persons to United States persons' bulk sensitive personal data, including personal health data and human genomic data, or to impose mitigation measures with respect to such assistance, which may be consistent with the security requirements adopted under section 2(d) of this order, on the recipients of Federal assistance to address this threat.","5":"The Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall, in consultation with each other, develop and publish guidance to assist United States research entities in ensuring protection of their bulk sensitive personal data. (ii) Within 1 year of the date of this order, the Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, and the Director of the National Science Foundation shall jointly submit a report to the President through the Assistant to the President for National Security Affairs (APNSA) detailing their progress in implementing this subsection. (c) Entities in the data brokerage industry enable access to bulk sensitive personal data and United States Government-related data by countries of concern and covered persons. These entities pose a particular risk of contributing to the national emergency described in this order because they routinely engage in the collection, assembly, evaluation, and dissemination of bulk sensitive personal data and of the subset of United States Government-related data regarding United States consumers. The Director of the Consumer Financial Protection Bureau (CFPB) is encouraged to consider taking steps, consistent with CFPB's existing legal authorities, to address this aspect of the threat and to enhance compliance with Federal consumer protection law, including by continuing to pursue the rulemaking proposals that CFPB identified at the September 2023 Small Business Advisory Panel for Consumer Reporting Rulemaking. Sec. 4. Assessing the National Security Risks Arising from Prior Transfers of United States Persons' Bulk Sensitive Personal Data.","6":"Within 120 days of the effective date of the regulations issued pursuant to section 2(c) of this order, the Attorney General, the Secretary of Homeland Security, and the Director of National Intelligence, in consultation with the heads of relevant agencies, shall recommend to the APNSA appropriate actions to detect, assess, and mitigate national security risks arising from prior transfers of United States persons' bulk sensitive personal data to countries of concern.","7":"Within 150 days of the effective date of the regulations issued pursuant to section 2(c) of this order, the APNSA shall review these recommendations and, as appropriate, consult with the Attorney General, the Secretary of Homeland Security, and the heads of relevant agencies on implementing the recommendations consistent with applicable law. Sec. 5. Report to the President.","8":"(a) Within 1 year of the effective date of the regulations issued pursuant to section 2(c) of this order, the Attorney General, in consultation with the Secretary of State, the Secretary of the Treasury, the Secretary of Commerce, and the Secretary of Homeland Security, shall submit a report to the President through the APNSA assessing, to the extent practicable: (i) the effectiveness of the measures imposed under this order in addressing threats to the national security of the United States described in this order; and (ii) the economic impact of the implementation of this order, including on the international competitiveness of United States industry. (b) In preparing the report described in subsection (a) of this section, the Attorney General shall solicit and consider public comments concerning the economic impact of this order. Sec. 6. Assessing Risks Associated with Human 'omic Data.","9":"Within 120 days of the date of this order, the APNSA, the Assistant to the President and Director of the Domestic Policy Council, the Director of the Office of Science and Technology Policy, and the Director of the Office of Pandemic Preparedness and Response Policy, in consultation with the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, the Secretary of Veterans Affairs, the Director of the National Science Foundation, the Director of National Intelligence, and the Director of the Federal Bureau of Investigation, shall submit a report to the President, through the APNSA, assessing the risks and benefits of regulating transactions involving types of human 'omic data other than human genomic data, such as human proteomic data, human epigenomic data, and human metabolomic data, and recommending the extent to which such transactions should be regulated pursuant to section 2 of this order. This report and recommendation shall consider the risks to United States persons and national security, as well as the economic and scientific costs of regulating transactions that provide countries of concern or covered persons access to these data types. Sec. 7. Definitions. For purposes of this order: (a) The term \"access\" means logical or physical access, including the ability to obtain, read, copy, decrypt, edit, divert, release, affect, alter the state of, or otherwise view or receive, in any form, including through information technology systems, cloud computing platforms, networks, security systems, equipment, or software. (b) The term \"bulk\" means an amount of sensitive personal data that meets or exceeds a threshold over a set period of time, as specified in regulations issued by the Attorney General pursuant to section 2 of this order. (c) The term \"country of concern\" means any foreign government that, as determined by the Attorney General pursuant to section 2(c)(iii) or 2(f) of this order, has engaged in a long-term pattern or serious instances of conduct significantly adverse to the national security of the United States or the security and safety of United States persons, and poses a significant risk of exploiting bulk sensitive personal data or United States Government-related data to the detriment of the national security of the United States or the security and safety of United States persons, as specified in regulations issued by the Attorney General pursuant to section 2 of this order. (d) The term \"covered person\" means an entity owned by, controlled by, or subject to the jurisdiction or direction of a country of concern; a foreign person who is an employee or contractor of such an entity; a foreign person who is an employee or contractor of a country of concern; a foreign person who is primarily resident in the territorial jurisdiction of a country of concern; or any person designated by the Attorney General as being owned or controlled by or subject to the jurisdiction or direction of a country of concern, as acting on behalf of or purporting to act on behalf of a country of concern or other covered person, or as knowingly causing or directing, directly or indirectly, a violation of this order or any regulations implementing this order. (e) The term \"covered personal identifiers\" means, as determined by the Attorney General in regulations issu
