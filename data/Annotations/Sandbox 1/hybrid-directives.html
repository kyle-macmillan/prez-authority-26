<!doctype html>

<title>Hybrid Directives — Sample 100</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#d9e1ea;--paper:#fff;--bg:#f4f6f8;--blue:#174ea6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
button,select{font:inherit}
.shell{max-width:1400px;margin:auto;padding:22px}
.top{position:sticky;top:0;z-index:5;background:rgba(244,246,248,.97);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
h1{font-size:22px;margin:0 0 3px}
.subtitle{color:var(--muted);margin:0 0 12px;font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;border:1px solid #b8c4d1;border-radius:7px;overflow:hidden;background:#fff}
.toggle button{border:0;border-right:1px solid #b8c4d1;background:#fff;padding:7px 15px;cursor:pointer;font-size:13px}
.toggle button:last-child{border-right:0}
.toggle button.active{background:var(--blue);color:#fff}
.toggle.disabled{opacity:.4;pointer-events:none}
.ann-select{padding:7px 10px;border:1px solid #b8c4d1;border-radius:7px;background:#fff;font-size:13px;cursor:pointer}
.vest-checks{border:1px solid #b8c4d1;border-radius:7px;background:#fff;padding:5px 12px 6px;display:flex;gap:12px;align-items:center;font-size:13px;margin:0}
.vest-checks legend{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0 4px;float:left;width:auto}
.vest-checks label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.count{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.group-head{font-size:17px;font-weight:750;color:var(--ink);margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.group-head:first-child{margin-top:0}
.documents{display:grid;gap:12px}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:9px;overflow:hidden}
summary.doc-head{cursor:pointer;list-style:none;padding:12px 15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
summary.doc-head::-webkit-details-marker{display:none}
.doc-id{font-size:17px;font-weight:850;color:var(--blue);min-width:46px}
.doc-prez{font-weight:700}
.doc-meta{color:var(--muted);font-size:13px}
.src-link{color:var(--blue);font-size:12px;text-decoration:none;margin-left:4px}
.src-link:hover{text-decoration:underline}
.hybrid-badge{margin-left:auto;background:#fff0f0;color:#a02727;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.doc-body{padding:10px 15px 15px}
.hybrid-summary{font-size:13px;color:#555;margin-bottom:10px;line-height:1.6}
.hybrid-summary .reason{color:var(--muted)}
.vesting-section{margin-bottom:12px;padding:9px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
.vesting-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.vesting-badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700;margin-bottom:6px}
.vc-generic{background:#e3f2fd;color:#1565c0}
.vc-specific{background:#ede7f6;color:#5e35b1}
.vc-no_vesting_clause{background:#f5f5f5;color:#616161}
.vesting-clause-text{font-size:12px;color:#444;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-style:italic;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.vesting-clause-text+.vesting-clause-text{margin-top:6px}
.table-wrap{overflow-x:auto}
table.chunk-table{width:100%;border-collapse:collapse;font-size:13px}
.chunk-table th,.chunk-table td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.chunk-table thead th{background:#eef3f8;font-weight:750}
th.chunk-col{min-width:300px}
th.ann-col{min-width:155px}
.chunk-n{font-weight:800;color:var(--blue);display:block;margin-bottom:4px}
.chunk-text{color:#333;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.badge{display:block;padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700;margin-bottom:3px;white-space:nowrap;width:fit-content}
.scope-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.cat-ceremonial{background:#ede7f6;color:#5e35b1}
.cat-internal{background:#e3f2fd;color:#1565c0}
.cat-policy-legal{background:#e8f5e9;color:#2e7d32}
.cat-policy-nonlegal{background:#f1f8e9;color:#558b2f}
.cat-operative-congress{background:#fff3e0;color:#e65100}
.cat-other{background:#f5f5f5;color:#616161}
.cat-policy{background:#e8f5e9;color:#33691e}
.cat-missing{background:#fafafa;color:#aaa;font-weight:400;font-style:italic}
.scope-domestic{background:#e0f0ff;color:#1a5276}
.scope-foreign{background:#fff8e1;color:#7b5800}
.empty{text-align:center;color:var(--muted);padding:50px;background:var(--paper);border:1px solid var(--line);border-radius:9px}
</style>
</head>

<script id="payload" type="application/json">{"docs":[{"id":"EO10","meta":{"president":"Joseph R. Biden, Jr.","date":"December 08, 2021","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-14057-catalyzing-clean-energy-industries-and-jobs-through-federal"},"chunks":[{"n":"1","text":"Sec. 201. Agency Goals and Targets. (a) In implementing the policy set forth in section 101 of this order and to support the achievement of the government-wide goals of section 102 of this order, the head of each agency shall propose targets, including annual progress targets as applicable, to meet the requirements of sections 202 through 206 of this order. (b) The Chair of the Council on Environmental Quality (CEQ) and the Director of the Office of Management and Budget (OMB) shall review the targets, and agencies shall incorporate such targets into the performance management systems described under section 503 of this order, as appropriate."},{"n":"2","text":"Sec. 302. Supplier Emissions Tracking. The Administrator of GSA shall track disclosure of greenhouse gas emissions, emissions reduction targets, climate risk, and other sustainability-related actions by major Federal suppliers, based on information and data collected through supplier disclosure pursuant to the requirements of section 5(b)(i) of Executive Order 14030 of May 20, 2021 (Climate-Related Financial Risk), and shall assist the Chair of CEQ in assessing the results of efforts to reduce Federal supply chain emissions."},{"n":"3","text":"Sec. 303. Buy Clean. The Buy Clean Task Force established pursuant to section 508 of this order shall provide recommendations to the Chair of CEQ and the Director of OMB, through the Administrator of the Office of Federal Procurement Policy, on policies and procedures to expand consideration of embodied emissions and pollutants of construction materials in Federal procurement and federally funded projects, to include: (a) identifying and prioritizing pollutants and materials, such as concrete and steel, to be covered under a Buy Clean policy, taking into account the availability of relevant data, including from environmental product declarations, and consistency with existing environmental reporting requirements; (b) providing recommendations to increase transparency of embodied emissions, including supplier reporting; procedures for auditing environmental product declarations and verifying accuracy of reported emissions data; and recommendations for grants, loans, technical assistance, or alternative mechanisms to support domestic manufacturers in enhancing capabilities to report and reduce embodied emissions in priority materials they produce; and (c) recommending pilot programs that incentivize Federal procurement of construction materials with lower embodied emissions."},{"n":"4","text":"Sec. 401. Engaging, Educating, and Training the Federal Workforce. Meeting the challenges of climate change and achieving the goals of this order requires an investment in the Federal Government's employees and a workforce with the knowledge and skills to effectively apply sustainability, climate adaptation, and environmental stewardship across disciplines and functions. Agencies shall foster a culture of sustainability and climate action; build employees' skills and knowledge through engagement, education, and training; and incorporate environmental stewardship values and, where appropriate, sustainability goals and objectives into performance plans of executives, managers, and staff. The Director of the Office of Personnel Management (OPM), within 90 days of the date of this order, shall prepare a report for the Chair of CEQ that outlines opportunities for including or expanding environmental sustainability and climate adaptation training content in existing Federal training programs, including OPM leadership training programs, and strategies for incorporating sustainability into performance plans. In developing this report, the Director of OPM shall coordinate with the Secretary of Energy, the Administrator of the EPA, the Administrator of GSA, and, as appropriate, the heads of other agencies, as well as Federal employee unions."},{"n":"5","text":"Sec. 403. Accelerating Progress Through Public, Private, and Non-profit Sector Engagement. (a) Through strong partnerships with the public, private, and non-profit sectors and labor unions and worker organizations, we can more effectively catalyze the growth of clean energy industries and jobs. The Federal Chief Sustainability Officer, reestablished in section 501 of this order, and the heads of agencies shall seek to engage with stakeholders and partners in achieving the goals of this order. (b) In coordination with the Chair of CEQ and the heads of other agencies, as appropriate, the Director of OPM shall facilitate establishment of a Presidential Sustainability Executives Program to place senior leaders from the private and non-profit sectors into term-limited appointments to bring innovative perspectives and expertise to Federal Government and assist agencies in efforts related to climate action and sustainability."},{"n":"6","text":"Sec. 501. Establishment of the Office of the Federal Chief Sustainability Officer. The Office of the Federal Chief Sustainability Officer is reestablished within CEQ. The EPA shall provide funding and administrative support for the Office. (a) The Office shall be headed by a Federal Chief Sustainability Officer, who shall be appointed by the President. The Federal Chief Sustainability Officer shall lead the development of policies, programs, and partnerships to achieve the policies set forth in this order, advance sustainability and climate resilient Federal operations, and ensure the Federal Government leads by example in combating the climate crisis. (b) The heads of all agencies shall cooperate with the Federal Chief Sustainability Officer and provide such information, support, and assistance as the Federal Chief Sustainability Officer may request, as appropriate and consistent with applicable law."},{"n":"7","text":"Sec. 502. Designation and Duties of Agency Chief Sustainability Officers. Within 30 days of the date of this order or 30 days of an Agency Chief Sustainability Officer leaving that position, heads of agencies shall designate an Agency Chief Sustainability Officer, and assign to the designated official the responsibility for leading agency planning, implementation, and related actions, to include establishment of internal metrics and performance management systems, to achieve the policy in section 101 and the goals set forth in and targets established under sections 201-209 of this order. Agency Chief Sustainability Officers shall provide to the Director of OMB, the Chair of CEQ, and the Federal Chief Sustainability Officer any information and assistance necessary to implement this order, consistent with applicable law."},{"n":"8","text":"Sec. 503. Agency Planning and Performance Management. (a) The heads of principal agencies shall develop and implement annual Sustainability Plans, based on annual guidance provided by CEQ, describing actions and progress toward the goals and requirements of this order. (b) The heads of principal agencies shall develop, implement, and update Climate Adaptation and Resilience Plans that build on the agency's plan submitted pursuant to section 211 of Executive Order 14008. (c) The Chair of CEQ and the Director of OMB shall conduct management reviews with each principal agency, at least annually or more frequently as appropriate, to assess implementation and progress on agency plans developed pursuant to this order, the goals set forth in this order, and targets established under this order. (d) The heads of agencies other than principal agencies are encouraged to develop, implement, or update plans and participate in management reviews under this section."},{"n":"9","text":"Sec. 504. Duties of the Chair of the Council on Environmental Quality. In coordination with the Director of OMB, the Chair of CEQ shall: (a) issue guidance, including the guidance required by section 510(b) of this order, or revise existing guidance, as necessary, for agency implementation of this order, (b) establish a Chief Sustainability Officer Council that shall advise the Director of OMB and the Chair of CEQ on the performance of agency responsibilities under this order. The Federal Chief Sustainability Officer shall chair the Council. Members of the Council shall include those Agency Chief Sustainability Officers invited by the Chair of CEQ, as well as representatives designated by the heads of other agencies at the invitation of CEQ, including representatives from OMB, the Federal Energy Management Program within the Department of Energy, the Office of Federal High-Performance Green Buildings within GSA, and a Federal expert on environmental justice. (c) establish, as appropriate and consistent with applicable law, committees, interagency groups, or task forces to provide information, recommendations, and assistance to CEQ and OMB in implementing this order."},{"n":"10","text":"Sec. 505. Duties of the Director of OMB. The Director of OMB shall coordinate with the Chair of CEQ on implementation of the duties contained in section 504 of this order and, after consultation with the Chair of CEQ and the National Climate Advisor, issue instructions to the heads of agencies concerning periodic performance evaluation of agency implementation of this order and prepare scorecards providing periodic evaluation of principal agency performance in implementing this order."},{"n":"11","text":"Sec. 508. Establishment of Federal Leaders Working Groups. The following Federal Leaders working groups are hereby established, to be housed within CEQ: 100 Percent 24/7 Carbon Pollution-Free Electricity; Zero-Emission Vehicle Fleets; Net-Zero Emissions Buildings; Net-Zero Emissions Procurement, including a Buy Clean Task Force; and Climate Adaptation and Resilience. The Chair of CEQ shall designate the chair or co-chairs for each working group and provide guidance on their membership and responsibilities. The working groups shall provide semiannual reports to the National Climate Task Force on actions, findings, and progress toward government-wide goals."},{"n":"12","text":"Sec. 509. Government-wide Support and Collaboration. Achieving the government-wide goals of section 102 and the agency goals of sections 201 through 209 of this order requires transforming how we build, buy, and manage across the Federal Government. To support a whole-of-government approach: (a) Consistent with applicable law, the Secretary of Defense, the Secretary of Energy, and the Administrator of GSA shall use the scale of the Federal Government's electricity use to aggregate and accelerate new carbon pollution-free electricity generation capacity to meet Federal energy needs. (b) The Secretary of Transportation and the Administrator of GSA shall coordinate with States, Tribes, and local governments to facilitate wider adoption of zero-emission vehicles and, where appropriate, use the Federal Government's acquisition programs for non-Federal Government purchasers. (c) In coordination with the Chair of CEQ and the Director of OMB, the Secretary of Energy shall provide tools and technical support to agencies to develop targets for greenhouse gas emissions, zero-emission vehicle fleets, energy, and water required under section 201 of this order; and shall collect, analyze, and report agency data for the purposes of monitoring and evaluating performance toward the goals of this order."},{"n":"13","text":"Sec. 510. Additional Guidance and Instructions for Agencies. (a) The Director of OMB, in coordination with the Chair of CEQ and the National Climate Advisor, shall issue a memorandum for agencies that provides direction on immediate actions and further requirements to meet the policies and goals of this order. (b) To assist agencies in complying with this order, the Chair of CEQ, in consultation with the Director of OMB, shall: (i) within 120 days of the date of this order, issue and, as needed, update implementing guidance for agencies that provide directions, strategies, and recommended actions to meet the policies and goals of this order; (ii) issue building performance standards to support achievement of net-zero emissions in the Federal building portfolio under section 205 of this order; and (iii) consider issuing guidance for agencies to promote sustainable locations for Federal facilities and strengthen the vitality and livability of the communities in which Federal facilities are located."},{"n":"14","text":"I have determined that this order will achieve equal or better environmental or energy efficiency results than Executive Order 13423 of January 24, 2007 (Strengthening Federal Environmental, Energy, and Transportation Management)."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal","4":"policy-nonlegal","5":"policy-nonlegal","6":"policy-nonlegal","7":"policy-nonlegal","8":"policy-nonlegal","9":"policy-nonlegal","10":"policy-nonlegal","11":"internal","12":"policy-nonlegal","13":"policy-nonlegal","14":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic","6":"domestic","7":"domestic","8":"domestic","9":"domestic","10":"domestic","11":"domestic","12":"domestic","13":"domestic","14":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal","3":"internal","4":"internal","5":"internal","6":"internal","7":"internal","8":"internal","9":"internal","10":"internal","11":"internal","12":"internal","13":"internal","14":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic","6":"domestic","7":"domestic","8":"domestic","9":"domestic","10":"domestic","11":"domestic","12":"domestic","13":"dom O13","meta":{"president":"Ronald Reagan","date":"April 08, 1988","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-12635-prohibiting-certain-transactions-with-respect-panama"},"chunks":[{"n":"1","text":"Section 1. I hereby order blocked all property and interests in property of the Government of Panama that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of persons located within the United States. For purposes of this Order, the Government of Panama is defined to include its agencies, instrumentalities and controlled entities, including the Banco Nacional de Panama and the Caja de Ahorros."},{"n":"2","text":"Sec. 3. Sections 1 and 2 shall not be deemed to block property or interests in property of the Government of Panama, including, but not limited to, accounts established at the Federal Reserve Bank of New York as described in section 2, with respect to which transactions are authorized by, or on behalf of, the recognized representative of the Government of Panama as certified by the Secretary of State, or are otherwise authorized in regulations which may hereafter be issued pursuant to this Order. Section 2 shall not be deemed to prohibit interbank clearing payments."},{"n":"3","text":"Sec. 6. The Secretary of the Treasury, in consultation with the Secretary of State, is authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by the International Emergency Economic Powers Act, as may be necessary to carry out the purposes of this Order. The Secretary of the Treasury may redelegate any of these functions to other officers or agencies of the Federal Government."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal","3":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign","3":"foreign"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"policy-legal","2":"policy-legal","3":"internal"},"scopes":{"1":"foreign","2":"foreign","3":"foreign"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-legal","2":"policy-legal","3":"internal"},"scopes":{"1":"foreign","2":"foreign","3":"foreign"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-legal","2":"policy-legal","3":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign","3":"foreign"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":4,"vesting":{"category":"specific","clauses":["By the authority vested in me as President by the Constitution and laws of the United States of America, including the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.), the National Emergencies Act (50 U.S.C. 1601 et seq.), and section 301 of title 3 of the United States Code, I, Ronald Reagan, President of the United States of America, find that the policies and actions in Panama of Manuel Antonio Noriega and Manuel Soils Palma constitute an unusual and extraordinary threat to the national security, foreign policy,"]},"combos":{"pl_pnl":true,"pl_im":true,"pnl_im":false,"other":false}},{"id":"EO16","meta":{"president":"Donald J. Trump","date":"April 12, 2018","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-13829-task-force-the-united-states-postal-system"},"chunks":[{"n":"1","text":"Sec. 2. Establishment. (a) There is hereby established a Task Force on the United States Postal Service (Task Force), to be chaired by the Secretary of the Treasury, as Secretary and as Chairman of the Federal Financing Bank, or his designee, to evaluate the operations and finances of the USPS. In addition to the Chair of the Task Force (Chair), the Task Force shall be composed of the following department and agency heads, or their designees: (i) the Director of the Office of Management and Budget; (ii) the Director of the Office of Personnel Management; and (iii) any other department and agency head the Chair may designate. (b) The Task Force shall consult with the Postmaster General and the Chairman of the Postal Regulatory Commission. (c) The Task Force shall also engage: (i) the Attorney General, on issues relating to government monopolies operating in the commercial marketplace; (ii) the Secretary of Labor, on issues related to workers compensation programs; and (iii) State, local, and tribal officials as determined by the Chair of the Task Force with input from the Task Force members. (d) The Task Force shall meet as required by the Chair and, unless extended by the Chair, shall be dissolved once it has accomplished the objectives set forth in sections 3 and 4, as determined by the Chair, and completed the report described in section 5 of this order."},{"n":"2","text":"Sec. 3. Evaluation. The Task Force shall conduct a thorough evaluation of the operations and finances of the USPS, including: (i) the expansion and pricing of the package delivery market and the USPS's role in competitive markets; (ii) the decline in mail volume and its implications for USPS self-financing and the USPS monopoly over letter delivery and mailboxes; (iii) the definition of the \"universal service obligation\" in light of changes in technology, e-commerce, marketing practices, and customer needs; (iv) the USPS role in the U.S. economy and in rural areas, communities, and small towns; and (v) the state of the USPS business model, workforce, operations, costs, and pricing."},{"n":"3","text":"Sec. 5. Report. The Task Force, acting through the Chair and the Director of the Office of Management and Budget, shall submit a report to the President, in coordination with the Directors of the Domestic Policy and National Economic Councils, not later than 120 days after the date of this order. In its report, the Task Force shall summarize its findings and recommendations under sections 3 and 4 of this order."},{"n":"4","text":"Sec. 6. Administration. The Federal Financing Bank shall provide administrative support and funding for the Task Force."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal","3":"internal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"internal","2":"policy-nonlegal","3":"internal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"internal","2":"policy-nonlegal","3":"policy-nonlegal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":3,"vesting":{"category":"generic","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"EO17","meta":{"president":"Dwight D. Eisenhower","date":"June 25, 1959","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-10827-further-providing-for-the-administration-the-agricultural-trade"},"chunks":[{"n":"1","text":"SEC. 4. Foreign currencies. (a) (1) The amounts of foreign currencies which accrue under Title I of the Act to be used for the loans described in section 104(g) of the Act, and the amounts of such currencies to be used for loans by the Export-Import Bank pursuant to section 4(d) (5) of this order, shall be the amounts thereof specified, or shall be the amounts thereof corresponding to the dollar amounts specified, for such loans in sales agreements entered into pursuant to section 3(a) of this order. The Department of State may allocate or transfer to the Development Loan Fund foreign currencies to be used for loans made by the latter under section 104(g) of the Act in pursuance of section 4(d) (7) (i) hereof. (2) Except as otherwise provided in section 4(a) (1) above, the Director of the Bureau of the Budget shall from time to time fix the amounts of foreign currencies which accrue under Title I of the Act to be used for the purposes described in the respective lettered paragraphs of section 104 of the Act (including purposes financed with foreign currencies acquired, or to be acquired, with funds appropriated by the Congress pursuant to the Act) and, to such extent as may be necessary, shall allocate the amounts so fixed among the Government agencies concerned. (3) The function conferred upon the President by the last proviso of section 104 of the Act of waiving the applicability of section 1415 of the Supplemental Appropriation Act, 1953 (31 U.S.C. 724), is hereby delegated to the Director of the Bureau of the Budget. (b) The Secretary of the Treasury is hereby authorized to prescribe regulations governing the purchase, custody, deposit, transfer, and sale of foreign currencies received under the Act. (c) The foregoing provisions of this section shall not limit section 3 of this order, and the foregoing subsection (b) shall not limit subsection (a) above. (d) The purposes described in the lettered paragraphs of section 104 of the Act shall be carried out, with foreign currencies made available in consonance with law and the provisions of this order, as follows: (1) Those under sections 104(a) and 104(m) (B) of the Act by the Department of Agriculture. (2) Those under section 104 (b) of the Act by the Office of Civil and Defense Mobilization. The function conferred upon the President by that section of determining, from time to time, materials to be contracted for or to be purchased for a supplemental stockpile is hereby delegated to the Director of the Office of Civil and Defense Mobilization. (3) Those under section 104(c) of the Act by the Department of Defense or the Department of State, as those agencies shall agree, or in the absence of agreement, as the Director of the Bureau of the Budget shall determine. (4) Those under sections 104(d) and 104 (e) of the Act by the Department of State, except to the extent that section 104(e) pertains to the loans referred to in subsection (d) (5) of this section. (5) Those under section 104(e) of the Act by the Export-Import Bank of Washington to the extent that section 104(e) pertains to loans governed by that portion of such section added by the act of August 13, 1957, 71 Stat. 345. (6) Those under section 104(f) of the Act by the respective agencies of the Government having authority to pay United States obligations abroad. (7) (i) Those under section 104(g) of the Act by the Department of State and by the Development Loan Fund, as they shall agree. (ii) The function conferred upon the President by section 104(g) of the Act of determining the manner in which the loans provided for in section 104(g) shall be made is hereby delegated to the Secretary of State with respect to loans made by the Department of State pursuant to the assignment of purposes effected under item (i) of this paragraph, and to the Development Loan Fund with respect to loans made by the Development Loan Fund pursuant to such assignment of purposes. (iii) As used herein, the term \"the Development Loan Fund\" means the Managing Director of the Development Loan Fund, acting subject to the immediate supervision and direction of the board of directors of the Development Loan Fund; but, notwithstanding the foregoing, the Development Loan Fund, with respect to this order, shall be subject to the supervision and direction of the Secretary of State. (8) Those under sections 104(h) and 104(o) of the Act by the Department of State. (9) Those under sections 104(i) and 104(m) (A) of the Act by the United States Information Agency. (10) Those under section 104(j) of the Act by the Department of State and by the United States Information Agency in accordance with the division of responsibilities for the administration of the United States Information and Educational Exchange Act of 1948 (62 Stat. 6) provided by Reorganization Plan No. 8 of 1953 2 (67 Stat. 642) and Executive Order No. 10477 s of August 1, 1953, and by subsequent agreement between the Department of State and the United States Information Agency. (11) Those under section 104(k) of the Act as follows: (i) Those with respect to collecting, collating, translating, abstracting, and disseminating scientific and technological information by the Director of the National Science Foundation and such other agency or agencies as the Director of the Bureau of the Budget, after appropriate consultation, may designate. (ii) All others by such agency or agencies as the Director of the Bureau of the Budget, after appropriate consultation, may designate. As used in this paragraph the term \"appropriate consultation\" shall include consultation with the Secretary of State, the Director of the National Science Foundation, and any other appropriate Federal agency. (12) Those under section 104(/) of the Act by the Department of State and by any other agency or agencies designated therefor by the Secretary of State. (13) Those under section 104(n) of the Act by the Librarian of Congress."},{"n":"2","text":"SEC. 5. Reservation of functions to the President. There are hereby reserved to the President the functions conferred upon him by section 108 of the Act, with respect to making reports to Congress. Section 1 of Executive Order No. 10685 of October 27, 1956, is hereby revoked."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"policy-nonlegal","2":"internal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"internal","2":"other"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null}],"present":4,"hybridCount":3,"vesting":{"category":"specific","clauses":["By virtue of the authority vested in me by section 301 of title 3 of the United States Code, and as President of the United States,"]},"combos":{"pl_pnl":true,"pl_im":false,"pnl_im":true,"other":false}},{"id":"EO5","meta":{"president":"George W. Bush","date":"June 06, 2008","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-13465-amending-executive-order-12989-amended"},"chunks":[{"n":"1","text":"Section 1. Executive Order 12989 of February 13, 1996, as amended, is further amended: (a) by striking the title and inserting in lieu thereof \"Economy and Efficiency in Government Procurement Through Compliance with Certain Immigration and Nationality Act Provisions and Use of an Electronic Employment Eligibility Verification System\"; and (b) by striking the material that follows the title and precedes section 1 of the order and inserting in lieu thereof the following: \"This order is designed to promote economy and efficiency in Federal Government procurement. Stability and dependability are important elements of economy and efficiency. A contractor whose workforce is less stable will be less likely to produce goods and services economically and efficiently than a contractor whose workforce is more stable. It is the policy of the executive branch to enforce fully the immigration laws of the United States, including the detection and removal of illegal aliens and the imposition of legal sanctions against employers that hire illegal aliens. Because of the worksite enforcement policy of the United States and the underlying obligation of the executive branch to enforce the immigration laws, contractors that employ illegal aliens cannot rely on the continuing availability and service of those illegal workers, and such contractors inevitably will have a less stable and less dependable workforce than contractors that do not employ such persons. Where a contractor assigns illegal aliens to work on Federal contracts, the enforcement of Federal immigration laws imposes a direct risk of disruption, delay, and increased expense in Federal contracting. Such contractors are less dependable procurement sources, even if they do not knowingly hire or knowingly continue to employ unauthorized workers. \"Contractors that adopt rigorous employment eligibility confirmation policies are much less likely to face immigration enforcement actions, because they are less likely to employ unauthorized workers, and they are therefore generally more efficient and dependable procurement sources than contractors that do not employ the best available measures to verify the work eligibility of their workforce. It is the policy of the executive branch to use an electronic employment verification system because, among other reasons, it provides the best available means to confirm the identity and work eligibility of all employees that join the Federal workforce. Private employers that choose to contract with the Federal Government should meet the same standard. \"I find, therefore, that adherence to the general policy of contracting only with providers that do not knowingly employ unauthorized alien workers and that have agreed to utilize an electronic employment verification system designated by the Secretary of Homeland Security to confirm the employment eligibility of their workforce will promote economy and efficiency in Federal procurement."},{"n":"2","text":"it is hereby ordered as follows:\"."},{"n":"3","text":"Sec. 3. Section 5 of Executive Order 12989, as amended, is further amended to read as follows: \"Sec. 5. (a) Executive departments and agencies that enter into contracts shall require, as a condition of each contract, that the contractor agree to use an electronic employment eligibility verification system designated by the Secretary of Homeland Security to verify the employment eligibility of: (i) all persons hired during the contract term by the contractor to perform employment duties within the United States; and (ii) all persons assigned by the contractor to perform work within the United States on the Federal contract. \"(b) The Secretary of Homeland Security: \"(i) shall administer, maintain, and modify as necessary and appropriate the electronic employment eligibility verification system designated by the Secretary under subsection (a) of this section; and \"(ii) may establish with respect to such electronic employment verification system: \"(A) terms and conditions for use of the system; and \"(B) procedures for monitoring the use, failure to use, or improper use of the system. \"(c) The Secretary of Defense, the Administrator of General Services, and the Administrator of the National Aeronautics and Space Administration shall amend the Federal Acquisition Regulation to the extent necessary and appropriate to implement the debarment responsibility, the employment eligibility verification responsibility, and other related responsibilities assigned to heads of departments and agencies under this order. \"(d) Except to the extent otherwise specified by law or this order, the Secretary of Homeland Security and the Attorney General: \"(i) shall administer and enforce this order; and \"(ii) may, after consultation to the extent appropriate with the Secretary of Defense, the Secretary of Labor, the Administrator of General Services, the Administrator of the National Aeronautics and Space Administration, the Administrator for Federal Procurement Policy, and the heads of such other departments or agencies as may be appropriate, issue such rules, regulations, or orders, or establish such requirements, as may be necessary and appropriate to implement this order.\"."},{"n":"4","text":"Sec. 4. Section 7 of Executive Order 12989, as amended, is amended by striking \"respective agencies\" and inserting in lieu thereof \"respective departments or agencies\"."},{"n":"5","text":"Sec. 5. Section 8 of Executive Order 12989, as amended, is amended to read as follows: \"Sec. 8. (a) This order shall be implemented in a manner intended to minimize the burden on participants in the Federal procurement process. \"(b) This order shall be implemented in a manner consistent with the protection of intelligence and law enforcement sources, methods, and activities from unauthorized disclosure.\"."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal"},"scopes":{"1":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"ceremonial","3":"policy-nonlegal","4":"ceremonial","5":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-legal","3":"policy-legal","4":"other","5":"policy-legal"},"scopes":{"1":"foreign","3":"domestic","4":"domestic","5":"domestic"},"hybrid":true,"reason":"both"}],"present":3,"hybridCount":2,"vesting":{"category":"specific","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America, including subsection 121(a) of title 40 and section 301 of title 3, United States Code, and in order to take further steps to promote economy and efficiency in Federal Government procurement,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"EO8","meta":{"president":"Jimmy Carter","date":"June 30, 1978","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-12070-federal-cost-living-allowances"},"chunks":[{"n":"1","text":"it is hereby ordered as follows: 1-1. Suspension of Applicable Requirements. 1-101. The requirement of Section 205 (b) (2) of Executive Order No. 10000, as amended, that consideration be given to quarters or subsistence, commissary or other purchasing privileges, in determining cost of living allowance rates, is suspended except to the extent that such privileges are furnished as a result of Federal civilian employment. 1-102. Quarters or subsistence, commissary or other purchasing privileges, shall not be taken into consideration in determining cost of living allowance rates of employees who are furnished such facilities as a result of Federal civilian employment but who do not use them. 1-2. Administrative Matters. 1-201. This Order shall take effect .July 30, 1978 and shall operate prospectively. 1-202."},{"n":"2","text":"The United States Civil Service Commission shall conduct a study of problems associated with the implementation of Section 5941 of Title 5 of the United States Code. The Commission's findings and recommendations for longterm solutions to problems encountered with respect to the cost of living allowance and differential compensation authorized by that statute shall be submitted to the President."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"policy-legal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"internal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":2,"vesting":{"category":"specific","clauses":["By the authority vested in me as President of the United States of America by Section 5941 of Title 5 of the United States Code, and in order to authorize the temporary restoration of the cost of living allowance to certain employees,"]},"combos":{"pl_pnl":false,"pl_im":true,"pnl_im":true,"other":false}},{"id":"EO24","meta":{"president":"Joseph R. Biden, Jr.","date":"March 27, 2024","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-14121-recognizing-and-honoring-womens-history"},"chunks":[{"n":"1","text":"Sec. 3. Recognizing and Honoring Women's History. (a) Within 180 days of the date of this order, to strengthen the Federal Government's recognition of women's history, the Secretary of the Interior shall submit a report to the President that: (i) includes an assessment of existing sites of national importance that are directly related to women's history, whether managed by the Department of Defense, the Department of the Interior, the Department of Agriculture, the Department of Commerce, or any other executive branch entity; and (ii) identifies opportunities within sites of national importance to highlight important figures and chapters in women's history. (b) To strengthen the Federal Government's recognition of women's history: (i) The Secretary of the Interior shall conduct an overview theme study specific to women's history that identifies major topics in women's history to be addressed by a series of subsequent theme studies. The overview theme study and plan for additional studies shall address prominent women and girls in key periods of United States history, such as pre-European contact, Colonial America, the American Revolution, the abolition and suffrage movements, the Civil War and Reconstruction, the Progressive Era, the Great Depression and New Deal, World War II and post-war, the civil rights and women's rights movements, and contemporary America, among other topics. It also shall highlight women and girl leaders in advocacy and social movements, defense, diplomacy, education, law, medicine, the sciences, conservation and environmental protection, sports, the arts, or other professions and disciplines, as appropriate. (ii) The Secretary of the Interior shall review previously completed theme studies and issue a report to help ensure representation of women's history in sites of national importance. This review of completed theme studies should include, among others, sites of national importance focused on or linked with the histories of Latino Americans; Asian Americans and Pacific Islanders; African Americans; people of Indigenous descent; and lesbian, gay, bisexual, transgender, queer, and intersex Americans; as well as American civil rights and labor histories. The report shall adopt an intersectional approach by including women from different backgrounds and communities and shall reflect diversity in factors such as gender, race, sexual orientation, gender identity, ethnicity, religion, Tribal affiliation, disability, age, geography, income, and socioeconomic status. (iii) To inform relevant actions the Department of the Interior will take over the next 10 years, the Secretary of the Interior shall request recommendations from the National Park System Advisory Board on ways to improve the recognition of women's history across Federal parks, lands, and programs, including through historic designations and national monument designations. The Secretary of the Interior shall request that the National Park System Advisory Board produce interim recommendations to the Secretary within 270 days of the date of this order and produce final recommendations within 1 year of the date of this order. (c) The Secretary of the Interior shall make available the findings from the overview theme study and series of subsequent theme studies conducted pursuant to subsection (b)(i) of this section to the Director of the Smithsonian American Women's History Museum and the corresponding council established in 20 U.S.C. 80t-2, for consideration, as appropriate, in developing their own exhibits."},{"n":"2","text":"Sec. 4. Implementation. The Secretary of the Interior shall consult with the Assistant to the President and Director of the White House Gender Policy Council, the Assistant to the President and Director of the Domestic Policy Council, and the Chair of the Council on Environmental Quality in implementing this order."}],"perAnnotator":[{"name":"Claire","labels":{"1":"ceremonial","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"policy-nonlegal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":2,"vesting":{"category":"generic","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"EO3","meta":{"president":"Dwight D. Eisenhower","date":"September 08, 1959","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-10836-amendment-executive-order-no-10530-providing-for-the-performance"},"chunks":[{"n":"1","text":"it is ordered that Executive Order No. 10530 of May 10, 1954, entitled \"Providing for the Performance of Certain Functions Vested in or Subject to the Approval of the President\", be, and it is hereby, amended as follows: 1."},{"n":"2","text":"(1) the designation of lands to be acquired by condemnation,"},{"n":"3","text":"(2) contracts for purchase of lands, and"},{"n":"4","text":"(3) agreements between the National Capital Planning Commission and officials of the States of Maryland and Virginia.\" 2. The following paragraph (o) is added at the end of section 1: \"(o) The authority vested in the President by section 44(a) of the Alaska Omnibus Act, approved June 25, 1959 (Public Law 86-70; 73 Stat. 141, 151), to make transitional grants to the State of Alaska; and the authority vested in the President by section 44(b) of that act"},{"n":"5","text":"(1) to approve requests of the Governor of Alaska that Federal agencies continue to provide services or facilities in Alaska for an interim period, and"},{"n":"6","text":"(2) to allocate to such agencies the funds necessary to finance the provision of such services or facilities.\""}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","4":"policy-legal","5":"policy-legal","6":"internal"},"scopes":{"1":"domestic","4":"domestic","5":"domestic","6":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal","3":"internal","4":"internal","5":"internal","6":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic","6":"domestic"},"hybrid":false,"reason":null}],"present":2,"hybridCount":1,"vesting":{"category":"specific","clauses":["By virtue of the authority vested in me by section 301 of title 3 of the United States Code, and as President of the United States,"]},"combos":{"pl_pnl":false,"pl_im":true,"pnl_im":false,"other":false}},{"id":"EO7","meta":{"president":"Harry S Truman","date":"December 03, 1951","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-10309-restoring-possession-use-and-control-certain-lands-reserved-for"},"chunks":[{"n":"1","text":"it is ordered as follows: PART I Upon the fulfillment of the conditions precedent specified in Part II of this order and the certification thereof by the Department of the Army as provided in such Part, and without further act, the possession, use, and control of the two following-described tracts of land comprising a portion of the Fort Armstrong Military Reservation, Honolulu, Oahu, Territory of Hawaii, shall be restored to the Territory of Hawaii, and title to the said tracts shall be transferred to the said Territory: Beginning at a lead plug at the west corner of this piece of land, on the southeasterly side of Channel Street, the coordinates of said point of beginning referred to Government Survey triangulation station \"Punchbowl\" being 4,412.22 feet south and 5,678.39 feet west, thence running by azimuths measured clockwise from true south: 1. 219° 00'00\" 154.09 feet along the southeasterly side of Channel Street; thence along Channel Street, on a curve to the right with a radius of 20.00 feet, the chord azimuth and distance being: 2. 264° 00'00\" 28.28 feet; 3. 309° 00'00\" 172.16 feet along same, along U.S. Immigration Station; 4. 38° 48'30\" 270.86 feet along the remainder of Tract No. 1 of Fort Armstrong Military Reservation; 5. 128° 48'30\" 25.98 feet along U.S. Public Health Station (Public Law 105, 81st Congress, dated June 16, 1949); 6. 218° 58'20\" 96.70 feet along same; 7. 129° 03'00\" 167.01 feet along U.S. Public Health Station (Public Law 105, 81st Congress, dated June 16, 1949) to the point of beginning and containing an areas of 35,932 square feet or 0.82 acre. Excepting and excluding from the above-described property the land which was transferred to the control and jurisdiction of the Secretary of War (now Secretary of the Army) by letter of the Secretary of Labor (Immigration Service) dated December 16, 1939, pursuant to the act of Congress approved August 5, 1939, 53 Stat. 1209, and containing 6,920 square feet or 0.16 acre. TRACT No. 2 Beginning at the west corner of this piece of land, on the southeasterly side of the Honolulu Harbor Line, the coordinates of said point of beginning referred to Government Survey triangulation station \"Punchbowl\" being 3,930.19 feet south and 5,637.61 feet west, thence running by azimuths measured clockwise from true south: 1. 219° 00' 214.12 feet along the Honolulu Harbor Line; 2. 279° 46' 116.48 feet; 3. 322° 20' 198.34 feet along a fence to concrete monument No. 1; 4. 39° 00' 224.88 feet along the northwesterly side of Channel Street to a brass plate; 5. 129° 00' 294.63 feet along Channel Street, along Pier No. 2, and passing over brass plate No. 3 at 192.99 feet, to the point of beginning and containing an area of 72,432 square feet or 1.66 acres. PART II 1. The Territory of Hawaii shall replace the existing bakery and that portion of the warehouse (combined Buildings T-28 and T-29) located on the land described in Part I hereof by remodeling and increasing the capacity of the existing bakery at the Schofield Barracks Military Reservation. 2. The Territory of Hawaii shall completely raze the existing warehouse (combined Buildings T-28 and T-29) and remove all debris. 3. The Territory of Hawaii shall relocate all Department of the Army utility lines running through the site of the proposed Territorial Pier 2 Expansion Project and shall grant perpetual easements for all such utility lines as relocated. 4. The Territory of Hawaii shall replace the existing boundary fence and gates by erecting a new fence along the revised boundary, with entrance driveways and gates as required by the Department of the Army. 5. The Territory of Hawaii shall replace the Honolulu District Engineer's Boathouse now located at Pier 2A by constructing a new boathouse at Pier 1, the boathouse area to be inclosed with steel sheet piling or equivalent protection against the open sea. 6. The Territory of Hawaii shall make the necessary alternations in the present Post Exchange and Cafeteria Building located on Fort Armstrong Military Reservation to accommodate the District Engineer Laboratories now located at Pier 2A. 7. The Territory of Hawaii shall replace the remaining facilities now located at Pier 2A by construction an office and armory building at Fort DeRussy Military Reservation. 8. The Territory of Hawaii (and not the Department of the Army) shall make any arrangements that may be necessary with the General Services Administration (as to property occupied by the Public Health Service) or the Department of Justice (as to property occupied by the Immigration and Naturalization Service) with respect to any rights or interest in any lands now under the jurisdiction of the said Administration or Department affected by the proposed Territorial Pier 2 Expansion Project. 9. None of the above-described construction of new facilities or alteration of existing facilities shall be at the expense of the Department of the Army. 10."},{"n":"2","text":"The Territory of Hawaii shall bear all expenses in connection with the preparation of final plans and specifications for the construction and alteration work outlined above; the plans and specifications shall be based on preliminary plans prepared by the District Engineer in conjunction with Headquarters, United States Army, Pacific, in May 1949, copies of which have been furnished to representatives of the Territory of Hawaii (except that preliminary plans for altering the Post Exchange and Cafeteria Building at the Fort Armstrong Military Reservation, furnished to the Territory of Hawaii in January 1950, shall be substituted for the earlier plans for replacement of laboratory facilities); final plans and specifications for each item shall be approved by the Department of the Army before the start of construction or alteration work on each item; and the order of priority of each item shall be subject to the joint approval of the Department of the Army and the District Engineer. At the request of the Territory of Hawaii, the Department of the Army, acting by and through the Commanding General, United States Army, Pacific, prior to final acceptance by the Territory of any item of work which has been performed under a contract between the Territory of Hawaii and any contractor, shall advise the Territory of Hawaii whether it concurs in such final acceptance. 11. Prior to the completion of all replacement Army facilities by the Territory of Hawaii, and prior to the restoration of the possession, use, and control of the lands and the transfer of title thereto from the United States to the Territory of Hawaii, and prior to the restoration of the possession, use, and control of the lands and the transfer of title thereto from the United States to the Territory of Hawaii, the Territory may, if it so desires request right-of-entry to proceed with the demolition of existing Army improvements or the construction of Territorial or Army facilities on the subject lands. Such right-of-entry shall be secured in writing from the Department of the Army by the Territory of Hawaii for each improvement to be demolished or constructed. The granting of any such right-of-entry shall be at the discretion of the Department of the Army, except as such right-of-entry is necessary to enable the Territory of Hawaii to complete the construction or demolition for the Department of the Army as described above. Whenever the demolition of any building or improvement on the subject lands is necessary to permit Territorial construction, either for the Territory of Hawaii or for the Department of the Army, and construction by the Territory of replacement Army facilities has progressed to a point where it is deemed to be in the best interest of the United States to do so, the Department of the Army may, at its discretion and upon written request from the Territory in each case, certify as to such partial fulfilment of the conditions specified in Part II of this order, and upon such certification possession, use, and control of such building or improvement and title thereto shall vest in the Territory. 12. The Territory of Hawaii shall commence construction and alteration of the said replacement facilities within twelve months, and shall complete construction and alteration thereof within thirty months, from the date of this order. 13. The Territory of Hawaii shall not be called upon to furnish an operating equipment, appliances, or furniture in connection with the construction or alteration of replacement facilities but shall be responsible for installing any operating equipment, appliances, or furniture furnished by the Department of the Army and shall be responsible for furnishing and installing such standard furnishings and equipment (such as light fixtures, plumbing, locks, and washbasins) as are called for in the plans and specifications. 14. The Territory of Hawaii shall not be required to expend for the construction and alteration work outlined above (the intent and extent of which is covered, by reference, in paragraph 10), whether it be performed pursuant to approved final plans and specifications or pursuant to plans and specifications amended as set forth in paragraph 15, any sum in excess of $409,177, plus the cost of preparing plans and specifications. Subject to the foregoing limitation, the work contemplated shall be accomplished, and the cost thereof discharged, without further reference to the amounts set forth in the existing preliminary estimates as costs of the individual construction and alteration items comprising the overall project, and in case it is necessary to accomplish the intent with respect to one item savings on another or others shall be applied. But if the Territory of Hawaii shall have performed construction and alteration work in the amount of $409,177, in the approved order of priority of items and in accordance with approved plans and specifications as they may be amended, all as provided in this Part, the Territory of Hawaii shall be deemed to have completed all the work which the Territory is required by this Part to perform, irrespective of the amount of work actually accomplished. 15. The Territory of Hawaii shall furnish the Department of the Army monthly statements of expenditures for the said construction and alteration work to permit coordination of work placed and being placed with work not yet started, and the Department of the Army shall have the right to approve the schedule of such work and to amend plans and specifications, upon the giving of adequate notice. 16. When the Territory of Hawaii has completed to the satisfaction of the Department of the Army all the work which the Territory is required by this Part to perform, such work, except that which has already been accepted pursuant to the last sentence of paragraph 10 of this Part, shall be accepted by the Department of the Army, and when all such work has been accepted the Department shall so certify to the Territory of Hawaii. The Commanding General, United States Army, Pacific, shall represent the Department of the Army with respect to the acceptance of replacement facilities and certification that the conditions precedent set forth in this Part have been fulfilled, and with respect to any other matter covered by this order."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"policy-legal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["by virtue of the authority vested in me by section 91 of the act of April 30, 1900, 31 Stat. 159, as amended by section 7 of the act of May 27, 1910, 36 Stat. 447,"]},"combos":{"pl_pnl":true,"pl_im":false,"pnl_im":false,"other":false}},{"id":"EO11","meta":{"president":"Lyndon B. Johnson","date":"April 24, 1965","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-11218-amending-executive-order-no-11017-so-make-the-chairman-the-tennessee"},"chunks":[{"n":"1","text":"it is ordered that Executive Order No. 11017 of April 27,1962, as amended, be, and it is hereby, further amended by substituting for subsection (a) of Section 1 thereof the following:"},{"n":"2","text":"\"(a) There is hereby established the Recreation Advisory Council (hereinafter referred to as the Council). The Council shall be composed of the Secretary of the Interior, the Secretary of Agriculture, the Secretary of Defense, the Secretary of Commerce, the Secretary of Health, Education, and Welfare, the Administrator of the Housing and Home Finance Agency, and the Chairman of the Tennessee Valley Authority. The chairmanship of the Council shall rotate among these officials in the order named and for terms of two years each. Each of the foregoing officers may appoint a delegate to represent him in Council activity. When matters affecting the interests of Federal agencies (including, as used in this Order, executive departments and other executive agencies) the heads of which are not members of the Council are to be considered by the Council, the chairman of the Council shall invite such heads to participate in the deliberations of the Council.\""}],"perAnnotator":[{"name":"Claire","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["By virtue of the authority vested in me as President of the United States,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"EO14","meta":{"president":"William J. Clinton","date":"April 03, 1997","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-13041-further-amendment-executive-order-13010-amended"},"chunks":[{"n":"1","text":"it is hereby ordered that Executive Order 13010, as amended,"},{"n":"2","text":"is further amended by adding (1) \"(xii) Assistant to the President for Economic Policy and Director of the National Economic Council; and (xiii) Assistant to the President and Director of the Office of Science and Technology Policy.\" to section 2 of that order and (2) \"and 90 days\" after \"1 year\" in section 6(f) of that order."}],"perAnnotator":[{"name":"Claire","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"other"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"generic","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to add the Assistant to the President for Economic Policy and the Assistant to the President and Director, Office of Science and Technology Policy to the Principals Committee of the President's Commission on Critical Infrastructure Protection (\"Commission\") and to extend the life of the Commission for an additional 90 days,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"EO21","meta":{"president":"Harry S Truman","date":"April 22, 1948","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-9952-termination-reemployment-rights-federal-civilian-employees-who"},"chunks":[{"n":"1","text":"it is hereby ordered as follows: 1. All existing reemployment rights to positions in the Federal service acquired under authority of Executive Order No. 8973 of December 12, 1941, Executive Order No. 9067 of February 20, 1942, or Directive No. X as amended by Directive No. XVI of the War Manpower Commission (7 F.R. 7298, 11050), or under regulations of the Civil Service Commission issued pursuant thereto, shall expire at the end of the six months' period following the date of this order unless application for reemployment under such rights shall have been made before the end of such six months' period. 2. This order shall not affect reemployment rights heretofore or hereafter acquired under Executive Order No. 9711 of April 11, 1946, No. 9721 of May 10, 1946, No. 9862 of May 31, 1947, or No. 9932 of February 27, 1948. 3."},{"n":"2","text":"The Civil Service Commission is authorized to prescribe such rules and regulations and to establish such procedures as may be necessary for the administration of this order."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"internal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["By virtue of the authority vested in me by the Civil Service Act (22 Stat. 403) and by section 1753 of the Revised Statutes of the United States,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"EO22","meta":{"president":"Jimmy Carter","date":"June 29, 1978","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-12066-inspection-foreign-assistance-programs"},"chunks":[{"n":"1","text":"it is hereby ordered as follows: 1-1. Assignment of Duties and Responsibilities. 1-101."},{"n":"2","text":"I hereby direct the Secretary of State to assign to the Inspector General, Foreign Service, all duties and responsibilities vested in the Inspector General, Foreign Assistance by Section 624 (d) of the Act (22 U.S.C. 2384(d) ). 1-102."},{"n":"3","text":"Having determined that all of the authorities vested in the Inspector General, Foreign Assistance, by Section 624(d) of the Act are necessary for the Inspector General, Foreign Service, to carry out the duties and responsibilities assigned to him pursuant to this Order, I hereby authorize the Inspector General, Foreign Service, to exercise all such authorities subject to the provisions of Section 1-2 of this Order. 1-2. Performance of Duties and Responsibilities. 1-201. In carrying out his duties and responsibilities and in exercising his authorities pursuant to this Executive Order, the Inspector General, Foreign Service, shall not duplicate the scope of the audit, investigation and inspection authorities of the other agencies, including those of the Inspectors General of the armed services, and shall concentrate upon matters that have substantial and direct impact upon the responsibilities of the Secretary of State under Section 622(c) of the Act. 1-202. The authority described in Section 624(d) (6) of the Act shall be exercised by the Inspector General, Foreign Service, only with the specific consent of the Secretary of State and in accordance with regulations prescribed by the Secretary of State which, whenever practical, afford the head of any agency whose programs are subject to audit, review or inspection pursuant to such Section a reasonable opportunity to take corrective action before any suspension takes effect. 1-3. Administrative Matters. 1-301."},{"n":"4","text":"The Secretary of State shall provide for the appropriate transfer of offices, entities, property, and records of the Office of the Inspector General, Foreign Assistance to the Office of the Inspector General, Foreign Service. 1-302. This Executive Order is effective July 1, 1978."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal","2":"internal","3":"internal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal","3":"internal","4":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"2":"internal","3":"internal","4":"internal"},"scopes":{"2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"2":"internal","3":"policy-legal","4":"internal"},"scopes":{"2":"domestic","3":"domestic","4":"domestic"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["By the authority vested in me as President of the United States of America by Section 124 of the International Development and Food Assistance Act of 1977 (Public Law 95-88, 95 Stat. 541 ) and Section 301 of Title 3 of the United States Code, and in order to assist the Secretary of State in carrying .out his responsibilities under Section 622(c) of the Foreign Assistance Act of 1961, as amended (22 U.S.C. 2382 (c)), hereafter referred to as the Act,"]},"combos":{"pl_pnl":false,"pl_im":true,"pnl_im":false,"other":false}},{"id":"EO23","meta":{"president":"John F. Kennedy","date":"June 12, 1963","type":"executive_order","url":"https://www.presidency.ucsb.edu/documents/executive-order-11112-establishing-the-presidents-advisory-council-the-arts"},"chunks":[{"n":"1","text":"SECTION 1. Establishment of the Council. (a) There is hereby established the President's Advisory Council on the Arts (hereinafter referred to as the Council ). (b) The Council shall be composed of the Secretary of State, the Secretary of the Treasury, the Secretary of Defense, the Postmaster General, the Secretary of the Interior, the Secretary of Labor, the Secretary of Health, Education, and Welfare, the Housing and Home Finance Administrator, the Chairman of the Commission of Fine Arts, the Secretary of the Smithsonian Institution, the Director of the United States Information Agency, the Administrator of General Services, the President's Special Consultant on the Arts, and no more than thirty members appointed by the President from among persons in private life who are widely recognized for their role in the arts, including practicing artists, civic and cultural leaders, and others professionally engaged in the arts. Members from private life shall serve for terms of two years, except that the terms of members initially appointed shall be for one or two years as specified by the President. The Chairman shall also invite the Librarian of Congress to be a member of the Council. (c) The President shall designate the Chairman of the Council. (d) Federal members of the Council shall receive no compensation for such service. Members appointed from private life shall receive compensation for each day engaged on business of the Council and travel expenses, including per diem in lieu of subsistence, as authorized by law (5 U.S.C. 55a; 5 U.S.C. 73b-2) for persons in the Government service employed intermittently. (e) The Council shall meet at the call of the Chairman."},{"n":"2","text":"SEC. 2. Functions and Responsibilities of the Council. (a) The Council shall: (1) Survey and assess the needs and prospects of the various arts throughout the United States, the means used to encourage creative activity and to afford opportunity for participation in and appreciation and enjoyment of the arts, and the relative roles of governmental and non-governmental institutions in relation to the arts; (2) Identify existing Federal legislation, policies and programs which directly or indirectly affect the arts, and evaluate their current and potential effects on the development of cultural opportunities and institutions and, except to the extent that responsibility may be vested by statute in other Federal advisory bodies, the character and quality of Federal activities in the field of the arts; (3) Submit reports and recommendations to the President on its own initiative or at the request of the President or the President's Special Consultant on the Arts; (4) Encourage and facilitate the most effective use of resources available for support and development of the arts by advising and consulting with Federal, State and local agencies, civic and community organizations, educational institutions, foundations, and other interested organizations and institutions; and (5) Promote and stimulate public understanding and recognition of the importance of the arts and cultural institutions to our national welfare and our international interests. (b) In carrying out its functions the Council shall, insofar as practicable, provide interested Government and non-governmental agencies and organizations and private citizens, including practicing artists and others professionally engaged in the arts, an opportunity to present their views and recommendations to the Council for its consideration. (c) For the purposes of this section the arts are defined to include music, drama, opera, dance, painting, sculpture, literature, architecture and such allied fields as urban and landscape design, photography, graphic arts, crafts, motion pictures, radio and television. SEC 3. Federal Agencies. (a) As deemed necessary to facilitate the work of the Council, the Chairman may request the head of any executive department or agency whose activities have significant implications for the arts to designate a liaison officer to consult with and advise the Council on matters of common concern. (b) Upon request of the Chairman each executive department and agency is authorized and directed, consistent with law, to furnish the Council available information which the Council may require in the performance of its functions. (c) Each Federal agency represented on the Council shall furnish such necessary assistance to the Council as may be authorized by section 214 of the Act of May 3, 1945, 59 Stat. 134 (31 U.S.C. 691). (d) The General Services Administration is hereby designated as the agency which shall provide administrative services for the Council on a reimbursable basis."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["By virtue of the authority vested in me as President of the United States"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"M6","meta":{"president":"Gerald R. Ford","date":"April 30, 1976","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-the-special-representative-for-trade-negotiations-import-relief-for-the"},"chunks":[{"n":"1","text":"I have determined the actions I will take with respect to the report of the United States International Trade Commission (USITC), dated March 31, 1976, concerning the results of its investigation of a petition for continuation of import relief filed by the American Dinnerware Emergency Committee."},{"n":"2","text":"I have decided to extend the increased rates of duty currently in effect on imports of certain earthen dinnerware, and certain other ceramic tableware provided for in items 923.01,923.07pt. (that part related to item 533.38), 923.13 and 923.15 of the TSUSA for one year. These temporary duty increases will s
