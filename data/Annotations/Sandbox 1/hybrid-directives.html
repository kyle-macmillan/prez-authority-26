ubsequently be phased-down and will revert to trade agreement rates beginning May l, 1979, unless terminated before that time. Escape action rates of duty on steins and mugs and certain other ceramic tableware, provided for in items 923.03, 923.11, 923.05 and 923.07pt. respectively of the TSUSA, will revert to the trade agreement rates at the close of business April 30, 1976."},{"n":"3","text":"I have determined that these actions are in the national interest of the United States. Since May 1, 1972, the U.S. earthenware industry has made substantial economic adjustments to import competition. Profit and productivity levels have increased. The labor force is more efficiently utilized and the industry is more automated. However this adjustment process is not yet complete. Additional capital improvements are needed to complete this process. The major product of the U.S. industry is earthen dinnerware. Many earthen dinnerware producers are located in areas of economic depression and high unemployment. The immediate termination of all escape action duties on earthen dinnerware and certain other tableware that competes with earthen dinnerware would adversely affect the industry's efforts to adjust to import competition and would be detrimental to our national employment policies."},{"n":"4","text":"Since the purpose of escape action import relief is to provide temporary assistance to domestic producers to adjust to such competition, I am ending the tariff increases on those items that I determine to have adjusted to competition. Since the Kennedy Round of trade negotiations, when the U.S. Tariff schedules of earthen and china table and kitchen articles were last negotiated, duty rate disparities have resulted in tariff loopholes, and currency changes and inflation have made many of the categories in this schedule obsolete."},{"n":"5","text":"I am directing you, therefore, as the Special Representative for Trade Negotiations, to review the classification and rates of duty on dinnerware and related articles (Schedule 5, Part 2, Subpart C of the Tariff Schedules of the United States) to determine if changes are necessary to close tariff loopholes and change obsolete descriptions brought about by currency changes and inflation, and to enter into negotiations to make any changes you consider necessary."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal","3":"policy-legal","4":"policy-legal","5":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"policy-legal","3":"ceremonial","4":"policy-legal","5":"internal"},"scopes":{"1":"domestic","2":"foreign","3":"domestic","4":"foreign","5":"foreign"},"hybrid":true,"reason":"both"},{"name":"Jennifer Nou","labels":{"1":"other","2":"policy-legal","3":"other","4":"policy-legal","5":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"2":"policy-legal","3":"policy-nonlegal","4":"policy-nonlegal","5":"policy-nonlegal"},"scopes":{"2":"foreign","3":"foreign","4":"foreign","5":"foreign"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":4,"vesting":{"category":"specific","clauses":["PURSUANT to Section 203(h)(3) of the Trade Act of 1974 (P.L. 93-618, 88 Stat. 1978),"]},"combos":{"pl_pnl":true,"pl_im":true,"pnl_im":false,"other":false}},{"id":"M10","meta":{"president":"Joseph R. Biden, Jr.","date":"August 16, 2024","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-delegation-authority-designate-existing-official-serve-within-the-executive"},"chunks":[{"n":"1","text":"I hereby delegate to the Secretary of State, in consultation with the Assistant to the President for National Security Affairs, the Secretary of Defense, the Director of National Intelligence, the Secretary of the Treasury, the Administrator of the United States Agency for International Development, and the Attorney General, the authority to designate an existing official to serve within the executive branch as the Coordinator for Detained ISIS Members and Relevant Displaced Populations in Syria. This official will carry out the responsibilities consistent with section 1224 of the National Defense Authorization Act for Fiscal Year 2020 (Public Law 116-92), as amended by section 1262 of the National Defense Authorization Act for Fiscal Year 2024 (Public Law 118-31). The delegation in this memorandum shall apply to any provision of any future public law that is the same or substantially the same as the provision referenced in this memorandum."},{"n":"2","text":"Upon exercise of this authority, the Secretary of State shall provide notice to the President through the Assistant to the President for National Security Affairs."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal","2":"internal"},"scopes":{"1":"foreign","2":"domestic"},"hybrid":true,"reason":"scope"},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-legal","2":"other"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":2,"vesting":{"category":"specific","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M13","meta":{"president":"Ronald Reagan","date":"August 05, 1988","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandums-the-human-immunodeficiency-virus-epidemic"},"chunks":[{"n":"1","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"2","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress."},{"n":"3","text":"In carrying out your functions, I ask that you address HIV-related activities as follows: 1. Review your FY 1989 spending plans to incorporate relevant recommendations of my HIV Commission. 2. Convene a series of consensus conferences over a 12-month period involving State, local, and private groups to encourage them to adopt the specific public health measures discussed in the Commission Report, such as increased counseling and testing, reporting of HIV infection, partner notification, and health care worker safety. One conference should address restrictive measures and criminal statutes directed to HIV-infected persons who knowingly persist in maintaining behaviors that transmit their infection. Another possible topic is the serious problem of neighborhood resistance to facilities for the care of HIV patients, drug abusers, and group homes for HIV-infected infants and children. 3. Increase the number of community-based educational programs, especially programs directed to those women and members of minority groups who are at highest risk of HIV infection. These programs, and especially those directed to youth, should place greater emphasis on my Principles for AIDS Education, especially those encouraging individuals to take responsibility for their efforts to prevent the spread of HIV infection. Please collaborate with the Department of Education in developing youth-oriented programs. 4. Implement actions within the next 45 days that address the blood safety issues raised by the Commission. This plan should address: (a) the prompt notification of transfusion recipients who are at increased risk of HIV infection; (b) steps to improve HIV laboratory quality and HIV screening tests; and, (c) ways to encourage the use of autologous transfusions in appropriate circumstances. 5. Implement actions within the next 60 days to improve and accelerate further the process for development, evaluation, approval, and distribution of HIV-related vaccines, drugs, and devices. This plan should draw upon research of Federal and State governments, the private sector, academia, and national laboratories. 6. Provide me, within 120 days, with an assessment of private incentives for development and marketing of HIV products, including an evaluation of the need, if any, to have Federal authority with which to offer increased incentives in exchange for royalties, licenses, or pricing concessions. This assessment should take into consideration solutions proposed in the February 1986 report of the Tort Policy Working Group. In doing this assessment, please consult with the Departments of Justice and Defense. 7. Undertake an evaluation of our current system of health care financing to be completed within 1 year. 8. Conduct specific studies of ways to better promote out-of-hospital and case managed care; to encourage States to establish insurance risk pools for medically uninsurable persons; and to increase the responsiveness of the public health and health services system to HIV-infected infants, children, adolescents, and to low-income disabled individuals. 9. Provide me an update by December 15, 1988, of the 1986 PHS plan for combatting HIV infection, reflecting, in part, both the Commission Report and the recent Public Health Service Charlottesville planning conference."},{"n":"4","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"5","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress."},{"n":"6","text":"To carry this out, please provide me with an expeditious review and response to the Commission's recommendations on how the Federal government should provide direction and leadership in encouraging nondiscrimination for HIV-infected individuals, including a review of current Federal and State laws in this area."},{"n":"7","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"8","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress."},{"n":"9","text":"In carrying out your functions, I ask that you address HIV-related activities as follows: 1. Review your FY 1989 spending plans to incorporate relevant recommendations of my HIV Commission; 2. Include in your FY 1990 budget submissions appropriate funds for the United States regular and special contributions to international HIV efforts, especially those in less-developed countries; 3. Continue to emphasize our commitment to international technical assistance; and, 4. Propose, within 120 days, a 3-year plan for international efforts against HIV infection."},{"n":"10","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"11","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress."},{"n":"12","text":"In carrying out your functions, I ask that you address HIV-related activities as follows: 1. Consult with the General Services Administration, the Office of Personnel Management, and the Department of Health and Human Services to ensure that HIV activities included in the FY 1989 and FY 1990 budgets reflect appropriate funding, personnel levels, and office and laboratory space. The budget, as well as other management initiatives, should also address the removal of both administrative and statutory impediments to efficient use of these resources including grant, contract, and hiring procedures. OMB should take a positive role in removing any unnecessary administrative and management impediments to the agencies' attack on HIV infection. 2. Ensure that my FY 1990 budget for HIV-related activities is submitted to the Congress in a timely manner, and that the Congress is encouraged to act on it quickly."},{"n":"13","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"14","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress."},{"n":"15","text":"I am directing Donald Ian Macdonald, Deputy Assistant to the President for Drug Abuse Policy,"},{"n":"16","text":"to monitor progress on our response to the Commission's Report and provide me with status reports in September and December, 1988. Please provide Dr. Macdonald with appropriate information about your progress, including an update at regular intervals on agency actions on the guidelines."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal","5":"policy-nonlegal","6":"policy-nonlegal","8":"policy-nonlegal","9":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","5":"domestic","6":"domestic","8":"domestic","9":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"other","2":"internal","3":"internal","4":"other","5":"internal","6":"internal","7":"other","8":"internal","9":"internal","10":"other","11":"internal","12":"internal","13":"other","14":"internal","15":"other","16":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic","6":"domestic","7":"domestic","8":"domestic","9":"domestic","10":"domestic","11":"domestic","12":"domestic","13":"domestic","14":"domestic","15":"domestic","16":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"internal","2":"internal","3":"policy-nonlegal","4":"internal","5":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic","5":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"2":"policy-nonlegal","3":"policy-nonlegal","5":"policy-nonlegal","6":"policy-nonlegal","8":"policy-nonlegal"},"scopes":{"2":"domestic","3":"domestic","5":"domestic","6":"domestic","8":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":2,"vesting":{"category":"no_vesting_clause","clauses":[]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"M1","meta":{"president":"Barack Obama","date":"December 16, 2014","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-withdrawal-certain-areas-the-united-states-outer-continental-shelf-from-1"},"chunks":[{"n":"1","text":"Consistent with principles of responsible public stewardship entrusted to this office, with due consideration of the importance of Bristol Bay and the North Aleutian Basin Planning Area to subsistence use by Alaska Natives, wildlife, wildlife habitat, and sustainable commercial and recreational fisheries, and to ensure that the unique resources of Bristol Bay remain available for future generations, I hereby revoke my memorandum of March 31, 2010 (Withdrawal of Certain Areas of the United States Outer Continental Shelf from Leasing Disposition), and direct as follows:"},{"n":"2","text":"I hereby withdraw from disposition by leasing for a time period without specific expiration the area of the Outer Continental Shelf currently designated by the Bureau of Ocean Energy Management as the North Aleutian Basin Planning Area (Area), including Bristol Bay, offshore Alaska. This withdrawal prevents consideration of this Area for any oil or gas leasing for purposes of exploration, development, or production."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"other","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["Under the authority granted to me in section 12(a) of the Outer Continental Shelf Lands Act, 43 U.S.C. 1341(a),"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M4","meta":{"president":"George Bush","date":"July 24, 1989","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-adoption"},"chunks":[{"n":"1","text":"I am directing you and your staff to consider ways to provide such leadership to advance the adoption alternative. Adoption can help to address some of our more pressing issues: teenage pregnancy, foster care, infertility, and welfare dependency. Most importantly, adoption provides a home and love to children who may have neither. Consider just a few facts: An estimated 15 percent of American couples of reproductive age are infertile. About 60,000 children are adopted every year in this country. Of these, 10,000 come from foreign countries. Right now, nearly 30,000 American children are legally available for adoption. Some of them are school-age, some are physically or emotionally handicapped, some are members of sibling groups that need to be placed in the same home, and some are minority children. Each year nearly 25,000 American babies are given life and the chance to be loved when their mothers choose adoption over abortion or unwanted parenthood, yet the opportunity to consider adoption is often denied to pregnant women. I am told that as much as 40 percent of pregnancy counseling does not even mention adoption. I have instructed my Domestic Policy Council to develop a Presidential adoption initiative, and that process is well under way."},{"n":"2","text":"To complement this effort, I am asking you to develop methods for supporting the adoption plans and needs of your employees and for promoting adoption among your workforce. Here are just a few ideas: Use agency resources for employees who are considering adopting, who have adopted children, or who have a family member facing a crisis pregnancy. Employee Assistance Programs (EAPs) may be the most appropriate resource. Begin planning now for agency-wide celebration and observance of National Adoption Week (Thanksgiving Week). Your agency's focus could be upon local children in need of adoptive homes. Ensure that all employee supervisors are as flexible as possible regarding the adoption-related leave needs of employees. This might include incremental (hourly) leave needed to meet with adoption agency personnel or longer periods of leave to care for a newly adopted child. Feature adoption articles in agency newsletters. These might include stories about employees who have adopted special needs children, infants, or children from other countries, as well as a regular column picturing a local waiting child. I have instructed both the Department of Health and Human Services and the Office of Personnel Management to work with you in implementing these and other ideas. A commitment to adoption is one we can all share. With just a small effort, we can help our own employees and, just as importantly, we can provide national leadership in support of adoption. Finding loving homes for waiting children is reward enough."}],"perAnnotator":[{"name":"Claire","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"ceremonial"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"policy","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"no_vesting_clause","clauses":[]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M5","meta":{"president":"George W. Bush","date":"March 12, 2002","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-inventory-federal-service-opportunities-and-regulatory-barriers-community-and"},"chunks":[{"n":"1","text":"Consistent with that policy, I hereby direct you to"},{"n":"2","text":"take the following steps: • Within 30 days, identify and report to the Assistant to the President and Director of the USA Freedom Corps Office on the service opportunities both for your employees and for the public at large that are sponsored or administered by your department or agency. Such report shall also describe the extent to which this information is available to the public on your department or agency's website. • Within 30 days, identify and report to the Assistant to the President and Director of the USA Freedom Corps Office on Federal regulatory and programmatic barriers in your department or agency to community and other service by Americans. Such report shall also include recommendations as to how to modify or repeal such barriers in order to enhance service opportunities. This directive shall be construed consistent with Executive Order 13254."}],"perAnnotator":[{"name":"Claire","labels":{"2":"internal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"other","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"2":"policy-nonlegal"},"scopes":{"2":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"no_vesting_clause","clauses":[]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M8","meta":{"president":"Jimmy Carter","date":"June 01, 1979","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-from-the-president-trade-with-romania-and-hungary"},"chunks":[{"n":"1","text":"I determine, pursuant to Subsections 402(d) (5) and (d) (5) (c) of the Act, that the further extension of the waiver authority granted by Subsection 402 (c) of the Act will substantially promote the objectives of Section 402 of the Act."},{"n":"2","text":"I further determine that continuation of the waivers applicable to the Socialist Republic of Romania and to the Hungarian People's Republic will substantially promote the objectives of Section 402 of the Act."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"ceremonial"},"scopes":{"1":"domestic","2":"foreign"},"hybrid":true,"reason":"scope"},{"name":"Jennifer Nou","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"specific","clauses":["Pursuant to the authority vested in me under the Trade Act of 1974, (Public Law 93-618, January 3, 1975; 88 Stat. 1978) (hereinafter \"the Act\"),","pursuant to Subsections 402(d) (5) and (d) (5) (c) of the Act,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M18","meta":{"president":"George Bush","date":"December 06, 1989","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-education-hispanic-americans"},"chunks":[{"n":"1","text":"I am directing you to form a Task Force within that Working Group to focus on Hispanic education. The Task Force on Hispanic Education will report to me through the Domestic Policy Council and its Education Working Group. Specifically, the Task Force on Hispanic Education should: Assess the participation of Hispanics in Federal education programs. Identify barriers that may limit Hispanic participation in education programs and suggest remedies. Suggest goals and strategies for the education of Hispanics (e.g., reducing the dropout rate, increasing enrollment in higher education, and promoting adult literacy)."},{"n":"2","text":"These goals should be considered in conjunction with the process of setting national education goals as called for at our Education Summit. I also understand that you will be appointing a special advisor on dropouts -- a new position in your office."},{"n":"3","text":"Because of the problem of dropout rates in the Hispanic community, I urge you to direct your special advisor to work closely with representatives of the Hispanic community. We must step up our efforts to ensure the education of Hispanic Americans as a vital part of our overall commitment to excellence in education."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"internal","2":"ceremonial","3":"internal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal","3":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"no_vesting_clause","clauses":[]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"M24","meta":{"president":"Joseph R. Biden, Jr.","date":"December 12, 2024","type":"memorandum","url":"https://www.presidency.ucsb.edu/documents/memorandum-establishment-the-china-censorship-monitor-and-action-group"},"chunks":[{"n":"1","text":"Sec. 3. Membership. (a) The Task Force shall be chaired by the Assistant to the President for National Security Affairs, or his or her designee, and vice-chaired by the Director of the National Economic Council, or his or her designee. (b) In addition to the Chair and the Vice Chair, the Task Force shall consist of representatives from the following executive departments and agencies (agencies), the heads of which shall designate or appoint personnel at the level of Assistant Secretary or above to participate in the Task Force: (i) the Department of State; (ii) the Department of the Treasury; (iii) the Department of Defense; (iv) the Department of Justice; (v) the Department of Agriculture; (vi) the Department of Commerce; (vii) the Department of Education; (viii) the Department of Homeland Security; (ix) the Office of the Director of National Intelligence; (x) the Office of the United States Trade Representative; (xi) the Central Intelligence Agency; (xii) the Federal Bureau of Investigation; and (xiii) other agencies and offices as the President may, from time to time, designate."},{"n":"2","text":"Sec. 5. Annual Report of the Task Force. (a) Within 120 days of the date of this memorandum, the Task Force shall submit to the President and the appropriate congressional committees, as defined in section 5515(a)(1) of the Act (22 U.S.C. 3363(a)(1)), the strategy described in section 5515(b)(3)(A) of the Act. (b) Within 180 days of the date of this memorandum, the Task Force shall submit to the President and the appropriate congressional committees, and make publicly available to the extent consistent with national security and other executive branch confidentiality interests, the first annual report described in section 5515(b)(6)(A)-(B) of the Act (22 U.S.C. 3363(b)(6)). (c) Within 1 year of submitting the first annual report described in subsection (b) of this section, and every year thereafter, the Task Force shall submit to the President and the appropriate congressional committees, and make publicly available to the extent consistent with national security and other executive branch confidentiality interests, the required follow-on annual reports described in section 5515(b)(6)(A)-(B) of the Act, until the requirement terminates as specified in section 5515(d) of the Act (22 U.S.C. 3363(d))."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"internal","2":"internal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"internal","2":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"generic","clauses":["By the authority vested in me as President by the Constitution and the laws of the United States of America, and to monitor and address the effects of any efforts by the People's Republic of China (PRC), either directly or through proxies, to censor or intimidate any United States person,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":true,"other":false}},{"id":"L10","meta":{"president":"Joseph R. Biden, Jr.","date":"June 08, 2021","type":"letter","url":"https://www.presidency.ucsb.edu/documents/letter-congressional-leaders-blocking-property-and-suspending-entry-into-the-united-states"},"chunks":[{"n":"1","text":"I hereby report that I have issued an Executive Order in order to expand the scope of the national emergency declared in Executive Order 13219 of June 26, 2001 (Blocking Property of Persons Who Threaten International Stabilization Efforts in the Western Balkans), as amended by Executive Order 13304 of May 28, 2003 (Termination of Emergencies With Respect to Yugoslavia and Modification of Executive Order 13219 of June 26, 2001), finding that the situation in the territory of the former Socialist Federal Republic of Yugoslavia and the Republic of Albania (the Western Balkans), over the past two decades, including the undermining of post-war agreements and institutions following the breakup of the former Socialist Federal Republic of Yugoslavia, as well as widespread corruption within various governments and institutions in the Western Balkans, stymies progress toward effective and democratic governance and full integration into transatlantic institutions, and thereby constitutes an unusual and extraordinary threat to the national security and foreign policy of the United States. The order broadens the geographic scope of the existing sanctions regime to include Albania and augments designation criteria for current threats to United States national security and foreign policy interests in the region, including obstruction of democratic and judicial processes, corruption, and organized crime. Actions undermining post-war agreements and institutions following the breakup of the former Socialist Federal Republic of Yugoslavia, as well as widespread corruption within various governments and institutions in the Western Balkans, stymies progress toward effective and democratic governance and full integration into transatlantic institutions, and thereby constitutes an unusual and extraordinary threat to the national security and foreign policy of the United States."},{"n":"2","text":"I have therefore determined that it is necessary to block the property and interests in property of any persons who are determined by the Secretary of the Treasury, in consultation with the Secretary of State, to have undermined democratic processes or institutions, undermined any regional security, peace, cooperation, or mutual recognition agreement or framework or accountability mechanism, engaged in serious human rights abuse, or directly or indirectly engaged in corruption related to the Western Balkans. All executive departments and agencies are directed to take all appropriate measures within their authority to carry out the provisions of the order. I am enclosing a copy of the Executive Order I have issued."}],"perAnnotator":[{"name":"Claire","labels":{"1":"policy-legal","2":"policy-legal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null},{"name":"Thomas Weil","labels":{"1":"operative_congress","2":"ceremonial"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"1":"policy-nonlegal","2":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign"},"hybrid":false,"reason":null}],"present":3,"hybridCount":1,"vesting":{"category":"specific","clauses":["Pursuant to the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.),"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"P12","meta":{"president":"Richard Nixon","date":"March 23, 1973","type":"proclamation","url":"https://www.presidency.ucsb.edu/documents/proclamation-4202-modifying-proclamation-no-3279-relating-imports-petroleum-and-petroleum"},"chunks":[{"n":"1","text":"do hereby proclaim that, effective as of this date, paragraph (b) of section 4 of Proclamation No. 3279, as amended,"},{"n":"2","text":"(1) within the limits of the maximum levels of imports established in section 2 of this proclamation, to modify on the grounds of error any allocation made to any person under such regulations;"},{"n":"3","text":"(2) without regard to the limits of the maximum levels of imports established in section 2 of this proclamation, (i) to modify, on the grounds of exceptional hardship, any allocation made to any person under such regulations; (ii) to grant allocations of imports of crude oil and unfinished oils in special circumstances to persons with importing histories who do not qualify for allocations under such regulations; and (iii) to grant allocations of imports of finished products on the grounds of exceptional hardship to persons who do not qualify for allocations under such regulations; and"},{"n":"4","text":"(3) to review the revocation or suspension of any allocation or license. The Secretary may provide that the Board may take such action on petitions as it deems appropriate and that the decisions by the Appeals Board shall be final.\""}],"perAnnotator":[{"name":"Claire","labels":{"2":"policy-legal","3":"policy-legal","4":"policy-legal"},"scopes":{"2":"foreign","3":"foreign","4":"domestic"},"hybrid":true,"reason":"scope"},{"name":"Thomas Weil","labels":{"1":"other","2":"policy-legal","3":"policy-legal","4":"policy-nonlegal"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":true,"reason":"category"},{"name":"Jennifer Nou","labels":{"1":"policy-legal","2":"policy-legal","3":"policy-legal","4":"policy-nonlegal"},"scopes":{"1":"foreign","2":"foreign","3":"foreign","4":"foreign"},"hybrid":true,"reason":"category"},{"name":"KyleM","labels":{"2":"policy-legal","3":"policy-legal","4":"policy-nonlegal"},"scopes":{"2":"foreign","3":"foreign","4":"foreign"},"hybrid":true,"reason":"category"}],"present":4,"hybridCount":4,"vesting":{"category":"specific","clauses":["by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962,","Now, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and laws of the United States, including section 232 of the Trade Expansion Act of 1962"]},"combos":{"pl_pnl":true,"pl_im":false,"pnl_im":false,"other":false}},{"id":"P19","meta":{"president":"George W. Bush","date":"September 30, 2008","type":"proclamation","url":"https://www.presidency.ucsb.edu/documents/proclamation-8296-modify-duty-free-treatment-under-the-caribbean-basin-economic-recovery"},"chunks":[{"n":"1","text":"I have determined, and hereby certify, that Haiti and the Dominican Republic have developed the procedures described in section 213A(f)(3) of CBERA. 4. Section 15406 of the HOPE II Act (122 Stat. 2308) authorizes the President to exercise the authority provided under section 604 of the Trade Act of 1974, as amended (19 U.S.C. 2483) (the \"1974 Act\"), to proclaim such modifications to the Harmonized Tariff Schedule of the United States (HTS) as may be necessary to carry out the HOPE II Act. 5."},{"n":"2","text":"I have determined that it is appropriate to authorize the United States Trade Representative (USTR) to perform the following functions: the functions set forth in section 213A(d)(4) of CBERA, as amended (122 Stat. 2307; 19 U.S.C. 2703a(d)(4)); the reporting function set forth in section 213A(e)(1)(B)(ii) of CBERA, as amended (122 Stat. 2302; 19 U.S.C. 2703a(e)(1)(B)(ii)); the consultation function set forth in section 213A(e)(1)(C)(i) of CBERA, as amended (122 Stat. 2302-3; 19 U.S.C. 2703a(e)(1)(C)(i)); and the functions set forth in section 213A(e)(5) of CBERA, as amended (122 Stat. 2307; 19 U.S.C. 2703a(e)(5)). 6."},{"n":"3","text":"I have determined that it is appropriate to authorize the Secretary of Labor, in consultation with the USTR, to perform the functions els":{"1":"ceremonial","2":"ceremonial","3":"ceremonial","4":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"ceremonial","2":"ceremonial","3":"ceremonial","4":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"ceremonial","2":"ceremonial","3":"ceremonial","4":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic","4":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"generic","clauses":["Now, Therefore, I, John F. Kennedy, President of the United States of America,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}},{"id":"P11","meta":{"president":"Lyndon B. Johnson","date":"September 30, 1965","type":"proclamation","url":"https://www.presidency.ucsb.edu/documents/proclamation-3676-veterans-day-1965"},"chunks":[{"n":"1","text":"call upon all the people of our Nation to observe Thursday, November 11, 1965, as Veterans Day, commemorating the service of our war veterans and showing our continued dedication to the cause of world peace and the establishment of a world community in which every nation can follow its own course without fear of its neighbors."},{"n":"2","text":"I direct the appropriate officials of the Government to arrange for the display of the flag of the United States on all public buildings on Veterans Day."},{"n":"3","text":"Also, in order that this day may be marked with suitable exercises and public ceremonies throughout our Nation, I request the officials of the Federal and State Governments and of civic and patriotic organizations to give their enthusiastic support to the Veterans Day National Committee."}],"perAnnotator":[{"name":"Claire","labels":{"1":"ceremonial","2":"internal","3":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":true,"reason":"category"},{"name":"Thomas Weil","labels":{"1":"ceremonial","2":"ceremonial","3":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null},{"name":"Jennifer Nou","labels":{"1":"ceremonial","2":"ceremonial","3":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null},{"name":"KyleM","labels":{"1":"ceremonial","2":"ceremonial","3":"ceremonial"},"scopes":{"1":"domestic","2":"domestic","3":"domestic"},"hybrid":false,"reason":null}],"present":4,"hybridCount":1,"vesting":{"category":"generic","clauses":["Now, Therefore, I, Lyndon B. Johnson, President of the United States of America,"]},"combos":{"pl_pnl":false,"pl_im":false,"pnl_im":false,"other":true}}],"total":100,"annotators":["Claire","Thomas Weil","Jennifer Nou","KyleM"]}</script>
<script>
(function(){
'use strict';
var data=JSON.parse(document.getElementById('payload').textContent);
var docs=data.docs;
var total=data.total;
var annotators=data.annotators;
var crit='any';
var annFilter='all';
var vestFilter=new Set(['generic','specific','no_vesting_clause']);
var comboFilter={pl_pnl:true,pl_im:true,pnl_im:true,other:true};

var CAT_LABELS={
  'ceremonial':'Ceremonial',
  'internal':'Internal',
  'policy-legal':'Policy / Legal',
  'policy-nonlegal':'Policy / Non-legal',
  'operative_congress':'Operative (Congress)',
  'other':'Other',
  'policy':'Policy'
};
var SCOPE_LABELS={'domestic':'Domestic','foreign':'Foreign'};
var REASON_LABELS={
  'category':'category differs',
  'scope':'scope differs',
  'both':'category & scope differ'
};
var VC_LABELS={
  'generic':'Boilerplate',
  'specific':'Specific',
  'no_vesting_clause':'No vesting clause'
};
var GROUP_NAMES={
  'EO':'Executive Orders',
  'M':'Memoranda',
  'L':'Letters',
  'P':'Proclamations'
};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function catClass(label){
  if(!label)return 'cat-missing';
  return 'cat-'+String(label).replace(/_/g,'-');
}

function prefixOf(id){
  var m=/^([A-Z]+)\d+$/.exec(id);
  return m?m[1]:'';
}

function qualifies(doc){
  if(!vestFilter.has(doc.vesting.category))return false;
  var c=doc.combos;
  if(!(comboFilter.pl_pnl&&c.pl_pnl||comboFilter.pl_im&&c.pl_im||comboFilter.pnl_im&&c.pnl_im||comboFilter.other&&c.other))return false;
  if(annFilter!=='all'){
    return doc.perAnnotator.some(function(a){return a.name===annFilter&&a.hybrid;});
  }
  var h=doc.hybridCount,p=doc.present;
  if(crit==='any')return h>=1;
  if(crit==='majority')return h>p/2;
  if(crit==='unanimous')return h===p;
  return false;
}

function renderVesting(vc){
  var cls='vc-'+vc.category;
  var lbl=VC_LABELS[vc.category]||vc.category;
  var out='<div class="vesting-section">'+
    '<div class="vesting-label">Vesting clause</div>'+
    '<span class="vesting-badge '+esc(cls)+'">'+esc(lbl)+'</span>';
  vc.clauses.forEach(function(c){
    out+='<div class="vesting-clause-text">'+esc(c)+'</div>';
  });
  return out+'</div>';
}

function renderDoc(doc){
  var visibleAnns=annFilter==='all'
    ? doc.perAnnotator
    : doc.perAnnotator.filter(function(a){return a.name===annFilter;});
  var hybridAnns=doc.perAnnotator.filter(function(a){return a.hybrid;});
  var summaryParts=hybridAnns.map(function(a){
    return '<strong>'+esc(a.name)+'</strong> <span class="reason">('+esc(REASON_LABELS[a.reason]||a.reason)+')</span>';
  });

  var thead='<tr><th class="chunk-col">Sub-directive</th>';
  visibleAnns.forEach(function(a){
    thead+='<th class="ann-col">'+esc(a.name)+(a.hybrid?' ★':'')+'</th>';
  });
  thead+='</tr>';

  var tbody='';
  doc.chunks.forEach(function(chunk){
    tbody+='<tr>';
    tbody+='<td><span class="chunk-n">#'+esc(chunk.n)+'</span><span class="chunk-text">'+esc(chunk.text)+'</span></td>';
    visibleAnns.forEach(function(a){
      var cat=a.labels[chunk.n];
      var scope=a.scopes[chunk.n];
      tbody+='<td>';
      tbody+='<span class="badge '+esc(catClass(cat))+'">'+esc(cat?(CAT_LABELS[cat]||cat):'—')+'</span>';
      if(scope)tbody+='<span class="scope-badge scope-'+esc(scope)+'">'+esc(SCOPE_LABELS[scope]||scope)+'</span>';
      tbody+='</td>';
    });
    tbody+='</tr>';
  });

  var m=doc.meta;
  var srcLink=m.url
    ? ' <a class="src-link" href="'+esc(m.url)+'" target="_blank" rel="noopener">source ↗</a>'
    : '';
  return '<details class="doc" open>'+
    '<summary class="doc-head">'+
      '<span class="doc-id">'+esc(doc.id)+'</span>'+
      '<span class="doc-prez">'+esc(m.president)+'</span>'+
      '<span class="doc-meta">'+esc(m.date)+' · '+esc((m.type||'').replace(/_/g,' '))+srcLink+'</span>'+
      '<span class="hybrid-badge">'+doc.hybridCount+' / '+doc.present+' annotators</span>'+
    '</summary>'+
    '<div class="doc-body">'+
      renderVesting(doc.vesting)+
      '<div class="hybrid-summary">Hybrid for: '+summaryParts.join(' · ')+'</div>'+
      '<div class="table-wrap"><table class="chunk-table">'+
        '<thead>'+thead+'</thead>'+
        '<tbody>'+tbody+'</tbody>'+
      '</table></div>'+
    '</div>'+
  '</details>';
}

function render(){
  var shown=docs.filter(qualifies);
  var isSingle=annFilter!=='all';
  document.getElementById('crit-toggle').classList.toggle('disabled',isSingle);
  document.getElementById('vis-count').textContent=
    shown.length+' of '+total+' directives are hybrid'+(isSingle?' for '+annFilter:'');

  // Render with group headers between doc-type sections
  var html='<section class="documents">';
  var lastPrefix=null;
  shown.forEach(function(doc){
    var prefix=prefixOf(doc.id);
    if(prefix!==lastPrefix){
      if(lastPrefix!==null)html+='</section><section class="documents">';
      html+='<h2 class="group-head">'+esc(GROUP_NAMES[prefix]||prefix)+'</h2>';
      lastPrefix=prefix;
    }
    html+=renderDoc(doc);
  });
  html+='</section>';

  document.getElementById('docs-list').innerHTML=shown.length
    ? html
    : '<div class="empty">No directives qualify under this criterion.</div>';

  ['any','majority','unanimous'].forEach(function(c){
    document.getElementById('crit-'+c).classList.toggle('active',crit===c);
  });
}

// Populate annotator dropdown
(function(){
  var sel=document.getElementById('ann-filter');
  sel.innerHTML='<option value="all">All annotators</option>';
  annotators.forEach(function(name){
    var opt=document.createElement('option');
    opt.value=name;opt.textContent=name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change',function(){annFilter=this.value;render();});
})();

document.querySelectorAll('.vc-cb').forEach(function(cb){
  cb.addEventListener('change',function(){
    if(this.checked)vestFilter.add(this.value);else vestFilter.delete(this.value);
    render();
  });
});
document.querySelectorAll('.combo-cb').forEach(function(cb){
  cb.addEventListener('change',function(){comboFilter[this.value]=this.checked;render();});
});

document.getElementById('crit-any').addEventListener('click',function(){crit='any';render();});
document.getElementById('crit-majority').addEventListener('click',function(){crit='majority';render();});
document.getElementById('crit-unanimous').addEventListener('click',function(){crit='unanimous';render();});

render();
})();
</script>
</body>
</html>
