acy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L1":{"metadata":{"president":"William J. Clinton","date":"October 15, 1997","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nI hereby report to the Congress on the developments since my last report concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c).\n\n1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in property subject to U.S. jurisdiction of persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order (collectively \"Specially Designated Narcotics Traffickers\" or SDNTs).\n\nThe Order further prohibits any transaction or dealing by a United States person or within the United States in property or interests in property of SDNTs, and any transaction that evades or avoids, has the purpose of evading or avoiding, or attempts to violate, the prohibitions contained in the Order.\n\nDesignations of foreign persons blocked pursuant to the Order are effective upon the date of determination by the Director of the Department of the Treasury's Office of Foreign Assets Control (OFAC) acting under authority delegated by the Secretary of the Treasury. Public notice of blocking is effective upon the date of filing with the Federal Register, or upon prior actual notice.\n\n2. On October 24, 1995, the Department of the Treasury issued a Notice containing 76 additional names of persons determined to meet the criteria set forth in Executive Order 12978 (60 Fed. Reg. 54582, October 24, 1995).\n\nThe Department of the Treasury issued another Notice adding the names of one additional entity and three additional individuals, as well as expanded information regarding addresses and pseudonyms, to the list of SDNTs on November 29, 1995, (60 Fed. Reg. 61288).\n\nOn March 8, 1996, OFAC published a Notice in the Federal Register adding the names of 138 additional individuals and 60 entities designated pursuant to the Order, and revising information for 8 individuals on the list of blocked persons contained in the notices published on November 29, 1995, and October 24, 1995. (61 Fed. Reg. 9523).\n\n3. On January 21, 1997, OFAC published a Notice in the Federal Register adding the names of 57 individuals and 21 entities designated pursuant to the Order, and revising information for 58 individuals and 1 entity (62 Fed. Reg. 2903). In addition, the name of one individual specially designated narcotics trafficker was removed from the list. These changes were effective January 15, 1997.\n\nThese 78 new names brought the total list of SDNTs to 359. Each of the 78 newly designated entities and individuals has been determined to be owned or controlled or to act for or on behalf of the Cali cartel's Helmer \"Pacho\" Herrera Buitrago organization. The newly identified SDNTs included several large poultry processing plants and farms, investment and import/ export firms, real estate businesses, a consulting firm, a lumber distributor, and a construction company, all located in Colombia.\n\nThe additional name and address information includes one previously designated company controlled by the Herrera Buitrago family and 58 previously designated individuals from either the Herrera Buitrago or the Rodriguez Orejuela organizations of the Cali cartel.\n\nEffective February 28, 1997, OFAC issued the Narcotics Trafficking Sanctions Regulations (NTSR), 31 C.F.R. Part 536, to further implement the President's declaration of a national emergency and imposition of sanctions against significant foreign narcotics traffickers centered in Colombia (62 Fed. Reg. 9959, March 5, 1997).\n\n4. On April 17, 1997, OFAC added to appendices A and B to 31 C.F.R. chapter V the names 46 individuals and 11 entities, and revised information concerning 25 individuals, who have been determined to play a significant role in international narcotics trafficking centered in Colombia or have been determined to be owned or controlled by, or to act for or on behalf of, other specially designated narcotics traffickers (62 Fed. Reg. 19500, April 22, 1997).\n\nOn July 30, 1997, OFAC published the names of seven businesses and seven associated individuals determined to be acting as fronts for the Cali cartel in Colombia (62 Fed. Reg. 41850, August 4, 1997). The seven newly designated companies are successors to firms previously designated because they were owned or controlled by the Rodriguez Orejuela, Herrera Buitrago, or Santacruz Londono families of the Cali cartel. This action is part of the ongoing interagency implementation of Executive Order 12978 of October 21, 1995. These 14 names were added to the previous SDNT list bringing to a total of 428 businesses and individuals with whom financial and business dealings are prohibited and whose assets are blocked under the Order. All 428 SDNTs were determined to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order.\n\nThe seven newly named companies include a major poultry farm as well as investment, construction, and real estate firms that have undergone name changes since the time of their original designations as SDNT entities. The OFAC has determined that the kingpins and agents of the Cali cartel continue to exert ultimate control over them. The seven newly designated individuals all have been determined to act for or on behalf of these seven successor entities. The OFAC, in coordination with the Departments of Justice and State, is continuing to expand the list of SDNTs, including both organizations and individuals, as additional information is developed.\n\nOn September 9, 1997, OFAC amended appendices A and B to 31 C.F.R. chapter V by removing the names of two individuals previously designated as specially designated narcotics traffickers. All real and personal property of these individuals, including all accounts not otherwise subject to blocking in which they have an interest, are unblocked; and all lawful transactions involving United States persons and these individuals are authorized (62 Fed. Reg. 48177, September 15, 1997). Copies of these amendments are attached to this report.\n\n5. The OFAC has disseminated and routinely updated details of this program to the financial, securities, and international trade communities by both electronic and conventional media. In addition to bulletins to banking institutions via the Federal Reserve System and the Clearing House Interbank Payments System (CHIPS), individual notices were provided to all State and Federal regulatory agencies, automated clearing houses, and State and independent banking associations across the country. The OFAC contacted all major securities industry associations and regulators. It posted electronic notices on the Internet and over 10 computer bulletin boards and two fax-on-demand services, and provided the same material to the U.S. Embassy in Bogota for distribution to U.S. companies operating in Colombia.\n\n6. As of August 15, 1997, OFAC had issued nine specific licenses pursuant to Executive Order 12978. These licenses were issued in accordance with established Treasury policy authorizing the completion of presanctions transactions and the provision of legal services to and payment of fees for representation of SDNTs in proceedings within the United States arising from the imposition of sanctions.\n\n7. The expenses incurred by the Federal Government in the 6-month period from April 21 through October 20, 1997, that are directly attributable to the exercise of powers and authorities conferred by the declaration of the national emergency with respect to Significant Narcotics Traffickers are estimated at approximately $800,000. Personnel costs were largely centered in the Department of the Treasury (particularly in the Office of Foreign Assets Control, the Office of the General Counsel, and the U.S. Customs Service), the Department of Justice, and the Department of State. These data do not reflect certain costs of operations by the intelligence and law enforcement communities.\n\n8. Executive Order 12978 provides this Administration with a tool for combatting the actions of significant foreign narcotics traffickers centered in Colombia, and the unparalleled violence, corruption, and harm that they cause in the United States and abroad. The Order is designed to deny these traffickers the benefit of any assets subject to the jurisdiction of the United States and to prevent United States persons from engaging in any commercial dealings with them, their front companies, and their agents. Executive Order 12978 demonstrates the U.S. commitment to end the scourge that such traffickers have wrought upon society in the United States and abroad.\n\nThe magnitude and the dimension of the problem in Colombia—perhaps the most pivotal country of all in terms of the world's cocaine trade—is extremely grave. I shall continue to exercise the powers at my disposal to apply economic sanctions against significant foreign narcotics traffickers and their violent and corrupting activities as long as these measures are appropriate, and will continue to report periodically to the Congress on significant developments pursuant to 50 U.S.C. 1703(c).\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{"1":"I hereby report to the Congress on the developments since my last report concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c). 1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in property subject to U.S. jurisdiction of persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order (collectively \"Specially Designated Narcotics Traffickers\" or SDNTs). The Order further prohibits any transaction or dealing by a United States person or within the United States in property or interests in property of SDNTs, and any transaction that evades or avoids, has the purpose of evading or avoiding, or attempts to violate, the prohibitions contained in the Order. Designations of foreign persons blocked pursuant to the Order are effective upon the date of determination by the Director of the Department of the Treasury's Office of Foreign Assets Control (OFAC) acting under authority delegated by the Secretary of the Treasury. Public notice of blocking is effective upon the date of filing with the Federal Register, or upon prior actual notice. 2. On October 24, 1995, the Department of the Treasury issued a Notice containing 76 additional names of persons determined to meet the criteria set forth in Executive Order 12978 (60 Fed. Reg. 54582, October 24, 1995). The Department of the Treasury issued another Notice adding the names of one additional entity and three additional individuals, as well as expanded information regarding addresses and pseudonyms, to the list of SDNTs on November 29, 1995, (60 Fed. Reg. 61288). On March 8, 1996, OFAC published a Notice in the Federal Register adding the names of 138 additional individuals and 60 entities designated pursuant to the Order, and revising information for 8 individuals on the list of blocked persons contained in the notices published on November 29, 1995, and October 24, 1995. (61 Fed. Reg. 9523). 3. On January 21, 1997, OFAC published a Notice in the Federal Register adding the names of 57 individuals and 21 entities designated pursuant to the Order, and revising information for 58 individuals and 1 entity (62 Fed. Reg. 2903). In addition, the name of one individual specially designated narcotics trafficker was removed from the list. These changes were effective January 15, 1997. These 78 new names brought the total list of SDNTs to 359. Each of the 78 newly designated entities and individuals has been determined to be owned or controlled or to act for or on behalf of the Cali cartel's Helmer \"Pacho\" Herrera Buitrago organization. The newly identified SDNTs included several large poultry processing plants and farms, investment and import/ export firms, real estate businesses, a consulting firm, a lumber distributor, and a construction company, all located in Colombia. The additional name and address information includes one previously designated company controlled by the Herrera Buitrago family and 58 previously designated individuals from either the Herrera Buitrago or the Rodriguez Orejuela organizations of the Cali cartel. Effective February 28, 1997, OFAC issued the Narcotics Trafficking Sanctions Regulations (NTSR), 31 C.F.R. Part 536, to further implement the President's declaration of a national emergency and imposition of sanctions against significant foreign narcotics traffickers centered in Colombia (62 Fed. Reg. 9959, March 5, 1997). 4. On April 17, 1997, OFAC added to appendices A and B to 31 C.F.R. chapter V the names 46 individuals and 11 entities, and revised information concerning 25 individuals, who have been determined to play a significant role in international narcotics trafficking centered in Colombia or have been determined to be owned or controlled by, or to act for or on behalf of, other specially designated narcotics traffickers (62 Fed. Reg. 19500, April 22, 1997). On July 30, 1997, OFAC published the names of seven businesses and seven associated individuals determined to be acting as fronts for the Cali cartel in Colombia (62 Fed. Reg. 41850, August 4, 1997). The seven newly designated companies are successors to firms previously designated because they were owned or controlled by the Rodriguez Orejuela, Herrera Buitrago, or Santacruz Londono families of the Cali cartel. This action is part of the ongoing interagency implementation of Executive Order 12978 of October 21, 1995. These 14 names were added to the previous SDNT list bringing to a total of 428 businesses and individuals with whom financial and business dealings are prohibited and whose assets are blocked under the Order. All 428 SDNTs were determined to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order. The seven newly named companies include a major poultry farm as well as investment, construction, and real estate firms that have undergone name changes since the time of their original designations as SDNT entities. The OFAC has determined that the kingpins and agents of the Cali cartel continue to exert ultimate control over them. The seven newly designated individuals all have been determined to act for or on behalf of these seven successor entities. The OFAC, in coordination with the Departments of Justice and State, is continuing to expand the list of SDNTs, including both organizations and individuals, as additional information is developed. On September 9, 1997, OFAC amended appendices A and B to 31 C.F.R. chapter V by removing the names of two individuals previously designated as specially designated narcotics traffickers. All real and personal property of these individuals, including all accounts not otherwise subject to blocking in which they have an interest, are unblocked; and all lawful transactions involving United States persons and these individuals are authorized (62 Fed. Reg. 48177, September 15, 1997). Copies of these amendments are attached to this report. 5. The OFAC has disseminated and routinely updated details of this program to the financial, securities, and international trade communities by both electronic and conventional media. In addition to bulletins to banking institutions via the Federal Reserve System and the Clearing House Interbank Payments System (CHIPS), individual notices were provided to all State and Federal regulatory agencies, automated clearing houses, and State and independent banking associations across the country. The OFAC contacted all major securities industry associations and regulators. It posted electronic notices on the Internet and over 10 computer bulletin boards and two fax-on-demand services, and provided the same material to the U.S. Embassy in Bogota for distribution to U.S. companies operating in Colombia. 6. As of August 15, 1997, OFAC had issued nine specific licenses pursuant to Executive Order 12978. These licenses were issued in accordance with established Treasury policy authorizing the completion of presanctions transactions and the provision of legal services to and payment of fees for representation of SDNTs in proceedings within the United States arising from the imposition of sanctions. 7. The expenses incurred by the Federal Government in the 6-month period from April 21 through October 20, 1997, that are directly attributable to the exercise of powers and authorities conferred by the declaration of the national emergency with respect to Significant Narcotics Traffickers are estimated at approximately $800,000. Personnel costs were largely centered in the Department of the Treasury (particularly in the Office of Foreign Assets Control, the Office of the General Counsel, and the U.S. Customs Service), the Department of Justice, and the Department of State. These data do not reflect certain costs of operations by the intelligence and law enforcement communities. 8. Executive Order 12978 provides this Administration with a tool for combatting the actions of significant foreign narcotics traffickers centered in Colombia, and the unparalleled violence, corruption, and harm that they cause in the United States and abroad. The Order is designed to deny these traffickers the benefit of any assets subject to the jurisdiction of the United States and to prevent United States persons from engaging in any commercial dealings with them, their front companies, and their agents. Executive Order 12978 demonstrates the U.S. commitment to end the scourge that such traffickers have wrought upon society in the United States and abroad. The magnitude and the dimension of the problem in Colombia—perhaps the most pivotal country of all in terms of the world's cocaine trade—is extremely grave. I shall continue to exercise the powers at my disposal to apply economic sanctions against significant foreign narcotics traffickers and their violent and corrupting activities as long as these measures are appropriate, and will continue to report periodically to the Congress on significant developments pursuant to 50 U.S.C. 1703(c)."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L2":{"metadata":{"president":"Barack Obama","date":"June 21, 2013","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nSection 202(d) of the National Emergencies Act (50 U.S.C. 1622(d)) provides for the automatic termination of a national emergency unless, within 90 days prior to the anniversary date of its declaration, the President publishes in the Federal Register and transmits to the Congress a notice stating that the emergency is to continue in effect beyond the anniversary date. In accordance with this provision, I have sent to the Federal Register for publication the enclosed notice stating that the national emergency declared in Executive Order 13466 of June 26, 2008, expanded in scope in Executive Order 13551 of August 30, 2010, and addressed further in Executive Order 13570 of April 18, 2011, is to continue in effect beyond June 26, 2013.\n\nThe existence and risk of proliferation of weapons-usable fissile material on the Korean Peninsula, and the actions and policies of the Government of North Korea that destabilize the Korean Peninsula and imperil U.S. Armed Forces, allies, and trading partners in the region continue to constitute an unusual and extraordinary threat to the national security, foreign policy, and economy of the United States. For these reasons, I have determined that it is necessary to continue the national emergency with respect to these threats and maintain in force the measures taken to deal with that national emergency.\n\nSincerely,\n\nBARACK OBAMA","chunks":{"1":"For these reasons, I have determined that it is necessary to continue the national emergency with respect to these threats and maintain in force the measures taken to deal with that national emergency."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":null}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L3":{"metadata":{"president":"George W. Bush","date":"February 18, 2008","type":"letter"},"text":"His Excellency Fatmir Sejdiu President of Kosovo Pristina\n\nDear Mr. President:\n\nOn behalf of the American people, I hereby recognize Kosovo as an independent and sovereign state. I congratulate you and Kosovo's citizens for having taken this important step in your democratic and national development.\n\nOn this historic occasion, I note the deep and sincere bonds of friendship that unite our people. This friendship, cemented during Kosovo's darkest hours of tragedy, has grown stronger in the 9 years since war in Kosovo ended. Kosovo has since worked to rebuild its war-shattered society, establish democratic institutions, hold successful elections for a new government, and foster prosperity. As an independent state, Kosovo now assumes responsibility for its destiny. As in the past, the United States will be your partner and your friend.\n\nIn your request to establish diplomatic relations with the United States, you expressed Kosovo's desire to attain the highest standards of democracy and freedom. I fully welcome this sentiment. In particular, I support your embrace of multi-ethnicity as a principle of good governance and your commitment to developing accountable institutions in which all citizens are equal under the law.\n\nI also note that, in its declaration of independence, Kosovo has willingly assumed the responsibilities assigned to it under the Ahtisaari Plan. The United States welcomes this unconditional commitment to carry out these responsibilities and Kosovo's willingness to cooperate fully with the international community during the period of international supervision to which you have agreed. The United States relies upon Kosovo's assurances that it considers itself legally bound to comply with the provisions in Kosovo's Declaration of Independence. I am convinced that full and prompt adoption of the measures proposed by U.N. Special Envoy Ahtisaari will bring Kosovo closer to fulfilling its Euro-Atlantic aspirations.\n\nOn the basis of these assurances from the Government of Kosovo, I am pleased to accept your request that our two countries establish diplomatic relations. The United States would welcome the establishment by Kosovo of diplomatic representation in the United States and plans to do likewise in Kosovo.\n\nAs Kosovo opens a new chapter in its history as an independent state, I look forward to the deepening and strengthening of our special friendship.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{"1":"On behalf of the American people, I hereby recognize Kosovo as an independent and sovereign state. I congratulate you and Kosovo's citizens for having taken this important step in your democratic and national development. On this historic occasion, I note the deep and sincere bonds of friendship that unite our people. This friendship, cemented during Kosovo's darkest hours of tragedy, has grown stronger in the 9 years since war in Kosovo ended. Kosovo has since worked to rebuild its war-shattered society, establish democratic institutions, hold successful elections for a new government, and foster prosperity. As an independent state, Kosovo now assumes responsibility for its destiny. As in the past, the United States will be your partner and your friend. In your request to establish diplomatic relations with the United States, you expressed Kosovo's desire to attain the highest standards of democracy and freedom. I fully welcome this sentiment. In particular, I support your embrace of multi-ethnicity as a principle of good governance and your commitment to developing accountable institutions in which all citizens are equal under the law. I also note that, in its declaration of independence, Kosovo has willingly assumed the responsibilities assigned to it under the Ahtisaari Plan. The United States welcomes this unconditional commitment to carry out these responsibilities and Kosovo's willingness to cooperate fully with the international community during the period of international supervision to which you have agreed. The United States relies upon Kosovo's assurances that it considers itself legally bound to comply with the provisions in Kosovo's Declaration of Independence. I am convinced that full and prompt adoption of the measures proposed by U.N. Special Envoy Ahtisaari will bring Kosovo closer to fulfilling its Euro-Atlantic aspirations. On the basis of these assurances from the Government of Kosovo, I am pleased to accept your request that our two countries establish diplomatic relations. The United States would welcome the establishment by Kosovo of diplomatic representation in the United States and plans to do likewise in Kosovo. As Kosovo opens a new chapter in its history as an independent state, I look forward to the deepening and strengthening of our special friendship."},"annotations":[{"directive":{"code":"0","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"yes","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"yes","military_ops":"no"}},"wp_comment":null}]},"L6":{"metadata":{"president":"Barack Obama","date":"July 20, 2009","type":"letter"},"text":"Dear ________:\n\nI am pleased to transmit to you a report required by section 104(g)of the Henry J. Hyde United States-India Peaceful Atomic Energy Cooperation Act of 2006 (Public Law 109-401), as amended by section 105 of the United States-India Nuclear Cooperation Approval and Nonproliferation Enhancement Act of 2008 (Public Law 110-369).\n\nThe report covers the period of October 4, 2008, to June 30, 2009. It provides an update on U.S.-India civil nuclear cooperation and developments that relate to India's nuclear-related activities. Classified information associated with these issues has been provided in a separate classified annex.\n\nSincerely,\n\nBARACK OBAMA","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L8":{"metadata":{"president":"George W. Bush","date":"February 26, 2004","type":"letter"},"text":"Dear __________:\n\nConsistent with Condition 3(2)(A) of the Senate resolution of advice and consent to ratification to the Protocols to the North Atlantic Treaty of 1949 on the Accession of Bulgaria, Estonia, Latvia, Lithuania, Romania, Slovakia, and Slovenia, passed on May 8, 2003, I am providing a report prepared by my Administration.\n\nThis report describes the progress of the seven NATO invitees in satisfying the security sector and security vetting requirements for membership in NATO. As the report makes clear, all seven satisfy these NATO requirements.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"yes","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L11":{"metadata":{"president":"George W. Bush","date":"February 25, 2002","type":"letter"},"text":"Dear Mr. Speaker:\n\nIn furtherance of the provisions of Public Law 107-38, the Emergency Supplemental Appropriations Act for Recovery from and Response to Terrorist Attacks on the United States, FY 2001, today I am notifying the Congress of my intent to reallocate funds previously transferred from the Emergency Response Fund to the Department of Defense. This reallocation reflects revised requirements in light of changing security needs in the wake of the terrorist attacks of September 11, 2001.\n\nAs provided in Public Law 107-38, $33 million will be made available 15 days from the date of this transmittal for continued deployment of the National Guard at our Nation's airports through the end of March.\n\nThe details of this action are set forth in the enclosed letter from the Director of the Office of Management and Budget. I concur with his comments and observations.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"yes"},"chunks":{},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L20":{"metadata":{"president":"George W. Bush","date":"July 02, 2001","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nI hereby transmit the report referred to in subsection 402(c)(2) of the Trade Act of 1974, with respect to a waiver of the application of subsections 402(a) and (b) of that Act to the Republic of Belarus.\n\nI have determined that such a waiver will substantially promote the objectives of section 402, and I have instructed the Secretary of State to provide a copy of that determination to the Speaker of the House of Representatives and President of the Senate. The report also indicates that I have received the assurances with respect to the emigration practices of the Republic of Belarus required by section 402(c)(2)(B) of the Act.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{"1":"I hereby transmit the report referred to in subsection 402(c)(2) of the Trade Act of 1974, with respect to a waiver of the application of subsections 402(a) and (b) of that Act to the Republic of Belarus.","2":"I have determined that such a waiver will substantially promote the objectives of section 402, and I have instructed the Secretary of State to provide a copy of that determination to the Speaker of the House of Representatives and President of the Senate. The report also indicates that I have received the assurances with respect to the emigration practices of the Republic of Belarus required by section 402(c)(2)(B) of the Act."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L22":{"metadata":{"president":"Donald J. Trump","date":"October 14, 2019","type":"letter"},"text":"Dear Madam Speaker: (Dear Mr. President:)\n\nPursuant to the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), I hereby report that I have issued an Executive Order (the \"order\") declaring a national emergency due to the situation in and in relation to Syria, and in particular the recent actions by the Government of Turkey to conduct a military offensive into northeast Syria. I have taken this action because recent actions by the Government of Turkey undermine the campaign to defeat the Islamic State of Iraq and Syria, or ISIS, endangers civilians, and further threatens to undermine the peace, security, and stability in the region, and thereby constitute an unusual and extraordinary threat to the national security and foreign policy of the United States. I have also announced that steel tariffs will be increased back up to 50 percent, the level prior to reduction in May.\n\nTo deal with this threat, the order, consistent with law, blocks all property and interests in property, within the jurisdiction of the United States, of certain persons determined to be responsible for or complicit in actions or policies that contribute to this threat.\n\nThe order also authorizes the Secretary of State, in consultation with the Secretary of the Treasury and other officials of the United States government as appropriate, to impose sanctions upon persons determined to be responsible for or complicit in, have directly or indirectly engaged in, or attempted to engage in, or financed, various actions that contribute to this unusual and extraordinary threat. These actions include the obstruction, disruption, or prevention of a ceasefire in northern Syria and of efforts to promote a political solution to the conflict in Syria. Sanctions may affect various financial transactions, including government procurement contracts, foreign exchange transactions, investments, and importation of goods, technology, or services, as well as impose the denial of a visa and exclusion from the United States of the sanctioned person.\n\nTo deal with this threat, and because the unrestricted immigrant and nonimmigrant entry into the United States of aliens subject to sanctions would be detrimental to the interests of the United States, the order also suspends the entry of such persons into the United States.\n\nThe order authorizes the Secretary of the Treasury, in consultation with the Secretary of State, to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by IEEPA as may be necessary to carry out the purposes of this order.\n\nI am enclosing a copy of the order, as well as the press statement I issued earlier today.\n\nSincerely,\n\nDONALD J. TRUMP","chunks":{"1":"Pursuant to the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), I hereby report that I have issued an Executive Order (the \"order\") declaring a national emergency due to the situation in and in relation to Syria, and in particular the recent actions by the Government of Turkey to conduct a military offensive into northeast Syria. I have taken this action because recent actions by the Government of Turkey undermine the campaign to defeat the Islamic State of Iraq and Syria, or ISIS, endangers civilians, and further threatens to undermine the peace, security, and stability in the region, and thereby constitute an unusual and extraordinary threat to the national security and foreign policy of the United States. I have also announced that steel tariffs will be increased back up to 50 percent, the level prior to reduction in May. To deal with this threat, the order, consistent with law, blocks all property and interests in property, within the jurisdiction of the United States, of certain persons determined to be responsible for or complicit in actions or policies that contribute to this threat. The order also authorizes the Secretary of State, in consultation with the Secretary of the Treasury and other officials of the United States government as appropriate, to impose sanctions upon persons determined to be responsible for or complicit in, have directly or indirectly engaged in, or attempted to engage in, or financed, various actions that contribute to this unusual and extraordinary threat. These actions include the obstruction, disruption, or prevention of a ceasefire in northern Syria and of efforts to promote a political solution to the conflict in Syria. Sanctions may affect various financial transactions, including government procurement contracts, foreign exchange transactions, investments, and importation of goods, technology, or services, as well as impose the denial of a visa and exclusion from the United States of the sanctioned person. To deal with this threat, and because the unrestricted immigrant and nonimmigrant entry into the United States of aliens subject to sanctions would be detrimental to the interests of the United States, the order also suspends the entry of such persons into the United States. The order authorizes the Secretary of the Treasury, in consultation with the Secretary of State, to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by IEEPA as may be necessary to carry out the purposes of this order. I am enclosing a copy of the order, as well as the press statement I issued earlier today."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L24":{"metadata":{"president":"Dwight D. Eisenhower","date":"October 07, 1959","type":"letter"},"text":"Dear Mr. Attorney General:\n\nOn October 6, 1959, by virtue of the authority vested in me by Section 206 of the Labor Management Relations Act, 1947 (Public Law 101, 80th Congress), I issued Executive Order No. 10842, creating a Board of Inquiry to inquire into the issues involved in labor disputes between employers (or associations by which such employers are represented in collective bargaining conferences) who are (1) steamship companies or who are engaged as operators or agents for ships engaged in service from or to Atlantic and Gulf Coast ports from Searsport, Maine, to Brownsville, Texas, or from or to other ports of the United States or its territories or possessions, (2) contracting stevedores, (3) contracting marine carpenters, or (4) other employers engaged in related or associated pier activities, and certain of their employees represented by the International Longshoremen's Association, Atlantic Coast District, ILA and Atlantic and Gulf District, ILA.\n\nOn October 7, 1959, I received the Board's written report in the matter. I understand you have a copy of that report.\n\nIn my opinion these unresolved labor disputes have resulted in a strike affecting a substantial part of an industry engaged in trade, commerce, transportation, transmission or communication among the several States and with foreign nations, which strike, if permitted to continue, will imperil the national health and safety and will affect the flow and utilization of necessary perishable products, including food for heavily populated coastal areas.\n\nTherefore, in order to remove a peril to the national health and safety and to secure a resumption of trade, commerce, transportation, transmission or communication among the several States and with foreign nations, I direct you, pursuant to the provisions of Section 208 of the Labor Management Relations Act, 1947, to petition in the name of the United States any District Court of the United States having jurisdiction of the parties to enjoin the continuance of such strike and for such other relief as may in your judgment be necessary or appropriate.\n\nVery sincerely yours,\n\nDWIGHT D. EISENHOWER","chunks":{"1":"Therefore, in order to remove a peril to the national health and safety and to secure a resumption of trade, commerce, transportation, transmission or communication among the several States and with foreign nations, I direct you, pursuant to the provisions of Section 208 of the Labor Management Relations Act, 1947,","2":"to petition in the name of the United States any District Court of the United States having jurisdiction of the parties to enjoin the continuance of such strike and for such other relief as may in your judgment be necessary or appropriate. Very sincerely yours,"},"annotations":[{"directive":{"code":"2","diplomacy":null,"military_ops":"no"},"chunks":{"1":{"code":"2","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"2","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L26":{"metadata":{"president":"William J. Clinton","date":"December 22, 1999","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nIn accordance with the resolution of advice and consent to ratification of the Convention on the Prohibition of the Development, Production, Stockpiling and Use of Chemical Weapons and on Their Destruction, adopted by the Senate of the United States on April 24, 1997, I hereby certify in connection with Condition (7)(C)(i), Effectiveness of Australia Group, that:\n\nAustralia Group members continue to maintain an equally effective or more comprehensive control over the export of toxic chemicals and their precursors, dual-use processing equipment, human, animal, and plant pathogens and toxins with potential biological weapons application, and dual-use biological equipment, as that afforded by the Australia Group as of April 25, 1997; and,\n\nThe Australia Group remains a viable mechanism for limiting the spread of chemical and biological weapons-related materials and technology, and the effectiveness of the Australia Group has not been undermined by changes in membership, lack of compliance with common export controls and nonproliferation measures, or the weakening of common controls and nonproliferation measures, in force as of April 25, 1997.\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{"1":"In accordance with the resolution of advice and consent to ratification of the Convention on the Prohibition of the Development, Production, Stockpiling and Use of Chemical Weapons and on Their Destruction, adopted by the Senate of the United States on April 24, 1997, I hereby certify in connection with Condition (7)(C)(i), Effectiveness of Australia Group, that: Australia Group members continue to maintain an equally effective or more comprehensive control over the export of toxic chemicals and their precursors, dual-use processing equipment, human, animal, and plant pathogens and toxins with potential biological weapons application, and dual-use biological equipment, as that afforded by the Australia Group as of April 25, 1997; and, The Australia Group remains a viable mechanism for limiting the spread of chemical and biological weapons-related materials and technology, and the effectiveness of the Australia Group has not been undermined by changes in membership, lack of compliance with common export controls and nonproliferation measures, or the weakening of common controls and nonproliferation measures, in force as of April 25, 1997."},"annotations":[{"directive":{"code":"3","diplomacy":null,"military_ops":"yes"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L27":{"metadata":{"president":"Dwight D. Eisenhower","date":"April 24, 1953","type":"letter"},"text":"[Released April 24, 1953. Dated April 23, 1953]\n\n- Dear Senator Wiley:\n\nAt my request, the National Security Council has considered the national security interests in the Saint Lawrence-Great Lakes Seaway Project. The Council has advised me:\n\n1. Early initiation and completion of the Saint Lawrence-Great Lakes Seaway is in the interest of national security.\n\n2. The United States should promptly take whatever action may be appropriate to clear the way for commencement of the project, whether by Canada alone, or, now or as may be later developed, by Canada and the United States jointly.\n\n3. It is desirable that the United States participate in the construction of the Seaway; the extent of and limitations upon such participation to be the subject of separate determination by authority other than the Council.\n\nThe Council's findings and recommendations have my approval; and I propose now to discuss with the Cabinet the extent of and limitations upon United States participation in the project.\n\nI am forwarding a copy of this letter to the Chairman of the Federal Power Commission for his information and such action as he may deem appropriate.\n\nSincerely,\n\nDWIGHT D. EISENHOWER\n\nThe Honorable Alexander Wiley\n\nChairman, Committee on Foreign Relations\n\nUnited States Senate\n\nWashington, D.C.","chunks":{},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"P1":{"metadata":{"president":"Dwight D. Eisenhower","date":"January 13, 1958","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nWhereas the Federal civil-service system was established by the Civil Service Act of January 16, 1883, and will be seventy-five years old on January 16, 1958; and\n\nWhereas the enactment of that act and the establishment thereunder of a merit system of employment within the Federal Government have given impetus to the establishment of similar systems at State, county, and municipal levels of government; and\n\nWhereas a strong civil service, based on the merit principle, is now recognized as an essential factor in stable, responsible government in the United States, as well as in many other countries; and\n\nWhereas the seventy-fifth anniversary of the Civil Service Act is an appropriate time to salute the Civil Service of the United States and to increase public knowledge and understanding of its importance in our system of self-government;\n\nNow, Therefore, I, Dwight D. Eisenhower, President of the United States of America, do hereby call upon the people of the United States to participate in the observance of the seventy-fifth anniversary of the Civil Service Act on January 16, 1958, and throughout the ensuing year.\n\nI also call upon the heads of Federal departments and agencies, governors, mayors, and other public officials, as well as leaders of industry and labor and members of all public-spirited groups, to study our Federal, State, and local civil-service systems, with a view to their continuous improvement in every way possible, and to arrange appropriate ceremonies in honor of the public service of our able and devoted civil servants throughout the country.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDONE at the City of Washington this thirteenth day of January in the year of our Lord nineteen hundred and fifty-eight, and of the Independence of the United States of America the one hundred and eighty-second.\n\nDWIGHT D. EISENHOWER\n\nBy the President:\n\nJOHN FOSTER DULLES,\n\nSecretary of State","chunks":{"1":"Now, Therefore, I, Dwight D. Eisenhower, President of the United States of America, do hereby call upon the people of the United States to participate in the observance of the seventy-fifth anniversary of the Civil Service Act on January 16, 1958, and throughout the ensuing year.","2":"I also call upon the heads of Federal departments and agencies, governors, mayors, and other public officials, as well as leaders of industry and labor and members of all public-spirited groups, to study our Federal, State, and local civil-service systems, with a view to their continuous improvement in every way possible, and to arrange appropriate ceremonies in honor of the public service of our able and devoted civil servants throughout the country."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P10":{"metadata":{"president":"Harry S Truman","date":"September 22, 1949","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nWhereas men of good will everywhere are seeking the way to a new world, in which lasting peace will prevail and all nations will work and live together in friendly accord; and\n\nWhereas all who have this hope may draw inspiration and courage from the superb resolution and infinite faith of Christopher Columbus, who found a new world beyond uncharted seas; and\n\nWhereas, in appreciation of the achievement of Columbus in discovering this new world of opportunity, the Congress of the United States, by a joint resolution approved April 30, 1934 (48 Stat. 657), authorized and requested the President to issue a proclamation designating October 12 of each year as Columbus Day:\n\nNow, Therefore, I, Harry S. Truman, President of the United States of America, do hereby designate Wednesday, October 12, 1949, as Columbus Day; and I invite the people of the United States to observe the day with ceremonies commemorative of the anniversary of the sighting of land by Columbus and his crew on their westward voyage in 1492. I also direct the appropriate officials of the Government to arrange for the display of the flag of the United States on all Government buildings on that day.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDone at the City of Washington this the 22d day of September in the year of our Lord nineteen hundred and forty-nine, and of the Independence of the United States of America the one hundred and seventy-fourth.\n\nHARRY S. TRUMAN\n\nBy the President:\n\nJAMES E. WEBB,\n\nActing Secretary of State.","chunks":{"1":"Now, Therefore, I, Harry S. Truman, President of the United States of America, do hereby designate Wednesday, October 12, 1949, as Columbus Day; and I invite the people of the United States to observe the day with ceremonies commemorative of the anniversary of the sighting of land by Columbus and his crew on their westward voyage in 1492.","2":"I also direct the appropriate officials of the Government to arrange for the display of the flag of the United States on all Government buildings on that day."},"annotations":[{"directive":{"code":"0","diplomacy":null,"military_ops":null},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P18":{"metadata":{"president":"Jimmy Carter","date":"December 06, 1978","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nIn May 1982, a six-month International Energy Exposition will open in Knoxville, Tennessee, inviting the nations of the world to think anew of man's relationship with the pervasive force of energy which fundamentally shapes the choices people have as to the endurance and enjoyment of life itself. This exposition, whose theme is \"Energy Turns the World,\" will provide a splendid setting in which to explore new technologies to conserve energy, to harness the long-lasting and most renewable sources, and to carry on the search for new sources of energy.\n\nBecause of the opportunities which the Exposition offers for a deeper understanding of energy issues and for the stimulation of trade and cultural exchange, this Administration is moving to extend the fullest possible recognition to this event in accordance with Public Law 91 -269. On April 26, 1977, I advised the Secretaries of State and Commerce that the Exposition warrants Federal recognition as provided by statute. On April 27, 1977, upon request of the United States, the Bureau of International Expositions officially registered the event as a Special Category exposition by unanimous vote.\n\nAlso, in accordance with law, I shall appoint a United States Commissioner General to exercise the responsibility of the United States Government for fulfillment of the Convention of November 22, 1928, Relating' to International Expositions, as modified, and to invite the several States of the Union to participate.\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, in further recognition of this International Energy Exposition, do hereby authorize and direct the Secretary of State to invite, on my behalf, such foreign countries as he may consider appropriate to participate in this event.\n\nIn Witness Whereof, I have hereunto set my hand this sixth day of December, in the year of our Lord nineteen hundred and seventy-eight, and of the Independence of the United States of America the two hundred and third.\n\nJIMMY CARTER","chunks":{"1":"Now, Therefore, I, Jimmy Carter, President of the United States of America, in further recognition of this International Energy Exposition, do hereby authorize and direct the Secretary of State to invite, on my behalf, such foreign countries as he may consider appropriate to participate in this event."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P20":{"metadata":{"president":"George W. Bush","date":"August 06, 2007","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nOn Women's Equality Day, we commemorate the adoption of the 19th Amendment to our Constitution and the strong leadership of extraordinary women who have made America a more perfect Union by advancing women's suffrage.\n\nAt the Seneca Falls Convention of 1848, a group of visionaries gathered to proclaim the ideas that \"all men and women are created equal\" and \"endowed by their Creator with certain inalienable rights.\" That gathering grew into a national movement that led to the ratification of the 19th Amendment, guaranteeing women the right to vote. This achievement reflects the vision and determination of the suffragists who stood for a freer society and changed our Nation's history.\n\nSince the passage of the 19th Amendment, pioneers such as Margaret Chase Smith and Sandra Day O'Connor rose above obstacles and broke down barriers to equality. Today, American women are shaping our Nation and the world by serving in all walks of life. Many brave women volunteer to wear the uniform of the United States, and they serve as an inspiration to all.\n\nOur Nation is grateful for the bold leadership of American women who have opened doors of opportunity for women of future generations. On Women's Equality Day we honor the suffragists and all those who seek to expand equality in our world.\n\nNow, Therefore, I, George W. Bush, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim August 26, 2007, as Women's Equality Day. I call upon the people of the United States to celebrate the achievements of women and observe this day with appropriate programs and activities.\n\nIn Witness Whereof, I have hereunto set my hand this sixth day of August, in the year of our Lord two thousand seven, and of the Independence of the United States of America the two hundred and thirty-second.\n\nGEORGE W. BUSH","chunks":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim August 26, 2007, as Women's Equality Day.","2":"I call upon the people of the United States to celebrate the achievements of women and observe this day with appropriate programs and activities."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P21":{"metadata":{"president":"Gerald R. Ford","date":"March 25, 1975","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nFor nearly two hundred years, in times of war and peace, the Armed Forces of the United States have served the Nation with courage and devotion. In this country, and throughout the world, those who wear the uniforms of the Army, Navy, Air Force, Marine Corps and Coast Guard are respected for their patriotic service.\n\nIt is fitting and proper that we set aside one day each year to pay tribute to these men and women.\n\nNow, Therefore, I, Gerald R. Ford, President of the United States of America and Commander in Chief of the Armed Forces of the United States, continuing the precedent of my five immediate predecessors in this Office, do hereby proclaim the third Saturday of each May as Armed Forces Day.\n\nI direct the Secretary of Defense on behalf of the Army, the Navy, the Air Force, and the Marine Corps, and the Secretary of Transportation on behalf of the Coast Guard, to plan for appropriate observances each year, with the Secretary of Defense responsible for soliciting the participation and cooperation of civil authorities and private citizens.\n\nI invite the Governors of the States, the Commonwealth of Puerto Rico, and other areas subject to the jurisdiction of the United States, to provide for the observance of Armed Forces Day within their jurisdiction each year in an appropriate manner designed to enhance public understanding and appreciation of the Armed Forces of the United States.\n\nI also invite national and local veterans, civic and other organizations to provide for the observance of Armed Forces Day each year.\n\nI call upon my fellow Americans not only to display proudly the flag of the United States at their homes on Armed Forces Day, but also to avail themselves of the opportunity to further their knowledge of our Defense Establishment and of the men and women who constitute our real national strength, by attending and participating in the local observances of the day.\n\nProclamation No. 4276 of March 21, 1974, is hereby superseded.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-fifth day of March in the year of our Lord nineteen hundred seventy-five, and of the Independence of the United States of America the one hundred ninety-ninth.\n\nGERALD R. FORD","chunks":{"1":"Now, Therefore, I, Gerald R. Ford, President of the United States of America and Commander in Chief of the Armed Forces of the United States, continuing the precedent of my five immediate predecessors in this Office, do hereby proclaim the third Saturday of each May as Armed Forces Day.","2":"I direct the Secretary of Defense on behalf of the Army, the Navy, the Air Force, and the Marine Corps, and the Secretary of Transportation on behalf of the Coast Guard, to plan for appropriate observances each year, with the Secretary of Defense responsible for soliciting the participation and cooperation of civil authorities and private citizens. I invite the Governors of the States, the Commonwealth of Puerto Rico, and other areas subject to the jurisdiction of the United States, to provide for the observance of Armed Forces Day within their jurisdiction each year in an appropriate manner designed to enhance public understanding and appreciation of the Armed Forces of the United States. I also invite national and local veterans, civic and other organizations to provide for the observance of Armed Forces Day each year.","3":"I call upon my fellow Americans not only to display proudly the flag of the United States at their homes on Armed Forces Day, but also to avail themselves of the opportunity to further their knowledge of our Defense Establishment and of the men and women who constitute our real national strength, by attending and participating in the local observances of the day.","4":"Proclamation No. 4276 of March 21, 1974, is hereby superseded."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P26":{"metadata":{"president":"George W. Bush","date":"May 16, 2002","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nSection 506A(a)(1) of the Trade Act of 1974, as amended (the \"1974 Act\") (19 U.S.C. 2466a(a)(1)), as added by section 111(a) of the African Growth and Opportunity Act (title I of Public Law 106-200) (AGOA), authorizes the President to designate a country listed in section 107 of the AGOA (19 U.S.C. 3706) as a \"beneficiary sub-Saharan African country.\"\n\nSection 112(b)(3)(B) of the AGOA (19 U.S.C. 3721(b)(3)(B)) provides special rules for certain apparel articles imported from \"lesser developed beneficiary sub-Saharan African countries.\"\n\nProclamation 7350 of October 2, 2000, and Proclamation 7400 of January 17, 2001, designated certain countries listed in section 107 of the AGOA as beneficiary sub-Saharan African countries and identified which designated beneficiary sub-Saharan African countries would be considered lesser developed beneficiary sub-Saharan African countries under section 112(b)(3)(B) of the AGOA.\n\nPursuant to section 506A(a)(1) of the 1974 Act, and having due regard for the eligibility criteria set forth therein, I have determined that it is appropriate to designate the Republic of Cote d'Ivoire (Cote d'Ivoire) as a beneficiary sub-Saharan African country.\n\nCote d'Ivoire satisfies the criteria for treatment as a \"lesser developed beneficiary sub-Saharan country\" under section 112(b)(3)(B) of the AGOA.\n\nSection 604 of the 1974 Act (19 U.S.C. 2483) authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTS) the substance of the relevant provisions of that Act, and of other acts affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.\n\nNOW, THEREFORE, I, GEORGE W. BUSH, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States, including sections 506A and 604 of the 1974 Act, and section 111 of the AGOA, do proclaim that:\n\n(1) Cote d'Ivoire is designated as a beneficiary sub-Saharan African country.\n\n(2) In order to reflect this designation in the HTS, general note 16(a) to the HTS is modified by inserting in alphabetical sequence in the list of beneficiary sub-Saharan African countries \"Republic of Cote d'Ivoire.\"\n\n(3) For purposes of section 112(b)(3)(B) of the AGOA, Cote d'Ivoire shall be considered a lesser developed beneficiary sub-Saharan African country.\n\n(4) Any provisions of previous proclamations and Executive Orders that are inconsistent with this proclamation are superseded to the extent of such inconsistency.\n\n(5) The modifications of the HTS made by this proclamation shall be effective with respect to articles entered, or withdrawn from warehouse for consumption, on or after the date of publication of this proclamation in the Federal Register.\n\nIN WITNESS WHEREOF, I have hereunto set my hand this sixteenth day of May, in the year of our Lord two thousand two, and of the Independence of the United States of America the two hundred and twenty-sixth.\n\nGEORGE W. BUSH","chunks":{"1":"Pursuant to section 506A(a)(1) of the 1974 Act, and having due regard for the eligibility criteria set forth therein, I have determined that it is appropriate to designate the Republic of Cote d'Ivoire (Cote d'Ivoire) as a beneficiary sub-Saharan African country. Cote d'Ivoire satisfies the criteria for treatment as a \"lesser developed beneficiary sub-Saharan country\" under section 112(b)(3)(B) of the AGOA. Section 604 of the 1974 Act (19 U.S.C. 2483) authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTS) the substance of the relevant provisions of that Act, and of other acts affecting import treatment, and actions thereunder, including the removal, modification, continuance, or imposition of any rate of duty or other import restriction.","2":"NOW, THEREFORE, I, GEORGE W. BUSH, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States, including sections 506A and 604 of the 1974 Act, and section 111 of the AGOA, do proclaim that: (1) Cote d'Ivoire is designated as a beneficiary sub-Saharan African country. (2) In order to reflect this designation in the HTS, general note 16(a) to the HTS is modified by inserting in alphabetical sequence in the list of beneficiary sub-Saharan African countries \"Republic of Cote d'Ivoire.\" (3) For purposes of section 112(b)(3)(B) of the AGOA, Cote d'Ivoire shall be considered a lesser developed beneficiary sub-Saharan African country. (4) Any provisions of previous proclamations and Executive Orders that are inconsistent with this proclamation are superseded to the extent of such inconsistency. (5) The modifications of the HTS made by this proclamation shall be effective with respect to articles entered, or withdrawn from warehouse for consumption, on or after the date of publication of this proclamation in the Federal Register."},"annotations":[{"directive":{"code":"3","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"yes","military_ops":"no"},"2":{"code":"3","diplomacy":"yes","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P30":{"metadata":{"president":"Gerald R. Ford","date":"April 24, 1975","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nAGREEMENT ON TRADE RELATIONS BETWEEN THE UNITED STATES OF AMERICA AND THE SOCIALIST REPUBLIC OF ROMANIA\n\nPursuant to the authority vested in me by the United States Constitution, I, as President of the United States of America, acting through duly empowered representatives, entered into negotiation with duly empowered representatives of the Socialist Republic of Romania looking toward the conclusion of an agreement governing trade relations between the United States of America and the Socialist Republic of Romania;\n\nThe aforesaid negotiations were conducted in accordance with the requirements of the Trade Act of 1974 (P.L. 93-618, January 3, 1975; 88 Stat. 1978);\n\nAn \"Agreement on Trade Relations between the United States of America and the Socialist Republic of Romania,\" including the annexes thereto, in the English and Romanian languages, was signed on April 2, 1975, by duly empowered representatives of the Governments of the United States of America and the Socialist Republic of Romania, respectively, and is hereto annexed;\n\nThe said Agreement is in conformity with the requirements relating to bilateral commercial agreements as specified in section 405(b) of the Trade Act of 1974 (88 Stat. 1978, 2061);\n\nIt is provided in Article XII of the said Agreement that it shall enter into force on the date of exchange of written notices of acceptance by the Governments of the United States of America and the Socialist Republic of Romania; and\n\nIt is provided in section 405(c) of the Trade Act of 1974 (88 Stat. 1978, 2061) that a bilateral commercial agreement providing nondiscriminatory treatment to the products of countries heretofore denied such treatment, and a proclamation implementing such agreement, shall take effect only if approved by the Congress by the adoption of a concurrent resolution of approval, referred to in section 151 of the Trade Act of 1974 (88 Stat. 1978, 2001), of the extension of nondiscriminatory treatment to the products of the country concerned;\n\nNow, Therefore, I, Gerald R. Ford, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes, including section 404(a) of the Trade Act of 1974, do hereby proclaim as follows:\n\n(1) This Proclamation shall become effective and said agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Socialist Republic of Romania in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XII of the said Agreement, all of the foregoing to follow the adoption by the House of Representatives and the Senate, in accordance with the procedures set forth in section 151 of the said Act, of a concurrent resolution of approval of the extension of nondiscriminatory treatment to the products of the Socialist Republic of Romania, to the end that the same and every part of the said Agreement may be observed and fulfilled with good faith by the United States of America and the citizens thereof and all other persons subject to the jurisdiction thereof as of the date of its entry into force; and\n\n(2) General Headnote 3(e) of the Tariff Schedules of the United States is amended by deleting therefrom \"Rumania\" as of the effective date of this proclamation and a notice thereof shall be published in the Federal Register promptly thereafter.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-fourth day of April, in the year of our Lord one thousand nine hundred seventy-five, and of the Independence of the United States of America the one hundred ninety-ninth.\n\nGERALD R. FORD","chunks":{"1":"It is provided in section 405(c) of the Trade Act of 1974 (88 Stat. 1978, 2061) that a bilateral commercial agreement providing nondiscriminatory treatment to the products of countries heretofore denied such treatment, and a proclamation implementing such agreement, shall take effect only if approved by the Congress by the adoption of a concurrent resolution of approval, referred to in section 151 of the Trade Act of 1974 (88 Stat. 1978, 2001), of the extension of nondiscriminatory treatment to the products of the country concerned;","2":"Now, Therefore, I, Gerald R. Ford, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes, including section 404(a) of the Trade Act of 1974, do hereby proclaim as follows: (1) This Proclamation shall become effective and said agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Socialist Republic of Romania in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XII of the said Agreement, all of the foregoing to follow the adoption by the House of Representatives and the Senate, in accordance with the procedures set forth in section 151 of the said Act, of a concurrent resolution of approval of the extension of nondiscriminatory treatment to the products of the Socialist Republic of Romania, to the end that the same and every part of the said Agreement may be observed and fulfilled with good faith by the United States of America and the citizens thereof and all other persons subject to the jurisdiction thereof as of the date of its entry into force; and"},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P38":{"metadata":{"president":"Richard Nixon","date":"October 16, 1970","type":"proclamation"},"text":"By the President of the United States Of America\n\nA Proclamation\n\nThe Director of the Office of Emergency Preparedness has found, with the advice of the Oil Policy Committee\n\n1. that the importation from Western Hemisphere sources into District I, without charge to import quotas, of 14.6 million barrels of No. 2 fuel oil during the period January 1, 1971 through December 31, 1971 for allocation to independent deepwater terminal operators under appropriate seasonal restrictions, would not adversely affect the national security;\n\n2. that the importation authorized by this Proclamation of Canadian crude oil, unfinished oils, and finished products produced in Canada from Canadian crude oil by means of vessels operating on waterways (other than ocean waterways) in or between the United States and Canada, would not adversely affect the national security;\n\n3. that the importation other than by sea from Canada of natural gas liquids produced in Canada, without charge to import quotas, would not adversely affect the national security;\n\n4. that imports of ethane, propane and butane derived from Western Hemisphere sources may be increased without adversely affecting the national security;\n\n5. that crude oil may be imported into District I to be topped for use as burner fuel subject to such conditions as the Secretary may s
