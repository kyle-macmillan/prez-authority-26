nal Science and Technology Council (Subcommittee) and make recommendations to the Secretary to consider when reviewing and revising the National Quantum Initiative Program (Program) established pursuant to section 101 of the Act. The Committee shall also carry out all responsibilities set forth in section 104 of the Act.\n\n(b) The Committee shall meet at least twice a year and shall:\n\n(i) respond to requests from the Co-Chairs of the Committee for information, analysis, evaluation, or advice relating to quantum information science and technology applications;\n\n(ii) solicit information and ideas from a broad range of stakeholders on quantum information science in order to inform policy making. Stakeholders include the research community, the private sector, universities, national laboratories, executive departments and agencies (agencies), State and local governments, foundations, and nonprofit organizations; and\n\n(iii) respond to requests from the Subcommittee.\n\nSec. 3. Administration. (a) The heads of agencies shall, to the extent permitted by law, provide the Committee with information concerning quantum information science and supporting technologies and applications when requested by a Co-Chair of the Committee.\n\n(b) In consultation with the Director, the Committee may create standing subcommittees and ad hoc groups, including technical advisory groups, to assist and provide preliminary information to the Committee.\n\n(c) The Director may request that members of the Committee, its standing subcommittees, or ad hoc groups who do not hold a current clearance for access to classified information, receive appropriate clearances and access determinations pursuant to Executive Order 13526 of December 29, 2009 (Classified National Security Information), as amended, or any successor order.\n\n(d) The Department of Energy shall provide such funding and administrative and technical support as the Committee may require.\n\n(e) Committee members shall serve without any compensation for their work on the Committee, but may receive travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the Government service (5 U.S.C. 5701-5707).\n\nSec. 4. General Provisions. (a) Insofar as the Federal Advisory Committee Act, as amended (5 U.S.C. App.) (FACA), may apply to the Committee, any functions of the President under the FACA, except for those in section 6 of the FACA, shall be performed by the Secretary of Energy, in consultation with the Director, in accordance with the guidelines and procedures established by the Administrator of General Services.\n\n(b) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(c) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(d) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nAugust 30, 2019.","chunks":{"1":"The National Quantum Initiative Advisory Committee (Committee) is hereby established. The Committee shall consist of the Director of the Office of Science and Technology Policy or the Director's designee (Director) and not more than 22 members appointed by the Secretary of Energy (Secretary). Committee members shall represent industry, universities, Federal laboratories, and other Federal Government agencies. Committee members must be qualified to provide advice and information on quantum information science and technology research, development, de for access to classified information, receive appropriate clearances and access determinations pursuant to Executive Order 13526 of December 29, 2009 (Classified National Security Information), as amended, or any successor order.","3":"(d) The Department of Energy shall provide such funding and administrative and technical support as the Committee may require. (e) Committee members shall serve without any compensation for their work on the Committee, but may receive travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the Government service (5 U.S.C. 5701-5707). Sec. 4. General Provisions. (a) Insofar as the Federal Advisory Committee Act, as amended (5 U.S.C. App.) (FACA), may apply to the Committee, any functions of the President under the FACA, except for those in section 6 of the FACA, shall be performed by the Secretary of Energy, in consultation with the Director, in accordance with the guidelines and procedures established by the Administrator of General Services. (b) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":null,"military_ops":null}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO2":{"metadata":{"president":"Jimmy Carter","date":"October 03, 1977","type":"executive_order"},"text":"By virtue of the authority vested in me by the Constitution and statutes of the United States of America, and as President of the United States of America, Executive Order No. 111'83, as amended, is further amended as follows:\n\nSECTION 1. The word \"young\" is deleted wherever it appears in the preamble and in Section 2(a).\n\nSEC. 2. Section 2(b) (2) is amended to read:\n\n\"(2) Are presently early in their chosen careers and show exceptional promise of future development;\".\n\nSEC. 3. Section 2(b) (4) is deleted, the word \"and\" is added at the end of Section 2(b) (3), and Section 2(b)(5) is redesignated as Section 2 (b) (4).\n\nSEC. 4. Section 2(c) is amended by adding \"age\" after \"national origin,\".\n\nJIMMY CARTER\n\nThe White House,\n\nOctober 3, 1977.\n\n[Filed with the Office of the Federal Register, ll: 15 a.m., October 4, 1977]","chunks":{"1":"By virtue of the authority vested in me by the Constitution and statutes of the United States of America, and as President of the United States of America, Executive Order No. 111'83, as amended, is further amended as follows: SECTION 1. The word \"young\" is deleted wherever it appears in the preamble and in Section 2(a). SEC. 2.","2":"Section 2(b) (2) is amended to read: \"(2) Are presently early in their chosen careers and show exceptional promise of future development;\". SEC. 3. Section 2(b) (4) is deleted, the word \"and\" is added at the end of Section 2(b) (3), and Section 2(b)(5) is redesignated as Section 2 (b) (4). SEC. 4.","3":"Section 2(c) is amended by adding \"age\" after \"national origin,\"."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"4","diplomacy":"no","military_ops":"no"},"2":{"code":"4","diplomacy":"no","military_ops":"no"},"3":{"code":"4","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO3":{"metadata":{"president":"John F. Kennedy","date":"June 22, 1963","type":"executive_order"},"text":"WHEREAS it is the policy of the United States Government to encourage by affirmative action the elimination of discrimination because of race, creed, color, or national origin in employment on work involving Federal financial assistance, to the end that employment opportunities created by Federal funds shall be equally available to all qualified persons; and\n\nWHEREAS Executive Order No. 10925 of March 6, 1961, 26 F.R. 1977, reaffirmed the policy of requiring the inclusion of non-discrimination provisions in Government contracts and established the President's Committee on Equal Employment Opportunity to administer the program for obtaining adherence to and compliance with such provisions; and\n\nWHEREAS construction under programs of Federal grants, loans, and other forms of financial assistance to State and local governments and to private organizations creates substantial employment opportunities; and\n\nWHEREAS it is deemed desirable and appropriate to extend the existing program for nondiscrimination in employment in Government contracts established by Executive Order No. 10925 to include certain contracts for construction financed with assistance from the Federal Government; and\n\nWHEREAS it is also desirable to amend Executive Order No. 10925 in certain respects in order to clarify the authority of the President's Committee on Equal Employment Opportunity:\n\nNOW, THEREFORE, by virtue of the authority vested in me as President of the United States by the Constitution and statutes of the United States, it is ordered as follows:\n\nPART I--NON-DISCRIMINATION PROVISIONS IN FEDERALLY ASSISTED CONSTRUCTION CONTRACTS\n\nSECTION 101. Each executive department and agency which administers a program involving Federal financial assistance shall, insofar as it may be consistent with law, require as a condition for the approval of any grant, contract, loan, insurance or guarantee there under which may involve a construction contract that the applicant for Federal assistance undertake and agree to incorporate, or cause to be incorporated, into all construction contracts paid for in whole or in part with funds obtained from the Federal Government or borrowed on the Credit of the Federal Government pursuant to such grant, contract, loan, insurance or guarantee, or undertaken pursuant to any Federal program involving such grant, contract, loan, insurance or guarantee, the provisions prescribed for Government contracts by section 301 of Executive Order No. 10925 or such modification thereof, preserving in substance the contractor's obligations thereunder, as may be approved by the President's Committee on Equal Employment Opportunity (the \"Committee\"), together with such additional provisions as the Committee deems appropriate to establish and protect the interest of the United States in the enforcement of these obligations. Each such applicant shall also undertake and agree (i) to assist and cooperate actively with the administering department or agency and the Committee in obtaining the compliance of contractors and subcontractors with said contract provisions and with obtain and to furnish to the administering department or agency and the rules, regulations, and relevant orders of the Committee, (ii) to obtain and to furnish to the administering agency and to the Committee such information as they may require for the supervision of such compliance, (iii) to enforce the obligations of contractors and subcontractors under such provisions, rules, regulations, and orders, (iv) to carry out sanctions and penalties for violation of such obligations imposed upon contractors and subcontractors by the Committee or the administering department or agency pursuant to Part III, Subpart D, of Executive Order No. 10925, and (v) to refrain from entering into any contract subject to this order, or extension or other modification of such a contract with a contractor debarred from Government contracts under Part III, Subpart D, of Executive Order No. 10925.\n\nSEC. 102. (a) \"Construction contract\" as used herein means any contract for the construction, rehabilitation, alteration, conversion, extension, or repair of buildings, highways, or other improvements to real property.\n\n(b) The provisions of Part III of Executive Order No. 10925 shall apply to such construction contracts, and for purposes of such application the administering department or agency shall be considered the contracting agency referred to therein.\n\n(c) The term \"applicant\" as used herein means an applicant for Federal assistance or, as determined by agency regulation, other program participant, with respect to whom an application for any grant, contract, loan, insurance or guarantee is not finally acted upon prior to the effective date of this part, and it includes such an applicant after he becomes a recipient of such Federal assistance.\n\nSEC. 103. (a) Each administering department and agency shall be primarily responsible for obtaining the compliance of such applicants with their undertakings hereunder and shall comply with the rules of the Committee in the discharge of this responsibility. Each administering department and agency is directed to cooperate with the Committee, and to furnish the Committee such information and assistance as it may require in the performance of its functions under this order.\n\n(b) In the event an applicant fails and refuses to comply with his undertakings, the administering department or agency may, and upon the recommendation of the Committee, shall take any or all of the following actions:\n\n(1) cancel, terminate, or suspend in whole or in part the agreement or contract with such applicant with respect to which the failure and refusal occurred;\n\n(2) refrain from extending any further assistance under any of its programs subject to this order until satisfactory assurance of future compliance has been received from such applicant;\n\n(3) refer the case to the Department of Justice for appropriate legal proceedings.\n\n(c) No action shall be taken with respect to an applicant pursuant to paragraph (1) or (2)of subsection (b) without notice and hearing before the administering department or agency or the Committee, in accordance with the rules and regulations of the Committee.\n\nSEC. 104. The Committee may, by rule, regulation, or order, exempt all or part of any program of an administering agency from the requirements of this order when it deems that special circumstances in the national interest so require.\n\nSEC. 105. The Committee shall adopt such rules and regulations and issue such orders as it deems necessary and appropriate to achieve the purposes of this order.\n\nPART II-- AMENDMENTS TO EXECUTIVE ORDER NO. 10925\n\nSECTION 201. Section 301 of Executive Order No. 10925 of March 6, 1961, is amended to read:\n\n\"SECTION 301. Except in contracts exempted in accordance with section 303 of this order, all Government contracting agencies shall include in every Government contract hereafter entered into the following provisions:\n\n'During the performance of this contract, the contractor agrees as follows:\n\n‘(1) The contractor will not discriminate against any employee or applicant for employment because of race, creed, color, or national origin. The contractor will take affirmative action to ensure that applicants are employed, and that employees are treated during employment, without regard to their race, creed, color, or national origin. Such action shall include, but not be limited, to the following: employment, upgrading, demotion or transfer; recruitment or recruitment advertising; layoff or termination; rates of pay or other forms of compensation; and selection for training, including apprenticeship. The contractor agrees to post in conspicuous places, available to employee and applicants for employment, notices to be provided by the contracting officer setting forth the provisions of this non-discrimination clause.\n\n'(2) The contractor will, in all solicitations or advertisements for employees placed by or on behalf of the contractor, state that all qualified applicants will receive consideration for employment without regard to race, creed, color, or national origin.\n\n'(3) The contractor will send to each labor union or representative of workers with which he has a collective bargaining agreement or other contract or understanding, a notice, to be provided by the agency contracting officer, advising the said labor union or workers' representative of the contractor's commitments under this section, and shall post copies of the notice in conspicuous places available to employees and applicants for employment.\n\n'(4) The contractor will comply with all provisions of Executive Order No. 10925 of March 6, 1961, as amended, and of the rules, regulations, and relevant orders of the President's Committee on Equal Employment Opportunity created thereby.\n\n'(5) The contractor will furnish all information and reports required by Executive Order No. 10925 of March 6, 1961, as amended, and by the rules, regulations, and orders of the said Committee, or pursuant thereto, and will permit access to his books, records, and accounts by the contracting agency and the Committee for purposes of investigation to ascertain compliance with such rules, regulations, and orders.\n\n'(6) In the event of the contractor's noncompliance with the non-discrimination clauses of this contract or with any of the said rules, regulations, or orders, this contract may be canceled, terminated, or suspended in whole or in part and the contractor may be declared ineligible for further Government contracts in accordance with procedures authorized in Executive Order No. 10925 of March 6, 1961, as amended, and such other sanctions may be imposed and remedies invoked as provided in the said Executive Order or by rule, regulation, or order of the President's Committee on Equal Employment Opportunity, or as otherwise provided by law.\n\n'(7) The contractor will include the provisions of paragraphs (1) through (7) in every subcontract or purchase order unless exempted by rules, regulations, or orders of the President's Committee on Equal Employment Opportunity issued pursuant to section 303 of Executive Order No. 10925 of March 6, 1961, as amended, so that such provisions will be binding upon each subcontractor or vendor. The contractor will take such action with respect to any subcontract or purchase order as the contracting agency may direct as a means of enforcing such provisions, including sanctions for noncompliance: Provided, however, that in the event the contractor becomes involved in, or is threatened with, litigation with a subcontractor or vendor as a result of such direction by the contracting agency, the contractor may request the United States to enter into such litigation to protect the interests of the United States.'\"\n\nSEC. 202. Section 303 of Executive Order No. 10925 is amended to read:\n\n\"The Committee may, when it deems that special circumstances in the national interest so require, exempt a contracting agency from the requirement of including any or all of the provisions of section 301 of this order in any specific contract, subcontract or purchase order. The Committee may, by rule or regulation, also exempt certain classes of contracts, subcontracts or purchase orders (a) where work is to be or has been performed outside the United States and no recruitment of workers within the limits of the United States is involved; (b) for standard commercial supplies or raw materials; (c) involving less than specified amounts of money or specified numbers of workers; or (d) to the extent that they involve subcontracts below a specified tier. The Committee may also provide, by rule, regulation, or order, for the exemption of facilities of a contractor which are in all respects separate and distinct from activities of the contractor related to the performance of the contract, provided that such an exemption will not interfere with or impede the effectuation of the purposes of this order and provided that in the absence of such an exemption all such facilities shall be covered by the provisions of this order. \"\n\nPART III--MISCELLANEOUS\n\nSECTION 301. The Secretary of Health, Education, and Welfare and the Administrator of the Housing and Home Finance Agency are designated members of the Committee. Each such member may designate an alternate to represent him in his absence.\n\nSEC. 302. Section 401 of Executive Order No. 10925 shall apply to the administering departments and agencies subject to this order.\n\nSEC. 303. Part I of this order shall become effective thirty days after the execution of this order. Parts II and III shall be effective immediately.\n\nJOHN F. KENNEDY\n\nTHE WHITE HOUSE,\n\nJune 22, 1963","chunks":{"1":"NOW, THEREFORE, by virtue of the authority vested in me as President of the United States by the Constitution and statutes of the United States, it is ordered as follows: PART I--NON-DISCRIMINATION PROVISIONS IN FEDERALLY ASSISTED CONSTRUCTION CONTRACTS SECTION 101. Each executive department and agency which administers a program involving Federal financial assistance shall, insofar as it may be consistent with law, require as a condition for the approval of any grant, contract, loan, insurance or guarantee there under which may involve a construction contract that the applicant for Federal assistance undertake and agree to incorporate, or cause to be incorporated, into all construction contracts paid for in whole or in part with funds obtained from the Federal Government or borrowed on the Credit of the Federal Government pursuant to such grant, contract, loan, insurance or guarantee, or undertaken pursuant to any Federal program involving such grant, contract, loan, insurance or guarantee, the provisions prescribed for Government contracts by section 301 of Executive Order No. 10925 or such modification thereof, preserving in substance the contractor's obligations thereunder, as may be approved by the President's Committee on Equal Employment Opportunity (the \"Committee\"), together with such additional provisions as the Committee deems appropriate to establish and protect the interest of the United States in the enforcement of these obligations. Each such applicant shall also undertake and agree (i) to assist and cooperate actively with the administering department or agency and the Committee in obtaining the compliance of contractors and subcontractors with said contract provisions and with obtain and to furnish to the administering department or agency and the rules, regulations, and relevant orders of the Committee, (ii) to obtain and to furnish to the administering agency and to the Committee such information as they may require for the supervision of such compliance, (iii) to enforce the obligations of contractors and subcontractors under such provisions, rules, regulations, and orders, (iv) to carry out sanctions and penalties for violation of such obligations imposed upon contractors and subcontractors by the Committee or the administering department or agency pursuant to Part III, Subpart D, of Executive Order No. 10925, and (v) to refrain from entering into any contract subject to this order, or extension or other modification of such a contract with a contractor debarred from Government contracts under Part III, Subpart D, of Executive Order No. 10925. SEC. 102. (a) \"Construction contract\" as used herein means any contract for the construction, rehabilitation, alteration, conversion, extension, or repair of buildings, highways, or other improvements to real property. (b) The provisions of Part III of Executive Order No. 10925 shall apply to such construction contracts, and for purposes of such application the administering department or agency shall be considered the contracting agency referred to therein. (c) The term \"applicant\" as used herein means an applicant for Federal assistance or, as determined by agency regulation, other program participant, with respect to whom an application for any grant, contract, loan, insurance or guarantee is not finally acted upon prior to the effective date of this part, and it includes such an applicant after he becomes a recipient of such Federal assistance. SEC. 103. (a) Each administering department and agency shall be primarily responsible for obtaining the compliance of such applicants with their undertakings hereunder and shall comply with the rules of the Committee in the discharge of this responsibility. Each administering department and agency is directed to cooperate with the Committee, and to furnish the Committee such information and assistance as it may require in the performance of its functions under this order.","2":"(b) In the event an applicant fails and refuses to comply with his undertakings, the administering department or agency may, and upon the recommendation of the Committee, shall take any or all of the following actions: (1) cancel, terminate, or suspend in whole or in part the agreement or contract with such applicant with respect to which the failure and refusal occurred; (2) refrain from extending any further assistance under any of its programs subject to this order until satisfactory assurance of future compliance has been received from such applicant; (3) refer the case to the Department of Justice for appropriate legal proceedings. (c) No action shall be taken with respect to an applicant pursuant to paragraph (1) or (2)of subsection (b) without notice and hearing before the administering department or agency or the Committee, in accordance with the rules and regulations of the Committee. SEC. 104. The Committee may, by rule, regulation, or order, exempt all or part of any program of an administering agency from the requirements of this order when it deems that special circumstances in the national interest so require. SEC. 105. The Committee shall adopt such rules and regulations and issue such orders as it deems necessary and appropriate to achieve the purposes of this order. PART II-- AMENDMENTS TO EXECUTIVE ORDER NO. 10925 SECTION 201.","3":"Section 301 of Executive Order No. 10925 of March 6, 1961, is amended to read: \"SECTION 301. Except in contracts exempted in accordance with section 303 of this order, all Government contracting agencies shall include in every Government contract hereafter entered into the following provisions: 'During the performance of this contract, the contractor agrees as follows: ‘(1) The contractor will not discriminate against any employee or applicant for employment because of race, creed, color, or national origin. The contractor will take affirmative action to ensure that applicants are employed, and that employees are treated during employment, without regard to their race, creed, color, or national origin. Such action shall include, but not be limited, to the following: employment, upgrading, demotion or transfer; recruitment or recruitment advertising; layoff or termination; rates of pay or other forms of compensation; and selection for training, including apprenticeship. The contractor agrees to post in conspicuous places, available to employee and applicants for employment, notices to be provided by the contracting officer setting forth the provisions of this non-discrimination clause. '(2) The contractor will, in all solicitations or advertisements for employees placed by or on behalf of the contractor, state that all qualified applicants will receive consideration for employment without regard to race, creed, color, or national origin. '(3) The contractor will send to each labor union or representative of workers with which he has a collective bargaining agreement or other contract or understanding, a notice, to be provided by the agency contracting officer, advising the said labor union or workers' representative of the contractor's commitments under this section, and shall post copies of the notice in conspicuous places available to employees and applicants for employment. '(4) The contractor will comply with all provisions of Executive Order No. 10925 of March 6, 1961, as amended, and of the rules, regulations, and relevant orders of the President's Committee on Equal Employment Opportunity created thereby. '(5) The contractor will furnish all information and reports required by Executive Order No. 10925 of March 6, 1961, as amended, and by the rules, regulations, and orders of the said Committee, or pursuant thereto, and will permit access to his books, records, and accounts by the contracting agency and the Committee for purposes of investigation to ascertain compliance with such rules, regulations, and orders. '(6) In the event of the contractor's noncompliance with the non-discrimination clauses of this contract or with any of the said rules, regulations, or orders, this contract may be canceled, terminated, or suspended in whole or in part and the contractor may be declared ineligible for further Government contracts in accordance with procedures authorized in Executive Order No. 10925 of March 6, 1961, as amended, and such other sanctions may be imposed and remedies invoked as provided in the said Executive Order or by rule, regulation, or order of the President's Committee on Equal Employment Opportunity, or as otherwise provided by law. '(7) The contractor will include the provisions of paragraphs (1) through (7) in every subcontract or purchase order unless exempted by rules, regulations, or orders of the President's Committee on Equal Employment Opportunity issued pursuant to section 303 of Executive Order No. 10925 of March 6, 1961, as amended, so that such provisions will be binding upon each subcontractor or vendor. The contractor will take such action with respect to any subcontract or purchase order as the contracting agency may direct as a means of enforcing such provisions, including sanctions for noncompliance: Provided, however, that in the event the contractor becomes involved in, or is threatened with, litigation with a subcontractor or vendor as a result of such direction by the contracting agency, the contractor may request the United States to enter into such litigation to protect the interests of the United States.'\" SEC. 202.","4":"Section 303 of Executive Order No. 10925 is amended to read: \"The Committee may, when it deems that special circumstances in the national interest so require, exempt a contracting agency from the requirement of including any or all of the provisions of section 301 of this order in any specific contract, subcontract or purchase order. The Committee may, by rule or regulation, also exempt certain classes of contracts, subcontracts or purchase orders (a) where work is to be or has been performed outside the United States and no recruitment of workers within the limits of the United States is involved; (b) for standard commercial supplies or raw materials; (c) involving less than specified amounts of money or specified numbers of workers; or (d) to the extent that they involve subcontracts below a specified tier. The Committee may also provide, by rule, regulation, or order, for the exemption of facilities of a contractor which are in all respects separate and distinct from activities of the contractor related to the performance of the contract, provided that such an exemption will not interfere with or impede the effectuation of the purposes of this order and provided that in the absence of such an exemption all such facilities shall be covered by the provisions of this order. \" PART III--MISCELLANEOUS SECTION 301. The Secretary of Health, Education, and Welfare and the Administrator of the Housing and Home Finance Agency are designated members of the Committee. Each such member may designate an alternate to represent him in his absence. SEC. 302. Section 401 of Executive Order No. 10925 shall apply to the administering departments and agencies subject to this order. SEC. 303. Part I of this order shall become effective thirty days after the execution of this order. Parts II and III shall be effective immediately."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"2","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO4":{"metadata":{"president":"Joseph R. Biden, Jr.","date":"September 12, 2022","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to effectively implement the historic energy and infrastructure provisions in Public Law 117-169, commonly referred to as the Inflation Reduction Act of 2022 (the \"Act\"), and to accelerate United States global leadership in clean energy innovation, manufacturing, and deployment in a way that cuts consumer energy costs, creates well-paying union jobs and sustainable and equitable economic opportunity, advances environmental justice, and addresses the climate crisis, it is hereby ordered as follows:\n\nSection 1. Background. The Act is the single largest and most ambitious investment in the ability of the United States to advance clean energy, cut consumer energy costs, confront the climate crisis, promote environmental justice, and strengthen energy security, among other vital provisions that will lower costs for families, reduce the deficit, and grow and strengthen the economy. The Act will:\n\n(a) build on the once-in-a-generation investment in the infrastructure and competitiveness of the United States set forth in the Infrastructure Investment and Jobs Act (Public Law 117-58) by accelerating the deployment of clean energy technologies, making home energy efficiency and clean energy installations more affordable, and incentivizing the purchase of electric vehicles;\n\n(b) boost energy security and lower energy costs for families, businesses, and government;\n\n(c) revitalize American manufacturing by investing in domestic clean energy supply chains and creating well-paying union jobs, including in traditional energy communities;\n\n(d) improve public health and advance environmental justice and economic opportunity for frontline communities who disproportionately bear the brunt of cumulative exposure to industrial and energy pollution;\n\n(e) promote climate justice by reducing harmful greenhouse gas emissions in line with the goal of realizing net-zero emissions by no later than 2050;\n\n(f) harness nature-based solutions—including climate-smart agriculture and forestry—that deliver economic benefits for rural communities, Tribes, farmers, ranchers, and forest landowners;\n\n(g) expand research and accelerate innovation in the development of clean energy, climate, and related technologies; and\n\n(h) increase the resilience of our communities in the face of a changing climate.\n\nAchieving these goals will require effective implementation of the Act by my Administration, as well as by State, local, Tribal, and territorial governments.\n\nSec. 2. Implementation Priorities. In implementing the Act, all agencies (as described in section 3502(1) of title 44, United States Code, except for the agencies described in section 3502(5) of title 44) shall, as appropriate and to the extent consistent with law, prioritize:\n\n(a) investing public dollars effectively and efficiently, working to avoid waste, and achieving measurable, demonstrable outcomes for the American people;\n\n(b) driving progress to achieve the climate goals of the United States to reduce greenhouse gas emissions 50-52 percent below 2005 levels in 2030, achieve a carbon pollution-free electricity sector by 2035, and achieve net-zero emissions by no later than 2050;\n\n(c) advancing environmental and climate justice through an all-of-government approach, including through the Justice40 Initiative set forth in Executive Order 14008 of January 27, 2021 (Tackling the Climate Crisis at Home and Abroad), to protect and improve the health and well-being of fence-line and frontline communities in the United States;\n\n(d) promoting construction of clean energy generation, storage, and transmission, and enabling technologies through efficient, effective mechanisms that incorporate community engagement;\n\n(e) increasing the competitiveness of the United States economy and investment in critical supply chains, including through the Act's incentives and measures to strengthen domestic manufacturing and supply chains;\n\n(f) increasing high-quality job opportunities for American workers and improving equitable access to these jobs, including in traditional energy communities, through the timely implementation of the Act's requirements for prevailing wages and registered apprenticeships and by focusing on high labor standards and the free and fair chance to join a union;\n\n(g) reducing energy costs for working families, businesses, and governments at all levels while increasing energy security for the benefit of United States economic competitiveness and national security;\n\n(h) accelerating innovation by directing the scientific and technical expertise of America's researchers, businesses, and workers toward achieving breakthroughs in clean energy and climate technologies; and\n\n(i) effectively coordinating with State, local, Tribal, and territorial governments, as well as with private-sector stakeholders and nongovernmental organizations, in implementing the critical investments outlined in this section to build sustainable, resilient communities.\n\nSec. 3. White House Office on Clean Energy Innovation and Implementation. There is hereby established the White House Office on Clean Energy Innovation and Implementation within the Executive Office of the President, which shall coordinate the policymaking process with respect to implementing the energy and infrastructure provisions of the Act and other essential initiatives. The White House Office on Clean Energy Innovation and Implementation shall have a staff headed by the Senior Advisor for Clean Energy Innovation and Implementation; shall have such staff and other assistance as may be necessary to carry out the provisions of this order, subject to the availability of appropriations; and may work with established or ad hoc committees and interagency groups.\n\nSec. 4. Interagency Coordination. (a) To further the robust implementation of the energy and infrastructure provisions of the Act, Executive Order 14008 is amended as follows:\n\n(i) The introductory text following the heading for section 203 is revised to read as follows: \"There is hereby established a National Climate Task Force (Task Force). The Task Force shall be chaired by the Senior Advisor for Clean Energy Innovation and Implementation. The National Climate Advisor shall serve as Vice Chair.\".\n\n(ii) Section 203(a) is revised to read as follows:\n\n\"(a) Membership. The Task Force shall consist of the following additional members:\n\n(i) the Secretary of the Treasury;\n\n(ii) the Secretary of Defense;\n\n(iii) the Attorney General;\n\n(iv) the Secretary of the Interior;\n\n(v) the Secretary of Agriculture;\n\n(vi) the Secretary of Commerce;\n\n(vii) the Secretary of Labor;\n\n(viii) the Secretary of Health and Human Services;\n\n(ix) the Secretary of Housing and Urban Development;\n\n(x) the Secretary of Transportation;\n\n(xi) the Secretary of Energy;\n\n(xii) the Secretary of Education;\n\n(xiii) the Secretary of Homeland Security;\n\n(xiv) the Administrator of the Environmental Protection Agency;\n\n(xv) the Director of the Office of Management and Budget;\n\n(xvi) the Director of the Office of Science and Technology Policy;\n\n(xvii) the Administrator of the Small Business Administration;\n\n(xviii) the Chair of the Council on Environmental Quality;\n\n(xix) the Assistant to the President for National Security Affairs;\n\n(xx) the Assistant to the President for Domestic Policy;\n\n(xxi) the Assistant to the President for Homeland Security and Counterterrorism;\n\n(xxii) the Assistant to the President for Economic Policy;\n\n(xxiii) the Administrator of the National Aeronautics and Space Administration;\n\n(xxiv) the Chief Executive Officer of the Corporation for National and Community Service;\n\n(xxv) the Administrator of General Services;\n\n(xxvi) the White House Infrastructure Coordinator; and\n\n(xxvii) the heads of such other departments, agencies, and offices as the Chair or Vice Chair may from time to time invite to participate.\".\n\n(iii) To expand the mission of the National Climate Task Force to include coordinating effective implementation of the Act, as outlined in section 2 of this order, the second sentence of section 203(b) is revised to read as follows: \"This Task Force shall facilitate planning and implementation of key Federal actions to reduce climate pollution; increase resilience to the impacts of climate change; protect public health; conserve our lands, waters, oceans, and biodiversity; deliver environmental justice; spur well-paying union jobs and economic growth; coordinate effective implementation of Public Law 117-169, commonly referred to as the Inflation Reduction Act of 2022, in coordination with the Infrastructure Implementation Task Force established in Executive Order 14052 of November 15, 2021 (Implementation of the Infrastructure Investment and Jobs Act), as appropriate; and accelerate clean energy innovation and deployment.\".\n\n(iv) The introductory text following the heading for section 218 is revised to read as follows:\n\n\"There is hereby established an Interagency Working Group on Coal and Power Plant Communities and Economic Revitalization (Interagency Working Group). The National Climate Advisor, the Assistant to the President for Economic Policy, and the Senior Advisor for Clean Energy Innovation and Implementation shall serve as Co-Chairs of the Interagency Working Group.\".\n\n(b) Section 1-102(b) of Executive Order 12898 of February 11, 1994 (Federal Actions to Address Environmental Justice in Minority Populations and Low-Income Populations), as amended by section 220(a) of Executive Order 14008, is further amended by revising subsection (xvii) and (xviii) and adding subsection (xix) to read as follows: \"(xvii) the Assistant to the President for Domestic Policy; (xviii) the Assistant to the President for Economic Policy; and (xix) the Senior Advisor for Clean Energy Innovation and Implementation.\".\n\n(c) To further support implementation of the energy and infrastructure provisions of the Act, section 3(d) of Executive Order 14052 of November 15, 2021 (Implementation of the Infrastructure Investment and Jobs Act), is amended by striking \"and\" at the end of subsection (xi), striking subsection (xii), and adding in lieu thereof the following: \"(xii) the Senior Advisor for Clean Energy Innovation and Implementation; and (xiii) the heads of such other executive departments, agencies, and offices as the Co-Chairs may from time to time invite to participate.\".\n\nSec. 5. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nJOSEPH R. BIDEN JR.\n\nThe White House,\n\nSeptember 12, 2022.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to effectively implement the historic energy and infrastructure provisions in Public Law 117-169, commonly referred to as the Inflation Reduction Act of 2022 (the \"Act\"), and to accelerate United States global leadership in clean energy innovation, manufacturing, and deployment in a way that cuts consumer energy costs, creates well-paying union jobs and sustainable and equitable economic opportunity, advances environmental justice, and addresses the climate crisis, ranted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":null,"military_ops":null},"3":{"code":"1","diplomacy":null,"military_ops":null},"4":{"code":"1","diplomacy":null,"military_ops":null},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO6":{"metadata":{"president":"Ronald Reagan","date":"May 14, 1985","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and laws 'of the United States of America, including section 3347 of title 5, United States Code, it is hereby ordered as follows:\n\nPart I. Succession to the Position of Secretary of Defense.\n\nIn the event of the death, disability, or absence of the Secretary of Defense, the incumbents in the Department of Defense positions listed below shall succeed to the position of, and act as, Secretary of Defense in the order indicated:\n\n1. Deputy Secretary of Defense.\n\n2. Secretary of the Army.\n\n3. Secretary of the Navy.\n\n4. Secretary of the Air Force.\n\n5. Under Secretary of Defense for Policy.\n\n6. Under Secretary of Defense for Research and Engineering.\n\n7. Assistant Secretaries of Defense and the General Counsel of the Department of Defense, in the order fixed by their length of service as such.\n\n8. Under Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such.\n\n9. Assistant Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such.\n\nPrecedence within a particular group between or among two or more officers having the same date of appointment shall be as determined by the Secretary of Defense at the time of appointment.\n\nPart II. Succession to the Position of Secretary of the Army.\n\nIn the event of the death, disability, or absence of the Secretary of the Army, the officers designated below shall succeed to the position of, and act as, Secretary of the Army in the order indicated:\n\n1. Under Secretary of the Army.\n\n2. Assistant Secretaries of the Army, in the order fixed by their length of service as such.\n\n3. Chief of Staff, United States Army.\n\n4. Vice Chief of Staff, United States Army.\n\n5. Commanding General, U.S. Army Forces Command.\n\nPart III. Succession to the Position of Secretary of the Navy.\n\nIn the event of the death, disability, or absence of the Secretary of the Navy, the officers designated below shall succeed to the position of, and act as, Secretary of the Navy in the order indicated:\n\n1. Under Secretary of the Navy.\n\n2. Assistant Secretaries of the Navy, in the order prescribed by the Secretary of the Navy, or if no order is prescribed by the Secretary, then in the order fixed by their length of service as such.\n\n3. Chief of Naval Operations.\n\n4. Vice Chief of Naval Operations.\n\nPart IV Succession to the Position of Secretary of the Air Force.\n\nIn the event of the death, disability, or absence of the Secretary of the Air Force, the officers designated below shall succeed to the position of, and act as, Secretary of the Air Force in the order indicated:\n\n1. Under Secretary of the Air Force.\n\n2. Assistant Secretaries of the Air Force, in the order fixed by their length of service as such.\n\n3. Chief of Staff, United States Air Force.\n\n4. Vice Chief of Staff, United States Air Force.\n\n5. The senior Deputy Chief of Staff who is not absent or disabled.\n\n6. The Commander, Air University.\n\nPart V. Variations in the Order of Succession.\n\nWithout regard to any other part of this Order, except Part VI, the President, or the person acting as President under section 19 of title 3, United States Code, may, in the event of the death, disability, or absence of the Secretary of Defense, appoint any officer designated in Part I of this Order to succeed to the position of, and act as, Secretary of Defense; and that person may, in the event of the death, disability, or absence of the Secretary of a Military Department, appoint any officer designated in the part of this Order that relates to the order to succession in the Department concerned to succeed to the position of, and act as, the Secretary of that Department.\n\nPart VI. Temporary Nature of Succession/ Acting Capacity.\n\nSuccession to office pursuant to this Order shall be on a temporary or interim basis and shall not have the effect of vacating the statutory position held by the successor. An officer shall not succeed to any position under this order if the position that he occupies entitling him so to succeed is held by him in an acting capacity only. part VII. Revocation of Prior Executive Order.\n\nExecutive Order No. 10820 of May 18, 1959, is hereby revoked.\n\nRONALD REAGAN\n\nThe White House,\n\nMay 14, 1985.\n\n[Filed with the Office of the Federal Register, 10:29 a.m., May 15, 1985]","chunks":{"1":"By the authority vested in me as President by the Constitution and laws 'of the United States of America, including section 3347 of title 5, United States Code, it is hereby ordered as follows: Part I. Succession to the Position of Secretary of Defense. In the event of the death, disability, or absence of the Secretary of Defense, the incumbents in the Department of Defense positions listed below shall succeed to the position of, and act as, Secretary of Defense in the order indicated: 1. Deputy Secretary of Defense. 2. Secretary of the Army. 3. Secretary of the Navy. 4. Secretary of the Air Force. 5. Under Secretary of Defense for Policy. 6. Under Secretary of Defense for Research and Engineering. 7. Assistant Secretaries of Defense and the General Counsel of the Department of Defense, in the order fixed by their length of service as such. 8. Under Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such. 9. Assistant Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such. Precedence within a particular group between or among two or more officers having the same date of appointment shall be as determined by the Secretary of Defense at the time of appointment. Part II. Succession to the Position of Secretary of the Army. In the event of the death, disability, or absence of the Secretary of the Army, the officers designated below shall succeed to the position of, and act as, Secretary of the Army in the order indicated: 1. Under Secretary of the Army. 2. Assistant Secretaries of the Army, in the order fixed by their length of service as such. 3. Chief of Staff, United States Army. 4. Vice Chief of Staff, United States Army. 5. Commanding General, U.S. Army Forces Command. Part III. Succession to the Position of Secretary of the Navy. In the event of the death, disability, or absence of the Secretary of the Navy, the officers designated below shall succeed to the position of, and act as, Secretary of the Navy in the order indicated: 1. Under Secretary of the Navy. 2. Assistant Secretaries of the Navy, in the order prescribed by the Secretary of the Navy, or if no order is prescribed by the Secretary, then in the order fixed by their length of service as such. 3. Chief of Naval Operations. 4. Vice Chief of Naval Operations. Part IV Succession to the Position of Secretary of the Air Force. In the event of the death, disability, or absence of the Secretary of the Air Force, the officers designated below shall succeed to the position of, and act as, Secretary of the Air Force in the order indicated: 1. Under Secretary of the Air Force. 2. Assistant Secretaries of the Air Force, in the order fixed by their length of service as such. 3. Chief of Staff, United States Air Force. 4. Vice Chief of Staff, United States Air Force. 5. The senior Deputy Chief of Staff who is not absent or disabled. 6. The Commander, Air University. Part V. Variations in the Order of Succession. Without regard to any other part of this Order, except Part VI, the President, or the person acting as President under section 19 of title 3, United States Code, may, in the event of the death, disability, or absence of the Secretary of Defense, appoint any officer designated in Part I of this Order to succeed to the position of, and act as, Secretary of Defense; and that person may, in the event of the death, disability, or absence of the Secretary of a Military Department, appoint any officer designated in the part of this Order that relates to the order to succession in the Department concerned to succeed to the position of, and act as, the Secretary of that Department. Part VI. Temporary Nature of Succession/ Acting Capacity. Succession to office pursuant to this Order shall be on a temporary or interim basis and shall not have the effect of vacating the statutory position held by the successor. An officer shall not succeed to any position under this order if the position that he occupies entitling him so to succeed is held by him in an acting capacity only. part VII. Revocation of Prior Executive Order.","2":"Executive Order No. 10820 of May 18, 1959, is hereby revoked."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO8":{"metadata":{"president":"Dwight D. Eisenhower","date":"December 04, 1954","type":"executive_order"},"text":"By virtue of the authority vested in me as President of the United States, it is hereby ordered that the several executive departments, independent establishments, and other governmental agencies in the metropolitan area of the District of Columbia, including the General Accounting Office, the Government Printing Office, and the Navy Yard and Naval Stations, shall be closed all day on Friday, December 24, 1954, the day preceding Christmas Day, and one-half day on Friday, December 31, 1954, the day preceding New Year's Day; and all employees in the Federal service in the metropolitan area of the District of Columbia, and in the field service of the executive departments, independent establishments, and other agencies of the Government, except those who may for special public reasons be excluded from the provisions of this order by the heads of their respective departments, establishments, or agencies, or those whose absence from duty would be inconsistent with the provisions of existing law, shall be excused from duty on such day and such one-half day; and such day and one-half day shall each be considered a holiday within the meaning of Executive Order No. 10358 of June 9, 1952, and of all statutes so far as they relate to the compensation and leave of employees of the United States.\n\nDWIGHT D. EISENHOWER\n\nTHE WHITE HOUSE,\n\nDecember 4, 1954.","chunks":{"1":"By virtue of the authority vested in me as President of the United States, it is hereby ordered that the several executive departments, independent establishments, and other governmental agencies in the metropolitan area of the District of Columbia, including the General Accounting Office, the Government Printing Office, and the Navy Yard and Naval Stations, shall be closed all day on Friday, December 24, 1954, the day preceding Christmas Day, and one-half day on Friday, December 31, 1954, the day preceding New Year's Day; and all employees in the Federal service in the metropolitan area of the District of Columbia, and in the field service of the executive departments, independent establishments, and other agencies of the Government, except those who may for special public reasons be excluded from the provisions of this order by the heads of their respective departments, establishments, or agencies, or those whose absence from duty would be inconsistent with the provisions of existing law, shall be excused from duty on such day and such one-half day; and such day and one-half day shall each be considered a holiday within the meaning of Executive Order No. 10358 of June 9, 1952, and of all statutes so far as they relate to the compensation and leave of employees of the United States."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO9":{"metadata":{"president":"Donald J. Trump","date":"March 27, 2020","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Defense Production Act of 1950, as amended (50 U.S.C. 4501 et seq.) (the \"Act\"), the National Emergencies Act (50 U.S.C. 1601 et seq.), and section 301 of title 3, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy. In Proclamation 9994 of March 13, 2020 (Declaring a National Emergency Concerning the Novel Coronavirus Disease (COVID–19) Outbreak), I declared a national emergency recognizing the threat that the novel (new) coronavirus known as SARS– CoV–2 poses to our Nation's healthcare systems. In recognizing the public health risk, I noted that on March 11, 2020, the World Health Organization announced that the outbreak of COVID– 19 (the disease caused by SARS–CoV–2) can be characterized as a pandemic. I also noted that while the Federal Government, along with State and local governments, have taken preventive and proactive measures to slow the spread of the virus and to treat those affected, the spread of COVID–19 within our Nation's communities threatens to strain our Nation's healthcare systems.\n\nTo deal with this threat, on March 18, 2020, I issued Executive Order 13909 (Prioritizing and Allocating Health and Medical Resources to Respond to the Spread of COVID–19), in which I delegated to the Secretary of Health and Human Services the prioritization and allocation authority under section 101 of the Act with respect to health and medical resources needed to respond to the spread of COVID–19. And on March 23, 2020, I issued Executive Order 13910 (Preventing Hoarding of Health and Medical Resources to Respond to the Spread of COVID–19), in which I delegated to the Secretary of Health and Human Services the authority under section 102 of the Act to combat hoarding and price gouging with respect to such resources.\n\nTo ensure that our healthcare systems are able to surge capacity and capability to respond to the spread of COVID–19, it is the policy of the United States to expand domestic production of health and medical resources needed to respond to the spread of COVID–19, including personal protective equipment and ventilators. Accordingly, I am delegating authority under title III of the Act to guarantee loans by private institutions, make loans, make provision for purchases and commitments to purchase, and take additional actions to create, maintain, protect, expand, and restore domestic industrial base capabilities to produce such resources. To enable greater cooperation among private businesses in expanding production of and distributing such resources, I am also delegating my authority under section 708(c) and (d) of the Act (50 U.S.C. 4558(c), (d)) to provide for the making of voluntary agreements and plans of action by the private sector.\n\nSec. 2. Delegation of Authority Under Title III of the Act. (a) Notwithstanding Executive Order 13603 of March 16, 2012 (National Defense Resources Preparedness), the Secretary of Health and Human Services and the Secretary of Homeland Security are each delegated, with respect to responding to the spread of COVID–19 within the United States, the authority of the President conferred by sections 301, 302, and 303 of the Act (50 U.S.C. 4531, 4532, and 4533), and the authority to implement the Act in subchapter III of chapter 55 of title 50, United States Code (50 U.S.C. 4554, 4555, 4556, and 4560).\n\n(b) The Secretary of Health and Human Services and the Secretary of Homeland Security may each use the authority under sections 301, 302, and 303 of the Act, in consultation with the Secretary of Defense and the heads of other executive departments and agencies as he deems appropriate, to respond to the spread of COVID–19.\n\n(c) To provide additional authority to respond to the national emergency I declared in Proclamation 9994, the requirements of section 301(a)(2), section 301(d)(1)(A), and section 303(a)(1) through (a)(6) of the Act are waived during the period of that national emergency.\n\n(d) To provide additional authority to respond to the national emergency I declared in Proclamation 9994, the Secretary of Health and Human Services and the Secretary of Homeland Security are each authorized to submit for my approval under section 302(d)(2)(B) of the Act a proposed determination that any specific loan is necessary to avert an industrial resource or critical technology shortfall that would severely impair national defense capability.\n\n(e) Before exercising the authority delegated under this section with respect to health or medical resources, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services.\n\nSec. 3. Delegation of Authority Under Title VII of the Act. (a) Notwithstanding Executive Order 13603, the Secretary of Health and Human Services and the Secretary of Homeland Security are each delegated, with respect to responding to the spread of COVID–19 within the United States, the authority of the President conferred by section 708(c)(1) and (d) of the Act. The Secretary of Health and Human Services shall provide to the Secretary of Homeland Security notice of any use of such delegated authority.\n\n(b) The delegation made in this section is made upon the condition that the Secretary of Health and Human Services or the Secretary of Homeland Security consult with the Attorney General and with the Federal Trade Commission, and obtain the prior approval of the Attorney General, after consultation by the Attorney General with the Federal Trade Commission, as required by section 708(c)(2) of the Act, except when such consultation is waived under subsection (c) of section 3 of this order and section 708(c)(3) of the Act.\n\n(c) The Secretary of Health and Human Services and the Secretary of Homeland Security are each authorized to submit for my approval under section 708(c)(3) of the Act any proposed determination that any specific voluntary agreement or plan of action is necessary to meet national defense requirements resulting from an event that degrades or destroys critical infrastructure.\n\n(d) Before exercising the authority delegated under this section with respect to health or medical resources, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services.\n\nSec. 4. Additional Delegations. (a) Notwithstanding Executive Order 13603, the Secretary of Health and Human Services and the Secretary of Homeland Security are each delegated, with respect to responding to the spread of COVID–19 within the United States, the authority of the President conferred by section 107 of the Act (50 U.S.C. 4517).\n\n(b) In addition to the delegations of authority in Executive Order 13909 and Executive Order 13910, the authority of the President conferred by sections 101 and 102 of the Act (50 U.S.C. 4511, 4512) is delegated to the Secretary of Homeland Security with respect to health and medical resources needed to respond to the spread of COVID–19 within the United States.\n\n(c) The Secretary of Homeland Security may use the authority under section 101 of the Act to determine, in consultation with the heads of other executive departments and agencies as appropriate, the proper nationwide priorities and allocation of health and medical resources, including by controlling the distribution of such materials (including applicable services) in the civilian market, for responding to the spread of COVID–19 within the United States.\n\n(d) Before exercising the authority under section 102 of the Act, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services.\n\n(e) The Secretary of Homeland Security shall periodically consider whether the designations made by him under section 102 of the Act pursuant to section 4(b) of this order remain necessary. Upon finding that such designation of material is no longer necessary, the Secretary of Homeland Security shall promptly publish a notice of withdrawal of the designation in the Federal Register, and in such other manner as he deems appropriate.\n\nSec. 5. Implementing Rules and Regulations. The Secretary of Health and Human Services and the Secretary of Homeland Security shall each adopt and revise appropriate rules and regulations as may be necessary to implement this order.\n\nSec. 6. Policy Coordination. The Assistant to the President for Trade and Manufacturing Policy shall serve as National Defense Production Act Policy Coordinator.\n\nSec. 7. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House, March 27, 2020.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Defense Production Act of 1950, as amended (50 U.S.C. 4501 et seq.) (the \"Act\"), the National Emergencies Act (50 U.S.C. 1601 et seq.), and section 301 of title 3, United States Code, it is hereby ordered as follows: Section 1. Policy. In Proclamation 9994 of
