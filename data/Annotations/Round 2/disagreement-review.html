to avert an industrial resource or critical technology shortfall that would severely impair national defense capability.","4":"(e) Before exercising the authority delegated under this section with respect to health or medical resources, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services. Sec. 3. Delegation of Authority Under Title VII of the Act. (a) Notwithstanding Executive Order 13603, the Secretary of Health and Human Services and the Secretary of Homeland Security are each delegated, with respect to responding to the spread of COVID–19 within the United States, the authority of the President conferred by section 708(c)(1) and (d) of the Act.","5":"The Secretary of Health and Human Services shall provide to the Secretary of Homeland Security notice of any use of such delegated authority. (b) The delegation made in this section is made upon the condition that the Secretary of Health and Human Services or the Secretary of Homeland Security consult with the Attorney General and with the Federal Trade Commission, and obtain the prior approval of the Attorney General, after consultation by the Attorney General with the Federal Trade Commission, as required by section 708(c)(2) of the Act, except when such consultation is waived under subsection (c) of section 3 of this order and section 708(c)(3) of the Act. (c) The Secretary of Health and Human Services and the Secretary of Homeland Security are each authorized to submit for my approval under section 708(c)(3) of the Act any proposed determination that any specific voluntary agreement or plan of action is necessary to meet national defense requirements resulting from an event that degrades or destroys critical infrastructure.","6":"(d) Before exercising the authority delegated under this section with respect to health or medical resources, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services. Sec. 4. Additional Delegations. (a) Notwithstanding Executive Order 13603, the Secretary of Health and Human Services and the Secretary of Homeland Security are each delegated, with respect to responding to the spread of COVID–19 within the United States, the authority of the President conferred by section 107 of the Act (50 U.S.C. 4517). (b) In addition to the delegations of authority in Executive Order 13909 and Executive Order 13910, the authority of the President conferred by sections 101 and 102 of the Act (50 U.S.C. 4511, 4512) is delegated to the Secretary of Homeland Security with respect to health and medical resources needed to respond to the spread of COVID–19 within the United States. (c) The Secretary of Homeland Security may use the authority under section 101 of the Act to determine, in consultation with the heads of other executive departments and agencies as appropriate, the proper nationwide priorities and allocation of health and medical resources, including by controlling the distribution of such materials (including applicable services) in the civilian market, for responding to the spread of COVID–19 within the United States.","7":"(d) Before exercising the authority under section 102 of the Act, the Secretary of Homeland Security shall consult with the Secretary of Health and Human Services. (e) The Secretary of Homeland Security shall periodically consider whether the designations made by him under section 102 of the Act pursuant to section 4(b) of this order remain necessary. Upon finding that such designation of material is no longer necessary, the Secretary of Homeland Security shall promptly publish a notice of withdrawal of the designation in the Federal Register, and in such other manner as he deems appropriate. Sec. 5. Implementing Rules and Regulations. The Secretary of Health and Human Services and the Secretary of Homeland Security shall each adopt and revise appropriate rules and regulations as may be necessary to implement this order. Sec. 6. Policy Coordination. The Assistant to the President for Trade and Manufacturing Policy shall serve as National Defense Production Act Policy Coordinator. Sec. 7. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO10":{"metadata":{"president":"Richard Nixon","date":"December 22, 1969","type":"executive_order"},"text":"By virtue of the authority vested in me by section 301 of title 3 of the United States Code, and as President of the United States, it is ordered as follows:\n\nSECTION 1. The following functions conferred upon the President by the Foreign Military Sales Act (P.L. 90-629), hereinafter referred to as the \"Act\", are hereby delegated as follows:\n\n(a) Those under section 3 (a) of the Act, with the exception of 3 (a) (1), to the Secretary of State.\n\n(b) Those under section 21 of the Act to the Secretary of Defense.\n\n(c) Those under section 22 of the Act to the Secretary of Defense.\n\n(d) That under section 23 of the Act to the Secretary of Defense.\n\n(e) Those under section 24 of the Act to the Secretary of Defense.\n\n(f) Those under section 34 of the Act to the Secretary of State. To the extent the standards and criteria for credit and guaranty transactions are based upon national security and financial policies, the Secretary of State shall obtain the prior concurrence of the Secretary of Defense and the Secretary of the Treasury, respectively.\n\n(g) Those under section 35 (a) of the Act to the Secretary of State.\n\n(h) Those under section 35 (b) of the Act to the Secretary of Defense.\n\n(i) That under section 42 (b) of the Act to the Secretary of Defense.\n\nSEC. 2. Nothing in this order shall be construed as modifying in any way the responsibility conferred upon the Secretary of State by section 2 (b) of the Act for the continuous supervision and general direction of sales under the Act, including, but not limited to, determining whether a sale should be negotiated, concluded, or terminated and the amount thereof.\n\nSEC. 3. In carrying out the functions delegated to them under this order, the Secretaries of State and Defense shall consult with the Secretary of the Treasury, the Administrator of the Agency for International Development, and the Director of the Arms Control and Disarmament Agency on matters pertaining to their responsibilities.\n\nSEC. 4. All functions conferred upon the President by the Act that are not delegated by the provisions of this order are hereby reserved to the President.\n\nSEC. 5. Funds appropriated to the President for carrying out the Act shall be deemed to be allocated to the Secretary of Defense without any further action of the President.\n\nSEC. 6. References in this order to the provisions of the Act shall be deemed to include references thereto, respectively, as amended from time to time.\n\nRICHARD NIXON\n\nThe White House\n\nDecember 22, 1969","chunks":{"1":"The following functions conferred upon the President by the Foreign Military Sales Act (P.L. 90-629), hereinafter referred to as the \"Act\", are hereby delegated as follows: (a) Those under section 3 (a) of the Act, with the exception of 3 (a) (1), to the Secretary of State. (b) Those under section 21 of the Act to the Secretary of Defense. (c) Those under section 22 of the Act to the Secretary of Defense. (d) That under section 23 of the Act to the Secretary of Defense. (e) Those under section 24 of the Act to the Secretary of Defense. (f) Those under section 34 of the Act to the Secretary of State. To the extent the standards and criteria for credit and guaranty transactions are based upon national security and financial policies, the Secretary of State shall obtain the prior concurrence of the Secretary of Defense and the Secretary of the Treasury, respectively. (g) Those under section 35 (a) of the Act to the Secretary of State. (h) Those under section 35 (b) of the Act to the Secretary of Defense. (i) That under section 42 (b) of the Act to the Secretary of Defense. SEC. 2. Nothing in this order shall be construed as modifying in any way the responsibility conferred upon the Secretary of State by section 2 (b) of the Act for the continuous supervision and general direction of sales under the Act, including, but not limited to, determining whether a sale should be negotiated, concluded, or terminated and the amount thereof. SEC. 3.","2":"In carrying out the functions delegated to them under this order, the Secretaries of State and Defense shall consult with the Secretary of the Treasury, the Administrator of the Agency for International Development, and the Director of the Arms Control and Disarmament Agency on matters pertaining to their responsibilities. SEC. 4.","3":"All functions conferred upon the President by the Act that are not delegated by the provisions of this order are hereby reserved to the President. SEC. 5. Funds appropriated to the President for carrying out the Act shall be deemed to be allocated to the Secretary of Defense without any further action of the President. SEC. 6. References in this order to the provisions of the Act shall be deemed to include references thereto, respectively, as amended from time to time."},"annotations":[{"directive":{"code":null,"diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO11":{"metadata":{"president":"Gerald R. Ford","date":"January 13, 1977","type":"executive_order"},"text":"By virtue of the authority vested in me by Section 3347 of Title 5 and Section 301 of Title 3 of the United States Code, and as President of the United States of America, it is hereby ordered as follows:\n\nSECTION 1. During any period when, by reason of absence, disability, or vacancy in office, both the Secretary of Agriculture and the Deputy Secretary of Agriculture are not available to exercise the powers or perform the duties of the Office of Secretary, the officers from the Department of Agriculture whose appointments are vested in the President, by and with the advice and consent of the Senate, shall act as Secretary in such order as the Secretary of Agriculture may from time to time prescribe. If no such order of succession is in effect at that time, then such officers shall act as Secretary in the descending order of rank, as established by the listing of their offices in Sections 5314, 5315 or 5316 of Title 5 of the United States Code and, at each level of the Executive Schedule, in the order in which they shall have taken oath as such officers.\n\nSEC. 2. Executive Order No. 11793 of July 10, 1974, is hereby revoked.\n\nGERALD R. FORD\n\nThe White House,\n\nJanuary 13, 1977.","chunks":{"1":"By virtue of the authority vested in me by Section 3347 of Title 5 and Section 301 of Title 3 of the United States Code, and as President of the United States of America, it is hereby ordered as follows: SECTION 1. During any period when, by reason of absence, disability, or vacancy in office, both the Secretary of Agriculture and the Deputy Secretary of Agriculture are not available to exercise the powers or perform the duties of the Office of Secretary, the officers from the Department of Agriculture whose appointments are vested in the President, by and with the advice and consent of the Senate, shall act as Secretary in such order as the Secretary of Agriculture may from time to time prescribe. If no such order of succession is in effect at that time, then such officers shall act as Secretary in the descending order of rank, as established by the listing of their offices in Sections 5314, 5315 or 5316 of Title 5 of the United States Code and, at each level of the Executive Schedule, in the order in which they shall have taken oath as such officers. SEC. 2.","2":"Executive Order No. 11793 of July 10, 1974, is hereby revoked."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO13":{"metadata":{"president":"Lyndon B. Johnson","date":"July 02, 1966","type":"executive_order"},"text":"WHEREAS since the days of the militia it has been the tradition of our Nation that we entrust its defense not just to a standing army but to all citizens; and\n\nWHEREAS it is appropriate that the laws by which Government calls its citizens to serve should be reviewed by distinguished citizens from different walks of life, not only in the light of military needs but also with a view to other national, community and individual needs:\n\nNow, THEREFORE, by virtue of the authority vested in me as President of the United States, it is ordered as follows:\n\nSECTION 1. Establishment of Commission.\n\n(a) There is hereby established a commission to be known as the National Advisory Commission on Selective Service (hereinafter termed the Commission).\n\n(b) The. Commission shall be composed of not more than twenty-five members who shall be designated by the President. The members shall be chosen with a view to their ability and experience, and shall be broadly representative of the various aspects of our national life. They shall serve at the pleasure of the President. The President shall designate one of the members of the Commission as Chairman.\n\nSECTION 2. Functions of the Commission.\n\n(a) The Commission shall consider the past, present and prospective functioning of selective service and other systems of national service in the light of the following factors:\n\n(1) Fairness to all citizens;\n\n(2) Military manpower requirements;\n\n(3) The objective of minimizing uncertainty and interference with individual careers and education;\n\n(4) Social, economic and employment conditions and goals;\n\n(5) Budgetary and administrative considerations; and\n\n(6) Any other factors that the Commission may deem relevant.\n\n(b) Based on its study, the Commission shall make recommendations concerning such matters as:\n\n(1) Methods of classification and selection of registrants;\n\n(2) Qualifications for military service;\n\n(3) Grounds for deferment and for exemption;\n\n(4) Procedures for appeal and protection of individual rights; and\n\n(5) Organization and administration of the selective service system at the national, state and local levels.\n\n(c) The Commission is also authorized to evaluate other proposals related to selective service, including proposals for national service.\n\n(d) The Commission shall make a final report to the President on or about January 1, 1967, setting forth its findings and recommendations, and including a statement concerning any proposed changes in applicable laws or in their administration.\n\nSECTION 3. Compensation and Personnel.\n\n(a) Each member of the Commission is authorized to receive such compensation as may be hereafter specified for each day spent in the work of the Commission pursuant to this order, together with travel expenses and per diem in lieu of subsistence expenses when away from his usual place of residence, as authorized by law (5 U.S.C. 55a; 5 U.S.C. 73b-2) for persons employed intermittently.\n\n(b) The Commission shall have an Executive Director, who shall be designated by the President and shall receive such compensation as may be hereafter specified.\n\nThe functions and duties of the Executive Director shall be prescribed by the Commission. The Commission is authorized to appoint and fix the compensation of such other personnel as may be necessary to enable it to carry out its functions. The Commission is authorized to obtain services in accordance with the provisions of section 15 of the Act of August 2, 1946 (5 U.S.C. 55a).\n\nSECTION 4. Cooperation by Federal Departments and Agencies.\n\nThe Commission is authorized to request from any department, agency, or independent instrumentality of the Federal Government any information deemed necessary to carry out its functions, under this order; and each department, agency, and instrumentality is authorized, to the extent permitted by law and within the limits of available funds, to furnish such information to the Commission.\n\nSECTION 5. Termination of the Commission.\n\nThe Commission shall terminate ninety days after the submission, pursuant to section 2 of this order, of its final report to the President.\n\nLYNDON B. JOHNSON\n\nThe White House\n\nJuly 2, 1966","chunks":{"1":"(a) There is hereby established a commission to be known as the National Advisory Commission on Selective Service (hereinafter termed the Commission). (b) The. Commission shall be composed of not more than twenty-five members who shall be designated by the President. The members shall be chosen with a view to their ability and experience, and shall be broadly representative of the various aspects of our national life. They shall serve at the pleasure of the President.","2":"The President shall designate one of the members of the Commission as Chairman. SECTION 2. Functions of the Commission. (a) The Commission shall consider the past, present and prospective functioning of selective service and other systems of national service in the light of the following factors: (1) Fairness to all citizens; (2) Military manpower requirements; (3) The objective of minimizing uncertainty and interference w ,"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO14":{"metadata":{"president":"George Bush","date":"June 04, 1991","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, and in order to facilitate the operation of the Advisory Commission on Conferences in Ocean Shipping (\"Commission\"), established by section 18 of the Shipping Act of 1984 (d)), it is hereby ordered that the Secretary of Transportation shall perform all of the President's functions under the Federal Advisory Committee Act, as amended (5 U.S.C. App.), that relate to the Commission, except that of receiving the Commission's report.\n\nGeorge Bush\n\nThe White House,\n\nJune 4, 1991.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, and in order to facilitate the operation of the Advisory Commission on Conferences in Ocean Shipping (\"Commission\"), established by section 18 of the Shipping Act of 1984 (d)), it is hereby ordered that the Secretary of Transportation","2":"shall perform all of the President's functions under the Federal Advisory Committee Act, as amended (5 U.S.C. App.), that relate to the Commission, except that of receiving the Commission's report."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":"Oder Action 1 seems to be vesting clause"},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"4","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO15":{"metadata":{"president":"Lyndon B. Johnson","date":"October 11, 1966","type":"executive_order"},"text":"By virtue of the authority vested in me as President of the United States and pursuant to Reorganization Plan No. 1 of 1958 (72 Stat. 1799), it is hereby ordered as follows:\n\nSECTION 1. Scope. (a) The Attorney General shall prepare national emergency plans and develop preparedness programs covering law-enforcement functions of concern to the executive branch of the Federal Government except to the extent that such functions are vested in other departments or agencies by statute or Executive order. Upon request, the Attorney General shall assist, as appropriate, in developing preparedness programs covering law-enforcement functions vested in other departments and agencies of the executive branch. He shall also provide, as appropriate, liaison with and guidance and assistance to the various divisions of State and local government, and maintain liaison with the Federal judicial system and the United States Congress as hereinafter set forth.\n\n(b) These plans and programs shall be designed to develop a state of readiness in these areas with respect to all conditions of national emergency, including an attack upon the United States.\n\nSEC. 2. Basic Functions. The Attorney General shall:\n\n(a) Emergency documents and measures. Provide advice, as appropriate, with respect to any emergency directive or procedure prepared by a department or agency as a part of its emergency preparedness function.\n\n(b) Industry support. As appropriate, review the legal procedures developed by the Federal agencies concerned to be instituted if it becomes necessary for the Government to institute extraordinary measures with respect to vital production facilities, public facilities, communications systems, transportation systems, or other facility, system, or service essential to national survival. 1455\n\n(c) Judicial and legislative liaison. In cooperation with the Office of Emergency Planning, maintain liaison with Federal courts and with the Congress so there will be mutual understanding of Federal emergency plans involving law enforcement and the exercise of legal powers during emergencies of various magnitudes.\n\n(d) Legal advice. Develop emergency plans for providing legal advice to the President, the Cabinet, and the heads of Executive departments and agencies wherever they may be located in an emergency, and provide emergency procedures for the review as to form and legality of Presidential proclamations, Executive orders, directives, regulations, and documents and of other documents requiring approval by the President or by the Attorney General which may be issued by authorized officers after an armed attack.\n\n(e) Alien control and control of entry and departure. Develop emergency plans for the control of alien enemies and other aliens within the United States and, in consultation with the Department of the Treasury, develop emergency plans for the control of persons attempting to enter or leave the United States. These plans shall specifically include provisions for the following:\n\n(1) The location, restraint, or custody of alien enemies.\n\n(2) Temporary detention of alien enemies and other persons attempting to enter the United States pending determination of their admissibility.\n\n(3) Apprehension of deserting alien crewmen and stowaways.\n\n(4) Investigation and control of aliens admitted as contract laborers.\n\n(5) Control of persons entering or departing from the United States at designated ports of entry.\n\n(6) Increased surveillance of the borders to preclude prohibited crossings by persons.\n\n(f) Alien property. Develop emergency plans for the seizure and administration of property of alien enemies under provisions of the Trading with the Enemy Act.\n\n(g) Security standards. In consultation with the Department of Defense and with other executive agencies to the extent appropriate, prepare plans for adjustment of security standards governing the employment of Federal personnel and Federal contractors in an emergency.\n\n(h) Research. Within the framework of overall Federal research objectives, supervise or conduct research in areas directly concerned with carrying out emergency preparedness responsibilities, designate representatives for necessary ad hoc or task-force groups, and provide advice and assistance to other agencies in planning for research in areas involving the interests of the Department of Justice.\n\nSEC. 3. Civil Defense. In consonance with national civil defense programs developed by the Department of Defense, the Attorney General shall:\n\n(a) Local law enforcement. Upon request, consult with and assist the Department of Defense to plan, develop, and distribute materials for use in the instruction and training of law-enforcement personnel for civil defense emergency operations; develop and carry out a national plan for civil defense instruction and training for enforcement officers, designed to utilize to the maximum extent practicable the resources and facilities of existing Federal, State, and local police schools, academies, and other appropriate institutions of learning; and assist the States in preparing for the conduct of intrastate and interstate law-enforcement operations to meet the extraordinary needs that would exist for emergency police services under conditions of attack or imminent attack.\n\n(b) Penal and correctional institutions. Develop emergency plans and procedures for the custody and protection of prisoners and the use of Federal penal and correctional institutional resources, when available, for cooperation with local authorities in connection with mass feeding and housing, for the storage of standby emergency equipment, for the emergency use of prison hospitals and laboratory facilities, for the continued availability of prison-industry products, and for the development of Federal prisoner skills to appropriately augment the total supply of manpower; advise States and their political subdivisions regarding the use of State and local prisons, jails, and prisoners for the purpose of relieving local situations and conditions arising from a state of emergency.\n\n(c) Identification and location of persons. Develop emergency plans and procedures for the use of the facilities and personnel of the Department of Justice in assisting the Department of Health, Education, and Welfare with the development of plans and procedures for the identification of the dead and the reuniting of families during a civil defense emergency.\n\nSEC. 4. Interagency Cooperation. Unless otherwise provided in this order, the Attorney General shall assume the initiative in developing joint plans for emergency preparedness functions described in this order in consultation with those departments and agencies which have responsibilities for any segment of such activities.\n\nSEC. 5. Presidential Coordination. The Director of the Office of Emergency Planning shall advise and assist the President in determining policy for, and assist him in coordinating the performance of, functions under this order with the total national preparedness program.\n\nSEC. 6. Emergency Planning. Emergency plans and programs shall be developed as an integral part of the continuing activities of the Department of Justice on the basis that it will have the responsibility for carrying out such programs during an emergency. The Attorney General shall be prepared to implement all appropriate plans developed under this order. Modifications, based on emergency conditions, will be in accordance with policy determinations by the President.\n\nSEC. 7. Emergency Actions. Nothing in this order shall be construed as conferring authority under Title III of the Federal Civil Defense Act of 1950, as amended (50 U.S.C. App. 2291-2297), or otherwise, to put into effect any emergency plan, procedure, policy, program, or course of action prepared or developed pursuant to this order. Such authority is reserved to the President.\n\nSEC. 8. Redelegation. The Attorney General is hereby authorized to redelegate within the Department of Justice the functions hereinabove assigned to him.\n\nSEC. 9. Construction. Nothing in this order shall be deemed to derogate from any now-existing assignment of functions to any Executive agency or officer made by statute or by Executive order.\n\nSEC. 10. General. To the extent of any inconsistency between the provisions of any prior order and the provisions of this order, the latter shall control.\n\nLYNDON B. JOHNSON\n\nThe White House,\n\nOctober 11, 1966.","chunks":{"1":"(a) The Attorney General shall prepare national emergency plans and develop preparedness programs covering law-enforcement functions of concern to the executive branch of the Federal Government except to the extent that such functions are vested in other departments or agencies by statute or Executive order.","2":"Upon request, the Attorney General shall assist, as appropriate, in developing preparedness programs covering law-enforcement functions vested in other departments and agencies of the executive branch. He shall also provide, as appropriate, liaison with and guidance and assistance to the various divisions of State and local government, and maintain liaison with the Federal judicial system and the United States Congress as hereinafter set forth. (b) These plans and programs shall be designed to develop a state of readiness in these areas with respect to all conditions of national emergency, including an attack upon the United States. SEC. 2. Basic Functions. The Attorney General shall: (a) Emergency documents and measures. Provide advice, as appropriate, with respect to any emergency directive or procedure prepared by a department or agency as a part of its emergency preparedness function. (b) Industry support. As appropriate, review the legal procedures developed by the Federal agencies concerned to be instituted if it becomes necessary for the Government to institute extraordinary measures with respect to vital production facilities, public facilities, communications systems, transportation systems, or other facility, system, or service essential to national survival. 1455 (c) Judicial and legislative liaison. In cooperation with the Office of Emergency Planning, maintain liaison with Federal courts and with the Congress so there will be mutual understanding of Federal emergency plans involving law enforcement and the exercise of legal powers during emergencies of various magnitudes. (d) Legal advice. Develop emergency plans for providing legal advice to the President, the Cabinet, and the heads of Executive departments and agencies wherever they may be located in an emergency, and provide emergency procedures for the review as to form and legality of Presidential proclamations, Executive orders, directives, regulations, and documents and of other documents requiring approval by the President or by the Attorney General which may be issued by authorized officers after an armed attack. (e) Alien control and control of entry and departure. Develop emergency plans for the control of alien enemies and other aliens within the United States and, in consultation with the Department of the Treasury, develop emergency plans for the control of persons attempting to enter or leave the United States. These plans shall specifically include provisions for the following: (1) The location, restraint, or custody of alien enemies. (2) Temporary detention of alien enemies and other persons attempting to enter the United States pending determination of their admissibility. (3) Apprehension of deserting alien crewmen and stowaways. (4) Investigation and control of aliens admitted as contract laborers. (5) Control of persons entering or departing from the United States at designated ports of entry. (6) Increased surveillance of the borders to preclude prohibited crossings by persons. (f) Alien property. Develop emergency plans for the seizure and administration of property of alien enemies under provisions of the Trading with the Enemy Act. (g) Security standards. In consultation with the Department of Defense and with other executive agencies to the extent appropriate, prepare plans for adjustment of security standards governing the employment of Federal personnel and Federal contractors in an emergency. (h) Research. Within the framework of overall Federal research objectives, supervise or conduct research in areas directly concerned with carrying out emergency preparedness responsibilities, designate representatives for necessary ad hoc or task-force groups, and provide advice and assistance to other agencies in planning for research in areas involving the interests of the Department of Justice. SEC. 3. Civil Defense. In consonance with national civil defense programs developed by the Department of Defense, the Attorney General shall: (a) Local law enforcement. Upon request, consult with and assist the Department of Defense to plan, develop, and distribute materials for use in the instruction and training of law-enforcement personnel for civil defense emergency operations; develop and carry out a national plan for civil defense instruction and training for enforcement officers, designed to utilize to the maximum extent practicable the resources and facilities of existing Federal, State, and local police schools, academies, and other appropriate institutions of learning; and assist the States in preparing for the conduct of intrastate and interstate law-enforcement operations to meet the extraordinary needs that would exist for emergency police services under conditions of attack or imminent attack. (b) Penal and correctional institutions. Develop emergency plans and procedures for the custody and protection of prisoners and the use of Federal penal and correctional institutional resources, when available, for cooperation with local authorities in connection with mass feeding and housing, for the storage of standby emergency equipment, for the emergency use of prison hospitals and laboratory facilities, for the continued availability of prison-industry products, and for the development of Federal prisoner skills to appropriately augment the total supply of manpower; advise States and their political subdivisions regarding the use of State and local prisons, jails, and prisoners for the purpose of relieving local situations and conditions arising from a state of emergency. (c) Identification and location of persons. Develop emergency plans and procedures for the use of the facilities and personnel of the Department of Justice in assisting the Department of Health, Education, and Welfare with the development of plans and procedures for the identification of the dead and the reuniting of families during a civil defense emergency. SEC. 4. Interagency Cooperation. Unless otherwise provided in this order, the Attorney General shall assume the initiative in developing joint plans for emergency preparedness functions described in this order in consultation with those departments and agencies which have responsibilities for any segment of such activities. SEC. 5. Presidential Coordination. The Director of the Office of Emergency Planning shall advise and assist the President in determining policy for, and assist him in coordinating the performance of, functions under this order with the total national preparedness program. SEC. 6. Emergency Planning. Emergency plans and programs shall be developed as an integral part of the continuing activities of the Department of Justice on the basis that it will have the responsibility for carrying out such programs during an emergency. The Attorney General shall be prepared to implement all appropriate plans developed under this order. Modifications, based on emergency conditions, will be in accordance with policy determinations by the President. SEC. 7. Emergency Actions. Nothing in this order shall be construed as conferring authority under Title III of the Federal Civil Defense Act of 1950, as amended (50 U.S.C. App. 2291-2297), or otherwise, to put into effect any emergency plan, procedure, policy, program, or course of action prepared or developed pursuant to this order. Such authority is reserved to the President. SEC. 8. Redelegation.","3":"The Attorney General is hereby authorized to redelegate within the Department of Justice the functions hereinabove assigned to him. SEC. 9. Construction. Nothing in this order shall be deemed to derogate from any now-existing assignment of functions to any Executive agency or officer made by statute or by Executive order. SEC. 10. General. To the extent of any inconsistency between the provisions of any prior order and the provisions of this order, the latter shall control."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO16":{"metadata":{"president":"Barack Obama","date":"July 06, 2012","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nSection 1. Policy. The Federal Government must have the ability to communicate at all times and under all circumstances to carry out its most critical and time sensitive missions. Survivable, resilient, enduring, and effective communications, both domestic and international, are essential to enable the executive branch to communicate within itself and with: the legislative and judicial branches; State, local, territorial, and tribal governments; private sector entities; and the public, allies, and other nations. Such communications must be possible under all circumstances to ensure national security, effectively manage emergencies, and improve national resilience. The views of all levels of government, the private and nonprofit sectors, and the public must inform the development of national security and emergency preparedness (NS/EP) communications policies, programs, and capabilities.\n\nSec. 2. Executive Office Responsibilities.\n\nSec. 2.1. Policy coordination, guidance, dispute resolution, and periodic in-progress reviews for the functions described and assigned herein shall be provided through the interagency process established in Presidential Policy Directive-1 of February 13, 2009 (Organization of the National Security Council System) (PPD-1).\n\nSec. 2.2. The Director of the Office of Science and Technology Policy (OSTP) shall: (a) issue an annual memorandum to the NS/EP Communications Executive Committee (established in section 3 of this order) highlighting national priorities for Executive Committee analyses, studies, research, and development regarding NS/EP communications;\n\n(b) advise the President on the prioritization of radio spectrum and wired communications that support NS/EP functions; and\n\n(c) have access to all appropriate information related to the test, exercise, evaluation, and readiness of the capabilities of all existing and planned NS/EP communications systems, networks, and facilities to meet all executive branch NS/EP requirements.\n\nSec. 2.3. The Assistant to the President for Homeland Security and Counterterrorism and the Director of OSTP shall make recommendations to the President, informed by the interagency policy process established in PPD-1, with respect to the exercise of authorities assigned to the President under section 706 of the Communications Act of 1934, as amended (47 U.S.C. 606). The Assistant to the President for Homeland Security and Counterterrorism and the Director of OSTP shall also jointly monitor the exercise of these authorities, in the event of any delegation, through the process established in PPD-1 or as the President otherwise may direct.\n\nSec. 3. The NS/EP Communications Executive Committee.\n\nSec. 3.1. There is established an NS/EP Communications Executive Committee (Executive Committee) to serve as a forum to address NS/EP communications matters.\n\nSec. 3.2. The Executive Committee shall be composed of Assistant Secretary-level or equivalent representatives designated by the heads of the Departments of State, Defense, Justice, Commerce, and Homeland Security, the Office of the Director of National Intelligence (DNI), the General Services Administration, and the Federal Communications Commission, as well as such additional agencies as the Executive Committee may designate. The designees of the Secretary of Homeland Security and the Secretary of Defense shall serve as Co-Chairs of the Executive Committee.\n\nSec. 3.3. The responsibilities of the Executive Committee shall be to: (a) advise and make policy recommendations to the President, through the PPD-1 process, on enhancing the survivability, resilience, and future architecture of NS/EP communications, including what should constitute NS/EP communications requirements;\n\n(b) develop a long-term strategic vision for NS/EP communications and propose funding requirements and plans to the President and the Director of the Office of Management and Budget (OMB), through the PPD-1 process, for NS/EP communications initiatives that benefit multiple agencies or other Federal entities;\n\n(c) coordinate the planning for, and provision of, NS/EP communications for the Federal Government under all hazards;\n\n(d) promote the incorporation of the optimal combination of hardness, redundancy, mobility, connectivity, interoperability, restorability, and security to obtain, to the maximum extent practicable, the survivability of NS/EP communications under all circumstances;\n\n(e) recommend to the President, through the PPD-1 process, the regimes to test, exercise, and evaluate the capabilities of existing and planned communications systems, networks, or facilities to meet all executive branch NS/EP communications requirements, including any recommended remedial actions;\n\n(f) provide quarterly updates to the Assistant to the President for Homeland Security and Counterterrorism and the Director of OSTP, through the Co-Chairs, on the status of Executive Committee activities and develop an annual NS/EP communications strategic agenda utilizing the PPD-1 process;\n\n(g) enable industry input with respect to the responsibilities established in this section; and\n\n(h) develop, approve, and maintain a charter for the Executive Committee.\n\nSec. 4. Executive Committee Joint Program Office.\n\nSec. 4.1. The Secretary of Homeland Security shall establish an Executive Committee Joint Program Office (JPO) to provide full-time, expert, and administrative support for the Executive Committee's performance of its responsibilities under section 3.3 of this order. Staff of the JPO shall include detailees, as needed and appropriate, from agencies represented on the Executive Committee. The Department of Homeland Security shall provide resources to support the JPO. The JPO shall be responsive to the guidance of the Executive Committee.\n\nSec. 4.2. The responsibilities of the JPO shall include: coordination of programs that support NS/EP missions, priorities, goals, and policy; and, when directed by the Executive Committee, the convening of governmental and nongovernmental groups (consistent with the Federal Advisory Committees Act, as amended (5 U.S.C. App.)), coordination of activities, and development of policies for senior official review and approval.\n\nSec. 5. Specific Department and Agency Responsibilities.\n\nSec. 5.1. The Secretary of Defense shall: (a) oversee the development, testing, implementation, and sustainment of NS/EP communications that are directly responsive to the national security needs of the President, Vice President, and senior national leadership, including: communications with or among the President, Vice President, White House staff, heads of state and government, and Nuclear Command and Control leadership; Continuity of Government communications; and communications among the executive, judicial, and legislative branches to support Enduring Constitutional Government;\n\n(b) incorporate, integrate, and ensure interoperability and the optimal combination of hardness, redundancy, mobility, connectivity, interoperability, restorability, and security to obtain, to the maximum extent practicable, the survivability of NS/EP communications defined in section 5.1(a) of this order under all circumstances, including conditions of crisis or emergency;\n\n(c) provide to the Executive Committee the technical support necessary to develop and maintain plans adequate to provide for the security and protection of NS/EP communications; and\n\n(d) provide, operate, and maintain communication services and facilities adequate to execute responsibilities consistent with Executive Order 12333 of December 4, 1981, as amended.\n\nSec. 5.2. The Secretary of Homeland Security shall: (a) oversee the development, testing, implementation, and sustainment of NS/EP communications, including: communications that support Continuity of Government; Federal, State, local, territorial, and tribal emergency preparedness and response communications; non-military executive branch communications systems; critical infrastructure protection networks; and non-military communications networks, particularly with respect to prioritization and restoration;\n\n(b) incorporate, integrate, and ensure interoperability and the necessary combination of hardness, redundancy, mobility, connectivity, interoperability, restorability, and security to obtain, to the maximum extent practicable, the survivability of NS/EP communications defined in section 5.2(a) of this order under all circumstances, including conditions of crisis or emergency;\n\n(c) provide to the Executive Committee the technical support necessary to develop and maintain plans adequate to provide for the security and protection of NS/EP communications;\n\n(d) receive, integrate, and disseminate NS/EP communications information to the Federal Government and State, local, territorial, and tribal governments, as appropriate, to establish situational awareness, priority setting recommendations, and a common operating picture for NS/EP communications information;\n\n(e) satisfy priority communications requirements through the use of commercial, Government, and privately owned communications resources, when appropriate;\n\n(f) maintain a joint industry-Government center that is capable of assisting in the initiation, coordination, restoration, and reconstitution of NS/EP communications services or facilities under all conditions of emerging threats, crisis, or emergency;\n\n(g) serve as the Federal lead for the prioritized restoration of communications infrastructure and coordinate the prioritization and restoration of communications, including resolution of any conflicts in or among priorities, in coordination with the Secretary of Defense when activities referenced in section 5.1(a) of this order are impacted, consistent with the National Response Framework. If conflicts in or among priorities cannot be resolved between the Departments of Defense and Homeland Security, they shall be referred for resolution in accordance with section 2.1 of this order; and\n\n(h) within 60 days of the date of this order, in consultation with the Executive Committee where appropriate, develop and submit to the President, through the Assistant to the President for Homeland Security and Counterterrorism, a detailed plan that describes the Department of Homeland Security's organization and management structure for its NS/EP communications functions, including the Government Emergency Telecommunications Service, Wireless Priority Service, Telecommunications Service Priority program, Next Generation Network Priority program, the Executive Committee JPO, and relevant supporting entities.\n\nSec. 5.3. The Secretary of Commerce shall: (a) provide advice and guidance to the Executive Committee on the use of technical standards and metrics to support execution of NS/EP communications;\n\n(b) identify for the Executive Committee requirements for additional technical standards and metrics to enhance NS/EP communications;\n\n(c) engage with relevant standards development organizations to develop appropriate technical standards and metrics to enhance NS/EP communications;\n\n(d) develop plans and procedures concerning radio spectrum allocations, assignments, and priorities for use by agencies and executive offices;\n\n(e) develop, maintain, and publish policies, plans, and procedures for the management and use of radio frequency assignments, including the authority to amend, modify, or revoke such assignments, in those parts of the electromagnetic spectrum assigned to the Federal Government; and\n\n(f) administer a system of radio spectrum priorities for those spectrum-dependent telecommunications resources belonging to and operated by the Federal Government and certify or approve such radio spectrum priorities, including the resolution of conflicts in or among such radio spectrum priorities during a crisis or emergency.\n\nSec. 5.4. The Administrator of General Services shall provide and maintain a common Federal acquisition approach that allows for the efficient centralized purchasing of equipment and services that meet NS/EP communications requirements. Nothing in this section shall be construed to impair or otherwise affect the procurement authorities granted by law to an agency or the head thereof.\n\nSec. 5.5. With respect to the Intelligence Community, the DNI, after consultation with the heads of affected agencies, may issue such policy directives and guidance as the DNI deems necessary to implement this order. Procedures or other guidance issued by the heads of elements of the Intelligence Community shall be in accordance with such policy directives or guidelines issued by the DNI.\n\nSec. 5.6. The Federal Communications Commission performs such functions as are required by law, including: (a) with respect to all entities licensed or regulated by the Federal Communications Commission: the extension, discontinuance, or reduction of common carrier facilities or services; the control of common carrier rates, charges, practices, and classifications; the construction, authorization, activation, deactivation, or closing of radio stations, services, and facilities; the assignment of radio frequencies to Federal Communications Commission licensees; the investigation of violations of pertinent law; and the assessment of communications service provider emergency needs and resources; and\n\n(b) supporting the continuous operation and restoration of critical communications systems and services by assisting the Secretary of Homeland Security with infrastructure damage assessment and restoration, and by providing the Secretary of Homeland Security with information collected by the Federal Communications Commission on communications infrastructure, service outages, and restoration, as appropriate.\n\nSec. 6. General Agency Responsibilities. All agencies, to the extent consistent with law, shall: (a) determine the scope of their NS/EP communications requirements, and provide information regarding such requirements to the Executive Committee;\n\n(b) prepare policies, plans, and procedures concerning communications facilities, services, or equipment under their management or operational control to maximize their capability to respond to the NS/EP needs of the Federal Government;\n\n(c) propose initiatives, where possible, that may benefit multiple agencies or other Federal entities;\n\n(d) administer programs that support broad NS/EP communications goals and policies;\n\n(e) submit reports annually, or as otherwise requested, to the Executive Committee, regarding agency NS/EP communications activities;\n\n(f) devise internal acquisition strategies in support of the centralized acquisition approach provided by the General Services Administration pursuant to section 5.4 of this order; and\n\n(g) provide the Secretary of Homeland Security with timely reporting on NS/EP communications status to inform the common operating picture required under 6 U.S.C. 321(d).\n\nSec. 7. General Provisions. (a) For the purposes of this order, the word \"agency\" shall have the meaning set forth in section 6.1(b) of Executive Order 13526 of December 29, 2009.\n\n(b) Executive Order 12472 of April 3, 1984, as amended, is hereby revoked.\n\n(c) Executive Order 12382 of September 13, 1982, as amended, is further amended by striking the following language from section 2(e): \"in his capacity as Executive Agent for the National Communications System\".\n\n(d) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an agency, or the head thereof; or\n\n(ii) the functions of the Director of the OMB relating to budgetary, administrative, or legislative proposals.\n\n(e) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(f) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nBARACK OBAMA\n\nThe White House,\n\nJuly 6, 2012.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows: Section 1. Policy. The Federal Government must have the ability to communicate at all times and under all circumstances to carry out its most critical and time sensitive missions. Survivable, resilient, enduring, and effective communications, both domestic and international, are essential to enable the executive branch to communicate within itself and with: the legislative and judicial branches; State, local, territorial, and tribal governments; private sector entities; and the public, allies, and other nations. Such communications must be possible under all circumstances to ensure national security, effectively manage emergencies, and improve national resilience. The views of all levels of government, the private and nonprofit sectors, and the public must inform the development of national security and emergency preparedness (NS/EP) communications policies, programs, and capabilities. Sec. 2. Executive Office Responsibilities. Sec. 2.1. Policy coordination, guidance, dispute resolution, and periodic in-progress reviews for the functions described and assigned herein shall be provided through the interagency process established in Presidential Policy Directive-1 of February 13, 2009 (Organization of the National Security Council System) (PPD-1). Sec. 2.2. The Director of the Office of Science and Technology Policy (OSTP) shall: (a) issue an annual memorandum to the NS/EP Communications Executive Committee (established in section 3 of this order) highlighting national priorities for Executive Committee ibilities consistent with Executive Order 12333 of December 4, 1981, as amended. Sec. 5.2. The Secretary of Homeland Security shall: (a) oversee the development, testing, implementation, and sustainment of NS/EP communications, including: communications that support Continuity of Government; Federal, State, local, territorial, and tribal emergency preparedness and response communications; non-military executive branch communications systems; critical infrastructure protection networks; and non-military communications networks, particularly with respect to prioritization and restoration; (b) incorporate, integrate, and ensure interoperability and the necessary combination of hardness, redundancy, mobility, connectivity, interoperability, restorability, and security to obtain, to the maximum extent practicable, the survivability of NS/EP communications defined in section 5.2(a) of this order under all circumstances, including conditions of crisis or emergency; (c) provide to the Executive Committee the technical support necessary to develop and maintain plans adequate to provide for the security and protection of NS/EP communications; (d) receive, integrate, and disseminate NS/EP communications information to the Federal Government and State, local, territorial, and tribal governments, as appropriate, to establish situational awareness, priority setting recommendations, and a common operating picture for NS/EP communications information; (e) satisfy priority communications requirements through the use of commercial, Government, and privately owned communications resources, when appropriate; (f) maintain a joint industry-Government center that is capable of assisting in the initiation, coordination, restoration, and reconstitution of NS/EP communications services or facilities under all conditions of emerging threats, crisis, or emergency; (g) serve as the Federal lead for the prioritized restoration of communications infrastructure and coordinate the prioritization and restoration of communications, including resolution of any conflicts in or among priorities, in coordination with the Secretary of Defense when activities referenced in section 5.1(a) of this order are impacted, consistent with the National Response Framework. If conflicts in or among priorities cannot be resolved between the Departments of Defense and Homeland Security, they shall be referred for resolution in accordance with section 2.1 of this order; and (h) within 60 days of the date of this order, in consultation with the Executive Committee where appropriate, develop and submit to the President, through the Assistant to the President for Homeland Security and Counterterrorism, a detailed plan that describes the Department of Homeland Security's organization and management structure for its NS/EP communications functions, including the Government Emergency Telecommunications Service, Wireless Priority Service, Telecommunications Service Priority program, Next Generation Network Priority program, the Executive Committee JPO, and relevant supporting entities. Sec. 5.3. The Secretary of Commerce shall: (a) provide advice and guidance to the Executive Committee on the use of technical standards and metrics to support execution of NS/EP communications; (b) identify for the Executive Committee requirements for additional technical standards and metrics to enhance NS/EP communications; (c) engage with relevant standards development organizations to develop appropriate technical standards and metrics to enhance NS/EP communications; (d) develop plans and procedures concerning radio spectrum allocations, assignments, and priorities for use by agencies and executive offices; (e) develop, maintain, and publish policies, plans, and procedures for the management and use of radio frequency assignments, including the authority to amend, modify, or revoke such assignments, in those parts of the electromagnetic spectrum assigned to the Federal Government; and (f) administer a system of radio spectrum priorities for those spectrum-dependent telecommunications resources belonging to and operated by the Federal Government and certify or approve such radio spectrum priorities, including the resolution of conflicts in or among such radio spectrum priorities during a crisis or emergency.","5":"(b) Executive Order 12472 of April 3, 1984, as amended, is hereby revoked. (c) Executive Order 12382 of September 13, 1982, as amended, is further amended by striking the following language from section 2(e): \"in his capacity as Executive Agent for the National Communications System\". (d) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an agency, or the head thereof; or (ii) the functions of the Director of the OMB relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO17":{"metadata":{"president":"Dwight D. Eisenhower","date":"April 17, 1953","type":"executive_order"},"text":"By virtue of the authority vested in me by section 532 of the Mutual Security Act of 1951, as added by section 7 (m) of the Mutual Security Act of 1952 (Public Law 400, approved June 20, 1952, 66 Stat. 146), it is hereby determined that the performance of functions with respect to the escapee program, authorized by the Mutual Security Act of 1951, as amended, and administered by the Department of State, without regard to the three following-designated provisions of law will further the purposes of the said Mutual Security Act of 1951, as amended:\n\n1. Section 3648 of the Revised Statutes, as amended, 60 Stat. 809 (31 U.S.C. 529).\n\n2. Section 305 of the Federal Property and Administrative Services Act of 1949, approved June 30, 1949, ch. 288, 63 Stat. 396 (41 U.S.C. 255).\n\n3. Section 3709 of the Revised Statutes, as amended (41 U.S.C. 5).\n\nThis order supersedes Executive Order No. 10410 of November 14, 1952. entitled \"Specification of Laws from which the Escapee Program Administered by the Department of State Shall be Exempt.\"\n\nDWIGHT D. EISENHOWER\n\nTHE WHITE HOUSE,\n\nApril 17, 1953.","chunks":{"1":"By virtue of the authority vested in me by section 532 of the Mutual Security Act of 1951, as added by section 7 (m) of the Mutual Security Act of 1952 (Public Law 400, approved June 20, 1952, 66 Stat. 146), it is hereby determined that the performance of functions with respect to the escapee program, authorized by the Mutual Security Act of 1951, as amended, and administered by the Department of State, without regard to the three following-designated provisions of law will further the purposes of the said Mutual Security Act of 1951, as amended: 1. Section 3648 of the Revised Statutes, as amended, 60 Stat. 809 (31 U.S.C. 529). 2. Section 305 of the Federal Property and Administrative Services Act of 1949, approved June 30, 1949, ch. 288, 63 Stat. 396 (41 U.S.C. 255). 3. Section 3709 of the Revised Statutes, as amended (41 U.S.C. 5). This order supersedes Executive Order No. 10410 of November 14, 1952. entitled \"Specification of Laws from which the Escapee Program Administered by the Department of State Shall be Exempt.\""},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO18":{"metadata":{"president":"Ronald Reagan","date":"April 29, 1985","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and laws of the United States of America, including the Federal Advisory Committee Act, as amended (5 U.S.C. App. II), and in order to establish an advisory committee to recommend initiatives by which the private and public sectors may cooperate in promoting the safety of children, it is hereby ordered as follows:\n\nSection 1. Establishment. (a) There is established the President's Child Safety Partnership.\n\n(b) The Partnership shall be composed of not more than 26 members designated or appointed by the President from among citizens of the United States, and shall include the Attorney General, the Secretary of Health and Human Services, and the Secretary of Education. The President shall designate a Chairman from among the members of the Partnership.\n\nSec. 2. Functions. (a) The Partnership shall examine issues and make recommendations to the President on preventing the victimization and promoting the safety of children in the United States.\n\n(b) The Partnership may conduct such studies, inquiries, hearings, and meetings as may be necessary to carry out its functions. The focus of the Partnership's inquiries and reports shall be on recommendations for public-private cooperation to encourage and facilitate private sector involvement in child safety efforts, including activities appropriate for action by service organizations, schools, businesses, charitable organizations, and public safety organizations.\n\n(c) The Partnership shall report to the President from time to time as requested and shall submit its final report by April 29, 1987.\n\nSec. 3. Administration. (a) The heads of Executive agencies shall, to the extent permitted by law, provide the Partnership such information as it may require to carry out its functions.\n\n(b) Members of the partnership shall serve without compensation for their work on the Partnership. However, members appointed from among private citizens, including employees from State and local government, may, subject to the availability of funds, be allowed travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the government service (5 U.S.C. 5701-5707).\n\n(c) The Attorney General shall, to the extent permitted by law, provide the Partnership with such administrative services, funds, facilities, staff, and other support services as may be necessary for the performance of its functions.\n\nSec. 4. General. (a) The Departments of Justice, Health and Human Services, and Education are directed to join with the Partnership to encourage the development of public/private sector initiatives to prevent and respond to the victimization of children.\n\n(b) Notwithstanding any other Executive order, the functions of the President under the Federal Advisory Committee Act, as amended, except that of reporting to the Congress, which are applicable to the Partnership, shall be performed by the Attorney General, in accordance with guidelines and procedures established by the Administrator of General Services.\n\n(c) The Partnership shall terminate on April 29, 1987, or 60 days after submitting its final report, whichever is earlier.\
