pecify by regulation, without adversely affecting the national security;\n\n6. that Canadian crude oil may be imported into the United States from Canada to be topped for use as burner fuel under such conditions as the Secretary may specify by regulation, without adversely affecting the national security; and\n\n7. that crude oil may, without regard to its viscosity, be imported for use as burner fuel, under the same conditions and restrictions as now apply to residual fuel oil imported for use as fuel, without adversely affecting the national security.\n\nThe Director has recommended, with the advice of the Oil Policy Committee, that Proclamation No. 3279, as amended, be amended to adjust imports in conformity with these findings.\n\nI accept these findings and deem it necessary and consistent with the security objectives of Proclamation No. 3279, as amended, to adjust imports as hereinafter provided.\n\nNow, Therefore, I, Richard Nixon, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and statutes, including section 232 of the Trade Expansion Act of 1962, do hereby proclaim that, effective immediately:\n\n(1) Clause (ii) of the last sentence of subparagraph (1) of paragraph (a) of Section 2 of Proclamation No. 3279 of March 10, 1959, as added by Proclamation No. 3990 of June 17, 1970, is amended by striking \"December 31, 1970\", and inserting in lieu thereof \"December 31, 1971\";\n\n(2) Section 1A of Proclamation No. 3279, as added by Proclamation No. 3969 of March 10, 1970, is amended by adding four new subsections as follows:\n\n\"(d) Any crude oil, unfinished oils, or finished products that may otherwise be transported into the United States from Canada under the provisions of this proclamation, may also be transported into the United States by vessel, as defined in 1 U.S.C. 3, so long as such transportation involves only waterways (other than ocean waterways) in or between the United States and Canada.\n\n\"(e) On and after October 1, 1970, any natural gas liquids, as defined in subparagraph (1) of paragraph (a) of Section 2 of this proclamation, derived solely from Canadian natural gas, may be transported other than by sea into the United States from Canada without license and without reducing the quantities of crude oil, unfinished oils, or finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 of this proclamation.\n\n\"(f) On or after October 1, 1970, ethane, propane and butane produced in the Western Hemisphere from Western Hemisphere crude or gas may be imported into the United States without reducing the quantities of crude oil, unfinished oils and finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 of this proclamation.\n\n\"(g) Crude oil may be imported into District I to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. Crude oil may be imported into the United States from Canada to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. The quantities of crude oil, unfinished oils, and finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 shall not be reduced by reason of imports of crude oil used as fuel under this paragraph (g).\"\n\n(3) Subparagraph (7) of paragraph (g) of Section 9 of Proclamation No. 3279 is amended to read as follows:\n\n\"(7) residual fuel oil—(i) topped crude oil or viscous residuum which has a viscosity of not less than 45 seconds Saybolt universal 100°F. and (ii) crude oil which is to be used as fuel without further processing other than by blending by mechanical means;\"\n\nIn Witness Whereof, I have hereunto set my hand this sixteenth day of October, in the year of our Lord nineteen hundred seventy, and of the Independence of the United States of America the one hundred ninety-fifth.\n\nRICHARD NIXON","chunks":{"1":"(1) Clause (ii) of the last sentence of subparagraph (1) of paragraph (a) of Section 2 of Proclamation No. 3279 of March 10, 1959, as added by Proclamation No. 3990 of June 17, 1970, is amended by striking \"December 31, 1970\", and inserting in lieu thereof \"December 31, 1971\";","2":"(2) Section 1A of Proclamation No. 3279, as added by Proclamation No. 3969 of March 10, 1970, is amended by adding four new subsections as follows: \"(d) Any crude oil, unfinished oils, or finished products that may otherwise be transported into the United States from Canada under the provisions of this proclamation, may also be transported into the United States by vessel, as defined in 1 U.S.C. 3, so long as such transportation involves only waterways (other than ocean waterways) in or between the United States and Canada. \"(e) On and after October 1, 1970, any natural gas liquids, as defined in subparagraph (1) of paragraph (a) of Section 2 of this proclamation, derived solely from Canadian natural gas, may be transported other than by sea into the United States from Canada without license and without reducing the quantities of crude oil, unfinished oils, or finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 of this proclamation. \"(f) On or after October 1, 1970, ethane, propane and butane produced in the Western Hemisphere from Western Hemisphere crude or gas may be imported into the United States without reducing the quantities of crude oil, unfinished oils and finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 of this proclamation. \"(g) Crude oil may be imported into District I to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. Crude oil may be imported into the United States from Canada to be topped for use as burner fuel under such conditions as the Secretary may, by regulation, provide. The quantities of crude oil, unfinished oils, and finished products that may be imported into the United States under the provisions of Section 1, Section 1A, and Section 2 shall not be reduced by reason of imports of crude oil used as fuel under this paragraph (g).\"","3":"(3) Subparagraph (7) of paragraph (g) of Section 9 of Proclamation No. 3279 is amended to read as follows: \"(7) residual fuel oil—(i) topped crude oil or viscous residuum which has a viscosity of not less than 45 seconds Saybolt universal 100°F. and (ii) crude oil which is to be used as fuel without further processing other than by blending by mechanical means;\""},"annotations":[{"directive":null,"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P53":{"metadata":{"president":"Ronald Reagan","date":"October 02, 1987","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. On June 5, 1987, the United States International Trade Commission (USITC) reported to the President the results of its investigation under section 406 of the Trade Act of 1974 (19 U.S.C. 2436) (the Trade Act) with respect to imports from the People's Republic of China (the PRC) of ammonium paratungstate (APT) and tungstic acid provided for in items 417.40 and 416.40, respectively, of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202). The USITC determined that market disruption within the meaning of section 406 of the Trade Act exists with respect to imports from the PRC of APT and tungstic acid. To remedy this market disruption, the USITC recommended that, for the next 5 years, the combined volume of imports of APT and tungstic acid from the PRC be limited to the larger of 1.116 million pounds of tungsten content per year or 7.5 percent of U.S. consumption.\n\n2. On August 5, 1987, pursuant to sections 406, 202, and 203 of the Act (19 U.S.C. 2436, 2252, and 2253), and after taking into account the considerations specified in section 202(c) of the Trade Act (19 U.S.C. 2252(c)), I determined to provide import relief for the domestic industry in the form of a negotiated orderly marketing agreement. To this end, I directed the United States Trade Representative (the USTR) to negotiate and conclude an orderly marketing agreement with the PRC and to report the results of such negotiations to me within 50 days.\n\n3. Section 406(b)(2) of the Trade Act (19 U.S.C. 2436(b)(2)) requires that if import relief consists of, or includes, an orderly marketing agreement, then such agreement shall be entered into within 60 days after a presidential determination to provide relief.\n\n4. Pursuant to the authority vested in the President by the Constitution and the statutes of the United States, including section 203(a)(4) of the Trade Act (19 U.S.C. 2253(a)(4)), an agreement for orderly trade was signed on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China limiting the export from the PRC, and the import into the United States, of APT and tungstic acid provided for in items 417.40 and 416.40, respectively, of the TSUS.\n\n5. Pursuant to section 203(k)(1) of the Trade Act (19 U.S.C. 2253(k) (1)), I have considered the relation of such action to the international obligations of the United States. Since February 1, 1980, the United States and the PRC have had in effect a bilateral trade agreement under which I have determined, pursuant to section 405 of the Trade Act (19 U.S.C. 2435), a satisfactory balance of concessions has been maintained during the life of such agreement, and for which I reconfirm that actual or foreseeable reductions in U.S. tariffs and nontariff barriers to trade resulting from multilateral negotiations are, and continuously have been, satisfactorily reciprocated by the PRC. The present agreement for orderly trade is within the parameters of the safeguard measures envisioned by the bilateral trade agreement.\n\n6. In accordance with section 203(d)(2) of the Trade Act (19 U.S.C. 2253(d)(2)), I have determined that the level of import relief hereinafter proclaimed permits the importation into the United States of a quantity or value of articles that is not less than the average annual quantity or value of such articles imported into the United States from the PRC in the 1982-1984 period, which I have determined to be the most recent representative period for imports of such articles.\n\nNow, Therefore, I, Ronald Reagan, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes of the United States, including sections 203, 406, and 604 of the Trade Act (19 U.S.C. 2253, 2436, and 2483), section 332 of the Tariff Act of 1930, and section 301 of title 3, United States Code, do proclaim that—\n\n(l) An orderly marketing agreement was entered into on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China, with respect to trade in APT and tungstic acid, effective October 1, 1987. The agreement for orderly trade is to be implemented according to its terms and as directed in this Proclamation, including the Annex thereto.\n\n(2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation.\n\n(3) The President's authority under section 203(e)(3) of the Trade Act (19 U.S.C. 2253(e)(3)) to determine that the agreement is no longer effective is hereby delegated to the USTR. In the event of such a determination, the USTR shall prepare such Federal Register notice as may be appropriate to implement import relief authorized by section 203(e)(3) of the Trade Act.\n\n(4) The USTR shall take such actions and perform such functions for the United States as may be necessary concerning the administration, implementation, modification, amendment or termination of the agreement described in paragraph (1) of this Proclamation, and any action that may be subsequently required to implement paragraph (3) of this Proclamation. In carrying out his responsibilities under this paragraph, the USTR is authorized to direct and delegate to appropriate officials or agencies of the United States, authority to perform any functions necessary for the administration and implementation of the agreement, or in the event he determines the agreement to be no longer effective, such further action as he deems necessary and appropriate consistent with this Proclamation. The USTR is authorized to make any changes in part 2 of the Appendix to the TSUS that may be necessary to carry out the agreement or such other action as may be required should he determine the agreement to be no longer effective. Any such changes in the agreement shall be effective after their publication in the Federal Register.\n\n(5) The U.S. Customs Service shall take such actions as the USTR shall determine are necessary to carry out the agreement described in paragraph (1) of this Proclamation, or to implement any import relief implemented pursuant to paragraphs (3) and (4) of this Proclamation, or any modification thereof, with respect to the entry, or withdrawal from warehouse for consumption, into the United States of products covered by such agreement or by such other import relief.\n\n(6) The U.S. Customs Service shall collect and assemble such data as are necessary to monitor compliance with the agreement. Such data shall include import statistics with respect to tungsten oxide, provided for in item 422.42, part 2C, schedule 4 of the TSUSA, as well as data for APT and tungstic acid.\n\nIn Witness Whereof, I have hereunto set my hand this 2nd day of October, in the year of our Lord nineteen hundred and eighty-seven, and of the Independence of the United States of America the two hundred and twelfth.\n\nRONALD REAGAN","chunks":{"1":"On August 5, 1987, pursuant to sections 406, 202, and 203 of the Act (19 U.S.C. 2436, 2252, and 2253), and after taking into account the considerations specified in section 202(c) of the Trade Act (19 U.S.C. 2252(c)), I determined to provide import relief for the domestic industry in the form of a negotiated orderly marketing agreement.","2":"To this end, I directed the United States Trade Representative (the USTR) to negotiate and conclude an orderly marketing agreement with the PRC and to report the results of such negotiations to me within 50 days. 3. Section 406(b)(2) of the Trade Act (19 U.S.C. 2436(b)(2)) requires that if import relief consists of, or includes, an orderly marketing agreement, then such agreement shall be entered into within 60 days after a presidential determination to provide relief. 4. Pursuant to the authority vested in the President by the Constitution and the statutes of the United States,","3":"including section 203(a)(4) of the Trade Act (19 U.S.C. 2253(a)(4)), an agreement for orderly trade was signed on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China limiting the export from the PRC, and the import into the United States, of APT and tungstic acid provided for in items 417.40 and 416.40, respectively, of the TSUS. 5. Pursuant to secti ccording to its terms and as directed in this Proclamation, including the Annex thereto. (2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation.","10":"(3) The President's authority under section 203(e)(3) of the Trade Act (19 U.S.C. 2253(e)(3)) to determine that the agreement is no longer effective is hereby delegated to the USTR. In the event of such a determination,","11":"the USTR shall prepare such Federal Register notice as may be appropriate to implement import relief authorized by section 203(e)(3) of the Trade Act.","12":"(4) The USTR shall take such actions and perform such functions for the United States as may be necessary concerning the administration, implementation, modification, amendment or termination of the agreement described in paragraph (1) of this Proclamation, and any action that may be subsequently required to implement paragraph (3) of this Proclamation.","13":"In carrying out his responsibilities under this paragraph, the USTR is authorized to direct and delegate to appropriate officials or agencies of the United States, authority to perform any functions necessary for the administration and implementation of the agreement, or in the event he determines the agreement to be no longer effective, such further action as he deems necessary and appropriate consistent with this Proclamation.","14":"The USTR is authorized to make any changes in part 2 of the Appendix to the TSUS that may be necessary to carry out the agreement or such other action as may be required should he determine the agreement to be no longer effective. Any such changes in the agreement shall be effective after their publication in the Federal Register.","15":"(5) The U.S. Customs Service shall take such actions as the USTR","16":"shall determine are necessary to carry out the agreement described in paragraph (1) of this Proclamation, or to implement any import relief implemented pursuant to paragraphs (3) and (4) of this Proclamation, or any modification thereof, with respect to the entry, or withdrawal from warehouse for consumption, into the United States of products covered by such agreement or by such other import relief. (6) The U.S. Customs Service shall collect and assemble such data as are necessary to monitor compliance with the agreement. Such data shall include import statistics with respect to tungsten oxide, provided for in item 422.42, part 2C, schedule 4 of the TSUSA, as well as data for APT and tungstic acid."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"},"5":{"code":"0","diplomacy":"no","military_ops":"no"},"6":{"code":"0","diplomacy":"no","military_ops":"no"},"7":{"code":"3","diplomacy":"no","military_ops":"no"},"8":{"code":"0","diplomacy":"no","military_ops":"no"},"9":{"code":"3","diplomacy":"no","military_ops":"no"},"10":{"code":"3","diplomacy":"no","military_ops":"no"},"11":{"code":"2","diplomacy":"no","military_ops":"no"},"12":{"code":"1","diplomacy":"no","military_ops":"no"},"13":{"code":"1","diplomacy":"no","military_ops":"no"},"14":{"code":"1","diplomacy":"no","military_ops":"no"},"15":{"code":"1","diplomacy":"no","military_ops":"no"},"16":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"},"5":{"code":"0","diplomacy":"no","military_ops":"no"},"6":{"code":"0","diplomacy":"no","military_ops":"no"},"7":{"code":"3","diplomacy":"no","military_ops":"no"},"8":{"code":"3","diplomacy":"no","military_ops":"no"},"9":{"code":"2","diplomacy":"no","military_ops":"no"},"10":{"code":"1","diplomacy":"no","military_ops":"no"},"11":{"code":"1","diplomacy":"no","military_ops":"no"},"12":{"code":"1","diplomacy":"no","military_ops":"no"},"13":{"code":"1","diplomacy":"no","military_ops":"no"},"14":{"code":"1","diplomacy":"no","military_ops":"no"},"15":{"code":"1","diplomacy":"no","military_ops":"no"},"16":{"code":"1","diplomacy":null,"military_ops":null}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"0","diplomacy":"no","military_ops":"no"},"7":{"code":"3","diplomacy":"no","military_ops":"no"},"8":{"code":"3","diplomacy":"no","military_ops":"no"},"9":{"code":"0","diplomacy":"no","military_ops":"no"},"10":{"code":"1","diplomacy":"no","military_ops":"no"},"11":{"code":"1","diplomacy":"no","military_ops":"no"},"12":{"code":"1","diplomacy":"no","military_ops":"no"},"13":{"code":"1","diplomacy":"no","military_ops":"no"},"14":{"code":"1","diplomacy":"no","military_ops":"no"},"15":{"code":"1","diplomacy":"no","military_ops":"no"},"16":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P56":{"metadata":{"president":"Jimmy Carter","date":"July 02, 1980","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nSection 3 of the Military Selective Service Act, as amended (50 U.S.C. App. 453), provides that male citizens of the United States and other male persons residing in the United States who are between the ages of 18 and 26, except those exempted by Sections 3 and 6(a) of the Military Selective Service Act, must present themselves for registration at such time or times and place or places, and in such manner as determined by the President. Section 6(k) provides that such exceptions shall not continue after the cause for the exemption ceases to exist.\n\nThe Congress of the United States has made available the funds (H.J. Res. 521, approved by me on June 27, 1980), which are needed to initiate this registration, beginning with those born on or after January 1, 1960.\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Military Selective Service Act, as amended (50 U.S.C. App. 451 et seq.), do hereby proclaim as follows:\n\n1-1. Persons to be Registered and Days of Registration.\n\n1-101. Male citizens of the United States and other males residing in the United States, unless exempted by the Military Selective Service Act, as amended, who were born on or after January 1, 1960, and who have attained their eighteenth birthday, shall present themselves for registration in the manner and at the time and places as hereinafter provided.\n\n1-102. Persons born in calendar year 1960 shall present themselves for registration on any of the six days beginning Monday, July 21, 1980.\n\n1-103. Persons born in calendar year 1961 shall present themselves for registration on any of the six days beginning Monday, July 28, 1980.\n\n1-104. Persons born in calendar year 1962 shall present themselves for registration on any of the six days beginning Monday, January 5, 1981.\n\n1-105. Persons born on or after January 1, 1963, shall present themselves for registration on the day they attain the 18th anniversary of their birth or on any day within the period of 60 days beginning 30 days before such date; however, in no event shall such persons present themselves for registration prior to January 5, 1981.\n\n1-106. Aliens who would be required to present themselves for registration pursuant to Sections 1-101 to 1-105, but who are in processing centers on the dates fixed for registration, shall present themselves for registration within 30 days after their release from such centers.\n\n1-107. Aliens and noncitizen nationals of the United States who reside in the United States, but who are absent from the United States on the days fixed for their registration, shall present themselves for registration within 30 days after their return to the United States.\n\n1-108. Aliens and noncitizen nationals of the United States who, on or after July 1, 1980, come into and reside in the United States shall present themselves for registration in accordance with Sections 1-101 to 1-105 or within 30 days after coming into the United States, whichever is later.\n\n1-109. Persons who would have been required to present themselves for registration pursuant to Sections 1-101 to 1-108 but for an exemption pursuant to Section 3 or 6(a) of the Military Selective Service Act, as amended, or but for some condition beyond their control such as hospitalization or incarceration, shall present themselves for registration within 30 days after the cause for their exempt status ceases to exist or within 30 days after the termination of the condition which was beyond their control.\n\n1-2. Places and Times for Registration.\n\n1-201. Persons who are required to be registered and who are in the United States on any day fixed herein for their registration, shall present themselves for registration before a duly designated employee in any classified United States Post Office.\n\n1-202. Citizens of the United States who are required to be registered and who are not in the United States on any of the days set aside for their registration, shall present themselves at a United States Embassy or Consulate for registration before a diplomatic or consular officer of the United States or before a registrar duly appointed by a diplomatic or consular officer of the United States.\n\n1-203. The hours for registration in United States Post Offices shall be the business hours during the days of operation of the particular United States Post Office. The hours for registration in United States Embassies and Consulates shall be those prescribed by the United States Embassies and Consulates.\n\n1-3. Manner of Registration.\n\n1-301. Persons who are required to be registered shall comply with the registration procedures and other rules and regulations prescribed by the Director of Selective Service.\n\n1-302. When reporting for registration each person shall present for inspection reasonable evidence of his identity. After registration, each person shall keep the Selective Service System informed of his current address.\n\nHaving proclaimed these requirements for registration, I urge everyone, including employers in the private and public sectors, to cooperate with and assist those persons who are required to be registered in order to ensure a timely and complete registration. Also, I direct the heads of Executive agencies, when requested by the Director of Selective Service and to the extent permitted by law, to cooperate and assist in carrying out the purposes of this Proclamation.\n\nIn Witness Whereof, I have hereunto set my hand this second day of July in the year of our Lord nineteen hundred and eighty, and of the Independence of the United States of America the two hundred and fourth.\n\nJIMMY CARTER","chunks":{"1":"Now, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Military Selective Service Act, as amended (50 U.S.C. App. 451 et seq.), do hereby proclaim as follows: 1-1. Persons to be Registered and Days of Registration. 1-101. Male citizens of the United States and other males residing in the United States, unless exempted by the Military Selective Service Act, as amended, who were born on or after January 1, 1960, and who have attained their eighteenth birthday, shall present themselves for registration in the manner and at the time and places as hereinafter provided. 1-102. Persons born in calendar year 1960 shall present themselv f the condition which was beyond their control. 1-2. Places and Times for Registration. 1-201. Persons who are required to be registered and who are in the United States on any day fixed herein for their registration, shall present themselves for registration before a duly designated employee in any classified United States Post Office. 1-202. Citizens of the United States who are required to be registered and who are not in the United States on any of the days set aside for their registration, shall present themselves at a United States Embassy or Consulate for registration before a diplomatic or consular officer of the United States or before a registrar duly appointed by a diplomatic or consular officer of the United States. 1-203. The hours for registration in United States Post Offices shall be the business hours during the days of operation of the particular United States Post Office. The hours for registration in United States Embassies and Consulates shall be those prescribed by the United States Embassies and Consulates. 1-3. Manner of Registration. 1-301. Persons who are required to be registered shall comply with the registration procedures and other rules and regulations prescribed by the Director of Selective Service. 1-302. When reporting for registration each person shall present for inspection reasonable evidence of his identity. After registration, each person shall keep the Selective Service System informed of his current address. Having proclaimed these requirements for registration, I urge everyone, including employers in the private and public sectors, to cooperate with and assist those persons who are required to be registered in order to ensure a timely and complete registration.","2":"Also, I direct the heads of Executive agencies, when requested by the Director of Selective Service and to the extent permitted by law, to cooperate and assist in carrying out the purposes of this Proclamation."},"annotations":[{"directive":{"code":"3","diplomac <script>
(function(){
'use strict';
var P=JSON.parse(document.getElementById('payload-data').textContent);
var groups=P.groups,annotators=P.annotators,docs=P.docs;
var fields=P.fields,fieldLabels=P.fieldLabels,valueLabels=P.valueLabels;
var mode='directive',activeTab=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function label(v){return v==null?null:(valueLabels[v]||v);}

function rowAgreement(vals){
  var nn=vals.filter(function(v){return v!=null;});
  if(!nn.length)return 'missing';
  return(new Set(nn)).size>1?'disagree':(nn.length<vals.length?'missing':'agree');
}

function docAgreement(docId){
  var d=docs[docId];if(!d)return 'missing';
  var ann=d.annotations;
  var hasMissing=false;
  for(var fi=0;fi<fields.length;fi++){
    var f=fields[fi];
    var vals=ann.map(function(a){return a.directive?(a.directive[f]!=null?a.directive[f]:null):null;});
    var ag=rowAgreement(vals);
    if(ag==='disagree')return 'disagree';
    if(ag==='missing')hasMissing=true;
  }
  return hasMissing?'missing':'agree';
}

function annTable(rowData){
  var out='<table class="ann-table"><thead><tr><th>Field</th>';
  annotators.forEach(function(n){out+='<th>'+esc(n)+'</th>';});
  out+='</tr></thead><tbody>';
  rowData.forEach(function(row){
    var ag=rowAgreement(row.vals);
    out+='<tr class="row-'+ag+'"><td class="field-label">'+esc(row.label)+'</td>';
    row.vals.forEach(function(v){
      var cls='val-cell'+(v==null?' val-missing':'');
      out+='<td class="'+cls+'">'+(v==null?'—':esc(label(v)))+'</td>';
    });
    out+='</tr>';
  });
  return out+'</tbody></table>';
}

function makeRowData(getVal){
  return fields.map(function(f){
    return{field:f,label:fieldLabels[f],vals:annotators.map(function(_,i){return getVal(i,f);})};
  });
}

function directiveTable(ann){
  return annTable(makeRowData(function(i,f){
    var d=ann[i].directive;return d?(d[f]!=null?d[f]:null):null;
  }));
}

function chunkTable(chunkN,ann){
  return annTable(makeRowData(function(i,f){
    var c=ann[i].chunks?ann[i].chunks[chunkN]:null;return c?(c[f]!=null?c[f]:null):null;
  }));
}

function wpComments(ann){
  var items=ann.map(function(a,i){return{who:annotators[i],txt:a.wp_comment};}).filter(function(x){return x.txt;});
  if(!items.length)return '';
  var out='<div class="comments"><div class="comment-heading">Discussion notes</div>';
  items.forEach(function(x){out+='<div class="comment-item"><span class="comment-who">'+esc(x.who)+':</span> '+esc(x.txt)+'</div>';});
  return out+'</div>';
}

function rightCol(docId){
  var d=docs[docId];if(!d)return '<div class="no-chunks">No data.</div>';
  var ann=d.annotations;
  if(mode==='directive')return directiveTable(ann)+wpComments(ann);
  // subdirective
  var ckKeys=Object.keys(d.chunks||{}).sort(function(a,b){return+a-+b;});
  var out='';
  if(!ckKeys.length)out+='<div class="no-chunks">No sub-directive chunks — showing directive-level.</div>';
  else{
    ckKeys.forEach(function(n){
      out+='<div class="chunk-block"><div class="chunk-label">Chunk '+esc(n)+'</div>';
      out+='<div class="chunk-text">'+esc(d.chunks[n])+'</div>';
      out+=chunkTable(n,ann)+'</div>';
    });
  }
  out+=wpComments(ann);
  if(!ckKeys.length)out+=directiveTable(ann);
  return out;
}

function renderDoc(docId){
  var d=docs[docId];if(!d)return '';
  var m=d.metadata||{};
  var ag=docAgreement(docId);
  var badgeText=ag==='agree'?'Agreement':ag==='disagree'?'Disagreement':'Incomplete';
  var colHead=mode==='directive'?'Directive annotation':'Sub-directive annotation';
  return '<details class="doc-card" open>'
    +'<summary>'
    +'<span class="doc-id">'+esc(docId)+'</span>'
    +'<span class="doc-prez">'+esc(m.president||'')+'</span>'
    +'<span class="doc-date">'+esc(m.date||'')+'</span>'
    +'<span class="doc-type">'+esc((m.type||'').replace(/_/g,' '))+'</span>'
    +'<span class="doc-badge '+ag+'">'+badgeText+'</span>'
    +'</summary>'
    +'<div class="doc-body">'
    +'<div class="col"><p class="col-heading">Document text</p><div class="doc-text">'+esc(d.text||'(text not found)')+'</div></div>'
    +'<div class="col"><p class="col-heading">'+esc(colHead)+'</p>'+rightCol(docId)+'</div>'
    +'</div></details>';
}

function renderPanel(){
  var g=groups[activeTab];
  var seen=new Set();
  return g.docs.map(function(id){
    if(seen.has(id))return '';seen.add(id);return renderDoc(id);
  }).join('');
}

function renderTabs(){
  document.getElementById('tab-bar').innerHTML=groups.map(function(g,i){
    return'<button class="tab-btn'+(i===activeTab?' active':'')+'" data-idx="'+i+'" type="button">'
      +esc(g.label)+' <span class="tab-count">('+g.docs.length+')</span></button>';
  }).join('');
}

function render(){renderTabs();document.getElementById('content').innerHTML=renderPanel();}

document.getElementById('tab-bar').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  activeTab=+btn.dataset.idx;render();
});
document.getElementById('btn-directive').addEventListener('click',function(){
  mode='directive';
  document.getElementById('btn-directive').classList.add('active');
  document.getElementById('btn-subdirective').classList.remove('active');
  document.getElementById('content').innerHTML=renderPanel();
});
document.getElementById('btn-subdirective').addEventListener('click',function(){
  mode='subdirective';
  document.getElementById('btn-directive').classList.remove('active');
  document.getElementById('btn-subdirective').classList.add('active');
  document.getElementById('content').innerHTML=renderPanel();
});

render();

function setBarHeight(){
  var h=document.getElementById('tab-bar').getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--bar-height',h+'px');
}
setBarHeight();
window.addEventListener('resize',setBarHeight);
})();
</script>
</body>
</html>
