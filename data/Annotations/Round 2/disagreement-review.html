l},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO19":{"metadata":{"president":"Donald J. Trump","date":"March 27, 2017","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nSection 1. Revocation. Executive Order 13673 of July 31, 2014, section 3 of Executive Order 13683 of December 11, 2014, and Executive Order 13738 of August 23, 2016, are revoked.\n\nSec. 2. Reconsideration of Existing Rules. All executive departments and agencies shall, as appropriate and to the extent consistent with law, consider promptly rescinding any orders, rules, regulations, guidance, guidelines, or policies implementing or enforcing the revoked Executive Orders and revoked provision listed in section 1 of this order.\n\nSec. 3. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nMarch 27, 2017.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows: Section 1. Revocation. Executive Order 13673 of July 31, 2014, section 3 of Executive Order 13683 of December 11, 2014, and Executive Order 13738 of August 23, 2016, are revoked. Sec. 2. Reconsideration of Existing Rules. All executive departments and agencies shall, as appropriate and to the extent consistent with law, consider promptly rescinding any orders, rules, regulations, guidance, guidelines, or policies implementing or enforcing the revoked Executive Orders and revoked provision listed in section 1 of this order. Sec. 3. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO21":{"metadata":{"president":"Richard Nixon","date":"January 17, 1973","type":"executive_order"},"text":"By virtue of the authority vested in me by section 6103 (a) of the Internal Revenue Code of 1954 (68A Stat. 753; 26 U.S.C. 6103 (a)), as amended by section 3 (c) of the Interest Equalization Tax Act (Public Law 88-563, 78 Stat. 844), section 601 (a) of the Excise Tax Reduction Act of 1965 (P.L. 89-44, 79 Stat. 153), and section 4 (a) of the act of November 2, 1966 (Public Law 89-713, 80 Stat. 1109), it is hereby ordered that income tax returns made for taxable years beginning on or after January 1, 1967, of persons having farm operations shall be open to inspection to the extent readily available in the Internal Revenue Service (for the purpose of obtaining data about such persons' farm operations) by the Department of Agriculture as may be needed for statistical purposes only. If inspection of such returns is necessary such inspection shall be made in an office of the Internal Revenue Service and shall be in accordance and upon compliance with the rules and regulations prescribed by the Secretary of the Treasury in a Treasury Decision, relating to inspection by the Department of Agriculture of income tax returns made for taxable years beginning on or after January 1, 1967, of persons having farm operations, to the extent readily available in the Internal Revenue Service (for the purpose of obtaining data about such persons' farm operations), approved by me this date.\n\nRICHARD NIXON\n\nThe White House,\n\nJanuary 17, 1973.","chunks":{"1":"By virtue of the authority vested in me by section 6103 (a) of the Internal Revenue Code of 1954 (68A Stat. 753; 26 U.S.C. 6103 (a)), as amended by section 3 (c) of the Interest Equalization Tax Act (Public Law 88-563, 78 Stat. 844), section 601 (a) of the Excise Tax Reduction Act of 1965 (P.L. 89-44, 79 Stat. 153), and section 4 (a) of the act of November 2, 1966 (Public Law 89-713, 80 Stat. 1109), it is hereby ordered that income tax returns made for taxable years beginning on or after January 1, 1967, of persons having farm operations shall be open to inspection to the extent readily available in the Internal Revenue Service (for the purpose of obtaining data about such persons' farm operations) by the Department of Agriculture as may be needed for statistical purposes only. If inspection of such returns is necessary such inspection shall be made in an office of the Internal Revenue Service and shall be in accordance and upon compliance with the rules and regulations prescribed by the Secretary of the Treasury in a Treasury Decision, relating to inspection by the Department of Agriculture of income tax returns made for taxable years beginning on or after January 1, 1967, of persons having farm operations, to the extent readily available in the Internal Revenue Service (for the purpose of obtaining data about such persons' farm operations), approved by me this date."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO22":{"metadata":{"president":"Barack Obama","date":"June 24, 2016","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nSection 1. Policy. The American spirit of entrepreneurship is one of our most admired values around the world, and the United States has produced many of the world's most respected businesses and inspiring business creators. At a time when many societies confront extremism, unemployment, and slow economic growth, entrepreneurship holds out the promise of opportunity, prosperity, and security.\n\nIt is in the national interest for the Federal Government to support innovation, global entrepreneurship, and the American private sector. Linking entrepreneurs with capital, new networks, and markets and providing skills and training will allow them to grow their businesses and positively impact their communities. It is also necessary that we help enable our global partners to invest in the tools and infrastructure that make this possible, including high-speed broadband; business incubators and accelerators; regional economic development programs and extension services; international people-to-people exchange programs; and the technical, export, and business assistance and mentoring that entrepreneurs need worldwide in order to drive economic growth and job creation.\n\nThis order sets forth the administration and goals of several programs designed to connect American and foreign entrepreneurs with the Federal Government and promote entrepreneurship across the United States and around the world by sharing the knowledge, experience, and connectivity necessary to help develop the next generation of entrepreneurs.\n\nSec. 2. Administration of the Presidential Ambassadors for Global Entrepreneurship Program. (a) The Secretary of Commerce (Secretary) shall administer the Presidential Ambassadors for Global Entrepreneurship Program (PAGE Program) to enable individuals who exemplify the spirit of American entrepreneurship and who have proven track records to use their networks, platforms, and voices to support aspiring entrepreneurs and advance public policies that encourage entrepreneurship in the United States and around the globe. Individuals selected for participation in the PAGE Program shall be known as PAGE Members.\n\n(b) The PAGE Program shall be administered by a Director, appointed by the Secretary under authorities of the Department of Commerce (Commerce). Commerce shall provide necessary staff, resources, and administrative support for the PAGE Program to the extent permitted by law and within existing appropriations.\n\nSec. 3. PAGE Advisory Board. (a) The Secretary shall establish an Advisory Board to advise the Secretary by recommending such priorities, standards, and partnerships as may be beneficial to fulfill the goals of the PAGE Program and to identify potential opportunities for PAGE Members to support the PAGE Program.\n\n(b) The Secretary shall serve as Chair of the Advisory Board. In addition to the Chair, the membership of the Advisory Board shall include the Secretary of State, the Administrator of the United States Agency for International Development (USAID), the Administrator of the Small Business Administration (SBA), and the Administrator of the National Aeronautics and Space Administration (NASA), or their designees, and such other representatives of executive departments and agencies (agencies) as may be designated by the Secretary. Consistent with law, the Advisory Board may consult with industry, academia, and other non-federal entities to ensure that the PAGE Program is continually identifying opportunities to apply innovative practices in effective ways to promote entrepreneurship.\n\nSec. 4. Selection of PAGE Members. (a) The Secretary, in accordance with applicable law, shall prescribe appropriate procedures for the selection of PAGE Members. PAGE Members will total no more than 25 at any given time.\n\n(b) PAGE Members may participate in the PAGE Program for periods of 2 years, and may be selected to participate for additional periods at the discretion of the Secretary.\n\nSec. 5. Responsibilities of Agencies. The Department of State (State), USAID, and SBA are encouraged to work with the Secretary and the Advisory Board to maximize the PAGE Program's benefits to innovation, global entrepreneurship, and the American private sector through the identification of opportunities for entrepreneurs to access capital, education, mentorships, and other services that will help to grow their businesses.\n\nSec. 6. Global Entrepreneurship Summit. (a) The Secretary of State shall coordinate the Federal Government's participation in the Global Entrepreneurship Summit (GES), which will focus on connecting entrepreneurs around the world and empowering them to expand their enterprises and build lasting relationships with the United States; increasing global economic prosperity; building secure communities; promoting responsible business conduct, including business practices to encourage greater representation of all people, including women, youth, and minorities; and using innovation to solve pressing global challenges.\n\n(b) State shall coordinate with Commerce, USAID, and SBA to identify and carry out programs and activities that will further the goals of the GES to the extent permitted by law and within existing appropriations.\n\nSec. 7. Accelerating Entrepreneurship and Economic Opportunity by Expanding Internet Access Globally. State, in coordination with other agencies, multilateral institutions, foreign countries, and stakeholders, shall work to actively promote global Internet connectivity. Specifically, the Global Connect Initiative shall focus on encouraging foreign countries to prioritize Internet connectivity in development plans, promoting the formation of region-specific multi-sector working groups to ensure technical and regulatory best practices, and encouraging the development of digital literacy programs in developing nations.\n\nSec. 8. Global Connect International Connectivity Steering Group.\n\n(a) In order to ensure a coordinated and consistent approach in agency implementation of the goals set forth in section 7 of this order, there is hereby established a Global Connect International Connectivity Steering Group (Steering Group), chaired by State.\n\n(b) The Steering Group shall be composed of a representative from each of the following agencies:\n\n(i) the Department of State;\n\n(ii) the Department of the Treasury;\n\n(iii) the Department of Defense;\n\n(iv) the Department of Commerce; (v) the Department of Transportation;\n\n(vi) the United States Trade Representative;\n\n(vii) the Small Business Administration;\n\n(viii) the United States Trade and Development Agency;\n\n(ix) the Millennium Challenge Corporation;\n\n(x) the Overseas Private Investment Corporation;\n\n(xi) the Export-Import Bank of the United States; and\n\n(xii) the United States Agency for International Development.\n\n(c) The Chair shall invite a representative from the Federal Communications Commission, and may invite a representative from any other department, agency, component, or office the Chair deems appropriate, to participate as a member of the Steering Group.\n\n(d) The Chair shall consult with the following entities in setting the agenda of the Steering Group and ensuring coordination with other Administration policies:\n\n(i) the National Economic Council;\n\n(ii) the National Security Council Staff; and\n\n(iii) the Office of Science and Technology Policy.\n\n(e) Not later than 6 months after the date of this order, the Steering Group shall report to the Secretary of State. In this report, the Steering Group shall:\n\n(i) describe the current state of agency procedures, requirements, programs, and policies related to the goals of the Global Connect Initiative; and\n\n(ii) provide updates on the strategy and the evaluation criteria for Federal contributions to the Global Connect Initiative.\n\n(f) The Secretary of State may request a periodic update of this report every 12 months thereafter, through 2020, on progress that has been made in achieving the goals of the Global Connect Initiative.\n\nSec. 9. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to a department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nBARACK OBAMA\n\nThe White House,\n\nJune 24, 2016.","chunks":{"1":"By the authority vested in me as President by the Constitution and the law repreneurs and advance public policies that encourage entrepreneurship in the United States and around the globe. Individuals selected for participation in the PAGE Program shall be known as PAGE Members. (b) The PAGE Program shall be administered by a Director, appointed by the Secretary under authorities of the Department of Commerce (Commerce).","2":"Commerce shall provide necessary staff, resources, and administrative support for the PAGE Program to the extent permitted by law and within existing appropriations. Sec. 3. PAGE Advisory Board.","3":"(a) The Secretary shall establish an Advisory Board to advise the Secretary by recommending such priorities, standards, and partnerships as may be beneficial to fulfill the goals of the PAGE Program and to identify potential opportunities for PAGE Members to support the PAGE Program. (b) The Secretary shall serve as Chair of the Advisory Board. In addition to the Chair, the membership of the Advisory Board shall include the Secretary of State, the Administrator of the United States Agency for International Development (USAID), the Administrator of the Small Business Administration (SBA), and the Administrator of the National Aeronautics and Space Administration (NASA), or their designees, and such other representatives of executive departments and agencies (agencies) as may be designated by the Secretary. Consistent with law, the Advisory Board may consult with industry, academia, and other non-federal entities to ensure that the PAGE Program is continually identifying opportunities to apply innovative practices in effective ways to promote entrepreneurship. Sec. 4. Selection of PAGE Members.","4":"(a) The Secretary, in accordance with applicable law, shall prescribe appropriate procedures for the selection of PAGE Members. PAGE Members will total no more than 25 at any given time. (b) PAGE Members may participate in the PAGE Program for periods of 2 years, and may be selected to participate for additional periods at the discretion of the Secretary. Sec. 5. Responsibilities of Agencies. The Department of State (State), USAID, and SBA are encouraged to work with the Secretary and the Advisory Board to maximize the PAGE Program's benefits to innovation, global entrepreneurship, and the American private sector through the identification of opportunities for entrepreneurs to access capital, education, mentorships, and other services that will help to grow their businesses. Sec. 6. Global Entrepreneurship Summit.","5":"(a) The Secretary of State shall coordinate the Federal Government's participation in the Global Entrepreneurship Summit (GES), which will focus on connecting entrepreneurs around the world and empowering them to expand their enterprises and build lasting relationships with the United States; increasing global economic prosperity; building secure communities; promoting responsible business conduct, including business practices to encourage greater representation of all people, including women, youth, and minorities; and using innovation to solve pressing global challenges.","6":"(b) State shall coordinate with Commerce, USAID, and SBA to identify and carry out programs and activities that will further the goals of the GES to the extent permitted by law and within existing appropriations. Sec. 7. Accelerating Entrepreneurship and Economic Opportunity by Expanding Internet Access Globally. State, in coordination with other agencies, multilateral institutions, foreign countries, and stakeholders, shall work to actively promote global Internet connectivity. Specifically, the Global Connect Initiative shall focus on encouraging foreign countries to prioritize Internet connectivity in development plans, promoting the formation of region-specific multi-sector working groups to ensure technical and regulatory best practices, and encouraging the development of digital literacy programs in developing nations. Sec. 8. Global Connect International Connectivity Steering Group.","7":"(a) In order to ensure a coordinated and consistent approach in agency implementation of the goals set forth in section 7 of this order, there is hereby established a Global Connect International Connectivity Steering Group (Steering Group), chaired by State. (b) The Steering Group shall be composed of a representative from each of the following agencies: (i) the Department of State; (ii) the Department of the Treasury; (iii) the Department of Defense; (iv) the Department of Commerce; (v) the Department of Transportation; (vi) the United States Trade Representative; (vii) the Small Business Administration; (viii) the United States Trade and Development Agency; (ix) the Millennium Challenge Corporation; (x) the Overseas Private Investment Corporation; (xi) the Export-Import Bank of the United States; and (xii) the United States Agency for International Development. (c) The Chair shall invite a representative from the Federal Communications Commission, and may invite a representative from any other department, agency, component, or office the Chair deems appropriate, to participate as a member of the Steering Group. (d) The Chair shall consult with the following entities in setting the agenda of the Steering Group and ensuring coordination with other Administration policies: (i) the National Economic Council; (ii) the National Security Council Staff; and (iii) the Office of Science and Technology Policy.","8":"(e) Not later than 6 months after the date of this order, the Steering Group shall report to the Secretary of State. In this report, the Steering Group shall: (i) describe the current state of agency procedures, requirements, programs, and policies related to the goals of the Global Connect Initiative; and (ii) provide updates on the strategy and the evaluation criteria for Federal contributions to the Global Connect Initiative. (f) The Secretary of State may request a periodic update of this report every 12 months thereafter, through 2020, on progress that has been made in achieving the goals of the Global Connect Initiative. Sec. 9. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to a department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO23":{"metadata":{"president":"Ronald Reagan","date":"June 05, 1981","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution of the United States of America, and to establish in accordance with the provisions of the Federal Advisory Committee Act, as amended (5 U.S.C. App. I), an advisory committee on arts and humanities of the United States, it is hereby ordered as follows:\n\nSection 1. Establishment. (a) There is hereby established the Presidential Task Force on the Arts and Humanities. The Task Force shall be composed of no more than 36 members appointed by the President. No more than one member shall be a full-time Federal officer or employee. The remaining members shall not represent Executive agencies.\n\n(b) The President shall designate three Cochairmen and one Vice Chairman from among the members of the Task Force.\n\nSec. 2. Functions. (a) The Task Force shall advise the President with respect to:\n\n(1) methods to increase private support for the arts and humanities;\n\n(2) ways in which Federal decisions regarding arts and humanities projects can rely more on the judgments of nongovernmental professionals, private sector groups, and individuals; and\n\n(3) potential improvements in the management, organization and structure of (i) the National Foundation on the Arts and the Humanities (including the National Endowment for the Arts, the National Endowment for the Humanities and the Federal Council on the Arts and the Humanities) and (ii) other Federal arts and humanities programs.\n\n(b) The Task Force shall report its findings and recommendations to the President, the Chairman of the National Endowment for the Arts, and the Chairman of the National Endowment for the Humanities.\n\nSec. 3. Administration. (a) The heads of Executive agencies shall, to the extent permitted by law, provide the Task Force with such information with respect to arts and humanities issues as may be necessary for the effective performance of its functions.\n\n(b) Members of the Task Force shall receive no compensation for their work on the Task Force. However, while engaged in the work of the Task Force, members may be allowed travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the government service (5 U.S.C. 57015707).\n\n(c) The National Endowment for the Humanities shall, to the extent permitted by law and subject to the availability of funds, provide the Task Force with such administrative services, funds, facilities, staff and other support services as may be necessary for the effective performance of its functions.\n\nSec. 4. General Provisions. (a) Notwithstanding the provisions of any other Executive order, the responsibilities of the President under the Federal Advisory Committee Act, as amended, except that of reporting annually to the Congress, which are applicable to the advisory committee established by this Order, shall be performed by the Chairman of the National Endowment for the Humanities, in accordance with the guidelines and procedures established by the Administrator of General Services.\n\n(b) The Task Force shall terminate on September 30, 1981, unless sooner extended.\n\nRONALD REAGAN\n\nThe White House,\n\nJune 5, 1981.\n\n[Filed with the Office of the Federal Register, 4:56 p.m., June 5, 1981]","chunks":{"1":"By the authority vested in me as President by the Constitution of the United States of America, and to establish in accordance with the provisions of the Federal Advisory Committee Act, as amended (5 U.S.C. App. I), an advisory committee on arts and humanities of the United States, it is hereby ordered as follows: Section 1. Establishment.","2":"(a) There is hereby established the Presidential Task Force on the Arts and Humanities. The Task Force shall be composed of no more than 36 members appointed by the President. No more than one member shall be a full-time Federal officer or employee. The remaining members ther Executive order, the responsibilities of the President under the Federal Advisory Committee Act, as amended, except that of reporting annually to the Congress, which are applicable to the advisory committee established by this Order, shall be performed by the Chairman of the National Endowment for the Humanities, in accordance with the guidelines and procedures established by the Administrator of General Services. (b) The Task Force shall terminate on September 30, 1981, unless sooner extended."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":"Order Action 1 seems to be vesting clause?"},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO24":{"metadata":{"president":"Donald J. Trump","date":"December 14, 2020","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 305 of title 5, United States Code, and section 301 of title 3, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy and Principles. As expressed in Executive Order 13777 of February 24, 2017 (Enforcing the Regulatory Reform Agenda), it is the policy of the United States to alleviate unnecessary regulatory burdens placed on the American people. Overly burdensome occupational licensing requirements can impede job creation and slow economic growth, which undermines our Nation's prosperity and the economic well-being of the American people. Such regulations can prevent American workers and job seekers from earning a living, maximizing their personal and economic potential, and achieving the American Dream. The purpose of this order is to reduce the burden of occupational regulations in order to promote the free practice of commerce, lower consumer costs, and increase economic and geographic mobility, including for military spouses.\n\nMy Administration is committed to continuing this important work by partnering with State, local, territorial, and tribal leaders throughout the country to eliminate harmful occupational regulations, which are frequently designed to protect politically connected interest groups. To this end, in October 2019, my Administration announced the establishment of the Governors' Initiative on Regulatory Innovation, which works with State, local, and tribal leaders to advance occupational licensing reforms, better align State and Federal regulations, and eliminate unnecessary regulations that drive up consumer costs.\n\nOccupational regulations can protect practitioners from competition rather than protect the public from malpractice. Unfortunately, the number of occupational regulations has substantially increased over the last few decades. Since the 1950s, the percentage of jobs requiring a government-mandated occupational license has increased from less than 5 percent to between 25 and 30 percent. By requiring workers to acquire new licenses when they move to a new jurisdiction, occupational regulations reduce worker mobility, disproportionately harm low income Americans, and are particularly burdensome to military spouses who must relocate to support the service members committed to keeping our country safe. Additionally, blanket prohibitions that prevent individuals with criminal records from obtaining occupational licenses may exacerbate disparities in employment opportunity and increase the likelihood of recidivism, particularly as regulatory barriers to enter lower- and middle-income occupations are associated with higher recidivism rates. Licensing requirements unnecessary to protect consumers from significant and demonstrable harm also frequently impose expensive educational requirements on potential job seekers, even for occupations with limited future earnings potential. According to recent research, licensing requirements have cost our country an estimated 2.85 million jobs and over $200 billion annually in increased consumer costs.\n\nTherefore, it is the policy of the United States Government to support occupational regulation reform throughout the Nation, building on occupational licensing reforms enacted most recently in Arizona, Florida, Iowa, Missouri, and South Dakota, guided by six principles:\n\nPrinciple 1. All recognized occupational licensure boards should be subject to active supervision of a designated governmental agency or office.\n\nPrinciple 2. All occupational licensure boards recognized by a State, territorial, or tribal government that oversee personal qualifications related to the practice of an occupation should adopt and maintain the criteria and methods of occupational regulation that are least restrictive to competition sufficient to protect consumers from significant and demonstrable harm to their health and safety. The policies and procedures of such boards should be designed to protect consumer and worker safety and to encourage competition.\n\nPrinciple 3. State, territorial, and tribal governments should review existing occupational regulations, including associated scope-of-practice provisions, to ensure that their requirements are the least restrictive to competition sufficient to protect consumers from significant and demonstrable harm. State, territorial, and tribal governments should also regularly review and analyze all occupational regulations, including associated personal qualifications required to obtain an occupational license, to ensure the adoption of the least restrictive requirements necessary to protect consumers from significant and demonstrable harm.\n\nPrinciple 4. Individuals with criminal records should be encouraged to submit to the appropriate licensure board a preliminary application for an occupational license for a determination as to whether the criminal record would preclude their attainment of the appropriate occupational license.\n\nPrinciple 5. A State, territorial, or tribal government should issue an occupational license to a person in the discipline applied for and at the same level of practice if the individual satisfies four requirements:\n\n(a) the individual holds an occupational license for that discipline from another jurisdiction in the United States and is in good standing;\n\n(b) the individual verifies having met, as applicable, the minimum examination, education, work, or clinical-supervision requirements imposed by the State, territory, or tribe;\n\n(c) the individual:\n\n(i) has not had the license previously revoked or suspended;\n\n(ii) has not been disciplined related to the license by any other regulating entity; and\n\n(iii) is not subject to any pending complaint, allegation, or investigation related to the license; and\n\n(d) the individual pays all applicable fees required to obtain the new license.\n\nPrinciple 6. Accommodations should be made for any applicant for an occupational license who is the spouse of an active duty member of the uniformed services and who is relocating with the member due to the member's official permanent change of station orders.\n\nSec. 2. Review of and Report on Authorities, Regulations, Guidance, and Policies. The head of each executive department and agency (agency) shall, within 90 days of the date of this order and every 2 years thereafter:\n\n(a) review the agency's authorities, regulations, guidance, and polices to identify changes necessary to ensure alignment with the principles set forth in section 1 of this order; and\n\n(b) submit a report to the Director of the Office of Management and Budget (Director of OMB), the Assistant to the President for Domestic Policy, and the Assistant to the President and Director of Intergovernmental Affairs (Director of IGA) identifying all necessary changes identified pursuant to subsection (a) of this section.\n\nSec. 3. Identification and Report of Opportunities to Encourage Occupational Regulation Reform. (a) Within 90 days of the date of this order, and every 2 years thereafter, the head of each agency shall submit a report to the Director of OMB, the Assistant to the President for Domestic Policy, and the Director of IGA identifying a list of recommended actions available to any and all agencies to recognize and reward State, territorial, and tribal governments that have in place policies and procedures regarding occupational regulation that are consistent with the principles set forth in section 1 of this order; and\n\n(b) Within 120 days of the date of this order, and every 2 years thereafter, the Assistant to the President for Domestic Policy, in consultation with the Secretary of Commerce, the Secretary of Labor, the Director of OMB, the Administrator of the Small Business Administration, the Director of IGA, and the heads of other agencies and offices as appropriate, shall submit a report to the President identifying:\n\n(i) recommended changes to Federal law, regulations, guidance, and other policies to ensure alignment with the principles set forth in section 1 of this order;\n\n(ii) recommended actions to be taken by agencies to recognize and reward State, territorial, and tribal governments that have in place policies and procedures regarding occupational regulation that are consistent with the principles set forth in section 1 of this order; and\n\n(iii) a list of criteria that may be used to evaluate whether a State, territorial, or tribal government has in place policies and procedures that are consistent with the principles set forth in section 1 of this order.\n\nSec. 4. Implementation of Recommendations to Recognize and Reward State, Territorial, and Tribal Regulatory Reform. (a) Within 180 days of the date of this order, and every 2 years thereafter, the Administrator of the Small Business Administration, in consultation with the Secretary of Commerce, the Secretary of Labor, the Secretary of Health and Human Services, and the heads of other agencies as appropriate, shall seek and report on information from State, territorial, and tribal governments regarding whether they have in place policies and procedures consistent with the principles set forth in section 1 of this order and shall make the report publicly available, including on agencies' websites. The information sought shall be consistent with the criteria identified as required by section 3(b)(iii) of this order.\n\n(b) Consistent with applicable law, and to the extent that the President approves any of the actions recommended pursuant to section 3(b)(ii) of this order, agencies shall implement such actions for the purpose of recognizing and rewarding a State, territorial, or tribal government that has in place policies and procedures regarding occupational regulation that are consistent with the principles set forth in section 1 of this order.\n\nSec. 5. Definitions. For the purposes of this order:\n\n(a) \"Active supervision\" means:\n\n(i) reviewing proposed occupational licensure board rules, policies, or other regulatory actions that may restrict market competition prior to issuance;\n\n(ii) ensuring that any entity seeking to impose occupational licensing criteria adopts the criteria that are least restrictive to competition sufficient to protect consumers from significant and demonstrable harm to their health or safety; and\n\n(iii) analyzing, where information is readily available, the effects of proposed rules, policies, and other regulatory actions on employment opportunities, consumer costs, market competition, and administrative costs.\n\n(b) \"Agency\" has the meaning given that term in section 3502(1) of title 44, United States Code, except that the term does not include the agencies described in section 3502(5) of title 44, United States Code, other than the Bureau of Consumer Financial Protection.\n\n(c) \"Occupational license\" means a license, registration, or certification without which an individual lacks the legal permission of a State, local, territorial, or tribal government to perform certain defined services for compensation.\n\n(d) \"Occupational regulation\" includes:\n\n(i) licensing or government certification, by which a government body requires personal qualifications in order to be permitted to practice an occupation; and\n\n(ii) registration, bonding, or inspections, by which a government body does not require personal qualifications in order to be permitted to practice an occupation.\n\nSec. 6. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nDecember 14, 2020.","chunks":{"1":"By the authority vested nsure board rules, policies, or other regulatory actions that may restrict market competition prior to issuance; (ii) ensuring that any entity seeking to impose occupational licensing criteria adopts the criteria that are least restrictive to competition sufficient to protect consumers from significant and demonstrable harm to their health or safety; and (iii) analyzing, where information is readily available, the effects of proposed rules, policies, and other regulatory actions on employment opportunities, consumer costs, market competition, and administrative costs. (b) \"Agency\" has the meaning given that term in section 3502(1) of title 44, United States Code, except that the term does not include the agencies described in section 3502(5) of title 44, United States Code, other than the Bureau of Consumer Financial Protection. (c) \"Occupational license\" means a license, registration, or certification without which an individual lacks the legal permission of a State, local, territorial, or tribal government to perform certain defined services for compensation. (d) \"Occupational regulation\" includes: (i) licensing or government certification, by which a government body requires personal qualifications in order to be permitted to practice an occupation; and (ii) registration, bonding, or inspections, by which a government body does not require personal qualifications in order to be permitted to practice an occupation. Sec. 6. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO25":{"metadata":{"president":"Donald J. Trump","date":"July 19, 2018","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to provide a coordinated process for developing a national strategy to ensure that America's students and workers have access to affordable, relevant, and innovative education and job training that will equip them to compete and win in the global economy, and for monitoring the implementation of that strategy, it is hereby ordered as follows:\n\nSection 1. Purpose. Our Nation is facing a skills crisis. There are currently more than 6.7 million unfilled jobs in the United States, and American workers, who are our country's most valuable resource, need the skills training to fill them. At the same time, the economy is changing at a rapid pace because of the technology, automation, and artificial intelligence that is shaping many industries, from manufacturing to healthcare to retail. For too long, our country's education and job training programs have prepared Americans for the economy of the past. The rapidly changing digital economy requires the United States to view education and training as encompassing more than a single period of time in a traditional classroom. We need to prepare Americans for the 21st century economy and the emerging industries of the future. We must foster an environment of lifelong learning and skills-based training, and cultivate a demand-driven approach to workforce development. My Administration will champion effective, results-driven education and training so that American students and workers can obtain the skills they need to succeed in the jobs of today and of the future.\n\nSec. 2. Policy. It shall be the policy of the executive branch to work with private employers, educational institutions, labor unions, other non-profit organizations, and State, territorial, tribal, and local governments to update and reshape our education and job training landscape so that it better meets the needs of American students, workers, and businesses.\n\nSec. 3. Establishment and Composition of the President's National Council for the American Worker. (a) There is hereby established the President's National Council for the American Worker (Council), co-chaired by the Secretary of Commerce, the Secretary of Labor, the Assistant to the President for Domestic Policy, and the Advisor to the President overseeing the Office of Economic Initiatives (Co-Chairs).\n\n(b) In addition to the Co-Chairs, the Council shall include the following officials, or their designees:\n\n(i) the Secretary of the Treasury;\n\n(ii) the Secretary of Education;\n\n(iii) the Secretary of Veterans Affairs;\n\n(iv) the Director of the Office of Management and Budget;\n\n(v) the Administrator of the Small Business Administration;\n\n(vi) the Assistant to the President and Deputy Chief of Staff for Policy Coordination;\n\n(vii) the Director of the National Economic Council; (viii) the Chairman of the Council of Economic Advisers;\n\n(ix) the Director of the National Science Foundation; and\n\n(x) the Director of the Office of Science and Technology Policy.\n\nSec. 4. Additional Invitees. As appropriate and consistent with applicable law, the Co-Chairs may, from time to time, invite the heads of other executive departments and agencies (agencies), or other senior officials in the White House Office, to attend meetings of the Council.\n\nSec. 5. Council Meetings. The Co-Chairs shall convene meetings of the Council at least once per quarter.\n\nSec. 6. Functions of the Council. (a) The Council shall develop recommendations for the President on policy and strategy related to the American workforce, and perform such other duties as the President may from time to time prescribe.\n\n(b) The Council shall develop recommendations for:\n\n(i) a national strategy for empowering American workers, which shall include recommendations on how the Federal Government can work with private employers, educational institutions, labor unions, other non-profit organizations, and State, territorial, tribal, and local governments to create and promote workforce development strategies that provide evidence-based, affordable education and skills-based training for youth and adults to prepare them for the jobs of today and of the future;\n\n(ii) fostering close coordination, cooperation, and information exchange among the Federal Government, private employers, educational institutions, labor unions, other non-profit organizations, and State, territorial, tribal, and local governments as related to issues concerning the education and training of Americans; and\n\n(iii) working with agencies to foster consistency in implementing policies and actions developed under this order.\n\nSec. 7. Initial Tasks of Council. Within 180 days of the date of this order, the Council shall:\n\n(a) develop a national campaign to raise awareness of matters considered by the Council, such as the urgency of the skills crisis; the importance of science, technology, engineering, and mathematics education; the creation of new industries and job opportunities spurred by emerging technologies, such as artificial intelligence; the nature of many careers in the trades and manufacturing; and the need for companies to invest in the training and re-training of their workers and more clearly define the skills and competencies that jobs require;\n\n(b) develop a plan for recognizing companies that demonstrate excellence in workplace education, training, and re-training policies and investments, in order to galvanize industries to identify and adopt best practices, innovate their workplace policies, and invest in their workforces;\n\n(c) examine how the Congress and the executive branch can work with private employers, educational institutions, labor unions, other non-profit organizations, and State, territorial, tribal, and local governments to support the implementation of recommendations from the Task Force on Apprenticeship Expansion established in Executive Order 13801 of June 15, 2017 (Expanding Apprenticeships in America), including recommendations related to:\n\n(i) developing and increasing the use of industry-recognized, portable credentials by experienced workers seeking further education, displaced workers seeking skills to secure new jobs, students enrolled in postsecondary education, and younger Americans who are exploring career and education options before entering the workforce;\n\n(ii) increasing apprenticeship, earn-and-learn, and work-based learning opportunities;\n\n(iii) expanding the use of online learning resources; and\n\n(iv) increasing the number of partnerships around the country between companies, local educational institutions, and other entities, including local governments, labor unions, workforce development boards, and other non-profit organizations, in an effort to understand the types of skills that are required by employers so that educational institutions can recalibrate their efforts toward the development and delivery of more effective training programs.\n\n(d) consider the recommendations of the American Workforce Policy Advisory Board (Board) established in section 8 of this order and, as appropriate, adopt recommendations that would significantly advance the objectives of the Council. The Council shall continue to consider and, as appropriate, adopt the Board's recommendations beyond the initial 180-day period provided by this section;\n\n(e) recommend a specific course of action for increasing transparency related to education and job-training program options, including those offered at 4-year institutions and community colleges. The Council shall also propose ways to increase access to available job data, including data on industries and geographic locations with the greatest numbers of open jobs and projected future opportunities, as well as the underlying skills required to fill open jobs, so that American students and workers can make the most informed decisions possible regarding their education, job selection, and career paths. The Council shall also propose strategies for how best to use existing data tools to support informed decision making for American students and workers;\n\n(f) develop recommendations on how the public sector should engage with the private sector in worker re-training, including through the use of online learning resources. In developing these recommendations, the Council shall examine existing private sector efforts to re-train workers or develop them professionally, and consider how investments in worker training and re-training programs compare to investments in other human-resource related areas, such as recruitment, health benefits, and retirement benefits; and\n\n(g) examine public and private-sector expenditures, including tax expenditures, related to providing Americans with knowledge and skills that will enable them to succeed in the workplace at various stages of life (such as during primary and secondary education, postsecondary education, continuing professional development, and re-training), consider the effectiveness of those expenditures, and make suggestions for reforms in order to serve American workers and students better.\n\nSec. 8. Establishment of the American Workforce Policy Advisory Board. (a) There is hereby established the American Workforce Policy Advisory Board.\n\n(b) The Board shall be composed and function as follows:\n\n(i) The Board shall be composed of the Secretary of Commerce and the Advisor to the President overseeing the Office of Economic Initiatives, and up to 25 members\n\nappointed by the President from among citizens outside the Federal Government, and shall include individuals chosen to serve as representatives of the various sectors of the economy, including the private sector, employers, educational institutions, and States, to offer diverse perspectives on how the Federal Government can improve education, training, and re-training for American workers;\n\n(ii) The Board shall be co-chaired by the Secretary of Commerce and the Advisor to the President overseeing the Office of Economic Initiatives;\n\n(iii) Members appointed to the Board shall serve for a term of 2 years. If the term of the Board established in subsection (a) of this section is extended, members shall be eligible for reappointment, and may continue to serve after the expiration of their terms until the appointment of a successor;\n\n(iv) The Board shall advise the Council on the workforce policy of the United States. Specific activities of the Board shall include, to the extent permitted by law, recommending steps to encourage the private sector and educational institutions to combat the skills crisis by investing in and increasing demand-driven education, training, and re-training, including through apprenticeships and work-based learning opportunities;\n\n(v) Members of the Board shall serve without any compensation for their work on the Board. Members of the Board, while engaged in the work of the Board, may be allowed travel expenses, including per diem in lieu of subsistence, to the extent permitted by law for persons serving intermittently in Government service (5 U.S.C. 5701-5707), consistent with the availability of funds;\n\n(vi) The Board shall terminate 2 years after the date of this order, unless extended by the President; and\n\n(vii) Insofar as the Federal Advisory Committee Act, as amended (5 U.S.C. App.), may apply to the Board, any functions of the President under that Act, except for those in section 6 and section 14 of that Act, shall be performed by the Secretary of Commerce, in accordance with the guidelines issued by the Administrator of General Services.\n\nSec. 9. Administrative Provisions. (a) The Department of Commerce shall provide the Council and the Board with funding and administrative support as may be necessary for the performance of their functions.\n\n(b) The Secretary of Commerce, in consultation with the Co-Chairs of the Council, shall designate an official to serve as Executive Director, to coordinate the day-to-day functions of the Council.\n\n(c) To the extent permitted by law, including the Economy Act (31 U.S.C. 1535), and subject to the availability of appropriations, other agencies may detail staff to the Council, or otherwise provide administrative support, in order to advance the Council's functions.\n\n(d) Agencies shall cooperate with the Council and provide such information regarding its current and planned activities related to policies that affect the American workforce as the Co-Chairs shall reasonably request, to the extent permitted by law.\n\nSec. 10. Termination of Council. The Council shall terminate 2 years after the date of this order, unless extended by the President. Sec. 11. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nJuly 19, 2018.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to provide a coordinated process for developing a national strategy to ensure that America's students and workers have access to affordable, relevant, and innovative education and job training that will equip them to compete and win in the global economy, and for monitoring the implementation of that strategy, it is hereby ordered as follows: Section 1. Purpose. Our Nation is facing a skills crisis. There are currently more than 6.7 million unfilled jobs in the United States, and American workers, who are our country's most valuable resource, need the skills training to fill them. At the same time, the economy is changing at a rapid pace because of the technology, automation, and artificial intelligence that is shaping many industries, from manufacturing to healthcare to retail. For too long, our country's education and job training programs have prepared Americans for the economy of the past. The rapidly changing digital economy requires the United States to view education and training as encompassing more than a single period of time in a traditional classroom. We need to prepare Americans
