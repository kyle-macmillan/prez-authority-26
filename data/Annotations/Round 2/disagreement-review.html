e clearly consistent with the interests of the national security, there shall be conducted with respect to such person a full field investigation, or such less investigation as shall be sufficient to enable the head of the department or agency concerned to determine whether retention of such person is clearly consistent with the interests of the national security.","2":"(b) The head of any department or agency shall designate, or cause to be designated, any position within his department or agency the occupant of which could bring about, by virtue of the nature of the position, a material adverse effect on the national security as a sensitive position. Any position so designated shall be filled or occupied only by a person with respect to whom a full field investigation has been conducted: Provided, that a person occupying a sensitive position at the time it is designated as such may continue to occupy such position pending the completion of a full field investigation, subject to the other provisions of this order: And provided further, that in case of emergency a sensitive position may be filled for a limited period by a person with respect to whom a full field preappointment investigation has not been completed if the head of the department or agency concerned finds that such action is necessary in the national interest, which finding shall be made a part of the records of such department or agency. SEC. 4.","3":"The head of each department and agency shall review, or cause to be reviewed, the cases of all civilian officers and employees with respect to whom there has been conducted a full field investigation under Executive Order No. 9835 of March 21, 1947, and, after such further investigation as may be appropriate, shall re-adjudicate, or cause to be re-adjudicated, in accordance with the said act of August 26, 1950, such of those cases as have not been adjudicated under a security standard commensurate with that established under this order. SEC. 5.","4":"Whenever there is developed or received by any department or agency information indicating that the retention in employment of any officer or employee of the Government may not be clearly consistent with the interests of the national security, such information shall be forwarded to the head of the employing department or agency or his representative, who, after such investigation as may be appropriate, shall review, or cause to be reviewed, and, where necessary, re-adjudicate, or cause to be re-adjudicated, in accordance with the raid act of August 26, 1950, the case of such officer or employee. SEC. 6.","5":"Should there develop at any stage of investigation information indicating that the employment of any officer or employee of the Government may not be clearly consistent with the interests of the national security, the head of the department or agency concerned or his representative shall immediately suspend the employment of the person involved if he deems such suspension necessary in the interests of the national security and, following such investigation and review as he deems necessary, the head of the department or agency concerned shall terminate the employment of such suspended officer or employee whenever he shall determine such termination necessary or advisable in the interests of the national security, in accordance with the said act of August 26, 1950. SEC. 7. Any person whose employment is suspended or terminated under the authority granted to heads of departments and agencies by or in accordance with the said act of August 26, 1950, or pursuant to the said Executive Order No. 9835 or any other security or loyalty program relating to officers or employees of the Government, shall not be reinstated or restored to duty or reemployed in the same department or agency and shall not be reemployed in any other department or agency, unless the head of the department or agency concerned finds that such reinstatement, restoration, or reemployment is clearly consistent with the interests of the national security, which finding shall be made a part of the records of such department or agency: Provided, that no person whose employment has been terminated under such authority thereafter may be employed by any other department or agency except after a determination by the Civil Service Commission that such person is eligible for such employment. SEC. 8. (a) The investigations conducted pursuant to this order shall be designed to develop information as to whether the employment or retention in employment in the Federal service of the person being investigated is clearly consistent with the interests of the national security. Such information shall relate, but shall not be limited, to the following: (1) Depending on the relation of the Government employment to the national security: (i) Any behavior, activities, or associations which tend to show that the individual is not reliable or trustworthy. (ii) Any deliberate misrepresentations, falsifications, or omissions of material facts. (iii) Any criminal, infamous, dishonest, immoral, or notoriously disgraceful conduct, habitual use of intoxicants to excess, drug addiction, or sexual perversion. (iv) An adjudication of insanity, or treatment for serious mental or neurological disorder without satisfactory evidence of cure. (v) Any facts which furnish reason to believe that the individual may be subjected to coercion, influence, or pressure which may cause him to act contrary to the best interests of the national security. (2) Commission of any act of sabotage, espionage, treason, or sedition, or attempts thereat or preparation therefor, or conspiring with, or aiding or abetting, another to commit or attempt to commit any act of sabotage, espionage, treason, or sedition. (3) Establishing or continuing a sympathetic association with a saboteur, spy, traitor, seditionist, anarchist, or revolutionist, or with an espionage or other secret agent or representative of a foreign nation, or any representative of a foreign nation whose interests may be inimical to the interests of the United States, or with any person who advocates the use of force or violence to overthrow the government of the United States or the alteration of the form of government of the United States by unconstitutional means. (4) Advocacy of use of force or violence to overthrow the government of the United States, or of the alteration of the form of government of the United States by unconstitutional means. (5) Membership in, or affiliation or sympathetic association with, any foreign or domestic organization, association, movement, group, or combination of persons which is totalitarian, Fascist, Communist, or subversive, or which has adopted, or shows, a policy of advocating or approving the commission of acts of force or violence to deny other persons their rights under the Constitution of the United States, or which seeks to alter the form of government of the United States by unconstitutional means. (6) Intentional, unauthorized disclosure to any person of security information, or of other information disclosure of which is prohibited by law, or willful violation or disregard of security regulations. (7) Performing or attempting to perform his duties, or otherwise acting, so as to serve the interests of another government in preference to the interests of the United States. (b) The investigation of persons entering or employed in the competitive service shall primarily be the responsibility of the Civil Service Commission, except in cases in which the head of a department or agency assumes that responsibility pursuant to law or by agreement with the Commission. The Commission shall furnish a full investigative report to the department or agency concerned. (c) The investigation of persons (including consultants, however employed), entering employment of, or employed by, the Government other than in the competitive service shall primarily be the responsibility of the employing department or agency. Departments and agencies without investigative facilities may use the investigative facilities of the Civil Service Commission, and other departments and agencies may use such facilities under agreement with the Commission. (d) There shall be referred promptly to the Federal Bureau of Investigation all investigations being conducted by any other agencies which develop information indicating that an individual may have been subjected to coercion, influence, or pressure to act contrary to the interests of the national security, or information relating to any of the matters described in subdivisions (2) through (7) of subsection (a) of this section.","6":"In cases so referred to it, the Federal Bureau of Investigation shall make a full field investigation. SEC. 9. (a) There shall be established and maintained in the Civil Service Commission a security-investigations index covering all persons as to whom security investigations have been conducted by any department or agency of the Government under this order. The central index established and maintained by the Commission under Executive Order No. 9835 of March 21, 1947, shall be made a part of the security-investigations index. The security-investigations index shall contain the name of each person investigated, adequate identifying information concerning each such person, and a reference to each department and agency which has conducted an investigation concerning the person involved or has suspended or terminated the employment of such person under the authority granted to heads of departments and agencies by or in accordance with the said act of August 26, 1950. (b) The heads of all departments and agencies shall furnish promptly to the Civil Service Commission information appropriate for the establishment and maintenance of the security-investigations index. (c) The reports and other investigative material and information developed by investigations conducted pursuant to any statute, order, or program described in section 7 of this order shall remain the property of the investigative agencies conducting the investigations, but may, subject to considerations of the national security, be retained by the department or agency concerned. Such reports and other investigative material and information shall be maintained in confidence, and no access shall be given thereto except, with the consent of the investigative agency concerned, to other departments and agencies conducting security programs under the authority granted by or in accordance with the said act of August 26, 1950, as may be required for the efficient conduct of Government business.","7":"Executive Order No. 9835 of March 21, 1947, as amended, is hereby revoked. For the purposes described In section 11 hereof the Loyalty Review Board and the regional loyalty boards of the Civil Service Commission shall continue to exist and function for a period of one hundred and twenty days from the effective date of this order, and the Department of Justice shall continue to furnish the information described in paragraph 3 of Part III of the said Executive Order No. 9835, but directly to the head of each department and agency. SEC. 13. The Attorney General is requested to render to the heads of departments and agencies such advice as may be requisite to enable them to establish and maintain an appropriate employee security program. SEC. 14.","8":"(a) The Civil Service Commission, with the continuing advice and collaboration of representatives of such departments and agencies as the National Security Council may designate, shall make a continuing study of the manner in which this order is being implemented by the departments and agencies of the Government for the purpose of determining: (1) Deficiencies in the department and agency security programs established under this order which are inconsistent with the interests of, or directly or indirectly weaken, the national security. (2) Tendencies in such programs to deny to individual employees fair, impartial, and equitable treatment at the hands of the Government, or rights under the Constitution and laws of the United States or this order. Information affecting any department or agency developed or received during the course of such continuing study shall be furnished immediately to the head of the department or agency concerned.","9":"The Civil Service Commission shall report to the National Security Council, at least semiannually, on the results of such study,","10":"and shall recommend means to correct any such deficiencies or tendencies. (b) All departments and agencies of the Government are directed to cooperate with the Civil Service Commission to facilitate the accomplishment of the responsibilities assigned to it by subsection (a) of this section. SEC. 15. This order shall become effective thirty days after the date hereof."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"3","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"},"9":{"code":"1","diplomacy":"no","military_ops":"no"},"10":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"0","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"},"9":{"code":"1","diplomacy":"no","military_ops":"no"},"10":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"},"9":{"code":"0","diplomacy":"no","military_ops":"no"},"10":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO32":{"metadata":{"president":"William J. Clinton","date":"April 16, 1997","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Highway Safety Act of 1966, 23 U.S.C. 402 and 403, as amended, section 7902(c) of title 5, United States Code, and section 19 of the Occupational Safety and Health Act of 1970, 29 U.S.C. 668, as amended, and in order to require that Federal employees use seat belts while on official business; to require that motor vehicle occupants use seat belts in national park areas and on Department of Defense (\"Defense\") installations; to encourage Tribal Governments to adopt and enforce seat belt policies and programs for occupants of motor vehicles traveling on highways in Indian Country; and to encourage Federal contractors, subcontractors, and grantees to adopt and enforce on-the-job seat belt use policies and programs, it is hereby ordered as follows:\n\nSection 1. Policies. (a) Seat Belt Use by Federal Employees. Each Federal employee occupying any seating position of a motor vehicle on official business, whose seat is equipped with a seat belt, shall have the seat belt properly fastened at all times when the vehicle is in motion.\n\n(b) Seat Belt Use in National Parks and on Defense Installations. Each operator and passenger occupying any seating position of a motor vehicle in a national park area or on a Defense installation, whose seat is equipped with a seat belt or child restraint system, shall have the seat belt or child restraint system properly fastened, as required by law, at all times when the vehicle is in motion.\n\n(c) Seat Belt Use by Government Contractors, Subcontractors and Grantees. Each Federal agency, in contracts, subcontracts, and grants entered into after the date of this order, shall seek to encourage contractors, subcontractors, and grantees to adopt and enforce on-the-job seat belt policies and programs for their employees when operating company-owned, rented, or personally owned vehicles.\n\n(d) Tribal Governments. Tribal Governments are encouraged to adopt and enforce seat belt policies and programs for occupants of motor vehicles traveling on highways in Indian Country that are subject to their jurisdiction.\n\nSec. 2. Scope of Order. All agencies of the executive branch are directed to promulgate rules and take other appropriate measures within their existing programs to further the policies of this order. This includes, but is not limited to, conducting education, awareness, and other appropriate programs for Federal employees about the importance of wearing seat belts and the consequences of not wearing them. It also includes encouraging Federal contractors, subcontractors, and grantees to conduct such programs. In addition, the National Park Service and the Department of Defense are directed to initiate rulemaking to consider regulatory changes with respect to enhanced seat belt use requirements and standard (primary) enforcement of such requirements in national park areas and on Defense installations, consistent with the policies outlined in this order, and to widely publicize and actively enforce such regulations. The term \"agency\" as used in this order means an Executive department, as defined in 5 U.S.C. 101, or any employing unit or authority of the Federal Government, other than those of the legislative and judicial branches.\n\nSec. 3. Coordination. The Secretary of Transportation shall provide leadership and guidance to the heads of executive branch agencies to assist them with the employee seat belt programs established pursuant to this order. The Secretary of Transportation shall also cooperate and consult with the legislative and judicial branches of the Government to encourage and help them to adopt seat belt use programs.\n\nSec. 4. Reporting Requirements. The Secretary of Transportation, in cooperation with the heads of executive branch agencies, and after consultation with the judicial and legislative branches of Government, shall submit an annual report to the President. The report shall include seat belt use rates and statistics of crashes, injuries, and related costs involving Federal employees on official business and occupants of motor vehicles driven in national park areas, on Defense installations, and on highways in Indian Country. The report also shall identify specific agency programs that have made significant progress towards achieving the goals of this order or are notable and deserving of recognition. All agencies of the executive branch shall provide information to, and otherwise cooperate with, the Secretary of Transportation to assist with the preparation of the annual report.\n\nSec. 5. Other Powers and Duties. Nothing in this order shall be construed to impair or alter the powers and duties of the heads of the various Federal agencies pursuant to the Highway Safety Act of 1966, 23 U.S.C. 402 and 403, as amended, section 19 of the Occupational Safety and Health Act of 1970, 29 U.S.C. 668, as amended, or sections 7901, 7902, and 7903 of title 5, United States Code, nor shall it be construed to affect any right, duty, or procedure under the National Labor Relations Act, 29 U.S.C. 151 et seq.\n\nSec. 6. General Provisions. (a) Executive Order 12566 of September 26, 1986, is revoked. To the extent that this order is inconsistent with any provisions of any prior Executive order, this order shall control.\n\n(b) If any provision of this order or application of any such provision is held to be invalid, the remainder of this order and other applications of such provision shall not be affected.\n\n(c) Nothing in this order shall be construed to create a new cause of action against the United States, or to alter in any way the United States liability under the Federal Tort Claims Act, 28 U.S.C. 2671-2680.\n\n(d) The Secretary of Defense shall implement the provisions of this order insofar as practicable for vehicles of the Department of Defense.\n\n(e) The Secretary of the Treasury and the Attorney General, consistent with their protective and law enforcement responsibilities, shall determine the extent to which the requirements of this order apply to the protective and law enforcement activities of their respective agencies.\n\nWilliam J. Clinton\n\nThe White House,\n\nApril 16, 1997.\n\n[Filed with the Office of the Federal Register, 11:04 a.m., April 17, 1997]","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Highway Safety Act of 1966, 23 U.S.C. 402 and 403, as amended, section 7902(c) of title 5, United States Code, and section 19 of the Occupational Safety and Health Act of 1970, 29 U.S.C. 668, as amended, and in order to require that Federal employees use seat belts while on official business; to require that motor vehicle occupants use seat belts in national park areas and on Department of Defense (\"Defense\") installations; to encourage Tribal Governments to adopt and enforce seat belt policies and programs for occupants of motor vehicles traveling on highways in Indian Country; and to encourage Federal contractors, subcontractors, and grantees to adopt and enforce on-the-job seat belt use policies and programs, it is hereby ordered as follows: Section 1. Policies. (a) Seat Belt Use by Federal Employees. Each Federal employee occupying any seating position of a motor vehicle on official business, whose seat is equipped with a seat belt, shall have the seat belt properly fastened at all times when the vehicle is in motion. (b) Seat Belt Use in National Parks and on Defense Installations. Each operator and passenger occupying any seating position of a motor vehicle in a national park area or on a Defense installation, whose seat is equipped with a seat belt or child restraint system, shall have the seat belt or child restraint system properly fastened, as required by law, at all times when the vehicle is in motion. (c) Seat Belt Use by Government Contractors, Subcontractors and Grantees.","2":"Each Federal agency, in contracts, subcontracts, and grants entered into after the date of this order, shall seek to encourage contractors, subcontractors, and grantees to adopt and enforce on-the-job seat belt policies and programs for their employees when operating company-owned, rented, or personally owned vehicles. (d) Tribal Governments. Tribal Governments are encouraged to adopt and enforce seat belt policies and programs for occupants of motor vehicles traveling on highways in Indian Country that are subject to their jurisdiction. Sec. 2. Scope of Order. All agencies of the executive branch are directed to promulgate rules and take other appropriate measures within their existing programs to further the policies of this order. This includes, but is not limited to, conducting education, awareness, and other appropriate programs for Federal employees about the importance of wearing seat belts and the consequences of not wearing them. It also includes encouraging Federal contractors, subcontractors, and grantees to conduct such programs. In addition, the National Park Service and the Department of Defense are directed to initiate rulemaking to consider regulatory changes with respect to enhanced seat belt use requirements and standard (primary) enforcement of such requirements in national park areas and on Defense installations, consistent with the policies outlined in this order, and to widely publicize and actively enforce such regulations. The term \"agency\" as used in this order means an Executive department, as defined in 5 U.S.C. 101, or any employing unit or authority of the Federal Government, other than those of the legislative and judicial branches. Sec. 3. Coordination.","3":"The Secretary of Transportation shall provide leadership and guidance to the heads of executive branch agencies to assist them with the employee seat belt programs established pursuant to this order. The Secretary of Transportation shall also cooperate and consult with the legislative and judicial branches of the Government to encourage and help them to adopt seat belt use programs. Sec. 4. Reporting Requirements.","4":"The Secretary of Transportation, in cooperation with the heads of executive branch agencies, and after consultation with the judicial and legislative branches of Government, shall submit an annual report to the President. The report shall include seat belt use rates and statistics of crashes, injuries, and related costs involving Federal employees on official business and occupants of motor vehicles driven in national park areas, on Defense installations, and on highways in Indian Country.","5":"The report also shall identify specific agency programs that have made significant progress towards achieving the goals of this order or are notable and deserving of recognition.","6":"All agencies of the executive branch shall provide information to, and otherwise cooperate with, the Secretary of Transportation to assist with the preparation of the annual report. Sec. 5. Other Powers and Duties. Nothing in this order shall be construed to impair or alter the powers and duties of the heads of the various Federal agencies pursuant to the Highway Safety Act of 1966, 23 U.S.C. 402 and 403, as amended, section 19 of the Occupational Safety and Health Act of 1970, 29 U.S.C. 668, as amended, or sections 7901, 7902, and 7903 of title 5, United States Code, nor shall it be construed to affect any right, duty, or procedure under the National Labor Relations Act, 29 U.S.C. 151 et seq. Sec. 6. General Provisions. (a) Executive Order 12566 of September 26, 1986, is revoked. To the extent that this order is inconsistent with any provisions of any prior Executive order, this order shall control. (b) If any provision of this order or application of any such provision is held to be invalid, the remainder of this order and other applications of such provision shall not be affected.","7":"(d) The Secretary of Defense shall implement the provisions of this order insofar as practicable for vehicles of the Department of Defense.","8":"(e) The Secretary of the Treasury and the Attorney General, consistent with their protective and law enforcement responsibilities, shall determine the extent to which the requirements of this order apply to the protective and law enforcement activities of their respective agencies."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"4","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO33":{"metadata":{"president":"William J. Clinton","date":"May 06, 1995","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), the National Emergencies Act (50 U.S.C. 1601 et seq.), section 505 of the International Security and Development Cooperation Act of 1985 (22 U.S.C. 2349aa-9) (ISDCA), and section 301 of title 3, United States Code,\n\nI, William J. Clinton, President of the United States of America, in order to take steps with respect to Iran in addition to those set forth in Executive Order No. 12957 of March 15, 1995, to deal with the unusual and extraordinary threat to the national security, foreign policy, and economy of the United States referred to in that order, hereby order:\n\nSection 1. The following are prohibited, except to the extent provided in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of this order: (a) the importation into the United States, or the financing of such importation, of any goods or services of Iranian origin, other than Iranian-origin publications and materials imported for news publications or news broadcast dissemination;\n\n(b) except to the extent provided in section 203(b) of IEEPA (50 U.S.C. 1702(b)), the exportation from the United States to Iran, the Government of Iran, or to any entity owned or controlled by the Government of Iran, or the financing of such exportation, of any goods, technology (including technical data or other information subject to the Export Administration Regulations, 15 CFR Parts 768-799 (1994) (the \"EAR\")), or services;\n\n(c) the reexportation to Iran, the Government of Iran, or to any entity owned or controlled by the Government of Iran, of any goods or technology (including technical data or other information) exported from the United States, the exportation of which to Iran is subject to export license application requirements under any United States regulations in effect immediately prior to the issuance of this order, unless, for goods, they have been (i) substantially transformed outside the United States, or (ii) incorporated into another product outside the United States and constitute less than 10 percent by value of that product exported from a third country;\n\n(d) except to the extent provided in section 203(b) of IEEPA (50 U.S.C. 1702(b)), any transaction, including purchase, sale, transportation, swap, financing, or brokering transactions, by a United States person relating to goods or services of Iranian origin or owned or controlled by the Government of Iran;\n\n(e) any new investment by a United States person in Iran or in property (including entities) owned or controlled by the Government of Iran;\n\n(f) the approval or facilitation by a United States person of the entry into or performance by an entity owned or controlled by a United States person of a transaction or contract (i) prohibited as to United States persons by subsection (c), (d), or (e) above, or (ii) relating to the financing of activities prohibited as to United States persons by those subsections, or of a guaranty of another person's performance of such transaction or contract; and\n\n(g) any transaction by any United States person or within the United States that evades or avoids, or has the purpose of evading or avoiding, or attempts to violate, any of the prohibitions set forth in this order.\n\nSec. 2. For the purposes of this order:\n\n(a) the term \"person\" means an individual or entity;\n\n(b) the term \"entity\" means a partnership, association, trust, joint venture, corporation, or other organization;\n\n(c) the term \"United States person\" means any United States citizen, permanent resident alien, entity organized under the laws of the United States (including foreign branches), or any person in the United States;\n\n(d) the term \"Iran\" means the territory of Iran and any other territory or marine area, including the exclusive economic zone and continental shelf, over which the Government of Iran claims sovereignty, sovereign rights or jurisdiction, provided that the Government of Iran exercises partial or total de facto control over the area or derives a benefit from economic activity in the area pursuant to international arrangements; and\n\n(e) the term \"new investment\" means (i) a commitment or contribution of funds or other assets, or (ii) a loan or other extension of credit.\n\nSec. 3. The Secretary of the Treasury, in consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, the requirement of reports, including reports by United States persons on oil transactions engaged in by their foreign affiliates with Iran or the Government of Iran, and to employ all powers granted to the President by IEEPA and ISDCA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government. All agencies of the United States Government are hereby directed to take all appropriate measures within their authority to carry out the provisions of this order.\n\nSec. 4. The Secretary of the Treasury may not authorize the exportation or reexportation to Iran, the Government of Iran, or an entity owned or controlled by the Government of Iran of any goods, technology, or services subject to export license application requirements of another agency of the United States Government, if authorization of the exportation or reexportation by that agency would be prohibited by law.\n\nSec. 5. Sections 1 and 2 of Executive Order No. 12613 of October 29, 1987, and sections 1 and 2 of Executive Order No. 12957 of March 15, 1995, are hereby revoked to the extent inconsistent with this order. Otherwise, the provisions of this order supplement the provisions of Executive Orders No. 12613 and 12957.\n\nSec. 6. Nothing contained in this order shall create any right or benefit, substantive or procedural, enforceable by any party against the United States, its agencies or instrumentalities, its officers or employees, or any other person.\n\nSec. 7. The measures taken pursuant to this order are in response to actions of the Government of Iran occurring after the conclusion of the 1981 Algiers Accords, and are intended solely as a response to those later actions.\n\nSec. 8. (a) This order is effective at 12:01 a.m., eastern daylight time, on May 7, 1995, except that (i) section 1(b), (c), and (d) of this order shall not apply until 12:01 a.m., eastern daylight time, on June 6, 1995, to trade transactions under contracts in force as of the date of this order if such transactions are authorized pursuant to Federal regulations in force immediately prior to the date of this order (\"existing trade contracts\"), and (ii) letters of credit and other financing agreements with respect to existing trade contracts may be performed pursuant to their terms with respect to underlying trade transactions occurring prior to 12:01 a.m., eastern daylight time, on June 6, 1995.\n\n(b) This order shall be transmitted to the Congress and published in the Federal Register.\n\nWilliam J. Clinton\n\nThe White House,\n\nMay 6, 1995.\n\n[Filed with the Office of the Federal Register, 2:43 p.m., May 8, 1995]","chunks":{"1":"I, William J. Clinton, President of the United States of America, in order to take steps with respect to Iran in addition to those set forth in Executive Order No. 12957 of March 15, 1995, to deal with the unusual and extraordinary threat to the national security, foreign policy, and economy of the United States referred to in that order, hereby order: Section 1. The following are prohibited, except to the extent provided in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of this order: (a) the importation into the United States, or the financing of such importation, of any goods or services of Iranian origin, other than Iranian-origin publications and materials imported for news publications or news broadcast dissemination; (b) except to the extent provided in section 203(b) of IEEPA (50 U.S.C. 1702(b)), the exportation from the United States to Iran, the Government of Iran, or to any entity owned or controlled by the Government of Iran, or the financing of such exportation, of any goods, technology (including technical data or other information subject to the Export Administration Regulations, 15 CFR Parts 768-799 (1994) (the \"EAR\")), or services; (c) the reexportation to Iran, the Government of Iran, or to any entity owned or controlled by the Government of Iran, of any goods or technology (including technical data or other information) exported from the United States, the exportation of which to Iran is subject to export license application requirements under any United States regulations in effect immediately prior to the issuance of this order, unless, for goods, they have been (i) substantially transformed outside the United States, or (ii) incorporated into another product outside the United States and constitute less than 10 percent by value of that product exported from a third country; (d) except to the extent provided in section 203(b) of IEEPA (50 U.S.C. 1702(b)), any transaction, including purchase, sale, transportation, swap, financing, or brokering transactions, by a United States person relating to goods or services of Iranian origin or owned or controlled by the Government of Iran; (e) any new investment by a United States person in Iran or in property (including entities) owned or controlled by the Government of Iran; (f) the approval or facilitation by a United States person of the entry into or performance by an entity owned or controlled by a United States person of a transaction or contract (i) prohibited as to United States persons by subsection (c), (d), or (e) above, or (ii) relating to the financing of activities prohibited as to United States persons by those subsections, or of a guaranty of another person's performance of such transaction or contract; and (g) any transaction by any United States person or within the United States that evades or avoids, or has the purpose of evading or avoiding, or attempts to violate, any of the prohibitions set forth in this order. Sec. 2. For the purposes of this order: (a) the term \"person\" means an individual or entity; (b) the term \"entity\" means a partnership, association, trust, joint venture, corporation, or other organization; (c) the term \"United States person\" means any United States citizen, permanent resident alien, entity organized under the laws of the United States (including foreign branches), or any person in the United States; (d) the term \"Iran\" means the territory of Iran and any other territory or marine area, including the exclusive economic zone and continental shelf, over which the Government of Iran claims sovereignty, sovereign rights or jurisdiction, provided that the Government of Iran exercises partial or total de facto control over the area or derives a benefit from economic activity in the area pursuant to international arrangements; and (e) the term \"new investment\" means (i) a commitment or contribution of funds or other assets, or (ii) a loan or other extension of credit. Sec. 3.","2":"The Secretary of the Treasury, in consultation with the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, the requirement of reports, including reports by United States persons on oil transactions engaged in by their foreign affiliates with Iran or the Government of Iran, and to employ all powers granted to the President by IEEPA and ISDCA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government.","3":"All agencies of the United States Government are hereby directed to take all appropriate measures within their authority to carry out the provisions of this order. Sec. 4. The Secretary of the Treasury may not authorize the exportation or reexportation to Iran, the Government of Iran, or an entity owned or controlled by the Government of Iran of any goods, technology, or services subject to export license application requirements of another agency of the United States Government, if authorization of the exportation or reexportation by that agency would be prohibited by law. Sec. 5.","4":"Sections 1 and 2 of Executive Order No. 12613 of October 29, 1987, and sections 1 and 2 of Executive Order No. 12957 of March 15, 1995, are hereby revoked to the extent inconsistent with this order. Otherwise, the provisions of this order supplement the provisions of Executive Orders No. 12613 and 12957. Sec. 6. Nothing contained in this order shall create any right or benefit, substantive or procedural, enforceable by any party against the United States, its agencies or instrumentalities, its officers or employees, or any other person. Sec. 7. The measures taken pursuant to this order are in response to actions of the Government of Iran occurring after the conclusion of the 1981 Algiers Accords, and are intended solely as a response to those later actions. Sec. 8. (a) This order is effective at 12:01 a.m., eastern daylight time, on May 7, 1995, except that (i) section 1(b), (c), and (d) of this order shall not apply until 12:01 a.m., eastern daylight time, on June 6, 1995, to trade transactions under contracts in force as of the date of this order if such transactions are authorized pursuant to Federal regulations in force immediately prior to the date of this order (\"existing trade contracts\"), and (ii) letters of credit and other financing agreements with respect to existing trade contracts may be performed pursuant to their terms with respect to underlying trade transactions occurring prior to 12:01 a.m., eastern daylight time, on June 6, 1995. (b) This order shall be transmitted to the Congress and published in the Federal Register."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M1":{"metadata":{"president":"George W. Bush","date":"January 25, 2002","type":"memorandum"},"text":"Presidential Determination No. 2002-06\n\nMemorandum for the Secretary of State\n\nSubject: Waiver of Section 907 of the FREEDOM Support Act with Respect to Assistance to the Government of Azerbaijan\n\nPursuant to the authority contained in Title II of the \"Kenneth M. Ludden Foreign Operations, Export Financing, and Related Programs Appropriations Act, 2002\" (Public Law 107-115), I hereby determine and certify that a waiver of section 907 of the FREEDOM Support Act of 1992 (Public Law 102-511):\n\n• is necessary to support U.S. efforts to counter international terrorism; • is necessary to support the operational readiness of U.S. Armed Forces or coalition partners to counter international terrorism; • is important to Azerbaijan's border security; and • will not undermine or hamper ongoing efforts to negotiate a peaceful settlement between Armenia and Azerbaijan or be used for offensive purposes against Armenia.\n\nAccordingly, I hereby waive section 907 of the FREEDOM Support Act.\n\nYou are authorized and directed to notify the Congress of this determination and to arrange for its publication in the Federal Register.\n\nGeorge W. Bush","chunks":{"1":"Pursuant to the authority contained in Title II of the \"Kenneth M. Ludden Foreign Operations, Export Financing, and Related Programs Appropriations Act, 2002\" (Public Law 107-115), I hereby determine and certify that a waiver of section 907 of the FREEDOM Support Act of 1992 (Public Law 102-511): • is necessary to support U.S. efforts to counter international terrorism; • is necessary to support the operational readiness of U.S. Armed Forces or coalition partners to counter international terrorism; • is important to Azerbaijan's border security; and • will not undermine or hamper ongoing efforts to negotiate a peaceful settlement between Armenia and Azerbaijan or be used for offensive purposes against Armenia.","2":"Accordingly, I hereby waive section 907 of the FREEDOM Support Act."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"yes"},"2":{"code":"3","diplomacy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M4":{"metadata":{"president":"Barack Obama","date":"May 10, 2010","type":"memorandum"},"text":"Presidential Determination No. 2010-08\n\nMemorandum for the Secretary of State and the Secretary of Energy\n\nSubject: Agreement Between the Government of the United States of America and the Government of the Russian Federation for Cooperation in the Field of Peaceful Uses of Nuclear Energy\n\nI have considered the proposed Agreement Between the Government of the United States of America and the Government of the Russian Federation for Cooperation in the Field of Peaceful Uses of Nuclear Energy, signed in Moscow on May 6, 2008, along with the views, recommendations, and statements of the interested departments and agencies.\n\nI approve the proposed Agreement and have determined that the performance of the Agreement will promote, and will not constitute an unreasonable risk to, the common defense and security.\n\nThe Secretary of State is authorized and directed to publish this determination in the Federal Register.\n\nBARACK OBAMA","chunks":{"1":"I approve the proposed Agreement and have determined that the performance of the Agreement will promote, and will not constitute an unreasonable risk to, the common defense and security."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"4","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M5":{"metadata":{"president":"Donald J. Trump","date":"April 07, 2020","type":"memorandum"},"text":"Memorandum for the Secretary of Defense and the Secretary of Homeland Security\n\nSubject: Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19\n\nBy the authority vested in me as President by the Constitution and the laws of the United States of America, including the Robert T. Stafford Disaster Relief and Emergency Assistance Act, 42 U.S.C. 5121–5207 (the \"Stafford Act\"), and section 502 of title 32, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy. It is the policy of the United States to take measures to assist State Governors under the Stafford Act in their responses to all threats and hazards to the American people in their respective States. Considering the profound and unique public health risks posed by the ongoing outbreak of COVID–19, the disease caused by the novel (new) coronavirus known as SARS–CoV–2 (\"the virus\"), the need for close cooperation and mutual assistance between the Federal Government and the States is greater than at any time in recent history. In recognizing this serious public health risk, I noted that on March 11, 2020, the World Health Organization announced that the COVID–19 outbreak can be characterized as a pandemic. On March 13, 2020, I declared a national emergency recognizing the threat that SARS–CoV–2 poses to the Nation's healthcare systems. I also determined that same day that the COVID–19 outbreak constituted an emergency, of nationwide scope, pursuant to section 501(b) of the Stafford Act (42 U.S.C. 5191(b)). All States have activated their Emergency Operations Centers and are working to fight the spread of the virus and attend to those who have symptoms or who are already infected with COVID–19. To provide maximum support to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia as they make decisions about the responses required to address local conditions in each of their respective jurisdictions and as they request Federal support under the Stafford Act, I am taking the actions set forth in sections 2 and 3 of this memorandum:\n\nSec. 2. One Hundred Percent Federal Cost Share. To maximize assistance to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia to facilitate Federal support with respect to the use of National Guard units under State control, I am directing the Federal Emergency Management Agency (FEMA) of the Department of Homeland Security to fund 100 percent of the emergency assistance activities associated with preventing, mitigating, and responding to the threat to public health and safety posed by the virus that these States undertake using their National Guard forces, as authorized by sections 403 (42 U.S.C. 5170b) and 503 (42 U.S.C. 5193) of the Stafford Act.\n\nSec. 3. Support of Operations or Missions to Prevent and Respond to the Spread of COVID–19. I am directing the Secretary of Defense, to the maximum extent feasible and consistent with mission requirements (including geographic proximity), to request pursuant to 32 U.S.C. 502(f) that the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia order National Guard forces to perform duty to fulfill mission assignments, on a fullyreimbursable basis, that FEMA issues to the Department of Defense for the purpose of supporting their respective State and local emergency assistance efforts under the Stafford Act.\n\nSec. 4. Termination. The 100 percent Federal cost share for National Guard forces pursuant to this memorandum, and in my prior memoranda dated March 22, 28, and 30, 2020, and April 2, 2020, each titled \"Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19,\" is effective for orders of duty of a duration of 31 days or fewer. These orders of duty must be effective no later than 2 weeks from the date of this memorandum.\n\nSec. 5. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This memorandum shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\n(d) The Secretary of Defense is authorized and directed to publish this memorandum in the Federal Register.\n\nDONALD J. TRUMP","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Robert T. Stafford Disaster Relief and Emergency Assistance Act, 42 U.S.C. 5121–5207 (the \"Stafford Act\"), and section 502 of title 32, United States Code, it is hereby ordered as follows: Section 1. Policy. It is the policy of the United States to take measures to assist State Governors under the Stafford Act in their responses to all threats and hazards to the American people in their respective States. Considering the profound and unique public health risks posed by the ongoing outbreak of COVID–19, the disease caused by the novel (new) coronavirus known as SARS–CoV–2 (\"the virus\"), the need for close cooperation and mutual assistance between the Federal Government and the States is greater than at any time in recent history. In recognizing this serious public health risk, I noted that on March 11, 2020, the World Health Organization announced that the COVID–19 outbreak can be characterized as a pandemic. On March 13, 2020, I declared a national emergency recognizing the threat that SARS–CoV–2 poses to the Nation's healthcare systems. I also determined that same day that the COVID–19 outbreak constituted an emergency, of nationwide scope, pursuant to section 501(b) of the Stafford Act (42 U.S.C. 5191(b)). All States have activated their Emergency Operations Centers and are working to fight the spread of the virus and attend to those who have symptoms or who are already infected with COVID–19. To provide maximum support to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia as they make decisions about the responses required to address local conditions in each of their respective jurisdictions and as they request Federal support under the Stafford Act, I am taking the actions set forth in sections 2 and 3 of this memorandum: Sec. 2. One Hundred Percent Federal Cost Share.","2":"To maximize assistance to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia to facilitate Federal support with respect to the use of National Guard units under State control, I am directing the Federal Emergency Management Agency (FEMA) of the Department of Homeland Security to fund 100 percent of the emergency assistance activities associated with preventing, mitigating, and responding to the threat to public health and safety posed by the virus that these States undertake using their National Guard forces, as authorized by sections 403 (42 U.S.C. 5170b) and 503 (42 U.S.C. 5193) of the Stafford Act. Sec. 3. Support of Operations or Missions to Prevent and Respond to the Spread of COVID–19.","3":"I am directing the Secretary of Defense, to the maximum extent feasible and consistent with mission requirements (including geographic proximity), to request pursuant to 32 U.S.C. 502(f) that the Governors of the States of Arizona,","4":"Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia order National Guard forces to perform duty to fulfill mission assignments, on a fullyreimbursable basis, that FEMA issues to the Department of Defense for the purpose of supporting their respective State and local emergency assistance efforts under the Stafford Act. Sec. 4. Termination. The 100 percent Federal cost share for National Guard forces pursuant to this memorandum, and in my prior memoranda dated March 22, 28, and 30, 2020, and April 2, 2020, each titled \"Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19,\" is effective for orders of duty of a duration of 31 days or fewer. These orders of duty must be effective no later than 2 weeks from the date of this memorandum. Sec. 5. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M8":{"metadata":{"president":"George Bush","date":"June 03, 1992","type":"memorandum"},"text":"Memorandum for the Secretary of State\n\nSubject: Determination Under Section 402(d)(1) of the Trade Act of 1974, as Amended -- Continuation of Waiver Authority\n\nPursuant to the authority vested in me under the Trade Act of 1974, as amended, Public Law 93 - 618, 88 Stat. 1978 (hereinafter \"the Act\"), I determine, pursuant to section 402(d)(1) of the Act (19 U.S.C. 2432(d)(1)), that the further extension of the waiver authority granted by section 402(c) of the Act will substantially promote the objectives of section 402 of the Act. I further determine that the continuation of the waivers applicable to Albania, Armenia, Azerbaijan, Bulgaria, Byelarus, Georgia, Kazakhstan, Kyrgyzstan, Moldova, Mongolia, Romania, Russia, Ukraine, and Uzbekistan will substantially promote the objectives of section 402 of the Act.\n\nYou are authorized and directed to publish this determination in the Federal Register.\n\nGeorge Bush\n\n[Filed with the Office of the Federal Register, 11:56 a.m., June 10, 1992]","chunks":{"1":"that the further extension of the waiver authority granted by section 402(c) of the Act will substantially promote the objectives of section 402 of the Act.","2":"I further determine that the continuation of the waivers applicable to Albania, Armenia, Azerbaijan, Bulgaria, Byelarus, Georgia, Kazakhstan, Kyrgyzstan, Moldova, Mongolia, Romania, Russia, Ukraine, and Uzbekistan will substantially promote the objectives of section 402 of the Act."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M9":{"metadata":{"president":"William J. Clinton","date":"March 30, 1993","type":"memorandum"},"text":"Presidential Determination No. 93-17\n\nMemorandum for the Secretary of State [and] the Secretary of Defense\n\nPursuant to section 599B of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1991 ( Public Law 11-513), as amended by Public Law 102-145, as amended, and by section 580 of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1993 ( Public Law 102-391) (the \"Act\"), I hereby:\n\n(1) direct the additional drawdown for Israel of an estimated $ 491.1 million in defense articles from the stocks of the Department of Defense and defense services of the Department of Defense, as appropriate;\n\n(2) delegate to the Secretary of Defense the notification and reporting functions contained in subsections 599B(c) and (d) of the Act.\n\nThe Secretary of State is authorized and directed to publish this determination in the Federal Register.\n\nWILLIAM J. CLINTON\n\nTHE WHITE HOUSE,\n\nWashington, MARCH 30, 1993.","chunks":{"1":"Pursuant to section 599B of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1991 ( Public Law 11-513), as amended by Public Law 102-145, as amended, and by section 580 of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1993 ( Public Law 102-391) (the \"Act\"), I hereby: (1) direct the additional drawdown for Israel of an estimated $ 491.1 million in defense articles from the stocks of the Department of Defense and defense services of the Department of Defense, as appropriate; (2) delegate to the Secretary of Defense the notification and reporting functions contained in subsections 599B(c) and (d) of the Act."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M13":{"metadata":{"president":"George Bush","date":"April 18, 1991","type":"memorandum"},"text":"Memorandum for the Secretary of State\n\nSubject: Determination Pursuant to Section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as Amended\n\nPursuant to section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that $15,250,000 be made available from the U.S. Emergency Refugee and Migration Assistance Fund (Emergency Fund) to meet the unexpected and urgent needs of refugees and migrants in Africa.\n\nA total of $15,250,000 will be used to respond to urgent unforeseen refugee needs in Africa of which $4,000,000 will be contributed to UNHCR [United Nations High Commissioner for Refugees] for South African repatriation; $10,000,000 will be contributed to international relief organizations for Ethiopian and Somali refugees and returnees in the Horn of Africa; and $1,250,000 will be used for emergency migration needs in Malawi.\n\nYou are directed to inform the appropriate committees of the Congress of this Determination and the obligation of funds under this authority, and to publish this memorandum in the Federal Register.\n\nGeorge Bush\n\n[Filed with the Office of the Federal Register, 11:28 a.m., May 7, 1991]","chunks":{"1":"Pursuant to section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that $15,250,000 be made available from the U.S. Emergency Refugee and Migration Assistance Fund (Emergency Fund) to meet the unexpected and urgent needs of refugees and migrants in Africa. A total of $15,250,000 will be used to respond to urgent unforeseen refugee needs in Africa of which $4,000,000 will be contributed to UNHCR [United Nations High Commissioner for Refugees] for South African repatriation; $10,000,000 will be contributed to international relief organizations for Ethiopian and Somali refugees and returnees in the Horn of Africa; and $1,250,000 will be used for emergency migration needs in Malawi."},"annotations":[{"directive":{"code":null,"diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M15":{"metadata":{"president":"Barack Obama","date":"December 06, 2011","type":"memorandum"},"text":"Memorandum for the Heads of Executive Departments and Agencies\n\nSubject: International Initiatives to Advance the Human Rights of Lesbian, Gay, Bisexual, and Transgender Persons\n\nThe struggle to end discrimination against lesbian, gay, bisexual, and transgender (LGBT) persons is a global challenge, and one that is central to the United States commitment to promoting human rights. I am deeply concerned by the violence and discrimination targeting LGBT persons around the world--whether it is passing laws that criminalize LGBT status, beating citizens simply for joining peaceful LGBT pride celebrations, or killing men, women, and children for their perceived sexual orientation. That is why I declared before heads of state gathered at the United Nations, \"no country should deny people their rights because of who they love, which is why we must stand up for the rights of gays and lesbians everywhere.\" Under my Administration, agencies engaged abroad have already begun taking action to promote the fundamental human rights of LGBT persons everywhere. Our deep commitment to advancing the human rights of all people is strengthened when we as the United States bring our tools to bear to vigorously advance this goal.\n\nBy this memorandum I am directing all agencies engaged abroad to ensure that U.S. diplomacy and foreign assistance promote and protect the human rights of LGBT persons. Specifically, I direct the following actions, consistent with applicable law:\n\nSection 1. Combating Criminalization of LGBT Status or Conduct Abroad. Agencies engaged abroad are directed to strengthen existing efforts to effectively combat the criminalization by foreign governments of LGBT status or conduct and to expand efforts to combat discrimination, homophobia, and intolerance on the basis of LGBT status or conduct.\n\nSec.2.Protecting Vulnerable LGBT Refugees and Asylum Seekers. Those LGBT persons who seek refuge from violence and persecution face daunting challenges. In order to improve protection for LGBT refugees and asylum seekers at all stages of displacement, the Departments of State and Homeland Security shall enhance their ongoing efforts to ensure that LGBT refugees and asylum seekers have equal access to protection and assistance, particularly in countries of first asylum. In addition, the Departments of State, Justice, and Homeland Security shall ensure appropriate training is in place so that relevant Federal Government personnel and key partners can effectively address the protection of LGBT refugees and asylum seekers, including by providing to them adequate assistance and ensuring that the Federal Government has the ability to identify and expedite resettlement of highly vulnerable persons with urgent protection needs.\n\nSec. 3. Foreign Assistance to Protect Human Rights and Advance Nondiscrimination. Agencies involved with foreign aid, assistance, and development shall enhance their ongoing efforts to ensure regular Federal Government engagement with governments, citizens, civil society, and the private sector in order to build respect for the human rights of LGBT persons.\n\nSec.4.Swift and Meaningful U.S. Responses to Human Rights Abuses of LGBT Persons Abroad. The Department of State shall lead a standing group, with appropriate interagency representation, to help ensure the Federal Government's swift and meaningful response to serious incidents that threaten the human rights of LGBT persons abroad.\n\nSec.5.Engaging International Organizations in the Fight Against LGBT Discrimination. Multilateral fora and international organizations are key vehicles to promote respect for the human rights of LGBT persons and to bring global attention to LGBT issues. Building on the State Department's leadership in this area, agencies engaged abroad should strengthen the work they have begun and initiate additional efforts in these multilateral fora and organizations to: counter discrimination on the basis of LGBT status; broaden the number of countries willing to support and defend LGBT issues in the multilateral arena; strengthen the role of civil society advocates on behalf of LGBT issues within and through multilateral fora; and strengthen the policies and programming of multilateral institutions on LGBT issues.\n\nSec. 6. Reporting on Progress. All agencies engaged abroad shall prepare a report within 180 days of the date of this memorandum, and annually thereafter, on their progress toward advancing these initiatives. All such agencies shall submit their reports to the Department of State, which will compile a report on the Federal Government's progress in advancing these initiatives for transmittal to the President.\n\nSec. 7. Definitions. (a) For the purposes of this memorandum, agencies engaged abroad include the Departments of State, the Treasury, Defense, Justice, Agriculture, Commerce, Health and Human Services, and Homeland Security, the United States Agency for International Development (USAID), the Millennium Challenge Corporation, the Export-Import Bank, the United States Trade Representative, and such other agencies as the President may designate.\n\n(b) For the purposes of this memorandum, agencies involved with foreign aid, assistance, and development include the Departments of State, the Treasury, Defense, Justice, Health and Human Services, and Homeland Security, the USAID, the Millennium Challenge Corporation, the Export-Import Bank, the United States Trade Representative, and such other agencies as the President may designate.\n\nThis memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nThe Secretary of State is hereby authorized and directed to publish this memorandum in the Federal Register.\n\nBarack Obama","chunks":{"1":"By this memorandum I am directing all agencies engaged abroad to ensure that U.S. diplomacy and foreign assistance promote and protect the human rights of LGBT persons.","2":"Specifically, I direct the following actions, consistent with applicable law: Section 1. Combating Criminalization of LGBT Status or Conduct Abroad. Agencies engaged abroad are directed to strengthen existing efforts to effectively combat the criminalization by foreign governments of LGBT status or conduct and to expand efforts to combat discrimination, homophobia, and intolerance on the basis of LGBT status or conduct. Sec.2.Protecting Vulnerable LGBT Refugees and Asylum Seekers. Those LGBT persons who seek refuge from violence and persecution face daunting challenges. In order to improve protection for LGBT refugees and asylum seekers at all stages of displacement, the Departments of State and Homeland Security shall enhance their ongoing efforts to ensure that LGBT refugees and asylum seekers have equal access to protection and assistance, particularly in countries of first asylum.","3":"In addition, the Departments of State, Justice, and Homeland Security shall ensure appropriate training is in place so that relevant Federal Government personnel and key partners can effectively address the protection of LGBT refugees and asylum seekers, including by providing to them adequate assistance and ensuring that the Federal Government has the ability to identify and expedite resettlement of highly vulnerable persons with urgent protection needs. Sec. 3. Foreign Assistance to Protect Human Rights and Advance Nondiscrimination. Agencies ture, Commerce, Health and Human Services, and Homeland Security, the United States Agency for International Development (USAID), the Millennium Challenge Corporation, the Export-Import Bank, the United States Trade Representative, and such other agencies as the President may designate. (b) For the purposes of this memorandum, agencies involved with foreign aid, assistance, and development include the Departments of State, the Treasury, Defense, Justice, Health and Human Services, and Homeland Security, the USAID, the Millennium Challenge Corporation, the Export-Import Bank, the United States Trade Representative, and such other agencies as the President may designate."},"annotations":[{"directive":{"code":"1","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"yes","military_ops":"no"},"2":{"code":"1","diplomacy":"yes","military_ops":"no"},"3":{"code":"1","diplomacy":"yes","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"yes","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":null},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M16":{"metadata":{"president":"George W. Bush","date":"April 12, 2002","type":"memorandum"},"text":"Presidential Determination No. 2002-13\n\nMemorandum for the Secretary of State\n\nSubject: Determination Pursuant to Section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as Amended\n\nPursuant to section (2)(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that up to $20 million be made available from the U.S. Emergency Refugee and Migration Assistance Fund for a contribution to the United Nations Relief and Works Agency for Palestine Refugees in the Near East (UNRWA) to meet unexpected urgent refugee needs due to the crisis in the West Bank and Gaza.\n\nYou are authorized and directed to inform the appropriate committees of the Congress of this determination and the obligation of funds under this authority, and to arrange for the publication of this memorandum in the Federal Register.\n\nGEORGE W. BUSH\n\nTHE WHITE HOUSE,\n\nWashington, April 12, 2002.","chunks":{"1":"Pursuant to section (2)(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that up to $20 million be made available from the U.S. Emergency Refugee and Migration Assistance Fund for a contribution to the United Nations Relief and Works Agency for Palestine Refugees in the Near East (UNRWA) to meet unexpected urgent refugee needs due to the crisis in the West Bank and Gaza."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M17":{"metadata":{"president":"William J. Clinton","date":"December 01, 1994","type":"memorandum"},"text":"Presidential Determination No. 95–7\n\nMemorandum for the Secretary of State, the Secretary of Defense\n\nSubject: Resumption of U.S. Drug Interdiction Assistance to the Government of Colombia\n\nPursuant to the authority vested in me by section 1012 of the National Defense Authorization Act for Fiscal Year 1995, Public Law 103–337, I hereby determine with respect to Colombia that: (a) interdiction of aircraft reasonably suspected to be primarily engaged in illicit drug trafficking in that country's airspace is necessary because of the extraordinary threat posed by illicit drug trafficking to the national security of that country; and (b) that country has appropriate procedures in place to protect against innocent loss of life in the air and on the ground in connection with such interdiction, which shall at a minimum include effective means to identify and warn an aircraft before the use of force is directed against the aircraft.\n\nThe Secretary of State is authorized and directed to publish this determination in the Federal Register.\n\nWilliam J. Clinton","chunks":{"1":"Pursuant to the authority vested in me by section 1012 of the National Defense Authorization Act for Fiscal Year 1995, Public Law 103–337, I hereby determine with respect to Colombia that: (a) interdiction of aircraft reasonably suspected to be primarily engaged in illicit drug trafficking in that country's airspace is necessary because of the extraordinary threat posed by illicit drug trafficking to the national security of that country; and (b) that country has appropriate procedures in place to protect against innocent loss of life in the air and on the ground in connection with such interdiction, which shall at a minimum include effective means to identify and warn an aircraft before the use of force is directed against the aircraft."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"yes"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"3","diplom
