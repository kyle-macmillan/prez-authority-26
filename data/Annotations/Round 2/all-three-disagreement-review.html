<script id="payload-data" type="application/json">{"groups":[{"label":"Disagreements","docs":["EO2","EO3","EO6","EO11","EO30","M4","M5","L3","L8","L11","L22","P53"]}],"annotators":["Claire","KyleM","Thomas Weil"],"docs":{"EO2":{"metadata":{"president":"Jimmy Carter","date":"October 03, 1977","type":"executive_order"},"text":"By virtue of the authority vested in me by the Constitution and statutes of the United States of America, and as President of the United States of America, Executive Order No. 111'83, as amended, is further amended as follows:\n\nSECTION 1. The word \"young\" is deleted wherever it appears in the preamble and in Section 2(a).\n\nSEC. 2. Section 2(b) (2) is amended to read:\n\n\"(2) Are presently early in their chosen careers and show exceptional promise of future development;\".\n\nSEC. 3. Section 2(b) (4) is deleted, the word \"and\" is added at the end of Section 2(b) (3), and Section 2(b)(5) is redesignated as Section 2 (b) (4).\n\nSEC. 4. Section 2(c) is amended by adding \"age\" after \"national origin,\".\n\nJIMMY CARTER\n\nThe White House,\n\nOctober 3, 1977.\n\n[Filed with the Office of the Federal Register, ll: 15 a.m., October 4, 1977]","chunks":{"3":"Section 2(c) is amended by adding \"age\" after \"national origin,\".","2":"Section 2(b) (2) is amended to read: \"(2) Are presently early in their chosen careers and show exceptional promise of future development;\". SEC. 3. Section 2(b) (4) is deleted, the word \"and\" is added at the end of Section 2(b) (3), and Section 2(b)(5) is redesignated as Section 2 (b) (4). SEC. 4.","1":"By virtue of the authority vested in me by the Constitution and statutes of the United States of America, and as President of the United States of America, Executive Order No. 111'83, as amended, is further amended as follows: SECTION 1. The word \"young\" is deleted wherever it appears in the preamble and in Section 2(a). SEC. 2."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"3","diplomacy":"no","military_ops":"no"},"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"1","diplomacy":"no","military_ops":"no"},"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"4","diplomacy":"no","military_ops":"no"},"1":{"code":"4","diplomacy":"no","military_ops":"no"},"2":{"code":"4","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO3":{"metadata":{"president":"John F. Kennedy","date":"June 22, 1963","type":"executive_order"},"text":"WHEREAS it is the policy of the United States Government to encourage by affirmative action the elimination of discrimination because of race, creed, color, or national origin in employment on work involving Federal financial assistance, to the end that employment opportunities created by Federal funds shall be equally available to all qualified persons; and\n\nWHEREAS Executive Order No. 10925 of March 6, 1961, 26 F.R. 1977, reaffirmed the policy of requiring the inclusion of non-discrimination provisions in Government contracts and established the President's Committee on Equal Employment Opportunity to administer the program for obtaining adherence to and compliance with such provisions; and\n\nWHEREAS construction under programs of Federal grants, loans, and other forms of financial assistance to State and local governments and to private organizations creates substantial employment opportunities; and\n\nWHEREAS it is deemed desirable and appropriate to extend the existing program for nondiscrimination in employment in Government contracts established by Executive Order No. 10925 to include certain contracts for construction financed with assistance from the Federal Government; and\n\nWHEREAS it is also desirable to amend Executive Order No. 10925 in certain respects in order to clarify the authority of the President's Committee on Equal Employment Opportunity:\n\nNOW, THEREFORE, by virtue of the authority vested in me as President of the United States by the Constitution and statutes of the United States, it is ordered as follows:\n\nPART I--NON-DISCRIMINATION PROVISIONS IN FEDERALLY ASSISTED CONSTRUCTION CONTRACTS\n\nSECTION 101. Each executive department and agency which administers a program involving Federal financial assistance shall, insofar as it may be consistent with law, require as a condition for the approval of any grant, contract, loan, insurance or guarantee there under which may involve a construction contract that the applicant for Federal assistance undertake and agree to incorporate, or cause to be incorporated, into all construction contracts paid for in whole or in part with funds obtained from the Federal Government or borrowed on the Credit of the Federal Government pursuant to such grant, contract, loan, insurance or guarantee, or undertaken pursuant to any Federal program involving such grant, contract, loan, insurance or guarantee, the provisions prescribed for Government contracts by section 301 of Executive Order No. 10925 or such modification thereof, preserving in substance the contractor's obligations thereunder, as may be approved by the President's Committee on Equal Employment Opportunity (the \"Committee\"), together with such additional provisions as the Committee deems appropriate to establish and protect the interest of the United States in the enforcement of these obligations. Each such applicant shall also undertake and agree (i) to assist and cooperate actively with the administering department or agency and the Committee in obtaining the compliance of contractors and subcontractors with said contract provisions and with obtain and to furnish to the administering department or agency and the rules, regulations, and relevant orders of the Committee, (ii) to obtain and to furnish to the administering agency and to the Committee such information as they may require for the supervision of such compliance, (iii) to enforce the obligations of contractors and subcontractors under such provisions, rules, regulations, and orders, (iv) to carry out sanctions and penalties for violation of such obligations imposed upon contractors and subcontractors by the Committee or the administering department or agency pursuant to Part III, Subpart D, of Executive Order No. 10925, and (v) to refrain from entering into any contract subject to this order, or extension or other modification of such a contract with a contractor debarred from Government contracts under Part III, Subpart D, of Executive Order No. 10925.\n\nSEC. 102. (a) \"Construction contract\" as used herein means any contract for the construction, rehabilitation, alteration, conversion, extension, or repair of buildings, highways, or other improvements to real property.\n\n(b) The provisions of Part III of Executive Order No. 10925 shall apply to such construction contracts, and for purposes of such application the administering department or agency shall be considered the contracting agency referred to therein.\n\n(c) The term \"applicant\" as used herein means an applicant for Federal assistance or, as determined by agency regulation, other program participant, with respect to whom an application for any grant, contract, loan, insurance or guarantee is not finally acted upon prior to the effective date of this part, and it includes such an applicant after he becomes a recipient of such Federal assistance.\n\nSEC. 103. (a) Each administering department and agency shall be primarily responsible for obtaining the compliance of such applicants with their undertakings hereunder and shall comply with the rules of the Committee in the discharge of this responsibility. Each administering department and agency is directed to cooperate with the Committee, and to furnish the Committee such information and assistance as it may require in the performance of its functions under this order.\n\n(b) In the event an applicant fails and refuses to comply with his undertakings, the administering department or agency may, and upon the recommendation of the Committee, shall take any or all of the following actions:\n\n(1) cancel, terminate, or suspend in whole or in part the agreement or contract with such applicant with respect to which the failure and refusal occurred;\n\n(2) refrain from extending any further assistance under any of its programs subject to this order until satisfactory assurance of future compliance has been received from such applicant;\n\n(3) refer the case to the Department of Justice for appropriate legal proceedings.\n\n(c) No action shall be taken with respect to an applicant pursuant to paragraph (1) or (2)of subsection (b) without notice and hearing before the administering department or agency or the Committee, in accordance with the rules and regulations of the Committee.\n\nSEC. 104. The Committee may, by rule, regulation, or order, exempt all or part of any program of an administering agency from the requirements of this order when it deems that special circumstances in the national interest so require.\n\nSEC. 105. The Committee shall adopt such rules and regulations and issue such orders as it deems necessary and appropriate to achieve the purposes of this order.\n\nPART II-- AMENDMENTS TO EXECUTIVE ORDER NO. 10925\n\nSECTION 201. Section 301 of Executive Order No. 10925 of March 6, 1961, is amended to read:\n\n\"SECTION 301. Except in contracts exempted in accordance with section 303 of this order, all Government contracting agencies shall include in every Government contract hereafter entered into the following provisions:\n\n'During the performance of this contract, the contractor agrees as follows:\n\n‘(1) The contractor will not discriminate against any employee or applicant for employment because of race, creed, color, or national origin. The contractor will take affirmative action to ensure that applicants are employed, and that employees are treated during employment, without regard to their race, creed, color, or national origin. Such action shall include, but not be limited, to the following: employment, upgrading, demotion or transfer; recruitment or recruitment advertising; layoff or termination; rates of pay or other forms of compensation; and selection for training, including apprenticeship. The contractor agrees to post in conspicuous places, available to employee and applicants for employment, notices to be provided by the contracting officer setting forth the provisions of this non-discrimination clause.\n\n'(2) The contractor will, in all solicitations or advertisements for employees placed by or on behalf of the contractor, state that all qualified applicants will receive consideration for employment without regard to race, creed, color, or national origin.\n\n'(3) The contractor will send to each labor union or representative of workers with which he has a collective bargaining agreement or other contract or understanding, a notice, to be provided by the agency contracting officer, advising the said labor union or workers' representative of the contractor's commitments under this section, and shall post copies of the notice in conspicuous places available to employees and applicants for employment.\n\n'(4) The contractor will comply with all provisions of Executive Order No. 10925 of March 6, 1961, as amended, and of the rules, regulations, and relevant orders of the President's Committee on Equal Employment Opportunity created thereby.\n\n'(5) The contractor will furnish all information and reports required by Executive Order No. 10925 of March 6, 1961, as amended, and by the rules, regulations, and orders of the said Committee, or pursuant thereto, and will permit access to his books, records, and accounts by the contracting agency and the Committee for purposes of investigation to ascertain compliance with such rules, regulations, and orders.\n\n'(6) In the event of the contractor's noncompliance with the non-discrimination clauses of this contract or with any of the said rules, regulations, or orders, this contract may be canceled, terminated, or suspended in whole or in part and the contractor may be declared ineligible for further Government contracts in accordance with procedures authorized in Executive Order No. 10925 of March 6, 1961, as amended, and such other sanctions may be imposed and remedies invoked as provided in the said Executive Order or by rule, regulation, or order of the President's Committee on Equal Employment Opportunity, or as otherwise provided by law.\n\n'(7) The contractor will include the provisions of paragraphs (1) through (7) in every subcontract or purchase order unless exempted by rules, regulations, or orders of the President's Committee on Equal Employment Opportunity issued pursuant to section 303 of Executive Order No. 10925 of March 6, 1961, as amended, so that such provisions will be binding upon each subcontractor or vendor. The contractor will take such action with respect to any subcontract or purchase order as the contracting agency may direct as a means of enforcing such provisions, including sanctions for noncompliance: Provided, however, that in the event the contractor becomes involved in, or is threatened with, litigation with a subcontractor or vendor as a result of such direction by the contracting agency, the contractor may request the United States to enter into such litigation to protect the interests of the United States.'\"\n\nSEC. 202. Section 303 of Executive Order No. 10925 is amended to read:\n\n\"The Committee may, when it deems that special circumstances in the national interest so require, exempt a contracting agency from the requirement of including any or all of the provisions of section 301 of this order in any specific contract, subcontract or purchase order. The Committee may, by rule or regulation, also exempt certain classes of contracts, subcontracts or purchase orders (a) where work is to be or has been performed outside the United States and no recruitment of workers within the limits of the United States is involved; (b) for standard commercial supplies or raw materials; (c) involving less than specified amounts of money or specified numbers of workers; or (d) to the extent that they involve subcontracts below a specified tier. The Committee may also provide, by rule, regulation, or order, for the exemption of facilities of a contractor which are in all respects separate and distinct from activities of the contractor related to the performance of the contract, provided that such an exemption will not interfere with or impede the effectuation of the purposes of this order and provided that in the absence of such an exemption all such facilities shall be covered by the provisions of this order. \"\n\nPART III--MISCELLANEOUS\n\nSECTION 301. The Secretary of Health, Education, and Welfare and the Administrator of the Housing and Home Finance Agency are designated members of the Committee. Each such member may designate an alternate to represent him in his absence.\n\nSEC. 302. Section 401 of Executive Order No. 10925 shall apply to the administering departments and agencies subject to this order.\n\nSEC. 303. Part I of this order shall become effective thirty days after the execution of this order. Parts II and III shall be effective immediately.\n\nJOHN F. KENNEDY\n\nTHE WHITE HOUSE,\n\nJune 22, 1963","chunks":{"2":"(b) In the event an applicant fails and refuses to comply with his undertakings, the administering department or agency may, and upon the recommendation of the Committee, shall take any or all of the following actions: (1) cancel, terminate, or suspend in whole or in part the agreement or contract with such applicant with respect to which the failure and refusal occurred; (2) refrain from extending any further assistance under any of its programs subject to this order until satisfactory assurance of future compliance has been received from such applicant; (3) refer the case to the Department of Justice for appropriate legal proceedings. (c) No action shall be taken with respect to an applicant pursuant to paragraph (1) or (2)of subsection (b) without notice and hearing before the administering department or agency or the Committee, in accordance with the rules and regulations of the Committee. SEC. 104. The Committee may, by rule, regulation, or order, exempt all or part of any program of an administering agency from the requirements of this order when it deems that special circumstances in the national interest so require. SEC. 105. The Committee shall adopt such rules and regulations and issue such orders as it deems necessary and appropriate to achieve the purposes of this order. PART II-- AMENDMENTS TO EXECUTIVE ORDER NO. 10925 SECTION 201.","3":"Section 301 of Executive Order No. 10925 of March 6, 1961, is amended to read: \"SECTION 301. Except in contracts exempted in accordance with section 303 of this order, all Government contracting agencies shall include in every Government contract hereafter entered into the following provisions: 'During the performance of this contract, the contractor agrees as follows: ‘(1) The contractor will not discriminate against any employee or applicant for employment because of race, creed, color, or national origin. The contractor will take affirmative action to ensure that applicants are employed, and that employees are treated during employment, without regard to their race, creed, color, or national origin. Such action shall include, but not be limited, to the following: employment, upgrading, demotion or transfer; recruitment or recruitment advertising; layoff or termination; rates of pay or other forms of compensation; and selection for training, including apprenticeship. The contractor agrees to post in conspicuous places, available to employee and applicants for employment, notices to be provided by the contracting officer setting forth the provisions of this non-discrimination clause. '(2) The contractor will, in all solicitations or advertisements for employees placed by or on behalf of the contractor, state that all qualified applicants will receive consideration for employment without regard to race, creed, color, or national origin. '(3) The contractor will send to each labor union or representative of workers with which he has a collective bargaining agreement or other contract or understanding, a notice, to be provided by the agency contracting officer, advising the said labor union or workers' representative of the contractor's commitments under this section, and shall post copies of the notice in conspicuous places available to employees and applicants for employment. '(4) The contractor will comply with all provisions of Executive Order No. 10925 of March 6, 1961, as amended, and of the rules, regulations, and relevant orders of the President's Committee on Equal Employment Opportunity created thereby. '(5) The contractor will furnish all information and reports required by Executive Order No. 10925 of March 6, 1961, as amended, and by the rules, regulations, and orders of the said Committee, or pursuant thereto, and will permit access to his books, records, and accounts by the contracting agency and the Committee for purposes of investigation to ascertain compliance with such rules, regulations, and orders. '(6) In the event of the contractor's noncompliance with the non-discrimination clauses of this contract or with any of the said rules, regulations, or orders, this contract may be canceled, terminated, or suspended in whole or in part and the contractor may be declared ineligible for further Government contracts in accordance with procedures authorized in Executive Order No. 10925 of March 6, 1961, as amended, and such other sanctions may be imposed and remedies invoked as provided in the said Executive Order or by rule, regulation, or order of the President's Committee on Equal Employment Opportunity, or as otherwise provided by law. '(7) The contractor will include the provisions of paragraphs (1) through (7) in every subcontract or purchase order unless exempted by rules, regulations, or orders of the President's Committee on Equal Employment Opportunity issued pursuant to section 303 of Executive Order No. 10925 of March 6, 1961, as amended, so that such provisions will be binding upon each subcontractor or vendor. The contractor will take such action with respect to any subcontract or purchase order as the contracting agency may direct as a means of enforcing such provisions, including sanctions for noncompliance: Provided, however, that in the event the contractor becomes involved in, or is threatened with, litigation with a subcontractor or vendor as a result of such direction by the contracting agency, the contractor may request the United States to enter into such litigation to protect the interests of the United States.'\" SEC. 202."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"2","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO6":{"metadata":{"president":"Ronald Reagan","date":"May 14, 1985","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and laws 'of the United States of America, including section 3347 of title 5, United States Code, it is hereby ordered as follows:\n\nPart I. Succession to the Position of Secretary of Defense.\n\nIn the event of the death, disability, or absence of the Secretary of Defense, the incumbents in the Department of Defense positions listed below shall succeed to the position of, and act as, Secretary of Defense in the order indicated:\n\n1. Deputy Secretary of Defense.\n\n2. Secretary of the Army.\n\n3. Secretary of the Navy.\n\n4. Secretary of the Air Force.\n\n5. Under Secretary of Defense for Policy.\n\n6. Under Secretary of Defense for Research and Engineering.\n\n7. Assistant Secretaries of Defense and the General Counsel of the Department of Defense, in the order fixed by their length of service as such.\n\n8. Under Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such.\n\n9. Assistant Secretaries of the Army, the Navy, and the Air Force, in the order fixed by their length of service as such.\n\nPrecedence within a particular group between or among two or more officers having the same date of appointment shall be as determined by the Secretary of Defense at the time of appointment.\n\nPart II. Succession to the Position of Secretary of the Army.\n\nIn the event of the death, disability, or absence of the Secretary of the Army, the officers designated below shall succeed to the position of, and act as, Secretary of the Army in the order indicated:\n\n1. Under Secretary of the Army.\n\n2. Assistant Secretaries of the Army, in the order fixed by their length of service as such.\n\n3. Chief of Staff, United States Army.\n\n4. Vice Chief of Staff, United States Army.\n\n5. Commanding General, U.S. Army Forces Command.\n\nPart III. Succession to the Position of Secretary of the Navy.\n\nIn the event of the death, disability, or absence of the Secretary of the Navy, the officers designated below shall succeed to the position of, and act as, Secretary of the Navy in the order indicated:\n\n1. Under Secretary of the Navy.\n\n2. Assistant Secretaries of the Navy, in the order prescribed by the Secretary of the Navy, or if no order is prescribed by the Secretary, then in the order fixed by their length of service as such.\n\n3. Chief of Naval Operations.\n\n4. Vice Chief of Naval Operations.\n\nPart IV Succession to the Position of Secretary of the Air Force.\n\nIn the event of the death, disability, or absence of the Secretary of the Air Force, the officers designated below shall succeed to the position of, and act as, Secretary of the Air Force in the order indicated:\n\n1. Under Secretary of the Air Force.\n\n2. Assistant Secretaries of the Air Force, in the order fixed by their length of service as such.\n\n3. Chief of Staff, United States Air Force.\n\n4. Vice Chief of Staff, United States Air Force.\n\n5. The senior Deputy Chief of Staff who is not absent or disabled.\n\n6. The Commander, Air University.\n\nPart V. Variations in the Order of Succession.\n\nWithout regard to any other part of this Order, except Part VI, the President, or the person acting as President under section 19 of title 3, United States Code, may, in the event of the death, disability, or absence of the Secretary of Defense, appoint any officer designated in Part I of this Order to succeed to the position of, and act as, Secretary of Defense; and that person may, in the event of the death, disability, or absence of the Secretary of a Military Department, appoint any officer designated in the part of this Order that relates to the order to succession in the Department concerned to succeed to the position of, and act as, the Secretary of that Department.\n\nPart VI. Temporary Nature of Succession/ Acting Capacity.\n\nSuccession to office pursuant to this Order shall be on a temporary or interim basis and shall not have the effect of vacating the statutory position held by the successor. An officer shall not succeed to any position under this order if the position that he occupies entitling him so to succeed is held by him in an acting capacity only. part VII. Revocation of Prior Executive Order.\n\nExecutive Order No. 10820 of May 18, 1959, is hereby revoked.\n\nRONALD REAGAN\n\nThe White House,\n\nMay 14, 1985.\n\n[Filed with the Office of the Federal Register, 10:29 a.m., May 15, 1985]","chunks":{"2":"Executive Order No. 10820 of May 18, 1959, is hereby revoked."},"annotations":[{"directive":null,"chunks":{"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO11":{"metadata":{"president":"Gerald R. Ford","date":"January 13, 1977","type":"executive_order"},"text":"By virtue of the authority vested in me by Section 3347 of Title 5 and Section 301 of Title 3 of the United States Code, and as President of the United States of America, it is hereby ordered as follows:\n\nSECTION 1. During any period when, by reason of absence, disability, or vacancy in office, both the Secretary of Agriculture and the Deputy Secretary of Agriculture are not available to exercise the powers or perform the duties of the Office of Secretary, the officers from the Department of Agriculture whose appointments are vested in the President, by and with the advice and consent of the Senate, shall act as Secretary in such order as the Secretary of Agriculture may from time to time prescribe. If no such order of succession is in effect at that time, then such officers shall act as Secretary in the descending order of rank, as established by the listing of their offices in Sections 5314, 5315 or 5316 of Title 5 of the United States Code and, at each level of the Executive Schedule, in the order in which they shall have taken oath as such officers.\n\nSEC. 2. Executive Order No. 11793 of July 10, 1974, is hereby revoked.\n\nGERALD R. FORD\n\nThe White House,\n\nJanuary 13, 1977.","chunks":{"2":"Executive Order No. 11793 of July 10, 1974, is hereby revoked."},"annotations":[{"directive":null,"chunks":{"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO30":{"metadata":{"president":"Dwight D. Eisenhower","date":"April 27, 1953","type":"executive_order"},"text":"WHEREAS the interests of the national security require that all persons privileged to be employed in the departments and agencies of the Government, shall be reliable, trustworthy, of good conduct and character, and of complete and unswerving loyalty to the United States; and\n\nWHEREAS the American tradition that all persons should receive fair, impartial, and equitable treatment at the hands of the Government requires that all persons seeking the privilege of employment or privileged to be employed in the departments and agencies of the Government be adjudged by mutually consistent and no less than minimum standards and procedures among the departments and agencies governing the employment and retention in employment of persons in the Federal service:\n\nNOW, THEREFORE, by virtue of the authority vested in me by the Constitution and statutes of the United States, including section 1753 of the Revised Statutes of the United States (5 U.S.C. 631); the Civil Service Act of 1883 (22 Stat. 403; 5 U.S.C. 632, et seq.); section 9A of the act of August 2, 1939, 53 Stat. 1148 (5 U.S.C. 118 j); and the act of August 26, 1950, 64 Stat. 476 (5 U.S.C. 22-1, et seq.), and as President of the United States, and deeming such action necessary in the best interests of the national security, it is hereby ordered as follows:\n\nSECTION 1. In addition to the departments and agencies specified In the said act of August 26, 1950, and Executive Order No. 10237 of April 26, 1951, the provisions of that act shall apply to all other departments and agencies of the Government.\n\nSEC 2. The head of each department and agency of the Government shall be responsible for establishing and maintaining within his department or agency an effective program to insure that the employment and retention in employment of any civilian officer or employee within the department or agency is clearly consistent with the interests of the national security.\n\nSEC. 3. (a) The appointment of each civilian officer or employee in any department or agency of the Government shall be made subject to investigation. The scope of the investigation shall be determined in the first instance according to the degree of adverse effect the occupant of the position sought to be filled could bring about, by virtue of the nature of the position, on the national security, but in no event shall the investigation include less than a national agency check (including a check of the fingerprint files of the Federal Bureau of Investigation), and written inquiries to appropriate local law-enforcement agencies, former employers and supervisors, references, and schools attended by the person under investigation: Provided, that upon request of the head of the department or agency concerned, the Civil Service Commission may, in its discretion, authorize such less investigation as may meet the requirements of the national security with respect to per-diem, intermittent, temporary, or seasonal employees, or aliens employed outside the United States. Should there develop at any stage of investigation information indicating that the employment of any such person may not be clearly consistent with the interests of the national security, there shall be conducted with respect to such person a full field investigation, or such less investigation as shall be sufficient to enable the head of the department or agency concerned to determine whether retention of such person is clearly consistent with the interests of the national security.\n\n(b) The head of any department or agency shall designate, or cause to be designated, any position within his department or agency the occupant of which could bring about, by virtue of the nature of the position, a material adverse effect on the national security as a sensitive position. Any position so designated shall be filled or occupied only by a person with respect to whom a full field investigation has been conducted: Provided, that a person occupying a sensitive position at the time it is designated as such may continue to occupy such position pending the completion of a full field investigation, subject to the other provisions of this order:\n\nAnd provided further, that in case of emergency a sensitive position may be filled for a limited period by a person with respect to whom a full field preappointment investigation has not been completed if the head of the department or agency concerned finds that such action is necessary in the national interest, which finding shall be made a part of the records of such department or agency.\n\nSEC. 4. The head of each department and agency shall review, or cause to be reviewed, the cases of all civilian officers and employees with respect to whom there has been conducted a full field investigation under Executive Order No. 9835 of March 21, 1947, and, after such further investigation as may be appropriate, shall re-adjudicate, or cause to be re-adjudicated, in accordance with the said act of August 26, 1950, such of those cases as have not been adjudicated under a security standard commensurate with that established under this order.\n\nSEC. 5. Whenever there is developed or received by any department or agency information indicating that the retention in employment of any officer or employee of the Government may not be clearly consistent with the interests of the national security, such information shall be forwarded to the head of the employing department or agency or his representative, who, after such investigation as may be appropriate, shall review, or cause to be reviewed, and, where necessary, re-adjudicate, or cause to be re-adjudicated, in accordance with the raid act of August 26, 1950, the case of such officer or employee.\n\nSEC. 6. Should there develop at any stage of investigation information indicating that the employment of any officer or employee of the Government may not be clearly consistent with the interests of the national security, the head of the department or agency concerned or his representative shall immediately suspend the employment of the person involved if he deems such suspension necessary in the interests of the national security and, following such investigation and review as he deems necessary, the head of the department or agency concerned shall terminate the employment of such suspended officer or employee whenever he shall determine such termination necessary or advisable in the interests of the national security, in accordance with the said act of August 26, 1950.\n\nSEC. 7. Any person whose employment is suspended or terminated under the authority granted to heads of departments and agencies by or in accordance with the said act of August 26, 1950, or pursuant to the said Executive Order No. 9835 or any other security or loyalty program relating to officers or employees of the Government, shall not be reinstated or restored to duty or reemployed in the same department or agency and shall not be reemployed in any other department or agency, unless the head of the department or agency concerned finds that such reinstatement, restoration, or reemployment is clearly consistent with the interests of the national security, which finding shall be made a part of the records of such department or agency: Provided, that no person whose employment has been terminated under such authority thereafter may be employed by any other department or agency except after a determination by the Civil Service Commission that such person is eligible for such employment.\n\nSEC. 8. (a) The investigations conducted pursuant to this order shall be designed to develop information as to whether the employment or retention in employment in the Federal service of the person being investigated is clearly consistent with the interests of the national security. Such information shall relate, but shall not be limited, to the following:\n\n(1) Depending on the relation of the Government employment to the national security:\n\n(i) Any behavior, activities, or associations which tend to show that the individual is not reliable or trustworthy.\n\n(ii) Any deliberate misrepresentations, falsifications, or omissions of material facts.\n\n(iii) Any criminal, infamous, dishonest, immoral, or notoriously disgraceful conduct, habitual use of intoxicants to excess, drug addiction, or sexual perversion.\n\n(iv) An adjudication of insanity, or treatment for serious mental or neurological disorder without satisfactory evidence of cure.\n\n(v) Any facts which furnish reason to believe that the individual may be subjected to coercion, influence, or pressure which may cause him to act contrary to the best interests of the national security.\n\n(2) Commission of any act of sabotage, espionage, treason, or sedition, or attempts thereat or preparation therefor, or conspiring with, or aiding or abetting, another to commit or attempt to commit any act of sabotage, espionage, treason, or sedition.\n\n(3) Establishing or continuing a sympathetic association with a saboteur, spy, traitor, seditionist, anarchist, or revolutionist, or with an espionage or other secret agent or representative of a foreign nation, or any representative of a foreign nation whose interests may be inimical to the interests of the United States, or with any person who advocates the use of force or violence to overthrow the government of the United States or the alteration of the form of government of the United States by unconstitutional means.\n\n(4) Advocacy of use of force or violence to overthrow the government of the United States, or of the alteration of the form of government of the United States by unconstitutional means.\n\n(5) Membership in, or affiliation or sympathetic association with, any foreign or domestic organization, association, movement, group, or combination of persons which is totalitarian, Fascist, Communist, or subversive, or which has adopted, or shows, a policy of advocating or approving the commission of acts of force or violence to deny other persons their rights under the Constitution of the United States, or which seeks to alter the form of government of the United States by unconstitutional means.\n\n(6) Intentional, unauthorized disclosure to any person of security information, or of other information disclosure of which is prohibited by law, or willful violation or disregard of security regulations.\n\n(7) Performing or attempting to perform his duties, or otherwise acting, so as to serve the interests of another government in preference to the interests of the United States.\n\n(b) The investigation of persons entering or employed in the competitive service shall primarily be the responsibility of the Civil Service Commission, except in cases in which the head of a department or agency assumes that responsibility pursuant to law or by agreement with the Commission. The Commission shall furnish a full investigative report to the department or agency concerned.\n\n(c) The investigation of persons (including consultants, however employed), entering employment of, or employed by, the Government other than in the competitive service shall primarily be the responsibility of the employing department or agency. Departments and agencies without investigative facilities may use the investigative facilities of the Civil Service Commission, and other departments and agencies may use such facilities under agreement with the Commission.\n\n(d) There shall be referred promptly to the Federal Bureau of Investigation all investigations being conducted by any other agencies which develop information indicating that an individual may have been subjected to coercion, influence, or pressure to act contrary to the interests of the national security, or information relating to any of the matters described in subdivisions (2) through (7) of subsection (a) of this section. In cases so referred to it, the Federal Bureau of Investigation shall make a full field investigation.\n\nSEC. 9. (a) There shall be established and maintained in the Civil Service Commission a security-investigations index covering all persons as to whom security investigations have been conducted by any department or agency of the Government under this order. The central index established and maintained by the Commission under Executive Order No. 9835 of March 21, 1947, shall be made a part of the security-investigations index. The security-investigations index shall contain the name of each person investigated, adequate identifying information concerning each such person, and a reference to each department and agency which has conducted an investigation concerning the person involved or has suspended or terminated the employment of such person under the authority granted to heads of departments and agencies by or in accordance with the said act of August 26, 1950.\n\n(b) The heads of all departments and agencies shall furnish promptly to the Civil Service Commission information appropriate for the establishment and maintenance of the security-investigations index.\n\n(c) The reports and other investigative material and information developed\n\nby investigations conducted pursuant to any statute, order, or program described in section 7 of this order shall remain the property of the investigative agencies conducting the investigations, but may, subject to considerations of the national security, be retained by the department or agency concerned. Such reports and other investigative material and information shall be maintained in confidence, and no access shall be given thereto except, with the consent of the investigative agency concerned, to other departments and agencies conducting security programs under the authority granted by or in accordance with the said act of August 26, 1950, as may be required for the efficient conduct of Government business.\n\nSEC 10. Nothing in this order shall be construed as eliminating or modifying in any way the requirement for any investigation or any determination as to security which may be required by law.\n\nSEC 11. On and after the effective date of this order the Loyalty Review Board established by Executive Order No. 9835 of March 21, 1947, shall not accept agency findings for review, upon appeal or otherwise. Appeals pending before the Loyalty Review Board on such date shall be heard to final determination in accordance with the provisions of the said Executive Order No. 9835, as amended. Agency determinations favorable to the officer or employee concerned pending before the Loyalty Review Board on such date shall be acted upon by such Board, and whenever the Board is not in agreement with such favorable determination the case shall be remanded to the department or agency concerned for determination in accordance with the standards and procedures established pursuant to this order. Cases pending before the regional loyalty boards of the Civil Service Commission on which hearings have not been initiated on such date shall be referred to the department or agency concerned. Cases being heard by regional loyalty boards on such date shall be heard to conclusion, and the determination of the board shall be forwarded to the head of the department or agency concerned: Provided, that if no specific department or agency is involved, the case shall be dismissed without prejudice to the applicant. Investigations pending in the Federal Bureau of Investigation or the Civil Service Commission on such date shall be completed, and the reports thereon shall be made to the appropriate department or agency.\n\nSEC. 12. Executive Order No. 9835 of March 21, 1947, as amended, is hereby revoked. For the purposes described In section 11 hereof the Loyalty Review Board and the regional loyalty boards of the Civil Service Commission shall continue to exist and function for a period of one hundred and twenty days from the effective date of this order, and the Department of Justice shall continue to furnish the information described in paragraph 3 of Part III of the said Executive Order No. 9835, but directly to the head of each department and agency.\n\nSEC. 13. The Attorney General is requested to render to the heads of departments and agencies such advice as may be requisite to enable them to establish and maintain an appropriate employee security program.\n\nSEC. 14. (a) The Civil Service Commission, with the continuing advice and collaboration of representatives of such departments and agencies as the National Security Council may designate, shall make a continuing study of the manner in which this order is being implemented by the departments and agencies of the Government for the purpose of determining:\n\n(1) Deficiencies in the department and agency security programs established under this order which are inconsistent with the interests of, or directly or indirectly weaken, the national security.\n\n(2) Tendencies in such programs to deny to individual employees fair, impartial, and equitable treatment at the hands of the Government, or rights under the Constitution and laws of the United States or this order.\n\nInformation affecting any department or agency developed or received during the course of such continuing study shall be furnished immediately to the head of the department or agency concerned. The Civil Service Commission shall report to the National Security Council, at least semiannually, on the results of such study, and shall recommend means to correct any such deficiencies or tendencies.\n\n(b) All departments and agencies of the Government are directed to cooperate with the Civil Service Commission to facilitate the accomplishment of the responsibilities assigned to it by subsection (a) of this section.\n\nSEC. 15. This order shall become effective thirty days after the date hereof.\n\nDWIGHT D. EISENHOWER\n\nTHE WHITE HOUSE,\n\nApril 27, 1953.","chunks":{"7":"Executive Order No. 9835 of March 21, 1947, as amended, is hereby revoked. For the purposes described In section 11 hereof the Loyalty Review Board and the regional loyalty boards of the Civil Service Commission shall continue to exist and function for a period of one hundred and twenty days from the effective date of this order, and the Department of Justice shall continue to furnish the information described in paragraph 3 of Part III of the said Executive Order No. 9835, but directly to the head of each department and agency. SEC. 13. The Attorney General is requested to render to the heads of departments and agencies such advice as may be requisite to enable them to establish and maintain an appropriate employee security program. SEC. 14.","10":"and shall recommend means to correct any such deficiencies or tendencies. (b) All departments and agencies of the Government are directed to cooperate with the Civil Service Commission to facilitate the accomplishment of the responsibilities assigned to it by subsection (a) of this section. SEC. 15. This order shall become effective thirty days after the date hereof."},"annotations":[{"directive":null,"chunks":{"10":{"code":"3","diplomacy":"no","military_ops":"no"},"7":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"10":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"10":{"code":"0","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M4":{"metadata":{"president":"Barack Obama","date":"May 10, 2010","type":"memorandum"},"text":"Presidential Determination No. 2010-08\n\nMemorandum for the Secretary of State and the Secretary of Energy\n\nSubject: Agreement Between the Government of the United States of America and the Government of the Russian Federation for Cooperation in the Field of Peaceful Uses of Nuclear Energy\n\nI have considered the proposed Agreement Between the Government of the United States of America and the Government of the Russian Federation for Cooperation in the Field of Peaceful Uses of Nuclear Energy, signed in Moscow on May 6, 2008, along with the views, recommendations, and statements of the interested departments and agencies.\n\nI approve the proposed Agreement and have determined that the performance of the Agreement will promote, and will not constitute an unreasonable risk to, the common defense and security.\n\nThe Secretary of State is authorized and directed to publish this determination in the Federal Register.\n\nBARACK OBAMA","chunks":{"1":"I approve the proposed Agreement and have determined that the performance of the Agreement will promote, and will not constitute an unreasonable risk to, the common defense and security."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"4","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M5":{"metadata":{"president":"Donald J. Trump","date":"April 07, 2020","type":"memorandum"},"text":"Memorandum for the Secretary of Defense and the Secretary of Homeland Security\n\nSubject: Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19\n\nBy the authority vested in me as President by the Constitution and the laws of the United States of America, including the Robert T. Stafford Disaster Relief and Emergency Assistance Act, 42 U.S.C. 5121–5207 (the \"Stafford Act\"), and section 502 of title 32, United States Code, it is hereby ordered as follows:\n\nSection 1. Policy. It is the policy of the United States to take measures to assist State Governors under the Stafford Act in their responses to all threats and hazards to the American people in their respective States. Considering the profound and unique public health risks posed by the ongoing outbreak of COVID–19, the disease caused by the novel (new) coronavirus known as SARS–CoV–2 (\"the virus\"), the need for close cooperation and mutual assistance between the Federal Government and the States is greater than at any time in recent history. In recognizing this serious public health risk, I noted that on March 11, 2020, the World Health Organization announced that the COVID–19 outbreak can be characterized as a pandemic. On March 13, 2020, I declared a national emergency recognizing the threat that SARS–CoV–2 poses to the Nation's healthcare systems. I also determined that same day that the COVID–19 outbreak constituted an emergency, of nationwide scope, pursuant to section 501(b) of the Stafford Act (42 U.S.C. 5191(b)). All States have activated their Emergency Operations Centers and are working to fight the spread of the virus and attend to those who have symptoms or who are already infected with COVID–19. To provide maximum support to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia as they make decisions about the responses required to address local conditions in each of their respective jurisdictions and as they request Federal support under the Stafford Act, I am taking the actions set forth in sections 2 and 3 of this memorandum:\n\nSec. 2. One Hundred Percent Federal Cost Share. To maximize assistance to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia to facilitate Federal support with respect to the use of National Guard units under State control, I am directing the Federal Emergency Management Agency (FEMA) of the Department of Homeland Security to fund 100 percent of the emergency assistance activities associated with preventing, mitigating, and responding to the threat to public health and safety posed by the virus that these States undertake using their National Guard forces, as authorized by sections 403 (42 U.S.C. 5170b) and 503 (42 U.S.C. 5193) of the Stafford Act.\n\nSec. 3. Support of Operations or Missions to Prevent and Respond to the Spread of COVID–19. I am directing the Secretary of Defense, to the maximum extent feasible and consistent with mission requirements (including geographic proximity), to request pursuant to 32 U.S.C. 502(f) that the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia order National Guard forces to perform duty to fulfill mission assignments, on a fullyreimbursable basis, that FEMA issues to the Department of Defense for the purpose of supporting their respective State and local emergency assistance efforts under the Stafford Act.\n\nSec. 4. Termination. The 100 percent Federal cost share for National Guard forces pursuant to this memorandum, and in my prior memoranda dated March 22, 28, and 30, 2020, and April 2, 2020, each titled \"Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19,\" is effective for orders of duty of a duration of 31 days or fewer. These orders of duty must be effective no later than 2 weeks from the date of this memorandum.\n\nSec. 5. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This memorandum shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\n(d) The Secretary of Defense is authorized and directed to publish this memorandum in the Federal Register.\n\nDONALD J. TRUMP","chunks":{"3":"I am directing the Secretary of Defense, to the maximum extent feasible and consistent with mission requirements (including geographic proximity), to request pursuant to 32 U.S.C. 502(f) that the Governors of the States of Arizona,","4":"Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia order National Guard forces to perform duty to fulfill mission assignments, on a fullyreimbursable basis, that FEMA issues to the Department of Defense for the purpose of supporting their respective State and local emergency assistance efforts under the Stafford Act. Sec. 4. Termination. The 100 percent Federal cost share for National Guard forces pursuant to this memorandum, and in my prior memoranda dated March 22, 28, and 30, 2020, and April 2, 2020, each titled \"Providing Federal Support for Governors' Use of the National Guard to Respond to COVID–19,\" is effective for orders of duty of a duration of 31 days or fewer. These orders of duty must be effective no later than 2 weeks from the date of this memorandum. Sec. 5. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.","2":"To maximize assistance to the Governors of the States of Arizona, Colorado, Kentucky, Mississippi, Montana, Nevada, North Carolina, Oregon, Pennsylvania, South Carolina, Virginia, Wisconsin, and West Virginia to facilitate Federal support with respect to the use of National Guard units under State control, I am directing the Federal Emergency Management Agency (FEMA) of the Department of Homeland Security to fund 100 percent of the emergency assistance activities associated with preventing, mitigating, and responding to the threat to public health and safety posed by the virus that these States undertake using their National Guard forces, as authorized by sections 403 (42 U.S.C. 5170b) and 503 (42 U.S.C. 5193) of the Stafford Act. Sec. 3. Support of Operations or Missions to Prevent and Respond to the Spread of COVID–19."},"annotations":[{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"2","diplomacy":"no","military_ops":"no"},"4":{"code":"2","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L3":{"metadata":{"president":"George W. Bush","date":"February 18, 2008","type":"letter"},"text":"His Excellency Fatmir Sejdiu President of Kosovo Pristina\n\nDear Mr. President:\n\nOn behalf of the American people, I hereby recognize Kosovo as an independent and sovereign state. I congratulate you and Kosovo's citizens for having taken this important step in your democratic and national development.\n\nOn this historic occasion, I note the deep and sincere bonds of friendship that unite our people. This friendship, cemented during Kosovo's darkest hours of tragedy, has grown stronger in the 9 years since war in Kosovo ended. Kosovo has since worked to rebuild its war-shattered society, establish democratic institutions, hold successful elections for a new government, and foster prosperity. As an independent state, Kosovo now assumes responsibility for its destiny. As in the past, the United States will be your partner and your friend.\n\nIn your request to establish diplomatic relations with the United States, you expressed Kosovo's desire to attain the highest standards of democracy and freedom. I fully welcome this sentiment. In particular, I support your embrace of multi-ethnicity as a principle of good governance and your commitment to developing accountable institutions in which all citizens are equal under the law.\n\nI also note that, in its declaration of independence, Kosovo has willingly assumed the responsibilities assigned to it under the Ahtisaari Plan. The United States welcomes this unconditional commitment to carry out these responsibilities and Kosovo's willingness to cooperate fully with the international community during the period of international supervision to which you have agreed. The United States relies upon Kosovo's assurances that it considers itself legally bound to comply with the provisions in Kosovo's Declaration of Independence. I am convinced that full and prompt adoption of the measures proposed by U.N. Special Envoy Ahtisaari will bring Kosovo closer to fulfilling its Euro-Atlantic aspirations.\n\nOn the basis of these assurances from the Government of Kosovo, I am pleased to accept your request that our two countries establish diplomatic relations. The United States would welcome the establishment by Kosovo of diplomatic representation in the United States and plans to do likewise in Kosovo.\n\nAs Kosovo opens a new chapter in its history as an independent state, I look forward to the deepening and strengthening of our special friendship.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{"1":"On behalf of the American people, I hereby recognize Kosovo as an independent and sovereign state. I congratulate you and Kosovo's citizens for having taken this important step in your democratic and national development. On this historic occasion, I note the deep and sincere bonds of friendship that unite our people. This friendship, cemented during Kosovo's darkest hours of tragedy, has grown stronger in the 9 years since war in Kosovo ended. Kosovo has since worked to rebuild its war-shattered society, establish democratic institutions, hold successful elections for a new government, and foster prosperity. As an independent state, Kosovo now assumes responsibility for its destiny. As in the past, the United States will be your partner and your friend. In your request to establish diplomatic relations with the United States, you expressed Kosovo's desire to attain the highest standards of democracy and freedom. I fully welcome this sentiment. In particular, I support your embrace of multi-ethnicity as a principle of good governance and your commitment to developing accountable institutions in which all citizens are equal under the law. I also note that, in its declaration of independence, Kosovo has willingly assumed the responsibilities assigned to it under the Ahtisaari Plan. The United States welcomes this unconditional commitment to carry out these responsibilities and Kosovo's willingness to cooperate fully with the international community during the period of international supervision to which you have agreed. The United States relies upon Kosovo's assurances that it considers itself legally bound to comply with the provisions in Kosovo's Declaration of Independence. I am convinced that full and prompt adoption of the measures proposed by U.N. Special Envoy Ahtisaari will bring Kosovo closer to fulfilling its Euro-Atlantic aspirations. On the basis of these assurances from the Government of Kosovo, I am pleased to accept your request that our two countries establish diplomatic relations. The United States would welcome the establishment by Kosovo of diplomatic representation in the United States and plans to do likewise in Kosovo. As Kosovo opens a new chapter in its history as an independent state, I look forward to the deepening and strengthening of our special friendship."},"annotations":[{"directive":{"code":"0","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"yes","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"yes","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"yes","military_ops":"no"}},"wp_comment":null}]},"L8":{"metadata":{"president":"George W. Bush","date":"February 26, 2004","type":"letter"},"text":"Dear __________:\n\nConsistent with Condition 3(2)(A) of the Senate resolution of advice and consent to ratification to the Protocols to the North Atlantic Treaty of 1949 on the Accession of Bulgaria, Estonia, Latvia, Lithuania, Romania, Slovakia, and Slovenia, passed on May 8, 2003, I am providing a report prepared by my Administration.\n\nThis report describes the progress of the seven NATO invitees in satisfying the security sector and security vetting requirements for membership in NATO. As the report makes clear, all seven satisfy these NATO requirements.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"yes","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L11":{"metadata":{"president":"George W. Bush","date":"February 25, 2002","type":"letter"},"text":"Dear Mr. Speaker:\n\nIn furtherance of the provisions of Public Law 107-38, the Emergency Supplemental Appropriations Act for Recovery from and Response to Terrorist Attacks on the United States, FY 2001, today I am notifying the Congress of my intent to reallocate funds previously transferred from the Emergency Response Fund to the Department of Defense. This reallocation reflects revised requirements in light of changing security needs in the wake of the terrorist attacks of September 11, 2001.\n\nAs provided in Public Law 107-38, $33 million will be made available 15 days from the date of this transmittal for continued deployment of the National Guard at our Nation's airports through the end of March.\n\nThe details of this action are set forth in the enclosed letter from the Director of the Office of Management and Budget. I concur with his comments and observations.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"yes"},"chunks":{},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L22":{"metadata":{"president":"Donald J. Trump","date":"October 14, 2019","type":"letter"},"text":"Dear Madam Speaker: (Dear Mr. President:)\n\nPursuant to the International Emergency Economic Powers Act (50 U.S.C. 1701 et seq.) (IEEPA), I hereby report that I have issued an Executive Order (the \"order\") declaring a national emergency due to the situation in and in relation to Syria, and in particular the recent actions by the Government of Turkey to conduct a military offensive into northeast Syria. I have taken this action because recent actions by the Government of Turkey undermine the campaign to defeat the Islamic State of Iraq and Syria, or ISIS, endangers civilians, and further threatens to undermine the peace, security, and stability in the region, and thereby constitute an unusual and extraordinary threat to the national security and foreign policy of the United States. I have also announced that steel tariffs will be increased back up to 50 percent, the level prior to reduction in May.\n\nTo deal with this threat, the order, consistent with law, blocks all property and interests in property, within the jurisdiction of the United States, of certain persons determined to be responsible for or complicit in actions or policies that contribute to this threat.\n\nThe order also authorizes the Secretary of State, in consultation with the Secretary of the Treasury and other officials of the United States government as appropriate, to impose sanctions upon persons determined to be responsible for or complicit in, have directly or indirectly engaged in, or attempted to engage in, or financed, various actions that contribute to this unusual and extraordinary threat. These actions include the obstruction, disruption, or prevention of a ceasefire in northern Syria and of efforts to promote a political solution to the conflict in Syria. Sanctions may affect various financial transactions, including government procurement contracts, foreign exchange transactions, investments, and importation of goods, technology, or services, as well as impose the denial of a visa and exclusion from the United States of the sanctioned person.\n\nTo deal with this threat, and because the unrestricted immigrant and nonimmigrant entry into the United States of aliens subject to sanctions would be detrimental to the interests of the United States, the order also suspends the entry of such persons into the United States.\n\nThe order authorizes the Secretary of the Treasury, in consultation with the Secretary of State, to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to me by IEEPA as may be necessary to carry out the purposes of this order.\n\nI am enclosing a copy of the order, as well as the press statement I issued earlier today.\n\nSincerely,\n\nDONALD J. TRUMP","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"yes"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"P53":{"metadata":{"president":"Ronald Reagan","date":"October 02, 1987","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. On June 5, 1987, the United States International Trade Commission (USITC) reported to the President the results of its investigation under section 406 of the Trade Act of 1974 (19 U.S.C. 2436) (the Trade Act) with respect to imports from the People's Republic of China (the PRC) of ammonium paratungstate (APT) and tungstic acid provided for in items 417.40 and 416.40, respectively, of the Tariff Schedules of the United States (TSUS) (19 U.S.C. 1202). The USITC determined that market disruption within the meaning of section 406 of the Trade Act exists with respect to imports from the PRC of APT and tungstic acid. To remedy this market disruption, the USITC recommended that, for the next 5 years, the combined volume of imports of APT and tungstic acid from the PRC be limited to the larger of 1.116 million pounds of tungsten content per year or 7.5 percent of U.S. consumption.\n\n2. On August 5, 1987, pursuant to sections 406, 202, and 203 of the Act (19 U.S.C. 2436, 2252, and 2253), and after taking into account the considerations specified in section 202(c) of the Trade Act (19 U.S.C. 2252(c)), I determined to provide import relief for the domestic industry in the form of a negotiated orderly marketing agreement. To this end, I directed the United States Trade Representative (the USTR) to negotiate and conclude an orderly marketing agreement with the PRC and to report the results of such negotiations to me within 50 days.\n\n3. Section 406(b)(2) of the Trade Act (19 U.S.C. 2436(b)(2)) requires that if import relief consists of, or includes, an orderly marketing agreement, then such agreement shall be entered into within 60 days after a presidential determination to provide relief.\n\n4. Pursuant to the authority vested in the President by the Constitution and the statutes of the United States, including section 203(a)(4) of the Trade Act (19 U.S.C. 2253(a)(4)), an agreement for orderly trade was signed on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China limiting the export from the PRC, and the import into the United States, of APT and tungstic acid provided for in items 417.40 and 416.40, respectively, of the TSUS.\n\n5. Pursuant to section 203(k)(1) of the Trade Act (19 U.S.C. 2253(k) (1)), I have considered the relation of such action to the international obligations of the United States. Since February 1, 1980, the United States and the PRC have had in effect a bilateral trade agreement under which I have determined, pursuant to section 405 of the Trade Act (19 U.S.C. 2435), a satisfactory balance of concessions has been maintained during the life of such agreement, and for which I reconfirm that actual or foreseeable reductions in U.S. tariffs and nontariff barriers to trade resulting from multilateral negotiations are, and continuously have been, satisfactorily reciprocated by the PRC. The present agreement for orderly trade is within the parameters of the safeguard measures envisioned by the bilateral trade agreement.\n\n6. In accordance with section 203(d)(2) of the Trade Act (19 U.S.C. 2253(d)(2)), I have determined that the level of import relief hereinafter proclaimed permits the importation into the United States of a quantity or value of articles that is not less than the average annual quantity or value of such articles imported into the United States from the PRC in the 1982-1984 period, which I have determined to be the most recent representative period for imports of such articles.\n\nNow, Therefore, I, Ronald Reagan, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes of the United States, including sections 203, 406, and 604 of the Trade Act (19 U.S.C. 2253, 2436, and 2483), section 332 of the Tariff Act of 1930, and section 301 of title 3, United States Code, do proclaim that—\n\n(l) An orderly marketing agreement was entered into on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China, with respect to trade in APT and tungstic acid, effective October 1, 1987. The agreement for orderly trade is to be implemented according to its terms and as directed in this Proclamation, including the Annex thereto.\n\n(2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation.\n\n(3) The President's authority under section 203(e)(3) of the Trade Act (19 U.S.C. 2253(e)(3)) to determine that the agreement is no longer effective is hereby delegated to the USTR. In the event of such a determination, the USTR shall prepare such Federal Register notice as may be appropriate to implement import relief authorized by section 203(e)(3) of the Trade Act.\n\n(4) The USTR shall take such actions and perform such functions for the United States as may be necessary concerning the administration, implementation, modification, amendment or termination of the agreement described in paragraph (1) of this Proclamation, and any action that may be subsequently required to implement paragraph (3) of this Proclamation. In carrying out his responsibilities under this paragraph, the USTR is authorized to direct and delegate to appropriate officials or agencies of the United States, authority to perform any functions necessary for the administration and implementation of the agreement, or in the event he determines the agreement to be no longer effective, such further action as he deems necessary and appropriate consistent with this Proclamation. The USTR is authorized to make any changes in part 2 of the Appendix to the TSUS that may be necessary to carry out the agreement or such other action as may be required should he determine the agreement to be no longer effective. Any such changes in the agreement shall be effective after their publication in the Federal Register.\n\n(5) The U.S. Customs Service shall take such actions as the USTR shall determine are necessary to carry out the agreement described in paragraph (1) of this Proclamation, or to implement any import relief implemented pursuant to paragraphs (3) and (4) of this Proclamation, or any modification thereof, with respect to the entry, or withdrawal from warehouse for consumption, into the United States of products covered by such agreement or by such other import relief.\n\n(6) The U.S. Customs Service shall collect and assemble such data as are necessary to monitor compliance with the agreement. Such data shall include import statistics with respect to tungsten oxide, provided for in item 422.42, part 2C, schedule 4 of the TSUSA, as well as data for APT and tungstic acid.\n\nIn Witness Whereof, I have hereunto set my hand this 2nd day of October, in the year of our Lord nineteen hundred and eighty-seven, and of the Independence of the United States of America the two hundred and twelfth.\n\nRONALD REAGAN","chunks":{"9":"Now, Therefore, I, Ronald Reagan, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes of the United States, including sections 203, 406, and 604 of the Trade Act (19 U.S.C. 2253, 2436, and 2483), section 332 of the Tariff Act of 1930, and section 301 of title 3, United States Code, do proclaim that— (l) An orderly marketing agreement was entered into on September 28, 1987, between the Government of the United States of America and the Government of the People's Republic of China, with respect to trade in APT and tungstic acid, effective October 1, 1987. The agreement for orderly trade is to be implemented according to its terms and as directed in this Proclamation, including the Annex thereto. (2) Subpart A, part 2 of the Appendix to the TSUS is modified as set forth in the Annex to this Proclamation."},"annotations":[{"directive":null,"chunks":{"9":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"9":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"9":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]}},"fields":["code","diplomacy","military_ops"],"fieldLabels":{"code":"Code","diplomacy":"Diplomacy","military_ops":"Mil / ops"},"valueLabels":{"0":"0 – Outside scope","1":"1 – Discretionary / internal","2":"2 – Dictated agency outcome","3":"3 – Self-executing","4":"4 – Unclear / mixed","yes":"Yes","no":"No"}}</script>
<script>
(function(){
'use strict';
var P=JSON.parse(document.getElementById('payload-data').textContent);
var groups=P.groups,annotators=P.annotators,docs=P.docs;
var fields=P.fields,fieldLabels=P.fieldLabels,valueLabels=P.valueLabels;
var mode='subdirective',activeTab=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function label(v){return v==null?null:(valueLabels[v]||v);}

function rowAgreement(vals){
  var nn=vals.filter(function(v){return v!=null;});
  if(!nn.length)return 'missing';
  return(new Set(nn)).size>1?'disagree':(nn.length<vals.length?'missing':'agree');
}

function docAgreement(docId){
  var d=docs[docId];if(!d)return 'missing';
  var ann=d.annotations;
  var hasMissing=false;
  for(var fi=0;fi<fields.length;fi++){
    var f=fields[fi];
    var vals=ann.map(function(a){return a.directive?(a.directive[f]!=null?a.directive[f]:null):null;});
    var ag=rowAgreement(vals);
    if(ag==='disagree')return 'disagree';
    if(ag==='missing')hasMissing=true;
  }
  return hasMissing?'missing':'agree';
}

function annTable(rowData){
  var out='<table class="ann-table"><thead><tr><th>Field</th>';
  annotators.forEach(function(n){out+='<th>'+esc(n)+'</th>';});
  out+='</tr></thead><tbody>';
  rowData.forEach(function(row){
    var ag=rowAgreement(row.vals);
    out+='<tr class="row-'+ag+'"><td class="field-label">'+esc(row.label)+'</td>';
    row.vals.forEach(function(v){
      var cls='val-cell'+(v==null?' val-missing':'');
      out+='<td class="'+cls+'">'+(v==null?'—':esc(label(v)))+'</td>';
    });
    out+='</tr>';
  });
  return out+'</tbody></table>';
}

function makeRowData(getVal){
  return fields.map(function(f){
    return{field:f,label:fieldLabels[f],vals:annotators.map(function(_,i){return getVal(i,f);})};
  });
}

function directiveTable(ann){
  return annTable(makeRowData(function(i,f){
    var d=ann[i].directive;return d?(d[f]!=null?d[f]:null):null;
  }));
}

function chunkTable(chunkN,ann){
  return annTable(makeRowData(function(i,f){
    var c=ann[i].chunks?ann[i].chunks[chunkN]:null;return c?(c[f]!=null?c[f]:null):null;
  }));
}

function wpComments(ann){
  var items=ann.map(function(a,i){return{who:annotators[i],txt:a.wp_comment};}).filter(function(x){return x.txt;});
  if(!items.length)return '';
  var out='<div class="comments"><div class="comment-heading">Discussion notes</div>';
  items.forEach(function(x){out+='<div class="comment-item"><span class="comment-who">'+esc(x.who)+':</span> '+esc(x.txt)+'</div>';});
  return out+'</div>';
}

function rightCol(docId){
  var d=docs[docId];if(!d)return '<div class="no-chunks">No data.</div>';
  var ann=d.annotations;
  if(mode==='directive')return directiveTable(ann)+wpComments(ann);
  // subdirective
  var ckKeys=Object.keys(d.chunks||{}).sort(function(a,b){return+a-+b;});
  var out='';
  if(!ckKeys.length)out+='<div class="no-chunks">No sub-directive chunks — showing directive-level.</div>';
  else{
    ckKeys.forEach(function(n){
      out+='<div class="chunk-block"><div class="chunk-label">Chunk '+esc(n)+'</div>';
      out+='<div class="chunk-text">'+esc(d.chunks[n])+'</div>';
      out+=chunkTable(n,ann)+'</div>';
    });
  }
  out+=wpComments(ann);
  if(!ckKeys.length)out+=directiveTable(ann);
  return out;
}

function renderDoc(docId){
  var d=docs[docId];if(!d)return '';
  var m=d.metadata||{};
  var ag=docAgreement(docId);
  var badgeText=ag==='agree'?'Agreement':ag==='disagree'?'Disagreement':'Incomplete';
  var colHead=mode==='directive'?'Directive annotation':'Sub-directive annotation';
  return '<details class="doc-card" open>'
    +'<summary>'
    +'<span class="doc-id">'+esc(docId)+'</span>'
    +'<span class="doc-prez">'+esc(m.president||'')+'</span>'
    +'<span class="doc-date">'+esc(m.date||'')+'</span>'
    +'<span class="doc-type">'+esc((m.type||'').replace(/_/g,' '))+'</span>'
    +'<span class="doc-badge '+ag+'">'+badgeText+'</span>'
    +'</summary>'
    +'<div class="doc-body">'
    +'<div class="col"><p class="col-heading">Document text</p><div class="doc-text">'+esc(d.text||'(text not found)')+'</div></div>'
    +'<div class="col"><p class="col-heading">'+esc(colHead)+'</p>'+rightCol(docId)+'</div>'
    +'</div></details>';
}

function renderPanel(){
  var g=groups[activeTab];
  var seen=new Set();
  return g.docs.map(function(id){
    if(seen.has(id))return '';seen.add(id);return renderDoc(id);
  }).join('');
}

function renderTabs(){
  document.getElementById('tab-bar').innerHTML=groups.map(function(g,i){
    return'<button class="tab-btn'+(i===activeTab?' active':'')+'" data-idx="'+i+'" type="button">'
      +esc(g.label)+' <span class="tab-count">('+g.docs.length+')</span></button>';
  }).join('');
}

function render(){renderTabs();document.getElementById('content').innerHTML=renderPanel();}

document.getElementById('tab-bar').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  activeTab=+btn.dataset.idx;render();
});
document.getElementById('btn-directive').addEventListener('click',function(){
  mode='directive';
  document.getElementById('btn-directive').classList.add('active');
  document.getElementById('btn-subdirective').classList.remove('active');
  document.getElementById('content').innerHTML=renderPanel();
});
document.getElementById('btn-subdirective').addEventListener('click',function(){
  mode='subdirective';
  document.getElementById('btn-directive').classList.remove('active');
  document.getElementById('btn-subdirective').classList.add('active');
  document.getElementById('content').innerHTML=renderPanel();
});

render();

function setBarHeight(){
  var h=document.getElementById('tab-bar').getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--bar-height',h+'px');
}
setBarHeight();
window.addEventListener('resize',setBarHeight);
})();
</script>
</body>
</html>
