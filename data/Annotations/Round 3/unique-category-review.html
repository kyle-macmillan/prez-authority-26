nt":"Harry S Truman","date":"December 20, 1950","type":"executive_order"},"P45":{"president":"Lyndon B. Johnson","date":"April 07, 1968","type":"proclamation"},"EO3":{"president":"Richard Nixon","date":"March 27, 1969","type":"executive_order"},"EO7":{"president":"Gerald R. Ford","date":"March 24, 1975","type":"executive_order"},"L18":{"president":"George Bush","date":"January 10, 1992","type":"letter"},"P41":{"president":"Harry S Truman","date":"March 01, 1950","type":"proclamation"},"L3":{"president":"Dwight D. Eisenhower","date":"August 30, 1958","type":"letter"},"L6":{"president":"Barack Obama","date":"January 13, 2017","type":"letter"},"EO11":{"president":"Barack Obama","date":"December 29, 2009","type":"executive_order"},"P37":{"president":"Donald J. Trump","date":"April 03, 2025","type":"proclamation"},"EO19":{"president":"Lyndon B. Johnson","date":"April 20, 1967","type":"executive_order"},"P12":{"president":"Jimmy Carter","date":"April 07, 1978","type":"proclamation"},"M6":{"president":"Donald J. Trump","date":"January 24, 2025","type":"memorandum"},"EO26":{"president":"Jimmy Carter","date":"March 14, 1980","type":"executive_order"},"EO28":{"president":"Donald J. Trump","date":"February 18, 2025","type":"executive_order"},"P21":{"president":"Jimmy Carter","date":"July 10, 1979","type":"proclamation"},"M4":{"president":"John F. Kennedy","date":"June 22, 1961","type":"memorandum"},"P47":{"president":"William J. Clinton","date":"June 21, 1993","type":"proclamation"},"L12":{"president":"Ronald Reagan","date":"January 20, 1988","type":"letter"},"EO15":{"president":"George W. Bush","date":"September 28, 2004","type":"executive_order"},"P49":{"president":"George W. Bush","date":"December 31, 2008","type":"proclamation"},"L1":{"president":"William J. Clinton","date":"August 12, 1997","type":"letter"},"EO9":{"president":"Jimmy Carter","date":"August 18, 1978","type":"executive_order"},"M19":{"president":"William J. Clinton","date":"November 14, 1998","type":"memorandum"},"EO25":{"president":"Donald J. Trump","date":"January 20, 2025","type":"executive_order"},"P35":{"president":"Ronald Reagan","date":"January 31, 1985","type":"proclamation"},"P28":{"president":"George W. Bush","date":"October 04, 2004","type":"proclamation"},"M2":{"president":"George W. Bush","date":"February 07, 2006","type":"memorandum"},"L27":{"president":"William J. Clinton","date":"January 02, 1998","type":"letter"},"EO10":{"president":"George W. Bush","date":"March 03, 2004","type":"executive_order"},"M11":{"president":"George W. Bush","date":"September 13, 2007","type":"memorandum"}},"docTexts":{"EO20":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nSection 1. Purpose. Artificial intelligence (AI) is a defining technology of our era. Recent advancements in AI demonstrate its rapidly growing relevance to national security, including with respect to logistics, military capabilities, intelligence analysis, and cybersecurity. Building AI in the United States will help prevent adversaries from gaining access to, and using, powerful future systems to the detriment of our military and national security. It will also enable the United States Government to continue harnessing AI in service of national-security missions while preventing the United States from becoming dependent on other countries' infrastructure to develop and operate powerful AI tools.\n\nAdvances at the frontier of AI will also have significant implications for United States economic competitiveness. These imperatives require building AI infrastructure in the United States on the time frame needed to ensure United States leadership over competitors who, already, are racing to take the lead in AI development and adoption. Building AI in the United States requires enormous private-sector investments in infrastructure, especially for the advanced computing clusters needed to train AI models and the energy infrastructure needed to power this work. Already, AI's electricity and computational needs are vast, and they are set to surge in the years ahead. This work also requires secure, reliable supply chains for critical components needed to build AI infrastructure, from construction materials to advanced electronics.\n\nThis order sets our Nation on the path to ensure that future frontier AI can, and will, continue to be built here in the United States. In building domestic AI infrastructure, our Nation will also advance its leadership in the clean energy technologies needed to power the future economy, including geothermal, solar, wind, and nuclear energy; foster a vibrant, competitive, and open technology ecosystem in the United States, in which small companies can compete alongside large ones; maintain low consumer electricity prices; and help ensure that the development of AI infrastructure benefits the workers building it and communities near it.\n\nWith this order, I provide a plan for protecting national security, preserving our economic competitiveness, revitalizing our energy infrastructure, and ensuring United States leadership in AI.\n\nSec. 2. Policy. It is the policy of the United States to enable the development and operation of AI infrastructure, including data centers, in the United States in accordance with five guiding principles. When undertaking the actions set forth in this order, executive departments and agencies (agencies) shall adhere to these principles, as appropriate and consistent with applicable law:\n\n(a) The development of AI infrastructure should advance United States national security and leadership in AI. Meeting this goal will require steps by the Federal Government, in collaboration with the private sector, to advance AI development and use AI for future national-security missions, including through the work described in National Security Memorandum 25 of October 24, 2024 (Advancing the United States' Leadership in Artificial Intelligence; Harnessing Artificial Intelligence to Fulfill National Security Objectives; and Fostering the Safety, Security, and Trustworthiness of Artificial Intelligence) (NSM-25). It will also require the use of safeguards to improve the cyber, supply-chain, and physical security of the laboratories at which powerful AI is developed, stored, and used. Additionally, protecting United States national security will require further work to evaluate and manage risks related to the powerful capabilities that future frontier AI may possess.\n\n(b) The development of AI infrastructure should advance United States economic competitiveness, including by fostering a vibrant technology ecosystem. Already, AI is creating new jobs and industries, and its effects are being felt in sectors across the economy. The Federal Government must ensure that the United States remains competitive in the global economy, including through harnessing the benefits of this technology for all Americans. It must also promote a fair, open, and competitive AI ecosystem so that small developers and entrepreneurs can continue to drive innovation—a priority highlighted in both Executive Order 14110 of October 30, 2023 (Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence), and NSM-25—as well as to support secure, reliable supply-chain infrastructure for AI activities.\n\n(c) The United States can and should lead the world in operating the next generation of AI data centers with clean power. Meeting this goal will require building on recent successes to modernize our Nation's energy infrastructure; improve permitting processes; and support investments in, and expeditious development of, both currently available and emerging clean energy technologies, such as geothermal energy, nuclear energy, and long-duration energy storage used to store clean energy, as well as relevant supply chains. The United States must not be surpassed in its support for the development, commercialization, and operation of clean energy technologies at home and abroad, and the rapid buildout of AI infrastructure offers another vital opportunity to accelerate and deploy these energy technologies. To help ensure that new data center electricity demand does not take clean power away from other end users, result in resource adequacy issues, or increase grid emissions, the construction of AI infrastructure must be matched with new, clean electricity generation resources.\n\n(d) The development of AI infrastructure should proceed without raising energy costs for American consumers and businesses, and it should have strong community support. The companies developing, commercializing, and deploying AI must finance the cost of building the infrastructure needed for AI operations, including the development of next-generation power infrastructure built for these operations.\n\n(e) The development of AI infrastructure should benefit those working to build it. Meeting this goal will require high labor standards and safeguards for the buildout of AI infrastructure, consultation and close collaboration with communities affected by this infrastructure's development and operation, and continuous work to mitigate risks and potential harms. The American people more broadly must safely enjoy the gains and opportunities from technological innovation in the AI ecosystem.\n\nSec. 3. Definitions. For purposes of this order:\n\n(a) The term \"agency\" means each agency described in 44 U.S.C. 3502(1), except for the independent regulatory agencies described in 44 U.S.C. 3502(5).\n\n(b) The term \"AI data center\" means a data center used primarily with respect to developing or operating AI.\n\n(c) The term \"AI infrastructure\" refers collectively to AI data centers, generation and storage resources procured to deliver electrical energy to data centers, and transmission facilities developed or upgraded for the same purpose.\n\n(d) The term \"AI model\" means a component of an information system that implements AI technology and uses computational, statistical, or machine-learning techniques to produce outputs from a given set of inputs.\n\n(e) The term \"clean energy\" or \"clean energy generation resources\" means generation resources that produce few or no emissions of carbon dioxide during operation, including when paired with clean storage technologies. This term includes geothermal, nuclear fission, nuclear fusion, solar, wind, hydroelectric, hydrokinetic (including tidal, wave, and current), and marine energy; and carbon capture, utilization, and storage technologies (for which the carbon capture equipment meets the definition set forth in 26 C.F.R. 1.45Q-2(c)) that operate with fossil fuel generation resources, that achieve carbon dioxide capture rates of 90 percent or higher on an annual basis, and that permanently sequester the captured carbon dioxide.\n\n(f) The term \"clean power\" means electricity generated by the generation resources described in subsection (e) of this section.\n\n(g) The term \"clean repowering\" means the practice of siting new clean generation sources at a site with an existing point of interconnection and generation sources operating with fossil fuels, such that some output or capacity from existing generation sources is replaced by the new clean generation sources.\n\n(h) The term \"critical electric infrastructure information\" has the same meaning as set forth in 18 C.F.R. 388.113(c).\n\n(i) The term \"data center\" means a facility used to store, manage, process, and disseminate electronic information for a computer network, and it includes any facility that is composed of one or more permanent or semi-permanent structures, or that is a dedicated space within such structure, and operates persistently in a fixed location; that is used for the housing of information technology equipment, including servers, mainframe computers, high-performance computing devices, or data-storage devices; and that is actively used for the hosting of information and information systems that are accessed by other systems or by users on other devices.\n\n(j) The term \"distributed energy resource\" has the same meaning as set forth in 18 C.F.R. 35.28(b)(10).\n\n(k) The term \"Federal Permitting Agencies\" refers to the agency members of the Federal Permitting Improvement Steering Council (Permitting Council) established under section 41002 of the Fixing America's Surface Transportation (FAST) Act, 42 U.S.C. 4370m-1, as well as any other agency with authority to issue a Federal permit or approval required for the development or operation of AI infrastructure.\n\n(l) The term \"Federal Risk and Authorization Management Program\" refers to the program established to provide an approach for the adoption and use of cloud services by the Federal Government, as codified in 44 U.S.C. 3607-3616 (as enacted by the FedRAMP Authorization Act, section 5921 of Public Law 117-263).\n\n(m) The term \"frontier AI data center\" means an AI data center capable of being used to develop, within a reasonable time frame, an AI model with characteristics related either to performance or to the computational resources used in its development that approximately match or surpass the state of the art at the time of the AI model's development.\n\n(n) The term \"frontier AI infrastructure\" means AI infrastructure for which the relevant data center is a frontier AI data center.\n\n(o) The term \"frontier AI training\" refers to the act of developing an AI model with characteristics related either to performance or to the computational resources used in its development that approximately match or surpass the state of the art at the time of the AI model's development.\n\n(p) The term \"generation resource\" means a facility that produces electricity.\n\n(q) The terms \"interconnection,\" \"interconnection facilities,\" and \"point of interconnection\" refer to facilities and equipment that physically and electrically connect generation resources or electrical load to the electric grid for the purpose of the delivery of electricity, for which grid operators have granted all appropriate approvals required for those facilities and equipment to operate.\n\n(r) The term \"lab-security measures\" refers to steps to detect, prevent, or mitigate physical, cyber, or other threats to the operation of a data center, to the integrity of information or other assets stored within it, or of unauthorized access to such information or assets.\n\n(s) The term \"leading-edge logic semiconductors\" refers to semiconductors produced at high volumes using extreme ultraviolet lithography tools as defined by the CHIPS Incentives Program Notice of Funding Opportunity, 2023-NIST-CHIPS-CFF-01.\n\n(t) The term \"model weight\" means a numerical parameter within an AI model that helps determine the model's outputs in response to inputs.\n\n(u) The term \"new source review\" refers to the permitting program with this name in 40 C.F.R. parts 51 or 52.\n\n(v) The term \"non-Federal parties\" refers to private-sector entities that enter into a contract with the Department of Defense or the Department of Energy pursuant to section 4(g) of this order.\n\n(w) The term \"priority geothermal zone\" refers to lands with high potential for the development of geothermal power generation resources, as designated by the Secretary of the Interior, including pursuant to section 4(c) of this order.\n\n(x) The term \"project labor agreement\" means a pre-hire collective bargaining agreement that establishes the terms and conditions of a construction project.\n\n(y) The term \"surplus interconnection service\" has the same meaning as set forth in Federal Energy Regulatory Commission Order No. 845.\n\n(z) The terms \"transmission facilities\" and \"transmission infrastructure\" mean equipment or structures, including transmission lines and related facilities, used for the purpose of delivering electricity.\n\n(aa) The term \"transmission organization\" refers to a Regional Transmission Organization or an Independent System Operator.\n\n(bb) The term \"transmission provider\" means an entity that manages or operates transmission facilities for the delivery of electric energy used primarily by the public and that is not a transmission organization.\n\n(cc) The term \"waters of the United States\" has the same meaning as set forth in 33 C.F.R. 328.3(a).\n\nSec. 4. Establishing Federal Sites for AI Infrastructure. (a) By February 28, 2025, the Secretary of Defense and the Secretary of Energy shall, if possible, each identify a minimum of 3 sites on Federal land managed by their respective agencies that may be suitable for the agencies to lease to non-Federal entities for the construction and operation of a frontier AI data center, as well as for the construction and operation of clean energy facilities to serve the data center, by the end of 2027. In identifying these sites, each Secretary shall, as feasible and appropriate, seek to prioritize sites that possess the following characteristics, as consistent with the objective of fully permitting and approving work to construct a frontier AI data center at each site by the end of 2025:\n\n(i) inclusion of sufficient terrain with appropriate land gradients, soil durability, and other topographical characteristics for frontier AI data centers;\n\n(ii) minimized adverse effects from AI infrastructure development or operation on local communities' health, wellbeing, and resource access; natural or cultural resources; threatened or endangered species; and harbors or river improvements not associated with hydropower generation resources;\n\n(iii) proximity to any communities seeking to host AI infrastructure, including for reasons related to local workers' access to jobs involved in designing, building, maintaining, and operating data centers;\n\n(iv) ready access and proximity to high-voltage transmission infrastructure that minimizes the scale of, cost of, and timeline to develop any transmission upgrades or development needed to interconnect AI infrastructure, in consideration of access and proximity to:\n\n(A) high-capacity transmission infrastructure with unused capacity, as identified by collection activities described in section 6 of this order;\n\n(B) any planned generation facilities that can enable delivery of electricity to an AI data center on the site managed by each Secretary's respective agency, that possess an executed interconnection agreement with a transmission provider, that do not possess an executed power purchase agreement, and for which construction has not yet begun;\n\n(C) any lands that the Secretary of the Interior identifies pursuant to subsection (c) of this section; and\n\n(D) any power generation facilities with high clean repowering potential;\n\n(v) location within geographic areas that are not at risk of persistently failing to attain National Ambient Air Quality Standards, and where the total cancer risk from air pollution is at or below the national average according to the Environmental Protection Agency's (EPA's) 2020 AirToxScreen;\n\n(vi) lack of proximity to waters of the United States for purposes of permitting requirements;\n\n(vii) lack of extensive restrictions on land uses associated with constructing and operating AI infrastructure or on access to necessary rights-of-way for such activities;\n\n(viii) ready access to high-capacity telecommunications networks;\n\n(ix) suitability for the development of access roads or other temporary infrastructure necessary for the construction of AI infrastructure; and\n\n(x) absence of other characteristics that would, if the site was used or repurposed for AI infrastructure, compromise a competing national security concern as determined by the relevant Secretary in consultation with the Assistant to the President for National Security Affairs.\n\n(b) By March 15, 2025, the Secretary of the Interior, acting through the Director of the Bureau of Land Management (BLM), in consultation with the Secretary of Defense, the Secretary of Energy, and the Chair of the Federal Energy Regulatory Commission, shall identify sites managed by BLM that the Secretary of the Interior, acting through the Director of BLM, deems may be suitable for granting or issuing rights of way to private-sector entities to construct and operate additional clean energy facilities that are being or may be built as components of frontier AI infrastructure developed pursuant to this section. In performing this work, the Secretary of the Interior, in consultation with the Secretary of Defense and the Secretary of Energy, shall take steps to ensure where feasible and appropriate that any such sites identified under this subsection include sufficient acreage for developing clean generation resources that can deliver sufficient electricity to each site identified under subsection (a) of this section for matching the capacity needs of frontier AI data centers on the latter sites. The sites identified under this subsection shall include any land managed by the Department of the Interior that is within a region designated by the Secretary of the Interior under subsection (c) of this section, or a region preliminarily identified as a candidate for such designation. In determining the suitability of sites, the Secretary of the Interior, acting through the Director of BLM, shall prioritize identification of sites that:\n\n(i) contain completed, permitted, or planned clean generation projects that can enable delivery of electricity as described in this subsection and possess an executed interconnection agreement with a transmission provider;\n\n(ii) have been allocated as available for solar applications in the Final Programmatic Environmental Impact Statement and Proposed Resource Management Plan Amendments for Utility-Scale Solar Energy Development, published by BLM, or that have otherwise been allocated as available for clean-energy applications in a BLM resource management plan;\n\n(iii) have reasonable access to and are located nearby existing high-voltage transmission lines that have at least one gigawatt of additional capacity available, or for which such capacity can be reasonably developed through reconductoring, grid-enhancing technologies, or transmission upgrades;\n\n(iv) possess the characteristics described in subsections (a)(i)-(x) of this section, in a manner that is consistent with the objective of fully permitting and approving work to construct utility-scale power facilities on a timeline that allows for the operation of those facilities by the end of 2027 or as soon as feasible thereafter; and\n\n(v) possess other characteristics conducive to enabling new clean power development at such sites to contribute to lower regional electricity prices or to bring other community benefits.\n\n(c) By March 15, 2025, the Secretary of the Interior, acting through the Director of BLM and in consultation with the Secretary of Energy, shall, if possible, designate at least five regions composed of lands or subsurface areas managed by the Department of the Interior as Priority Geothermal Zones (PGZs). The Secretary of the Interior shall designate those regions based on their potential for geothermal power generation resources, including hydrothermal and next-generation geothermal power and thermal storage; diversity of geological characteristics; and possession of the characteristics described in subsections (a)(i)-(x) and (b)(i)-(v) of this section.\n\n(d) The Secretary of Defense, the Secretary of Energy, and the Secretary of the Interior shall each make a legal determination as to whether each site identified pursuant to subsections (a) and (b) of this section is available for lease or for the issuance of a right of way, as appropriate, pursuant to the authority of the Secretary that made the identification, and as to whether the Secretary has the legal authority to lease or grant a right of way over or upon each site identified for the construction of frontier AI infrastructure. For purposes of this order, a site shall be considered \"cleared\" under this subsection if the relevant Secretary has determined that the site is available for lease and the Secretary concerned has the authority to lease it.\n\n(e) By March 31, 2025, the Secretary of Defense and the Secretary of Energy, in coordination with the heads of any other agencies that either Secretary deems appropriate, shall coordinate to design, launch, and administer competitive public solicitations of proposals from non-Federal entities to lease Federal land to construct frontier AI infrastructure, including frontier AI data centers, on sites identified under subsection (a) of this section and cleared under subsection (d) of this section, if any. When issuing the solicitations, the Secretaries shall announce the sites identified under subsection (a) of this section and cleared under subsection (d) of this section, if any, and additional relevant information including the sites' geographic coordinates, technical characteristics, proximity to sites identified consistent with subsection (b) of this section and cleared under subsection (d) of this section, if any, and other relevant information. The solicitations shall, to the extent consistent with applicable law and to the extent the Secretaries agree that such requirements promote national defense, national security, or the public interest, as appropriate, require applicants to identify particular sites on which they propose to construct and operate frontier AI infrastructure; submit a detailed plan specifying proposed timelines, financing methods, and technical construction plans associated with such construction work, including a contingency plan for decommissioning infrastructure on Federal sites; submit a plan that describes proposed frontier AI training work to occur at the site once operational; submit a plan for detailing the extent of the use of high labor and construction standards as described in subsection (g)(viii) of this section; and submit a plan with proposed lab-security measures, including personnel and material access requirements, that could be associated with the operation of frontier AI infrastructure. These requirements should be designed to ensure adequate collection of information from applicants regarding the criteria in subsections (g)(i)-(xvi) of this section. The solicitations shall close within 30 days of their issuance.\n\n(f) By March 31, 2025, the Secretary of the Interior, in consultation with the Secretary of Defense and the Secretary of Energy, shall publicize the sites identified under subsection (b) of this section and cleared under subsection (d) of this section, if any, and additional relevant information including the sites' geographic coordinates, technical characteristics, proximity to sites identified consistent with subsection (a) of this section and cleared under subsection (d) of this section, if any, and other relevant information.\n\n(g) By June 30, 2025, the Secretary of Defense and the Secretary of Energy shall announce any winning proposals identified through solicitations described in subsection (e) of this section. In selecting any winning proposals, the Secretary of Defense and the Secretary of Energy shall, in consultation with each other, assign winners the opportunity to apply for any Federal permits needed to build and operate frontier AI infrastructure pursuant to the frameworks described in subsection (h) of this section on any sites included in the solicitations issued under subsection (e) of this section, as the Secretaries deem appropriate. The Secretaries shall consult with the Attorney General on the implications of selections on the competition and market-structure characteristics of the broader AI ecosystem. The Chair of the Federal Trade Commission is encouraged to participate in these consultations. The Secretaries shall, to the extent consistent with applicable law and to the extent that the Secretaries assess that the requirement promotes national defense, national security, or the public interest, as appropriate, select at least one proposal developed and submitted jointly by a consortium of two or more small- or medium-sized organizations—as determined by those organizations' market capitalization, revenues, or similar characteristics—provided that the Secretaries receive at least one such proposal that meets the appropriate qualifications. The Secretaries shall provide technical assistance, as appropriate, to small- or medium-sized organizations seeking to submit proposals. The criteria for selecting winning proposals shall include, at a minimum, consideration of the following characteristics of the applicants and any identified partner organizations, to the extent consistent with applicable law and to the extent that the Secretaries agree that the listed characteristics promote national defense, national security, or the public interest, as appropriate:\n\n(i) proposed financing mechanisms and sources of funds secured or likely to be secured for work to be performed at the site;\n\n(ii) plans for ensuring high-quality AI training operations to be executed at the site by the applicant or third-party partners;\n\n(iii) plans for maximizing energy, water, and other resource efficiency, including waste-heat utilization in constructing and operating the AI data center at the site, the strength of the proposed energy master plan for the site, and the quality of analysis of potential strains on local communities;\n\n(iv) safety and security measures, including cybersecurity measures, proposed to be implemented at the site, and capabilities for such implementation;\n\n(v) capabilities and acumen of applicable AI scientists, engineers, and other workforce essential to the operation of AI infrastructure;\n\n(vi) plans for commercializing or otherwise deploying or advancing deployment of appropriate intellectual property, including AI model weights, developed at the site, as well as plans for commercializing or otherwise deploying or advancing deployment of innovations related to power generation and transmission infrastructure developed in the course of building or operating AI infrastructure;\n\n(vii) plans to help ensure that the construction and operation of AI infrastructure does not increase electricity costs to other ratepayers or water costs to consumers, including, as appropriate, through appropriate proposed or recommended future engagement with any applicable regulatory authorities and State, Tribal, or local governments;\n\n(viii) plans to use high labor standards that help ensure continuous and high-quality work performed on the site, such as paying prevailing wages; hiring registered apprentices; promoting positive labor-management relations through a project labor agreement; and otherwise adopting high job quality and labor standards for the construction and operations workforce as set forth in Executive Order 14126 of September 6, 2024 (Investing in America and Investing in American Workers), and a plan to address labor-related risks associated with the development and use of AI;\n\n(ix) design features and operational controls and plans that mitigate potential environmental effects and implement strong community health, public safety, and environmental protection measures;\n\n(x) other benefits to the community and electric grid infrastructure surrounding the site;\n\n(xi) experience completing comparable construction projects;\n\n(xii) experience in compliance with Federal, State, and local permits and environmental reviews relevant to construction and operation of AI infrastructure or, in the alternative, other evidence of an ability to obtain and comply with such permits or reviews in an efficient manner;\n\n(xiii) the presence of organizational and management structures to help ensure sound governance of work performed at the site;\n\n(xiv) the effect of the selection of an applicant on the emergence of an interoperable, competitive AI ecosystem;\n\n(xv) whether an applicant has already been assigned an opportunity, or is being assigned another opportunity, to build a frontier AI data center on a Federal site through the solicitation process described in this section; and\n\n(xvi) other considerations of national defense, national security, or the public interest, including economic security, as the Secretary of Defense and the Secretary of Energy deem appropriate.\n\n(h) By June 30, 2025, the Secretary of Defense and the Secretary of Energy, in consultation with the Secretary of the Interior, shall each develop a framework through which any winning applicants selected under subsection (g) of this section may apply to lease sites respectively identified under subsection (a) of this section, and cleared under subsection (d) of this section, to construct and operate AI infrastructure, and by which the applicants may own the AI infrastructure facilities on those sites, subject to the conditions described in subsections (i)-(x) of this subsection. To the extent that the Secretaries assess that it is consistent with national defense, national security, or the public interest, as appropriate, these frameworks shall allow for winning applicants to cooperate with other appropriate private-sector entities on construction and operation activities, including through contracting and subcontracting relationships, and the frameworks shall not require that parties proposing to own AI infrastructure be identical to those proposing to operate the infrastructure or perform work at the sites on which the infrastructure is located. Actions taken by Federal entities pursuant to the frameworks shall conform to any applicable requirements of Appendix B of Office of Management and Budget (OMB) Circular A-11 and any other appropriate budget-scoring practices; applicable in-kind consideration shall be taken into account in calculating the cost to lessees of any such leases. As part of the foregoing work, the Secretary of Defense and the Secretary of Energy shall, to the extent consistent with their respective authorities and with national defense, national security, or the public interest, as appropriate, require lease or contract terms that accomplish the following:\n\n(i) establish a target of the applicant's beginning construction of a frontier AI data center by January 1, 2026, and commencing full-capacity operation of the AI infrastructure by December 31, 2027, subject to fulfillment of relevant statutory and regulatory requirements, and in a manner consistent with opportunities to operate the infrastructure at or below full capacity at an earlier date;\n\n(ii) require that, concurrent with operating a frontier AI data center on a Federal site, non-Federal parties constructing, owning, or operating AI infrastructure have procured sufficient new clean power generation resources with capacity value to meet the frontier AI data center's planned electricity needs, including by providing power that matches the data center's timing of electricity use on an hourly basis and is deliverable to the data center;\n\n(iii) clarify that non-Federal parties bear all responsibility for paying any costs that parties to the frameworks described in subsection (h) of this section, as well as transmission providers or transmission organizations or other entities not party to the contract, incur from work pursuant to it, including costs of work performed by agencies to complete necessary environmental reviews, any costs related to the procurement of clean powe","M14":"Memorandum for the Secretary of Agriculture\n\nSubject: Eligibility of Aliens for Food Stamps\n\nUnder the provisions of the Personal Responsibility and Work Opportunity Reconciliation Act of 1996, which today I signed into law, aliens receiving food stamps as of the date of enactment will continue to receive benefits until recertification of their eligibility, which shall take place not more than 1 year after enactment of the law. The results of the certification, including decisions as to an individual's immigration classification, veteran status, or work history, will determine whether the individual remains eligible for benefits under the Food Stamp program. Implementation of these new procedures will pose a substantial challenge for all involved Federal and State agencies.\n\nTo ensure that eligibility determinations are made fairly, accurately, and effectively, I direct you to take the steps necessary under your authority to permit the State agencies to extend the certification periods of currently participating aliens, provided that no certification period is extended to longer than 12 months, or up to 24 months if all adult household members are elderly or disabled, and provided that in no event shall certifications be extended beyond August 22, 1997.\n\nI further direct you to notify the States of the actions you have taken.\n\nWILLIAM J. CLINTON","L31":"Dear Mr. Speaker: (Dear Mr. President:)\n\nSection 202(d) of the National Emergencies Act (50 U.S.C. 1622(d)) provides for the automatic termination of a national emergency unless, prior to the anniversary date of its declaration, the President publishes in the Federal Register and transmits to the Congress a notice stating that the emergency is to continue in effect beyond the anniversary date. In accordance with this provision, I have sent the enclosed notice, stating that the Iran emergency is to continue in effect beyond November 14, 1994, to the Federal Register for publication. Similar notices have been sent annually to the Congress and the Federal Register since November 12, 1980. The most recent notice appeared in the Federal Register on November 2, 1993.\n\nThe crisis between the United States and Iran that began in 1979 has not been fully resolved. The international tribunal established to adjudicate claims of the United States and U.S. nationals against Iran and of the Iranian government and Iranian nationals against the United States continues to function, and normalization of commercial and diplomatic relations between the United States and Iran has not been achieved. In these circumstances, I have determined that it is necessary to maintain in force the broad authorities that are needed in the process of implementing the January 1981 agreements with Iran and in the eventual normalization of relations with that country.\n\nSincerely,\n\nWILLIAM J. CLINTON","EO17":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the National Emergencies Act (50 U.S.C. 1601 et seq.), and in furtherance of Proclamation 9994 of March 13, 2020 (Declaring a National Emergency Concerning the Novel Coronavirus Disease (COVID–19) Outbreak), which declared a national emergency by reason of the threat that the novel (new) coronavirus known as SARS–CoV–2 poses to our Nation's healthcare systems, I hereby order as follows:\n\nSection 1. Emergency Authority. To provide additional authority to the Secretaries of Defense and Homeland Security to respond to the national emergency declared by Proclamation 9994, the authorities under section 12302 of title 10, United States Code, and sections 2127, 2308, 2314, and 3735 of title 14, United States Code, are invoked and made available, according to their terms, to the Secretaries of Defense and Homeland Security. The Secretaries of the Army, Navy, and Air Force, at the direction of the Secretary of Defense, and the Secretary of Homeland Security with respect to the Coast Guard when it is not operating as a service in the Navy, are authorized to order to active duty not to exceed 24 consecutive months, such units, and individual members of the Ready Reserve under the jurisdiction of the Secretary concerned, not to exceed 1,000,000 members on active duty at any one time, as the Secretary of Defense and, with respect to the Coast Guard when it is not operating as a service in the Navy, the Secretary of Homeland Security consider necessary. The Secretary of Defense or the Secretary of Homeland Security, as applicable, will ensure appropriate consultation is undertaken with relevant state officials with respect to the utilization of National Guard Reserve Component units activated under this authority.\n\nSec. 2. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nMarch 27, 2020.","P10":"By the President of the United States of America\n\nA Proclamation\n\n1. Whereas, under the authority vested in him by the Constitution and the statutes, including section 350 (a) of the Tariff Act of 1930, as amended, the President on October 30, 1947, entered into a trade agreement with certain foreign countries, which trade agreement consists of the General Agreement on Tariffs and Trade and the related Protocol of Provisional Application thereof, together with the Final Act Adopted at the Conclusion of the Second Session of the Preparatory Committee of the United Nations Conference on Trade and Employment (61 Stat. (Parts 5 and 6) A7, All, and A2050), and, by Proclamation No. 2761A of December 16, 1947 (61 Stat. 1103), proclaimed such modifications of existing duties and other import restrictions of the United States and such continuance of existing customs or excise treatment of articles imported into the United States as were then found to be required or appropriate to carry out the said trade agreement on and after January 1, 1948;\n\n2. Whereas item 1010 in Part I of Schedule XX (original) annexed to the said General Agreement (61 Stat. (Part 5) Al264) reads as follows:\n\n3. Whereas, in accordance with Article II of the said General Agreement and by virtue of the said Proclamation No. 2761A, the United States duty treatment of toweling (i. e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in the said item 1010 is the application to the said toweling of the rate of duty specified in the column designated \"Rate of Duty\" in the said item 1010, which treatment reflects the duty concessim granted in the said General Agreement with respect to the said toweling;\n\n4. Whereas the United States Tariff Commission has submitted to me its report of an investigation, including a hearing, under section 7 of the Trade Agreements Extension Act of 1951, as amended (65 Stat. 72; 67 Stat. 472; 69 Stat. 162), on the basis of which it has found that the said toweling is, as a result in part of the duty reflecting the concession granted thereon in the said General Agreement, being imported into the United States in such increased quantities, both actual and relative, as to cause serious injury to the domestic industry producing like or directly competitive products;\n\n5. Whereas the said Tariff Commission has further found that in order to remedy the serious injury to the said domestic industry it is necessary to restore the rate of duty originally imposed on the said toweling by paragraph 1010 of the Tariff Act of 1930, namely, 40 per centum ad valorem, and has accordingly recommended the withdrawal of the duty concession granted in the said General Agreement with respect to the said toweling;\n\n6. Whereas, I find that the withdrawal for an indefinite period of the duty concession granted in the said General Agreement with respect to the said toweling, to permit the application to such products of the original rate of duty imposed thereon under paragraph 1010 of the Tariff Act of 1930, is necessary to remedy the serious injury to the said domestic industry; and\n\n7. Whereas upon the withdrawal of the said concession the rate of duty which will apply to the said toweling will be 40 per centum ad valorem:\n\nNow, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under the authority vested in me by section 350 of the Tariff Act of 1930, as amended, and section 7 (c) of the Trade Agreements Extension Act of 1951, and in accordance with the provisions of Article XIX of the said General Agreement, do proclaim that, effective after the close of business July 25, 1956, and until otherwise proclaimed by the President, the duty concession granted in the said General Agreement with respect to toweling (i.e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in item 1010 in Part I of Schedule XX (original) of the said General Agreement, shall be withdrawn, and Proclamation No. 2761A of December 16, 1947, shall be suspended insofar as it applies to the said toweling described in the said item 1010.\n\nIn Witness Whereof, I have hereunto set my hand and caused the seal of the United States of America to be affixed.\n\nDONE at the City of Washington this 25th day of June in the year of our Lord nineteen hundred and fifty-six, and of the Independence of the United States of America the one hundred and eightieth.\n\nDWIGHT D. EISENHOWER\n\nBy the President:\n\nJOHN FOSTER DULLES,\n\nSecretary of State","M23":"Memorandum for the Special Representative for Trade Negotiations\n\nSubject: Determination Under Section 202(b) of the Trade Act; Clothespins\n\nPursuant to section 202(b)(1) of the Trade Act of 1974 (P.L. 93-618, 88 Stat. 1978), I have determined the action I will take with respect to the report of the United States International Trade Commission (USITC), transmitted to me on December 12, 1978, concerning the results of its investigation of import injury which was established on its own motion. The investigation was initiated as an outgrowth of information collected in conjunction with Commission investigations Nos. TA-406-2, TA-406-3, and TA- 406-4, conducted under section 406(a) of the Trade Act of 1974 and concerning clothespins from the People's Republic of China, the Polish People's Republic, and the Socialist Republic of Romania. All four investigations have concerned clothespins imported under items 790.05, 790.07, and 790.08 of the TSUS.\n\nAfter considering all relevant aspects of the case, including those considerations set forth in section 202(c) of the Trade Act of 1974, I have decided to accept a variation of the injury relief recommendation made by the USITC. Within 15 days, I will issue a Presidential Proclamation authorizing that a three-year global import quota be established on wood and plastic clothespins (TSUS item 790.05) with a dutiable value not over $1.70 per gross in the amount of two million gross pins. The quota, administered quarterly on a pro rata basis, will be allocated as follows:\n\nYearly quota allocation\n\nCategory (gross)\n\nValued not over 80 cents per gross------------------------ 500, 000 Valued over 80 cents per gross but not over $1.35 per gross---------------------------------- 600, 000 Valued over $1.35 per gross but not over $1.70 per gross---------------------------------- 900, 000\n\nTotal --------------------------------------------- 2, 000, 000\n\nDuring the course of each year, as it becomes apparent that the quota for any price bracket will not be filled for the year, then the remainder of the allocation may be reapportioned among the brackets whose quotas have been filled.\n\nRelief is warranted for the following reasons:\n\n1. The social costs of denying relief would be very high, since producers are located in isolated regions in the Northeast where alternative employment is scarce.\n\n2. Assistance will not be costly and will not impose an inflationary burden on the economy. The major clothespin manufacturers have provided commitments to comply with the Administration's anti-inflation program.\n\n3. Major clothespin producers have given their assurances that the relief period will be used to modernize facilities, improve distributional channels and promote their product. These steps should put them in a better competitive position once relief is lifted.\n\nThis determination is to be published in the FEDERAL REGISTER.\n\nJIMMY CARTER\n\n[Filed with the Office of the Federal Register, 4:33 p.m., February 8, 1979]","EO6":"By virtue of the authority vested in me by the act of August 9, 1950, 64 Stat. 427, which amended section 1, Title II of the act of June 15, 1917, 40 Stat. 220 (50 U.S.C. 191), and as President of the United States, I hereby prescribe the following amendment of the regulations prescribed by Executive Order No. 10173 of October 18, 1950, as amended by Executive Order No. 10277 of August 1, 1951, which regulations constitute Part 6, Subchapter A, Chapter I, Title 33 of the Code of Federal Regulations:\n\nSection 6.10-1 is amended to read as follows:\n\n§ 6.10-1 Issuance of documents and employment of persons aboard vessels. No person shall be issued a document required for employment on a merchant vessel of the United States nor shall any person be employed on a merchant vessel of the United States unless the Commandant is satisfied that the character and habits of life of such person are such as to authorize the belief that the presence of the individual on board would not be inimical to the security of the United States: Provided, that the Commandant may designate categories of merchant vessels to which the foregoing shall not apply.\n\nHARRY S. TRUMAN\n\nTHE WHITE HOUSE,\n\nMay 19, 1952","EO30":"By virtue of authority vested in me by the Act of August 2, 946 (60 Stat. 806), as amended by section 1 of the Act of September 23, 1950, Public Law 830, 81st Congress, it is ordered that Executive Order 9805 of November 25, 1946 and Schedule A attached to and made a part thereof, as amended by Executive Order 9933 of February 27, 1948, Executive Order 9997 of September 8, 1948 and Executive Order 10069 of July 14, 1949, prescribing regulations governing payment of travel and transportation expenses of civilian officers and employees of the United States when transferred from one official station to another for permanent duty, be, and it is hereby, amended with respect to sections 3, 4, 8, 11, 12(a), 14, 17, 25, and Schedule A to read as follows:\n\nSEC. 3. Transportation expenses of immediate family. The transportation of the immediate family of an employee shall be subject to those provisions of the Standardized Government Travel Regulations which relate to transportation, including mileage, and shall be in accordance with section 4 of the Travel Expense Act of 1949, whether the travel originates at the employee's last official station or at some other point or partially at both and whether the pint of destination is the new official station or some other point selected by him, or both. The cost to the Government shall not exceed the cost of transportation by a usually traveled route between the last official station and the new official station.\n\nSEC. 4. Payment of expenses. The travel and transportation expenses allowable under these regulations, when authorized or approved by such subordinate official or officials as the head of the department concerned may designate, shall be paid in case of transfer from one official station to another, including transfer from one department to another, for permanent duty, but in no case in which the transfer is made primarily for the convenience or benefit of the employee or at his request. In case of transfer from one department to another such expenses shall be paid from the funds of the department to which the employee is transferred. The expenses of travel and transportation in connection with the transfer of officers and employees to posts of duty outside the continental limits of the United States shall not be allowed unless and until the officer or employee selected for such transfer shall agree in writing to remain in the Government service for twelve months following the effective date of this transfer, unless separated for reasons beyond his control and acceptable to the department or agency concerned. In case of violation of such agreement any moneys expended by the United States on account of such travel and transportation shall be recoverable from the individual concerned as a debt due the United States. The expenses of return travel and transportation upon separation from service shall be allowed whether such separation is for the purposes of the Government or for personal convenience, but shall not be allowed unless such officer or employee transferred to posts of duty outside the continental United States shall have served for a minimum period of not less than one nor more than three years prescribed in advance by the head of the department or agency concerned or unless separation is for reasons beyond the control of the individual and acceptable to the department or agency concerned.\n\nSEC. 8. Origin and destination of shipment. The expenses of transportation authorized hereunder or reimbursement on a commuted basis within the continental United States shall be allowable whether the shipment originates at the employee's last official station or at some other point or partially at both or whether the point of destination is the new official station or some other point selected by him, or both: Provided, That the cost to the Government shall not exceed the cost of shipment in one lot by the most economical route from the last official station to the new. No expenses shall be allowable for the transportation of property acquired en route from the last official station to the new. For the purposes of these regulations, the term \"official station\" shall be construed to include any point from which the employee commutes daily to his official post of duty.\n\nSEC. 11. Employees not affected. These regulations shall not apply to: (1) officers and employees transferred in accordance with the provisions of the Foreign Service Act of 1946; or (2) persons whose pay and allowances are established by the Career Compensation Act of 1949. (P.L. 351, 81st Congress.)\n\nSEC. 12. (a) Commutation of expenses-General. In lieu of the payment of actual expenses of transportation, packing, crating, drayage, and unpacking of household goods and personal effects in the case of transfers between points within the continental United States, reimbursement shall be made to the employee on a commuted basis at rates per hundred pounds as fixed by zones in Schedule A which is attached to and made a part of these regulations. The amount payable shall be the product of the applicable rate and the net weight of household goods and personal effects actually transported (within the weight limitation prescribed by section 16 hereof). Where the weight of the household goods transported is less than the minimum weight allowance chargeable under applicable tariffs the employee may be reimbursed to the extent of the minimum tariff requirement. Government bills of lading shall not be used.\n\nSEC. 14. Evidence of shipment. Employees shall be required to submit the original bills of lading, or a certified copy thereof or if no bill of lading is available, other evidence showing point of origin, destination, and weight. In instances in which no proper weighting facilities are readily available at point of origin a constructive weight, based on seven pounds per cubic foot of properly loaded van space, may be used.\n\nSEC. 17. Maximum allowance for transportation. (a) Weight. The actual costs of transportation of the household goods and personal effects of the employee, not in excess of 7,000 pounds net, and of the packing, crates, boxes, lift vans, or other temporary containers required for the shipment, shall be allowed in the case of transfers to or from points outside the continental United States: Provided, That employees who have no immediate family shall be entitled to the transportation of household effects and other personal property not in excess of 2,500 pounds net. Gross weight shall include the net weight of the property and the weight of packing, crates, boxes, or lift vans which have no connection with the property except for the purposes of the immediate shipment and which do not constitute a continuing part of the property of the employee. For the application of the limitations prescribed by this section the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing and crating used for the shipment: Provided, That in case of shipments involving transportation by vessel over all or part of the distance, the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing, crating, boxing, and left vans used for the shipment: And provided further, That when shipment is by motor freight the gross weight of the property shall be the actual weight of the goods transported. Thus, transportation shall be allowed at Government expense for property when packed, crated, boxed, or placed in lift vans for shipment, within the following maximum weights:\n\nPounds\n\nEmployees having immediate family:\n\nShipment involving transportation by vessel over all or\n\npart of route or by rail or motor carriers requiring\n\npacking or crating-------------------------------------------------------- 8,750\n\nShipment by motor carriers of household goods uncrated---------- 7,000\n\nEmployees having no immediate family:\n\nShipment involving transportation by vessel over all or\n\nPart of route or by rail or motor carriers requiring\n\nPacking or crating--------------------------------------------------------- 3,125\n\nShipment by motor carriers of household goods uncrated---------- 2,500\n\n(b) Volume. Where charges for transportation are computed on a basis of measurement rather than weight charges will be allowed regardless of weight for not to exceed 25 measurement tons of forty cubic feet each inclusive of packing, crating, and lift vans: Provided, That employees who have no immediate family shall be allowed charges for not to exceed 9 measurement tons\n\n(c) Weight and volume on same shipment. When shipment must be made over such a route that the transportation necessarily involves charges based upon weight over part of the distance and upon measurement over another part of the distance, the following conditions shall apply: (1) if the weight does not exceed the limitations prescribed in subsection (a) payment shall be allowed for actual charges over the entire distance regardless of whether the measurement is in excess of the limitations imposed by subsection (b); (2) if both weight and measurement are in excess of the prescribed limitations payment shall not be allowed for the excess by weight over that part of the distance where charges are based on weight, or for the excess by measurement over that part of the distance where charges are based on measurement.\n\nSEC. 25. Shipment by American vessels. All shipments of property by water shall be made on ships registered under the laws of the United States whenever such ships are available.\n\nThis order shall be effective in any case in which the travel or transpiration is authorized or approved and commenced on or after September 23, 1950.\n\nHARRY S. TRUMAN\n\nTHE WHITE HOUSE,\n\nDecember 20, 1950","P45":"By the President of the United States of America\n\nA Proclamation\n\nWhereas the Governor of the State of Illinois has informed me that conditions of domestic violence and disorder exist in and about the City of Chicago in that State, obstructing the execution and enforcement of the laws, and that the law enforcement resources available to the City and State, including the National Guard, have been unable to suppress such acts of violence and to restore law and order; and\n\nWhereas the Governor has requested me to use such of the armed forces of the United States as may be necessary for those purposes; and\n\nWhereas such domestic violence and disorder are also obstructing the execution of the laws of the United States, including the protection of federal property in and about the City of Chicago:\n\nNow, Therefore, I, Lyndon B. Johnson, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, including Chapter 15 of Title 10 of the United States Code, do command all persons engaged in such acts of violence to cease and desist therefrom and to disperse and retire peaceably forthwith.\n\nIn Witness Whereof, I have hereunto set my hand this 7th day of April, in the year of our Lord nineteen hundred and sixty-eight, and the Independence of the United States of America the one hundred and ninety-second.\n\nLYNDON B. JOHNSON\n\nApril 7, 1968\n\n1 a.m.\n\nThe White House Washington, D.C.","EO3":"By virtue of the authority vested in me by section 6103 (a) of the Internal Revenue Code of 1954, as amended (68A Stat. 753; 26 U.S.C. 6103 (a)), it is hereby ordered that any income, estate, or gift tax return for the years 1956 to 1970, inclusive, shall, during the Ninety-first Congress, be open to inspection by the Committee on Public Works, House of Representatives, or any duly authorized subcommittee thereof, in connection with its investigation of the policies, procedures, and practices involved in the administration of the Federal-Aid Highway Program, pursuant to House Resolution 189, 91st Congress, agreed to February 19, 1969. Such inspection shall be in accordance and upon compliance with the rules and regulations prescribed by the Secretary of the Treasury in Treasury Decision 6132, relating to the inspection of returns by committees of the Congress, approved by the President on May 3, 1955.\n\nThis order shall be effective upon its filing for publication in the Federal Register.\n\nRICHARD NIXON\n\nThe White House\n\nMarch 27, 1969","EO7":"Title V of the Trade Act of 1974, hereinafter referred to as the Act (Public Law 93-618, 88 Stat. 1978), provides for a Generalized System of Preferences by which eligible articles from a beneficiary developing country may be provided duty-free treatment.\n\nThe Act authorizes the President to designate a country as a beneficiary developing country if such country meets the qualifications of the Act. Prior thereto, the President is to notify the House of Representatives and the Senate of his intention to make such designations and of the considerations entering into such decisions. I have so notified the House of Representatives and the Senate with respect to the countries listed in this Executive order.\n\nIn order to implement the Generalized System of Preferences, the Trade Act requires (1) designation of beneficiary developing countries, (2) publication and transmission to the International Trade Commission of the lists of articles which will be considered for designation as eligible articles for purposes of generalized preferences, and (3) submission by the International Trade Commission of its advice to the President within six months as to the probable economic effect on domestic producers and consumers of implementing generalized preferences for those listed articles.\n\nConcurrently with publication of those listed articles and transmission thereof to the International Trade Commission for its advice as required by the Act, I also intend to ask the Commission to provide its advice, pursuant to Section 332(g) of the Tariff Act of 1930, as amended (19 U.S.C. 1332), with respect to articles of those countries designated and those which are still under consideration for designation as beneficiary developing countries.\n\nThe President is authorized to modify at any time the list of beneficiary developing countries designated herein, and for that purpose there shall be a continuing review of the eligibility of countries to be so designated under the provisions of the Act.\n\nNow, THEREFORE, by virtue of the authority vested in me by the Trade Act of 1974, and as President of the United States of America, it is hereby ordered as follows:\n\nSECTION 1. The following named countries are designated as beneficiary developing countries for purposes of the Generalized System of Preferences authorized by Title V of the Act:\n\n(a) Those Responsible for Their Own External Relations.\n\n(b) Those for Whom Another Country is Responsible for Their External Relations.\n\nSEC. 2. The following named countries are identified as under consideration for designation as beneficiary developing countries in accordance with the criteria set forth in Title V of the Act:\n\nGERALD R. FORD\n\nThe White House,\n\nMarch 24, 1975.","L18":"Dear Mr. Speaker: (Dear Mr. President:)\n\nPursuant to the provisions of subsection (b) of the Pelly Amendment to the Fishermen's Protective Act of 1967, as amended (22 U.S.C. 1978), I am reporting to you that the Secretary of Commerce has reported to me that the countries of Costa Rica, France, Italy, Japan, and Panama have been under an embargo since May 24, 1991. No yellowfin tuna or products derived from yellowfin tuna harvested in the eastern tropical Pacific Ocean (ETP) by purse seine vessels of Mexico, Venezuela, or Vanuatu may be imported into the United States from these nations.\n\nThe Secretary's letter to me is deemed to be a certification for the purposes of subsection (a) of the Pelly Amendment. Subsection (a) requires that I consider and, at my discretion, order the prohibition of imports into the United States of fish and fish products from Costa Rica, France, Italy, Japan, and Panama, to the extent that such prohibition is consistent with the General Agreement on Tariffs and Trade. Subsection (b) requires me to report to the Congress within 60 days following certification on the actions taken pursuant to the certification; if fish and wildlife imports have not been prohibited, the report must state the reasons for the lack of a prohibition.\n\nAfter thorough review, I have determined that, given that an embargo is currently in effect and given the negotiations towards an international dolphin conservation program in the ETP, sanctions will not be imposed against intermediary nations at this time. Costa Rica, France, Italy, Japan, and Panama will continue to be certified, and we will review their status as intermediary nations under the Marine Mammal Protection Act, if requested for 1992. I will make further reports to you as developments warrant.\n\nSincerely,\n\nGeorge Bush","P41":"By the President of the United States of America\n\nA Proclamation\n\n1. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by section 1 of the act of June 12, 1934, by the joint resolution approved June 7, 1943, by sections 2 and 3 of the act of July 5, 1945 (ch. 474, 48 Stat. 943, ch. 118., 57 Stat. 125, ch. 269, 59 Stat. 410 and 411), and by sections 4 and 6 of the Trade Agreements Extension Act of 1949 (Public Law 307, 81st Congress), the period for the exercise of the said authority having been extended by section 3 of the Trade Agreements Extension Act of 1949 until the expiration of three years from June 12, 1948, on October 10, 1949, I entered into a trade agreement providing for the accession to the General Agreement on Tariffs and Trade (Treaties and Other International Acts Series 1700) of the Governments of the Kingdom of Denmark, the Dominican Republic, the Republic of Finland, the Kingdom of Greece, the Republic of Haiti, the Republic of Italy, the Republic of Liberia, the Republic of Nicaragua, the Kingdom of Sweden, and the Oriental Republic of Uruguay, which trade agreement for accession consists of the Annecy Protocol of Terms of Accession to the General Agreement on Tariffs and Trade, dated October 10, 1949, including the annexes thereto (Dept. of State Publ. 2664);\n\n2. Whereas by Proclamation 2867 of December 22, 1949 (14 F.R. 7723), I proclaimed such modifications of existing duties and the other import restrictions of the United States of America and such continuance of existing customs or excise treatment of articles imported into the United States of America as were then found to be required or appropriate to carry out the said trade agreement for accession on and after January 1, 1950;\n\n3. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by the acts specified in the first recital of this proclamation except the Trade Agreements Extension Act of 1949, the period for the exercise of the authority under the said section 350 having been extended by section 1 of the said act of July 5, 1945 (ch. 269, 59 Stat. 410), until the expiration of three years from June 12, 1945, on October 30, 1947, I entered into an exclusive trade agreement with the Government of the Republic of Cuba (Treaties and Other International Acts Series 1703), which exclusive trade agreement includes certain portions of other documents made a part thereof and provides for the customs treatment in respect of ordinary customs duties of products of the Republic of Cuba imported into the United States of America;\n\n4. Whereas by Proclamation No. 2764 of January 1, 1948 (3 CFR, 1948 Supp., p. 11), I proclaimed such modifications of existing duties and other import restrictions of the United States of America in respect of products of the Republic of Cuba and such continuance of existing customs and excise treatment of products of the Republic of Cuba imported into the United States of America as were then found to be required or appropriate to carry out the said exclusive trade agreement on and after January 1, 1948, which proclamation has been supplemented by the said proclamation of December 22, 1949, and by the supplemental proclamations referred to in the fourth recital of the said proclamation of December 22, 1949;\n\n5. Whereas, the trade agreement for accession specified in the first recital of this proclamation has been signed by the Government of the Kingdom of Greece under such circumstances that it will enter into force for such Government, and such Government will become a contracting party to the said general agreement, on march 9, 1950;\n\n6. Whereas I determine that the application of each of the concessions provided for in Part I of Schedule XX in Annex A of the said trade agreement for accession which were withheld from application in accordance with paragraph 4 of the said trade agreement for accession by the said proclamation of December 22, 1949, as are identified in the following list is required or appropriate to carry out, on and after March 9, 1950, the said trade agreement for accession:\n\nItem\n\n(paragraph) Rates of duty\n\n10 5% ad val.\n\n38 3 ¾% ad val.\n\n53 3 ¼ per lb.\n\n328 [first] 12 ½ % ad val.\n\n601 20 per lb.\n\n740 3 per lb.\n\n742 1 per lb.\n\n744 All rates\n\n781 12 ½ % ad val.\n\n1519 (b) Both rates\n\n1545 12 ½% ad val.\n\n1672 Free\n\n1686 Free\n\n1732 Free [identified as to olive oil only];\n\n7. Whereas I determine that, in view of the determination set forth in the sixth recital of this proclamation, the deletion of Item 328 from the list set forth in the ninth recital of the said proclamation of January 1, 1948, as amended and rectified, is required or appropriate to carry out, on and after March 9, 1950, the said exclusive trade agreement specified in the third recital of this proclamation:\n\nNow, Therefore, I, Harry S. Truman, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and the statutes, including the said section 350 of the Tariff Act of 1930, as amended, do proclaim as follows:\n\nPART I\n\nTo the end that the said trade agreement for accession specified in the first recital of this proclamation may be carried out, the identification of each of the concessions provided for in Part I of the said Schedule XX in Annex A which is included in the sixth recital of this proclamation shall, on and after March 9, 1950, be included in the list set forth in the ninth recital of the said proclamation of December 22, 1949.\n\nPART II\n\nTo the end that the said exclusive trade agreement specified in the third recital of this proclamation may be carried out, the list set forth in the ninth recital of the said proclamation of January 1 1948, as amended and rectified, shall, on and after March 9, 1950, be further amended by deleting therefrom the Item 328 referred to in the seventh recital of this proclamation.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDone at the City of Washington this 1st day of March in the year of our Lord nineteen hundred and fifty, and of the Independence of the United States of America the one hundred and seventy-fourth.\n\nHARRY S. TRUMAN\n\nBy the President:\n\nDEAN ACHESON,\n\nSecretary of State.","L3":"[ Released August 30, 1958. Dated August 19, 1958 ]\n\nDear John:\n\nI strongly agree that the memory of Dr. Lawrence, as well as his great contributions, should be commemorated. To that end, I request that you initiate action to establish a memorial award beating his name, for especially meritorious contributions in the broad field of atomic endeavor.\n\nSuch an award would seem to me to be most fitting both as a recognition of what he has given to our country and to mankind, and as a means of helping to carry forward his work through inspiring others to dedicate their lives and talents to scientific effort.\n\nWith warm regard,\n\nSincerely,\n\nDWIGHT D. EISENHOWER","L6":"Dear Mr. Speaker: (Dear Mr. President:)\n\nConsistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b), I hereby report that I have issued an Executive Order (the \"order\") that revokes sections 1 and 2 of Executive Order 13067 of November 3, 1997, and revokes Executive Order 13412 of October 13, 2006, in its entirety. Both actions are effective 180 days from January 13, 2017, provided that certain further action is taken by the Secretary of State on or before that date. I have determined that the situation that gave rise to the actions taken in those orders related to the policies and actions of the Government of Sudan has been altered by Sudan's positive actions over the past 6 months. These actions include a marked reduction in offensive military activity, culminating in a pledge to maintain a cessation of hostilities in conflict areas in Sudan, and steps toward the improvement of humanitarian access throughout Sudan, as well as cooperation with the United States on addressing regional conflicts and the threat of terrorism.\n\nThe President issued Executive Order 13067 to deal with the unusual and extraordinary threat to the national security and foreign policy of the United States posed by the actions and policies of the Government of Sudan, including support for international terrorism; efforts to destabilize neighboring governments; and the prevalence of human rights violations. Section 1 of Executive Order 13067 blocks the property and interests in property of the Government of Sudan, and section 2 prohibits a broad range of trade and investment-related transactions with Sudan, including imports from and exports to Sudan. The President expanded the scope of the national emergency declared in Executive Order 13067 in Executive Order 13400 of April 26, 2006, which blocks the property and interests in property of certain persons in connection with the conflict in Darfur. The President took additional steps with respect to the national emergency declared in Executive Order 13067 in Executive Order 13412 due to policies and actions of the Government of Sudan that violated human rights, in particular with respect to the conflict in Darfur, and the pervasive role played by the Government of Sudan in the petroleum and petrochemical industries in Sudan. Executive Order 13412 continues the blocking of the Government of Sudan, specifies new prohibitions relating to Sudan's petroleum industry, and exempts certain specified areas in Sudan from the trade prohibitions found in Executive Order 13067.\n\nWith the positive steps taken by the Government of Sudan over the last 6 months, and provided that these positive actions are sustained over the next 180 days, there will be no further need for sections 1 and 2 of Executive Order 13067 or for Executive Order 13412. The 180-day delay period of the order's effective date with respect to removing these provisions is intended to encourage the Government of Sudan to sustain its efforts in these areas. The order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, and based on a consideration of relevant and credible information from available sources, including nongovernmental organizations, on or before July 12, 2017, to provide a report to the President on the Government of Sudan's progress in sustaining the positive actions taken by the Government of Sudan that gave rise to the order, including carrying out the Government of Sudan's pledge to maintain a cessation of hostilities in conflict areas in Sudan; continuing improvement of humanitarian access throughout Sudan; and maintaining its cooperation with the United States on addressing regional conflicts and the threat of terrorism. As much of the report as possible shall be unclassified and made public. Provided that the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, publishes on or before July 12, 2017, a notice in the Federal Register stating that the Government of Sudan has sustained the positive actions that gave rise to the order and has provided to the President the report described above, the revocation of sections 1 and 2 of Executive Order 13067 and the revocation of Executive Order 13412 will become effective. The national emergency the President declared in Executive Order 13067 will remain in place, as will Executive Order 13400.\n\nThe order further directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President an updated version of the report described above annually thereafter and, concurrent with those reports, to publish in the Federal Register a notice stating whether the Government of Sudan has sustained the positive actions that gave rise to the order. As much of the annual reports as possible shall be unclassified and made public. In addition, to the extent an annual report concludes that the Government of Sudan has or has not sustained the positive actions that gave rise to the order, the order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Developm
