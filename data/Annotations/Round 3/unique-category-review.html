 Title 3 of the United States Code, it is hereby ordered that Executive Order No. 12163, as amended,","2":"is further amended by inserting at the end of the first sentence of subsection 6 of Section 1-201, the following phrase: \", and all functions conferred by Section 534 of the Act.\""},"EO33":{"1":"I, Joseph R. Biden Jr., President of the United States of America, in view of changing circumstances on the ground in Syria and in order to take additional steps with respect to the national emergency declared in Executive Order 13894 of October 14, 2019 (Blocking Property and Suspending Entry of Certain Persons Contributing to the Situation in Syria), hereby order: Section 1. Amendments to Executive Order 13894.","2":"Executive Order 13894 is hereby amended by: (a) striking from the second paragraph the phrase \", and in particular the recent actions by the Government of Turkey to conduct a military offensive into northeast Syria,\"; (b) striking subsections (1)(a)(i)(B)-(F) and inserting, in lieu thereof, the following: \"(B) to have materially assisted, sponsored, or provided financial, material, or technological support for, or goods or services to or in support of, any person whose property and interests in property are blocked pursuant to this order; or (C) to be owned or controlled by, or to have acted or purported to act for or on behalf of, directly or indirectly, any person whose property and interests in property are blocked pursuant to this order.\"; and (c) striking subsection 8(f). Sec. 2. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"M1":{"1":"Executive Order 11764 places with the Attorney General the responsibility for coordinating Title VI enforcement and for approving rules, regulations and orders which departments or agencies issue under Title VI. I want the Attorney General to work closely with each of you to help you make sure that your department or agency is doing an effective job, and I have asked him to give this matter a high priority. The Department of Justice will shortly be contacting each department and agency to determine what action has been taken to comply with the Attorney General's Title VI regulations. You should insist that your staff cooperate fully with the Department of Justice staff as they carry out this task and their other responsibilities under the Executive Order. Finally, as you know, Title VI was intended to provide an administrative mechanism for insuring equal treatment in Federal programs. Consequently, administrative proceedings leading to fund terminations are the preferred method of enforcing Title VI, and this sanction must be utilized in appropriate cases. There may be some instances, however, where litigation is in order.","2":"You must make sure such cases are referred to the Department of Justice. The effective use of the sanctions provided by Title VI is an essential element of this Administration's effort to guarantee that Federal funds do not flow to discriminatory programs."},"M2":{"1":"Pursuant to the authority vested in me by the Constitution and laws of the United States, including section 202 and other relevant provisions of the Afghanistan Freedom Support Act (Public Law 107-327, as amended) and section 506 of the Foreign Assistance Act of 1961, as amended, 22 U.S.C. 2318, I hereby direct the drawdown of up to $16.998 million of defense articles, defense services, and military education and training from the Department of Defense for the Government of Afghanistan. This determination also amends PD 2005-19, signed January 27, 2005, by substituting \"$71.502\" therein for \"$88.5\"."},"M3":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, I hereby delegate to the Secretary of State the reporting functions conferred upon the President by section 4 of the Support for United States-Republic of Korea Civil Nuclear Cooperation Act (Public Law 113-81)."},"M4":{"1":"It is my wish that the head of each department and agency review this matter promptly and take appropriate action unless clearly prevented from doing so by law."},"M6":{"1":"I hereby revoke the Presidential Memorandum of January 28, 2021, for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (Protecting Women's Health at Home and Abroad), and reinstate the Presidential Memorandum of January 23, 2017, for the Secretary of State, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (The Mexico City Policy).","2":"I direct the Secretary of State, in coordination with the Secretary of Health and Human Services, to the extent allowable by law, to implement a plan to extend the requirements of the reinstated Memorandum to global health assistance furnished by all departments or agencies. I further direct the Secretary of State to take all necessary actions, to the extent permitted by law, to ensure that U.S. taxpayer dollars do not fund organizations or programs that support or participate in the management of a program of coercive abortion or involuntary sterilization."},"M7":{"1":"Pursuant to section 102(c) and section 204(a) of the United States-India Nuclear Cooperation Approval and Nonproliferation Enhancement Act, I hereby certify that: 1. Entry into force and implementation of the United States-India Agreement for Cooperation on Peaceful Uses of Nuclear Energy pursuant to its terms is consistent with the obligation of the United States under the Treaty on the Non-Proliferation of Nuclear Weapons not in any way to assist, encourage, or induce India to manufacture or otherwise acquire nuclear weapons or other nuclear explosive devices; and 2. It is the policy of the United States to work with members of the Nuclear Suppliers Group, individually and collectively, to agree to further restrict the transfers of equipment and technology related to the enrichment of uranium and reprocessing of spent nuclear fuel."},"M8":{"1":"The Presidential Memorandum of February 1, 2013 (Designation of Officers of the Pension Benefit Guaranty Corporation to Act as Director of the Pension Benefit Guaranty Corporation), is hereby revoked. Sec. 4. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.","2":"You are authorized and directed to publish this memorandum in the Federal Register."},"M9":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, I hereby assign to you the functions of the President under section 1 of Public Law 109-159 (119 Stat. 2955)."},"M10":{"1":"By virtue of the authority vested in me by section 490(b)(1)(A) of the Foreign Assistance Act of 1961, as amended, (\"the Act\"), I hereby determine and certify that the following major illicit drug producing and/or major illicit drug transit countries/dependent territories have cooperated fully with the United States, or have taken adequate steps on their own, to achieve full compliance with the goals and objectives of the 1988 United Nations Convention Against Illicit Traffic in Narcotic Drugs and Psychotropic Substances: Aruba, The Bahamas, Belize, Bolivia, Brazil, China, Dominican Republic, Ecuador, Guatemala, Haiti, Hong Kong, India, Jamaica, Laos, Malaysia, Mexico, Panama, Peru, Taiwan, Thailand, Venezuela, and Vietnam.","2":"By virtue of the authority vested in me by section 490(b)(1)(B) of the Act, I hereby determine that it is in the vital national interests of the United States to certify the following major illicit drug producing and/or major illicit drug transit countries: Cambodia, Colombia, Pakistan, and Paraguay. Analysis of the relevant U.S. vital national interests, as required under section 490(b)(3) of the Act, is attached.","3":"I have determined that the following major illicit drug producing and/or major illicit drug transit countries do not meet the standards set forth in section 490(b) for certification: Afghanistan, Burma, Iran, and Nigeria. In making these determinations, I have considered the factors set forth in section 490 of the Act, based on the information contained in the International Narcotics Control Strategy Report of 1998. Given that the performance of each of these countries/dependent territories has differed, I have attached an explanatory statement for each of the countries/dependent territories subject to this determination.","4":"They are active in the fight against drugs and work closely with the USG. The GOB is party to the 1988 UN Drug Convention. With USG help, the GOB continued to work to upgrade the professionalism and equipment of the BPF to combat violent crime and narcotics trafficking. A new two-officer money-laundering unit has recently completed training with USG support. The GOB has continued its support of cooperative efforts to reduce drug trafficking through its borders and to combat the crime associated with such trafficking. The GOB has also maintained its support of regional and unilateral counternarcotics efforts. 1997 was a record year for cocaine interdiction with more than two metric tons seized. Indications are that marijuana cultivation remained stable. The efforts of the Belizean security forces to control narco-traffic have been hampered by the lack of manpower, training and equipment, corruption within the ranks, and the relatively large expanse of uninhabited territory of the country. This improved performance, however, was tempered by the mixed record of convictions and sentencing, including the dismissal of an important case involving Colombian, Mexican, and Belizean defendants. The Belizean judicial system remains weak, understaffed, and underfunded. Although the GOB and the USG reached tentative agreement on a new extradition treaty and a MLAT in late 1996, the GOB subsequently raised new concerns about certain aspects of these treaties and negotiations were stalled during 1997. While the new extradition treaty has not been completed, Belize continues to extradite alleged criminals to the United States under the 1972 US–UK extradition treaty. The GOB needs to continue to fully cooperate with the USG and take action to meet the goals and objectives of the 1988 UN Drug Convention and other UN drug conventions. Of particular importance, the GOB should improve its prosecution of major drug cases, provide more support for the judicial branch, and conclude negotiations on mutual legal assistance and extradition treaties with the US. A renewed commitment to confronting corruption is essential. Bolivia Bolivia is the world's second leading producer of cocaine hydrochloride, and has an illegal coca-cocaine industry, including sophisticated operations to smuggle essential chemicals, that is increasingly under the control of Bolivians. The participation of foreigners is more and more relegated to the refining of base into cocaine hydrochloride and to transporting cocaine out of Bolivia, however, this will diminish as Bolivian traffickers improve their refining capabilities. The former GOB never implemented an eradication program in the Yungas, and quickly discontinued its policy of arresting and prosecuting persons who plant new coca. The new Banzer government has promised prompt action on both issues. Additionally, although eradication slowed in April and did not effectively resume until early October, Bolivia exceeded its gross eradication goal for 1997 of 7,000 hectares and produced a net reduction in coca cultivation of 2 percent. This is an improvement over the one percent net reduction in 1996 and was largely conducted after the inauguration of the new Banzer government. Bolivia's new government is building a consensus, via a series of national dialogues, for the country's first national counternarcotics strategy. Their five-year plan includes the goal of totally eliminating illicit coca cultivation by the year 2002. Total narcotics-related arrests increased substantially in 1997, as did seizures of cocaine products and essential chemicals. The Special Investigative Units—vetted and trained in the U.S.—have returned to Bolivia and are actively engaged in their own operations and in supporting the ongoing investigations of other Bolivian counternarcotics units. The Bolivian Navy's Blue Devil Task Force has been granted law enforcement authority, a change which will almost certainly result in greatly improved interdiction results on the country's waterways. The legislature is considering critical judicial reforms, including revisions to Law 1008, Bolivia's basic counternarcotics law, which will, when enacted, greatly improve the country's court system and result in a fairer and more transparent judicial system. Alternative development initiatives have been highly successful in providing farmers viable, licit alternatives and have helped solidify public opinion against coca cultivation. In 1998, the Bolivian government must act to prevent new coca plantings and conduct eradication efforts in a sustained and intensified manner. A net reduction of 20 percent (or 7,000 hectares) of coca plantings must be achieved in 1998 if the Bolivians are to garner success for their 5-year plan to eliminate illicit coca. They must eliminate individually compensated eradication for controlling the cultivation of new coca fields and prosecute those who plant them. The Blue Devil Task Force must implement their new law enforcement authority to effect seizures of narcotics and chemicals, and arrests of narco-traffickers on Bolivia's waterways. Enforcement of recently enacted legislation criminalizing money laundering was delayed, in 1997, pending clarification of lines of authority and identification of funding sources. Bolivia must move forward to vigorously implement these laws. Brazil Brazil is a major transit country for cocaine shipped by air, river, and maritime routes from Bolivia, Peru, and Colombia to the U.S. and Europe. Because of increased interdiction of trafficker aircraft in Peru (along the Peru/Colombia air corridor), traffickers have shifted illicit narcotics flights into Brazilian air space. Brazil's vast and sparsely populated Amazon region provides ample opportunity for traffickers to transship drugs and chemicals by air and riverine routes. A southern \"drug route\" also exists along Brazil's borders with Paraguay and Bolivia. While not a significant cultivation country, Brazil is a major producer of essential/precursor chemicals and synthetic drugs. There is also a growing domestic drug consumption and addiction problem, primarily among young people. Several key pieces of counter-narcotics legislation, including an anti-money laundering law, are under review in the congress. Brazil's bank secrecy laws and its highly developed financial networks make it fertile ground for money laundering of drug profits. Although police drug seizures in 1997 were only slightly above those in 1996, anti-narcotics law enforcement units stepped up interdiction activities in the Amazon region and along the southern \"drug route.\" The government implemented a new national defense policy (since 1996) to allow the military to assist police anti-drug operations in the Amazon. During two major operations in that region, the police put a majority of all clandestine airfields out of operation. In cooperation with neighboring countries, Brazilian police carried out investigations which disrupted several major drug smuggling organizations. Brazil also continues to cooperate in extradition cases of non-Brazilian citizens. To signal its continued resolve to deal with narcotics trafficking problems, Brazil signed a new Letter of Agreement (LOU) for bilateral cooperation in narcotics control with the U.S. in 1997. Brazil has bilateral narcotics control agreements with all its South American neighbors as well as Germany and Italy. During a visit by President Clinton in October, Brazil signed a mutual legal assistance treaty (MLAT) with the U.S. In another positive step, the government incorporated anti-money laundering provisions in a packet of emergency measures sent to Congress in conjunction with a growing economic/fiscal crisis. This packet has cleared the lower house of the legislature and is still being considered by the Brazilian senate with passage possible in early 1998. Senior government officials made clear to U.S. interlocutors during 1997 that Brazil was fully committed to working with the U.S. and other nations in reducing the traffic in illicit drugs in South America. China China both remains a major transit route for Southeast Asian heroin destined for the U.S. and other Western markets and has had increasingly to deal with the phenomenon of itself becoming such a market. China continues to take a strong stand to battle this trend. In 1997, it further intensified its nation-wide efforts to combat drugs by focusing special attention on anti-drug education. Narcotics seizures also increased, as did the monitoring of precursor chemicals: there was a four-fold increase over 1996 in the seizures of such chemicals. China also moved to strengthen anti-drug legislation and for the first time identified money laundering as a crime. In 1997, China signed a Mutual Legal Assistance Agreement with India which placed special emphasis on narcotics trafficking. China is also a party to all of the UN narcotics conventions. USG–PRC cooperation on counternarcotics issues improved in 1997. In October, as part of the Joint Statement issued during the Summit between Presidents Jiang and Clinton, China agreed to the opening of reciprocal drug enforcement offices in Beijing and Washington and to the establishment of a Joint Liaison Group on Law Enforcement which specifically included narcotics trafficking as one of the issues to be addressed. China hosted two Drug Enforcement Administration seminars on chemical control, sent officials to the United States to take part in airport interdiction training and continued working-level exchanges of information on international drug trafficking cases with USG law enforcement officials. A direct e-mail link with DEA to facilitate information exchange on drug cases has been established. In April, China transferred to the U.S. for prosecution on drug trafficking charges a Burmese national in its custody. China continues to struggle with the corruption and greed which have accompanied economic success and prosperity. The Government has passed specific laws to deal with officials guilty of the use, manufacture, or delivery of narcotics. Penalties for such transgressions include execution. There is no evidence of high-level official involvement in the drug trade. The juxtaposition, however, of low-paid law enforcement and other officials with the lucrative drug business creates the potential for corruption. Chinese officials have noted that 90 percent of the heroin flowing into China comes from Burma. China's close trade and political relationship with Burma has facilitated misuse of their shared 2,000-kilometer border by drug traffickers. China has pledged cooperation in helping the Burmese fight narcotics production and has supported international programs to wean Burmese farmers away from drug production. China's success—or its failure—with regard to addressing the problem of Burmese drug production has serious implications for China, for the rest of Asia and for the West. Dominican Republic The Dominican Republic is an active transshipment point for drugs destined for the United States and Europe. Traffickers smuggle narcotics through Dominican territory by air, sea, and along the country's porous border with Haiti. A weak Dominican judicial system continues to hamper efforts to combat the narcotics trade, but a promising reform process began in 1997. The Government of the Dominican Republic (GODR) continued to cooperate with the United States Government (USG) on counternarcotics objectives and goals. The GODR is party to the 1988 United Nations Drug Convention. It has enacted a money laundering and asset forfeiture law that complies with the Organization of American States (OAS)/Inter-American Drug Abuse Control Commission (CICAD) model. The GODR and the USG have a bilateral maritime agreement that allows for consensual boarding of sea vessels by host country authorities. Dominican authorities cooperate closely on drug investigation matters with the USG. The GODR had a mixed record of drug-related seizures and arrests. There was a decrease in marijuana seizures and arrests for drug-related offenses (1,481 arrests) in 1997, but an increase in heroin seizures (8.3 kgs). Cocaine seizures rose slightly from 1996 to 1,354 kgs. in 1997. This cooperation has been marred by the disappointing record of judicial and legislative reforms. Dominican law prohibits the extradition of Dominican nationals, creating a refuge in the Dominican Republic for Dominican nationals who are believed to have committed serious crimes in the U.S. Pursuant to an extraordinary and rarely used Executive Order, the GODR did extradite two Dominican nationals to the United States in August 1997 to stand trial on charges of narcotics trafficking and homicide. Dominican judicial authorities have yet to act on more than two dozen additional U.S. extradition requests. An absence of effective government supervision of exchange houses or remittance operations and the presence of large cash flows, which could hide money laundering activity, continue to make the Dominican Republic vulnerable to further money laundering. Money laundering is not likely to diminish until the GODR aggressively implements the money laundering legislation. Neither the GODR itself nor senior government officials encourage, facilitate, or engage in drug trafficking or money laundering as a matter of government policy. No evidence exists that senior government officials are involved in drug distribution or money laundering. No senior government official has been indicted for drug-related corruption in 1997. Ecuador Ecuador continues to be a major transit country for the shipment of cocaine from Colombia to the United States and Europe. Ecuador is also used by traffickers for money laundering of drug profits and to transit essential/ precursor chemicals destined for Colombian drug labs. Cocaine is shipped primarily by road from the Colombian border to major Ecuadorian ports where it is concealed in bulk cargo transported in large ocean-going commercial vessels. In 1997, Ecuador increased the number of interdiction checkpoints along inland transit routes leading to ports. With U.S. aid, Ecuador is establishing a Joint Information Coordination Center (JICC) in the major port city of Guayaquil. Ecuador also hosted a U.S. Customs/U.S. Coast Guard team which assessed port operations for top government officials. The Ecuadorian Congress passed legislation authorizing the forfeiture of drug assets and the use of forfeiture funds in support of prevention, rehabilitation, and police counter-narcotics activities. Police assigned personnel for U.S.-sponsored training to form a \"controlled chemical\" investigative unit. The government submitted new legislation to help police carry out money laundering investigations. There is a long tradition of cooperation between Ecuadorian National Police and U.S. law enforcement in the area of narcotics control. Still, the police lack many of the resources needed to deal effectively with a narcotics trade directed by powerful criminal organizations in its neighbor to the north, Colombia, and, to a lesser extent, in Peru to the south. Cooperation between the Ecuadorian and Peruvian governments is complicated by an on-going, serious, and occasionally violent border dispute. Ecuador cooperated with the U.S. to eradicate most of its coca crop in the 1980's and thus avoided the production problems that currently plague its neighbors Colombia and Peru.","5":"In 1997, Ecuador continued to demonstrate its willingness to work closely with the U.S. in dealing with other narcotics issues including major vulnerabilities such as cocaine transshipments, chemical diversions, money laundering, and judicial corruption/inefficiency. The police's canine unit, for instance, was created with U.S. assistance and had a number of outstanding successes in interdicting cocaine shipments in 1997. Ecuador has also signalled a willingness to discuss and work out ways in the near future to cooperate with the U.S. in maritime interdiction. Guatemala With peace a reality after thirty six-years of internal conflict, President Arzu has made public security a top priority and has shown special interest in ensuring maximum cooperation with the United States in combatting counternarcotics trafficking through Guatemala and in the region. Guatemala is located half way between the U.S. and Colombia and continues to be a transshipment and storage point for cocaine destined for the US via Mexico. There has been a marked increase in the use of truck and shipping containers. Guatemala has made major improvements to a self-financed port security program which expanded operations. A major initiative resulted in the transition from the old national and treasury police forces to the new National Civilian Police (PNC) and the consolidation of various paramilitary law enforcement agencies. The Department of Anti-Narcotics Operations (DOAN), a specially equipped civilian police command, was transferred to the PNC after re-training and a major pay increase. With USG assistance, the DOAN seized almost 6 metric tons of cocaine in 1997. There was also steady progress in the successful prosecution of narcotics-related crimes with over 90 per cent of those accused being convicted. Guatemala works closely with USG organizations to stem the flow of drugs through Guatemala, but has not yet enacted necessary legislation to implement all the provisions of the 1988 UN Convention on narco-trafficking. The Government of Guatemala (GOG) does not encourage or facilitate illicit production or distribution of narcotic or psychotropic drugs or controlled substances. Guatemalan studies show that drug use is on the rise in most age groups with cocaine use increasing rapidly. However, Guatemala has recently completed a comprehensive national drug plan which is scheduled to be implemented starting in January 1998 and which includes an ambitious demand reduction program. Haiti Already confronted by a wide array of issues that compete for the attention of its limited professional and managerial talent, the Government of Haiti (GOH) and its criminal justice institutions are severely strained by increased international narcotics trafficking activities. Haiti's fledgling national police force is hampered by a lack of manpower, training, equipment, and experience. The poorest nation in the Western Hemisphere, Haiti is particularly vulnerable to the corrosive effects of narcotics-related corruption. Haiti's weak and ineffective judicial system has a poor track record of narcotics prosecutions. Haiti is a party to the 1988 UN Drug Convention. Because of a significant increase in the detected activities of Colombian drug trafficking organizations in Haiti in 1994, Haiti was added to the list of major drug producing and transit countries in 1995. Due in measure to effective USG interdiction efforts around Puerto Rico and the Virgin Islands in 1997, traffickers have increasingly targeted Haiti's long, undefended coastline for narcotics deliveries intended for transshipment (often through the Dominican Republic) to the US. In response to this growing threat, the GOH, within its existing capacity, cooperated fully with the United States Government (USG) in counternarcotics efforts in 1997. The GOH must build upon the positive steps it has already taken to more aggressively seize narcotics shipments, pursue and prosecute narcotics traffickers, and investigate all allegations of governmental corruption with a view to effective prosecution. The GOH is slowly but incrementally putting into place the legal mechanisms and governmental policies to counter organized trafficking elements. This effort has been hampered overall by the ongoing political impasse over a parliamentary quorum. In 1997, the GOH and the USG signed a Maritime Counterdrug Agreement. In 1997, the Haitian Coast Guard (HCG) and the U.S. Coast Guard (USCG) cooperated in four separate maritime interdictions that yielded over 2 metric tons of cocaine and five tons of marijuana. With USG support, the Counternarcotics Unit of the Haitian National Police (CNU) was staffed, trained and partially deployed in 1997. A fully-deployed CNU is scheduled to move to a permanent headquarters facility at the Port au Prince airport in 1998. In response to allegations of drug-related corruption within the Haitian government, the Haitian National Police arrested 21 police and judicial officials for suspected complicity in narcotics trafficking in 1997. A Ministry of Justice (MOJ) Special Advisor on Narcotics Matters drafted a national narcotics strategic plan, completed draft legislation on money laundering, and updated archaic Haitian narcotics laws. That said, corruption remains an important USG concern, as does the need for successful prosecutions of narcotics trafficking cases. In 1997, the GOH continued to give USG officials high-level assurances of its commitment to drug control, and those assurances have been supported by progress in establishing Haitian counter-drug institutions. However, Haiti still has a number of major goals to achieve before it will be able to take significant, independent action in counternarcotics. Once a new Prime Minister and a new government are installed, the Maritime Counterdrug Agreement and the MOJ's legislation can be submitted for Parliamentary approval and a National Narcotics Plan approved at the cabinet level. The USG will continue to work with the GOH to achieve Parliamentary passage of pending and planned legislation and its vigorous implementation, continued training the CNU, and the institution of anti-corruption steps within the ranks in further compliance with the goals and objectives of the 1988 UN Drug Convention and the terms of our bilateral agreements and treaties. The USG will remain engaged in increasing the capacity of the HCG and CNU to meet the threat posed by traffickers. The USG will also help improve the overall security of the Port-au-Prince Airport to inhibit the flow of drugs via air links to the U.S. Additional counternarcotics objectives for Haiti include targeting at least one major international narcotics organization for significant interdiction efforts and enacting civil and administrative asset forfeiture provisions to facilitate targeting of trafficker assets and companion legislation requiring use of the forfeited funds solely for counter-narcotics interdiction and enforcement operations."},"M11":{"1":"I hereby determine that the continuation for 1 year of the exercise of those authorities with respect to the applicable countries is in the national interest of the United States.","2":"(1) the Foreign Assets Control Regulations, 31 C.F.R. part 500; (2) the Transaction Control Regulations, 31 C.F.R. part 505; and (3) the Cuban Assets Control Regulations, 31 C.F.R. part 515."},"M14":{"1":"Under the provisions of the Personal Responsibility and Work Opportunity Reconciliation Act of 1996, which today I signed into law, aliens receiving food stamps as of the date of enactment will continue to receive benefits until recertification of their eligibility, which shall take place not more than 1 year after enactment of the law. The results of the certification, including decisions as to an individual's immigration classification, veteran status, or work history, will determine whether the individual remains eligible for benefits under the Food Stamp program. Implementation of these new procedures will pose a substantial challenge for all involved Federal and State agencies.","2":"To ensure that eligibility determinations are made fairly, accurately, and effectively, I direct you to take the steps necessary under your authority to permit the State agencies to extend the certification periods of currently participating aliens, provided that no certification period is extended to longer than 12 months, or up to 24 months if all adult household members are elderly or disabled, and provided that in no event shall certifications be extended beyond August 22, 1997. I further direct you to notify the States of the actions you have taken."},"M15":{"1":"By virtue of the authority vested in me as President by the Constitution and the laws of the United States, including section 301 of title 3, United States Code, I hereby assign to you the functions of the President under section 1821(c) of the Implementing Recommendations of the 9/11 Commission Act of 2007 (Public Law 110-53). In the performance of your responsibility under this memorandum, you shall, as appropriate, consult the heads of other departments and agencies."},"M16":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, and in order to enhance United States policy and approach to prevent and respond to conflict-related sexual violence worldwide, it is hereby ordered as follows: Section 1. Policy. Conflict-related sexual violence (CRSV) has devastating effects on individuals and communities, undermines peace and security, and prevents inclusive and sustainable development. Yet wherever conflicts or crises occur, sexual violence continues to be wielded as a tool or is a byproduct of armed conflict. Impunity for CRSV remains widespread, with accountability and justice the rare exception. For each rape reported in connection with a conflict, the United Nations estimates that 10 to 20 cases go undocumented, in part due to the impunity of perpetrators. Among the best ways to prevent CRSV worldwide are to advance global gender equity and equality and change harmful societal gender norms; prioritize prevention measures and locally-driven responses to all forms of gender-based violence, including through respect for human rights and international humanitarian law and equal protection under the law; and address impunity related to these brutal, yet often unreported, acts. The United States does not accept CRSV as an inevitable cost of armed conflict and is committed to supporting survivors of this scourge by invoking all tools available, including legal, policy, diplomatic, and financial tools, to deter such violence, break the vicious cycle of impunity, and provide the necessary services to survivors. The United States has numerous frameworks, including laws and policies, through which to respond to and address CRSV, but more action is required to use them fully and in a manner that responds to the full scale of this problem. These efforts to address impunity and increase accountability for CRSV will complement a broader, holistic approach to preventing and responding to this scourge, which includes advancing gender equity and equality; prioritizing the immediate needs of survivors; and amplifying survivor voices in transitional justice, the provision of services, and peace and political processes. It is the policy of the United States to fully exercise existing authorities to impose economic sanctions and implement visa restrictions in order to promote justice and accountability for acts of CRSV; devote the necessary resources to ensure regular coordination and reporting on CRSV incidents and to conduct training on CRSV issues more broadly, including to support the designation of sanctions targets; strengthen the implementation of other existing tools and authorities to promote accountability for CRSV, including the provision of United States security assistance; and broaden engagement with foreign partner governments to encourage the establishment and use of their own tools to promote justice and accountability. Sec. 2. Advancing Accountability for Acts of CRSV through Existing Sanctions Authorities. (a) Executive Order 13818 of December 20, 2017 (Blocking the Property of Persons Involved in Serious Human Rights Abuse or Corruption), builds on and implements the Global Magnitsky Human Rights Accountability Act, Public Law 114-328 (the \"Act\"), and authorizes the imposition of sanctions on persons, including both individuals and entities, responsible for or complicit in, or who have directly or indirectly engaged in, serious human rights abuse, as well as individuals who are or have been leaders or officials of an entity, including any government entity, that has engaged in, or which has members who have engaged in, serious human rights abuses relating to their tenure, among other things. It is the policy of the United States that an act of CRSV, committed by either state or non-state actors, may constitute a \"serious human rights abuse\" for purposes of designation under Executive Order 13818, as well as other similar authorities, and in furtherance of the policy reflected in the Act. (b) In addition to the authorities described in subsection (a) of this section, many country-specific sanctions programs also contain criteria for the imposition of sanctions on persons engaged in or otherwise connected to activities that may include CRSV. For example, numerous sanctions programs, including country-specific programs related to Belarus, Burma, the Central African Republic, the Democratic Republic of the Congo, Iran, Libya, Mali, Nicaragua, Somalia, North Korea, the Russian Federation, South Sudan, Syria, Venezuela, the Western Balkans, and Zimbabwe, include criteria for targeting certain abuses or violations of human rights, which may include CRSV depending on specific facts and circumstances. It is the policy of the United States to promote accountability for perpetrators of acts of CRSV through relevant existing sanctions authorities, where applicable, and to ensure that these authorities are used to the fullest extent possible to target perpetrators of acts of CRSV and their enablers.","2":"(c) I hereby direct the Secretary of State, the Secretary of the Treasury, the Attorney General, and the Director of National Intelligence to undertake the following actions, including by issuing guidance or regulations as appropriate: (i) ensure equal consideration of and attention to acts of CRSV as the conduct supporting designation when identifying appropriate targets and compiling information necessary for the preparation of sanctions packages under applicable authorities, including those identified in this section; and (ii) strengthen the capacity of executive departments and agencies (agencies) to collect, identify, assess, and share information on CRSV as appropriate, including by consulting with local civil society organizations, taking into account the importance of safely gathering information from survivors to support potential designations under existing sanctions authorities. Sec. 3. Advancing Accountability for Acts of CRSV Through Additional Measures and Authorities. The United States is committed to using all available tools, including those pertaining to security assistance and visa eligibility, to prevent and respond to CRSV and promote accountability for perpetrators. Heads of agencies, including the Secretary of State and the Secretary of the Treasury, are directed to use existing authorities to the fullest extent possible to promote accountability for acts of CRSV, including considering acts of CRSV when assessing the potential application of existing laws and regulations, including, where appropriate, the laws known as the \"Leahy Laws\" (22 U.S.C. 2378d and 10 U.S.C. 362) and sections 7031(c) and 7048(g) of the Department of State, Foreign Operations, and Related Programs Appropriations Act, 2022 (Div. K, Public Law 117-103, as carried forward by the Continuing Appropriations Act, 2023 (Div. A, Public Law 117-180)), as well as similar provisions in future acts. Sec. 4. Building Coalitions of Like-Minded Nations and Engaging International Organizations in Promoting Accountability for Acts of CRSV. Bilateral relationships with allies and partners, as well as engagement in multilateral fora and our relationships with international organizations, are critical to promote justice and accountability for acts of CRSV and bring global attention to this issue. Agencies engaged abroad shall reinforce the work they have done and amplify efforts with other nations—bilaterally and within multilateral fora—and with international organizations to broaden the number of countries willing to support accountability for acts of CRSV and to strengthen policies and locally-driven programming in multilateral institutions, including efforts to address the immediate and long-term needs of survivors, to promote accountability and justice for acts of CRSV. Sec. 5. Definition. For the purposes of this memorandum, the term \"conflict-related sexual violence\" (CRSV) refers to incidents or patterns of sexual violence that occur in conflict or post-conflict situations with a direct or indirect link to conflict. CRSV may include rape, sexual slavery, sex trafficking, forced pregnancy, forced sterilization, and any other form of sexual violence of comparable gravity, against individuals of all gender identities. Depending on the circumstances, acts of CRSV can constitute war crimes, crimes against humanity, or acts of genocide, and therefore may constitute crimes that are punishable under international law. Sec. 6. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"M17":{"1":"To assist in carrying out my responsibilities for domestic policy formulation within a broad conceptual framework, I want the Domestic Council to undertake the following responsibilities in domestic policy areas: --Assessing national needs and identifying alternative ways of meeting them. --Providing rapid response to Presidential needs for policy advice. --Coordinating the establishment of national priorities for the allocation of available resources. --Maintaining a continuous policy review of on-going programs. --Proposing reforms as needed. I would specifically like to emphasize the following essential components of these functions: --Identify major policy problem areas requiring Administration attention and actions. --Coordinate the formulation of policy options in the domestic area for my consideration. --Initiate fact-finding analysis, develop policy options and recommendations for Presidential decision, Administration action and legislation. --Review in conjunction with OMB departmental legislative proposals for their impact on present policy and legislation and consistency with Administration policy. --Establish guidelines in conjunction with OMB for formulation of Departmental and Agency administrative regulations to ensure consistency with Administration policy objectives and legislative intent. Because of the complexity and interrelationship of domestic policies and programs, I believe the broadest perspectives must be brought to bear in the Domestic Council's deliberations. For this reason, I have asked the Vice President to serve as Vice Chairman of the Council and to oversee the work of the Council. I am also asking the Vice President to review the operations of the Council staff and to propose such reorganization of the Council as from time to time may be necessary. To expedite the work of the Domestic Council, the Vice President will make recommendations to me for the formation of task forces and review groups of officials at the appropriate levels of Departments and Agencies involved. For the Domestic Council to carry out my objectives, it is essential that the Council have the full cooperation of your Department or Agency, including the necessary staff support for the various task forces and review groups which will be established. I am today announcing my intention to appoint Mr. James M. Cannon, Executive Director of the Domestic Council and Assistant to the President for Domestic Affairs. Richard L. Dunham. will be the Deputy Director of the Domestic Council.","2":"I expect them to work closely with the Vice President in conducting the operations of the Domestic Council. To provide for full coordination of the work of the Domestic Council with the work of other policy bodies, the Executive Director of the Economic Policy Board and the Executive Director of the Energy Resources Council will be designated as members of the Domestic Council."},"M19":{"1":"Pursuant to the authority vested in me by section 506(a)(2)(A)(i)(II) of the Foreign Assistance Act of 1961, as amended (\"the Act\"), 22 U.S.C. 2318(a)(2), I hereby determine that it is in the national interest of the United States to draw down articles and services from the inventory and resources of the Department of Defense, for the purpose of providing international disaster relief assistance to Honduras, Nicaragua, El Salvador, and Guatemala.","2":"Therefore, I direct the drawdown of up to $45 million of articles and services from the inventory and resources of the Department of Defense for the Governments of Honduras, Nicaragua, El Salvador, and Guatemala for the purposes and under the authorities of chapter 9 of part I of the Act."},"M20":{"1":"Having considered the relevant measures taken by Canada, along with the unanimous views and recommendations of the United States Trade Representative and interested United States Government agencies, I have determined that Canada has taken measures necessary to comply with the obligations of the United States-Canada Free-Trade Agreement (Agreement). The United States has completed necessary legal procedures in accordance with Article 2105 of the Agreement.","2":"Pursuant to section 101(b) of the United States-Canada Free-Trade Agreement Implementation Act of 1988 (Public Law 100449), I hereby direct the Secretary of State to exchange notes with the Government of Canada providing for the entry into force, on January 1, 1989, of the Agreement, in accordance with Article 2105 thereof."},"M21":{"1":"Please issue instructions assuring that: —obligations for the fourth quarter of the fiscal year are no higher than for the third quarter, except where seasonal requirements, essential program objectives, or procurement lead-times justify a higher level, or where more money is needed to restore program slippages to approved levels; —orders for supplies, materials, and equipment are no more than needed to meet approved program needs; —purchases are managed so that inventories do not exceed optimal levels; —contracts for goods or services (for delivery extending into the next fiscal year) are let only when doing so will result in lower cost to the Government; and —no purchases are made to compensate for what otherwise would be an outlay shortfall. Resist the temptation to buy and pay for lower priority items to make up for over-optimistic outlay estimates. I count on your full cooperation and personal attention to save the taxpayers as much money as possible."},"M22":{"1":"Pursuant to section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that up to $15 million be made available from the U.S. Emergency Refugee and Migration Assistance Fund to meet urgent and unexpected humanitarian requirements associated with the Kosovo crisis. These funds will be used to meet the urgent and unexpected needs of refugees, displaced persons, victims of conflict, and other persons at risk due to the Kosovo crisis. These funds may be used, as appropriate, to provide contributions to governmental, international, and nongovernmental organizations. As necessary, funds will also support requirements associated with the U.S. program to provide refuge in the United States for up to 20,000 Kosovar refugees, and for administrative expenses of the Bureau of Population, Refugees, and Migration."},"M23":{"1":"Pursuant to section 202(b)(1) of the Trade Act of 1974 (P.L. 93-618, 88 Stat. 1978), I have determined the action I will take with respect to the report of the United States International Trade Commission (USITC), transmitted to me on December 12, 1978, concerning the results of its investigation of import injury which was established on its own motion. The investigation was initiated as an outgrowth of information collected in conjunction with Commission investigations Nos. TA-406-2, TA-406-3, and TA- 406-4, conducted under section 406(a) of the Trade Act of 1974 and concerning clothespins from the People's Republic of China, the Polish People's Republic, and the Socialist Republic of Romania. All four investigations have concerned clothespins imported under items 790.05, 790.07, and 790.08 of the TSUS.","2":"After considering all relevant aspects of the case, including those considerations set forth in section 202(c) of the Trade Act of 1974, I have decided to accept a variation of the injury relief recommendation made by the USITC. Within 15 days, I will issue a Presidential Proclamation authorizing that a three-year global import quota be established on wood and plastic clothespins (TSUS item 790.05) with a dutiable value not over $1.70 per gross in the amount of two million gross pins. The quota, administered quarterly on a pro rata basis, will be allocated as follows: Yearly quota allocation Category (gross) Valued not over 80 cents per gross------------------------ 500, 000 Valued over 80 cents per gross but not over $1.35 per gross---------------------------------- 600, 000 Valued over $1.35 per gross but not over $1.70 per gross---------------------------------- 900, 000 Total --------------------------------------------- 2, 000, 000 During the course of each year, as it becomes apparent that the quota for any price bracket will not be filled for the year, then the remainder of the allocation may be reapportioned among the brackets whose quotas have been filled. Relief is warranted for the following reasons: 1. The social costs of denying relief would be very high, since producers are located in isolated regions in the Northeast where alternative employment is scarce. 2. Assistance will not be costly and will not impose an inflationary burden on the economy. The major clothespin manufacturers have provided commitments to comply with the Administration's anti-inflation program. 3. Major clothespin producers have given their assurances that the relief period will be used to modernize facilities, improve distributional channels and promote their product. These steps should put them in a better competitive position once relief is lifted."},"M24":{"1":"By virtue of the authority vested in me by the Constitution and laws of the United States of America, including section 301 of title 3 of the United States Code, I hereby delegate the authorities vested in the President under sections 8 and 9 of the African Conflict Resolution Act ( Public Law 103-381, 108 Stat. 3516) to the Administrator of the Agency for International Development. The functions delegated by this memorandum may be redelegated within the Agency for International Development, as appropriate."},"L1":{"1":"I hereby report to the Congress on the developments since my report of October 21, 1996, concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c). 1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the Annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in property subject to U.S. jurisdiction of persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order (collectively \"Specially Designated Narcotics Traffickers\" or SDNTs). The Order further prohibits any transaction or dealing by a United States person or within the United States in property or interests in property of SDNTs, and any transaction that evades or avoids, has the purpose of evading or avoiding, or attempts to violate, the prohibitions contained in the Order. Designations of foreign persons blocked pursuant to the Order are effective upon the date of determination by the Director of the Department of the Treasury's Office of Foreign Assets Control (OFAC) acting under authority delegated by the Secretary of the Treasury. Public notice of blocking is effective upon the date of filing with the Federal Register, or upon prior actual notice. 2. On October 24, 1995, the Department of the Treasury issued a notice containing 76 additional names of persons determined to meet the criteria set forth in Executive Order 12978 (60 Fed. Reg. 54582-84, October 24, 1995). The Department of the Treasury issued another notice adding the names of one additional entity and three additional individuals, as well as expanded information regarding addresses and pseudonyms, to the list of SDNTs on November 29, 1995 (60 Fed. Reg. 61288-89). On March 8, 1996, OFAC published a notice in the Federal Register adding the names of 138 additional individuals and 60 entities designated pursuant to the Order, and revising information for 8 individuals on the list of blocked persons contained in the notices published on November 29, 1995, and October 24, 1995 (61 Fed. Reg. 9523-28). 3. On January 21, 1997, OFAC published a notice in the Federal Register adding the names of 57 individuals and 21 entities designated pursuant to the Order, and revising information for 58 individuals and 1 entity (62 Fed. Reg. 2903- 09). In addition, the name of one individual specially designated narcotics trafficker was removed from the list. These changes were effective January 15, 1997. A copy of the notice is attached to this report. These 78 new names brought the total list of SDNTs to 359. Each of the 78 newly designated entities and individuals has been determined to be owned or controlled or to act for or on behalf of the Cali cartel's Helmer \"Pacho\" Herrera Buitrago organization. The newly identified SDNTs include several large poultry processing plants and farms, investment and import/ export firms, real estate businesses, a consulting firm, a lumber distributor, and a construction company, all located in Colombia. The additional name and address information includes one previously designated company controlled by the Herrera Buitrago family and 58 previously designated individuals from either the Herrera Buitrago or the Rodriguez Orejuela organizations of the Cali cartel. The OFAC, in coordination with the Attorney General and the Secretary of State, is continuing to expand the list of SDNTs, including both organizations and individuals, as additional information is developed. Effective February 28, 1997, OFAC issued the Narcotics Trafficking Sanctions Regulations (the \"Regulations\" or NTSR), 31 C.F.R. Part 536, to further implement my declaration of a national emergency and imposition of sanctions against significant foreign narcotics traffickers centered in Colombia (62 Fed. Reg. 9959-68, March 5, 1997). A copy of the Regulations is attached to this report. 4. The OFAC has disseminated and routinely updated details of this program to the financial, securities, and international trade communities by both electronic and conventional media. In addition to bulletins to banking institutions via the Federal Reserve System and the Clearing House Interbank Payments System, individual notices were provided to all State and Federal regulatory agencies, automated clearinghouses, and State and independent banking associations across the country. OFAC contacted all major securities industry associations and regulators. It posted electronic notices on the Internet and over 10 computer bulletin boards and 2 faxon-demand services, and provided the same material to the U.S. Embassy in Bogota for distribution to U.S. companies operating in Colombia. 5. As of March 4, 1997, OFAC had issued five specific licenses pursuant to Executive Order 12978. These licenses were issued in accordance with established Treasury policy authorizing the completion of presanctions transactions and the provision of legal services to and payment of fees for representation of SDNTs in proceedings within the United States arising from the imposition of sanctions. 6. The expenses incurred by the Federal Government in the 6-month period from October 21, 1996, through April 20, 1997, that are directly attributable to the exercise of powers and authorities conferred by the declaration of the national emergency with respect to Significant Narcotics Traffickers are estimated at approximately $1.1 million. Personnel costs were largely centered in the Department of the Treasury (particularly in the Office of Foreign Assets Control, the Office of the General Counsel, and the U.S. Customs Service), the Department of Justice, and the Department of State. 7. Executive Order 12978 provides this Administration with a new tool for combatting the actions of significant foreign narcotics traffickers centered in Colombia, and the unparalleled violence, corruption, and harm that they cause in the United States and abroad. The Order is designed to deny these traffickers the benefit of any assets subject to the jurisdiction of the United States and to prevent United States persons from engaging in any commercial dealings with them, their front companies, and their agents. Executive Order 12978 demonstrates the U.S. commitment to end the scourge that such traffickers have wrought upon society in the United States and abroad. The magnitude and the dimension of the problem in Colombia—perhaps the most pivotal country of all in terms of the world's cocaine trade—is extremely grave. I shall continue to exercise the powers at my disposal to apply economic sanctions against significant foreign narcotics traffickers and their violent and corrupting activities as long as these measures are appropriate, and will continue to report periodically to the Congress on significant developments pursuant to 50 U.S.C. 1703(c)."},"L3":{"1":"To that end, I request that you initiate action to establish a memorial award beating his name, for especially meritorious contributions in the broad field of atomic endeavor. Such an award would seem to me to be most fitting both as a recognition of what he has given to our country and to mankind, and as a means of helping to carry forward his work through inspiring others to dedicate their lives and talents to scientific effort. With warm regard,"},"L4":{"1":"I am requesting these additional resources for VA to cover the increased costs to the VA information technology account in FY 2006 as a result of providing credit monitoring and fraud watch services for veterans and service members impacted by a security breach that occurred on May 3, 2006. The total cost of this effort, estimated to be $160.5 million in FY 2006, is fully offset. The details of these proposals are set forth in the enclosed letter from the Director of the Office of Management and Budget."},"L6":{"1":"Consistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b), I hereby report that I have issued an Executive Order (the \"order\") that revokes sections 1 and 2 of Executive Order 13067 of November 3, 1997, and revokes Executive Order 13412 of October 13, 2006, in its entirety. Both actions are effective 180 days from January 13, 2017, provided that certain further action is taken by the Secretary of State on or before that date.","2":"I have determined that the situation that gave rise to the actions taken in those orders related to the policies and actions of the Government of Sudan has been altered by Sudan's positive actions over the past 6 months. These actions include a marked reduction in offensive military activity, culminating in a pledge to maintain a cessation of hostilities in conflict areas in Sudan, and steps toward the improvement of humanitarian access throughout Sudan, as well as cooperation with the United States on addressing regional conflicts and the threat of terrorism. The President issued Executive Order 13067 to deal with the unusual and extraordinary threat to the national security and foreign policy of the United States posed by the actions and policies of the Government of Sudan, including support for international terrorism; efforts to destabilize neighboring governments; and the prevalence of human rights violations. Section 1 of Executive Order 13067 blocks the property and interests in property of the Government of Sudan, and section 2 prohibits a broad range of trade and investment-related transactions with Sudan, including imports from and exports to Sudan. The President expanded the scope of the national emergency declared in Executive Order 13067 in Executive Order 13400 of April 26, 2006, which blocks the property and interests in property of certain persons in connection with the conflict in Darfur. The President took additional steps with respect to the national emergency declared in Executive Order 13067 in Executive Order 13412 due to policies and actions of the Government of Sudan that violated human rights, in particular with respect to the conflict in Darfur, and the pervasive role played by the Government of Sudan in the petroleum and petrochemical industries in Sudan. Executive Order 13412 continues the blocking of the Government of Sudan, specifies new prohibitions relating to Sudan's petroleum industry, and exempts certain specified areas in Sudan from the trade prohibitions found in Executive Order 13067. With the positive steps taken by the Government of Sudan over the last 6 months, and provided that these positive actions are sustained over the next 180 days, there will be no further need for sections 1 and 2 of Executive Order 13067 or for Executive Order 13412. The 180-day delay period of the order's effective date with respect to removing these provisions is intended to encourage the Government of Sudan to sustain its efforts in these areas. The order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, and based on a consideration of relevant and credible information from available sources, including nongovernmental organizations, on or before July 12, 2017, to provide a report to the President on the Government of Sudan's progress in sustaining the positive actions taken by the Government of Sudan that gave rise to the order, including carrying out the Government of Sudan's pledge to maintain a cessation of hostilities in conflict areas in Sudan; continuing improvement of humanitarian access throughout Sudan; and maintaining its cooperation with the United States on addressing regional conflicts and the threat of terrorism. As much of the report as possible shall be unclassified and made public. Provided that the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, publishes on or before July 12, 2017, a notice in the Federal Register stating that the Government of Sudan has sustained the positive actions that gave rise to the order and has provided to the President the report described above, the revocation of sections 1 and 2 of Executive Order 13067 and the revocation of Executive Order 13412 will become effective. The national emergency the President declared in Executive Order 13067 will remain in place, as will Executive Order 13400. The order further directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President an updated version of the report described above annually thereafter and, concurrent with those reports, to publish in the Federal Register a notice stating whether the Government of Sudan has sustained the positive actions that gave rise to the order. As much of the annual reports as possible shall be unclassified and made public. In addition, to the extent an annual report concludes that the Government of Sudan has or has not sustained the positive actions that gave rise to the order, the order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President recommendations on appropriate U.S. Government responses.","3":"For these reasons, I have determined that it is necessary to revoke sections 1 and 2 of Executive Order 13067 and to revoke Executive Order 13412 on July 12, 2017, provided that further action is taken by the Secretary of State, as set forth in the order. Consistent with this determination, I have waived in the order the application of section 908(a)(1) of the Trade Sanctions Reform and Export Enhancement Act of 2000 (22 U.S.C. 7201-7211) with respect to Sudan, and sections 6(a) and (b) of the Comprehensive Peace in Sudan Act of 2004, as amended (Public Law 108-497). I am enclosing a copy of the Executive Order I have issued. The order is effective on January 13, 2017, except for sections 1, 4, 5, 6, and 7 of the order, which are effective on July 12, 2017, provided that further action is taken by the Secretary of State as set forth in the order."},"L7":{"1":"By presidential proclamation, dated November 3, 1986, I determined that the Trusteeship Agreement is no longer in effect as of October 21, 1986, with respect to the Marshall Islands and as of November 3, 1986, with respect to Micronesia. Therefore, this designation is necessary to permit the Marshall Islands and Micronesia to continue to receive GSP benefits in accordance with section 401 of the Compact of Free Association Act of 1985, Public Law 99-239, 99 Stat. 1770 (January 14, 1986). This notice is submitted in accordance with section 502(a)(1) of the Trade Act of 1974, as amended."},"L11":{"1":"As has been previously announced, I desire to place the Council under the chairmanship of the Vice President. The primary effect of the attached amendatory bill, if enacted, will be to make that possible. I believe that the Vice President can contribute importantly to, and give me valuable counsel and assistance with respect to, space programs, and that the chairmanship of the National Aeronautics Space Council will materially enhance his opportunity and capability to render maximum service. I therefore recommend that the Congress enact legislation along the .lines of the attached draft bill."},"L12":{"1":"In accordance with section 603 of the Goldwater-Nichols Department of Defense Reorganization Act of 1986 (P.L. 99-433; 50 U.S.C. 404a), I hereby transmit the second annual report on the National Security Strategy of the United States, 1988."},"L18":{"1":"After thorough review, I have determined that, given that an embargo is currently in effect and given the negotiations towards an international dolphin conservation program in the ETP, sanctions will not be imposed against intermediary nations at this time. Costa Rica, France, Italy, Japan, and Panama will continue to be certified, and we will review their status as intermediary nations under the Marine Mammal Protection Act, if requested for 1992. I will make further reports to you as developments warrant."},"L21":{"1":"By this letter I request you to serve in the future, to whatever extent your health will permit, as a consultant to me and the State Department in international affairs. I know that all Americans join me in the fervent hope that you will thus be able to continue the important contributions that only you can make toward a just peace in the world. With affectionate regard, As ever, D.E."},"L25":{"1":"In accordance with section 6(a) of the Consolidated Appropriations Act, 2020 (H.R. 1158) and section 6(a) of the Further Consolidated Appropriations Act, 2020 (H.R. 1865), I hereby designate as emergency requirements all funding (including the rescission of funds) so designated by the Congress in these Acts pursuant to section 251(b)(2)(A) of the Balanced Budget and Emergency Deficit Control Act of 1985, as outlined in the enclosed list of accounts. The details of this action are set forth in the enclosed memorandum from the Acting Director of the Office of Management and Budget."},"L27":{"1":"For these reasons, I have determined that it is necessary to maintain in force the broad authorities necessary to apply economic pressure to the Government of Libya to reduce its ability to support international terrorism."},"L28":{"1":"Consistent with section 306(c)(2) of the Cuban Liberty and Democratic Solidarity (LIBERTAD) Act of 1996 (Public Law 104-114) (the \"Act\"), I hereby determine and report to the Congress that suspension for 6 months beyond August 1, 2006, of the right to bring an action under title III of the Act is necessary to the national interests of the United States and will expedite a transition to democracy in Cuba."},"L29":{"1":"Accordingly, as a first step, I am directing you to undertake the following program towards achieving these goals: --Require that landscaping be made a part of all projects on the Federal-aid interstate, primary and urban highways. These requirements should be an addition to the usual measures now taken for erosion control. --Encourage the States to acquire land or easements adjacent to highway rights-of-way where necessary to preserve and enhance the beauty of our countryside in both rural and urban areas. --Request the States to provide more rest areas adjacent to the highways for convenience, safety, relaxation and recreation. --Broaden the study now underway on the needs for scenic roads and parkways to include the goal of maintaining and enhancing the beauty of America. I will also expect the Department of Commerce and its Bureau of Public Roads to take an active part in the White House Conference on Natural Beauty which I will soon call. We must make every effort to see that the States and the cities are made full and fruitful partners in our highway beautification program. Accordingly, the Federal Highway Administrator should send the full details of our program to all State highway departments, so that they may participate fully in achieving these goals. It is my hope that high priority will be given to landscape projects for screening junkyards, excavation scars, and other unsightly areas adjacent to highway rights-of-way. The existing Federal highway law authorizes States to acquire strips of land or easements adjacent to highways to preserve and enhance natural beauty. The land or scenic easements to be acquired should involve areas of woodland, shores of bodies of water, vistas of scenic quality, and unusual topographic features. In choosing the location of these areas, adequate consideration should be given to appropriate spacing between areas and safety requirements. I believe these are the necessary first steps in our comprehensive program to preserve and enhance the natural beauty of our country. They can and should be undertaken immediately.","2":"To the extent that you believe additional legislative authority is required to achieve this objective, you should prepare appropriate legislative proposals for my approval and subsequent submission to the Congress."},"L30":{"1":"I stated that I expected to submit a draft of legislation for that purpose to the Congress at an early date. Pursuant to this statement in my message of March 3, I attach for the consideration of the Senate (House of Representatives) a draft of legislation to establish a commission on the coal industry. The end of the coal strike has in no way diminished the need for a long-range study of the coal industry with the view of finding and putting into effect the best solutions of its problems from the standpoint of the miners, the operators, and, above all, the national interest. I, therefore, hope that the Congress will enact legislation of this character as soon as possible. Sincerely yours,"},"L31":{"1":"In these circumstances, I have determined that it is necessary to maintain in force the broad authorities that are needed in the process of implementing the January 1981 agreements with Iran and in the eventual normalization of relations with that country."},"P1":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, do hereby proclaim the week beginning May 20, 1984, as World Trade Week, and I invite the people of the United States to join in ceremonies affirming the importance of trade to America and recognizing the need for increased export efforts."},"P2":{"1":"Whereas, on the basis of said supplemental investigation and report of the Tariff Commission, I find that the domestic supply of Virginia-type peanuts is not sufficient to meet the essential requirements of domestic users of such peanuts and that such deficit may be permitted to be supplied from peanuts of foreign origin, but only under the conditions and subject to the fee hereinafter proclaimed, without rendering or tending to render ineffective, or materially interfering with, the said program of the Department of Agriculture with respect to peanuts, or reducing substantially the amount of any product processed in the United States from peanuts with respect to which such program is being undertaken:","2":"Now, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under and by virtue of the authority vested in me by the said section 22 of the Agricultural Adjustment Act, as amended, do hereby proclaim that the said Proclamation No. 3019, as amended,","3":"is hereby modified so as to permit an unlimited quantity of peanuts of the Virginia type, shelled (not including peanuts blanched, salted, prepared, or preserved), of sizes averaging in representative samples not more than 40 kernels per ounce, to be entered, or withdrawn from warehouse, for consumption during the period beginning on the day following the date of this proclamation and ending at the close of business on 10 September 1956, subject to a fee of 7 cents per pound, but not more than 50 per centum ad valorem: Provided, That the said fee shall be in addition to any other duties imposed on the importation of such peanuts."},"P3":{"1":"Now, Therefore, I, Richard Nixon, President of the United States of America, do hereby designate Memorial Day, Friday, May 30, 1969, as a day of prayer for permanent peace,","2":"and I designate the hour beginning in each locality at 11 o'clock in the morning of that day as a time to unite in such prayer. I urge the press, radio, television, and all other information media to cooperate in this observance. I urge also that on this consecrated day, all the people of America offer their prayers to the Almighty to make reason and good will prevail so that peace can once again bless our nation.","3":"As a special mark of respect for those Americans who have given their lives in the tragic struggle in Vietnam, I direct that the flag of the United States be flown at half-staff all day on Memorial Day, instead of during the customary forenoon period, on all buildings, grounds, and naval vessels of the Federal Government throughout the United States and all areas under its jurisdiction and control. I also request the Governors of the States and of the Commonwealth of Puerto Rico and the appropriate officials of all local units of government to direct that the flag be flown at half-staff on all public buildings during that entire day, and request the people of the United States to display the flag at half-staff from their homes for the same period."},"P4":{"1":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim March 19, 2024, as National Agriculture Day.","2":"I call upon all Americans to join me in recognizing and reaffirming our commitment to and appreciation for our country's farmers, farmworkers, ranchers, fishers, foresters, and all those who work in the agricultural sector across the Nation."},"P5":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, do hereby proclaim Friday, May 15, 2015, as National Defense Transportation Day and May 10 through May 16, 2015, as National Transportation Week.","2":"I call upon all Americans to recognize the importance of our Nation's transportation infrastructure and to acknowledge the contributions of those who build, operate, and maintain it."},"P6":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim July 25, 2009, as the 35th Anniversary of the Legal Services Corporation.","2":"I call upon legal professionals and the people of the United States to honor the contributions of this vital organization."},"P7":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim September 20 through September 26, 2009, as National Farm Safety and Health Week.","2":"I call upon the people of the United State
