ent, to provide to the President recommendations on appropriate U.S. Government responses.\n\nFor these reasons, I have determined that it is necessary to revoke sections 1 and 2 of Executive Order 13067 and to revoke Executive Order 13412 on July 12, 2017, provided that further action is taken by the Secretary of State, as set forth in the order. Consistent with this determination, I have waived in the order the application of section 908(a)(1) of the Trade Sanctions Reform and Export Enhancement Act of 2000 (22 U.S.C. 7201-7211) with respect to Sudan, and sections 6(a) and (b) of the Comprehensive Peace in Sudan Act of 2004, as amended (Public Law 108-497).\n\nI am enclosing a copy of the Executive Order I have issued. The order is effective on January 13, 2017, except for sections 1, 4, 5, 6, and 7 of the order, which are effective on July 12, 2017, provided that further action is taken by the Secretary of State as set forth in the order.\n\nSincerely,\n\nBARACK OBAMA","EO11":"This order prescribes a uniform system for classifying, safeguarding, and declassifying national security information, including information relating to defense against transnational terrorism. Our democratic principles require that the American people be informed of the activities of their Government. Also, our Nation's progress depends on the free flow of information both within the Government and to the American people. Nevertheless, throughout our history, the national defense has required that certain information be maintained in confidence in order to protect our citizens, our democratic institutions, our homeland security, and our interactions with foreign nations. Protecting information critical to our Nation's security and demonstrating our commitment to open Government through accurate and accountable application of classification standards and routine, secure, and effective declassification are equally important priorities.\n\nNow, Therefore, I, Barack Obama, by the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nPART 1—ORIGINAL CLASSIFICATION\n\nSection 1.1. Classification Standards. (a) Information may be originally classified under the terms of this order only if all of the following conditions are met:\n\n(1) an original classification authority is classifying the information;\n\n(2) the information is owned by, produced by or for, or is under the control of the United States Government;\n\n(3) the information falls within one or more of the categories of information listed in section 1.4 of this order; and\n\n(4) the original classification authority determines that the unauthorized disclosure of the information reasonably could be expected to result in damage to the national security, which includes defense against transnational terrorism, and the original classification authority is able to identify or describe the damage.\n\n(b) If there is significant doubt about the need to classify information, it shall not be classified. This provision does not:\n\n(1) amplify or modify the substantive criteria or procedures for classification; or\n\n(2) create any substantive or procedural rights subject to judicial review.\n\n(c) Classified information shall not be declassified automatically as a result of any unauthorized disclosure of identical or similar information.\n\n(d) The unauthorized disclosure of foreign government information is presumed to cause damage to the national security.\n\nSec. 1.2. Classification Levels. (a) Information may be classified at one of the following three levels:\n\n(1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security that the original classification authority is able to identify or describe.\n\n(2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security that the original classification authority is able to identify or describe.\n\n(3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security that the original classification authority is able to identify or describe.\n\n(b) Except as otherwise provided by statute, no other terms shall be used to identify United States classified information.\n\n(c) If there is significant doubt about the appropriate level of classification, it shall be classified at the lower level.\n\nSec. 1.3. Classification Authority. (a) The authority to classify information originally may be exercised only by:\n\n(1) the President and the Vice President;\n\n(2) agency heads and officials designated by the President; and\n\n(3) United States Government officials delegated this authority pursuant to paragraph (c) of this section.\n\n(b) Officials authorized to classify information at a specified level are also authorized to classify information at a lower level.\n\n(c) Delegation of original classification authority.\n\n(1) Delegations of original classification authority shall be limited to the minimum required to administer this order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority.\n\n(2) \"Top Secret\" original classification authority may be delegated only by the President, the Vice President, or an agency head or official designated pursuant to paragraph (a)(2) of this section.\n\n(3) \"Secret\" or \"Confidential\" original classification authority may be delegated only by the President, the Vice President, an agency head or official designated pursuant to paragraph (a)(2) of this section, or the senior agency official designated under section 5.4(d) of this order, provided that official has been delegated \"Top Secret\" original classification authority by the agency head.\n\n(4) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this order. Each delegation shall identify the official by name or position.\n\n(5) Delegations of original classification authority shall be reported or made available by name or position to the Director of the Information Security Oversight Office.\n\n(d) All original classification authorities must receive training in proper classification (including the avoidance of over-classification) and declassification as provided in this order and its implementing directives at least once a calendar year. Such training must include instruction on the proper safeguarding of classified information and on the sanctions in section 5.5 of this order that may be brought against an individual who fails to classify information properly or protect classified information from unauthorized disclosure. Original classification authorities who do not receive such mandatory training at least once within a calendar year shall have their classification authority suspended by the agency head or the senior agency official designated under section 5.4(d) of this order until such training has taken place. A waiver may be granted by the agency head, the deputy agency head, or the senior agency official if an individual is unable to receive such training due to unavoidable circumstances. Whenever a waiver is granted, the individual shall receive such training as soon as practicable.\n\n(e) Exceptional cases. When an employee, government contractor, licensee, certificate holder, or grantee of an agency who does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this order and its implementing directives. The information shall be transmitted promptly as provided under this order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within 30 days whether to classify this information.\n\nSec. 1.4. Classification Categories. Information shall not be considered for classification unless its unauthorized disclosure could reasonably be expected to cause identifiable or describable damage to the national security in accordance with section 1.2 of this order, and it pertains to one or more of the following:\n\n(a) military plans, weapons systems, or operations;\n\n(b) foreign government information;\n\n(c) intelligence activities (including covert action), intelligence sources or methods, or cryptology;\n\n(d) foreign relations or foreign activities of the United States, including confidential sources;\n\n(e) scientific, technological, or economic matters relating to the national security;\n\n(f) United States Government programs for safeguarding nuclear materials or facilities;\n\n(g) vulnerabilities or capabilities of systems, installations, infrastructures, projects, plans, or protection services relating to the national security; or\n\n(h) the development, production, or use of weapons of mass destruction.\n\nSec. 1.5. Duration of Classification. (a) At the time of original classification, the original classification authority shall establish a specific date or event for declassification based on the duration of the national security sensitivity of the information. Upon reaching the date or event, the information shall be automatically declassified. Except for information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, the date or event shall not exceed the time frame established in paragraph (b) of this section.\n\n(b) If the original classification authority cannot determine an earlier specific date or event for declassification, information shall be marked for declassification 10 years from the date of the original decision, unless the original classification authority otherwise determines that the sensitivity of the information requires that it be marked for declassification for up to 25 years from the date of the original decision.\n\n(c) An original classification authority may extend the duration of classification up to 25 years from the date of origin of the document, change the level of classification, or reclassify specific information only when the standards and procedures for classifying information under this order are followed.\n\n(d) No information may remain classified indefinitely. Information marked for an indefinite duration of classification under predecessor orders, for example, marked as \"Originating Agency's Determination Required,\" or classified information that contains incomplete declassification instructions or lacks declassification instructions shall be declassified in accordance with part 3 of this order.\n\nSec. 1.6. Identification and Markings. (a) At the time of original classification, the following shall be indicated in a manner that is immediately apparent:\n\n(1) one of the three classification levels defined in section 1.2 of this order;\n\n(2) the identity, by name and position, or by personal identifier, of the original classification authority;\n\n(3) the agency and office of origin, if not otherwise evident;\n\n(4) declassification instructions, which shall indicate one of the following:\n\n(A) the date or event for declassification, as prescribed in section 1.5(a);\n\n(B) the date that is 10 years from the date of original classification, as prescribed in section 1.5(b);\n\n(C) the date that is up to 25 years from the date of original classification, as prescribed in section 1.5(b); or\n\n(D) in the case of information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, the marking prescribed in implementing directives issued pursuant to this order; and\n\n(5) a concise reason for classification that, at a minimum, cites the applicable classification categories in section 1.4 of this order.\n\n(b) Specific information required in paragraph (a) of this section may be excluded if it would reveal additional classified information.\n\n(c) With respect to each classified document, the agency originating the document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are unclassified. In accordance with standards prescribed in directives issued under this order, the Director of the Information Security Oversight Office may grant and revoke temporary waivers of this requirement. The Director shall revoke any waiver upon a finding of abuse.\n\n(d) Markings or other indicia implementing the provisions of this order, including abbreviations and requirements to safeguard classified working papers, shall conform to the standards prescribed in implementing directives issued pursuant to this order.\n\n(e) Foreign government information shall retain its original classification markings or shall be assigned a U.S. classification that provides a degree of protection at least equivalent to that required by the entity that furnished the information. Foreign government information retaining its original classification markings need not be assigned a U.S. classification marking provided that the responsible agency determines that the foreign government markings are adequate to meet the purposes served by U.S. classification markings.\n\n(f) Information assigned a level of classification under this or predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Whenever such information is used in the derivative classification process or is reviewed for possible declassification, holders of such information shall coordinate with an appropriate classification authority for the application of omitted markings.\n\n(g) The classification authority shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document or prepare a product to allow for dissemination at the lowest level of classification possible or in unclassified form.\n\n(h) Prior to public release, all declassified records shall be appropriately marked to reflect their declassification.\n\nSec. 1.7. Classification Prohibitions and Limitations. (a) In no case shall information be classified, continue to be maintained as classified, or fail to be declassified in order to:\n\n(1) conceal violations of law, inefficiency, or administrative error;\n\n(2) prevent embarrassment to a person, organization, or agency;\n\n(3) restrain competition; or\n\n(4) prevent or delay the release of information that does not require protection in the interest of the national security.\n\n(b) Basic scientific research information not clearly related to the national security shall not be classified.\n\n(c) Information may not be reclassified after declassification and release to the public under proper authority unless:\n\n(1) the reclassification is personally approved in writing by the agency head based on a document-by-document determination by the agency that reclassification is required to prevent significant and demonstrable damage to the national security;\n\n(2) the information may be reasonably recovered without bringing undue attention to the information;\n\n(3) the reclassification action is reported promptly to the Assistant to the President for National Security Affairs (National Security Advisor) and the Director of the Information Security Oversight Office; and\n\n(4) for documents in the physical and legal custody of the National Archives and Records Administration (National Archives) that have been available for public use, the agency head has, after making the determinations required by this paragraph, notified the Archivist of the United States (Archivist), who shall suspend public access pending approval of the reclassification action by the Director of the Information Security Oversight Office. Any such decision by the Director may be appealed by the agency head to the President through the National Security Advisor. Public access shall remain suspended pending a prompt decision on the appeal.\n\n(d) Information that has not previously been disclosed to the public under proper authority may be classified or reclassified after an agency has received a request for it under the Freedom of Information Act (5 U.S.C. 552), the Presidential Records Act, 44 U.S.C. 2204(c)(1), the Privacy Act of 1974 (5 U.S.C. 552a), or the mandatory review provisions of section 3.5 of this order only if such classification meets the requirements of this order and is accomplished on a document-by-document basis with the personal participation or under the direction of the agency head, the deputy agency head, or the senior agency official designated under section 5.4 of this order. The requirements in this paragraph also apply to those situations in which information has been declassified in accordance with a specific date or event determined by an original classification authority in accordance with section 1.5 of this order.\n\n(e) Compilations of items of information that are individually unclassified may be classified if the compiled information reveals an additional association or relationship that: (1) meets the standards for classification under this order; and (2) is not otherwise revealed in the individual items of information.\n\nSec. 1.8. Classification Challenges. (a) Authorized holders of information who, in good faith, believe that its classification status is improper are encouraged and expected to challenge the classification status of the information in accordance with agency procedures established under paragraph (b) of this section.\n\n(b) In accordance with implementing directives issued pursuant to this order, an agency head or senior agency official shall establish procedures under which authorized holders of information, including authorized holders outside the classifying agency, are encouraged and expected to challenge the classification of information that they believe is improperly classified or unclassified. These procedures shall ensure that:\n\n(1) individuals are not subject to retribution for bringing such actions;\n\n(2) an opportunity is provided for review by an impartial official or panel; and\n\n(3) individuals are advised of their right to appeal agency decisions to the Interagency Security Classification Appeals Panel (Panel) established by section 5.3 of this order.\n\n(c) Documents required to be submitted for prepublication review or other administrative process pursuant to an approved nondisclosure agreement are not covered by this section.\n\nSec. 1.9. Fundamental Classification Guidance Review. (a) Agency heads shall complete on a periodic basis a comprehensive review of the agency's classification guidance, particularly classification guides, to ensure the guidance reflects current circumstances and to identify classified information that no longer requires protection and can be declassified. The initial fundamental classification guidance review shall be completed within 2 years of the effective date of this order.\n\n(b) The classification guidance review shall include an evaluation of classified information to determine if it meets the standards for classification under section 1.4 of this order, taking into account an up-to-date assessment of likely damage as described under section 1.2 of this order.\n\n(c) The classification guidance review shall include original classification authorities and agency subject matter experts to ensure a broad range of perspectives.\n\n(d) Agency heads shall provide a report summarizing the results of the classification guidance review to the Director of the Information Security Oversight Office and shall release an unclassified version of this report to the public.\n\nPART 2—DERIVATIVE CLASSIFICATION\n\nSec. 2.1. Use of Derivative Classification. (a) Persons who reproduce, extract, or summarize classified information, or who apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority.\n\n(b) Persons who apply derivative classification markings shall:\n\n(1) be identified by name and position, or by personal identifier, in a manner that is immediately apparent for each derivative classification action;\n\n(2) observe and respect original classification decisions; and\n\n(3) carry forward to any newly created documents the pertinent classification markings. For information derivatively classified based on multiple sources, the derivative classifier shall carry forward:\n\n(A) the date or event for declassification that corresponds to the longest period of classification among the sources, or the marking established pursuant to section 1.6(a)(4)(D) of this order; and\n\n(B) a listing of the source materials.\n\n(c) Derivative classifiers shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document or prepare a product to allow for dissemination at the lowest level of classification possible or in unclassified form.\n\n(d) Persons who apply derivative classification markings shall receive training in the proper application of the derivative classification principles of the order, with an emphasis on avoiding over-classification, at least once every 2 years. Derivative classifiers who do not receive such training at least once every 2 years shall have their authority to apply derivative classification markings suspended until they have received such training. A waiver may be granted by the agency head, the deputy agency head, or the senior agency official if an individual is unable to receive such training due to unavoidable circumstances. Whenever a waiver is granted, the individual shall receive such training as soon as practicable.\n\nSec. 2.2. Classification Guides. (a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. These guides shall conform to standards contained in directives issued under this order.\n\n(b) Each guide shall be approved personally and in writing by an official who:\n\n(1) has program or supervisory responsibility over the information or is the senior agency official; and\n\n(2) is authorized to classify information originally at the highest level of classification prescribed in the guide.\n\n(c) Agencies shall establish procedures to ensure that classification guides are reviewed and updated as provided in directives issued under this order.\n\n(d) Agencies shall incorporate original classification decisions into classification guides on a timely basis and in accordance with directives issued under this order.\n\n(e) Agencies may incorporate exemptions from automatic declassification approved pursuant to section 3.3(j) of this order into classification guides, provided that the Panel is notified of the intent to take such action for specific information in advance of approval and the information remains in active use.\n\n(f) The duration of classification of a document classified by a derivative classifier using a classification guide shall not exceed 25 years from the date of the origin of the document, except for:\n\n(1) information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction; and\n\n(2) specific information incorporated into classification guides in accordance with section 2.2(e) of this order.\n\nPART 3—DECLASSIFICATION AND DOWNGRADING\n\nSec. 3.1. Authority for Declassification. (a) Information shall be declassified as soon as it no longer meets the standards for classification under this order.\n\n(b) Information shall be declassified or downgraded by:\n\n(1) the official who authorized the original classification, if that official is still serving in the same position and has original classification authority;\n\n(2) the originator's current successor in function, if that individual has original classification authority;\n\n(3) a supervisory official of either the originator or his or her successor in function, if the supervisory official has original classification authority; or\n\n(4) officials delegated declassification authority in writing by the agency head or the senior agency official of the originating agency.\n\n(c) The Director of National Intelligence (or, if delegated by the Director of National Intelligence, the Principal Deputy Director of National Intelligence) may, with respect to the Intelligence Community, after consultation with the head of the originating Intelligence Community element or department, declassify, downgrade, or direct the declassification or downgrading of information or intelligence relating to intelligence sources, methods, or activities.\n\n(d) It is presumed that information that continues to meet the classification requirements under this order requires continued protection. In some exceptional cases, however, the need to protect such information may be outweighed by the public interest in disclosure of the information, and in these cases the information should be declassified. When such questions arise, they shall be referred to the agency head or the senior agency official. That official will determine, as an exercise of discretion, whether the public interest in disclosure outweighs the damage to the national security that might reasonably be expected from disclosure. This provision does not:\n\n(1) amplify or modify the substantive criteria or procedures for classification; or\n\n(2) create any substantive or procedural rights subject to judicial review.\n\n(e) If the Director of the Information Security Oversight Office determines that information is classified in violation of this order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the President through the National Security Advisor. The information shall remain classified pending a prompt decision on the appeal.\n\n(f) The provisions of this section shall also apply to agencies that, under the terms of this order, do not have original classification authority, but had such authority under predecessor orders.\n\n(g) No information may be excluded from declassification under section 3.3 of this order based solely on the type of document or record in which it is found. Rather, the classified information must be considered on the basis of its content.\n\n(h) Classified nonrecord materials, including artifacts, shall be declassified as soon as they no longer meet the standards for classification under this order.\n\n(i) When making decisions under sections 3.3, 3.4, and 3.5 of this order, agencies shall consider the final decisions of the Panel.\n\nSec. 3.2. Transferred Records. (a) In the case of classified records transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this order.\n\n(b) In the case of classified records that are not officially transferred as described in paragraph (a) of this section, but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such records shall be deemed to be the originating agency for purposes of this order. Such records may be declassified or downgraded by the agency in possession of the records after consultation with any other agency that has an interest in the subject matter of the records.\n\n(c) Classified records accessioned into the National Archives shall be declassified or downgraded by the Archivist in accordance with this order, the directives issued pursuant to this order, agency declassification guides, and any existing procedural agreement between the Archivist and the relevant agency head.\n\n(d) The originating agency shall take all reasonable steps to declassify classified information contained in records determined to have permanent historical value before they are accessioned into the National Archives. However, the Archivist may require that classified records be accessioned into the National Archives when necessary to comply with the provisions of the Federal Records Act. This provision does not apply to records transferred to the Archivist pursuant to section 2203 of title 44, United States Code, or records for which the National Archives serves as the custodian of the records of an agency or organization that has gone out of existence.\n\n(e) To the extent practicable, agencies shall adopt a system of records management that will facilitate the public release of documents at the time such documents are declassified pursuant to the provisions for automatic declassification in section 3.3 of this order.\n\nSec. 3.3 Automatic Declassification. (a) Subject to paragraphs (b)-(d) and (g)-(j) of this section, all classified records that (1) are more than 25 years old and (2) have been determined to have permanent historical value under title 44, United States Code, shall be automatically declassified whether or not the records have been reviewed. All classified records shall be automatically declassified on December 31 of the year that is 25 years from the date of origin, except as provided in paragraphs (b)-(d) and (g)-(j) of this section. If the date of origin of an individual record cannot be readily determined, the date of original classification shall be used instead.\n\n(b) An agency head may exempt from automatic declassification under paragraph (a) of this section specific information, the release of which should clearly and demonstrably be expected to:\n\n(1) reveal the identity of a confidential human source, a human intelligence source, a relationship with an intelligence or security service of a foreign government or international organization, or a nonhuman intelligence source; or impair the effectiveness of an intelligence method currently in use, available for use, or under development;\n\n(2) reveal information that would assist in the development, production, or use of weapons of mass destruction;\n\n(3) reveal information that would impair U.S. cryptologic systems or activities;\n\n(4) reveal information that would impair the application of state-of-the-art technology within a U.S. weapon system;\n\n(5) reveal formally named or numbered U.S. military war plans that remain in effect, or reveal operational or tactical elements of prior plans that are contained in such active plans;\n\n(6) reveal information, including foreign government information, that would cause serious harm to relations between the United States and a foreign government, or to ongoing diplomatic activities of the United States;\n\n(7) reveal information that would impair the current ability of United States Government officials to protect the President, Vice President, and other protectees for whom protection services, in the interest of the national security, are authorized;\n\n(8) reveal information that would seriously impair current national security emergency preparedness plans or reveal current vulnerabilities of systems, installations, or infrastructures relating to the national security; or\n\n(9) violate a statute, treaty, or international agreement that does not permit the automatic or unilateral declassification of information at 25 years.\n\n(c)(1) An agency head shall notify the Panel of any specific file series of records for which a review or assessment has determined that the information within that file series almost invariably falls within one or more of the exemption categories listed in paragraph (b) of this section and that the agency proposes to exempt from automatic declassification at 25 years.\n\n(2) The notification shall include:\n\n(A) a description of the file series;\n\n(B) an explanation of why the information within the file series is almost invariably exempt from automatic declassification and why the information must remain classified for a longer period of time; and\n\n(C) except when the information within the file series almost invariably identifies a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, a specific date or event for declassification of the information, not to exceed December 31 of the year that is 50 years from the date of origin of the records.\n\n(3) The Panel may direct the agency not to exempt a designated file series or to declassify the information within that series at an earlier date than recommended. The agency head may appeal such a decision to the President through the National Security Advisor.\n\n(4) File series exemptions approved by the President prior to December 31, 2008, shall remain valid without any additional agency action pending Panel review by the later of December 31, 2010, or December 31 of the year that is 10 years from the date of previous approval.\n\n(d) The following provisions shall apply to the onset of automatic declassification:\n\n(1) Classified records within an integral file block, as defined in this order, that are otherwise subject to automatic declassification under this section shall not be automatically declassified until December 31 of the year that is 25 years from the date of the most recent record within the file block.\n\n(2) After","P37":"By the President of the United States of America A Proclamation\n\nThis month, we recognize National Sexual Assault Awareness and Prevention Month by ending the unfathomable human abuse committed under open borders policies.\n\nOne of the leading causes of sexual violence over the last 4 years has been the invasion of illegal aliens at our southern border. In a treasonous act of betrayal against the American people, the previous administration unleashed an army of gangs and criminal aliens from the darkest and most dangerous corners of the world—causing a dramatic increase of sexual violence in our neighborhoods and communities. These reckless policies empowered some of the most depraved people on the planet to exploit women and children in the most vicious ways imaginable.\n\nWe will never forget the names of precious American souls like Jocelyn Nungaray, Laken Riley, Rachel Morin, and many others who were savagely killed by illegal alien crime. Last June, 12-year-old Jocelyn Nungaray was brutally assaulted and murdered by two illegal aliens in her home state of Texas. To memorialize her young life and love of nature and animals, I proudly renamed the Anahuac National Wildlife Refuge in Texas to the Jocelyn Nungaray National Wildlife Refuge. May this be Jocelyn's little piece of Heaven on Earth.\n\nEvery act of violence committed against an American at the hands of an illegal alien is a crime beyond all comprehension. For that reason, I am doing everything in my power to defend the dignity of every human life, keep violent criminals out of our country, and end sexual violence—including the degrading scourge of sex trafficking, a form of modern-day slavery that has battered multitudes of innocent lives and scarred untold numbers of our most vulnerable fellow citizens.\n\nTo protect our communities, one of my first actions as President was to declare a national emergency at the southern border. I also designated cartels as Foreign Terrorist Organizations and Specially Designated Global Terrorists to end their campaign of violence and bloodshed. In my first legislative action as President, I signed into law the Laken Riley Act, which requires U.S. Immigration and Customs Enforcement to detain illegal aliens convicted of burglary, theft, larceny, or shoplifting. I have also initiated the largest deportation operation in the history of our country—including the deportation of hundreds of illegal alien gang members to El Salvador.\n\nAs President, I am bringing back security on our border, safety on our streets, and law and order in our communities. Under my leadership, human trafficking is being brought to a rapid end, and justice is being swiftly served.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim April 2025 as National Sexual Assault Awareness and Prevention Month. I urge all Americans, families, law enforcement personnel, healthcare providers, and community and faith-based organizations to support survivors of sexual assault and work together to prevent these crimes in their communities.\n\nIn Witness Whereof, I have hereunto set my hand this third day of April, in the year of our Lord two thousand twenty-five, and of the Independence of the United States of America the two hundred and forty-ninth.\n\nDONALD J. TRUMP","EO19":"By virtue of the authority vested in me by section 301 of Title 3 of the United States Code and by section 2 of the Act of July 7, 1958 (72 Stat. 327), it is ordered as follows:\n\nPART I—GENERAL\n\nSECTION 101. (a) As used in this order, the terms \"agency\", \"employee\", \"Government\", and \"training\" have the meanings given to those terms, respectively, by section 4101 of Title 5, United States Code.\n\n(b) \"Interagency training\" means training provided by one agency for other agencies or shared by two or more agencies.\n\nSEC. 102. It is the policy of the Government of the United States to develop its employees through the establishment and operation of progressive and efficient training programs, thereby improving public service, increasing efficiency and economy, building and retaining a force of skilled and efficient employees, and installing and using the best modern practices and techniques in the conduct of the Government's business.\n\nSEC. 103. The Civil Service Commission shall provide leadership and guidance to insure that the policy set forth in section 102 is carried out.\n\nPART II—CIVIL SERVICE COMMISSION RESPONSIBILITIES\n\nSEC. 201. The Civil Service Commission shall plan and promote the development, improvement, coordination, and evaluation of training in accordance with chapter 41 of Title 5, United States Code, and with the policy set forth in section 102 of this order.\n\nSEC. 202. In carrying out its responsibilities under chapter 41 of Title 5, United States Code, and section 201 of this order, the Commission shall:\n\n(a) Advise the President on means for furthering and strengthening programs of training;\n\n(b) Counsel heads of agencies and other agency officials on the improvement of training;\n\n(c) Assist agencies to develop sound programs and financial plans for training and provide advice, information, and assistance to agencies on planning, programming, budgeting, operating, and evaluating training programs;\n\n(d) Identify functional areas in which new or expanded interagency training activity is needed and either conduct such training or arrange for agencies having the substantive competence to do so;\n\n(e) Coordinate interagency training conducted by and for agencies (including agencies and portions of agencies excepted by section 4102(a) of Title 5, United States Code);\n\n(f) Encourage agencies to make appropriate use of non-Government training resources;\n\n(g) Develop, install, and maintain a system to provide the training data needed to carry out its own functions and to provide staff assistance to the President; and\n\n(h) Provide for identification and dissemination of findings of research into training technology and undertake, or assign to other agencies, such research projects as may be needed.\n\nPART III—AGENCY RESPONSIBILITIES AND OPERATIONS\n\nSEC. 301. The head of each agency shall plan, program, budget, operate, and evaluate training programs in accordance with chapter 41 of Title 5, United States Code, and with the policy set forth in section 102 of this order.\n\nSEC. 302. The head of each agency shall:\n\n(a) Foster employee self-development by creating a work environment in which self-development is encouraged, by assuring that opportunities for training and self-study materials are reasonably available where the employee is stationed, and by recognizing self-initiated improvement in performance;\n\n(b) Provide training for employees without regard to race, creed, color, national origin, sex, or other factors unrelated to the need for training;\n\n(c) Establish and make full use of agency facilities for training employees;\n\n(d) Extend agency training programs to employees of other agencies (including agencies and portions of agencies excepted by section 4102(a) of Title 5, United States Code) and assign his employees to interagency training whenever this will result in better training, improved service, or savings to the Government;\n\n(e) Establish interagency training facilities in areas of substantive competence as arranged by the Civil Service Commission; and\n\n(f) Use non-Government training resources as appropriate.\n\nSEC. 303. In carrying out his responsibilities, the head of each agency shall, consonant with chapter 41 of Title 5, United States Code, this order, and regulations of the Civil Service Commission:\n\n(a) Review periodically, but not less often than annually, the agency's program to identify training needed to bring about more effective performance at the least possible cost;\n\n(b) Conduct periodic reviews of individual employee's training needs as related to program objectives;\n\n(c) Conduct research related to training objectives and required for program improvement and effectiveness;\n\n(d) Plan, program, and evaluate training for both short and long-range program needs by occupations,. organizations, or other appropriate groups;\n\n(e) Establish priorities for needed training, and provide for the use of funds and manhours in accordance with these priorities;\n\n(f) Utilize the flexibility of work assignments to provide work experience which promotes growth leading to higher quality and greater quantity of work done;\n\n(g) Establish training facilities and services as needed;\n\n(h) Monitor the effectiveness with which self-development is encouraged and on-the-job training is provided at all levels;\n\n(i) Establish criteria for the selection of employees for training; and\n\n(j) Approve the acceptance of any contributions, awards, or payments to employees authorized by section 401 (b) of this order and regulations issued by the Civil Service Commission.\n\nPART IV—DELEGATIONS\n\nSEC. 401. The following functions vested in the President are hereby delegated to the Civil Service Commission:\n\n(a) The authority under section 4102(b) (1) of Title 5, United States Code, to designate any agency or part thereof, or any employee or employees therein, as excepted from any provision of chapter 41 of Title 5, United States Code, other than sections 4102, 4111 (b), and 4112; and to designate any such agency or part thereof, or any employee or employees therein previously excepted, as again subject to chapter 41 of Title 5, United States Code, or any provision of that chapter.\n\n(b) The authority under section 4111(a) of Title 5, United States Code, to fix by regulation the extent to which the contributions, awards, and payments referred to in that section may be made to and accepted by employees.\n\nSEC. 402. The authority vested in the President by section 4101(6) (B) of Title 5, United States Code, to designate a foreign government or international organization or instrumentality of either as eligible to provide training, is hereby delegated to the head of each agency for his employees except that each such designation shall be made only after the agency head concerned has obtained and given due consideration to the advice of the Department of State thereon prior to the first use of such training facility and thereafter periodically but not less often than once every three years.\n\nPART V—REVOCATION OF PRIOR ORDER\n\nSEC. 501. Executive Order No. 10800 of January 15, 1959, is hereby revoked.\n\nLYNDON B. JOHNSON\n\nThe White House\n\nApril 20, 1967","P12":"By the President of the United States of America\n\nA Proclamation\n\nAs President of the United States of America, acting through my representatives, I entered into the negotiation of an agreement on trade relations between the United States of America and the Hungarian People's Republic with representatives of the Hungarian People's Republic;\n\nThe negotiations were conducted in accordance with the requirements of the Trade Act of 1974 (P.L. 93-618, January 3, 1975; 88 Stat. 1978) (\"the Act\");\n\nAn \"Agreement on Trade Relations between the United States of America and the Hungarian People's Republic,\" in English and Hungarian, was signed on March 17, 1978, by representatives of the two Governments, and is annexed to this Proclamation;\n\nThe Agreement conforms to the requirements relating to bilateral commercial agreements specified in Section 405 (b) of the Act;\n\nArticle XI of the Agreement provides that it shall enter into force on the date of exchange of written notices of acceptance by the Governments of the United States of America and the Hungarian People's Republic; and\n\nSection 405 (c) of the Act provides that a bilateral commercial agreement and a proclamation implementing such agreement shall take effect only if approved by the Congress;\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, proclaim as follows:\n\n(1) This Proclamation shall become effective, said Agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Hungarian People's Republic in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XI of the said Agreement; and\n\n(2) General Headnote 3(e) of the Tariff Schedules of the United States is amended by deleting therefrom \"Hungary\" as of the effective date of this proclamation and a notice thereof shall be published in the FEDERAL REGISTER promptly thereafter.\n\nIn Witness Whereof, I have signed this Proclamation this seventh day of April, in the year of our Lord one thousand nine hundred seventy-eight, and of the Independence of the United States of America the two hundred second.\n\nJIMMY CARTER","M6":"Memorandum for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development\n\nSubject: The Mexico City Policy\n\nI hereby revoke the Presidential Memorandum of January 28, 2021, for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (Protecting Women's Health at Home and Abroad), and reinstate the Presidential Memorandum of January 23, 2017, for the Secretary of State, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (The Mexico City Policy).\n\nI direct the Secretary of State, in coordination with the Secretary of Health and Human Services, to the extent allowable by law, to implement a plan to extend the requirements of the reinstated Memorandum to global health assistance furnished by all departments or agencies.\n\nI further direct the Secretary of State to take all necessary actions, to the extent permitted by law, to ensure that U.S. taxpayer dollars do not fund organizations or programs that support or participate in the management of a program of coercive abortion or involuntary sterilization.\n\nThis memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nThe Secretary of State is authorized and directed to publish this memorandum in the Federal Register.\n\nDONALD J. TRUMP","EO26":"By the authority vested in me as President of the United States of America by Section 205 of the Credit Control Act (12 U.S.C. 1904), and having determined that the regulation and control of credit is necessary and appropriate for the purpose of preventing and controlling inflation generated by the extension of credit in an excessive volume, it is hereby ordered as follows:\n\n1-101. The Board of Governors of the Federal Reserve System is authorized to exercise all the authority under the Credit Control Act (12 U.S.C. 1901 et seq.) to regulate and control consumer credit.\n\n1-102. The Board of Governors of the Federal Reserve System is authorized to exercise all the authority under the Credit Control Act to regulate and control credit extended by those financial intermediaries which are not subject, as of the date hereof, to either the amendments of law effected by Public Law 89-597, as amended, or Section 19 of the Federal Reserve Act, as amended (12 U.S.C. 461), and which are primarily engaged in the extension of short-term credit.\n\n1-103. The Board of Governors of the Federal Reserve System is authorized to exercise all the authority under the Credit Control Act to regulate and control credit extended to commercial banks that are not members of the Federal Reserve System in the form of managed liabilities.\n\n1—104. The Board of Governors of the Federal Reserve System is authorized to exercise the authority under Section 206 (4) of the Credit Control Act (12 U.S.C. 1905(4)) to prescribe appropriate requirements as to the keeping of records with respect to all forms of credit.\n\n1—105. For the purposes of this Order \"consumer credit,\" \"financial intermediaries, .... short-term credit,\" commercial banks,\" and \"managed liabilities\" shall have such meaning as may be reasonably prescribed by the regulations of the Board of Governors of the Federal Reserve System.\n\n1-106. The authorizations granted by this Order shall remain in effect for an indefinite period of time and until revoked by the President.\n\nJIMMY CARTER\n\nThe White House,\n\nMarch 14, 1980.\n\n[Filed with the Office of the Federal Register, 4:49 p.m., March 14, 1980]","EO28":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered:\n\nSection 1. Policy and Purpose. The Constitution vests all executive power in the President and charges him with faithfully executing the laws. Since it would be impossible for the President to single-handedly perform all the executive business of the Federal Government, the Constitution also provides for subordinate officers to assist the President in his executive duties. In the exercise of their often-considerable authority, these executive branch officials remain subject to the President's ongoing supervision and control. The President in turn is regularly elected by and accountable to the American people. This is one of the structural safeguards, along with the separation of powers between the executive and legislative branches, regular elections for the Congress, and an independent judiciary whose judges are appointed by the President by and with the advice and consent of the Senate, by which the Framers created a Government accountable to the American people.\n\nHowever, previous administrations have allowed so-called \"independent regulatory agencies\" to operate with minimal Presidential supervision. These regulatory agencies currently exercise substantial executive authority without sufficient accountability to the President, and through him, to the American people. Moreover, these regulatory agencies have been permitted to promulgate significant regulations without review by the President.\n\nThese practices undermine such regulatory agencies' accountability to the American people and prevent a unified and coherent execution of Federal law. For the Federal Government to be truly accountable to the American people, officials who wield vast executive power must be supervised and controlled by the people's elected President.\n\nTherefore, in order to improve the administration of the executive branch and to increase regulatory officials' accountability to the American people, it shall be the policy of the executive branch to ensure Presidential supervision and control of the entire executive branch. Moreover, all executive departments and agencies, including so-called independent agencies, shall submit for review all proposed and final significant regulatory actions to the Office of Information and Regulatory Affairs (OIRA) within the Executive Office of the President before publication in the Federal Register.\n\nSec. 2. Definitions. For the purposes of this order:\n\n(a) The term \"employees\" shall have the meaning given that term in section 2105 of title 5, United States Code.\n\n(b) The term \"independent regulatory agency\" shall have the meaning given that term in section 3502(5) of title 44, United States Code. This order shall not apply to the Board of Governors of the Federal Reserve System or to the Federal Open Market Committee in its conduct of monetary policy. This order shall apply to the Board of Governors of the Federal Reserve System only in connection with its conduct and authorities directly related to its supervision and regulation of financial institutions.\n\n(c) The term \"independent regulatory agency chairman\" shall mean, with regard to a multi-member independent regulatory agency, the chairman of such agency, and shall mean, with regard to a single-headed independent regulatory agency, such agency's chairman, director, or other presiding officer.\n\n(d) The term \"head\" of an independent regulatory agency shall mean those appointed to supervise independent regulatory agencies and in whom the agencies' authorities are generally vested, encompassing the chairman, director, or other presiding officer, and, as applicable, other members, commissioners, or similar such officials with responsibility for supervising such agencies.\n\nSec. 3. OIRA Review of Agency Regulations. (a) Section 3(b) of Executive Order 12866 of September 30, 1993 (\"Regulatory Planning and Review\"), as amended, is hereby amended to read as follows:\n\n\"(b) \"Agency,\" unless otherwise indicated, means any authority of the United States that is an \"agency\" under 44 U.S.C. 3502(1), and shall also include the Federal Election Commission. This order shall not apply to the Board of Governors of the Federal Reserve System or to the Federal Open Market Committee in its conduct of monetary policy. This order shall apply to the Board of Governors of the Federal Reserve System only in connection with its conduct and authorities directly related to its supervision and regulation of financial institutions.\".\n\n(b) The Director of the Office of Management and Budget (OMB) shall provide guidance on implementation of this order to the heads of executive departments and agencies newly submitting regulatory actions under section 3(b) of Executive Order 12866. Agency submissions by independent regulatory agencies under such section shall commence within the earlier of 60 days from the date of this order, or completion of such implementation guidance.\n\nSec. 4. Performance Standards and Management Objectives. The Director of OMB shall establish performance standards and management objectives for independent agency heads, as appropriate and consistent with applicable law, and report periodically to the President on their performance and efficiency in attaining such standards and objectives.\n\nSec. 5. Apportionments for Independent Regulatory Agencies. The Director of OMB shall, on an ongoing basis:\n\n(a) review independent regulatory agencies' obligations for consistency with the President's policies and priorities; and\n\n(b) consult with independent regulatory agency chairmen and adjust such agencies' apportionments by activity, function, project, or object, as necessary and appropriate, to advance the President's policies and priorities. Such adjustments to apportionments may prohibit independent regulatory agencies from expending appropriations on particular activities, functions, projects, or objects, so long as such restrictions are consistent with law.\n\nSec. 6. Additional Consultation with the Executive Office of the President. (a) Subject to subsection (b), independent regulatory agency chairmen shall regularly consult with and coordinate policies and priorities with the directors of OMB, the White House Domestic Policy Council, and the White House National Economic Council.\n\n(b) The heads of independent regulatory agencies shall establish a position of White House Liaison in their respective agencies. Such position shall be in grade 15 of the General Schedule and shall be placed in Schedule C of the excepted service.\n\n(c) Independent regulatory agency chairmen shall submit agency strategic plans developed pursuant to the Government Performance and Results Act of 1993 to the Director of OMB for clearance prior to finalization.\n\nSec. 7. Rules of Conduct Guiding Federal Employees' Interpretation of the Law. The President and the Attorney General, subject to the President's supervision and control, shall provide authoritative interpretations of law for the executive branch. The President and the Attorney General's opinions on questions of law are controlling on all employees in the conduct of their official duties. No employee of the executive branch acting in their official capacity may advance an interpretation of the law as the position of the United States that contravenes the President or the Attorney General's opinion on a matter of law, including but not limited to the issuance of regulations, guidance, and positions advanced in litigation, unless authorized to do so by the President or in writing by the Attorney General.\n\nSec. 8. General Provisions. (a) If any provision of this order, or the application of any provision to any person or circumstance, is held to be invalid, the remainder of this order and the application of its provisions to any other persons or circumstances shall not be affected thereby.\n\n(b) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department, agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(c) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(d) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nFebruary 18, 2025.","P21":"By the President of the United States of America\n\nA Proclamation\n\nThe Secretary of Energy has advised me that the continued reduction in world crude oil production has resulted in a national energy supply shortage constituting a severe energy supply interruption as defined in Section 3 (8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)). The Secretary based his conclusion on the fact that current and projected imports of crude oil and petroleum products, plus available stocks, are not adequate to meet normal demand and that shortages of essential fuels have begun to have a major adverse impact on the economy with the possibility of more severe impacts occurring in the future. Recent shortages of gasoline in some areas of the Nation and the current inadequate levels of heating oil stocks have underscored the seriousness of the situation and demonstrate that action must be taken now to conserve available supplies of petroleum.\n\nOn the basis of the Secretary's report, and other information available to me, I hereby find and determine, in accordance with Sections 201(b) and 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6261 (b), 6202(8)), the existence of a national energy supply shortage constituting a severe energy supply interruption, which:\n\n(A) is of significant scope and duration and of an emergency nature;\n\n(B) may cause major adverse impact on national safety or the national economy; and\n\n(C) has resulted from an interruption in the supply of imported petroleum products.\n\nI further find that implementation of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2, is required by the severe energy supply interruption. This Plan was transmitted by me to the Congress on March 1, 1979, and approved by a resolution of each House (S. Res. 122, 125 Cong. Rec. S 5135 (May 2, 1979); H. Res. 209, 125 Cong. Rec. H 3018 May 10, 1979)), which resolutions have been transmitted to me by the Secretary of the Senate and the Clerk of the House. Those resolutions were received by me on May 4 and May 15, 1979, respectively.\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Constitution and laws of the United States, including Section 201(b) of the Energy Policy and Conservation Act (42 U.S.C. 6261(b) ), do hereby proclaim that:\n\nSECTION 1. A severe energy supply interruption, as defined in Section 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)) currently exists with respect to the supply of imported crude oil and petroleum products.\n\nSEC. 2. This finding shall be immediately transmitted to the Congress.\n\nSEC. 3. The provisions of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2 (44 FR 12911 of March 8, 1979), shall become effective as of July 16, 1979.\n\nSEC. 4. In accordance with the provisions of the Plan, the Secretary of Energy is hereby authorized to issue regulations for the purpose of implementing the Energy Conservation Contingency Plan No. 2 and to administer the program in all respects.\n\nIn Witness Whereof, I have hereunto set my hand this tenth day of July, in the year of our Lord nineteen hundred seventy-nine, and of the Independence of the United States of America the two hundred and fourth.\n\nJIMMY CARTER","M4":"Memorandum for the Heads of Departments and Agencies:\n\nIn response to my urgent request, Congress has recently enacted legislation to raise minimum wages which must be paid by private employers in interstate commerce. Although this legislation specifically exempts the federal government as an employer, I believe that the social and economic reasons underlying this Congressional action are equally compelling and applicable to wage earners employed by federal departments and agencies.\n\nIn my view it is both desirable and in the public interest to establish the same minimum rates of $1.15 an hour, effective September 3, 1961, and $1.25 an hour, effective September 3, 1963, for all regular federal employees paid from appropriated funds. I want to make clear these minimum rates should apply to federal laundry workers, even though such workers in private employment are specifically exempted by the law.\n\nThese new minimum rates should be applied to federal employees in the United States not later than the effective dates specified in the legislation. It is my wish that the head of each department and agency review this matter promptly and take appropriate action unless clearly prevented from doing so by law.\n\nJOHN F. KENNEDY","P47":"By the President of the United States of America\n\nA Proclamation\n\nIn light of the political and economic crisis in Zaire, I have determined that it is in the interests of the United States to restrict the entrance into the United States as immigrants and nonimmigrants of certain Zairian nationals who formulate or implement policies that impede Zaire's transition to democracy or who benefit from such policies, and the immediate families of such persons.\n\nNow, Therefore, I, William J. Clinton, by the power vested in me as President by the Constitution and laws of the United States of America, including section 212 (f) of the Immigration and Nationality Act of 1952, as amended (8 U.S.C. 1182(f)), and section 301 of title 3, United States Code, hereby find that the unrestricted immigrant and nonimmigrant entry into the United States of persons described in section 1 of this proclamation would, except as provided for in section 2 or 3 of this proclamation, be detrimental to the interests of the United States. 1, therefore, do proclaim that:\n\nSection 1. The entry into the United States as immigrants and nonimmigrants of persons who formulate, implement, or benefit from policies that impede Zaire's transition to democracy, and the immediate family members of such persons, is hereby suspended.\n\nSec. 2. Section 1 shall not apply with respect to any person otherwise covered by section 1 where entry of such person would not be contrary to the interests of the United States.\n\nSec. 3. Persons covered by sections 1 and 2 shall be identified pursuant to procedures established by the Secretary of State, as authorized in section 6 below.\n\nSec. 4. Nothing in this proclamation shall be construed to derogate from United States Government obligations under applicable international agreements.\n\nSec.5. This proclamation is effective immediately and shall remain in effect until of State determines that it is no longer necessary and should be terminated.\n\nSec. 6. The Secretary of State shall have responsibility to implement this proclamation pursuant to procedures the Secretary may establish.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-first day of June, in the year of our Lord nineteen hundred and ninety-three, and of the Independence of the United States of America the two hundred and seventeenth.\n\nWILLIAM J. CLINTON","L12":"Dear Mr. Speaker: (Dear Mr. President:)\n\nIn accordance with section 603 of the Goldwater-Nichols Department of Defense Reorganization Act of 1986 (P.L. 99-433; 50 U.S.C. 404a), I hereby transmit the second annual report on the National Security Strategy of the United States, 1988.\n\nSincerely,\n\nRONALD REAGAN","EO15":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, it is hereby ordered as follows:\n\nSection 1. Assignment of Functions to the Secretary of Defense. The Secretary of Defense shall perform, except with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions of the President under the following provisions of title 10, United States Code:\n\n(a) subsection 1521(a); (b) the first sentence of subsection 12203(a); (c) the first sentence of subsection 14111(a), except with respect to reports relating to the grades of brigadier general or above, or rear admiral (lower half) or above; and (d) subsection 14310(a), except with respect to removals relating to a promotion list for grades of brigadier general or above, or rear admiral (lower half) or above.\n\nSec. 2. Assignment of Functions to the Secretary of Homeland Security. The Secretary of Homeland Security shall perform, with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions assigned to the President by the following provisions of the United States Code:\n\n(a) subsection 1521(a) of title 10; (b) the first sentence of subsection 12203(a) of title 10; (c) subsection 729(g) of title 14, except with respect to approval of, or removal of a name from, a report relating to the grades of rear admiral (lower half) or above; and (d) subsection 738(a) of title 14, except with respect to removals relating to a promotion list for grades of rear admiral (lower half) or above.\n\nSec. 3. Reassignment of Functions Assigned. The Secretary of Defense and the Secretary of Homeland Security may reassign the functions assigned to them by this order to civilian officers, within their respective departments, who hold a position for which the President makes an appointment by and with the advice and consent of the Senate, except that the Secretary of Defense and the Secretary of Homeland Security may not reassign the functions assigned by sections 1(b) and 2(b), respectively. The Secretary of Defense may not reassign the function assigned by section 1(c) of this order except to such an officer within the Office of the Secretary of Defense (as defined in section 131(b) of title 10).\n\nSec. 4. General Provisions. (a) This order shall take effect on October 1, 2004.\n\n(b) Nothing in this order shall be construed to limit or otherwise affect the authority of the President as Commander in Chief of the Armed Forces\n\nof the United States, or under the Constitution and laws of the United States to nominate or to make or terminate appointments.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, entities, officers, employees or agents, or any other person. GEORGE W. BUSH\n\nThe White House,\n\nSeptember 28, 2004.\n\n[Filed with the Office of the Federal Register, 11:31 a.m., September 29, 2004]","P49":"By the President of the United States of America\n\nA Proclamation\n\n1. On April 22, 1985, the United States and Israel entered into the Agreement on the Establishment of a Free Trade Area between the Government of the United States of America and the Government of Israel (USIFTA), which the Congress approved in the United States-Israel Free Trade Area Implementation Act of 1985 (the \"USIFTA Act\") (19 U.S.C. 2112 note).\n\n2. In order to maintain the general level of reciprocal and mutually advantageous concessions with respect to agricultural trade with Israel, on July 27, 2004, the United States entered into an agreement with Israel concerning certain aspects of trade in agricultural products during the period January 1, 2004, through December 31, 2008 (the \"2004 Agreement\"). The 2004 Agreement reflects an effort by the United States and Israel to address, through 2008, their continuing differences over the meaning of certain provisions in the USIFTA governing access for U.S. agricultural products to Israel's market.\n\n3. Section 4(b) of the USIFTA Act provides that, whenever the President determines that it is necessary to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, the President may proclaim such withdrawal, suspension, modification, or continuance of any duty, or such continuance of existing duty-free or excise treatment, or such additional duties as the President determines to be required or appropriate to carry out the USIFTA.\n\n4. In Proclamation 7826 of October 4, 2004, consistent with the 2004 Agreement, I proclaimed modifications to the Harmonized Tariff Schedule of the United States (HTS) to provide duty-free access into the United States through December 31, 2008, for specified quantities of certain agricultural products of Israel.\n\n5. On December 10, 2008, the United States entered into an agreement with Israel to extend the period that the 2004 Agreement is in force through December 31, 2009, to allow additional time for the two governments to conclude an agreement to replace the 2004 Agreement.\n\n6. Pursuant to section 4(b) of the USIFTA Act, I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, to provide duty-free access into the United States through the close of December 31, 2009, for specified quantities of certain agricultural products of Israel.\n\n7. On June 6, 2003, the United States and Chile entered into the United States-Chile Free Trade Agreement (USCFTA). The Congress approved the USCFTA in section 101(a) of the United States-Chile Free Trade Agreement Implementation Act (the \"USCFTA Act\") (19 U.S.C. 3805 note). In Proclamation 7746 of December 30, 2003, I proclaimed the tariff treatment called for under the USCFTA.\n\n8. Section 201(b) of the USCFTA Act authorizes the President, subject to the consultation and layover requirements of section 103(a) of the USCFTA Act, to proclaim such modifications to the staging of duty treatment set forth in Annex 3.3 of the USCFTA as the United States may agree to with Chile, as the President determines to be necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA.\n\n9. On November 26, 2008, the United States entered into an agreement with Chile that includes an accelerated schedule of duty elimination under the USCFTA for specific originating goods of Chile. The consultation and layover requirements of section 103(a) of the USCFTA Act with respect to the accelerated schedule of duty elimination were satisfied as of November 8, 2008.\n\n10. Pursuant to section 201(b) of the USCFTA Act, I have determined that modifications hereinafter proclaimed of rates of duties on originating goods of Chile are necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA and to carry out the agreement with Chile on an accelerated schedule of duty elimination for specific originating goods of Chile.\n\n11. On May 18, 2004, the United States and Australia entered into the United States-Australia Free Trade Agreement (USAFTA). The Congress approved the USAFTA in section 101(a) of the United States-Australia Free Trade Agreement Implementation Act (the \"USAFTA Act\") (19 U.S.C. 3805 note). In Proclamation 7857 of December 20, 2004, I proclaimed the rules of origin called for under the USAFTA.\n\n12. Section 203(o) of the USAFTA Act authorizes the President, subject to the consultation and layover requirements of section 104 of the USAFTA Act, to proclaim such modifications to the rules of origin as are necessary to implement an agreement with Australia pursuant to article 4.2.5 of the USAFTA.\n\n13. On October 10, 2008, the United States entered into an agreement with Australia pursuant to article 4.2.5 of the USAFTA to amend the USAFTA rule of origin for certain yarns of viscose rayon fiber. The consultation and layover requirements of section 104 of the USAFTA Act with respect to the proposed modification of the USAFTA rules of origin were satisfied as of December 24, 2008.\n\n14. Section 604 of the Trade Act of 1974, as amended (the \"1974 Act\") (19 U.S.C. 2483), authorizes the President to embody in the HTS the substance of relevant provisions of that Act, or other acts affecting import treatment, and of actions taken thereunder.\n\nNow, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States of America, including section 4 of the USIFTA Act, section 201(b) of the USCFTA Act, section 203(o) of the USAFTA Act, section 604 of the 1974 Act, and section 301 of title 3, United States Code, do proclaim that:\n\n(1) In order to implement U.S. tariff commitments under the 2004 Agreement through December 31, 2009, the HTS is modified as provided in Annex I to this proclamation.\n\n(2)(a) The modifications to the HTS made by Annex I to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2009.\n\n(b) The provisions of subchapter VIII of chapter 99 of the HTS, as modified by Annex I to this proclamation, shall continue in effect through December 31, 2009.\n\n(3) In order to provide for an accelerated schedule of duty elimination for specific originating goods of Chile, the tariff treatment set forth in the HTS is modified as provided in Annex II to this proclamation.\n\n(4) The modifications made to the HTS by Annex II to this proclamation shall be effective with respect to goods entered, or withdrawn from warehouse for consumption, on or after January 1, 2009.\n\n(5) In order to implement the agreement with Australia to change the USAFTA rules of origin for certain yarns of viscose rayon fiber, the HTS is modified as provided in Annex III to this proclamation.\n\n(6) The modifications made to the HTS by Annex III to this proclamation shall enter into effect on the date that the United States Trade Representative announces in a notice published in the Federal Register that Australia has completed its applicable domestic procedures to give effect to the agreement to change the USAFTA rules of origin for certain yarns of viscose rayon fiber and shall be effective with respect to originating goods of Australia entered, or withdrawn from warehouse for consumption, on or after the date indicated in the notice.\n\n(7) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency.\n\nIn Witness Whereof, I have hereunto set my hand this thirty-first day of December, in the year of our Lord two thousand eight, and of the Independence of the United States of America the two hundred and thirty-third.\n\nGEORGE W. BUSH","L1":"Dear Mr. Speaker: (Dear Mr. President:)\n\nI hereby report to the Congress on the developments since my report of October 21, 1996, concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c).\n\n1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the Annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in
