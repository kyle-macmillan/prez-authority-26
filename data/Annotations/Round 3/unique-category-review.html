s to join me in celebrating the vital contributions of farmers and ranchers to our Nation and in reflecting upon the importance of farm safety and health in communities across America."},"P8":{"1":"Now, Therefore, I, George Bush, President of the United States of America, do hereby proclaim October 15, 1991, as White Cane Safety Day. I encourage all Americans to observe this day with appropriate programs and activities, in recognition of the achievements of those individuals who use the white cane."},"P9":{"1":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim April 21 through April 27, 2024, as National Crime Victims' Rights Week.","2":"I call upon all Americans to observe this week by participating in events that raise awareness of victims' rights and services and by volunteering to serve and support victims in their time of need."},"P10":{"1":"Whereas, I find that the withdrawal for an indefinite period of the duty concession granted in the said General Agreement with respect to the said toweling, to permit the application to such products of the original rate of duty imposed thereon under paragraph 1010 of the Tariff Act of 1930, is necessary to remedy the serious injury to the said domestic industry; and 7. Whereas upon the withdrawal of the said concession the rate of duty which will apply to the said toweling will be 40 per centum ad valorem:","2":"Now, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under the authority vested in me by section 350 of the Tariff Act of 1930, as amended, and section 7 (c) of the Trade Agreements Extension Act of 1951, and in accordance with the provisions of Article XIX of the said General Agreement, do proclaim that, effective after the close of business July 25, 1956, and until otherwise proclaimed by the President, the duty concession granted in the said General Agreement with respect to toweling (i.e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in item 1010 in Part I of Schedule XX (original) of the said General Agreement, shall be withdrawn, and Proclamation No. 2761A of December 16, 1947, shall be suspended insofar as it applies to the said toweling described in the said item 1010."},"P11":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, do hereby proclaim the month of January 1985 as National Cerebral Palsy Month.","2":"I call upon all government agencies, health organizations, communications media, and the people of the United States to observe this month with appropriate ceremonies and activities."},"P12":{"1":"Section 405 (c) of the Act provides that a bilateral commercial agreement and a proclamation implementing such agreement shall take effect only if approved by the Congress; Now, Therefore, I, Jimmy Carter, President of the United States of America, proclaim as follows: (1) This Proclamation shall become effective, said Agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Hungarian People's Republic in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XI of the said Agreement; and"},"P14":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim June 2005 as Black Music Month. I encourage all Americans to learn more about the history of black music and to enjoy the great contributions of African-American musicians."},"P15":{"1":"Now, Therefore, I, Richard M. Nixon, President of the United States of America, in accordance with the wish of the Congress as expressed in Section 6103 of Title 5 of the United States Code, do hereby proclaim Thursday, November 22, 1973, as a day of national thanksgiving, and concurrently, a day of prayer for the memory of John F. Kennedy. Let all Americans unite on this day, giving thanks for the manifold blessings vouchsafed our people, and inviting all of those less fortunate than ourselves to share in those blessings in God’s name, for His sake, and for our own."},"P16":{"1":"Now, Therefore, I, William J. Clinton, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim the week of September 18–24, 1994,","2":"as \"National Farm Safety and Health Week.\" I call upon the agencies, organizations, and businesses that serve America's agricultural workers to strengthen their commitment to promoting farm safety and health programs.","3":"I further call upon all citizens of our great Nation to reflect on the importance of our agricultural heritage and to make the health and safety of our farmers, ranchers, and farm workers among our utmost national priorities."},"P17":{"1":"I designated certain articles, identified by specific TSUS item numbers, to receive advanced staging of reductions in the rates of duty applicable to such items. 3. Section 3 of the Act to Approve and Implement the Protocol to the Trade Agreement relating to Customs Valuation, and for Other Purposes (Public Law 96490 of December 2, 1980) made a number of technical amendments to schedule 4 of the TSUS and authorized the President to proclaim the effective date for certain of those amendments. 4. In order to continue the previously proclaimed staged reductions and the provisions for advanced staging established","2":"pursuant to sections 503(a) (1) and 503 (a) (2) (A) of the Trade Agreements Act of 1979 for those products affected by the technical amendments made by P.L. 96490, it is necessary to make certain conforming modifications to the TSUS.","3":"Now, Therefore, I, Jimmy Carter, President of the United States of America, acting under the authority vested in me by the Constitution and the statutes, including but not limited to Section 604 of the Trade Act of 1974, Titles II and V of the Trade Agreements Act of 1979, and Section 3(b) of P.L. 96-490, do proclaim that: (1) The amendments to the TSUS set forth in section 3(b) of P.L. 96-490 shall be effective on the date of this Proclamation and shall be effective as to articles exported to the United States on or after the date of this Proclamation; (2) Schedule 4, part 1C of the TSUS is modified by deleting items 411.40 (as amended by P.L. 96-490) and 411.42 and by substituting the following in lieu thereof: \"Papaverine and its salts: 411.40 Products provided for in the Chemical Appendix to the Tariff Schedules 26.9% ad val. 11.6% ad val. 7?¢ per lb. + 104% ad cal. 411.42 Other 11.6% ad val. 7?¢ per lb.+ 104% ad cal.\"; (3) The rates of duty established for products of least developed developing countries (LDDC's) by Proclamation No. 4768 for item numbers 404.32, 406.36, and 408.24 of the TSUS shall be the rates inserted in the column entitled \"LDDC\" for items 403.74, 406.73, and 408.31, respectively, as added by section 3(a) of P.L. 96-490; (4) The rates of duty, including rates in the column entitled \"LDDC\", and the staged reductions in those rates, established by Proclamation No. 4768 for item numbers 403.76, 408.32, 411.40, and 411.42, shall continue to apply to such item numbers, whether the provisions of the TSUS referred to by these item numbers were amended by P.L. 96-490 or modified by this Proclamation; (5) The amendments made by paragraphs 2, 3, and 4 of this Proclamation shall be effective on the date of this Proclamation and shall be effective with respect to articles exported on or after the date of this Proclamation."},"P18":{"1":"Now, Therefore, I, Gerald R. Ford, President of the United States of America, do hereby proclaim that all the authority conferred by Executive Order No. 9066 terminated upon the issuance of Proclamation No. 2714, which formally proclaimed the cessation of the hostilities of World War II on December 31, 1946.","2":"I call upon the American people to affirm with me this American Promise-that we have learned from the tragedy of that long-ago experience forever to treasure liberty and justice for each individual American, and resolve that this kind of action shall never again be repeated."},"P19":{"1":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim May 5, 2022, as a National Day of Prayer.","2":"I call upon the citizens of our Nation to give thanks, in accordance with their own faiths and consciences, for our many freedoms and blessings, and I invite all people of faith to join me in asking for God's continued guidance, mercy, and protection."},"P20":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim November 18 through November 24, 2005, as National Farm-City Week. I encourage all Americans to join in recognizing the great accomplishments of our farmers and ranchers and the entrepreneurship and ingenuity of countless others who produce America's agricultural goods."},"P21":{"1":"On the basis of the Secretary's report, and other information available to me, I hereby find and determine, in accordance with Sections 201(b) and 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6261 (b), 6202(8)), the existence of a national energy supply shortage constituting a severe energy supply interruption, which: (A) is of significant scope and duration and of an emergency nature; (B) may cause major adverse impact on national safety or the national economy; and (C) has resulted from an interruption in the supply of imported petroleum products. I further find that implementation of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2, is required by the severe energy supply interruption. This Plan was transmitted by me to the Congress on March 1, 1979, and approved by a resolution of each House (S. Res. 122, 125 Cong. Rec. S 5135 (May 2, 1979); H. Res. 209, 125 Cong. Rec. H 3018 May 10, 1979)), which resolutions have been transmitted to me by the Secretary of the Senate and the Clerk of the House. Those resolutions were received by me on May 4 and May 15, 1979, respectively.","2":"Now, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Constitution and laws of the United States, including Section 201(b) of the Energy Policy and Conservation Act (42 U.S.C. 6261(b) ), do hereby proclaim that: SECTION 1. A severe energy supply interruption, as defined in Section 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)) currently exists with respect to the supply of imported crude oil and petroleum products. SEC. 2. This finding shall be immediately transmitted to the Congress. SEC. 3. The provisions of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2 (44 FR 12911 of March 8, 1979), shall become effective as of July 16, 1979. SEC. 4.","3":"In accordance with the provisions of the Plan, the Secretary of Energy is hereby authorized to issue regulations for the purpose of implementing the Energy Conservation Contingency Plan No. 2 and to administer the program in all respects."},"P22":{"1":"Now, Therefore, I, Gerald R. Ford, President of the United States of America, do hereby proclaim December 10, 1975, as Human Rights Day and December 15, 1975, as Bill of Rights Day.","2":"I call upon the American people to observe the week beginning December 10, 1975, as Human Rights Week. Further, I urge all Americans during the coming bicentennial year to contemplate the principles of liberty and justice enunciated in the Bill of Rights and the Universal Declaration of Human Rights and to draw on them as the best means to assure our Nation's continued progress."},"P23":{"1":"Now, Therefore, I, William J. Clinton, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim March 1998 as Irish-American Heritage Month.","2":"I call upon all the people of the United States to observe this month with appropriate ceremonies, programs, and activities."},"P24":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim January 2015 as National Mentoring Month.","2":"I call upon public officials, business and community leaders, educators, and Americans across the country to observe this month with appropriate ceremonies, activities, and programs."},"P25":{"1":"Now, Therefore, I, William J. Clinton, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim the month of April 1995 as \"National Child Abuse Prevention Month.\"","2":"I call upon all Americans during this month and throughout the year to help keep our children safe from harm."},"P26":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, do hereby proclaim the week of September 18 through September 24, 1988, as National Farm Safety Week. I urge all who live and work on farms or ranches to take necessary precautions for safety and health, both on the job and off, both at home and on the roads. I also urge all who serve and supply agricultural producers to support community safety and health efforts in every way. I encourage all Americans to take part in appropriate events and activities in observance of National Farm Safety Week and to note all that Americans in agriculture achieve for our Nation."},"P27":{"1":"Whereas, by Public Resolution 82, 75th Congress, approved March 28, 1938 (52 Stat. 148), the President is authorized and requested to issue annually a proclamation setting apart the month of April of each year as Cancer Control Month:","2":"Now, Therefore, I, Harry S. Truman, President of the United States of America, do hereby proclaim the month of April 1952 as Cancer Control Month; and I invite the Governors of the States, Territories, and possessions of the United States to issue similar proclamations. I also urge the medical profession, the press, the radio, television, and motion-picture industries, and all interested agencies and individuals to unite during April 1952 in public dedication to a program for the control of cancer."},"P28":{"1":"I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel, to provide through the close of December 31, 2008, access into the United States customs territory for specified quantities of certain agricultural products of Israel free of duty or certain fees or other import charges. 5. Section 604 of the Trade Act of 1974 (19 U.S.C. 2483) (the \"Trade Act\") authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTS) the substance of the relevant provisions of that act, and of other acts affecting import treatment, and actions thereunder, including removal, modification, continuance, or imposition of any rate of duty or other import restriction.","2":"Now, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States, including section 4 of the FTA Act and section 604 of the Trade Act, do hereby proclaim: (1) In order to implement aspects of the 2004 Agreement with the Government of Israel, concerning certain aspects of trade in agricultural products, the HTS is modified as provided in the Annex to this proclamation. (2) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency. (3) The modifications to the HTS made by the Annex to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2004, and the tariff treatment set forth therein shall be effective as provided in such Annex through December 31, 2008."},"P29":{"1":"I call upon the people of the United States to observe this week with appropriate ceremonies and activities."},"P30":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, do hereby proclaim the week of July 1 through July 8, 1984, as National Duck Stamp Week and 1984 as the Golden Anniversary Year of the Duck Stamp. I urge all Americans to observe these occasions with appropriate ceremonies and events, including participating in this program."},"P31":{"1":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim January 2022 as National Stalking Awareness Month. I call on all Americans to speak out against stalking and to support the efforts of advocates, courts, service providers, and law enforcement to help those who are targeted and send the message to perpetrators that this crime will not go unpunished."},"P32":{"1":"Now, Therefore, I, Donald J. Trump, President of the United States of America, do hereby proclaim December 7, 2017, as National Pearl Harbor Remembrance Day. I encourage all Americans to observe this solemn day of remembrance and to honor our military, past and present, with appropriate ceremonies and activities. I urge all Federal agencies and interested organizations, groups, and individuals to fly the flag of the United States at half-staff in honor of those American patriots who died as a result of their service at Pearl Harbor."},"P33":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, do hereby proclaim the week of October 12 through October 18, 2008, as National School Lunch Week.","2":"I call upon all Americans to join the dedicated individuals who administer the National School Lunch Program in appropriate activities that support the health and well-being of our Nation's children."},"P34":{"1":"It is appropriate that we again call upon Divine Providence for guidance and protection in our quest of space and those endless horizons in all the centuries to come. As we once set about to conquer the wilderness and settle our continent, now we set out upon a journey into the unknown of our universe. Wherever we teach, we will have come in peace for all mankind.","2":"Now, Therefore, I, Gerald R. Ford, President of the United States of America, do hereby proclaim Tuesday, July 20, 1976, as Space Exploration Day. I urge all Americans, and interested groups and organizations to observe this day with appropriate ceremonies and activities."},"P35":{"1":"I find that the modifications hereinafter proclaimed of the rates of duty applicable to items 155.20 and 155.30 of the TSUS give due consideration to the interests in the United States sugar market of domestic producers and materially affected contracting parties to the General Agreement on Tariffs and Trade.","2":"Now, Therefore, I, Ronald Reagan, President of the United States of America, by authority vested in me by the Constitution and Statutes of the United States, including section 201 of the Trade Expansion Act of 1962, and pursuant to General Headnote 4 and Headnote 2 of Subpart A, Part 10, Schedule 1 of the TSUS, do hereby proclaim until otherwise superseded: A. The rates of duty in rate columns 1 and 2 for items 155.20 and 155.30 of Subpart A, Part 10, Schedule 1 of the TSUS are modified and the following rates are established: Rates of duty 1 2 155.20 0.6625¢ per lb. less 0.009375¢ per lb. for 1.9875¢ per lb. less 0.028125¢ per lb. for each degree under 100 degrees (and frac- each degree under 100 degrees (and fractions of a degree in proportion) but not less tions of a degree in proportion) but not less than 0.428125¢ per lb. than 1.284375¢ per lb. 155.30 Dutiable on total sugar at the rate per lb. Dutiable on total sugars at the rate per lb. applicable under item 155.20 to sugar test- applicable under Item 155.20 to sugar test- ing 100 degrees. ing 100 degrees. B. The provisions of this Proclamation shall apply to articles entered, or withdrawn from warehouse, for consumption on and after the date of this Proclamation."},"P36":{"1":"Now, Therefore, I, William J. Clinton, President of the United States of America, do hereby proclaim October 9, 2000, as Columbus Day.","2":"I call upon the people of the United States to observe this day with appropriate ceremonies and activities.","3":"I also direct that the flag of the United States be displayed on all public buildings on the appointed day in honor of Christopher Columbus."},"P37":{"1":"I also designated cartels as Foreign Terrorist Organizations and Specially Designated Global Terrorists to end their campaign of violence and bloodshed. In my first legislative action as President, I signed into law the Laken Riley Act, which requires U.S. Immigration and Customs Enforcement to detain illegal aliens convicted of burglary, theft, larceny, or shoplifting. I have also initiated the largest deportation operation in the history of our country—including the deportation of hundreds of illegal alien gang members to El Salvador. As President, I am bringing back security on our border, safety on our streets, and law and order in our communities. Under my leadership, human trafficking is being brought to a rapid end, and justice is being swiftly served.","2":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim April 2025 as National Sexual Assault Awareness and Prevention Month. I urge all Americans, families, law enforcement personnel, healthcare providers, and community and faith-based organizations to support survivors of sexual assault and work together to prevent these crimes in their communities."},"P38":{"1":"Now, Therefore, I, Joseph R. Biden Jr., President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim November 2021 as National Veterans and Military Families Month.","2":"I call upon the people of the United States to honor veterans and military families with appropriate ceremonies and activities."},"P39":{"1":"Now, Therefore, I, Barack Obama, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim September 14 through September 20, 2015, as National Hispanic-Serving Institutions Week. I call on public officials, educators, and all the people of the United States to observe this week with appropriate programs, ceremonies, and activities that acknowledge the many ways these institutions and their graduates contribute to our country."},"P40":{"1":"Now, Therefore, I, George W. Bush, President of the United States of America, do hereby proclaim December 7, 2006, as National Pearl Harbor Remembrance Day. I encourage all Americans to observe this solemn occasion with appropriate ceremonies and activities. I urge all Federal agencies, interested organizations, groups, and individuals to fly the flag of the United States at half-staff this December 7 in honor of those who died as a result of their service at Pearl Harbor."},"P41":{"1":"Whereas by Proclamation 2867 of December 22, 1949 (14 F.R. 7723), I proclaimed such modifications of existing duties and the other import restrictions of the United States of America and such continuance of existing customs or excise treatment of articles imported into the United States of America as were then found to be required or appropriate to carry out the said trade agreement for accession on and after January 1, 1950; 3. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by the acts specified in the first recital of this proclamation except the Trade Agreements Extension Act of 1949, the period for the exercise of the authority under the said section 350 having been extended by section 1 of the said act of July 5, 1945 (ch. 269, 59 Stat. 410), until the expiration of three years from June 12, 1945, on October 30, 1947, I entered into an exclusive trade agreement with the Government of the Republic of Cuba (Treaties and Other International Acts Series 1703), which exclusive trade agreement includes certain portions of other documents made a part thereof and provides for the customs treatment in respect of ordinary customs duties of products of the Republic of Cuba imported into the United States of America; 4.","2":"Whereas by Proclamation No. 2764 of January 1, 1948 (3 CFR, 1948 Supp., p. 11), I proclaimed such modifications of existing duties and other import restrictions of the United States of America in respect of products of the Republic of Cuba and such continuance of existing customs and excise treatment of products of the Republic of Cuba imported into the United States of America as were then found to be required or appropriate to carry out the said exclusive trade agreement on and after January 1, 1948, which proclamation has been supplemented by the said proclamation of December 22, 1949, and by the supplemental proclamations referred to in the fourth recital of the said proclamation of December 22, 1949; 5. Whereas, the trade agreement for accession specified in the first recital of this proclamation has been signed by the Government of the Kingdom of Greece under such circumstances that it will enter into force for such Government, and such Government will become a contracting party to the said general agreement, on march 9, 1950; 6.","3":"Whereas I determine that the application of each of the concessions provided for in Part I of Schedule XX in Annex A of the said trade agreement for accession which were withheld from application in accordance with paragraph 4 of the said trade agreement for accession by the said proclamation of December 22, 1949, as are identified in the following list is required or appropriate to carry out, on and after March 9, 1950, the said trade agreement for accession: Item (paragraph) Rates of duty 10 5% ad val. 38 3 ¾% ad val. 53 3 ¼ per lb. 328 [first] 12 ½ % ad val. 601 20 per lb. 740 3 per lb. 742 1 per lb. 744 All rates 781 12 ½ % ad val. 1519 (b) Both rates 1545 12 ½% ad val. 1672 Free 1686 Free 1732 Free [identified as to olive oil only]; 7.","4":"Whereas I determine that, in view of the determination set forth in the sixth recital of this proclamation, the deletion of Item 328 from the list set forth in the ninth recital of the said proclamation of January 1, 1948, as amended and rectified, is required or appropriate to carry out, on and after March 9, 1950, the said exclusive trade agreement specified in the third recital of this proclamation:","5":"To the end that the said trade agreement for accession specified in the first recital of this proclamation may be carried out, the identification of each of the concessions provided for in Part I of the said Schedule XX in Annex A which is included in the sixth recital of this proclamation shall, on and after March 9, 1950, be included in the list set forth in the ninth recital of the said proclamation of December 22, 1949. PART II","6":"To the end that the said exclusive trade agreement specified in the third recital of this proclamation may be carried out, the list set forth in the ninth recital of the said proclamation of January 1 1948, as amended and rectified, shall, on and after March 9, 1950, be further amended by deleting therefrom the Item 328 referred to in the seventh recital of this proclamation."},"P42":{"1":"do hereby proclaim November 2014 as National Native American Heritage Month.","2":"I call upon all Americans to commemorate this month with appropriate programs and activities, and to celebrate November 28, 2014, as Native American Heritage Day."},"P43":{"1":"Now, Therefore, I, John F. Kennedy, President of the United States of America and Honorary Chairman of the American National Red Cross, do hereby designate March 1962 as Red Cross Month; and I urge all Americans to donor the Red Cross during that month by supporting it as a channel of humanitarian assistance for their neighbors in need."},"P44":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, do hereby proclaim May 7 through May 13, 1984, as National Photo Week,","2":"and I call upon the American people to engage in appropriate observances to reflect our appreciation and understanding of the value of photography to the Nation."},"P45":{"1":"Now, Therefore, I, Lyndon B. Johnson, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, including Chapter 15 of Title 10 of the United States Code, do command all persons engaged in such acts of violence to cease and desist therefrom and to disperse and retire peaceably forthwith."},"P46":{"1":"As a mark of respect for Walter Mondale and his life of service to our Nation, I hereby order, by the authority vested in me by the Constitution and laws of the United States of America, including section 7 of title 4, United States Code, that the flag of the United States shall be flown at half-staff at the White House and on all public buildings and grounds, at all military posts and naval stations, and on all naval vessels of the Federal Government in the District of Columbia and throughout the United States and its Territories and possessions until sunset, on the day of interment.","2":"I also direct that the flag shall be flown at half-staff for the same period at all United States embassies, legations, consular offices, and other facilities abroad, including all military facilities and naval vessels and stations."},"P47":{"1":"In light of the political and economic crisis in Zaire, I have determined that it is in the interests of the United States to restrict the entrance into the United States as immigrants and nonimmigrants of certain Zairian nationals who formulate or implement policies that impede Zaire's transition to democracy or who benefit from such policies, and the immediate families of such persons.","2":"Now, Therefore, I, William J. Clinton, by the power vested in me as President by the Constitution and laws of the United States of America, including section 212 (f) of the Immigration and Nationality Act of 1952, as amended (8 U.S.C. 1182(f)), and section 301 of title 3, United States Code, hereby find that the unrestricted immigrant and nonimmigrant entry into the United States of persons described in section 1 of this proclamation would, except as provided for in section 2 or 3 of this proclamation, be detrimental to the interests of the United States. 1, therefore,","3":"The entry into the United States as immigrants and nonimmigrants of persons who formulate, implement, or benefit from policies that impede Zaire's transition to democracy, and the immediate family members of such persons, is hereby suspended. Sec. 2. Section 1 shall not apply with respect to any person otherwise covered by section 1 where entry of such person would not be contrary to the interests of the United States. Sec. 3. Persons covered by sections 1 and 2 shall be identified pursuant to procedures established by the Secretary of State, as authorized in section 6 below. Sec. 4. Nothing in this proclamation shall be construed to derogate from United States Government obligations under applicable international agreements. Sec.5. This proclamation is effective immediately and shall remain in effect until of State determines that it is no longer necessary and should be terminated. Sec. 6. The Secretary of State shall have responsibility to implement this proclamation pursuant to procedures the Secretary may establish."},"P48":{"1":"Now, Therefore, I, Ronald Reagan, President of the United States of America, do hereby proclaim the month of May 1987 as National Cancer Institute Month. I urge health professionals, the media, civic organizations, and all other interested people and groups to unite during this time in public recognition of the contributions of the National Cancer Institute to our commitment to control cancer."},"P49":{"1":"In Proclamation 7826 of October 4, 2004, consistent with the 2004 Agreement, I proclaimed modifications to the Harmonized Tariff Schedule of the United States (HTS) to provide duty-free access into the United States through December 31, 2008, for specified quantities of certain agricultural products of Israel. 5. On December 10, 2008, the United States entered into an agreement with Israel to extend the period that the 2004 Agreement is in force through December 31, 2009, to allow additional time for the two governments to conclude an agreement to replace the 2004 Agreement. 6. Pursuant to section 4(b) of the USIFTA Act,","2":"I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, to provide duty-free access into the United States through the close of December 31, 2009, for specified quantities of certain agricultural products of Israel. 7. On June 6, 2003, the United States and Chile entered into the United States-Chile Free Trade Agreement (USCFTA). The Congress approved the USCFTA in section 101(a) of the United States-Chile Free Trade Agreement Implementation Act (the \"USCFTA Act\") (19 U.S.C. 3805 note).","3":"In Proclamation 7746 of December 30, 2003, I proclaimed the tariff treatment called for under the USCFTA. 8. Section 201(b) of the USCFTA Act authorizes the President, subject to the consultation and layover requirements of section 103(a) of the USCFTA Act, to proclaim such modifications to the staging of duty treatment set forth in Annex 3.3 of the USCFTA as the United States may agree to with Chile, as the President determines to be necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA. 9. On November 26, 2008, the United States entered into an agreement with Chile that includes an accelerated schedule of duty elimination under the USCFTA for specific originating goods of Chile. The consultation and layover requirements of section 103(a) of the USCFTA Act with respect to the accelerated schedule of duty elimination were satisfied as of November 8, 2008. 10. Pursuant to section 201(b) of the USCFTA Act,","4":"I have determined that modifications hereinafter proclaimed of rates of duties on originating goods of Chile are necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA and to carry out the agreement with Chile on an accelerated schedule of duty elimination for specific originating goods of Chile. 11. On May 18, 2004, the United States and Australia entered into the United States-Australia Free Trade Agreement (USAFTA). The Congress approved the USAFTA in section 101(a) of the United States-Australia Free Trade Agreement Implementation Act (the \"USAFTA Act\") (19 U.S.C. 3805 note).","5":"In Proclamation 7857 of December 20, 2004, I proclaimed the rules of origin called for under the USAFTA. 12. Section 203(o) of the USAFTA Act authorizes the President, subject to the consultation and layover requirements of section 104 of the USAFTA Act, to proclaim such modifications to the rules of origin as are necessary to implement an agreement with Australia pursuant to article 4.2.5 of the USAFTA. 13. On October 10, 2008, the United States entered into an agreement with Australia pursuant to article 4.2.5 of the USAFTA to amend the USAFTA rule of origin for certain yarns of viscose rayon fiber. The consultation and layover requirements of section 104 of the USAFTA Act with respect to the proposed modification of the USAFTA rules of origin were satisfied as of December 24, 2008. 14. Section 604 of the Trade Act of 1974, as amended (the \"1974 Act\") (19 U.S.C. 2483), authorizes the President to embody in the HTS the substance of relevant provisions of that Act, or other acts affecting import treatment, and of actions taken thereunder.","6":"Now, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States of America, including section 4 of the USIFTA Act, section 201(b) of the USCFTA Act, section 203(o) of the USAFTA Act, section 604 of the 1974 Act, and section 301 of title 3, United States Code, do proclaim that: (1) In order to implement U.S. tariff commitments under the 2004 Agreement through December 31, 2009, the HTS is modified as provided in Annex I to this proclamation. (2)(a) The modifications to the HTS made by Annex I to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2009. (b) The provisions of subchapter VIII of chapter 99 of the HTS, as modified by Annex I to this proclamation, shall continue in effect through December 31, 2009. (3) In order to provide for an accelerated schedule of duty elimination for specific originating goods of Chile, the tariff treatment set forth in the HTS is modified as provided in Annex II to this proclamation. (4) The modifications made to the HTS by Annex II to this proclamation shall be effective with respect to goods entered, or withdrawn from warehouse for consumption, on or after January 1, 2009. (5) In order to implement the agreement with Australia to change the USAFTA rules of origin for certain yarns of viscose rayon fiber, the HTS is modified as provided in Annex III to this proclamation. (6) The modifications made to the HTS by Annex III to this proclamation shall enter into effect on the date that the United States Trade Representative announces in a notice published in the Federal Register that Australia has completed its applicable domestic procedures to give effect to the agreement to change the USAFTA rules of origin for certain yarns of viscose rayon fiber and shall be effective with respect to originating goods of Australia entered, or withdrawn from warehouse for consumption, on or after the date indicated in the notice. (7) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency."},"P50":{"1":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim Sunday, September 28, 2025, as Gold Star Mother's and Family's Day.","2":"I call upon all Government officials to display the flag of the United States over Government buildings, and I encourage the American people to display the flag and hold appropriate ceremonies as an expression of our Nation's gratitude and respect."}},"valueLabels":{"0":"0 – Outside scope","1":"1 – Discretionary / internal","2":"2 – Dictated agency outcome","3":"3 – Self-executing","4":"4 – Unclear / mixed"}}</script>
<script>(function(){'use strict';
var P=JSON.parse(document.getElementById('payload').textContent),active=0,key='round3-minority-subdirective-review-v1',groundTruthKey='round3-ground-truth-review-v1',answers={},groundTruthAnswers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}try{groundTruthAnswers=JSON.parse(localStorage.getItem(groundTruthKey)||'{}')}catch(e){}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function unitKey(g,u){return g.annotatorIndex+'|'+u.docId+'|'+u.chunkNumber}function gtKey(u){return u.docId+'|'+u.chunkNumber}function gtCode(u){return(groundTruthAnswers[gtKey(u)]||{}).code||u.groundTruthCode||''}function label(code){return P.valueLabels[code]||code}

function options(selected,allowBlank){var out=allowBlank?'<option value="">— choose category —</option>':'';Object.keys(P.valueLabels).forEach(function(code){out+='<option value="'+code+'"'+(selected===code?' selected':'')+'>'+esc(label(code))+'</option>'});return out}
function card(g,u){var m=P.metadata[u.docId]||{},k=unitKey(g,u),chosen=(answers[k]||{}).reviewedCode||'',minority=g.groundTruth?u.minorityIndex:g.annotatorIndex;var votes=u.codes.map(function(code,i){return'<div class="vote '+(u.allThree?'':i===minority?'minority':'majority')+'"><span>'+esc(P.annotators[i])+'</span><span>'+esc(label(code))+'</span></div>'}).join(''),outcome=u.allThree?'Three-way disagreement · provisional code from notes':esc(u.reviewedBy)+' · '+(u.groundTruthCode===u.majorityCode?'Changed to majority':'Kept original'),gtEdit=groundTruthAnswers[gtKey(u)],gtStatus=(gtEdit?'Saved locally · ':'')+outcome,gtDecision=!u.allThree&&u.groundTruthCode===u.majorityCode?'<div class="vote majority">'+esc(label(u.groundTruthCode))+'</div>':'<select data-ground-truth-key="'+esc(gtKey(u))+'">'+options(gtCode(u),!u.groundTruthCode)+'</select>',decision=g.groundTruth?'<label>Ground truth category</label>'+gtDecision+'<div class="saved">'+gtStatus+'</div>':'<label for="decision-'+esc(k)+'">Your reviewed category</label><select id="decision-'+esc(k)+'" data-key="'+esc(k)+'">'+options(chosen,true)+'</select><div class="saved">'+(chosen?'Saved':'')+'</div>';return'<article class="card"><div class="heading"><span class="unit">'+esc(u.docId)+' · Sub-directive '+esc(u.chunkNumber)+'</span><span class="meta">'+esc(m.president||'')+' · '+esc(m.date||'')+' · '+esc((m.type||'').replace(/_/g,' '))+'</span></div><div class="body"><div><div class="chunk">'+esc((P.chunks[u.docId]||{})[u.chunkNumber]||'')+'</div><details class="context"><summary>Show full directive context</summary><div class="full">'+esc(P.docTexts[u.docId]||'')+'</div></details></div><div><div class="votes">'+votes+'</div>'+decision+'</div></div></article>'}
function updateProgress(){var g=P.groups[active];if(g.groundTruth){var three=g.units.filter(function(u){return u.allThree}).length;document.getElementById('progress').textContent=(g.units.length-three)+' reviewed + '+three+' three-way';return}var done=g.units.filter(function(u){return(answers[unitKey(g,u)]||{}).reviewedCode}).length;document.getElementById('progress').textContent=done+' of '+g.units.length+' reviewed'}
function render(){var g=P.groups[active];renderTabs();document.getElementById('export').textContent=g.groundTruth?'Export ground truth':'Export this annotator’s review';document.getElementById('content').innerHTML=g.units.length?g.units.map(function(u){return card(g,u)}).join(''):'<div class="empty">No minority sub-directives for this annotator.</div>';updateProgress()}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(b){active=+b.dataset.i;render()}});document.getElementById('content').addEventListener('change',function(e){var s=e.target;if(s.matches('select[data-ground-truth-key]')){var g=P.groups[active],u=g.units.find(function(unit){return gtKey(unit)===s.dataset.groundTruthKey});if(!s.value||s.value===u.groundTruthCode)delete groundTruthAnswers[gtKey(u)];else groundTruthAnswers[gtKey(u)]={code:s.value,editedAt:new Date().toISOString()};localStorage.setItem(groundTruthKey,JSON.stringify(groundTruthAnswers));s.nextElementSibling.textContent=(groundTruthAnswers[gtKey(u)]?'Saved locally · ':'')+(u.allThree?'Three-way disagreement · provisional code from notes':u.reviewedBy+' · Kept original');return}if(!s.matches('select[data-key]'))return;if(s.value)answers[s.dataset.key]={reviewedCode:s.value,reviewedAt:new Date().toISOString()};else delete answers[s.dataset.key];localStorage.setItem(key,JSON.stringify(answers));s.nextElementSibling.textContent=s.value?'Saved':'';updateProgress()});
document.getElementById('export').addEventListener('click',function(){var g=P.groups[active],records,out,name;if(g.groundTruth){records=g.units.map(function(u){var edit=groundTruthAnswers[gtKey(u)]||{};return{round_id:u.docId,chunk_number:u.chunkNumber,disagreement_type:u.allThree?'all_three':'minority',reviewed_by:u.reviewedBy||null,original_code:u.originalCode||null,majority_code:u.majorityCode||null,reviewed_code:u.groundTruthCode||null,ground_truth_code:gtCode(u)||null,ground_truth_edited_at:edit.editedAt||null}});out={schema:'round3-ground-truth-review',schema_version:1,exported_at:new Date().toISOString(),records:records};name='round3-ground-truth-review.json'}else{records=g.units.map(function(u){var a=answers[unitKey(g,u)]||{};return{annotator:g.label,round_id:u.docId,chunk_number:u.chunkNumber,original_code:u.originalCode,majority_code:u.majorityCode,reviewed_code:a.reviewedCode||null,reviewed_at:a.reviewedAt||null}});out={schema:'round3-minority-subdirective-review',schema_version:1,exported_at:new Date().toISOString(),annotator:g.label,records:records};name='round3-minority-review-'+g.label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json'}var blob=new Blob([JSON.stringify(out,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)});render()})();</script></body></html>
