ared in Executive Order 13067 in Executive Order 13412 due to policies and actions of the Government of Sudan that violated human rights, in particular with respect to the conflict in Darfur, and the pervasive role played by the Government of Sudan in the petroleum and petrochemical industries in Sudan. Executive Order 13412 continues the blocking of the Government of Sudan, specifies new prohibitions relating to Sudan's petroleum industry, and exempts certain specified areas in Sudan from the trade prohibitions found in Executive Order 13067.\n\nWith the positive steps taken by the Government of Sudan over the last 6 months, and provided that these positive actions are sustained over the next 180 days, there will be no further need for sections 1 and 2 of Executive Order 13067 or for Executive Order 13412. The 180-day delay period of the order's effective date with respect to removing these provisions is intended to encourage the Government of Sudan to sustain its efforts in these areas. The order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, and based on a consideration of relevant and credible information from available sources, including nongovernmental organizations, on or before July 12, 2017, to provide a report to the President on the Government of Sudan's progress in sustaining the positive actions taken by the Government of Sudan that gave rise to the order, including carrying out the Government of Sudan's pledge to maintain a cessation of hostilities in conflict areas in Sudan; continuing improvement of humanitarian access throughout Sudan; and maintaining its cooperation with the United States on addressing regional conflicts and the threat of terrorism. As much of the report as possible shall be unclassified and made public. Provided that the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, publishes on or before July 12, 2017, a notice in the Federal Register stating that the Government of Sudan has sustained the positive actions that gave rise to the order and has provided to the President the report described above, the revocation of sections 1 and 2 of Executive Order 13067 and the revocation of Executive Order 13412 will become effective. The national emergency the President declared in Executive Order 13067 will remain in place, as will Executive Order 13400.\n\nThe order further directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President an updated version of the report described above annually thereafter and, concurrent with those reports, to publish in the Federal Register a notice stating whether the Government of Sudan has sustained the positive actions that gave rise to the order. As much of the annual reports as possible shall be unclassified and made public. In addition, to the extent an annual report concludes that the Government of Sudan has or has not sustained the positive actions that gave rise to the order, the order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President recommendations on appropriate U.S. Government responses.\n\nFor these reasons, I have determined that it is necessary to revoke sections 1 and 2 of Executive Order 13067 and to revoke Executive Order 13412 on July 12, 2017, provided that further action is taken by the Secretary of State, as set forth in the order. Consistent with this determination, I have waived in the order the application of section 908(a)(1) of the Trade Sanctions Reform and Export Enhancement Act of 2000 (22 U.S.C. 7201-7211) with respect to Sudan, and sections 6(a) and (b) of the Comprehensive Peace in Sudan Act of 2004, as amended (Public Law 108-497).\n\nI am enclosing a copy of the Executive Order I have issued. The order is effective on January 13, 2017, except for sections 1, 4, 5, 6, and 7 of the order, which are effective on July 12, 2017, provided that further action is taken by the Secretary of State as set forth in the order.\n\nSincerely,\n\nBARACK OBAMA","chunks":{"1":"Consistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b), I hereby report that I have issued an Executive Order (the \"order\") that revokes sections 1 and 2 of Executive Order 13067 of November 3, 1997, and revokes Executive Order 13412 of October 13, 2006, in its entirety. Both actions are effective 180 days from January 13, 2017, provided that certain further action is taken by the Secretary of State on or before that date.","2":"I have determined that the situation that gave rise to the actions taken in those orders related to the policies and actions of the Government of Sudan has been altered by Sudan's positive actions over the past 6 months. These actions include a marked reduction in offensive military activity, culminating in a pledge to maintain a cessation of hostilities in conflict areas in Sudan, and steps toward the improvement of humanitarian access throughout Sudan, as well as cooperation with the United States on addressing regional conflicts and the threat of terrorism. The President issued Executive Order 13067 to deal with the unusual and extraordinary threat to the national security and foreign policy of the United States posed by the actions and policies of the Government of Sudan, including support for international terrorism; efforts to destabilize neighboring governments; and the prevalence of human rights violations. Section 1 of Executive Order 13067 blocks the p ctions taken by the Government of Sudan that gave rise to the order, including carrying out the Government of Sudan's pledge to maintain a cessation of hostilities in conflict areas in Sudan; continuing improvement of humanitarian access throughout Sudan; and maintaining its cooperation with the United States on addressing regional conflicts and the threat of terrorism. As much of the report as possible shall be unclassified and made public. Provided that the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, publishes on or before July 12, 2017, a notice in the Federal Register stating that the Government of Sudan has sustained the positive actions that gave rise to the order and has provided to the President the report described above, the revocation of sections 1 and 2 of Executive Order 13067 and the revocation of Executive Order 13412 will become effective. The national emergency the President declared in Executive Order 13067 will remain in place, as will Executive Order 13400. The order further directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President an updated version of the report described above annually thereafter and, concurrent with those reports, to publish in the Federal Register a notice stating whether the Government of Sudan has sustained the positive actions that gave rise to the order. As much of the annual reports as possible shall be unclassified and made public. In addition, to the extent an annual report concludes that the Government of Sudan has or has not sustained the positive actions that gave rise to the order, the order directs the Secretary of State, in consultation with the Secretary of the Treasury, the Director of National Intelligence, and the Administrator of the U.S. Agency for International Development, to provide to the President recommendations on appropriate U.S. Government responses.","3":"For these reasons, I have determined that it is necessary to revoke sections 1 and 2 of Executive Order 13067 and to revoke Executive Order 13412 on July 12, 2017, provided that further action is taken by the Secretary of State, as set forth in the order. Consistent with this determination, I have waived in the order the application of section 908(a)(1) of the Trade Sanctions Reform and Export Enhancement Act of 2000 (22 U.S.C. 7201-7211) with respect to Sudan, and sections 6(a) and (b) of the Comprehensive Peace in Sudan Act of 2004, as amended (Public Law 108-497). I am enclosing a copy of the Executive Order I have issued. The order is effective on January 13, 2017, except for sections 1, 4, 5, 6, and 7 of the order, which are effective on July 12, 2017, provided that further action is taken by the Secretary of State as set forth in the order."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L12":{"metadata":{"president":"Ronald Reagan","date":"January 20, 1988","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nIn accordance with section 603 of the Goldwater-Nichols Department of Defense Reorganization Act of 1986 (P.L. 99-433; 50 U.S.C. 404a), I hereby transmit the second annual report on the National Security Strategy of the United States, 1988.\n\nSincerely,\n\nRONALD REAGAN","chunks":{"1":"In accordance with section 603 of the Goldwater-Nichols Department of Defense Reorganization Act of 1986 (P.L. 99-433; 50 U.S.C. 404a), I hereby transmit the second annual report on the National Security Strategy of the United States, 1988."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L13":{"metadata":{"president":"Barack Obama","date":"February 06, 2015","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nConsistent with section 108 of the National Security Act of 1947, as amended (50 U.S.C. 3043), I transmit herewith the National Security Strategy of the United States.\n\nSincerely,\n\nBARACK OBAMA","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L16":{"metadata":{"president":"Dwight D. Eisenhower","date":"September 22, 1959","type":"letter"},"text":"Dear Mr. Secretary:\n\nIn accordance with legislation signed into law earlier today, I am returning with my approval your proposal to increase the interest return on all United States Series E and H Savings Bonds.\n\nIn approving your recommendation, I take this opportunity to reaffirm my enthusiastic support of the Savings Bonds Program. This is one of our country's finest and most worthwhile activities. It contributes to the sound management of the Nation's finances. It gives millions of American families the opportunity to save safely and regularly--while investing in their Nation's future.\n\nTo my mind there is no better way of saving, no more effective way of strengthening our power for peace, than to own United States Savings Bonds. To buy these bonds is to express faith in America. It helps provide the economic strength in both our Government and in individual families on which our freedom depends. I hope that the making of both old and new Savings Bonds even more attractive will serve as a renewed invitation to every citizen to buy and hold these \"Shares in America.\"\n\nSincerely,\n\nDWIGHT D. EISENHOWER","chunks":{},"annotations":[{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L18":{"metadata":{"president":"George Bush","date":"January 10, 1992","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nPursuant to the provisions of subsection (b) of the Pelly Amendment to the Fishermen's Protective Act of 1967, as amended (22 U.S.C. 1978), I am reporting to you that the Secretary of Commerce has reported to me that the countries of Costa Rica, France, Italy, Japan, and Panama have been under an embargo since May 24, 1991. No yellowfin tuna or products derived from yellowfin tuna harvested in the eastern tropical Pacific Ocean (ETP) by purse seine vessels of Mexico, Venezuela, or Vanuatu may be imported into the United States from these nations.\n\nThe Secretary's letter to me is deemed to be a certification for the purposes of subsection (a) of the Pelly Amendment. Subsection (a) requires that I consider and, at my discretion, order the prohibition of imports into the United States of fish and fish products from Costa Rica, France, Italy, Japan, and Panama, to the extent that such prohibition is consistent with the General Agreement on Tariffs and Trade. Subsection (b) requires me to report to the Congress within 60 days following certification on the actions taken pursuant to the certification; if fish and wildlife imports have not been prohibited, the report must state the reasons for the lack of a prohibition.\n\nAfter thorough review, I have determined that, given that an embargo is currently in effect and given the negotiations towards an international dolphin conservation program in the ETP, sanctions will not be imposed against intermediary nations at this time. Costa Rica, France, Italy, Japan, and Panama will continue to be certified, and we will review their status as intermediary nations under the Marine Mammal Protection Act, if requested for 1992. I will make further reports to you as developments warrant.\n\nSincerely,\n\nGeorge Bush","chunks":{"1":"After thorough review, I have determined that, given that an embargo is currently in effect and given the negotiations towards an international dolphin conservation program in the ETP, sanctions will not be imposed against intermediary nations at this time. Costa Rica, France, Italy, Japan, and Panama will continue to be certified, and we will review their status as intermediary nations under the Marine Mammal Protection Act, if requested for 1992. I will make further reports to you as developments warrant."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L22":{"metadata":{"president":"Harry S Truman","date":"July 30, 1948","type":"letter"},"text":"THE WHITE HOUSE, Washington, D.C, July 30, 1948.\n\nThe Honorable the PRESIDENT OF THE SENATE, The Honorable the SPEAKER OF THE HOUSE OF REPRESENTATIVES.\n\nSIRS: I am presenting herewith a Midyear Economic Report to the Congress. This is supplementary to the Economic Report of the President of January 14, 1948, and is transmitted in accordance with section 3 (b) of the Employment Act of 1946.\n\nIn preparing this report I have had the advice and assistance of the Council of Economic Advisers, members of the Cabinet, and heads of independent agencies.\n\nTogether with this report, I am transmitting a report, The Economic Situation at Midyear 1948, prepared for me by the Council of Economic Advisers in accordance with section 4 (c) (2) of the Employment Act of 1946.\n\nRespectfully,\n\nHARRY S. TRUMAN","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L23":{"metadata":{"president":"William J. Clinton","date":"March 08, 1999","type":"letter"},"text":"Dear __________:\n\nIn accordance with Condition (5)(C) of the resolution of advice and consent to ratification of the Document Agreed Among the States Parties to the Treaty on Conventional Armed Forces in Europe (CFE) of November 19, 1990, adopted by the Senate of the United States on May 14, 1997, enclosed is the Report on CFE Compliance.\n\nThe Report is provided in both a classified and unclassified version.\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L24":{"metadata":{"president":"Donald J. Trump","date":"October 05, 2018","type":"letter"},"text":"Dear Mr. Chairman:\n\nIn accordance with section 303(a)(6)(A) of the Defense Production Act of 1950, as amended (the \"Act\") (50 U.S.C. 4533(a)(6)(A)), I transmit herewith notice of a shortfall in the defense industrial base relating to alane fuel cells and of actions to remedy that shortfall. The Department of Defense will take actions to develop and purchase equipment and materials needed for pilot production of alane fuel cells for military usage.\n\nI have also included my determination required pursuant to section 303(a)(5) of the Act. These proposed initiatives are essential to the national defense.\n\nSincerely,\n\nDONALD J. TRUMP","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L26":{"metadata":{"president":"George W. Bush","date":"October 29, 2002","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nAs required by section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c), I am providing herewith a 6-month periodic report prepared by my Administration on the national emergency with respect to Sudan that was declared in Executive Order 13067 of November 3, 1997.\n\nSincerely,\n\nGEORGE W. BUSH","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"L27":{"metadata":{"president":"William J. Clinton","date":"January 02, 1998","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nSection 202(d) of the National Emergencies Act (50 U.S.C. 1622(d)) provides for the automatic termination of a national emergency unless, prior to the anniversary date of its declaration, the President publishes in the Federal Register and transmits to the Congress a notice stating that the emergency is to continue in effect beyond the anniversary date. In accordance with this provision, I have sent the enclosed notice, stating that the Libyan emergency is to continue in effect beyond January 7, 1998, to the Federal Register for publication.\n\nThe crisis between the United States and Libya that led to the declaration of a national emergency on January 7, 1986, has not been resolved. The Government of Libya has continued its actions and policies in support of terrorism, despite the calls by the United Nations Security Council, in Resolutions 731 (1992), 748 (1992), and 883 (1993), that it demonstrate by concrete actions its renunciation of terrorism. Such Libyan actions and policies pose a continuing unusual and extraordinary threat to the national security and vital foreign policy interests of the United States. For these reasons, I have determined that it is necessary to maintain in force the broad authorities necessary to apply economic pressure to the Government of Libya to reduce its ability to support international terrorism.\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{"1":"For these reasons, I have determined that it is necessary to maintain in force the broad authorities necessary to apply economic pressure to the Government of Libya to reduce its ability to support international terrorism."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L31":{"metadata":{"president":"William J. Clinton","date":"October 31, 1994","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nSection 202(d) of the National Emergencies Act (50 U.S.C. 1622(d)) provides for the automatic termination of a national emergency unless, prior to the anniversary date of its declaration, the President publishes in the Federal Register and transmits to the Congress a notice stating that the emergency is to continue in effect beyond the anniversary date. In accordance with this provision, I have sent the enclosed notice, stating that the Iran emergency is to continue in effect beyond November 14, 1994, to the Federal Register for publication. Similar notices have been sent annually to the Congress and the Federal Register since November 12, 1980. The most recent notice appeared in the Federal Register on November 2, 1993.\n\nThe crisis between the United States and Iran that began in 1979 has not been fully resolved. The international tribunal established to adjudicate claims of the United States and U.S. nationals against Iran and of the Iranian government and Iranian nationals against the United States continues to function, and normalization of commercial and diplomatic relations between the United States and Iran has not been achieved. In these circumstances, I have determined that it is necessary to maintain in force the broad authorities that are needed in the process of implementing the January 1981 agreements with Iran and in the eventual normalization of relations with that country.\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{"1":"In these circumstances, I have determined that it is necessary to maintain in force the broad authorities that are needed in the process of implementing the January 1981 agreements with Iran and in the eventual normalization of relations with that country."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P10":{"metadata":{"president":"Dwight D. Eisenhower","date":"June 25, 1956","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. Whereas, under the authority vested in him by the Constitution and the statutes, including section 350 (a) of the Tariff Act of 1930, as amended, the President on October 30, 1947, entered into a trade agreement with certain foreign countries, which trade agreement consists of the General Agreement on Tariffs and Trade and the related Protocol of Provisional Application thereof, together with the Final Act Adopted at the Conclusion of the Second Session of the Preparatory Committee of the United Nations Conference on Trade and Employment (61 Stat. (Parts 5 and 6) A7, All, and A2050), and, by Proclamation No. 2761A of December 16, 1947 (61 Stat. 1103), proclaimed such modifications of existing duties and other import restrictions of the United States and such continuance of existing customs or excise treatment of articles imported into the United States as were then found to be required or appropriate to carry out the said trade agreement on and after January 1, 1948;\n\n2. Whereas item 1010 in Part I of Schedule XX (original) annexed to the said General Agreement (61 Stat. (Part 5) Al264) reads as follows:\n\n3. Whereas, in accordance with Article II of the said General Agreement and by virtue of the said Proclamation No. 2761A, the United States duty treatment of toweling (i. e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in the said item 1010 is the application to the said toweling of the rate of duty specified in the column designated \"Rate of Duty\" in the said item 1010, which treatment reflects the duty concessim granted in the said General Agreement with respect to the said toweling;\n\n4. Whereas the United States Tariff Commission has submitted to me its report of an investigation, including a hearing, under section 7 of the Trade Agreements Extension Act of 1951, as amended (65 Stat. 72; 67 Stat. 472; 69 Stat. 162), on the basis of which it has found that the said toweling is, as a result in part of the duty reflecting the concession granted thereon in the said General Agreement, being imported into the United States in such increased quantities, both actual and relative, as to cause serious injury to the domestic industry producing like or directly competitive products;\n\n5. Whereas the said Tariff Commission has further found that in order to remedy the serious injury to the said domestic industry it is necessary to restore the rate of duty originally imposed on the said toweling by paragraph 1010 of the Tariff Act of 1930, namely, 40 per centum ad valorem, and has accordingly recommended the withdrawal of the duty concession granted in the said General Agreement with respect to the said toweling;\n\n6. Whereas, I find that the withdrawal for an indefinite period of the duty concession granted in the said General Agreement with respect to the said toweling, to permit the application to such products of the original rate of duty imposed thereon under paragraph 1010 of the Tariff Act of 1930, is necessary to remedy the serious injury to the said domestic industry; and\n\n7. Whereas upon the withdrawal of the said concession the rate of duty which will apply to the said toweling will be 40 per centum ad valorem:\n\nNow, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under the authority vested in me by section 350 of the Tariff Act of 1930, as amended, and section 7 (c) of the Trade Agreements Extension Act of 1951, and in accordance with the provisions of Article XIX of the said General Agreement, do proclaim that, effective after the close of business July 25, 1956, and until otherwise proclaimed by the President, the duty concession granted in the said General Agreement with respect to toweling (i.e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in item 1010 in Part I of Schedule XX (original) of the said General Agreement, shall be withdrawn, and Proclamation No. 2761A of December 16, 1947, shall be suspended insofar as it applies to the said toweling described in the said item 1010.\n\nIn Witness Whereof, I have hereunto set my hand and caused the seal of the United States of America to be affixed.\n\nDONE at the City of Washington this 25th day of June in the year of our Lord nineteen hundred and fifty-six, and of the Independence of the United States of America the one hundred and eightieth.\n\nDWIGHT D. EISENHOWER\n\nBy the President:\n\nJOHN FOSTER DULLES,\n\nSecretary of State","chunks":{"1":"Whereas, I find that the withdrawal for an indefinite period of the duty concession granted in the said General Agreement with respect to the said toweling, to permit the application to such products of the original rate of duty imposed thereon under paragraph 1010 of the Tariff Act of 1930, is necessary to remedy the serious injury to the said domestic industry; and 7. Whereas upon the withdrawal of the said concession the rate of duty which will apply to the said toweling will be 40 per centum ad valorem:","2":"Now, Therefore, I, Dwight D. Eisenhower, President of the United States of America, acting under the authority vested in me by section 350 of the Tariff Act of 1930, as amended, and section 7 (c) of the Trade Agreements Extension Act of 1951, and in accordance with the provisions of Article XIX of the said General Agreement, do proclaim that, effective after the close of business July 25, 1956, and until otherwise proclaimed by the President, the duty concession granted in the said General Agreement with respect to toweling (i.e. fabrics chiefly used for making towels) of flax, hemp, or ramie, or of which these substances or any of them is the component material of chief value, described in item 1010 in Part I of Schedule XX (original) of the said General Agreement, shall be withdrawn, and Proclamation No. 2761A of December 16, 1947, shall be suspended insofar as it applies to the said toweling described in the said item 1010."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P12":{"metadata":{"president":"Jimmy Carter","date":"April 07, 1978","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nAs President of the United States of America, acting through my representatives, I entered into the negotiation of an agreement on trade relations between the United States of America and the Hungarian People's Republic with representatives of the Hungarian People's Republic;\n\nThe negotiations were conducted in accordance with the requirements of the Trade Act of 1974 (P.L. 93-618, January 3, 1975; 88 Stat. 1978) (\"the Act\");\n\nAn \"Agreement on Trade Relations between the United States of America and the Hungarian People's Republic,\" in English and Hungarian, was signed on March 17, 1978, by representatives of the two Governments, and is annexed to this Proclamation;\n\nThe Agreement conforms to the requirements relating to bilateral commercial agreements specified in Section 405 (b) of the Act;\n\nArticle XI of the Agreement provides that it shall enter into force on the date of exchange of written notices of acceptance by the Governments of the United States of America and the Hungarian People's Republic; and\n\nSection 405 (c) of the Act provides that a bilateral commercial agreement and a proclamation implementing such agreement shall take effect only if approved by the Congress;\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, proclaim as follows:\n\n(1) This Proclamation shall become effective, said Agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Hungarian People's Republic in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XI of the said Agreement; and\n\n(2) General Headnote 3(e) of the Tariff Schedules of the United States is amended by deleting therefrom \"Hungary\" as of the effective date of this proclamation and a notice thereof shall be published in the FEDERAL REGISTER promptly thereafter.\n\nIn Witness Whereof, I have signed this Proclamation this seventh day of April, in the year of our Lord one thousand nine hundred seventy-eight, and of the Independence of the United States of America the two hundred second.\n\nJIMMY CARTER","chunks":{"1":"Section 405 (c) of the Act provides that a bilateral commercial agreement and a proclamation implementing such agreement shall take effect only if approved by the Congress; Now, Therefore, I, Jimmy Carter, President of the United States of America, proclaim as follows: (1) This Proclamation shall become effective, said Agreement shall enter into force according to its terms, and nondiscriminatory treatment shall be extended to the products of the Hungarian People's Republic in accordance with the terms of the said Agreement, on the date of exchange of written notices of acceptance in accordance with Article XI of the said Agreement; and"},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"yes"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P21":{"metadata":{"president":"Jimmy Carter","date":"July 10, 1979","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nThe Secretary of Energy has advised me that the continued reduction in world crude oil production has resulted in a national energy supply shortage constituting a severe energy supply interruption as defined in Section 3 (8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)). The Secretary based his conclusion on the fact that current and projected imports of crude oil and petroleum products, plus available stocks, are not adequate to meet normal demand and that shortages of essential fuels have begun to have a major adverse impact on the economy with the possibility of more severe impacts occurring in the future. Recent shortages of gasoline in some areas of the Nation and the current inadequate levels of heating oil stocks have underscored the seriousness of the situation and demonstrate that action must be taken now to conserve available supplies of petroleum.\n\nOn the basis of the Secretary's report, and other information available to me, I hereby find and determine, in accordance with Sections 201(b) and 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6261 (b), 6202(8)), the existence of a national energy supply shortage constituting a severe energy supply interruption, which:\n\n(A) is of significant scope and duration and of an emergency nature;\n\n(B) may cause major adverse impact on national safety or the national economy; and\n\n(C) has resulted from an interruption in the supply of imported petroleum products.\n\nI further find that implementation of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2, is required by the severe energy supply interruption. This Plan was transmitted by me to the Congress on March 1, 1979, and approved by a resolution of each House (S. Res. 122, 125 Cong. Rec. S 5135 (May 2, 1979); H. Res. 209, 125 Cong. Rec. H 3018 May 10, 1979)), which resolutions have been transmitted to me by the Secretary of the Senate and the Clerk of the House. Those resolutions were received by me on May 4 and May 15, 1979, respectively.\n\nNow, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Constitution and laws of the United States, including Section 201(b) of the Energy Policy and Conservation Act (42 U.S.C. 6261(b) ), do hereby proclaim that:\n\nSECTION 1. A severe energy supply interruption, as defined in Section 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)) currently exists with respect to the supply of imported crude oil and petroleum products.\n\nSEC. 2. This finding shall be immediately transmitted to the Congress.\n\nSEC. 3. The provisions of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2 (44 FR 12911 of March 8, 1979), shall become effective as of July 16, 1979.\n\nSEC. 4. In accordance with the provisions of the Plan, the Secretary of Energy is hereby authorized to issue regulations for the purpose of implementing the Energy Conservation Contingency Plan No. 2 and to administer the program in all respects.\n\nIn Witness Whereof, I have hereunto set my hand this tenth day of July, in the year of our Lord nineteen hundred seventy-nine, and of the Independence of the United States of America the two hundred and fourth.\n\nJIMMY CARTER","chunks":{"1":"On the basis of the Secretary's report, and other information available to me, I hereby find and determine, in accordance with Sections 201(b) and 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6261 (b), 6202(8)), the existence of a national energy supply shortage constituting a severe energy supply interruption, which: (A) is of significant scope and duration and of an emergency nature; (B) may cause major adverse impact on national safety or the national economy; and (C) has resulted from an interruption in the supply of imported petroleum products. I further find that implementation of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2, is required by the severe energy supply interruption. This Plan was transmitted by me to the Congress on March 1, 1979, and approved by a resolution of each House (S. Res. 122, 125 Cong. Rec. S 5135 (May 2, 1979); H. Res. 209, 125 Cong. Rec. H 3018 May 10, 1979)), which resolutions have been transmitted to me by the Secretary of the Senate and the Clerk of the House. Those resolutions were received by me on May 4 and May 15, 1979, respectively.","2":"Now, Therefore, I, Jimmy Carter, President of the United States of America, by the authority vested in me by the Constitution and laws of the United States, including Section 201(b) of the Energy Policy and Conservation Act (42 U.S.C. 6261(b) ), do hereby proclaim that: SECTION 1. A severe energy supply interruption, as defined in Section 3(8) of the Energy Policy and Conservation Act (42 U.S.C. 6202 (8)) currently exists with respect to the supply of imported crude oil and petroleum products. SEC. 2. This finding shall be immediately transmitted to the Congress. SEC. 3. The provisions of the Emergency Building Temperature Restrictions, Energy Conservation Contingency Plan No. 2 (44 FR 12911 of March 8, 1979), shall become effective as of July 16, 1979. SEC. 4.","3":"In accordance with the provisions of the Plan, the Secretary of Energy is hereby authorized to issue regulations for the purpose of implementing the Energy Conservation Contingency Plan No. 2 and to administer the program in all respects."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P28":{"metadata":{"president":"George W. Bush","date":"October 04, 2004","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. On April 22, 1985, the United States entered into the Agreement on the Establishment of a Free Trade Area between the Government of the United States of America and the Government of Israel (the \"FTA\"), which the Congress approved in the United States-Israel Free Trade Area Implementation Act of 1985 (the \"FTA Act\") (19 U.S.C. 2112 Note).\n\n2. In order to maintain the general level of reciprocal and mutually advantageous concessions with respect to agricultural trade with Israel, on July 27, 2004, the Government of the United States entered into an agreement with the Government of Israel concerning certain aspects of trade in agricultural products during the period January 1, 2004, through December 31, 2008 (the \"2004 Agreement\"). The 2004 Agreement reflects an effort by the United States and Israel to address, through 2008, their continuing differences over the meaning of certain provisions in the FTA governing access for United States agricultural products to Israel's market.\n\n3. Section 4(b) of the FTA Act provides that, whenever the President determines that it is necessary to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the FTA, the President may proclaim such withdrawal, suspension, modification, or continuance of any duty, or such continuance of existing duty-free or excise treatment, or such additional duties as the President determines to be required or appropriate to carry out the FTA.\n\n4. Pursuant to section 4(b) of the FTA Act, I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel, to provide through the close of December 31, 2008, access into the United States customs territory for specified quantities of certain agricultural products of Israel free of duty or certain fees or other import charges.\n\n5. Section 604 of the Trade Act of 1974 (19 U.S.C. 2483) (the \"Trade Act\") authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTS) the substance of the relevant provisions of that act, and of other acts affecting import treatment, and actions thereunder, including removal, modification, continuance, or imposition of any rate of duty or other import restriction.\n\nNow, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States, including section 4 of the FTA Act and section 604 of the Trade Act, do hereby proclaim:\n\n(1) In order to implement aspects of the 2004 Agreement with the Government of Israel, concerning certain aspects of trade in agricultural products, the HTS is modified as provided in the Annex to this proclamation.\n\n(2) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency.\n\n(3) The modifications to the HTS made by the Annex to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2004, and the tariff treatment set forth therein shall be effective as provided in such Annex through December 31, 2008.\n\nIn Witness Whereof, I have hereunto set my hand this fourth day of October, in the year of our Lord two thousand four, and of the Independence of the United States of America the two hundred and twenty-ninth.\n\nGEORGE W. BUSH","chunks":{"1":"I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel, to provide through the close of December 31, 2008, access into the United States customs territory for specified quantities of certain agricultural products of Israel free of duty or certain fees or other import charges. 5. Section 604 of the Trade Act of 1974 (19 U.S.C. 2483) (the \"Trade Act\") authorizes the President to embody in the Harmonized Tariff Schedule of the United States (HTS) the substance of the relevant provisions of that act, and of other acts affecting import treatment, and actions thereunder, including removal, modification, continuance, or imposition of any rate of duty or other import restriction.","2":"Now, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States, including section 4 of the FTA Act and section 604 of the Trade Act, do hereby proclaim: (1) In order to implement aspects of the 2004 Agreement with the Government of Israel, concerning certain aspects of trade in agricultural products, the HTS is modified as provided in the Annex to this proclamation. (2) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency. (3) The modifications to the HTS made by the Annex to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2004, and the tariff treatment set forth therein shall be effective as provided in such Annex through December 31, 2008."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P35":{"metadata":{"president":"Ronald Reagan","date":"January 31, 1985","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. Headnote 2 of Subpart A, Part 10, Schedule 1 of the Tariff Schedules of the United States (10 U.S.C. 1202), hereinafter referred to as the \"TSUS,\" provides, in relevant part, as follows:\n\n\"(i) . . . if the President finds that a particular rate not lower than such January 1, 1968, rate, limited by a particular quota, may be established for any articles provided for in items 155.20 or 155.30, which will give due consideration to the interests in the United States sugar market of domestic producers and materially affected contracting parties to the General Agreement on Tariffs and Trade, he shall proclaim such particular rate and such quota limitation, . . .\"\n\n\"(ii) . . . any rate and quota limitation so established shall be modified if the President finds and proclaims that such modification is required or appropriate to give effect to the above considerations; . . .\n\n2. I find that the modifications hereinafter proclaimed of the rates of duty applicable to items 155.20 and 155.30 of the TSUS give due consideration to the interests in the United States sugar market of domestic producers and materially affected contracting parties to the General Agreement on Tariffs and Trade.\n\nNow, Therefore, I, Ronald Reagan, President of the United States of America, by authority vested in me by the Constitution and Statutes of the United States, including section 201 of the Trade Expansion Act of 1962, and pursuant to General Headnote 4 and Headnote 2 of Subpart A, Part 10, Schedule 1 of the TSUS, do hereby proclaim until otherwise superseded:\n\nA. The rates of duty in rate columns 1 and 2 for items 155.20 and 155.30 of Subpart A, Part 10, Schedule 1 of the TSUS are modified and the following rates are established:\n\nRates of duty\n\n1 2\n\n155.20 0.6625¢ per lb. less 0.009375¢ per lb. for 1.9875¢ per lb. less 0.028125¢ per lb. for each degree under 100 degrees (and frac- each degree under 100 degrees (and fractions of a degree in proportion) but not less tions of a degree in proportion) but not less than 0.428125¢ per lb. than 1.284375¢ per lb.\n\n155.30 Dutiable on total sugar at the rate per lb. Dutiable on total sugars at the rate per lb. applicable under item 155.20 to sugar test- applicable under Item 155.20 to sugar test-\n\ning 100 degrees. ing 100 degrees.\n\nB. The provisions of this Proclamation shall apply to articles entered, or withdrawn from warehouse, for consumption on and after the date of this Proclamation.\n\nIn Witness Whereof, I have hereunto set my hand this 31st day of January, in the year of our Lord nineteen hundred and eighty-five, and of the Independence of the United States of America the two hundred and ninth.\n\nRONALD REAGAN","chunks":{"1":"I find that the modifications hereinafter proclaimed of the rates of duty applicable to items 155.20 and 155.30 of the TSUS give due consideration to the interests in the United States sugar market of domestic producers and materially affected contracting parties to the General Agreement on Tariffs and Trade.","2":"Now, Therefore, I, Ronald Reagan, President of the United States of America, by authority vested in me by the Constitution and Statutes of the United States, including section 201 of the Trade Expansion Act of 1962, and pursuant to General Headnote 4 and Headnote 2 of Subpart A, Part 10, Schedule 1 of the TSUS, do hereby proclaim until otherwise superseded: A. The rates of duty in rate columns 1 and 2 for items 155.20 and 155.30 of Subpart A, Part 10, Schedule 1 of the TSUS are modified and the following rates are established: Rates of duty 1 2 155.20 0.6625¢ per lb. less 0.009375¢ per lb. for 1.9875¢ per lb. less 0.028125¢ per lb. for each degree under 100 degrees (and frac- each degree under 100 degrees (and fractions of a degree in proportion) but not less tions of a degree in proportion) but not less than 0.428125¢ per lb. than 1.284375¢ per lb. 155.30 Dutiable on total sugar at the rate per lb. Dutiable on total sugars at the rate per lb. applicable under item 155.20 to sugar test- applicable under Item 155.20 to sugar test- ing 100 degrees. ing 100 degrees. B. The provisions of this Proclamation shall apply to articles entered, or withdrawn from warehouse, for consumption on and after the date of this Proclamation."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P37":{"metadata":{"president":"Donald J. Trump","date":"April 03, 2025","type":"proclamation"},"text":"By the President of the United States of America A Proclamation\n\nThis month, we recognize National Sexual Assault Awareness and Prevention Month by ending the unfathomable human abuse committed under open borders policies.\n\nOne of the leading causes of sexual violence over the last 4 years has been the invasion of illegal aliens at our southern border. In a treasonous act of betrayal against the American people, the previous administration unleashed an army of gangs and criminal aliens from the darkest and most dangerous corners of the world—causing a dramatic increase of sexual violence in our neighborhoods and communities. These reckless policies empowered some of the most depraved people on the planet to exploit women and children in the most vicious ways imaginable.\n\nWe will never forget the names of precious American souls like Jocelyn Nungaray, Laken Riley, Rachel Morin, and many others who were savagely killed by illegal alien crime. Last June, 12-year-old Jocelyn Nungaray was brutally assaulted and murdered by two illegal aliens in her home state of Texas. To memorialize her young life and love of nature and animals, I proudly renamed the Anahuac National Wildlife Refuge in Texas to the Jocelyn Nungaray National Wildlife Refuge. May this be Jocelyn's little piece of Heaven on Earth.\n\nEvery act of violence committed against an American at the hands of an illegal alien is a crime beyond all comprehension. For that reason, I am doing everything in my power to defend the dignity of every human life, keep violent criminals out of our country, and end sexual violence—including the degrading scourge of sex trafficking, a form of modern-day slavery that has battered multitudes of innocent lives and scarred untold numbers of our most vulnerable fellow citizens.\n\nTo protect our communities, one of my first actions as President was to declare a national emergency at the southern border. I also designated cartels as Foreign Terrorist Organizations and Specially Designated Global Terrorists to end their campaign of violence and bloodshed. In my first legislative action as President, I signed into law the Laken Riley Act, which requires U.S. Immigration and Customs Enforcement to detain illegal aliens convicted of burglary, theft, larceny, or shoplifting. I have also initiated the largest deportation operation in the history of our country—including the deportation of hundreds of illegal alien gang members to El Salvador.\n\nAs President, I am bringing back security on our border, safety on our streets, and law and order in our communities. Under my leadership, human trafficking is being brought to a rapid end, and justice is being swiftly served.\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim April 2025 as National Sexual Assault Awareness and Prevention Month. I urge all Americans, families, law enforcement personnel, healthcare providers, and community and faith-based organizations to support survivors of sexual assault and work together to prevent these crimes in their communities.\n\nIn Witness Whereof, I have hereunto set my hand this third day of April, in the year of our Lord two thousand twenty-five, and of the Independence of the United States of America the two hundred and forty-ninth.\n\nDONALD J. TRUMP","chunks":{"1":"I also designated cartels as Foreign Terrorist Organizations and Specially Designated Global Terrorists to end their campaign of violence and bloodshed. In my first legislative action as President, I signed into law the Laken Riley Act, which requires U.S. Immigration and Customs Enforcement to detain illegal aliens convicted of burglary, theft, larceny, or shoplifting. I have also initiated the largest deportation operation in the history of our country—including the deportation of hundreds of illegal alien gang members to El Salvador. As President, I am bringing back security on our border, safety on our streets, and law and order in our communities. Under my leadership, human trafficking is being brought to a rapid end, and justice is being swiftly served.","2":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim April 2025 as National Sexual Assault Awareness and Prevention Month. I urge all Americans, families, law enforcement personnel, healthcare providers, and community and faith-based organizations to support survivors of sexual assault and work together to prevent these crimes in their communities."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P41":{"metadata":{"president":"Harry S Truman","date":"March 01, 1950","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by section 1 of the act of June 12, 1934, by the joint resolution approved June 7, 1943, by sections 2 and 3 of the act of July 5, 1945 (ch. 474, 48 Stat. 943, ch. 118., 57 Stat. 125, ch. 269, 59 Stat. 410 and 411), and by sections 4 and 6 of the Trade Agreements Extension Act of 1949 (Public Law 307, 81st Congress), the period for the exercise of the said authority having been extended by section 3 of the Trade Agreements Extension Act of 1949 until the expiration of three years from June 12, 1948, on October 10, 1949, I entered into a trade agreement providing for the accession to the General Agreement on Tariffs and Trade (Treaties and Other International Acts Series 1700) of the Governments of the Kingdom of Denmark, the Dominican Republic, the Republic of Finland, the Kingdom of Greece, the Republic of Haiti, the Republic of Italy, the Republic of Liberia, the Republic of Nicaragua, the Kingdom of Sweden, and the Oriental Republic of Uruguay, which trade agreement for accession consists of the Annecy Protocol of Terms of Accession to the General Agreement on Tariffs and Trade, dated October 10, 1949, including the annexes thereto (Dept. of State Publ. 2664);\n\n2. Whereas by Proclamation 2867 of December 22, 1949 (14 F.R. 7723), I proclaimed such modifications of existing duties and the other import restrictions of the United States of America and such continuance of existing customs or excise treatment of articles imported into the United States of America as were then found to be required or appropriate to carry out the said trade agreement for accession on and after January 1, 1950;\n\n3. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by the acts specified in the first recital of this proclamation except the Trade Agreements Extension Act of 1949, the period for the exercise of the authority under the said section 350 having been extended by section 1 of the said act of July 5, 1945 (ch. 269, 59 Stat. 410), until the expiration of three years from June 12, 1945, on October 30, 1947, I entered into an exclusive trade agreement with the Government of the Republic of Cuba (Treaties and Other International Acts Series 1703), which exclusive trade agreement includes certain portions of other documents made a part thereof and provides for the customs treatment in respect of ordinary customs duties of products of the Republic of Cuba imported into the United States of America;\n\n4. Whereas by Proclamation No. 2764 of January 1, 1948 (3 CFR, 1948 Supp., p. 11), I proclaimed such modifications of existing duties and other import restrictions of the United States of America in respect of products of the Republic of Cuba and such continuance of existing customs and excise treatment of products of the Republic of Cuba imported into the United States of America as were then found to be required or appropriate to carry out the said exclusive trade agreement on and after January 1, 1948, which proclamation has been supplemented by the said proclamation of December 22, 1949, and by the supplemental proclamations referred to in the fourth recital of the said proclamation of December 22, 1949;\n\n5. Whereas, the trade agreement for accession specified in the first recital of this proclamation has been signed by the Government of the Kingdom of Greece under such circumstances that it will enter into force for such Government, and such Government will become a contracting party to the said general agreement, on march 9, 1950;\n\n6. Whereas I determine that the application of each of the concessions provided for in Part I of Schedule XX in Annex A of the said trade agreement for accession which were withheld from application in accordance with paragraph 4 of the said trade agreement for accession by the said proclamation of December 22, 1949, as are identified in the following list is required or appropriate to carry out, on and after March 9, 1950, the said trade agreement for accession:\n\nItem\n\n(paragraph) Rates of duty\n\n10 5% ad val.\n\n38 3 ¾% ad val.\n\n53 3 ¼ per lb.\n\n328 [first] 12 ½ % ad val.\n\n601 20 per lb.\n\n740 3 per lb.\n\n742 1 per lb.\n\n744 All rates\n\n781 12 ½ % ad val.\n\n1519 (b) Both rates\n\n1545 12 ½% ad val.\n\n1672 Free\n\n1686 Free\n\n1732 Free [identified as to olive oil only];\n\n7. Whereas I determine that, in view of the determination set forth in the sixth recital of this proclamation, the deletion of Item 328 from the list set forth in the ninth recital of the said proclamation of January 1, 1948, as amended and rectified, is required or appropriate to carry out, on and after March 9, 1950, the said exclusive trade agreement specified in the third recital of this proclamation:\n\nNow, Therefore, I, Harry S. Truman, President of the United States of America, acting under and by virtue of the authority vested in me by the Constitution and the statutes, including the said section 350 of the Tariff Act of 1930, as amended, do proclaim as follows:\n\nPART I\n\nTo the end that the said trade agreement for accession specified in the first recital of this proclamation may be carried out, the identification of each of the concessions provided for in Part I of the said Schedule XX in Annex A which is included in the sixth recital of this proclamation shall, on and after March 9, 1950, be included in the list set forth in the ninth recital of the said proclamation of December 22, 1949.\n\nPART II\n\nTo the end that the said exclusive trade agreement specified in the third recital of this proclamation may be carried out, the list set forth in the ninth recital of the said proclamation of January 1 1948, as amended and rectified, shall, on and after March 9, 1950, be further amended by deleting therefrom the Item 328 referred to in the seventh recital of this proclamation.\n\nIn Witness Whereof, I have hereunto set my hand and caused the Seal of the United States of America to be affixed.\n\nDone at the City of Washington this 1st day of March in the year of our Lord nineteen hundred and fifty, and of the Independence of the United States of America the one hundred and seventy-fourth.\n\nHARRY S. TRUMAN\n\nBy the President:\n\nDEAN ACHESON,\n\nSecretary of State.","chunks":{"1":"Whereas by Proclamation 2867 of December 22, 1949 (14 F.R. 7723), I proclaimed such modifications of existing duties and the other import restrictions of the United States of America and such continuance of existing customs or excise treatment of articles imported into the United States of America as were then found to be required or appropriate to carry out the said trade agreement for accession on and after January 1, 1950; 3. Whereas, pursuant to the authority vested in the President by the Constitution and the statutes, including section 350 of the Tariff Act of 1930, as amended by the acts specified in the first recital of this proclamation except the Trade Agreements Extension Act of 1949, the period for the exercise of the authority under the said section 350 having been extended by section 1 of the said act of July 5, 1945 (ch. 269, 59 Stat. 410), until the expiration of three years from June 12, 1945, on October 30, 1947, I entered into an exclusive trade agreement with the Government of the Republic of Cuba (Treaties and Other International Acts Series 1703), which exclusive trade agreement includes certain portions of other documents made a part thereof and provides for the customs treatment in respect of ordinary customs duties of products of the Republic of Cuba imported into the United States of America; 4.","2":"Whereas by Proclamation No. 2764 of January 1, 1948 (3 CFR, 1948 Supp., p. 11), I proclaimed such modifications of existing duties and other import restrictions of the United States of America in respect of products of the Republic of Cuba and such continuance of existing customs and excise treatment of products of the Republic of Cuba imported into the United States of America as were then found to be required or appropriate to carry out the said exclusive trade agreement on and after January 1, 1948, which proclamation has been supplemented by the said proclamation of December 22, 1949, and by the supplemental proclamations referred to in the fourth recital of the said proclamation of December 22, 1949; 5. Whereas, the trade agreement for accession specified in the first recital of this proclamation has been signed by the Government of the Kingdom of Greece under such circumstances that it will enter into force for such Government, and such Government will become a contracting party to the said general agreement, on march 9, 1950; 6.","3":"Whereas I determine that the application of each of the concessions provided for in Part I of Schedule XX in Annex A of the said trade agreement for accession which were withheld from application in accordance with paragraph 4 of the said trade agreement for accession by the said proclamation of December 22, 1949, as are identified in the following list is required or appropriate to carry out, on and after March 9, 1950, the said trade agreement for accession: Item (paragraph) Rates of duty 10 5% ad val. 38 3 ¾% ad val. 53 3 ¼ per lb. 328 [first] 12 ½ % ad val. 601 20 per lb. 740 3 per lb. 742 1 per lb. 744 All rates 781 12 ½ % ad val. 1519 (b) Both rates 1545 12 ½% ad val. 1672 Free 1686 Free 1732 Free [identified as to olive oil only]; 7.","4":"Whereas I determine that, in view of the determination set forth in the sixth recital of this proclamation, the deletion of Item 328 from the list set forth in the ninth recital of the said proclamation of January 1, 1948, as amended and rectified, is required or appropriate to carry out, on and after March 9, 1950, the said exclusive trade agreement specified in the third recital of this proclamation:","5":"To the end that the said trade agreement for accession specified in the first recital of this proclamation may be carried out, the identification of each of the concessions provided for in Part I of the said Schedule XX in Annex A which is included in the sixth recital of this proclamation shall, on and after March 9, 1950, be included in the list set forth in the ninth recital of the said proclamation of December 22, 1949. PART II","6":"To the end that the said exclusive trade agreement specified in the third recital of this proclamation may be carried out, the list set forth in the ninth recital of the said proclamation of January 1 1948, as amended and rectified, shall, on and after March 9, 1950, be further amended by deleting therefrom the Item 328 referred to in the seventh recital of this proclamation."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"0","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P42":{"metadata":{"president":"Barack Obama","date":"October 31, 2014","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nEvery year, our Nation pauses to reflect on the profound ways the First Americans have shaped our country's character and culture. The first stewards of our environment, early voices for the values that define our Nation, and models of government to our Founding Fathers—American Indians and Alaska Natives helped build the very fabric of America. Today, their spirit and many contributions continue to enrich our communities and strengthen our country. During National Native American Heritage Month, we honor their legacy, and we recommit to strengthening our nation-to-nation partnerships.\n\nAs we celebrate the rich traditions of the original peoples of what is now the United States, we cannot forget the long and unfortunate chapters of violence, discrimination, and deprivation they had to endure. For far too long, the heritage we honor today was disrespected and devalued, and Native Americans were told their land, religion, and language were not theirs to keep. We cannot ignore these events or erase their consequences for Native peoples—but as we work together to forge a brighter future, the lessons of our past can help reaffirm the principles that guide our Nation today.\n\nIn a spirit of true partnership and mutual trust, my Administration is committed to respecting the sovereignty of tribal nations and upholding our treaty obligations, which honor our nation-to-nation relationship of peace and friendship over the centuries. We have worked to fairly settle longstanding legal disputes and provide justice to those who experienced discrimination. We have taken unprecedented steps to strengthen tribal courts, especially when it comes to criminal sentencing and prosecuting individuals who commit violence against Native American women. And next month, my Administration will host our sixth annual White House Tribal Nations Conference, part of our ongoing effort to promote meaningful collaboration with tribal leaders as we fight to give all our children the tomorrow they deserve.\n\nToday, as community and tribal leaders, members of our Armed Forces, and drivers of progress and economic growth, American Indians and Alaska Natives are working to carry forward their proud history, and my Administration is dedicated to expanding pathways to success for Native Americans. To increase opportunity in Indian Country, we are investing in roads and high-speed Internet and supporting job training and tribal colleges and universities. The Affordable Care Act provides access to quality, affordable health insurance, and it permanently reauthorized the Indian Health Care Improvement Act, which provides care to many Native Americans. And because the health of tribal nations depends on the health of tribal lands, my Administration is partnering with Native American leaders to protect these lands in a changing climate.\n\nEvery American, including every Native American, deserves the chance to work hard and get ahead. This month, we recognize the limitless potential of our tribal nations, and we continue our work to build a world where all people are valued and no child ever has to wonder if he or she has a place in our society. Now, Therefore, I, Barack Obama, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim November 2014 as National Native American Heritage Month. I call upon all Americans to commemorate this month with appropriate programs and activities, and to celebrate November 28, 2014, as Native American Heritage Day.\n\nIn Witness Whereof, I have hereunto set my hand this thirty-first day of October, in the year of our Lord two thousand fourteen, and of the Independence of the United States of America the two hundred and thirty-ninth.\n\nBARACK OBAMA","chunks":{"1":"do hereby proclaim November 2014 as National Native American Heritage Month.","2":"I call upon all Americans to commemorate this month with appropriate programs and activities, and to celebrate November 28, 2014, as Native American Heritage Day."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":null,"military_ops":null},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P45":{"metadata":{"president":"Lyndon B. Johnson","date":"April 07, 1968","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nWhereas the Governor of the State of Illinois has informed me that conditions of domestic violence and disorder exist in and about the City of Chicago in that State, obstructing the execution and enforcement of the laws, and that the law enforcement resources available to the City and State, including the National Guard, have been unable to suppress such acts of violence and to restore law and order; and\n\nWhereas the Governor has requested me to use such of the armed forces of the United States as may be necessary for those purposes; and\n\nWhereas such domestic violence and disorder are also obstructing the execution of the laws of the United States, including the protection of federal property in and about the City of Chicago:\n\nNow, Therefore, I, Lyndon B. Johnson, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, including Chapter 15 of Title 10 of the United States Code, do command all persons engaged in such acts of violence to cease and desist therefrom and to disperse and retire peaceably forthwith.\n\nIn Witness Whereof, I have hereunto set my hand this 7th day of April, in the year of our Lord nineteen hundred and sixty-eight, and the Independence of the United States of America the one hundred and ninety-second.\n\nLYNDON B. JOHNSON\n\nApril 7, 1968\n\n1 a.m.\n\nThe White House Washington, D.C.","chunks":{"1":"Now, Therefore, I, Lyndon B. Johnson, President of the United States of America, by virtue of the authority vested in me by the Constitution and laws of the United States, including Chapter 15 of Title 10 of the United States Code, do command all persons engaged in such acts of violence to cease and desist therefrom and to disperse and retire peaceably forthwith."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P47":{"metadata":{"president":"William J. Clinton","date":"June 21, 1993","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\nIn light of the political and economic crisis in Zaire, I have determined that it is in the interests of the United States to restrict the entrance into the United States as immigrants and nonimmigrants of certain Zairian nationals who formulate or implement policies that impede Zaire's transition to democracy or who benefit from such policies, and the immediate families of such persons.\n\nNow, Therefore, I, William J. Clinton, by the power vested in me as President by the Constitution and laws of the United States of America, including section 212 (f) of the Immigration and Nationality Act of 1952, as amended (8 U.S.C. 1182(f)), and section 301 of title 3, United States Code, hereby find that the unrestricted immigrant and nonimmigrant entry into the United States of persons described in section 1 of this proclamation would, except as provided for in section 2 or 3 of this proclamation, be detrimental to the interests of the United States. 1, therefore, do proclaim that:\n\nSection 1. The entry into the United States as immigrants and nonimmigrants of persons who formulate, implement, or benefit from policies that impede Zaire's transition to democracy, and the immediate family members of such persons, is hereby suspended.\n\nSec. 2. Section 1 shall not apply with respect to any person otherwise covered by section 1 where entry of such person would not be contrary to the interests of the United States.\n\nSec. 3. Persons covered by sections 1 and 2 shall be identified pursuant to procedures established by the Secretary of State, as authorized in section 6 below.\n\nSec. 4. Nothing in this proclamation shall be construed to derogate from United States Government obligations under applicable international agreements.\n\nSec.5. This proclamation is effective immediately and shall remain in effect until of State determines that it is no longer necessary and should be terminated.\n\nSec. 6. The Secretary of State shall have responsibility to implement this proclamation pursuant to procedures
