elegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this order.","2":"Each delegation shall identify the official by name or position. (5) Delegations of original classification authority shall be reported or made available by name or position to the Director of the Information Security Oversight Office. (d) All original classification authorities must receive training in proper classification (including the avoidance of over-classification) and declassification as provided in this order and its implementing directives at least once a calendar year. Such training must include instruction on the proper safeguarding of classified information and on the sanctions in section 5.5 of this order that may be brought against an individual who fails to classify information properly or protect classified information from unauthorized disclosure. Original classification authorities who do not receive such mandatory training at least once within a calendar year shall have their classification authority suspended by the agency head or the senior agency official designated under section 5.4(d) of this order until such training has taken place. A waiver may be granted by the agency head, the deputy agency head, or the senior agency official if an individual is unable to receive such training due to unavoidable circumstances. Whenever a waiver is granted, the individual shall receive such training as soon as practicable. (e) Exceptional cases. When an employee, government contractor, licensee, certificate holder, or grantee of an agency who does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this order and its implementing directives. The information shall be transmitted promptly as provided under this order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within 30 days whether to classify this information. Sec. 1.4. Classification Categories. Information shall not be considered for classification unless its unauthorized disclosure could reasonably be expected to cause identifiable or describable damage to the national security in accordance with section 1.2 of this order, and it pertains to one or more of the following: (a) military plans, weapons systems, or operations; (b) foreign government information; (c) intelligence activities (including covert action), intelligence sources or methods, or cryptology; (d) foreign relations or foreign activities of the United States, including confidential sources; (e) scientific, technological, or economic matters relating to the national security; (f) United States Government programs for safeguarding nuclear materials or facilities; (g) vulnerabilities or capabilities of systems, installations, infrastructures, projects, plans, or protection services relating to the national security; or (h) the development, production, or use of weapons of mass destruction. Sec. 1.5. Duration of Classification.","3":"(a) At the time of original classification, the original classification authority shall establish a specific date or event for declassification based on the duration of the national security sensitivity of the information. Upon reaching the date or event, the information shall be automatically declassified. Except for information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, the date or event shall not exceed the time frame established in paragraph (b) of this section. (b) If the original classification authority cannot determine an earlier specific date or event for declassification, information shall be marked for declassification 10 years from the date of the original decision, unless the original classification authority otherwise determines that the sensitivity of the information requires that it be marked for declassification for up to 25 years from the date of the original decision. (c) An original classification authority may extend the duration of classification up to 25 years from the date of origin of the document, change the level of classification, or reclassify specific information only when the standards and procedures for classifying information under this order are followed. (d) No information may remain classified indefinitely. Information marked for an indefinite duration of classification under predecessor orders, for example, marked as \"Originating Agency's Determination Required,\" or classified information that contains incomplete declassification instructions or lacks declassification instructions shall be declassified in accordance with part 3 of this order. Sec. 1.6. Identification and Markings. (a) At the time of original classification, the following shall be indicated in a manner that is immediately apparent: (1) one of the three classification levels defined in section 1.2 of this order; (2) the identity, by name and position, or by personal identifier, of the original classification authority; (3) the agency and office of origin, if not otherwise evident; (4) declassification instructions, which shall indicate one of the following: (A) the date or event for declassification, as prescribed in section 1.5(a); (B) the date that is 10 years from the date of original classification, as prescribed in section 1.5(b); (C) the date that is up to 25 years from the date of original classification, as prescribed in section 1.5(b); or (D) in the case of information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, the marking prescribed in implementing directives issued pursuant to this order; and (5) a concise reason for classification that, at a minimum, cites the applicable classification categories in section 1.4 of this order. (b) Specific information required in paragraph (a) of this section may be excluded if it would reveal additional classified information. (c) With respect to each classified document, the agency originating the document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are unclassified. In accordance with standards prescribed in directives issued under this order, the Director of the Information Security Oversight Office may grant and revoke temporary waivers of this requirement. The Director shall revoke any waiver upon a finding of abuse. (d) Markings or other indicia implementing the provisions of this order, including abbreviations and requirements to safeguard classified working papers, shall conform to the standards prescribed in implementing directives issued pursuant to this order. (e) Foreign government information shall retain its original classification markings or shall be assigned a U.S. classification that provides a degree of protection at least equivalent to that required by the entity that furnished the information. Foreign government information retaining its original classification markings need not be assigned a U.S. classification marking provided that the responsible agency determines that the foreign government markings are adequate to meet the purposes served by U.S. classification markings. (f) Information assigned a level of classification under this or predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings.","4":"Whenever such information is used in the derivative classification process or is reviewed for possible declassification, holders of such information shall coordinate with an appropriate classification authority for the application of omitted markings. (g) The classification authority shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document or prepare a product to allow for dissemination at the lowest level of classification possible or in unclassified form. (h) Prior to public release, all declassified records shall be appropriately marked to reflect their declassification. Sec. 1.7. Classification Prohibitions and Limitations. (a) In no case shall information be classified, continue to be maintained as classified, or fail to be declassified in order to: (1) conceal violations of law, inefficiency, or administrative error; (2) prevent embarrassment to a person, organization, or agency; (3) restrain competition; or (4) prevent or delay the release of information that does not require protection in the interest of the national security. (b) Basic scientific research information not clearly related to the national security shall not be classified. (c) Information may not be reclassified after declassification and release to the public under proper authority unless: (1) the reclassification is personally approved in writing by the agency head based on a document-by-document determination by the agency that reclassification is required to prevent significant and demonstrable damage to the national security; (2) the information may be reasonably recovered without bringing undue attention to the information; (3) the reclassification action is reported promptly to the Assistant to the President for National Security Affairs (National Security Advisor) and the Director of the Information Security Oversight Office; and (4) for documents in the physical and legal custody of the National Archives and Records Administration (National Archives) that have been available for public use, the agency head has, after making the determinations required by this paragraph, notified the Archivist of the United States (Archivist), who shall suspend public access pending approval of the reclassification action by the Director of the Information Security Oversight Office. Any such decision by the Director may be appealed by the agency head to the President through the National Security Advisor. Public access shall remain suspended pending a prompt decision on the appeal. (d) Information that has not previously been disclosed to the public under proper authority may be classified or reclassified after an agency has received a request for it under the Freedom of Information Act (5 U.S.C. 552), the Presidential Records Act, 44 U.S.C. 2204(c)(1), the Privacy Act of 1974 (5 U.S.C. 552a), or the mandatory review provisions of section 3.5 of this order only if such classification meets the requirements of this order and is accomplished on a document-by-document basis with the personal participation or under the direction of the agency head, the deputy agency head, or the senior agency official designated under section 5.4 of this order. The requirements in this paragraph also apply to those situations in which information has been declassified in accordance with a specific date or event determined by an original classification authority in accordance with section 1.5 of this order. (e) Compilations of items of information that are individually unclassified may be classified if the compiled information reveals an additional association or relationship that: (1) meets the standards for classification under this order; and (2) is not otherwise revealed in the individual items of information. Sec. 1.8. Classification Challenges. (a) Authorized holders of information who, in good faith, believe that its classification status is improper are encouraged and expected to challenge the classification status of the information in accordance with agency procedures established under paragraph (b) of this section.","5":"(b) In accordance with implementing directives issued pursuant to this order, an agency head or senior agency official shall establish procedures under which authorized holders of information, including authorized holders outside the classifying agency, are encouraged and expected to challenge the classification of information that they believe is improperly classified or unclassified.","6":"These procedures shall ensure that: (1) individuals are not subject to retribution for bringing such actions; (2) an opportunity is provided for review by an impartial official or panel; and (3) individuals are advised of their right to appeal agency decisions to the Interagency Security Classification Appeals Panel (Panel) established by section 5.3 of this order. (c) Documents required to be submitted for prepublication review or other administrative process pursuant to an approved nondisclosure agreement are not covered by this section. Sec. 1.9. Fundamental Classification Guidance Review. (a) Agency heads shall complete on a periodic basis a comprehensive review of the agency's classification guidance, particularly classification guides, to ensure the guidance reflects current circumstances and to identify classified information that no longer requires protection and can be declassified. The initial fundamental classification guidance review shall be completed within 2 years of the effective date of this order. (b) The classification guidance review shall include an evaluation of classified information to determine if it meets the standards for classification under section 1.4 of this order, taking into account an up-to-date assessment of likely damage as described under section 1.2 of this order. (c) The classification guidance review shall include original classification authorities and agency subject matter experts to ensure a broad range of perspectives.","7":"(d) Agency heads shall provide a report summarizing the results of the classification guidance review to the Director of the Information Security Oversight Office and shall release an unclassified version of this report to the public. PART 2—DERIVATIVE CLASSIFICATION Sec. 2.1. Use of Derivative Classification. (a) Persons who reproduce, extract, or summarize classified information, or who apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) be identified by name and position, or by personal identifier, in a manner that is immediately apparent for each derivative classification action; (2) observe and respect original classification decisions; and (3) carry forward to any newly created documents the pertinent classification markings. For information derivatively classified based on multiple sources, the derivative classifier shall carry forward: (A) the date or event for declassification that corresponds to the longest period of classification among the sources, or the marking established pursuant to section 1.6(a)(4)(D) of this order; and (B) a listing of the source materials. (c) Derivative classifiers shall, whenever practicable, use a classified addendum whenever classified information constitutes a small portion of an otherwise unclassified document or prepare a product to allow for dissemination at the lowest level of classification possible or in unclassified form. (d) Persons who apply derivative classification markings shall receive training in the proper application of the derivative classification principles of the order, with an emphasis on avoiding over-classification, at least once every 2 years. Derivative classifiers who do not receive such training at least once every 2 years shall have their authority to apply derivative classification markings suspended until they have received such training. A waiver may be granted by the agency head, the deputy agency head, or the senior agency official if an individual is unable to receive such training due to unavoidable circumstances. Whenever a waiver is granted, the individual shall receive such training as soon as practicable. Sec. 2.2. Classification Guides.","8":"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. These guides shall conform to standards contained in directives issued under this order. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official; and (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agencies shall establish procedures to ensure that classification guides are reviewed and updated as provided in directives issued under this order. (d) Agencies shall incorporate original classification decisions into classification guides on a timely basis and in accordance with directives issued under this order. (e) Agencies may incorporate exemptions from automatic declassification approved pursuant to section 3.3(j) of this order into classification guides, provided that the Panel is notified of the intent to take such action for specific information in advance of approval and the information remains in active use. (f) The duration of classification of a document classified by a derivative classifier using a classification guide shall not exceed 25 years from the date of the origin of the document, except for: (1) information that should clearly and demonstrably be expected to reveal the identity of a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction; and (2) specific information incorporated into classification guides in accordance with section 2.2(e) of this order. PART 3—DECLASSIFICATION AND DOWNGRADING Sec. 3.1. Authority for Declassification. (a) Information shall be declassified as soon as it no longer meets the standards for classification under this order. (b) Information shall be declassified or downgraded by: (1) the official who authorized the original classification, if that official is still serving in the same position and has original classification authority; (2) the originator's current successor in function, if that individual has original classification authority; (3) a supervisory official of either the originator or his or her successor in function, if the supervisory official has original classification authority; or (4) officials delegated declassification authority in writing by the agency head or the senior agency official of the originating agency. (c) The Director of National Intelligence (or, if delegated by the Director of National Intelligence, the Principal Deputy Director of National Intelligence) may, with respect to the Intelligence Community, after consultation with the head of the originating Intelligence Community element or department, declassify, downgrade, or direct the declassification or downgrading of information or intelligence relating to intelligence sources, methods, or activities. (d) It is presumed that information that continues to meet the classification requirements under this order requires continued protection. In some exceptional cases, however, the need to protect such information may be outweighed by the public interest in disclosure of the information, and in these cases the information should be declassified. When such questions arise, they shall be referred to the agency head or the senior agency official. That official will determine, as an exercise of discretion, whether the public interest in disclosure outweighs the damage to the national security that might reasonably be expected from disclosure. This provision does not: (1) amplify or modify the substantive criteria or procedures for classification; or (2) create any substantive or procedural rights subject to judicial review. (e) If the Director of the Information Security Oversight Office determines that information is classified in violation of this order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the President through the National Security Advisor. The information shall remain classified pending a prompt decision on the appeal. (f) The provisions of this section shall also apply to agencies that, under the terms of this order, do not have original classification authority, but had such authority under predecessor orders. (g) No information may be excluded from declassification under section 3.3 of this order based solely on the type of document or record in which it is found. Rather, the classified information must be considered on the basis of its content. (h) Classified nonrecord materials, including artifacts, shall be declassified as soon as they no longer meet the standards for classification under this order. (i) When making decisions under sections 3.3, 3.4, and 3.5 of this order, agencies shall consider the final decisions of the Panel. Sec. 3.2. Transferred Records. (a) In the case of classified records transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this order. (b) In the case of classified records that are not officially transferred as described in paragraph (a) of this section, but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such records shall be deemed to be the originating agency for purposes of this order. Such records may be declassified or downgraded by the agency in possession of the records after consultation with any other agency that has an interest in the subject matter of the records. (c) Classified records accessioned into the National Archives shall be declassified or downgraded by the Archivist in accordance with this order, the directives issued pursuant to this order, agency declassification guides, and any existing procedural agreement between the Archivist and the relevant agency head. (d) The originating agency shall take all reasonable steps to declassify classified information contained in records determined to have permanent historical value before they are accessioned into the National Archives. However, the Archivist may require that classified records be accessioned into the National Archives when necessary to comply with the provisions of the Federal Records Act. This provision does not apply to records transferred to the Archivist pursuant to section 2203 of title 44, United States Code, or records for which the National Archives serves as the custodian of the records of an agency or organization that has gone out of existence. (e) To the extent practicable, agencies shall adopt a system of records management that will facilitate the public release of documents at the time such documents are declassified pursuant to the provisions for automatic declassification in section 3.3 of this order. Sec. 3.3 Automatic Declassification. (a) Subject to paragraphs (b)-(d) and (g)-(j) of this section, all classified records that (1) are more than 25 years old and (2) have been determined to have permanent historical value under title 44, United States Code, shall be automatically declassified whether or not the records have been reviewed. All classified records shall be automatically declassified on December 31 of the year that is 25 years from the date of origin, except as provided in paragraphs (b)-(d) and (g)-(j) of this section. If the date of origin of an individual record cannot be readily determined, the date of original classification shall be used instead. (b) An agency head may exempt from automatic declassification under paragraph (a) of this section specific information, the release of which should clearly and demonstrably be expected to: (1) reveal the identity of a confidential human source, a human intelligence source, a relationship with an intelligence or security service of a foreign government or international organization, or a nonhuman intelligence source; or impair the effectiveness of an intelligence method currently in use, available for use, or under development; (2) reveal information that would assist in the development, production, or use of weapons of mass destruction; (3) reveal information that would impair U.S. cryptologic systems or activities; (4) reveal information that would impair the application of state-of-the-art technology within a U.S. weapon system; (5) reveal formally named or numbered U.S. military war plans that remain in effect, or reveal operational or tactical elements of prior plans that are contained in such active plans; (6) reveal information, including foreign government information, that would cause serious harm to relations between the United States and a foreign government, or to ongoing diplomatic activities of the United States; (7) reveal information that would impair the current ability of United States Government officials to protect the President, Vice President, and other protectees for whom protection services, in the interest of the national security, are authorized; (8) reveal information that would seriously impair current national security emergency preparedness plans or reveal current vulnerabilities of systems, installations, or infrastructures relating to the national security; or (9) violate a statute, treaty, or international agreement that does not permit the automatic or unilateral declassification of information at 25 years. (c)(1) An agency head shall notify the Panel of any specific file series of records for which a review or assessment has determined that the information within that file series almost invariably falls within one or more of the exemption categories listed in paragraph (b) of this section and that the agency proposes to exempt from automatic declassification at 25 years. (2) The notification shall include: (A) a description of the file series; (B) an explanation of why the information within the file series is almost invariably exempt from automatic declassification and why the information must remain classified for a longer period of time; and (C) except when the information within the file series almost invariably identifies a confidential human source or a human intelligence source or key design concepts of weapons of mass destruction, a specific date or event for declassification of the information, not to exceed December 31 of the year that is 50 years from the date of origin of the records. (3) The Panel may direct the agency not to exempt a designated file series or to declassify the information within that series at an earlier date than recommended. The agency head may appeal such a decision to the President through the National Security Advisor. (4) File series exemptions approved by the President prior to December 31, 2008, shall remain valid without any additional agency action pending Panel review by the later of December 31, 2010, or December 31 of the year that is 10 years from the date of previous approval. (d) The following provisions shall apply to the onset of automatic declassification: (1) Classified records within an integral file block, as defined in this order, that are otherwise subject to automatic declassification under this section shall not be automatically declassified until December 31 of the year that is 25 years from the date of the most recent record within the file block. (2) After"},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"},"8":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO14":{"metadata":{"president":"Lyndon B. Johnson","date":"October 14, 1966","type":"executive_order"},"text":"By virtue of the authority vested in me as President of the United States, including the provisions of the Joint Resolution of October 8, 1966, Public Law 89-634, and section 301 of Title 3 of the United States Code, I hereby order and proclaim that\n\n1. Pursuant to section 3 (b) of the Joint Resolution, the amendments to the Tariff Schedules of the United States made by section 3 (a) of the Joint Resolution shall apply with respect to articles entered, or withdrawn from warehouse, for consumption, on and after January 1, 1967.\n\n2. Pursuant to the \"Agreement for Facilitating the International Circulation of Visual and Auditory Materials of an Educational, Scientific and Cultural Character\", made at Beirut in 1948, the Joint Resolution, and headnote 1 to schedule 8, part 6 of the Tariff Schedules of the United States, the United States Information Agency is hereby designated as the agency to carry out the provisions of the Agreement and related protocol, and to make any determinations and to prescribe any regulations required by headnote 1.\n\nLYNDON B. JOHNSON\n\nThe White House,\n\nOctober 14, 1966.","chunks":{"1":"By virtue of the authority vested in me as President of the United States, including the provisions of the Joint Resolution of October 8, 1966, Public Law 89-634, and section 301 of Title 3 of the United States Code, I hereby order and proclaim that 1. Pursuant to section 3 (b) of the Joint Resolution, the amendments to the Tariff Schedules of the United States made by section 3 (a) of the Joint Resolution shall apply with respect to articles entered, or withdrawn from warehouse, for consumption, on and after January 1, 1967. 2.","2":"Pursuant to the \"Agreement for Facilitating the International Circulation of Visual and Auditory Materials of an Educational, Scientific and Cultural Character\", made at Beirut in 1948, the Joint Resolution, and headnote 1 to schedule 8, part 6 of the Tariff Schedules of the United States, the United States Information Agency is hereby designated as the agency to carry out the provisions of the Agreement and related protocol, and to make any determinations and to prescribe any regulations required by headnote 1."},"annotations":[{"directive":{"code":"4","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO15":{"metadata":{"president":"George W. Bush","date":"September 28, 2004","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, it is hereby ordered as follows:\n\nSection 1. Assignment of Functions to the Secretary of Defense. The Secretary of Defense shall perform, except with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions of the President under the following provisions of title 10, United States Code:\n\n(a) subsection 1521(a); (b) the first sentence of subsection 12203(a); (c) the first sentence of subsection 14111(a), except with respect to reports relating to the grades of brigadier general or above, or rear admiral (lower half) or above; and (d) subsection 14310(a), except with respect to removals relating to a promotion list for grades of brigadier general or above, or rear admiral (lower half) or above.\n\nSec. 2. Assignment of Functions to the Secretary of Homeland Security. The Secretary of Homeland Security shall perform, with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions assigned to the President by the following provisions of the United States Code:\n\n(a) subsection 1521(a) of title 10; (b) the first sentence of subsection 12203(a) of title 10; (c) subsection 729(g) of title 14, except with respect to approval of, or removal of a name from, a report relating to the grades of rear admiral (lower half) or above; and (d) subsection 738(a) of title 14, except with respect to removals relating to a promotion list for grades of rear admiral (lower half) or above.\n\nSec. 3. Reassignment of Functions Assigned. The Secretary of Defense and the Secretary of Homeland Security may reassign the functions assigned to them by this order to civilian officers, within their respective departments, who hold a position for which the President makes an appointment by and with the advice and consent of the Senate, except that the Secretary of Defense and the Secretary of Homeland Security may not reassign the functions assigned by sections 1(b) and 2(b), respectively. The Secretary of Defense may not reassign the function assigned by section 1(c) of this order except to such an officer within the Office of the Secretary of Defense (as defined in section 131(b) of title 10).\n\nSec. 4. General Provisions. (a) This order shall take effect on October 1, 2004.\n\n(b) Nothing in this order shall be construed to limit or otherwise affect the authority of the President as Commander in Chief of the Armed Forces\n\nof the United States, or under the Constitution and laws of the United States to nominate or to make or terminate appointments.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, entities, officers, employees or agents, or any other person. GEORGE W. BUSH\n\nThe White House,\n\nSeptember 28, 2004.\n\n[Filed with the Office of the Federal Register, 11:31 a.m., September 29, 2004]","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including section 301 of title 3, United States Code, it is hereby ordered as follows: Section 1. Assignment of Functions to the Secretary of Defense.","2":"The Secretary of Defense shall perform, except with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions of the President under the following provisions of title 10, United States Code: (a) subsection 1521(a); (b) the first sentence of subsection 12203(a); (c) the first sentence of subsection 14111(a), except with respect to reports relating to the grades of brigadier general or above, or rear admiral (lower half) or above; and (d) subsection 14310(a), except with respect to removals relating to a promotion list for grades of brigadier general or above, or rear admiral (lower half) or above. Sec. 2. Assignment of Functions to the Secretary of Homeland Security.","3":"The Secretary of Homeland Security shall perform, with respect to the Coast Guard during any period in which it is not operating as a service in the Navy, the functions assigned to the President by the following provisions of the United States Code: (a) subsection 1521(a) of title 10; (b) the first sentence of subsection 12203(a) of title 10; (c) subsection 729(g) of title 14, except with respect to approval of, or removal of a name from, a report relating to the grades of rear admiral (lower half) or above; and (d) subsection 738(a) of title 14, except with respect to removals relating to a promotion list for grades of rear admiral (lower half) or above. Sec. 3. Reassignment of Functions Assigned. The Secretary of Defense and the Secretary of Homeland Security may reassign the functions assigned to them by this order to civilian officers, within their respective departments, who hold a position for which the President makes an appointment by and with the advice and consent of the Senate, except that the Secretary of Defense and the Secretary of Homeland Security may not reassign the functions assigned by sections 1(b) and 2(b), respectively. The Secretary of Defense may not reassign the function assigned by section 1(c) of this order except to such an officer within the Office of the Secretary of Defense (as defined in section 131(b) of title 10). Sec. 4. General Provisions.","4":"(a) This order shall take effect on October 1, 2004."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":null,"military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO17":{"metadata":{"president":"Donald J. Trump","date":"March 27, 2020","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the National Emergencies Act (50 U.S.C. 1601 et seq.), and in furtherance of Proclamation 9994 of March 13, 2020 (Declaring a National Emergency Concerning the Novel Coronavirus Disease (COVID–19) Outbreak), which declared a national emergency by reason of the threat that the novel (new) coronavirus known as SARS–CoV–2 poses to our Nation's healthcare systems, I hereby order as follows:\n\nSection 1. Emergency Authority. To provide additional authority to the Secretaries of Defense and Homeland Security to respond to the national emergency declared by Proclamation 9994, the authorities under section 12302 of title 10, United States Code, and sections 2127, 2308, 2314, and 3735 of title 14, United States Code, are invoked and made available, according to their terms, to the Secretaries of Defense and Homeland Security. The Secretaries of the Army, Navy, and Air Force, at the direction of the Secretary of Defense, and the Secretary of Homeland Security with respect to the Coast Guard when it is not operating as a service in the Navy, are authorized to order to active duty not to exceed 24 consecutive months, such units, and individual members of the Ready Reserve under the jurisdiction of the Secretary concerned, not to exceed 1,000,000 members on active duty at any one time, as the Secretary of Defense and, with respect to the Coast Guard when it is not operating as a service in the Navy, the Secretary of Homeland Security consider necessary. The Secretary of Defense or the Secretary of Homeland Security, as applicable, will ensure appropriate consultation is undertaken with relevant state officials with respect to the utilization of National Guard Reserve Component units activated under this authority.\n\nSec. 2. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This order shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This order is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nDONALD J. TRUMP\n\nThe White House,\n\nMarch 27, 2020.","chunks":{"1":"By the authority vested in me as President by the Constitution and the laws of the United States of America, including the National Emergencies Act (50 U.S.C. 1601 et seq.), and in furtherance of Proclamation 9994 of March 13, 2020 (Declaring a National Emergency Concerning the Novel Coronavirus Disease (COVID–19) Outbreak), which declared a national emergency by reason of the threat that the novel (new) coronavirus known as SARS–CoV–2 poses to our Nation's healthcare systems, I hereby order as follows: Section 1. Emergency Authority. To provide additional authority to the Secretaries of Defense and Homeland Security to respond to the national emergency declared by Proclamation 9994, the authorities under section 12302 of title 10, United States Code, and sections 2127, 2308, 2314, and 3735 of title 14, United States Code, are invoked and made available, according to their terms, to the Secretaries of Defense and Homeland Security. The Secretaries of the Army, Navy, and Air Force, at the direction of the Secretary of Defense, and the Secretary of Homeland Security with respect to the Coast Guard when it is not operating as a service in the Navy, are authorized to order to active duty not to exceed 24 consecutive months, such units, and individual members of the Ready Reserve under the jurisdiction of the Secretary concerned, not to exceed 1,000,000 members on active duty at any one time, as the Secretary of Defense and, with respect to the Coast Guard when it is not operating as a service in the Navy, the Secretary of Homeland Security consider necessary. The Secretary of Defense or the Secretary of Homeland Security, as applicable, will ensure appropriate consultation is undertaken with relevant state officials with respect to the utilization of National Guard Reserve Component units activated under this authority. Sec. 2. General Provisions. (a) Nothing in this order shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO19":{"metadata":{"president":"Lyndon B. Johnson","date":"April 20, 1967","type":"executive_order"},"text":"By virtue of the authority vested in me by section 301 of Title 3 of the United States Code and by section 2 of the Act of July 7, 1958 (72 Stat. 327), it is ordered as follows:\n\nPART I—GENERAL\n\nSECTION 101. (a) As used in this order, the terms \"agency\", \"employee\", \"Government\", and \"training\" have the meanings given to those terms, respectively, by section 4101 of Title 5, United States Code.\n\n(b) \"Interagency training\" means training provided by one agency for other agencies or shared by two or more agencies.\n\nSEC. 102. It is the policy of the Government of the United States to develop its employees through the establishment and operation of progressive and efficient training programs, thereby improving public service, increasing efficiency and economy, building and retaining a force of skilled and efficient employees, and installing and using the best modern practices and techniques in the conduct of the Government's business.\n\nSEC. 103. The Civil Service Commission shall provide leadership and guidance to insure that the policy set forth in section 102 is carried out.\n\nPART II—CIVIL SERVICE COMMISSION RESPONSIBILITIES\n\nSEC. 201. The Civil Service Commission shall plan and promote the development, improvement, coordination, and evaluation of training in accordance with chapter 41 of Title 5, United States Code, and with the policy set forth in section 102 of this order.\n\nSEC. 202. In carrying out its responsibilities under chapter 41 of Title 5, United States Code, and section 201 of this order, the Commission shall:\n\n(a) Advise the President on means for furthering and strengthening programs of training;\n\n(b) Counsel heads of agencies and other agency officials on the improvement of training;\n\n(c) Assist agencies to develop sound programs and financial plans for training and provide advice, information, and assistance to agencies on planning, programming, budgeting, operating, and evaluating training programs;\n\n(d) Identify functional areas in which new or expanded interagency training activity is needed and either conduct such training or arrange for agencies having the substantive competence to do so;\n\n(e) Coordinate interagency training conducted by and for agencies (including agencies and portions of agencies excepted by section 4102(a) of Title 5, United States Code);\n\n(f) Encourage agencies to make appropriate use of non-Government training resources;\n\n(g) Develop, install, and maintain a system to provide the training data needed to carry out its own functions and to provide staff assistance to the President; and\n\n(h) Provide for identification and dissemination of findings of research into training technology and undertake, or assign to other agencies, such research projects as may be needed.\n\nPART III—AGENCY RESPONSIBILITIES AND OPERATIONS\n\nSEC. 301. The head of each agency shall plan, program, budget, operate, and evaluate training programs in accordance with chapter 41 of Title 5, United States Code, and with the policy set forth in section 102 of this order.\n\nSEC. 302. The head of each agency shall:\n\n(a) Foster employee self-development by creating a work environment in which self-development is encouraged, by assuring that opportunities for training and self-study materials are reasonably available where the employee is stationed, and by recognizing self-initiated improvement in performance;\n\n(b) Provide training for employees without regard to race, creed, color, national origin, sex, or other factors unrelated to the need for training;\n\n(c) Establish and make full use of agency facilities for training employees;\n\n(d) Extend agency training programs to employees of other agencies (including agencies and portions of agencies excepted by section 4102(a) of Title 5, United States Code) and assign his employees to interagency training whenever this will result in better training, improved service, or savings to the Government;\n\n(e) Establish interagency training facilities in areas of substantive competence as arranged by the Civil Service Commission; and\n\n(f) Use non-Government training resources as appropriate.\n\nSEC. 303. In carrying out his responsibilities, the head of each agency shall, consonant with chapter 41 of Title 5, United States Code, this order, and regulations of the Civil Service Commission:\n\n(a) Review periodically, but not less often than annually, the agency's program to identify training needed to bring about more effective performance at the least possible cost;\n\n(b) Conduct periodic reviews of individual employee's training needs as related to program objectives;\n\n(c) Conduct research related to training objectives and required for program improvement and effectiveness;\n\n(d) Plan, program, and evaluate training for both short and long-range program needs by occupations,. organizations, or other appropriate groups;\n\n(e) Establish priorities for needed training, and provide for the use of funds and manhours in accordance with these priorities;\n\n(f) Utilize the flexibility of work assignments to provide work experience which promotes growth leading to higher quality and greater quantity of work done;\n\n(g) Establish training facilities and services as needed;\n\n(h) Monitor the effectiveness with which self-development is encouraged and on-the-job training is provided at all levels;\n\n(i) Establish criteria for the selection of employees for training; and\n\n(j) Approve the acceptance of any contributions, awards, or payments to employees authorized by section 401 (b) of this order and regulations issued by the Civil Service Commission.\n\nPART IV—DELEGATIONS\n\nSEC. 401. The following functions vested in the President are hereby delegated to the Civil Service Commission:\n\n(a) The authority under section 4102(b) (1) of Title 5, United States Code, to designate any agency or part thereof, or any employee or employees therein, as excepted from any provision of chapter 41 of Title 5, United States Code, other than sections 4102, 4111 (b), and 4112; and to designate any such agency or part thereof, or any employee or employees therein previously excepted, as again subject to chapter 41 of Title 5, United States Code, or any provision of that chapter.\n\n(b) The authority under section 4111(a) of Title 5, United States Code, to fix by regulation the extent to which the contributions, awards, and payments referred to in that section may be made to and accepted by employees.\n\nSEC. 402. The authority vested in the President by section 4101(6) (B) of Title 5, United States Code, to designate a foreign government or international organization or instrumentality of either as eligible to provide training, is hereby delegated to the head of each agency for his employees except that each such designation shall be made only after the agency head concerned has obtained and given due consideration to the advice of the Department of State thereon prior to the first use of such training facility and thereafter periodically but not less often than once every three years.\n\nPART V—REVOCATION OF PRIOR ORDER\n\nSEC. 501. Executive Order No. 10800 of January 15, 1959, is hereby revoked.\n\nLYNDON B. JOHNSON\n\nThe White House\n\nApril 20, 1967","chunks":{"1":"By virtue of the authority vested in me by section 301 of Title 3 of the United States Code and by section 2 of the Act of July 7, 1958 (72 Stat. 327), it is ordered as follows: PART I—GENERAL SECTION 101. (a) As used in this order, the terms \"agency\", \"  fix by regulation the extent to which the contributions, awards, and payments referred to in that section may be made to and accepted by employees. SEC. 402.","6":"The authority vested in the President by section 4101(6) (B) of Title 5, United States Code, to designate a foreign government or international organization or instrumentality of either as eligible to provide training, is hereby delegated to the head of each agency for his employees except that each such designation shall be made only after the agency head concerned has obtained and given due consideration to the advice of the Department of State thereon prior to the first use of such training facility and thereafter periodically but not less often than once every three years. PART V—REVOCATION OF PRIOR ORDER SEC. 501.","7":"Executive Order No. 10800 of January 15, 1959, is hereby revoked."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":null},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"},"5":{"code":"1","diplomacy":"no","military_ops":"no"},"6":{"code":"1","diplomacy":"no","military_ops":"no"},"7":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO20":{"metadata":{"president":"Joseph R. Biden, Jr.","date":"January 14, 2025","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and the laws of the United States of America, it is hereby ordered as follows:\n\nSection 1. Purpose. Artificial intelligence (AI) is a defining technology of our era. Recent advancements in AI demonstrate its rapidly growing relevance to national security, including with respect to logistics, military capabilities, intelligence analysis, and cybersecurity. Building AI in the United States will help prevent adversaries from gaining access to, and using, powerful future systems to the detriment of our military and national security. It will also enable the United States Government to continue harnessing AI in service of national-security missions while preventing the United States from becoming dependent on other countries' infrastructure to develop and operate powerful AI tools.\n\nAdvances at the frontier of AI will also have significant implications for United States economic competitiveness. These imperatives require building AI infrastructure in the United States on the time frame needed to ensure United States leadership over competitors who, already, are racing to take the lead in AI development and adoption. Building AI in the United States requires enormous private-sector investments in infrastructure, especially for the advanced computing clusters needed to train AI models and the energy infrastructure needed to power this work. Already, AI's electricity and computational needs are vast, and they are set to surge in the years ahead. This work also requires secure, reliable supply chains for critical components needed to build AI infrastructure, from construction materials to advanced electronics.\n\nThis order sets our Nation on the path to ensure that future frontier AI can, and will, continue to be built here in the United States. In building domestic AI infrastructure, our Nation will also advance its leadership in the clean energy technologies needed to power the future economy, including geothermal, solar, wind, and nuclear energy; foster a vibrant, competitive, and open technology ecosystem in the United States, in which small companies can compete alongside large ones; maintain low consumer electricity prices; and help ensure that the development of AI infrastructure benefits the workers building it and communities near it.\n\nWith this order, I provide a plan for protecting national security, preserving our economic competitiveness, revitalizing our energy infrastructure, and ensuring United States leadership in AI.\n\nSec. 2. Policy. It is the policy of the United States to enable the development and operation of AI infrastructure, including data centers, in the United States in accordance with five guiding principles. When undertaking the actions set forth in this order, executive departments and agencies (agencies) shall adhere to these principles, as appropriate and consistent with applicable law:\n\n(a) The development of AI infrastructure should advance United States national security and leadership in AI. Meeting this goal will require steps by the Federal Government, in collaboration with the private sector, to advance AI development and use AI for future national-security missions, including through the work described in National Security Memorandum 25 of October 24, 2024 (Advancing the United States' Leadership in Artificial Intelligence; Harnessing Artificial Intelligence to Fulfill National Security Objectives; and Fostering the Safety, Security, and Trustworthiness of Artificial Intelligence) (NSM-25). It will also require the use of safeguards to improve the cyber, supply-chain, and physical security of the laboratories at which powerful AI is developed, stored, and used. Additionally, protecting United States national security will require further work to evaluate and manage risks related to the powerful capabilities that future frontier AI may possess.\n\n(b) The development of AI infrastructure should advance United States economic competitiveness, including by fostering a vibrant technology ecosystem. Already, AI is creating new jobs and industries, and its effects are being felt in sectors across the economy. The Federal Government must ensure that the United States remains competitive in the global economy, including through harnessing the benefits of this technology for all Americans. It must also promote a fair, open, and competitive AI ecosystem so that small developers and entrepreneurs can continue to drive innovation—a priority highlighted in both Executive Order 14110 of October 30, 2023 (Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence), and NSM-25—as well as to support secure, reliable supply-chain infrastructure for AI activities.\n\n(c) The United States can and should lead the world in operating the next generation of AI data centers with clean power. Meeting this goal will require building on recent successes to modernize our Nation's energy infrastructure; improve permitting processes; and support investments in, and expeditious development of, both currently available and emerging clean energy technologies, such as geothermal energy, nuclear energy, and long-duration energy storage used to store clean energy, as well as relevant supply chains. The United States must not be surpassed in its support for the development, commercialization, and operation of clean energy technologies at home and abroad, and the rapid buildout of AI infrastructure offers another vital opportunity to accelerate and deploy these energy technologies. To help ensure that new data center electricity demand does not take clean power away from other end users, result in resource adequacy issues, or increase grid emissions, the construction of AI infrastructure must be matched with new, clean electricity generation resources.\n\n(d) The development of AI infrastructure should proceed without raising energy costs for American consumers and businesses, and it should have strong community support. The companies developing, commercializing, and deploying AI must finance the cost of building the infrastructure needed for AI operations, including the development of next-generation power infrastructure built for these operations.\n\n(e) The development of AI infrastructure should benefit those working to build it. Meeting this goal will require high labor standards and safeguards for the buildout of AI infrastructure, consultation and close collaboration with communities affected by this infrastructure's development and operation, and continuous work to mitigate risks and potential harms. The American people more broadly must safely enjoy the gains and opportunities from technological innovation in the AI ecosystem.\n\nSec. 3. Definitions. For purposes of this order:\n\n(a) The term \"agency\" means each agency described in 44 U.S.C. 3502(1), except for the independent regulatory agencies described in 44 U.S.C. 3502(5).\n\n(b) The term \"AI data center\" means a data center used primarily with respect to developing or operating AI.\n\n(c) The term \"AI infrastructure\" refers collectively to AI data centers, generation and storage resources procured to deliver electrical energy to data centers, and transmission facilities developed or upgraded for the same purpose.\n\n(d) The term \"AI model\" means a component of an information system that implements AI technology and uses computational, statistical, or machine-learning techniques to produce outputs from a given set of inputs.\n\n(e) The term \"clean energy\" or \"clean energy generation resources\" means generation resources that produce few or no emissions of carbon dioxide during operation, including when paired with clean storage technologies. This term includes geothermal, nuclear fission, nuclear fusion, solar, wind, hydroelectric, hydrokinetic (including tidal, wave, and current), and marine energy; and carbon capture, utilization, and storage technologies (for which the carbon capture equipment meets the definition set forth in 26 C.F.R. 1.45Q-2(c)) that operate with fossil fuel generation resources, that achieve carbon dioxide capture rates of 90 percent or higher on an annual basis, and that permanently sequester the captured carbon dioxide.\n\n(f) The term \"clean power\" means electricity generated by the generation resources described in subsection (e) of this section.\n\n(g) The term \"clean repowering\" means the practice of siting new clean generation sources at a site with an existing point of interconnection and generation sources operating with fossil fuels, such that some output or capacity from existing generation sources is replaced by the new clean generation sources.\n\n(h) The term \"critical electric infrastructure information\" has the same meaning as set forth in 18 C.F.R. 388.113(c).\n\n(i) The term \"data center\" means a facility used to store, manage, process, and disseminate electronic information for a computer network, and it includes any facility that is composed of one or more permanent or semi-permanent structures, or that is a dedicated space within such structure, and operates persistently in a fixed location; that is used for the housing of information technology equipment, including servers, mainframe computers, high-performance computing devices, or data-storage devices; and that is actively used for the hosting of information and information systems that are accessed by other systems or by users on other devices.\n\n(j) The term \"distributed energy resource\" has the same meaning as set forth in 18 C.F.R. 35.28(b)(10).\n\n(k) The term \"Federal Permitting Agencies\" refers to the agency members of the Federal Permitting Improvement Steering Council (Permitting Council) established under section 41002 of the Fixing America's Surface Transportation (FAST) Act, 42 U.S.C. 4370m-1, as well as any other agency with authority to issue a Federal permit or approval required for the development or operation of AI infrastructure.\n\n(l) The term \"Federal Risk and Authorization Management Program\" refers to the program established to provide an approach for the adoption and use of cloud services by the Federal Government, as codified in 44 U.S.C. 3607-3616 (as enacted by the FedRAMP Authorization Act, section 5921 of Public Law 117-263).\n\n(m) The term \"frontier AI data center\" means an AI data center capable of being used to develop, within a reasonable time frame, an AI model with characteristics related either to performance or to the computational resources used in its development that approximately match or surpass the state of the art at the time of the AI model's development.\n\n(n) The term \"frontier AI infrastructure\" means AI infrastructure for which the relevant data center is a frontier AI data center.\n\n(o) The term \"frontier AI training\" refers to the act of developing an AI model with characteristics related either to performance or to the computational resources used in its development that approximately match or surpass the state of the art at the time of the AI model's development.\n\n(p) The term \"generation resource\" means a facility that produces electricity.\n\n(q) The terms \"interconnection,\" \"interconnection facilities,\" and \"point of interconnection\" refer to facilities and equipment that physically and electrically connect generation resources or electrical load to the electric grid for the purpose of the delivery of electricity, for which grid operators have granted all appropriate approvals required for those facilities and equipment to operate.\n\n(r) The term \"lab-security measures\" refers to steps to detect, prevent, or mitigate physical, cyber, or other threats to the operation of a data center, to the integrity of information or other assets stored within it, or of unauthorized access to such information or assets.\n\n(s) The term \"leading-edge logic semiconductors\" refers to semiconductors produced at high volumes using extreme ultraviolet lithography tools as defined by the CHIPS Incentives Program Notice of Funding Opportunity, 2023-NIST-CHIPS-CFF-01.\n\n(t) The term \"model weight\" means a numerical parameter within an AI model that helps determine the model's outputs in response to inputs.\n\n(u) The term \"new source review\" refers to the permitting program with this name in 40 C.F.R. parts 51 or 52.\n\n(v) The term \"non-Federal parties\" refers to private-sector entities that enter into a contract with the Department of Defense or the Department of Energy pursuant to section 4(g) of this order.\n\n(w) The term \"priority geothermal zone\" refers to lands with high potential for the development of geothermal power generation resources, as designated by the Secretary of the Interior, including pursuant to section 4(c) of this order.\n\n(x) The term \"project labor agreement\" means a pre-hire collective bargaining agreement that establishes the terms and conditions of a construction project.\n\n(y) The term \"surplus interconnection service\" has the same meaning as set forth in Federal Energy Regulatory Commission Order No. 845.\n\n(z) The terms \"transmission facilities\" and \"transmission infrastructure\" mean equipment or structures, including transmission lines and related facilities, used for the purpose of delivering electricity.\n\n(aa) The term \"transmission organization\" refers to a Regional Transmission Organization or an Independent System Operator.\n\n(bb) The term \"transmission provider\" means an entity that manages or operates transmission facilities for the delivery of electric energy used primarily by the public and that is not a transmission organization.\n\n(cc) The term \"waters of the United States\" has the same meaning as set forth in 33 C.F.R. 328.3(a).\n\nSec. 4. Establishing Federal Sites for AI Infrastructure. (a) By February 28, 2025, the Secretary of Defense and the Secretary of Energy shall, if possible, each identify a minimum of 3 sites on Federal land managed by their respective agencies that may be suitable for the agencies to lease to non-Federal entities for the construction and operation of a frontier AI data center, as well as for the construction and operation of clean energy facilities to serve the data center, by the end of 2027. In identifying these sites, each Secretary shall, as feasible and appropriate, seek to prioritize sites that possess the following characteristics, as consistent with the objective of fully permitting and approving work to construct a frontier AI data center at each site by the end of 2025:\n\n(i) inclusion of sufficient terrain with appropriate land gradients, soil durability, and other topographical characteristics for frontier AI data centers;\n\n(ii) minimized adverse effects from AI infrastructure development or operation on local communities' health, wellbeing, and resource access; natural or cultural resources; threatened or endangered species; and harbors or river improvements not associated with hydropower generation resources;\n\n(iii) proximity to any communities seeking to host AI infrastructure, including for reasons related to local workers' access to jobs involved in designing, building, maintaining, and operating data centers;\n\n(iv) ready access and proximity to high-voltage transmission infrastructure that minimizes the scale of, cost of, and timeline to develop any transmission upgrades or development needed to interconnect AI infrastructure, in consideration of access and proximity to:\n\n(A) high-capacity transmission infrastructure with unused capacity, as identified by collection activities described in section 6 of this order;\n\n(B) any planned generation facilities that can enable delivery of electricity to an AI data center on the site managed by each Secretary's respective agency, that possess an executed interconnection agreement with a transmission provider, that do not possess an executed power purchase agreement, and for which construction has not yet begun;\n\n(C) any lands that the Secretary of the Interior identifies pursuant to subsection (c) of this section; and\n\n(D) any power generation facilities with high clean repowering potential;\n\n(v) location within geographic areas that are not at risk of persistently failing to attain National Ambient Air Quality Standards, and where the total cancer risk from air pollution is at or below the national average according to the Environmental Protection Agency's (EPA's) 2020 AirToxScreen;\n\n(vi) lack of proximity to waters of the United States for purposes of permitting requirements;\n\n(vii) lack of extensive restrictions on land uses associated with constructing and operating AI infrastructure or on access to necessary rights-of-way for such activities;\n\n(viii) ready access to high-capacity telecommunications networks;\n\n(ix) suitability for the development of access roads or other temporary infrastructure necessary for the construction of AI infrastructure; and\n\n(x) absence of other characteristics that would, if the site was used or repurposed for AI infrastructure, compromise a competing national security concern as determined by the relevant Secretary in consultation with the Assistant to the President for National Security Affairs.\n\n(b) By March 15, 2025, the Secretary of the Interior, acting through the Director of the Bureau of Land Management (BLM), in consultation with the Secretary of Defense, the Secretary of Energy, and the Chair of the Federal Energy Regulatory Commission, shall identify sites managed by BLM that the Secretary of the Interior, acting through the Director of BLM, deems may be suitable for granting or issuing rights of way to private-sector entities to construct and operate additional clean energy facilities that are being or may be built as components of frontier AI infrastructure developed pursuant to this section. In performing this work, the Secretary of the Interior, in consultation with the Secretary of Defense and the Secretary of Energy, shall take steps to ensure where feasible and appropriate that any such sites identified under this subsection include sufficient acreage for developing clean generation resources that can deliver sufficient electricity to each site identified under subsection (a) of this section for matching the capacity needs of frontier AI data centers on the latter sites. The sites identified under this subsection shall include any land managed by the Department of the Interior that is within a region designated by the Secretary of the Interior under subsection (c) of this section, or a region preliminarily identified as a candidate for such designation. In determining the suitability of sites, the Secretary of the Interior, acting through the Director of BLM, shall prioritize identification of sites that:\n\n(i) contain completed, permitted, or planned clean generation projects that can enable delivery of electricity as described in this subsection and possess an executed interconnection agreement with a transmission provider;\n\n(ii) have been allocated as available for solar applications in the Final Programmatic Environmental Impact Statement and Proposed Resource Management Plan Amendments for Utility-Scale Solar Energy Development, published by BLM, or that have otherwise been allocated as available for clean-energy applications in a BLM resource management plan;\n\n(iii) have reasonable access to and are located nearby existing high-voltage transmission lines that have at least one gigawatt of additional capacity available, or for which such capacity can be reasonably developed through reconductoring, grid-enhancing technologies, or transmission upgrades;\n\n(iv) possess the characteristics described in subsections (a)(i)-(x) of this section, in a manner that is consistent with the objective of fully permitting and approving work to construct utility-scale power facilities on a timeline that allows for the operation of those facilities by the end of 2027 or as soon as feasible thereafter; and\n\n(v) possess other characteristics conducive to enabling new clean power development at such sites to contribute to lower regional electricity prices or to bring other community benefits.\n\n(c) By March 15, 2025, the Secretary of the Interior, acting through the Director of BLM and in consultation with the Secretary of Energy, shall, if possible, designate at least five regions composed of lands or subsurface areas managed by the Department of the Interior as Priority Geothermal Zones (PGZs). The Secretary of the Interior shall designate those regions based on their potential for geothermal power generation resources, including hydrothermal and next-generation geothermal power and thermal storage; diversity of geological characteristics; and possession of the characteristics described in subsections (a)(i)-(x) and (b)(i)-(v) of this section.\n\n(d) The Secretary of Defense, the Secretary of Energy, and the Secretary of the Interior shall each make a legal determination as to whether each site identified pursuant to subsections (a) and (b) of this section is available for lease or for the issuance of a right of way, as appropriate, pursuant to the authority of the Secretary that made the identification, and as to whether the Secretary has the legal authority to lease or grant a right of way over or upon each site identified for the construction of frontier AI infrastructure. For purposes of this order, a site shall be considered \"cleared\" under this subsection if the relevant Secretary has determined that the site is available for lease and the Secretary concerned has the authority to lease it.\n\n(e) By March 31, 2025, the Secretary of Defense and the Secretary of Energy, in coordination with the heads of any other agencies that either Secretary deems appropriate, shall coordinate to design, launch, and administer competitive public solicitations of proposals from non-Federal entities to lease Federal land to construct frontier AI infrastructure, including frontier AI data centers, on sites identified under subsection (a) of this section and cleared under subsection (d) of this section, if any. When issuing the solicitations, the Secretaries shall announce the sites identified under subsection (a) of this section and cleared under subsection (d) of this section, if any, and additional relevant information including the sites' geographic coordinates, technical characteristics, proximity to sites identified consistent with subsection (b) of this section and cleared under subsection (d) of this section, if any, and other relevant information. The solicitations shall, to the extent consistent with applicable law and to the extent the Secretaries agree that such requirements promote national defense, national security, or the public interest, as appropriate, require applicants to identify particular sites on which they propose to construct and operate frontier AI infrastructure; submit a detailed plan specifying proposed timelines, financing methods, and technical construction plans associated with such construction work, including a contingency plan for decommissioning infrastructure on Federal sites; submit a plan that describes proposed frontier AI training work to occur at the site once operational; submit a plan for detailing the extent of the use of high labor and construction standards as described in subsection (g)(viii) of this section; and submit a plan with proposed lab-security measures, including personnel and material access requirements, that could be associated with the operation of frontier AI infrastructure. These requirements should be designed to ensure adequate collection of information from applicants regarding the criteria in subsections (g)(i)-(xvi) of this section. The solicitations shall close within 30 days of their issuance.\n\n(f) By March 31, 2025, the Secretary of the Interior, in consultation with the Secretary of Defense and the Secretary of Energy, shall publicize the sites identified under subsection (b) of this section and cleared under subsection (d) of this section, if any, and additional relevant information including the sites' geographic coordinates, technical characteristics, proximity to sites identified consistent with subsection (a) of this section and cleared under subsection (d) of this section, if any, and other relevant information.\n\n(g) By June 30, 2025, the Secretary of Defense and the Secretary of Energy shall announce any winning proposals identified through solicitations described in subsection (e) of this section. In selecting any winning proposals, the Secretary of Defense and the Secretary of Energy shall, in consultation with each other, assign winners the opportunity to apply for any Federal permits needed to build and operate frontier AI infrastructure pursuant to the frameworks described in subsection (h) of this section on any sites included in the solicitations issued under subsection (e) of this section, as the Secretaries deem appropriate. The Secretaries shall consult with the Attorney General on the implications of selections on the competition and market-structure characteristics of the broader AI ecosystem. The Chair of the Federal Trade Commission is encouraged to participate in these consultations. The Secretaries shall, to the extent consistent with applicable law and to the extent that the Secretaries assess that the requirement promotes national defense, national security, or the public interest, as appropriate, select at least one proposal developed and sub
