 the Secretary may establish.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-first day of June, in the year of our Lord nineteen hundred and ninety-three, and of the Independence of the United States of America the two hundred and seventeenth.\n\nWILLIAM J. CLINTON","chunks":{"1":"In light of the political and economic crisis in Zaire, I have determined that it is in the interests of the United States to restrict the entrance into the United States as immigrants and nonimmigrants of certain Zairian nationals who formulate or implement policies that impede Zaire's transition to democracy or who benefit from such policies, and the immediate families of such persons.","2":"Now, Therefore, I, William J. Clinton, by the power vested in me as President by the Constitution and laws of the United States of America, including section 212 (f) of the Immigration and Nationality Act of 1952, as amended (8 U.S.C. 1182(f)), and section 301 of title 3, United States Code, hereby find that the unrestricted immigrant and nonimmigrant entry into the United States of persons described in section 1 of this proclamation would, except as provided for in section 2 or 3 of this proclamation, be detrimental to the interests of the United States. 1, therefore,","3":"The entry into the United States as immigrants and nonimmigrants of persons who formulate, implement, or benefit from policies that impede Zaire's transition to democracy, and the immediate family members of such persons, is hereby suspended. Sec. 2. Section 1 shall not apply with respect to any person otherwise covered by section 1 where entry of such person would not be contrary to the interests of the United States. Sec. 3. Persons covered by sections 1 and 2 shall be identified pursuant to procedures established by the Secretary of State, as authorized in section 6 below. Sec. 4. Nothing in this proclamation shall be construed to derogate from United States Government obligations under applicable international agreements. Sec.5. This proclamation is effective immediately and shall remain in effect until of State determines that it is no longer necessary and should be terminated. Sec. 6. The Secretary of State shall have responsibility to implement this proclamation pursuant to procedures the Secretary may establish."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P49":{"metadata":{"president":"George W. Bush","date":"December 31, 2008","type":"proclamation"},"text":"By the President of the United States of America\n\nA Proclamation\n\n1. On April 22, 1985, the United States and Israel entered into the Agreement on the Establishment of a Free Trade Area between the Government of the United States of America and the Government of Israel (USIFTA), which the Congress approved in the United States-Israel Free Trade Area Implementation Act of 1985 (the \"USIFTA Act\") (19 U.S.C. 2112 note).\n\n2. In order to maintain the general level of reciprocal and mutually advantageous concessions with respect to agricultural trade with Israel, on July 27, 2004, the United States entered into an agreement with Israel concerning certain aspects of trade in agricultural products during the period January 1, 2004, through December 31, 2008 (the \"2004 Agreement\"). The 2004 Agreement reflects an effort by the United States and Israel to address, through 2008, their continuing differences over the meaning of certain provisions in the USIFTA governing access for U.S. agricultural products to Israel's market.\n\n3. Section 4(b) of the USIFTA Act provides that, whenever the President determines that it is necessary to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, the President may proclaim such withdrawal, suspension, modification, or continuance of any duty, or such continuance of existing duty-free or excise treatment, or such additional duties as the President determines to be required or appropriate to carry out the USIFTA.\n\n4. In Proclamation 7826 of October 4, 2004, consistent with the 2004 Agreement, I proclaimed modifications to the Harmonized Tariff Schedule of the United States (HTS) to provide duty-free access into the United States through December 31, 2008, for specified quantities of certain agricultural products of Israel.\n\n5. On December 10, 2008, the United States entered into an agreement with Israel to extend the period that the 2004 Agreement is in force through December 31, 2009, to allow additional time for the two governments to conclude an agreement to replace the 2004 Agreement.\n\n6. Pursuant to section 4(b) of the USIFTA Act, I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, to provide duty-free access into the United States through the close of December 31, 2009, for specified quantities of certain agricultural products of Israel.\n\n7. On June 6, 2003, the United States and Chile entered into the United States-Chile Free Trade Agreement (USCFTA). The Congress approved the USCFTA in section 101(a) of the United States-Chile Free Trade Agreement Implementation Act (the \"USCFTA Act\") (19 U.S.C. 3805 note). In Proclamation 7746 of December 30, 2003, I proclaimed the tariff treatment called for under the USCFTA.\n\n8. Section 201(b) of the USCFTA Act authorizes the President, subject to the consultation and layover requirements of section 103(a) of the USCFTA Act, to proclaim such modifications to the staging of duty treatment set forth in Annex 3.3 of the USCFTA as the United States may agree to with Chile, as the President determines to be necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA.\n\n9. On November 26, 2008, the United States entered into an agreement with Chile that includes an accelerated schedule of duty elimination under the USCFTA for specific originating goods of Chile. The consultation and layover requirements of section 103(a) of the USCFTA Act with respect to the accelerated schedule of duty elimination were satisfied as of November 8, 2008.\n\n10. Pursuant to section 201(b) of the USCFTA Act, I have determined that modifications hereinafter proclaimed of rates of duties on originating goods of Chile are necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA and to carry out the agreement with Chile on an accelerated schedule of duty elimination for specific originating goods of Chile.\n\n11. On May 18, 2004, the United States and Australia entered into the United States-Australia Free Trade Agreement (USAFTA). The Congress approved the USAFTA in section 101(a) of the United States-Australia Free Trade Agreement Implementation Act (the \"USAFTA Act\") (19 U.S.C. 3805 note). In Proclamation 7857 of December 20, 2004, I proclaimed the rules of origin called for under the USAFTA.\n\n12. Section 203(o) of the USAFTA Act authorizes the President, subject to the consultation and layover requirements of section 104 of the USAFTA Act, to proclaim such modifications to the rules of origin as are necessary to implement an agreement with Australia pursuant to article 4.2.5 of the USAFTA.\n\n13. On October 10, 2008, the United States entered into an agreement with Australia pursuant to article 4.2.5 of the USAFTA to amend the USAFTA rule of origin for certain yarns of viscose rayon fiber. The consultation and layover requirements of section 104 of the USAFTA Act with respect to the proposed modification of the USAFTA rules of origin were satisfied as of December 24, 2008.\n\n14. Section 604 of the Trade Act of 1974, as amended (the \"1974 Act\") (19 U.S.C. 2483), authorizes the President to embody in the HTS the substance of relevant provisions of that Act, or other acts affecting import treatment, and of actions taken thereunder.\n\nNow, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States of America, including section 4 of the USIFTA Act, section 201(b) of the USCFTA Act, section 203(o) of the USAFTA Act, section 604 of the 1974 Act, and section 301 of title 3, United States Code, do proclaim that:\n\n(1) In order to implement U.S. tariff commitments under the 2004 Agreement through December 31, 2009, the HTS is modified as provided in Annex I to this proclamation.\n\n(2)(a) The modifications to the HTS made by Annex I to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2009.\n\n(b) The provisions of subchapter VIII of chapter 99 of the HTS, as modified by Annex I to this proclamation, shall continue in effect through December 31, 2009.\n\n(3) In order to provide for an accelerated schedule of duty elimination for specific originating goods of Chile, the tariff treatment set forth in the HTS is modified as provided in Annex II to this proclamation.\n\n(4) The modifications made to the HTS by Annex II to this proclamation shall be effective with respect to goods entered, or withdrawn from warehouse for consumption, on or after January 1, 2009.\n\n(5) In order to implement the agreement with Australia to change the USAFTA rules of origin for certain yarns of viscose rayon fiber, the HTS is modified as provided in Annex III to this proclamation.\n\n(6) The modifications made to the HTS by Annex III to this proclamation shall enter into effect on the date that the United States Trade Representative announces in a notice published in the Federal Register that Australia has completed its applicable domestic procedures to give effect to the agreement to change the USAFTA rules of origin for certain yarns of viscose rayon fiber and shall be effective with respect to originating goods of Australia entered, or withdrawn from warehouse for consumption, on or after the date indicated in the notice.\n\n(7) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency.\n\nIn Witness Whereof, I have hereunto set my hand this thirty-first day of December, in the year of our Lord two thousand eight, and of the Independence of the United States of America the two hundred and thirty-third.\n\nGEORGE W. BUSH","chunks":{"1":"In Proclamation 7826 of October 4, 2004, consistent with the 2004 Agreement, I proclaimed modifications to the Harmonized Tariff Schedule of the United States (HTS) to provide duty-free access into the United States through December 31, 2008, for specified quantities of certain agricultural products of Israel. 5. On December 10, 2008, the United States entered into an agreement with Israel to extend the period that the 2004 Agreement is in force through December 31, 2009, to allow additional time for the two governments to conclude an agreement to replace the 2004 Agreement. 6. Pursuant to section 4(b) of the USIFTA Act,","2":"I have determined that it is necessary, in order to maintain the general level of reciprocal and mutually advantageous concessions with respect to Israel provided for by the USIFTA, to provide duty-free access into the United States through the close of December 31, 2009, for specified quantities of certain agricultural products of Israel. 7. On June 6, 2003, the United States and Chile entered into the United States-Chile Free Trade Agreement (USCFTA). The Congress approved the USCFTA in section 101(a) of the United States-Chile Free Trade Agreement Implementation Act (the \"USCFTA Act\") (19 U.S.C. 3805 note).","3":"In Proclamation 7746 of December 30, 2003, I proclaimed the tariff treatment called for under the USCFTA. 8. Section 201(b) of the USCFTA Act authorizes the President, subject to the consultation and layover requirements of section 103(a) of the USCFTA Act, to proclaim such modifications to the staging of duty treatment set forth in Annex 3.3 of the USCFTA as the United States may agree to with Chile, as the President determines to be necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA. 9. On November 26, 2008, the United States entered into an agreement with Chile that includes an accelerated schedule of duty elimination under the USCFTA for specific originating goods of Chile. The consultation and layover requirements of section 103(a) of the USCFTA Act with respect to the accelerated schedule of duty elimination were satisfied as of November 8, 2008. 10. Pursuant to section 201(b) of the USCFTA Act,","4":"I have determined that modifications hereinafter proclaimed of rates of duties on originating goods of Chile are necessary or appropriate to maintain the general level of reciprocal and mutually advantageous concessions with respect to Chile provided for by the USCFTA and to carry out the agreement with Chile on an accelerated schedule of duty elimination for specific originating goods of Chile. 11. On May 18, 2004, the United States and Australia entered into the United States-Australia Free Trade Agreement (USAFTA). The Congress approved the USAFTA in section 101(a) of the United States-Australia Free Trade Agreement Implementation Act (the \"USAFTA Act\") (19 U.S.C. 3805 note).","5":"In Proclamation 7857 of December 20, 2004, I proclaimed the rules of origin called for under the USAFTA. 12. Section 203(o) of the USAFTA Act authorizes the President, subject to the consultation and layover requirements of section 104 of the USAFTA Act, to proclaim such modifications to the rules of origin as are necessary to implement an agreement with Australia pursuant to article 4.2.5 of the USAFTA. 13. On October 10, 2008, the United States entered into an agreement with Australia pursuant to article 4.2.5 of the USAFTA to amend the USAFTA rule of origin for certain yarns of viscose rayon fiber. The consultation and layover requirements of section 104 of the USAFTA Act with respect to the proposed modification of the USAFTA rules of origin were satisfied as of December 24, 2008. 14. Section 604 of the Trade Act of 1974, as amended (the \"1974 Act\") (19 U.S.C. 2483), authorizes the President to embody in the HTS the substance of relevant provisions of that Act, or other acts affecting import treatment, and of actions taken thereunder.","6":"Now, Therefore, I, George W. Bush, President of the United States of America, acting under the authority vested in me by the Constitution and the laws of the United States of America, including section 4 of the USIFTA Act, section 201(b) of the USCFTA Act, section 203(o) of the USAFTA Act, section 604 of the 1974 Act, and section 301 of title 3, United States Code, do proclaim that: (1) In order to implement U.S. tariff commitments under the 2004 Agreement through December 31, 2009, the HTS is modified as provided in Annex I to this proclamation. (2)(a) The modifications to the HTS made by Annex I to this proclamation shall be effective with respect to goods that are the product of Israel and are entered, or withdrawn from warehouse for consumption, on or after January 1, 2009. (b) The provisions of subchapter VIII of chapter 99 of the HTS, as modified by Annex I to this proclamation, shall continue in effect through December 31, 2009. (3) In order to provide for an accelerated schedule of duty elimination for specific originating goods of Chile, the tariff treatment set forth in the HTS is modified as provided in Annex II to this proclamation. (4) The modifications made to the HTS by Annex II to this proclamation shall be effective with respect to goods entered, or withdrawn from warehouse for consumption, on or after January 1, 2009. (5) In order to implement the agreement with Australia to change the USAFTA rules of origin for certain yarns of viscose rayon fiber, the HTS is modified as provided in Annex III to this proclamation. (6) The modifications made to the HTS by Annex III to this proclamation shall enter into effect on the date that the United States Trade Representative announces in a notice published in the Federal Register that Australia has completed its applicable domestic procedures to give effect to the agreement to change the USAFTA rules of origin for certain yarns of viscose rayon fiber and shall be effective with respect to originating goods of Australia entered, or withdrawn from warehouse for consumption, on or after the date indicated in the notice. (7) Any provisions of previous proclamations and Executive Orders that are inconsistent with the actions taken in this proclamation are superseded to the extent of such inconsistency."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"3","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"0","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"0","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"},"5":{"code":"0","diplomacy":"no","military_ops":"no"},"6":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"P50":{"metadata":{"president":"Donald J. Trump","date":"September 25, 2025","type":"proclamation"},"text":"By the President of the United States of America A Proclamation\n\nSince the dawn of our Republic, millions of brave men and women have answered the call of liberty to preserve peace, uphold our sovereignty, and defend the sacred ideals that have defined our Nation for nearly 250 years. Countless souls have perished in this noble pursuit—their supreme sacrifice borne by surviving families with profound sorrow, remarkable strength, and inspiring dignity. This Gold Star Mother's and Family's Day, we remember and honor the loved ones of those patriots who paid the highest price for our birthright of freedom.\n\nThe supreme sacrifice of our fallen heroes is neither solitary nor finite. Instead, it is shared by bereaved families who bury the fallen and wage an unending battle of unfathomable heartache that is not erased by the passage of time. Gold Star Families know better than anyone the tremendous cost of our freedom, paid for by the blood of their beloved husbands, wives, sons, daughters, fathers, and mothers, who forfeited their hopes and dreams so that others may live with peace, safety, and liberty in the greatest country on the face of the Earth. We are eternally grateful for their heroic sacrifice.\n\nLast month, I was proud to meet with the Gold Star Families of the 13 service members who lost their lives in the withdrawal from Afghanistan in 2021. Four years later, these families carry a burden of grief that is compounded by the absence of accountability and compassion from the previous administration. As Commander in Chief, I will never betray our warfighters or turn my back on their families. They deserve our enduring support and respect and an aggressive policy of peace through strength so that fewer families are shattered on the field of battle.\n\nAs we observe Gold Star Mother's and Family's Day, the First Lady and I extend our steadfast love and unwavering devotion to those who bear the unbearable with grace and resilience. May you find comfort in knowing the sacrifice of your hero will never be forgotten.\n\nThe Congress, by Senate Joint Resolution 115 of June 23, 1936 (49 Stat. 1895 as amended), has designated the last Sunday in September as \"Gold Star Mother's Day.\"\n\nNow, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim Sunday, September 28, 2025, as Gold Star Mother's and Family's Day. I call upon all Government officials to display the flag of the United States over Government buildings, and I encourage the American people to display the flag and hold appropriate ceremonies as an expression of our Nation's gratitude and respect.\n\nIn Witness Whereof, I have hereunto set my hand this twenty-fifth day of September, in the year of our Lord two thousand twenty-five, and of the Independence of the United States of America the two hundred and fiftieth.\n\nDONALD J. TRUMP","chunks":{"1":"Now, Therefore, I, Donald J. Trump, President of the United States of America, by virtue of the authority vested in me by the Constitution and the laws of the United States, do hereby proclaim Sunday, September 28, 2025, as Gold Star Mother's and Family's Day.","2":"I call upon all Government officials to display the flag of the United States over Government buildings, and I encourage the American people to display the flag and hold appropriate ceremonies as an expression of our Nation's gratitude and respect."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":null,"military_ops":null},"2":{"code":"0","diplomacy":null,"military_ops":null}},"wp_comment":null}]}},"fields":["code","diplomacy","military_ops"],"fieldLabels":{"code":"Code","diplomacy":"Diplomacy","military_ops":"Mil / ops"},"valueLabels":{"0":"0 – Outside scope","1":"1 – Discretionary / internal","2":"2 – Dictated agency outcome","3":"3 – Self-executing","4":"4 – Unclear / mixed","yes":"Yes","no":"No"}}</script>
<script>
(function(){
'use strict';
var P=JSON.parse(document.getElementById('payload-data').textContent);
var groups=P.groups,annotators=P.annotators,docs=P.docs;
var fields=P.fields,fieldLabels=P.fieldLabels,valueLabels=P.valueLabels;
var mode='directive',activeTab=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function label(v){return v==null?null:(valueLabels[v]||v);}

function rowAgreement(vals){
  var nn=vals.filter(function(v){return v!=null;});
  if(!nn.length)return 'missing';
  return(new Set(nn)).size>1?'disagree':(nn.length<vals.length?'missing':'agree');
}

function docAgreement(docId){
  var d=docs[docId];if(!d)return 'missing';
  var ann=d.annotations;
  var hasMissing=false;
  for(var fi=0;fi<fields.length;fi++){
    var f=fields[fi];
    var vals=ann.map(function(a){return a.directive?(a.directive[f]!=null?a.directive[f]:null):null;});
    var ag=rowAgreement(vals);
    if(ag==='disagree')return 'disagree';
    if(ag==='missing')hasMissing=true;
  }
  return hasMissing?'missing':'agree';
}

function annTable(rowData){
  var out='<table class="ann-table"><thead><tr><th>Field</th>';
  annotators.forEach(function(n){out+='<th>'+esc(n)+'</th>';});
  out+='</tr></thead><tbody>';
  rowData.forEach(function(row){
    var ag=rowAgreement(row.vals);
    out+='<tr class="row-'+ag+'"><td class="field-label">'+esc(row.label)+'</td>';
    row.vals.forEach(function(v){
      var cls='val-cell'+(v==null?' val-missing':'');
      out+='<td class="'+cls+'">'+(v==null?'—':esc(label(v)))+'</td>';
    });
    out+='</tr>';
  });
  return out+'</tbody></table>';
}

function makeRowData(getVal){
  return fields.map(function(f){
    return{field:f,label:fieldLabels[f],vals:annotators.map(function(_,i){return getVal(i,f);})};
  });
}

function directiveTable(ann){
  return annTable(makeRowData(function(i,f){
    var d=ann[i].directive;return d?(d[f]!=null?d[f]:null):null;
  }));
}

function chunkTable(chunkN,ann){
  return annTable(makeRowData(function(i,f){
    var c=ann[i].chunks?ann[i].chunks[chunkN]:null;return c?(c[f]!=null?c[f]:null):null;
  }));
}

function wpComments(ann){
  var items=ann.map(function(a,i){return{who:annotators[i],txt:a.wp_comment};}).filter(function(x){return x.txt;});
  if(!items.length)return '';
  var out='<div class="comments"><div class="comment-heading">Discussion notes</div>';
  items.forEach(function(x){out+='<div class="comment-item"><span class="comment-who">'+esc(x.who)+':</span> '+esc(x.txt)+'</div>';});
  return out+'</div>';
}

function rightCol(docId){
  var d=docs[docId];if(!d)return '<div class="no-chunks">No data.</div>';
  var ann=d.annotations;
  if(mode==='directive')return directiveTable(ann)+wpComments(ann);
  // subdirective
  var ckKeys=Object.keys(d.chunks||{}).sort(function(a,b){return+a-+b;});
  var out='';
  if(!ckKeys.length)out+='<div class="no-chunks">No sub-directive chunks — showing directive-level.</div>';
  else{
    ckKeys.forEach(function(n){
      out+='<div class="chunk-block"><div class="chunk-label">Chunk '+esc(n)+'</div>';
      out+='<div class="chunk-text">'+esc(d.chunks[n])+'</div>';
      out+=chunkTable(n,ann)+'</div>';
    });
  }
  out+=wpComments(ann);
  if(!ckKeys.length)out+=directiveTable(ann);
  return out;
}

function renderDoc(docId){
  var d=docs[docId];if(!d)return '';
  var m=d.metadata||{};
  var ag=docAgreement(docId);
  var badgeText=ag==='agree'?'Agreement':ag==='disagree'?'Disagreement':'Incomplete';
  var colHead=mode==='directive'?'Directive annotation':'Sub-directive annotation';
  return '<details class="doc-card" open>'
    +'<summary>'
    +'<span class="doc-id">'+esc(docId)+'</span>'
    +'<span class="doc-prez">'+esc(m.president||'')+'</span>'
    +'<span class="doc-date">'+esc(m.date||'')+'</span>'
    +'<span class="doc-type">'+esc((m.type||'').replace(/_/g,' '))+'</span>'
    +'<span class="doc-badge '+ag+'">'+badgeText+'</span>'
    +'</summary>'
    +'<div class="doc-body">'
    +'<div class="col"><p class="col-heading">Document text</p><div class="doc-text">'+esc(d.text||'(text not found)')+'</div></div>'
    +'<div class="col"><p class="col-heading">'+esc(colHead)+'</p>'+rightCol(docId)+'</div>'
    +'</div></details>';
}

function renderPanel(){
  var g=groups[activeTab];
  var seen=new Set();
  return g.docs.map(function(id){
    if(seen.has(id))return '';seen.add(id);return renderDoc(id);
  }).join('');
}

function renderTabs(){
  document.getElementById('tab-bar').innerHTML=groups.map(function(g,i){
    return'<button class="tab-btn'+(i===activeTab?' active':'')+'" data-idx="'+i+'" type="button">'
      +esc(g.label)+' <span class="tab-count">('+g.docs.length+')</span></button>';
  }).join('');
}

function render(){renderTabs();document.getElementById('content').innerHTML=renderPanel();}

document.getElementById('tab-bar').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  activeTab=+btn.dataset.idx;render();
});
document.getElementById('btn-directive').addEventListener('click',function(){
  mode='directive';
  document.getElementById('btn-directive').classList.add('active');
  document.getElementById('btn-subdirective').classList.remove('active');
  document.getElementById('content').innerHTML=renderPanel();
});
document.getElementById('btn-subdirective').addEventListener('click',function(){
  mode='subdirective';
  document.getElementById('btn-directive').classList.remove('active');
  document.getElementById('btn-subdirective').classList.add('active');
  document.getElementById('content').innerHTML=renderPanel();
});

render();

function setBarHeight(){
  var h=document.getElementById('tab-bar').getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--bar-height',h+'px');
}
setBarHeight();
window.addEventListener('resize',setBarHeight);
})();
</script>
</body>
</html>
