regulations, the term \"official station\" shall be construed to include any point from which the employee commutes daily to his official post of duty.\n\nSEC. 11. Employees not affected. These regulations shall not apply to: (1) officers and employees transferred in accordance with the provisions of the Foreign Service Act of 1946; or (2) persons whose pay and allowances are established by the Career Compensation Act of 1949. (P.L. 351, 81st Congress.)\n\nSEC. 12. (a) Commutation of expenses-General. In lieu of the payment of actual expenses of transportation, packing, crating, drayage, and unpacking of household goods and personal effects in the case of transfers between points within the continental United States, reimbursement shall be made to the employee on a commuted basis at rates per hundred pounds as fixed by zones in Schedule A which is attached to and made a part of these regulations. The amount payable shall be the product of the applicable rate and the net weight of household goods and personal effects actually transported (within the weight limitation prescribed by section 16 hereof). Where the weight of the household goods transported is less than the minimum weight allowance chargeable under applicable tariffs the employee may be reimbursed to the extent of the minimum tariff requirement. Government bills of lading shall not be used.\n\nSEC. 14. Evidence of shipment. Employees shall be required to submit the original bills of lading, or a certified copy thereof or if no bill of lading is available, other evidence showing point of origin, destination, and weight. In instances in which no proper weighting facilities are readily available at point of origin a constructive weight, based on seven pounds per cubic foot of properly loaded van space, may be used.\n\nSEC. 17. Maximum allowance for transportation. (a) Weight. The actual costs of transportation of the household goods and personal effects of the employee, not in excess of 7,000 pounds net, and of the packing, crates, boxes, lift vans, or other temporary containers required for the shipment, shall be allowed in the case of transfers to or from points outside the continental United States: Provided, That employees who have no immediate family shall be entitled to the transportation of household effects and other personal property not in excess of 2,500 pounds net. Gross weight shall include the net weight of the property and the weight of packing, crates, boxes, or lift vans which have no connection with the property except for the purposes of the immediate shipment and which do not constitute a continuing part of the property of the employee. For the application of the limitations prescribed by this section the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing and crating used for the shipment: Provided, That in case of shipments involving transportation by vessel over all or part of the distance, the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing, crating, boxing, and left vans used for the shipment: And provided further, That when shipment is by motor freight the gross weight of the property shall be the actual weight of the goods transported. Thus, transportation shall be allowed at Government expense for property when packed, crated, boxed, or placed in lift vans for shipment, within the following maximum weights:\n\nPounds\n\nEmployees having immediate family:\n\nShipment involving transportation by vessel over all or\n\npart of route or by rail or motor carriers requiring\n\npacking or crating-------------------------------------------------------- 8,750\n\nShipment by motor carriers of household goods uncrated---------- 7,000\n\nEmployees having no immediate family:\n\nShipment involving transportation by vessel over all or\n\nPart of route or by rail or motor carriers requiring\n\nPacking or crating--------------------------------------------------------- 3,125\n\nShipment by motor carriers of household goods uncrated---------- 2,500\n\n(b) Volume. Where charges for transportation are computed on a basis of measurement rather than weight charges will be allowed regardless of weight for not to exceed 25 measurement tons of forty cubic feet each inclusive of packing, crating, and lift vans: Provided, That employees who have no immediate family shall be allowed charges for not to exceed 9 measurement tons\n\n(c) Weight and volume on same shipment. When shipment must be made over such a route that the transportation necessarily involves charges based upon weight over part of the distance and upon measurement over another part of the distance, the following conditions shall apply: (1) if the weight does not exceed the limitations prescribed in subsection (a) payment shall be allowed for actual charges over the entire distance regardless of whether the measurement is in excess of the limitations imposed by subsection (b); (2) if both weight and measurement are in excess of the prescribed limitations payment shall not be allowed for the excess by weight over that part of the distance where charges are based on weight, or for the excess by measurement over that part of the distance where charges are based on measurement.\n\nSEC. 25. Shipment by American vessels. All shipments of property by water shall be made on ships registered under the laws of the United States whenever such ships are available.\n\nThis order shall be effective in any case in which the travel or transpiration is authorized or approved and commenced on or after September 23, 1950.\n\nHARRY S. TRUMAN\n\nTHE WHITE HOUSE,\n\nDecember 20, 1950","chunks":{"1":"By virtue of authority vested in me by the Act of August 2, 946 (60 Stat. 806), as amended by section 1 of the Act of September 23, 1950, Public Law 830, 81st Congress, it is ordered that Executive Order 9805 of November 25, 1946 and Schedule A attached to and made a part thereof, as amended by Executive Order 9933 of February 27, 1948, Executive Order 9997 of September 8, 1948 and Executive Order 10069 of July 14, 1949, prescribing regulations governing payment of travel and transportation expenses of civilian officers and employees of the United States when transferred from one official station to another for permanent duty, be, and it is hereby, amended with respect to sections 3, 4, 8, 11, 12(a), 14, 17, 25, and Schedule A to read as follows: SEC. 3. Transportation expenses of immediate family.","2":"The transportation of the immediate family of an employee shall be subject to those provisions of the Standardized Government Travel Regulations which relate to transportation, including mileage, and shall be in accordance with section 4 of the Travel Expense Act of 1949, whether the travel originates at the employee's last official station or at some other point or partially at both and whether the pint of destination is the new official station or some other point selected by him, or both. The cost to the Government shall not exceed the cost of transportation by a usually traveled route between the last official station and the new official station. SEC. 4. Payment of expenses. The travel and transportation expenses allowable under these regulations, when authorized or approved by such subordinate official or officials as the head of the department concerned may designate, shall be paid in case of transfer from one official station to another, including transfer from one department to another, for permanent duty, but in no case in which the transfer is made primarily for the convenience or benefit of the employee or at his request. In case of transfer from one department to another such expenses shall be paid from the funds of the department to which the employee is transferred. The expenses of travel and transportation in connection with the transfer of officers and employees to posts of duty outside the continental limits of the United States shall not be allowed unless and until the officer or employee selected for such transfer shall agree in writing to remain in the Government service for twelve months following the effective date of this transfer, unless separated for reasons beyond his control and acceptable to the department or agency concerned. In case of violation of such agreement any moneys expended by the United States on account of such travel and transportation shall be recoverable from the individual concerned as a debt due the United States. The expenses of return travel and transportation upon separation from service shall be allowed whether such separation is for the purposes of the Government or for personal convenience, but shall not be allowed unless such officer or employee transferred to posts of duty outside the continental United States shall have served for a minimum period of not less than one nor more than three years prescribed in advance by the head of the department or agency concerned or unless separation is for reasons beyond the control of the individual and acceptable to the department or agency concerned. SEC. 8. Origin and destination of shipment. The expenses of transportation authorized hereunder or reimbursement on a commuted basis within the continental United States shall be allowable whether the shipment originates at the employee's last official station or at some other point or partially at both or whether the point of destination is the new official station or some other point selected by him, or both: Provided, That the cost to the Government shall not exceed the cost of shipment in one lot by the most economical route from the last official station to the new. No expenses shall be allowable for the transportation of property acquired en route from the last official station to the new. For the purposes of these regulations, the term \"official station\" shall be construed to include any point from which the employee commutes daily to his official post of duty. SEC. 11. Employees not affected. These regulations shall not apply to: (1) officers and employees transferred in accordance with the provisions of the Foreign Service Act of 1946; or (2) persons whose pay and allowances are established by the Career Compensation Act of 1949. (P.L. 351, 81st Congress.) SEC. 12. (a) Commutation of expenses-General. In lieu of the payment of actual expenses of transportation, packing, crating, drayage, and unpacking of household goods and personal effects in the case of transfers between points within the continental United States, reimbursement shall be made to the employee on a commuted basis at rates per hundred pounds as fixed by zones in Schedule A which is attached to and made a part of these regulations. The amount payable shall be the product of the applicable rate and the net weight of household goods and personal effects actually transported (within the weight limitation prescribed by section 16 hereof). Where the weight of the household goods transported is less than the minimum weight allowance chargeable under applicable tariffs the employee may be reimbursed to the extent of the minimum tariff requirement.","3":"Government bills of lading shall not be used. SEC. 14. Evidence of shipment. Employees shall be required to submit the original bills of lading, or a certified copy thereof or if no bill of lading is available, other evidence showing point of origin, destination, and weight. In instances in which no proper weighting facilities are readily available at point of origin a constructive weight, based on seven pounds per cubic foot of properly loaded van space, may be used. SEC. 17. Maximum allowance for transportation. (a) Weight. The actual costs of transportation of the household goods and personal effects of the employee, not in excess of 7,000 pounds net, and of the packing, crates, boxes, lift vans, or other temporary containers required for the shipment, shall be allowed in the case of transfers to or from points outside the continental United States: Provided, That employees who have no immediate family shall be entitled to the transportation of household effects and other personal property not in excess of 2,500 pounds net. Gross weight shall include the net weight of the property and the weight of packing, crates, boxes, or lift vans which have no connection with the property except for the purposes of the immediate shipment and which do not constitute a continuing part of the property of the employee. For the application of the limitations prescribed by this section the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing and crating used for the shipment: Provided, That in case of shipments involving transportation by vessel over all or part of the distance, the net weight of the property shall be considered to be eighty per cent of the combined weight of the property and the packing, crating, boxing, and left vans used for the shipment: And provided further, That when shipment is by motor freight the gross weight of the property shall be the actual weight of the goods transported. Thus, transportation shall be allowed at Government expense for property when packed, crated, boxed, or placed in lift vans for shipment, within the following maximum weights: Pounds Employees having immediate family: Shipment involving transportation by vessel over all or part of route or by rail or motor carriers requiring packing or crating-------------------------------------------------------- 8,750 Shipment by motor carriers of household goods uncrated---------- 7,000 Employees having no immediate family: Shipment involving transportation by vessel over all or Part of route or by rail or motor carriers requiring Packing or crating--------------------------------------------------------- 3,125 Shipment by motor carriers of household goods uncrated---------- 2,500 (b) Volume. Where charges for transportation are computed on a basis of measurement rather than weight charges will be allowed regardless of weight for not to exceed 25 measurement tons of forty cubic feet each inclusive of packing, crating, and lift vans: Provided, That employees who have no immediate family shall be allowed charges for not to exceed 9 measurement tons (c) Weight and volume on same shipment. When shipment must be made over such a route that the transportation necessarily involves charges based upon weight over part of the distance and upon measurement over another part of the distance, the following conditions shall apply: (1) if the weight does not exceed the limitations prescribed in subsection (a) payment shall be allowed for actual charges over the entire distance regardless of whether the measurement is in excess of the limitations imposed by subsection (b); (2) if both weight and measurement are in excess of the prescribed limitations payment shall not be allowed for the excess by weight over that part of the distance where charges are based on weight, or for the excess by measurement over that part of the distance where charges are based on measurement. SEC. 25. Shipment by American vessels. All shipments of property by water shall be made on ships registered under the laws of the United States whenever such ships are available.","4":"This order shall be effective in any case in which the travel or transpiration is authorized or approved and commenced on or after September 23, 1950."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"},"3":{"code":"1","diplomacy":"no","military_ops":"no"},"4":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"},"3":{"code":"3","diplomacy":"no","military_ops":"no"},"4":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"EO32":{"metadata":{"president":"Ronald Reagan","date":"December 24, 1987","type":"executive_order"},"text":"By the authority vested in me as President by the Constitution and laws of the United States, including the Foreign Assistance Act of 1961, as amended, and section 301 of Title 3 of the United States Code, it is hereby ordered that Executive Order No. 12163, as amended, is further amended by inserting at the end of the first sentence of subsection 6 of Section 1-201, the following phrase:\n\n\", and all functions conferred by Section 534 of the Act.\"\n\nRONALD REAGAN\n\nThe White House,\n\nDecember 24, 1987.\n\n[Filed with the Office of the Federal Register, 3:08 p.m., December 28, 1987]","chunks":{"1":"By the authority vested in me as President by the Constitution and laws of the United States, including the Foreign Assistance Act of 1961, as amended, and section 301 of Title 3 of the United States Code, it is hereby ordered that Executive Order No. 12163, as amended,","2":"is further amended by inserting at the end of the first sentence of subsection 6 of Section 1-201, the following phrase: \", and all functions conferred by Section 534 of the Act.\""},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":null,"military_ops":null},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M2":{"metadata":{"president":"George W. Bush","date":"February 07, 2006","type":"memorandum"},"text":"Presidential Determination No. 2006-10\n\nMemorandum for the Secretary of State and the Secretary of Defense\n\nSubject: Determination to Authorize a Drawdown for Afghanistan\n\nPursuant to the authority vested in me by the Constitution and laws of the United States, including section 202 and other relevant provisions of the Afghanistan Freedom Support Act (Public Law 107-327, as amended) and section 506 of the Foreign Assistance Act of 1961, as amended, 22 U.S.C. 2318, I hereby direct the drawdown of up to $16.998 million of defense articles, defense services, and military education and training from the Department of Defense for the Government of Afghanistan. This determination also amends PD 2005-19, signed January 27, 2005, by substituting \"$71.502\" therein for \"$88.5\".\n\nThe Secretary of State is authorized and directed to report this determination to the Congress and to arrange for its publication in the Federal Register.\n\nGeorge W. Bush","chunks":{"1":"Pursuant to the authority vested in me by the Constitution and laws of the United States, including section 202 and other relevant provisions of the Afghanistan Freedom Support Act (Public Law 107-327, as amended) and section 506 of the Foreign Assistance Act of 1961, as amended, 22 U.S.C. 2318, I hereby direct the drawdown of up to $16.998 million of defense articles, defense services, and military education and training from the Department of Defense for the Government of Afghanistan. This determination also amends PD 2005-19, signed January 27, 2005, by substituting \"$71.502\" therein for \"$88.5\"."},"annotations":[{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M4":{"metadata":{"president":"John F. Kennedy","date":"June 22, 1961","type":"memorandum"},"text":"Memorandum for the Heads of Departments and Agencies:\n\nIn response to my urgent request, Congress has recently enacted legislation to raise minimum wages which must be paid by private employers in interstate commerce. Although this legislation specifically exempts the federal government as an employer, I believe that the social and economic reasons underlying this Congressional action are equally compelling and applicable to wage earners employed by federal departments and agencies.\n\nIn my view it is both desirable and in the public interest to establish the same minimum rates of $1.15 an hour, effective September 3, 1961, and $1.25 an hour, effective September 3, 1963, for all regular federal employees paid from appropriated funds. I want to make clear these minimum rates should apply to federal laundry workers, even though such workers in private employment are specifically exempted by the law.\n\nThese new minimum rates should be applied to federal employees in the United States not later than the effective dates specified in the legislation. It is my wish that the head of each department and agency review this matter promptly and take appropriate action unless clearly prevented from doing so by law.\n\nJOHN F. KENNEDY","chunks":{"1":"It is my wish that the head of each department and agency review this matter promptly and take appropriate action unless clearly prevented from doing so by law."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M6":{"metadata":{"president":"Donald J. Trump","date":"January 24, 2025","type":"memorandum"},"text":"Memorandum for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development\n\nSubject: The Mexico City Policy\n\nI hereby revoke the Presidential Memorandum of January 28, 2021, for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (Protecting Women's Health at Home and Abroad), and reinstate the Presidential Memorandum of January 23, 2017, for the Secretary of State, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (The Mexico City Policy).\n\nI direct the Secretary of State, in coordination with the Secretary of Health and Human Services, to the extent allowable by law, to implement a plan to extend the requirements of the reinstated Memorandum to global health assistance furnished by all departments or agencies.\n\nI further direct the Secretary of State to take all necessary actions, to the extent permitted by law, to ensure that U.S. taxpayer dollars do not fund organizations or programs that support or participate in the management of a program of coercive abortion or involuntary sterilization.\n\nThis memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nThe Secretary of State is authorized and directed to publish this memorandum in the Federal Register.\n\nDONALD J. TRUMP","chunks":{"1":"I hereby revoke the Presidential Memorandum of January 28, 2021, for the Secretary of State, the Secretary of Defense, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (Protecting Women's Health at Home and Abroad), and reinstate the Presidential Memorandum of January 23, 2017, for the Secretary of State, the Secretary of Health and Human Services, and the Administrator of the United States Agency for International Development (The Mexico City Policy).","2":"I direct the Secretary of State, in coordination with the Secretary of Health and Human Services, to the extent allowable by law, to implement a plan to extend the requirements of the reinstated Memorandum to global health assistance furnished by all departments or agencies. I further direct the Secretary of State to take all necessary actions, to the extent permitted by law, to ensure that U.S. taxpayer dollars do not fund organizations or programs that support or participate in the management of a program of coercive abortion or involuntary sterilization."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"2","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"2","diplomacy":"no","military_ops":null},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M7":{"metadata":{"president":"George W. Bush","date":"October 20, 2008","type":"memorandum"},"text":"Presidential Determination No. 2009-6\n\nMemorandum for the Secretary of State\n\nSubject: Certifications Pursuant to the United States-India Nuclear Cooperation Approval and Nonproliferation Enhancement Act (Public Law 110-369)\n\nPursuant to section 102(c) and section 204(a) of the United States-India Nuclear Cooperation Approval and Nonproliferation Enhancement Act, I hereby certify that:\n\n1. Entry into force and implementation of the United States-India Agreement for Cooperation on Peaceful Uses of Nuclear Energy pursuant to its terms is consistent with the obligation of the United States under the Treaty on the Non-Proliferation of Nuclear Weapons not in any way to assist, encourage, or induce India to manufacture or otherwise acquire nuclear weapons or other nuclear explosive devices; and\n\n2. It is the policy of the United States to work with members of the Nuclear Suppliers Group, individually and collectively, to agree to further restrict the transfers of equipment and technology related to the enrichment of uranium and reprocessing of spent nuclear fuel.\n\nYou are authorized and directed to publish this determination in the Federal Register.\n\nGeorge W. Bush","chunks":{"1":"Pursuant to section 102(c) and section 204(a) of the United States-India Nuclear Cooperation Approval and Nonproliferation Enhancement Act, I hereby certify that: 1. Entry into force and implementation of the United States-India Agreement for Cooperation on Peaceful Uses of Nuclear Energy pursuant to its terms is consistent with the obligation of the United States under the Treaty on the Non-Proliferation of Nuclear Weapons not in any way to assist, encourage, or induce India to manufacture or otherwise acquire nuclear weapons or other nuclear explosive devices; and 2. It is the policy of the United States to work with members of the Nuclear Suppliers Group, individually and collectively, to agree to further restrict the transfers of equipment and technology related to the enrichment of uranium and reprocessing of spent nuclear fuel."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M8":{"metadata":{"president":"Donald J. Trump","date":"April 02, 2020","type":"memorandum"},"text":"Memorandum for the Director of the Pension Benefit Guaranty Corporation\n\nSubject: Providing an Order of Succession Within the Pension Benefit Guaranty Corporation By the authority vested in me as President by the Constitution and the laws of the United States of America, including the Federal Vacancies Reform Act of 1998, as amended, 5 U.S.C. 3345 et seq. (the \"Act\"), it is hereby ordered that:\n\nSection 1. Order of Succession. Subject to the provisions of section 2 of this memorandum and to the limitations set forth in the Act, the following officials of the Pension Benefit Guaranty Corporation, in the order listed, shall act as and perform the functions and duties of the office of the Director of the Pension Benefit Guaranty Corporation (Director) during any period in which the Director has died, resigned, or otherwise become unable to perform the functions and duties of the office of Director:\n\n(a) Chief Financial Officer;\n\n(b) Chief Management Officer; and\n\n(c) General Counsel.\n\nSec. 2. Exceptions. (a) No individual who is serving in an office listed in section 1 of this memorandum in an acting capacity, by virtue of so serving, shall act as Director pursuant to this memorandum.\n\n(b) No individual listed in section 1 of this memorandum shall act as Director unless that individual is otherwise eligible to so serve under the Act.\n\n(c) Notwithstanding the provisions of this memorandum, the President retains discretion, to the extent permitted by law, to depart from this memorandum in designating an acting Director.\n\nSec. 3. Revocation. The Presidential Memorandum of February 1, 2013 (Designation of Officers of the Pension Benefit Guaranty Corporation to Act as Director of the Pension Benefit Guaranty Corporation), is hereby revoked.\n\nSec. 4. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect:\n\n(i) the authority granted by law to an executive department or agency, or the head thereof; or\n\n(ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.\n\n(b) This memorandum shall be implemented consistent with applicable law and subject to the availability of appropriations.\n\n(c) This memorandum is not intended to, and does not, create any right or benefit, substantive or procedural, enforceable at law or in equity by any party against the United States, its departments, agencies, or entities, its officers, employees, or agents, or any other person.\n\nSec. 5. Publication. You are authorized and directed to publish this memorandum in the Federal Register.\n\nDONALD J. TRUMP","chunks":{"1":"The Presidential Memorandum of February 1, 2013 (Designation of Officers of the Pension Benefit Guaranty Corporation to Act as Director of the Pension Benefit Guaranty Corporation), is hereby revoked. Sec. 4. General Provisions. (a) Nothing in this memorandum shall be construed to impair or otherwise affect: (i) the authority granted by law to an executive department or agency, or the head thereof; or (ii) the functions of the Director of the Office of Management and Budget relating to budgetary, administrative, or legislative proposals.","2":"You are authorized and directed to publish this memorandum in the Federal Register."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M11":{"metadata":{"president":"George W. Bush","date":"September 13, 2007","type":"memorandum"},"text":"Presidential Determination No. 2007-32\n\nMemorandum for the Secretary of State and the Secretary of the Treasury\n\nSubject: Continuation of the Exercise of Certain Authorities Under the Trading With the Enemy Act\n\nUnder section 101(b) of Public Law 95-223 (91 Stat. 1625; 50 U.S.C. App. 5(b) note), and a previous determination on September 13, 2006 (71 Fed. Reg. 54399), the exercise of certain authorities under the Trading With the Enemy Act is scheduled to terminate on September 14, 2007.\n\nI hereby determine that the continuation for 1 year of the exercise of those authorities with respect to the applicable countries is in the national interest of the United States.\n\nTherefore, consistent with the authority vested in me by section 101(b) of Public Law 95-223, I continue for 1 year, until September 14, 2008, the exercise of those authorities with respect to countries affected by:\n\n(1) the Foreign Assets Control Regulations, 31 C.F.R. part 500; (2) the Transaction Control Regulations, 31 C.F.R. part 505; and (3) the Cuban Assets Control Regulations, 31 C.F.R. part 515.\n\nThe Secretary of the Treasury is authorized and directed to publish this determination in the Federal Register.\n\nGeorge W. Bush","chunks":{"1":"I hereby determine that the continuation for 1 year of the exercise of those authorities with respect to the applicable countries is in the national interest of the United States.","2":"(1) the Foreign Assets Control Regulations, 31 C.F.R. part 500; (2) the Transaction Control Regulations, 31 C.F.R. part 505; and (3) the Cuban Assets Control Regulations, 31 C.F.R. part 515."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M12":{"metadata":{"president":"Richard Nixon","date":"February 05, 1973","type":"memorandum"},"text":"Memorandum for Heads of Departments and Agencies:\n\nThe 11th Annual Report on Federal Executive Boards reflects a solid record of accomplishment. Clearly, these boards offer a useful means of focusing the energies and talents of senior Federal executives across the Nation on areas of special concern.\n\nAs we move toward a more decentralization of the Federal establishment, the responsibility of Federal officials in the field will increase. It is incumbent upon us to ensure that these Boards are equipped to respond quickly to Federal initiatives and that they enjoy a high degree of cooperation across the traditional lines of Federal authority.\n\nI would like you to call to the attention of all senior officials in the field the attached report on FEB activity and inform them of my strong personal endorsement of the FEB concept. I hope you will also express my appreciation to all of those whose efforts made fiscal year 1972 a successful one for Federal Executive Boards.\n\nRICHARD NIXON","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"M13":{"metadata":{"president":"George Bush","date":"January 28, 1992","type":"memorandum"},"text":"Memorandum for the Secretary of Transportation, the Secretary of Energy, the Chairman of the Interstate Commerce Commission, the Chairman of the Federal Maritime Commission\n\nSubject: Regulatory Coordination\n\nAs you know, the Congress has failed to enact important growth-oriented legislation that we have proposed. Although we will continue to work with the Congress to enact these proposals, we must also redouble our efforts to create jobs and achieve economic growth within existing statutory constraints.\n\nFor such efforts to succeed, we must prevent the fragmentation of policy-making and better coordinate existing programs within the executive branch. We have made great strides in this area, but more remains to be done. Because your agencies share responsibility for regulating the transportation sector of our economy, it is essential that you work together to streamline the regulatory process and ensure that the regulated community is not subject to duplicative or inconsistent regulation.\n\nI hope that improved coordination will be one especially valuable outcome of the 90-day moratorium and review period described in the attached memorandum. I look forward to your reports on this important undertaking. Although the Congress has created the regulatory schemes within which we must operate, I am confident that, with your help, the executive branch can do much to create conditions conducive to a healthy and robust economy.\n\nGeorge Bush","chunks":{},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{},"wp_comment":null}]},"M14":{"metadata":{"president":"William J. Clinton","date":"August 22, 1996","type":"memorandum"},"text":"Memorandum for the Secretary of Agriculture\n\nSubject: Eligibility of Aliens for Food Stamps\n\nUnder the provisions of the Personal Responsibility and Work Opportunity Reconciliation Act of 1996, which today I signed into law, aliens receiving food stamps as of the date of enactment will continue to receive benefits until recertification of their eligibility, which shall take place not more than 1 year after enactment of the law. The results of the certification, including decisions as to an individual's immigration classification, veteran status, or work history, will determine whether the individual remains eligible for benefits under the Food Stamp program. Implementation of these new procedures will pose a substantial challenge for all involved Federal and State agencies.\n\nTo ensure that eligibility determinations are made fairly, accurately, and effectively, I direct you to take the steps necessary under your authority to permit the State agencies to extend the certification periods of currently participating aliens, provided that no certification period is extended to longer than 12 months, or up to 24 months if all adult household members are elderly or disabled, and provided that in no event shall certifications be extended beyond August 22, 1997.\n\nI further direct you to notify the States of the actions you have taken.\n\nWILLIAM J. CLINTON","chunks":{"1":"Under the provisions of the Personal Responsibility and Work Opportunity Reconciliation Act of 1996, which today I signed into law, aliens receiving food stamps as of the date of enactment will continue to receive benefits until recertification of their eligibility, which shall take place not more than 1 year after enactment of the law. The results of the certification, including decisions as to an individual's immigration classification, veteran status, or work history, will determine whether the individual remains eligible for benefits under the Food Stamp program. Implementation of these new procedures will pose a substantial challenge for all involved Federal and State agencies.","2":"To ensure that eligibility determinations are made fairly, accurately, and effectively, I direct you to take the steps necessary under your authority to permit the State agencies to extend the certification periods of currently participating aliens, provided that no certification period is extended to longer than 12 months, or up to 24 months if all adult household members are elderly or disabled, and provided that in no event shall certifications be extended beyond August 22, 1997. I further direct you to notify the States of the actions you have taken."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M19":{"metadata":{"president":"William J. Clinton","date":"November 14, 1998","type":"memorandum"},"text":"Presidential Determination No. 99-04\n\nMemorandum for the Secretary of State, the Secretary of Defense\n\nSubject: Drawdown Under Section 506(a)(2)(A)(i)(II) of the Foreign Assistance Act to Provide Emergency Disaster Relief Assistance for Honduras, Nicaragua, El Salvador, and Guatemala\n\nPursuant to the authority vested in me by section 506(a)(2)(A)(i)(II) of the Foreign Assistance Act of 1961, as amended (\"the Act\"), 22 U.S.C. 2318(a)(2), I hereby determine that it is in the national interest of the United States to draw down articles and services from the inventory and resources of the Department of Defense, for the purpose of providing international disaster relief assistance to Honduras, Nicaragua, El Salvador, and Guatemala.\n\nTherefore, I direct the drawdown of up to $45 million of articles and services from the inventory and resources of the Department of Defense for the Governments of Honduras, Nicaragua, El Salvador, and Guatemala for the purposes and under the authorities of chapter 9 of part I of the Act.\n\nThe Secretary of State is authorized and directed to report this determination to the Congress immediately and to arrange for its publication in the Federal Register.\n\nWilliam J. Clinton","chunks":{"1":"Pursuant to the authority vested in me by section 506(a)(2)(A)(i)(II) of the Foreign Assistance Act of 1961, as amended (\"the Act\"), 22 U.S.C. 2318(a)(2), I hereby determine that it is in the national interest of the United States to draw down articles and services from the inventory and resources of the Department of Defense, for the purpose of providing international disaster relief assistance to Honduras, Nicaragua, El Salvador, and Guatemala.","2":"Therefore, I direct the drawdown of up to $45 million of articles and services from the inventory and resources of the Department of Defense for the Governments of Honduras, Nicaragua, El Salvador, and Guatemala for the purposes and under the authorities of chapter 9 of part I of the Act."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M20":{"metadata":{"president":"Ronald Reagan","date":"December 31, 1988","type":"memorandum"},"text":"Memorandum for the Secretary of State and the United States Trade Representative Subject: Proposed United States-Canada Free-Trade Agreement\n\nHaving considered the relevant measures taken by Canada, along with the unanimous views and recommendations of the United States Trade Representative and interested United States Government agencies, I have determined that Canada has taken measures necessary to comply with the obligations of the United States-Canada Free-Trade Agreement (Agreement). The United States has completed necessary legal procedures in accordance with Article 2105 of the Agreement.\n\nPursuant to section 101(b) of the United States-Canada Free-Trade Agreement Implementation Act of 1988 (Public Law 100449), I hereby direct the Secretary of State to exchange notes with the Government of Canada providing for the entry into force, on January 1, 1989, of the Agreement, in accordance with Article 2105 thereof.\n\nRONALD REAGAN","chunks":{"1":"Having considered the relevant measures taken by Canada, along with the unanimous views and recommendations of the United States Trade Representative and interested United States Government agencies, I have determined that Canada has taken measures necessary to comply with the obligations of the United States-Canada Free-Trade Agreement (Agreement). The United States has completed necessary legal procedures in accordance with Article 2105 of the Agreement.","2":"Pursuant to section 101(b) of the United States-Canada Free-Trade Agreement Implementation Act of 1988 (Public Law 100449), I hereby direct the Secretary of State to exchange notes with the Government of Canada providing for the entry into force, on January 1, 1989, of the Agreement, in accordance with Article 2105 thereof."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"},"2":{"code":"2","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M21":{"metadata":{"president":"Jimmy Carter","date":"July 19, 1978","type":"memorandum"},"text":"Memorandum for the Heads of Executive Departments and Agencies\n\nAs I did at the end of last fiscal year, I again ask you to help me make sure we continue to use funds wisely. Prevention of unneeded or unwise Federal Government spending is more important than ever in this time of high inflation. Please, therefore, tell your staff not to spend or obligate funds for the sole or even primary purpose of keeping them from lapsing.\n\nNor should they speed up spending to avoid a shortfall that would occur solely, or even primarily, because earlier outlay estimates were too optimistic. Funds should be used only for clear and desirable program purposes.\n\nPlease issue instructions assuring that:\n\n—obligations for the fourth quarter of the fiscal year are no higher than for the third quarter, except where seasonal requirements, essential program objectives, or procurement lead-times justify a higher level, or where more money is needed to restore program slippages to approved levels;\n\n—orders for supplies, materials, and equipment are no more than needed to meet approved program needs;\n\n—purchases are managed so that inventories do not exceed optimal levels;\n\n—contracts for goods or services (for delivery extending into the next fiscal year) are let only when doing so will result in lower cost to the Government; and\n\n—no purchases are made to compensate for what otherwise would be an outlay shortfall. Resist the temptation to buy and pay for lower priority items to make up for over-optimistic outlay estimates.\n\nI count on your full cooperation and personal attention to save the taxpayers as much money as possible.\n\nJIMMY CARTER","chunks":{"1":"Please issue instructions assuring that: —obligations for the fourth quarter of the fiscal year are no higher than for the third quarter, except where seasonal requirements, essential program objectives, or procurement lead-times justify a higher level, or where more money is needed to restore program slippages to approved levels; —orders for supplies, materials, and equipment are no more than needed to meet approved program needs; —purchases are managed so that inventories do not exceed optimal levels; —contracts for goods or services (for delivery extending into the next fiscal year) are let only when doing so will result in lower cost to the Government; and —no purchases are made to compensate for what otherwise would be an outlay shortfall. Resist the temptation to buy and pay for lower priority items to make up for over-optimistic outlay estimates. I count on your full cooperation and personal attention to save the taxpayers as much money as possible."},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M22":{"metadata":{"president":"William J. Clinton","date":"May 18, 1999","type":"memorandum"},"text":"Presidential Determination No. 99-23\n\nMemorandum for the Secretary of State\n\nSubject: Determination Pursuant to Section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as Amended\n\nPursuant to section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that up to $15 million be made available from the U.S. Emergency Refugee and Migration Assistance Fund to meet urgent and unexpected humanitarian requirements associated with the Kosovo crisis.\n\nThese funds will be used to meet the urgent and unexpected needs of refugees, displaced persons, victims of conflict, and other persons at risk due to the Kosovo crisis. These funds may be used, as appropriate, to provide contributions to governmental, international, and nongovernmental organizations. As necessary, funds will also support requirements associated with the U.S. program to provide refuge in the United States for up to 20,000 Kosovar refugees, and for administrative expenses of the Bureau of Population, Refugees, and Migration.\n\nYou are authorized and directed to inform the appropriate committees of the Congress of this determination and the use of funds under this authority, and to arrange for the publication of this determination in the Federal Register.\n\nWilliam J. Clinton","chunks":{"1":"Pursuant to section 2(c)(1) of the Migration and Refugee Assistance Act of 1962, as amended, 22 U.S.C. 2601(c)(1), I hereby determine that it is important to the national interest that up to $15 million be made available from the U.S. Emergency Refugee and Migration Assistance Fund to meet urgent and unexpected humanitarian requirements associated with the Kosovo crisis. These funds will be used to meet the urgent and unexpected needs of refugees, displaced persons, victims of conflict, and other persons at risk due to the Kosovo crisis. These funds may be used, as appropriate, to provide contributions to governmental, international, and nongovernmental organizations. As necessary, funds will also support requirements associated with the U.S. program to provide refuge in the United States for up to 20,000 Kosovar refugees, and for administrative expenses of the Bureau of Population, Refugees, and Migration."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":null,"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"M23":{"metadata":{"president":"Jimmy Carter","date":"February 08, 1979","type":"memorandum"},"text":"Memorandum for the Special Representative for Trade Negotiations\n\nSubject: Determination Under Section 202(b) of the Trade Act; Clothespins\n\nPursuant to section 202(b)(1) of the Trade Act of 1974 (P.L. 93-618, 88 Stat. 1978), I have determined the action I will take with respect to the report of the United States International Trade Commission (USITC), transmitted to me on December 12, 1978, concerning the results of its investigation of import injury which was established on its own motion. The investigation was initiated as an outgrowth of information collected in conjunction with Commission investigations Nos. TA-406-2, TA-406-3, and TA- 406-4, conducted under section 406(a) of the Trade Act of 1974 and concerning clothespins from the People's Republic of China, the Polish People's Republic, and the Socialist Republic of Romania. All four investigations have concerned clothespins imported under items 790.05, 790.07, and 790.08 of the TSUS.\n\nAfter considering all relevant aspects of the case, including those considerations set forth in section 202(c) of the Trade Act of 1974, I have decided to accept a variation of the injury relief recommendation made by the USITC. Within 15 days, I will issue a Presidential Proclamation authorizing that a three-year global import quota be established on wood and plastic clothespins (TSUS item 790.05) with a dutiable value not over $1.70 per gross in the amount of two million gross pins. The quota, administered quarterly on a pro rata basis, will be allocated as follows:\n\nYearly quota allocation\n\nCategory (gross)\n\nValued not over 80 cents per gross------------------------ 500, 000 Valued over 80 cents per gross but not over $1.35 per gross---------------------------------- 600, 000 Valued over $1.35 per gross but not over $1.70 per gross---------------------------------- 900, 000\n\nTotal --------------------------------------------- 2, 000, 000\n\nDuring the course of each year, as it becomes apparent that the quota for any price bracket will not be filled for the year, then the remainder of the allocation may be reapportioned among the brackets whose quotas have been filled.\n\nRelief is warranted for the following reasons:\n\n1. The social costs of denying relief would be very high, since producers are located in isolated regions in the Northeast where alternative employment is scarce.\n\n2. Assistance will not be costly and will not impose an inflationary burden on the economy. The major clothespin manufacturers have provided commitments to comply with the Administration's anti-inflation program.\n\n3. Major clothespin producers have given their assurances that the relief period will be used to modernize facilities, improve distributional channels and promote their product. These steps should put them in a better competitive position once relief is lifted.\n\nThis determination is to be published in the FEDERAL REGISTER.\n\nJIMMY CARTER\n\n[Filed with the Office of the Federal Register, 4:33 p.m., February 8, 1979]","chunks":{"1":"Pursuant to section 202(b)(1) of the Trade Act of 1974 (P.L. 93-618, 88 Stat. 1978), I have determined the action I will take with respect to the report of the United States International Trade Commission (USITC), transmitted to me on December 12, 1978, concerning the results of its investigation of import injury which was established on its own motion. The investigation was initiated as an outgrowth of information collected in conjunction with Commission investigations Nos. TA-406-2, TA-406-3, and TA- 406-4, conducted under section 406(a) of the Trade Act of 1974 and concerning clothespins from the People's Republic of China, the Polish People's Republic, and the Socialist Republic of Romania. All four investigations have concerned clothespins imported under items 790.05, 790.07, and 790.08 of the TSUS.","2":"After considering all relevant aspects of the case, including those considerations set forth in section 202(c) of the Trade Act of 1974, I have decided to accept a variation of the injury relief recommendation made by the USITC. Within 15 days, I will issue a Presidential Proclamation authorizing that a three-year global import quota be established on wood and plastic clothespins (TSUS item 790.05) with a dutiable value not over $1.70 per gross in the amount of two million gross pins. The quota, administered quarterly on a pro rata basis, will be allocated as follows: Yearly quota allocation Category (gross) Valued not over 80 cents per gross------------------------ 500, 000 Valued over 80 cents per gross but not over $1.35 per gross---------------------------------- 600, 000 Valued over $1.35 per gross but not over $1.70 per gross---------------------------------- 900, 000 Total --------------------------------------------- 2, 000, 000 During the course of each year, as it becomes apparent that the quota for any price bracket will not be filled for the year, then the remainder of the allocation may be reapportioned among the brackets whose quotas have been filled. Relief is warranted for the following reasons: 1. The social costs of denying relief would be very high, since producers are located in isolated regions in the Northeast where alternative employment is scarce. 2. Assistance will not be costly and will not impose an inflationary burden on the economy. The major clothespin manufacturers have provided commitments to comply with the Administration's anti-inflation program. 3. Major clothespin producers have given their assurances that the relief period will be used to modernize facilities, improve distributional channels and promote their product. These steps should put them in a better competitive position once relief is lifted."},"annotations":[{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"},"2":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L1":{"metadata":{"president":"William J. Clinton","date":"August 12, 1997","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nI hereby report to the Congress on the developments since my report of October 21, 1996, concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c).\n\n1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the Annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in property subject to U.S. jurisdiction of persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order (collectively \"Specially Designated Narcotics Traffickers\" or SDNTs).\n\nThe Order further prohibits any transaction or dealing by a United States person or within the United States in property or interests in property of SDNTs, and any transaction that evades or avoids, has the purpose of evading or avoiding, or attempts to violate, the prohibitions contained in the Order.\n\nDesignations of foreign persons blocked pursuant to the Order are effective upon the date of determination by the Director of the Department of the Treasury's Office of Foreign Assets Control (OFAC) acting under authority delegated by the Secretary of the Treasury. Public notice of blocking is effective upon the date of filing with the Federal Register, or upon prior actual notice.\n\n2. On October 24, 1995, the Department of the Treasury issued a notice containing 76 additional names of persons determined to meet the criteria set forth in Executive Order 12978 (60 Fed. Reg. 54582-84, October 24, 1995).\n\nThe Department of the Treasury issued another notice adding the names of one additional entity and three additional individuals, as well as expanded information regarding addresses and pseudonyms, to the list of SDNTs on November 29, 1995 (60 Fed. Reg. 61288-89).\n\nOn March 8, 1996, OFAC published a notice in the Federal Register adding the names of 138 additional individuals and 60 entities designated pursuant to the Order, and revising information for 8 individuals on the list of blocked persons contained in the notices published on November 29, 1995, and October 24, 1995 (61 Fed. Reg. 9523-28).\n\n3. On January 21, 1997, OFAC published a notice in the Federal Register adding the names of 57 individuals and 21 entities designated pursuant to the Order, and revising information for 58 individuals and 1 entity (62 Fed. Reg. 2903- 09). In addition, the name of one individual specially designated narcotics trafficker was removed from the list. These changes were effective January 15, 1997. A copy of the notice is attached to this report.\n\nThese 78 new names brought the total list of SDNTs to 359. Each of the 78 newly designated entities and individuals has been determined to be owned or controlled or to act for or on behalf of the Cali cartel's Helmer \"Pacho\" Herrera Buitrago organization. The newly identified SDNTs include several large poultry processing plants and farms, investment and import/ export firms, real estate businesses, a consulting firm, a lumber distributor, and a construction company, all located in Colombia.\n\nThe additional name and address information includes one previously designated company controlled by the Herrera Buitrago family and 58 previously designated individuals from either the Herrera Buitrago or the Rodriguez Orejuela organizations of the Cali cartel. The OFAC, in coordination with the Attorney General and the Secretary of State, is continuing to expand the list of SDNTs, including both organizations and individuals, as additional information is developed.\n\nEffective February 28, 1997, OFAC issued the Narcotics Trafficking Sanctions Regulations (the \"Regulations\" or NTSR), 31 C.F.R. Part 536, to further implement my declaration of a national emergency and imposition of sanctions against significant foreign narcotics traffickers centered in Colombia (62 Fed. Reg. 9959-68, March 5, 1997). A copy of the Regulations is attached to this report.\n\n4. The OFAC has disseminated and routinely updated details of this program to the financial, securities, and international trade communities by both electronic and conventional media. In addition to bulletins to banking institutions via the Federal Reserve System and the Clearing House Interbank Payments System, individual notices were provided to all State and Federal regulatory agencies, automated clearinghouses, and State and independent banking associations across the country. OFAC contacted all major securities industry associations and regulators. It posted electronic notices on the Internet and over 10 computer bulletin boards and 2 faxon-demand services, and provided the same material to the U.S. Embassy in Bogota for distribution to U.S. companies operating in Colombia.\n\n5. As of March 4, 1997, OFAC had issued five specific licenses pursuant to Executive Order 12978. These licenses were issued in accordance with established Treasury policy authorizing the completion of presanctions transactions and the provision of legal services to and payment of fees for representation of SDNTs in proceedings within the United States arising from the imposition of sanctions.\n\n6. The expenses incurred by the Federal Government in the 6-month period from October 21, 1996, through April 20, 1997, that are directly attributable to the exercise of powers and authorities conferred by the declaration of the national emergency with respect to Significant Narcotics Traffickers are estimated at approximately $1.1 million. Personnel costs were largely centered in the Department of the Treasury (particularly in the Office of Foreign Assets Control, the Office of the General Counsel, and the U.S. Customs Service), the Department of Justice, and the Department of State.\n\n7. Executive Order 12978 provides this Administration with a new tool for combatting the actions of significant foreign narcotics traffickers centered in Colombia, and the unparalleled violence, corruption, and harm that they cause in the United States and abroad. The Order is designed to deny these traffickers the benefit of any assets subject to the jurisdiction of the United States and to prevent United States persons from engaging in any commercial dealings with them, their front companies, and their agents. Executive Order 12978 demonstrates the U.S. commitment to end the scourge that such traffickers have wrought upon society in the United States and abroad.\n\nThe magnitude and the dimension of the problem in Colombia—perhaps the most pivotal country of all in terms of the world's cocaine trade—is extremely grave. I shall continue to exercise the powers at my disposal to apply economic sanctions against significant foreign narcotics traffickers and their violent and corrupting activities as long as these measures are appropriate, and will continue to report periodically to the Congress on significant developments pursuant to 50 U.S.C. 1703(c).\n\nSincerely,\n\nWILLIAM J. CLINTON","chunks":{"1":"I hereby report to the Congress on the developments since my report of October 21, 1996, concerning the national emergency with respect to significant narcotics traffickers centered in Colombia that was declared in Executive Order 12978 of October 21, 1995. This report is submitted pursuant to section 401(c) of the National Emergencies Act, 50 U.S.C. 1641(c), and section 204(c) of the International Emergency Economic Powers Act (IEEPA), 50 U.S.C. 1703(c). 1. On October 21, 1995, I signed Executive Order 12978, \"Blocking Assets and Prohibiting Transactions with Significant Narcotics Traffickers\" (the \"Order\") (60 Fed. Reg. 54579, October 24, 1995). The Order blocks all property subject to U.S. jurisdiction in which there is any interest of four significant foreign narcotics traffickers, one of whom is now deceased, who were principals in the so-called Cali drug cartel centered in Colombia. These persons are listed in the Annex to the Order. The Order also blocks the property and interests in property of foreign persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, (a) to play a significant role in international narcotics trafficking centered in Colombia or (b) to materially assist in or provide financial or technological support for, or goods or services in support of, the narcotics trafficking activities of persons designated in or pursuant to the Order. In addition the Order blocks all property and interests in property subject to U.S. jurisdiction of persons determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be owned or controlled by, or to act for or on behalf of, persons designated in or pursuant to the Order (collectively \"Specially Designated Narcotics Traffickers\" or SDNTs). The Order further prohibits any transaction or dealing by a United States person or within the United States in property or interests in property of SDNTs, and any transaction that evades or avoids, has the purpose of evading or avoiding, or attempts to violate, the prohibitions contained in the Order. Designations of foreign persons blocked pursuant to the Order are effective upon the date of determination by the Director of the Department of the Treasury's Office of Foreign Assets Control (OFAC) acting under authority delegated by the Secretary of the Treasury. Public notice of blocking is effective upon the date of filing with the Federal Register, or upon prior actual notice. 2. On October 24, 1995, the Department of the Treasury issued a notice containing 76 additional names of persons determined to meet the criteria set forth in Executive Order 12978 (60 Fed. Reg. 54582-84, October 24, 1995). The Department of the Treasury issued another notice adding the names of one additional entity and three additional individuals, as well as expanded information regarding addresses and pseudonyms, to the list of SDNTs on November 29, 1995 (60 Fed. Reg. 61288-89). On March 8, 1996, OFAC published a notice in the Federal Register adding the names of 138 additional individuals and 60 entities designated pursuant to the Order, and revising information for 8 individuals on the list of blocked persons contained in the notices published on November 29, 1995, and October 24, 1995 (61 Fed. Reg. 9523-28). 3. On January 21, 1997, OFAC published a notice in the Federal Register adding the names of 57 individuals and 21 entities designated pursuant to the Order, and revising information for 58 individuals and 1 entity (62 Fed. Reg. 2903- 09). In addition, the name of one individual specially designated narcotics trafficker was removed from the list. These changes were effective January 15, 1997. A copy of the notice is attached to this report. These 78 new names brought the total list of SDNTs to 359. Each of the 78 newly designated entities and individuals has been determined to be owned or controlled or to act for or on behalf of the Cali cartel's Helmer \"Pacho\" Herrera Buitrago organization. The newly identified SDNTs include several large poultry processing plants and farms, investment and import/ export firms, real estate businesses, a consulting firm, a lumber distributor, and a construction company, all located in Colombia. The additional name and address information includes one previously designated company controlled by the Herrera Buitrago family and 58 previously designated individuals from either the Herrera Buitrago or the Rodriguez Orejuela organizations of the Cali cartel. The OFAC, in coordination with the Attorney General and the Secretary of State, is continuing to expand the list of SDNTs, including both organizations and individuals, as additional information is developed. Effective February 28, 1997, OFAC issued the Narcotics Trafficking Sanctions Regulations (the \"Regulations\" or NTSR), 31 C.F.R. Part 536, to further implement my declaration of a national emergency and imposition of sanctions against significant foreign narcotics traffickers centered in Colombia (62 Fed. Reg. 9959-68, March 5, 1997). A copy of the Regulations is attached to this report. 4. The OFAC has disseminated and routinely updated details of this program to the financial, securities, and international trade communities by both electronic and conventional media. In addition to bulletins to banking institutions via the Federal Reserve System and the Clearing House Interbank Payments System, individual notices were provided to all State and Federal regulatory agencies, automated clearinghouses, and State and independent banking associations across the country. OFAC contacted all major securities industry associations and regulators. It posted electronic notices on the Internet and over 10 computer bulletin boards and 2 faxon-demand services, and provided the same material to the U.S. Embassy in Bogota for distribution to U.S. companies operating in Colombia. 5. As of March 4, 1997, OFAC had issued five specific licenses pursuant to Executive Order 12978. These licenses were issued in accordance with established Treasury policy authorizing the completion of presanctions transactions and the provision of legal services to and payment of fees for representation of SDNTs in proceedings within the United States arising from the imposition of sanctions. 6. The expenses incurred by the Federal Government in the 6-month period from October 21, 1996, through April 20, 1997, that are directly attributable to the exercise of powers and authorities conferred by the declaration of the national emergency with respect to Significant Narcotics Traffickers are estimated at approximately $1.1 million. Personnel costs were largely centered in the Department of the Treasury (particularly in the Office of Foreign Assets Control, the Office of the General Counsel, and the U.S. Customs Service), the Department of Justice, and the Department of State. 7. Executive Order 12978 provides this Administration with a new tool for combatting the actions of significant foreign narcotics traffickers centered in Colombia, and the unparalleled violence, corruption, and harm that they cause in the United States and abroad. The Order is designed to deny these traffickers the benefit of any assets subject to the jurisdiction of the United States and to prevent United States persons from engaging in any commercial dealings with them, their front companies, and their agents. Executive Order 12978 demonstrates the U.S. commitment to end the scourge that such traffickers have wrought upon society in the United States and abroad. The magnitude and the dimension of the problem in Colombia—perhaps the most pivotal country of all in terms of the world's cocaine trade—is extremely grave. I shall continue to exercise the powers at my disposal to apply economic sanctions against significant foreign narcotics traffickers and their violent and corrupting activities as long as these measures are appropriate, and will continue to report periodically to the Congress on significant developments pursuant to 50 U.S.C. 1703(c)."},"annotations":[{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"3","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"3","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L3":{"metadata":{"president":"Dwight D. Eisenhower","date":"August 30, 1958","type":"letter"},"text":"[ Released August 30, 1958. Dated August 19, 1958 ]\n\nDear John:\n\nI strongly agree that the memory of Dr. Lawrence, as well as his great contributions, should be commemorated. To that end, I request that you initiate action to establish a memorial award beating his name, for especially meritorious contributions in the broad field of atomic endeavor.\n\nSuch an award would seem to me to be most fitting both as a recognition of what he has given to our country and to mankind, and as a means of helping to carry forward his work through inspiring others to dedicate their lives and talents to scientific effort.\n\nWith warm regard,\n\nSincerely,\n\nDWIGHT D. EISENHOWER","chunks":{"1":"To that end, I request that you initiate action to establish a memorial award beating his name, for especially meritorious contributions in the broad field of atomic endeavor. Such an award would seem to me to be most fitting both as a recognition of what he has given to our country and to mankind, and as a means of helping to carry forward his work through inspiring others to dedicate their lives and talents to scientific effort. With warm regard,"},"annotations":[{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"0","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"0","diplomacy":"no","military_ops":"no"}},"wp_comment":null},{"directive":{"code":"1","diplomacy":"no","military_ops":"no"},"chunks":{"1":{"code":"1","diplomacy":"no","military_ops":"no"}},"wp_comment":null}]},"L6":{"metadata":{"president":"Barack Obama","date":"January 13, 2017","type":"letter"},"text":"Dear Mr. Speaker: (Dear Mr. President:)\n\nConsistent with subsection 204(b) of the International Emergency Economic Powers Act, 50 U.S.C. 1703(b), I hereby report that I have issued an Executive Order (the \"order\") that revokes sections 1 and 2 of Executive Order 13067 of November 3, 1997, and revokes Executive Order 13412 of October 13, 2006, in its entirety. Both actions are effective 180 days from January 13, 2017, provided that certain further action is taken by the Secretary of State on or before that date. I have determined that the situation that gave rise to the actions taken in those orders related to the policies and actions of the Government of Sudan has been altered by Sudan's positive actions over the past 6 months. These actions include a marked reduction in offensive military activity, culminating in a pledge to maintain a cessation of hostilities in conflict areas in Sudan, and steps toward the improvement of humanitarian access throughout Sudan, as well as cooperation with the United States on addressing regional conflicts and the threat of terrorism.\n\nThe President issued Executive Order 13067 to deal with the unusual and extraordinary threat to the national security and foreign policy of the United States posed by the actions and policies of the Government of Sudan, including support for international terrorism; efforts to destabilize neighboring governments; and the prevalence of human rights violations. Section 1 of Executive Order 13067 blocks the property and interests in property of the Government of Sudan, and section 2 prohibits a broad range of trade and investment-related transactions with Sudan, including imports from and exports to Sudan. The President expanded the scope of the national emergency declared in Executive Order 13067 in Executive Order 13400 of April 26, 2006, which blocks the property and interests in property of certain persons in connection with the conflict in Darfur. The President took additional steps with respect to the national emergency decl
