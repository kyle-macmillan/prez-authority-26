egulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs."},{"segment_id":"2063:oa:019","segment_index":19,"text":"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs. * Ibid Part 6 General Provisions Sec. 6.1 Definitions. (a) \"Agency\" has the meaning provided at [AUTHORITY] (b) \"Information\" means any information or material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. (c) \"National security information\" means information that has been determined pursuant to this Order or any predecessor order to require protection against unauthorized disclosure and that is so designated. (d) \"Foreign government information\" means: (1) information provided by a foreign government or governments, an international organization of governments, or any element thereof with the expectation, expressed or implied, that the information, the source of the information, or both, are to be held in confidence; or (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence. (e) \"National security\" means the national defense or foreign relations of the United States. (f) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation, expressed or implied, that the information or relationship, or both, be held in confidence. (g) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure, together with a classification designation signifying the level of protection required. Sec. 6.2 General."}],"policy_functions":[{"function_id":"2063:pol:001","label":"Prescribe uniform system for national security information","actor":"This Order","action":"prescribes","target":"a uniform system for classifying, declassifying, and safeguarding national security information","mechanism":"","effect":"","condition":"","timing":"","evidence":"This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information.","evidence_start":0,"evidence_end":118,"confidence":"high"}],"operative_functions":[{"function_id":"2063:op:001","label":"Classify national security information into established levels","actor":"","action":"shall be classified","target":"national security information","mechanism":"three levels: Top Secret, Secret, Confidential","effect":"","condition":"","timing":"","evidence":"(a) National security information (hereinafter \"classified information\") shall be classified at one of the following three levels: (1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security. (2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security. (3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security. (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information.","evidence_start":99,"evidence_end":839,"confidence":"high","segment_id":"2063:oa:001"},{"function_id":"2063:op:002","label":"Safeguard information when classification need is in doubt","actor":"original classification authority","action":"safeguard and determine classification","target":"information with reasonable doubt about classification need","mechanism":"","effect":"","condition":"If there is reasonable doubt about the need to classify information","timing":"within thirty (30) days","evidence":"(c) If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days.","evidence_start":0,"evidence_end":245,"confidence":"high","segment_id":"2063:oa:002"},{"function_id":"2063:op:003","label":"Establish authority and limits for original classification delegation","actor":"President, agency heads, and designated officials","action":"exercise and delegate","target":"original classification authority","mechanism":"written delegation","effect":"","condition":"","timing":"within thirty (30) days for doubt determinations","evidence":"If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days. Sec. 1.2 Classification Authority. (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register, and (3) officials delegated this authority pursuant to Section 1.2(d). (b) Secret. The authority to classify information originally as Secret may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (c) Confidential. The authority to classify information originally as Confidential may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret or Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (d) Delegation of Original Classification Authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head. (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head. * The citation should read \"Section 5.3(a)\". [ White House correction] (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head. (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order.","evidence_start":0,"evidence_end":2905,"confidence":"high","segment_id":"2063:oa:003"},{"function_id":"2063:op:004","label":"Handle exceptional cases of unclassified agency information creation","actor":"agency with subject matter interest and ISOO Director","action":"protect, transmit, and decide classification","target":"information originated by non-cleared agency personnel","mechanism":"written identification and agency transmission","effect":"","condition":"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed to require classification","timing":"within thirty (30) days","evidence":"It shall identify the official delegated the authority by name or position title. Delegated classification authority includes the authority to classify information at the level granted and lower levels of classification. (e) Exceptional Cases. When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office.","evidence_start":0,"evidence_end":1023,"confidence":"high","segment_id":"2063:oa:004"},{"function_id":"2063:op:005","label":"Specify classification categories and marking standards","actor":"ISOO Director and original classification authorities","action":"determine, mark, and prescribe standards for","target":"classified information categories and document markings","mechanism":"implementing directives","effect":"","condition":"","timing":"promptly","evidence":"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.3 Classification Categories. (a) Information shall be considered for classification if it concerns: (1) military plans, weapons, or operations; (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security; (3) foreign government information; (4) intelligence activities (including special activities), or intelligence sources or methods; (5) foreign relations or foreign activities of the United States; (6) scientific, technological, or economic matters relating to the national security; (7) United States Government programs for safeguarding nuclear materials or facilities; (8) cryptology; (9) a confidential source; or (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office. (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security. (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security. (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information. Sec. 1.4 Duration of Classification. (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified. (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions. (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order. Sec. 1.5 Identification and Markings. (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information: (1) one of the three classification levels defined in Section 1.1; (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official; (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \"Originating Agency's Determination Required.\" (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office.","evidence_start":0,"evidence_end":4322,"confidence":"high","segment_id":"2063:oa:005"},{"function_id":"2063:op:006","label":"Define classification limitations and reclassification procedures","actor":"President and authorized agency officials","action":"reclassify and derivative classify","target":"foreign government and declassified information","mechanism":"written determination","effect":"","condition":"","timing":"promptly","evidence":"(d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information. (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b). Sec. 1.6 Limitations on Classification. (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office. (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority. Part 2 Derivative Classification Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources. Sec. 2.2 Classification Guides.","evidence_start":0,"evidence_end":2928,"confidence":"high","segment_id":"2063:oa:006"},{"function_id":"2063:op:007","label":"Prepare and approve classification guides","actor":"Agencies with original classification authority","action":"prepare and approve","target":"classification guides","mechanism":"written approval","effect":"","condition":"","timing":"","evidence":"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and * Ibid. (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. Part 3 Declassification and Downgrading Sec. 3.1 Declassification Authority. (a) Information shall be declassified or downgraded as soon as national security considerations permit.","evidence_start":0,"evidence_end":951,"confidence":"high","segment_id":"2063:oa:007"},{"function_id":"2063:op:008","label":"Execute systematic declassification review and interagency coordination","actor":"Archivist of the United States and originating agencies","action":"review and declassify","target":"classified records and presidential papers","mechanism":"systematic review guidelines","effect":"","condition":"","timing":"as soon as national security considerations permit","evidence":"Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order. (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). * * Ibid. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal. (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders. Sec. 3.2 Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order. (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines. Sec. 3.3 Systematic Review for Declassification. (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads. (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States. (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods. Sec. 3.4 Mandatory Review for Declassification.","evidence_start":0,"evidence_end":3961,"confidence":"high","segment_id":"2063:oa:008"},{"function_id":"2063:op:009","label":"Subject classified information to mandatory declassification review upon request","actor":"originating agency","action":"review for declassification","target":"classified information requested by eligible requesters","mechanism":"mandatory review procedures","effect":"","condition":"if the request is made by a US citizen, permanent resident alien, federal agency, or State/local government and describes the document with sufficient specificity","timing":"","evidence":"(a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort. (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY].","evidence_start":0,"evidence_end":780,"confidence":"high","segment_id":"2063:oa:009"},{"function_id":"2063:op:010","label":"Declassify and release information during mandatory review","actor":"Agencies conducting mandatory review","action":"declassify and release","target":"information no longer requiring protection","mechanism":"mandated consultation and appeal mechanisms","effect":"","condition":"unless withholding is otherwise authorized under applicable law","timing":"promptly","evidence":"Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal. (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law.","evidence_start":0,"evidence_end":880,"confidence":"high","segment_id":"2063:oa:010"},{"function_id":"2063:op:011","label":"Develop procedures for processing mandatory review requests","actor":"Agency heads","action":"develop procedures","target":"requests for mandatory review and administrative appeals","mechanism":"administrative appeal procedures","effect":"","condition":"","timing":"","evidence":"(d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request.","evidence_start":0,"evidence_end":305,"confidence":"high","segment_id":"2063:oa:011"},{"function_id":"2063:op:012","label":"Develop special procedures for cryptologic information review","actor":"Secretary of Defense","action":"develop special procedures","target":"review of cryptologic information","mechanism":"","effect":"","condition":"","timing":"","evidence":"(e) The Secretary of Defense shall develop special procedures for the review of cryptologic information,","evidence_start":0,"evidence_end":104,"confidence":"high","segment_id":"2063:oa:012"},{"function_id":"2063:op:013","label":"Develop special procedures for intelligence information review","actor":"Director of Central Intelligence","action":"develop special procedures","target":"review of intelligence information, sources, or methods","mechanism":"consultation with affected agencies","effect":"","condition":"","timing":"after consultation with affected agencies","evidence":"and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies.","evidence_start":0,"evidence_end":252,"confidence":"high","segment_id":"2063:oa:013"},{"function_id":"2063:op:014","label":"Establish safeguarding controls and access eligibility standards","actor":"Agencies and Archivist","action":"establish controls and develop procedures","target":"classified information access, dissemination, and referral requests","mechanism":"trustworthiness determinations and consent rules","effect":"","condition":"","timing":"","evidence":"The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States. (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order: (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order. (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section. Part 4 Safeguarding Sec. 4.1 General Restrictions on Access. (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes. (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons. (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch. (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency. Sec. 4.2 Special Access Programs. (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence.","evidence_start":0,"evidence_end":2812,"confidence":"high","segment_id":"2063:oa:014"},{"function_id":"2063:op:015","label":"Maintain special access program accounting and allow historical research access waivers","actor":"Agency heads and originating agencies","action":"establish, maintain, and grant waivers","target":"system of accounting for special access programs and historical researcher access","mechanism":"written determination and non-delegable ISOO access","effect":"","condition":"","timing":"","evidence":"(b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings. Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees. (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waived as provided in Section 4.3(b) for persons who: (1) are engaged in historical research projects, or (2) previously have occupied policy-making positions to which they were appointed by the President. (b) Waivers under Section 4.3(a) may be granted only if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee. Part 5 Implementation and Review Sec. 5.1 Policy Direction.","evidence_start":0,"evidence_end":1344,"confidence":"high","segment_id":"2063:oa:015"},{"function_id":"2063:op:016","label":"Direct, implement, and oversee information security program","actor":"National Security Council, Administrator of General Services, ISOO Director, and agency heads","action":"provide direction, implement, oversee, and designate senior agency official","target":"information security program implementation and oversight","mechanism":"binding directives, regulations review, and on-site reviews","effect":"","condition":"","timing":"at least annually for reporting","evidence":"(a) The National Security Council shall provide overall policy direction for the information security program. (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office. Sec. 5.2 Information Security Oversight Office. (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority to appoint a staff for the Office.(b) The Director shall: (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies; (f) oversee agency actions to ensure compliance with this Order and implementing directives; (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal; (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal; * Ibid. (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval; (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program; (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program; (8) report at least annually to the President through the National Security Council on the implementation of this Order; and (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program. Sec. 5.3 General Responsibilities. Agencies that originate or handle classified information shall: (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order; (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas. Sec. 5.4 Sanctions.","evidence_start":0,"evidence_end":3850,"confidence":"high","segment_id":"2063:oa:016"},{"function_id":"2063:op:017","label":"Report possible security violations to agency head","actor":"Director of the Information Security Oversight Office","action":"report","target":"possible violations of this Order or implementing directives","mechanism":"written report to agency head or senior official","effect":"","condition":"If the Director finds that a violation may have occurred","timing":"","evidence":"(a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken. * Ibid.","evidence_start":0,"evidence_end":336,"confidence":"high","segment_id":"2063:oa:017"},{"function_id":"2063:op:018","label":"Subject personnel to sanctions for security violations","actor":"Agency heads and senior agency officials","action":"subject to sanctions and ensure prompt corrective action","target":"officers, employees, contractors, licensees, and grantees violating classification provisions","mechanism":"reprimand, suspension, removal, or termination of authority","effect":"","condition":"if they knowingly, willfully, or negligently disclose properly classified information or violate order provisions","timing":"promptly","evidence":"(b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or (3) knowingly and willfully violate any other provision of this Order or implementing directive. (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs.","evidence_start":0,"evidence_end":980,"confidence":"high","segment_id":"2063:oa:018"},{"function_id":"2063:op:019","label":"Notify ISOO Director of security violations","actor":"Agency head or designated senior official","action":"ensure notification","target":"Director of the Information Security Oversight Office","mechanism":"prompt notification","effect":"","condition":"whenever a violation under Section 5.4 (b)(1) or (2) occurs","timing":"promptly","evidence":"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs. * Ibid Part 6 General Provisions Sec. 6.1 Definitions. (a) \"Agency\" has the meaning provided at [AUTHORITY] (b) \"Information\" means any information or material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. (c) \"National security information\" means information that has been determined pursuant to this Order or any predecessor order to require protection against unauthorized disclosure and that is so designated. (d) \"Foreign government information\" means: (1) information provided by a foreign government or governments, an international organization of governments, or any element thereof with the expectation, expressed or implied, that the information, the source of the information, or both, are to be held in confidence; or (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence. (e) \"National security\" means the national defense or foreign relations of the United States. (f) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation, expressed or implied, that the information or relationship, or both, be held in confidence. (g) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure, together with a classification designation signifying the level of protection required. Sec. 6.2 General.","evidence_start":0,"evidence_end":1988,"confidence":"high","segment_id":"2063:oa:019"}],"request_id":"function-profile-v1:2063","model":"gemini-3.6-flash","model_version":"gemini-3.6-flash","grounding_metadata":{"image_search_queries":null,"grounding_chunks":null,"grounding_supports":null,"retrieval_metadata":{"google_search_dynamic_retrieval_score":null},"search_entry_point":{"rendered_content":"<style>\n.container {\n  align-items: center;\n  border-radius: 8px;\n  display: flex;\n  font-family: Google Sans, Roboto, sans-serif;\n  font-size: 14px;\n  line-height: 20px;\n  padding: 8px 12px;\n}\n.chip {\n  display: inline-block;\n  border: solid 1px;\n  border-radius: 16px;\n  min-width: 14px;\n  padding: 5px 16px;\n  text-align: center;\n  user-select: none;\n  margin: 0 8px;\n  -webkit-tap-highlight-color: transparent;\n}\n.carousel {\n  overflow: auto;\n  scrollbar-width: none;\n  white-space: nowrap;\n  margin-right: -12px;\n}\n.headline {\n  display: flex;\n  margin-right: 4px;\n}\n.gradient-container {\n  position: relative;\n}\n.gradient {\n  position: absolute;\n  transform: translate(3px, -9px);\n  height: 36px;\n  width: 9px;\n}\n@media (prefers-color-scheme: light) {\n  .container {\n    background-color: #fafafa;\n    box-shadow: 0 0 0 1px #0000000f;\n  }\n  .headline-label {\n    color: #1f1f1f;\n  }\n  .chip {\n    background-color: #ffffff;\n    border-color: #d2d2d2;\n    color: #5e5e5e;\n    text-decoration: none;\n  }\n  .chip:hover {\n    background-color: #f2f2f2;\n  }\n  .chip:focus {\n    background-color: #f2f2f2;\n  }\n  .chip:active {\n    background-color: #d8d8d8;\n    border-color: #b6b6b6;\n  }\n  .logo-dark {\n    display: none;\n  }\n  .gradient {\n    background: linear-gradient(90deg, #fafafa 15%, #fafafa00 100%);\n  }\n}\n@media (prefers-color-scheme: dark) {\n  .container {\n    background-color: #1f1f1f;\n    box-shadow: 0 0 0 1px #ffffff26;\n  }\n  .headline-label {\n    color: #fff;\n  }\n  .chip {\n    background-color: #2c2c2c;\n    border-color: #3c4043;\n    color: #fff;\n    text-decoration: none;\n  }\n  .chip:hover {\n    background-color: #353536;\n  }\n  .chip:focus {\n    background-color: #353536;\n  }\n  .chip:active {\n    background-color: #464849;\n    border-color: #53575b;\n  }\n  .logo-light {\n    display: none;\n  }\n  .gradient {\n    background: linear-gradient(90deg, #1f1f1f 15%, #1f1f1f00 100%);\n  }\n}\n<\/style>\n<div class=\"container\">\n  <div class=\"headline\">\n    <svg class=\"logo-light\" width=\"18\" height=\"18\" viewBox=\"9 9 35 35\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n      <path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M42.8622 27.0064C42.8622 25.7839 42.7525 24.6084 42.5487 23.4799H26.3109V30.1568H35.5897C35.1821 32.3041 33.9596 34.1222 32.1258 35.3448V39.6864H37.7213C40.9814 36.677 42.8622 32.2571 42.8622 27.0064V27.0064Z\" fill=\"#4285F4\"/>\n      <path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M26.3109 43.8555C30.9659 43.8555 34.8687 42.3195 37.7213 39.6863L32.1258 35.3447C30.5898 36.3792 28.6306 37.0061 26.3109 37.0061C21.8282 37.0061 18.0195 33.9811 16.6559 29.906H10.9194V34.3573C13.7563 39.9841 19.5712 43.8555 26.3109 43.8555V43.8555Z\" fill=\"#34A853\"/>\n      <path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M16.6559 29.8904C16.3111 28.8559 16.1074 27.7588 16.1074 26.6146C16.1074 25.4704 16.3111 24.3733 16.6559 23.3388V18.8875H10.9194C9.74388 21.2072 9.06992 23.8247 9.06992 26.6146C9.06992 29.4045 9.74388 32.022 10.9194 34.3417L15.3864 30.8621L16.6559 29.8904V29.8904Z\" fill=\"#FBBC05\"/>\n      <path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M26.3109 16.2386C28.85 16.2386 31.107 17.1164 32.9095 18.8091L37.8466 13.8719C34.853 11.082 30.9659 9.3736 26.3109 9.3736C19.5712 9.3736 13.7563 13.245 10.9194 18.8875L16.6559 23.3388C18.0195 19.2636 21.8282 16.2386 26.3109 16.2386V16.2386Z\" fill=\"#EA4335\"/>\n    <\/svg>\n    <svg class=\"logo-dark\" width=\"18\" height=\"18\" viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\">\n      <circle cx=\"24\" cy=\"23\" fill=\"#FFF\" r=\"22\"/>\n      <path d=\"M33.76 34.26c2.75-2.56 4.49-6.37 4.49-11.26 0-.89-.08-1.84-.29-3H24.01v5.99h8.03c-.4 2.02-1.5 3.56-3.07 4.56v.75l3.91 2.97h.88z\" fill=\"#4285F4\"/>\n      <path d=\"M15.58 25.77A8.845 8.845 0 0 0 24 31.86c1.92 0 3.62-.46 4.97-1.31l4.79 3.71C31.14 36.7 27.65 38 24 38c-5.93 0-11.01-3.4-13.45-8.36l.17-1.01 4.06-2.85h.8z\" fill=\"#34A853\"/>\n      <path d=\"M15.59 20.21a8.864 8.864 0 0 0 0 5.58l-5.03 3.86c-.98-2-1.53-4.25-1.53-6.64 0-2.39.55-4.64 1.53-6.64l1-.22 3.81 2.98.22 1.08z\" fill=\"#FBBC05\"/>\n      <path d=\"M24 14.14c2.11 0 4.02.75 5.52 1.98l4.36-4.36C31.22 9.43 27.81 8 24 8c-5.93 0-11.01 3.4-13.45 8.36l5.03 3.85A8.86 8.86 0 0 1 24 14.14z\" fill=\"#EA4335\"/>\n    <\/svg>\n    <div class=\"gradient-container\"><div class=\"gradient\"><\/div><\/div>\n  <\/div>\n  <div class=\"carousel\">\n    <a class=\"chip\" href=\"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGqC_xrt6OeqNxmAmpx9l9aec5SiQM3o3t912UqsQWQXPXdGJG-Q7SblS69jSol_0hHmGaqseOMr_EO1bH3s5J-Nmgz-K6weVSv2HKBKzPeCKwmDcTdUr0JwcVI3nvIgQWj7en0r0VaVD1ZPFJB5NL55Qip0DBJCRfETbRPlW2aXgFgs6NwFNypKkyKIyZx20aONFGjzvtNMgpPTUGu2SeMWCU43gMo_A5jZz2di9hd41kC82_vN8K2Qj-LdaQfEkZxVvQNsiFk4XWwPBv_95-qqYzGqPPCWSWpNwTZKg3xOiS8VTb_EwgnPNDRppOHgtQa10-Dp0isz48Festuai8=\">&quot;This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information&quot;<\/a>\n  <\/div>\n<\/div>\n","sdk_blob":null},"web_search_queries":["\"This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information\""],"google_maps_widget_context_token":null,"retrieval_queries":null,"source_flagging_uris":null},"raw_response":"{\"document_id\":\"2063\",\"policy_functions\":[{\"function_id\":\"2063:pol:001\",\"label\":\"Prescribe uniform system for national security information\",\"actor\":\"This Order\",\"action\":\"prescribes\",\"target\":\"a uniform system for classifying, declassifying, and safeguarding national security information\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information.\",\"evidence_start\":0,\"evidence_end\":118,\"confidence\":1.0}],\"operative_functions\":[{\"function_id\":\"2063:op:001\",\"segment_id\":\"SEGMENT 2063:oa:001\",\"label\":\"Classify national security information into established levels\",\"actor\":\"\",\"action\":\"shall be classified\",\"target\":\"national security information\",\"mechanism\":\"three levels: Top Secret, Secret, Confidential\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(a) National security information (hereinafter \\\"classified information\\\") shall be classified at one of the following three levels: (1) \\\"Top Secret\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security. (2) \\\"Secret\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security. (3) \\\"Confidential\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security. (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information.\",\"evidence_start\":98,\"evidence_end\":835,\"confidence\":1.0},{\"function_id\":\"2063:op:002\",\"segment_id\":\"SEGMENT 2063:oa:002\",\"label\":\"Safeguard information when classification need is in doubt\",\"actor\":\"original classification authority\",\"action\":\"safeguard and determine classification\",\"target\":\"information with reasonable doubt about classification need\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"If there is reasonable doubt about the need to classify information\",\"timing\":\"within thirty (30) days\",\"evidence\":\"(c) If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days.\",\"evidence_start\":0,\"evidence_end\":247,\"confidence\":1.0},{\"function_id\":\"2063:op:003\",\"segment_id\":\"SEGMENT 2063:oa:003\",\"label\":\"Establish authority and limits for original classification delegation\",\"actor\":\"President, agency heads, and designated officials\",\"action\":\"exercise and delegate\",\"target\":\"original classification authority\",\"mechanism\":\"written delegation\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"within thirty (30) days for doubt determinations\",\"evidence\":\"If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days. Sec. 1.2 Classification Authority. (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register, and (3) officials delegated this authority pursuant to Section 1.2(d). (b) Secret. The authority to classify information originally as Secret may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (c) Confidential. The authority to classify information originally as Confidential may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret or Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (d) Delegation of Original Classification Authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head. (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head. * The citation should read \\\"Section 5.3(a)\\\". [ White House correction] (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head. (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order.\",\"evidence_start\":0,\"evidence_end\":2179,\"confidence\":1.0},{\"function_id\":\"2063:op:004\",\"segment_id\":\"SEGMENT 2063:oa:004\",\"label\":\"Handle exceptional cases of unclassified agency information creation\",\"actor\":\"agency with subject matter interest and ISOO Director\",\"action\":\"protect, transmit, and decide classification\",\"target\":\"information originated by non-cleared agency personnel\",\"mechanism\":\"written identification and agency transmission\",\"effect\":\"\",\"condition\":\"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed to require classification\",\"timing\":\"within thirty (30) days\",\"evidence\":\"It shall identify the official delegated the authority by name or position title. Delegated classification authority includes the authority to classify information at the level granted and lower levels of classification. (e) Exceptional Cases. When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office.\",\"evidence_start\":0,\"evidence_end\":739,\"confidence\":1.0},{\"function_id\":\"2063:op:005\",\"segment_id\":\"SEGMENT 2063:oa:005\",\"label\":\"Specify classification categories and marking standards\",\"actor\":\"ISOO Director and original classification authorities\",\"action\":\"determine, mark, and prescribe standards for\",\"target\":\"classified information categories and document markings\",\"mechanism\":\"implementing directives\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"promptly\",\"evidence\":\"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.3 Classification Categories. (a) Information shall be considered for classification if it concerns: (1) military plans, weapons, or operations; (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security; (3) foreign government information; (4) intelligence activities (including special activities), or intelligence sources or methods; (5) foreign relations or foreign activities of the United States; (6) scientific, technological, or economic matters relating to the national security; (7) United States Government programs for safeguarding nuclear materials or facilities; (8) cryptology; (9) a confidential source; or (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office. (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security. (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security. (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information. Sec. 1.4 Duration of Classification. (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified. (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions. (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order. Sec. 1.5 Identification and Markings. (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information: (1) one of the three classification levels defined in Section 1.1; (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official; (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \\\"Originating Agency's Determination Required.\\\" (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office.\",\"evidence_start\":0,\"evidence_end\":2816,\"confidence\":1.0},{\"function_id\":\"2063:op:006\",\"segment_id\":\"SEGMENT 2063:oa:006\",\"label\":\"Define classification limitations and reclassification procedures\",\"actor\":\"President and authorized agency officials\",\"action\":\"reclassify and derivative classify\",\"target\":\"foreign government and declassified information\",\"mechanism\":\"written determination\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"promptly\",\"evidence\":\"(d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information. (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b). Sec. 1.6 Limitations on Classification. (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office. (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority. Part 2 Derivative Classification Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources. Sec. 2.2 Classification Guides.\",\"evidence_start\":0,\"evidence_end\":2503,\"confidence\":1.0},{\"function_id\":\"2063:op:007\",\"segment_id\":\"SEGMENT 2063:oa:007\",\"label\":\"Prepare and approve classification guides\",\"actor\":\"Agencies with original classification authority\",\"action\":\"prepare and approve\",\"target\":\"classification guides\",\"mechanism\":\"written approval\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and * Ibid. (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. Part 3 Declassification and Downgrading Sec. 3.1 Declassification Authority. (a) Information shall be declassified or downgraded as soon as national security considerations permit.\",\"evidence_start\":0,\"evidence_end\":955,\"confidence\":1.0},{\"function_id\":\"2063:op:008\",\"segment_id\":\"SEGMENT 2063:oa:008\",\"label\":\"Execute systematic declassification review and interagency coordination\",\"actor\":\"Archivist of the United States and originating agencies\",\"action\":\"review and declassify\",\"target\":\"classified records and presidential papers\",\"mechanism\":\"systematic review guidelines\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"as soon as national security considerations permit\",\"evidence\":\"Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order. (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). * * Ibid. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal. (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders. Sec. 3.2 Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order. (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines. Sec. 3.3 Systematic Review for Declassification. (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads. (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States. (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods. Sec. 3.4 Mandatory Review for Declassification.\",\"evidence_start\":0,\"evidence_end\":3045,\"confidence\":1.0},{\"function_id\":\"2063:op:009\",\"segment_id\":\"SEGMENT 2063:oa:009\",\"label\":\"Subject classified information to mandatory declassification review upon request\",\"actor\":\"originating agency\",\"action\":\"review for declassification\",\"target\":\"classified information requested by eligible requesters\",\"mechanism\":\"mandatory review procedures\",\"effect\":\"\",\"condition\":\"if the request is made by a US citizen, permanent resident alien, federal agency, or State/local government and describes the document with sufficient specificity\",\"timing\":\"\",\"evidence\":\"(a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort. (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY].\",\"evidence_start\":0,\"evidence_end\":622,\"confidence\":1.0},{\"function_id\":\"2063:op:010\",\"segment_id\":\"SEGMENT 2063:oa:010\",\"label\":\"Declassify and release information during mandatory review\",\"actor\":\"Agencies conducting mandatory review\",\"action\":\"declassify and release\",\"target\":\"information no longer requiring protection\",\"mechanism\":\"mandated consultation and appeal mechanisms\",\"effect\":\"\",\"condition\":\"unless withholding is otherwise authorized under applicable law\",\"timing\":\"promptly\",\"evidence\":\"Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal. (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law.\",\"evidence_start\":0,\"evidence_end\":729,\"confidence\":1.0},{\"function_id\":\"2063:op:011\",\"segment_id\":\"SEGMENT 2063:oa:011\",\"label\":\"Develop procedures for processing mandatory review requests\",\"actor\":\"Agency heads\",\"action\":\"develop procedures\",\"target\":\"requests for mandatory review and administrative appeals\",\"mechanism\":\"administrative appeal procedures\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request.\",\"evidence_start\":0,\"evidence_end\":307,\"confidence\":1.0},{\"function_id\":\"2063:op:012\",\"segment_id\":\"SEGMENT 2063:oa:012\",\"label\":\"Develop special procedures for cryptologic information review\",\"actor\":\"Secretary of Defense\",\"action\":\"develop special procedures\",\"target\":\"review of cryptologic information\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(e) The Secretary of Defense shall develop special procedures for the review of cryptologic information,\",\"evidence_start\":0,\"evidence_end\":100,\"confidence\":1.0},{\"function_id\":\"2063:op:013\",\"segment_id\":\"SEGMENT 2063:oa:013\",\"label\":\"Develop special procedures for intelligence information review\",\"actor\":\"Director of Central Intelligence\",\"action\":\"develop special procedures\",\"target\":\"review of intelligence information, sources, or methods\",\"mechanism\":\"consultation with affected agencies\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"after consultation with affected agencies\",\"evidence\":\"and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies.\",\"evidence_start\":0,\"evidence_end\":251,\"confidence\":1.0},{\"function_id\":\"2063:op:014\",\"segment_id\":\"SEGMENT 2063:oa:014\",\"label\":\"Establish safeguarding controls and access eligibility standards\",\"actor\":\"Agencies and Archivist\",\"action\":\"establish controls and develop procedures\",\"target\":\"classified information access, dissemination, and referral requests\",\"mechanism\":\"trustworthiness determinations and consent rules\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States. (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order: (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order. (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section. Part 4 Safeguarding Sec. 4.1 General Restrictions on Access. (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes. (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons. (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch. (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency. Sec. 4.2 Special Access Programs. (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence.\",\"evidence_start\":0,\"evidence_end\":2026,\"confidence\":1.0},{\"function_id\":\"2063:op:015\",\"segment_id\":\"SEGMENT 2063:oa:015\",\"label\":\"Maintain special access program accounting and allow historical research access waivers\",\"actor\":\"Agency heads and originating agencies\",\"action\":\"establish, maintain, and grant waivers\",\"target\":\"system of accounting for special access programs and historical researcher access\",\"mechanism\":\"written determination and non-delegable ISOO access\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings. Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees. (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waive
