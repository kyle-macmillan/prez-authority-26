d as provided in Section 4.3(b) for persons who: (1) are engaged in historical research projects, or (2) previously have occupied policy-making positions to which they were appointed by the President. (b) Waivers under Section 4.3(a) may be granted only if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee. Part 5 Implementation and Review Sec. 5.1 Policy Direction.\",\"evidence_start\":0,\"evidence_end\":1210,\"confidence\":1.0},{\"function_id\":\"2063:op:016\",\"segment_id\":\"SEGMENT 2063:oa:016\",\"label\":\"Direct, implement, and oversee information security program\",\"actor\":\"National Security Council, Administrator of General Services, ISOO Director, and agency heads\",\"action\":\"provide direction, implement, oversee, and designate senior agency official\",\"target\":\"information security program implementation and oversight\",\"mechanism\":\"binding directives, regulations review, and on-site reviews\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"at least annually for reporting\",\"evidence\":\"(a) The National Security Council shall provide overall policy direction for the information security program. (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office. Sec. 5.2 Information Security Oversight Office. (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority to appoint a staff for the Office.(b) The Director shall: (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies; (f) oversee agency actions to ensure compliance with this Order and implementing directives; (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal; (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal; * Ibid. (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval; (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program; (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program; (8) report at least annually to the President through the National Security Council on the implementation of this Order; and (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program. Sec. 5.3 General Responsibilities. Agencies that originate or handle classified information shall: (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order; (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas. Sec. 5.4 Sanctions.\",\"evidence_start\":0,\"evidence_end\":3267,\"confidence\":1.0},{\"function_id\":\"2063:op:017\",\"segment_id\":\"SEGMENT 2063:oa:017\",\"label\":\"Report possible security violations to agency head\",\"actor\":\"Director of the Information Security Oversight Office\",\"action\":\"report\",\"target\":\"possible violations of this Order or implementing directives\",\"mechanism\":\"written report to agency head or senior official\",\"effect\":\"\",\"condition\":\"If the Director finds that a violation may have occurred\",\"timing\":\"\",\"evidence\":\"(a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken. * Ibid.\",\"evidence_start\":0,\"evidence_end\":338,\"confidence\":1.0},{\"function_id\":\"2063:op:018\",\"segment_id\":\"SEGMENT 2063:oa:018\",\"label\":\"Subject personnel to sanctions for security violations\",\"actor\":\"Agency heads and senior agency officials\",\"action\":\"subject to sanctions and ensure prompt corrective action\",\"target\":\"officers, employees, contractors, licensees, and grantees violating classification provisions\",\"mechanism\":\"reprimand, suspension, removal, or termination of authority\",\"effect\":\"\",\"condition\":\"if they knowingly, willfully, or negligently disclose properly classified information or violate order provisions\",\"timing\":\"promptly\",\"evidence\":\"(b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or (3) knowingly and willfully violate any other provision of this Order or implementing directive. (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs.\",\"evidence_start\":0,\"evidence_end\":852,\"confidence\":1.0},{\"function_id\":\"2063:op:019\",\"segment_id\":\"SEGMENT 2063:oa:019\",\"label\":\"Notify ISOO Director of security violations\",\"actor\":\"Agency head or designated senior official\",\"action\":\"ensure notification\",\"target\":\"Director of the Information Security Oversight Office\",\"mechanism\":\"prompt notification\",\"effect\":\"\",\"condition\":\"whenever a violation under Section 5.4 (b)(1) or (2) occurs\",\"timing\":\"promptly\",\"evidence\":\"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs. * Ibid Part 6 General Provisions Sec. 6.1 Definitions. (a) \\\"Agency\\\" has the meaning provided at [AUTHORITY] (b) \\\"Information\\\" means any information or material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. (c) \\\"National security information\\\" means information that has been determined pursuant to this Order or any predecessor order to require protection against unauthorized disclosure and that is so designated. (d) \\\"Foreign government information\\\" means: (1) information provided by a foreign government or governments, an international organization of governments, or any element thereof with the expectation, expressed or implied, that the information, the source of the information, or both, are to be held in confidence; or (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence. (e) \\\"National security\\\" means the national defense or foreign relations of the United States. (f) \\\"Confidential source\\\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation, expressed or implied, that the information or relationship, or both, be held in confidence. (g) \\\"Original classification\\\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure, together with a classification designation signifying the level of protection required. Sec. 6.2 General.\",\"evidence_start\":0,\"evidence_end\":1729,\"confidence\":1.0}],\"notes\":\"\"}"},{"document_id":"1375","document_type":"executive_order","identifier":"13044","title":"amending executive order 12752 implementation the agricultural trade","date":"April 18, 1997","url":"https://www.presidency.ucsb.edu/documents/executive-order-13044-amending-executive-order-12752-implementation-the-agricultural-trade","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], and in order to provide for carrying out the provisions of the Agricultural Trade Development and [AUTHORITY], as amended by [AUTHORITY] ([AUTHORITY]), it is hereby ordered that:  (1) The first sentence of section 1(a) of [AUTHORITY] be amended by deleting the words \"developing countries\" and inserting the words \"developing countries and private entities\" in lieu thereof;  (2) Sections 4(a) and (c) be deleted; and  (3) Sections 4(b), (d), (e), (f), and (g) be renumbered as sections 4(a), (b), (c), (d), and (e), respectively.  William J. Clinton  The White House,  April 18, 1997.  [Filed with the Office of the Federal Register, 11:17 a.m., April 21, 1997]","segments":[{"segment_id":"1375:oa:001","segment_index":1,"text":"it is hereby ordered that: (1) The first sentence of section 1(a) of [AUTHORITY] be amended by deleting the words \"developing countries\" and inserting the words \"developing countries and private entities\" in lieu thereof; (2) Sections 4(a) and (c) be deleted; and (3) Sections 4(b), (d), (e), (f), and (g) be renumbe \"evidence_start\":185,\"evidence_end\":361,\"confidence\":1.0}],\"operative_functions\":[{\"function_id\":\"3643:of:001\",\"segment_id\":\"SEGMENT 3643:oa:001\",\"label\":\"Amend Section 2 of Executive Order of March 4, 1958\",\"actor\":\"President\",\"action\":\"amend\",\"target\":\"Section 2 of [AUTHORITY] of March 4, 1958 (23 F. R. 1589), entitled \\\"Establishing a Career Executive Program within the Civil Service System,\\\"\",\"mechanism\":\"is hereby amended to read as follows:\",\"effect\":\"Replaces Section 2 of Executive Order of March 4, 1958.\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"Section 2 of [AUTHORITY] of March 4, 1958 (23 F. R. 1589), entitled \\\"Establishing a Career Executive Program within the Civil Service System,\\\" is hereby amended to read as follows:\",\"evidence_start\":0,\"evidence_end\":176,\"confidence\":1.0},{\"function_id\":\"3643:of:002\",\"segment_id\":\"SEGMENT 3643:oa:002\",\"label\":\"Establish seven-member Career Executive Board and set membership rules\",\"actor\":\"President\",\"action\":\"establish\",\"target\":\"Career Executive Board\",\"mechanism\":\"composed of seven members... appointed by the President from private life and... representative of an executive agency\",\"effect\":\"Establishes a seven-member Career Executive Board, specifying Presidential appointment from private life, executive agency representation, political balance, and Chairman designation.\",\"condition\":\"\",\"timing\":\"from time to time\",\"evidence\":\"There is hereby established the Career Executive Board, hereinafter referred to as the Board, which shall be composed of seven members. Four of the members shall be appointed by the President from private life and each of three of the members shall be a representative of an executive agency in consonance with [AUTHORITY], 1946, approved May 3, 1945 ([AUTHORITY]; [AUTHORITY] One of the agencies so represented shall be the Commission and the other two shall be such executive agencies, other than the Commission, as the President may from time to time designate. Not more than four members of the Board shall be adherents of the same political party. The Chairman of the Board shall be designated from time to time by the President from among the members of the Board.\\\"\",\"evidence_start\":0,\"evidence_end\":754,\"confidence\":1.0}],\"notes\":\"\"}"},{"document_id":"3943","document_type":"executive_order","identifier":"10479","title":"establishing the government contract committee","date":"August 13, 1953","url":"https://www.presidency.ucsb.edu/documents/executive-order-10479-establishing-the-government-contract-committee","source_text":"WHEREAS it is in the interest of the Nation's economy and security to promote the fullest utilization of all available manpower; and  WHEREAS it is the policy of the United States Government to promote equal employment opportunity for all qualified persons employed or seeking employment on government contracts because such persons are entitled to fair and equitable treatment in all aspects of employment on work paid for from public funds; and  WHEREAS it is the obligation of the contracting agencies of the United States Government and government contractors to insure compliance with, and successful execution of, the equal employment opportunity program of the United States Government; and  WHEREAS existing executive orders require the government contracting agencies to include in their contracts a provision obligating the government contractor not to discriminate against any employee or applicant for employment because of race, creed, color, or national origin and obligating the government contractor to include a similar provision in all subcontracts; and  WHEREAS a review and analysis of existing practices and procedures of government contracting agencies show that the practices and procedures relating to compliance with the nondiscrimination provisions must be revised and strengthened to eliminate discrimination in all aspects of employment:  NOW, THEREFORE, by virtue of the authority vested in me by [AUTHORITY] and statutes, and as President of the United States, and pursuant to the authority conferred by and subject to the provisions of section 214 of [AUTHORITY]. [AUTHORITY], ([AUTHORITY], it is ordered as follows:  SECTION 1. The head of each contracting agency of the Government of the United States shall be primarily responsible for obtaining compliance by any contractor or subcontractor with the said nondiscrimination provisions of any contract entered into, amended, or modified by his agency and of any subcontract thereunder, and shall take appropriate measures to bring about the said compliance.  SEC. 2. The head of each contracting agency shall take appropriate measures, including but not limited to the establishment of compliance procedures, to carry out the responsibility set forth in section 1 hereof.  SEC. 3. There is hereby established the Government Contract Committee, hereinafter referred to as the Committee. The Committee shall be composed of fourteen members as follows:  (a) One representative of the following-named agencies to be designated by the respective heads of such agencies: the Atomic Energy Commission, the Department of Commerce, the Department of Defense, the Department of Justice, the Department of Labor, and the General Services Administration.  (b) Eight other members to be appointed by the President. The Chairman and Vice Chairman shall be designated by the President.  SEC. 4. The Committee shall make recommendations to the contracting agencies for improving and making more effective the nondiscrimination provisions of government contracts. All contracting agencies of the Government are directed and authorized to cooperate with the Committee and, to the extent permitted by law, to furnish the Committee such information and assistance as it may require in the performance of its functions under this order. The Committee shall establish such rules as may be necessary for the performance of its functions under this order, and shall make annual or semiannual reports on its progress to the President.  SEC 5. The Committee may receive complaints of alleged violations of the nondiscrimination provisions of government contracts. Complaints received shall be transmitted by the Committee to the appropriate contracting agencies to be processed in accordance with the agencies' procedure for handling such complaints. Each contracting agency shall report to the Committee the action taken with respect to all complaints received by the agency, including those transmitted by the Committee. The Committee shall review and analyze the reports submitted to it by the contracting agencies.  SEC 6. The Committee shall encourage the furtherance of an educational program by employer, labor, civic, educational, religious, and other voluntary non-governmental groups in order to eliminate or reduce the basic causes and costs of discrimination in employment.  SEC. 7. The Committee is authorized to establish and maintain cooperative relationships with agencies of state and local governments, as well as with non-governmental bodies, to assist in achieving the purposes of this order.  SEC. 8. The government agencies (except the Department of Justice) designated in section 3 (a) of this order shall defray such necessary expenses of the Committee as may be authorized by law, Including section 214 of [AUTHORITY], [AUTHORITY] ([AUTHORITY]; provided that no agency shall supply more than 50% of the funds necessary to carry out the purposes of this order. The Department of Labor shall provide necessary space and facilities for the Committee. In the case of the Department of Justice the contribution shall be limited to the rendering of legal services.  SEC. 9. [AUTHORITY] of December 5, 1951 (16 P. R. 12303) is hereby revoked and the Committee on Government Contract Compliance established thereby is abolished All records and property of the said Committee are transferred to the Government Contract Committee. The latter Committee shall wind up any outstanding affairs of the abolished Committee.  DWIGHT D. EISENHOWER  THE WHITE HOUSE,  August 13, 1953.","segments":[{"segment_id":"3943:oa:001","segment_index":1,"text":"The head of each contracting agency of the Government of the United States shall be primarily responsible for obtaining compliance by any contractor or subcontractor with the said nondiscrimination provisions of any contract entered into, amended, or modified by his agency and of any subcontract thereunder, and shall take appropriate measures to bring about the said compliance. SEC. 2."},{"segment_id":"3943:oa:002","segment_index":2,"text":"The head of each contracting agency shall take appropriate measures, including but not limited to the establishment of compliance procedures, to carry out the responsibility set forth in section 1 hereof. SEC. 3."},{"segment_id":"3943:oa:003","segment_index":3,"text":"There is hereby established the Government Contract Committee, hereinafter referred to as the Committee. The Committee shall be composed of fourteen members as follows: (a) One representative of the following-named agencies to be designated by the respective heads of such agencies: the Atomic Energy Commission, the Department of Commerce, the Department of Defense, the Department of Justice, the Department of Labor, and the General Services Administration. (b) Eight other members to be appointed by the President. The Chairman and Vice Chairman shall be designated by the President. SEC. 4."},{"segment_id":"3943:oa:004","segment_index":4,"text":"The Committee shall make recommendations to the contracting agencies for improving and making more effective the nondiscrimination provisions of government contracts. All contracting agencies of the Government are directed and authorized to cooperate with the Committee and, to the extent permitted by law, to furnish the Committee such information and assistance as it may require in the performance of its functions under this order."},{"segment_id":"3943:oa:005","segment_index":5,"text":"The Committee shall establish such rules as may be necessary for the performance of its functions under this order,"},{"segment_id":"3943:oa:006","segment_index":6,"text":"and shall make annual or semiannual reports on its progress to the President. SEC 5. The Committee may receive complaints of alleged violations of the nondiscrimination provisions of government contracts. Complaints received shall be transmitted by the Committee to the appropriate contracting agencies to be processed in accordance with the agencies' procedure for handling such complaints."},{"segment_id":"3943:oa:007","segment_index":7,"text":"Each contracting agency shall report to the Committee the action taken with respect to all complaints received by the agency, including those transmitted by the Committee."},{"segment_id":"3943:oa:008","segment_index":8,"text":"The Committee shall review and analyze the reports submitted to it by the contracting agencies. SEC 6. The Committee shall encourage the furtherance of an educational program by employer, labor, civic, educational, religious, and other voluntary non-governmental groups in order to eliminate or reduce the basic causes and costs of discrimination in employment. SEC. 7."},{"segment_id":"3943:oa:009","segment_index":9,"text":"The Committee is authorized to establish and maintain cooperative relationships with agencies of state and local governments, as well as with non-governmental bodies, to assist in achieving the purposes of this order. SEC. 8."},{"segment_id":"3943:oa:010","segment_index":10,"text":"The government agencies (except the Department of Justice) designated in section 3 (a) of this order shall defray such necessary expenses of the Committee as may be authorized by law, Including section 214 of [AUTHORITY], [AUTHORITY] ([AUTHORITY]; provided that no agency shall supply more than 50% of the funds necessary to carry out the purposes of this order. The Department of Labor shall provide necessary space and facilities for the Committee. In the case of the Department of Justice the contribution shall be limited to the rendering of legal services."},{"segment_id":"3943:oa:011","segment_index":11,"text":"SEC. 9. [AUTHORITY] of December 5, 1951 (16 P. R. 12303) is hereby revoked and the Committee on Government Contract Compliance established thereby is abolished All records and property of the said Committee are transferred to the Government Contract Committee. The latter Committee shall wind up any outstanding affairs of the abolished Committee."}],"policy_functions":[{"function_id":"3943:pf:001","label":"Promote equal employment opportunity in government contracts","actor":"United States Government","action":"promote","target":"equal employment opportunity for all qualified persons employed or seeking employment on government contracts","mechanism":"fair and equitable treatment in all aspects of employment on work paid for from public funds","effect":"utilization of available manpower and elimination of discrimination in employment","condition":"","timing":"","evidence":"it is the policy of the United States Government to promote equal employment opportunity for all qualified persons employed or seeking employment on government contracts because such persons are entitled to fair and equitable treatment in all aspects of employment on work paid for from public funds;","evidence_start":142,"evidence_end":442,"confidence":"high"}],"operative_functions":[{"function_id":"3943:of:001","label":"Assign agency heads primary responsibility for obtaining contract compliance","actor":"The head of each contracting agency of the Government of the United States","action":"shall be primarily responsible for obtaining compliance","target":"any contractor or subcontractor with the said nondiscrimination provisions of any contract entered into, amended, or modified by his agenc y vested in me as President by [AUTHORITY] and [AUTHORITY], it is hereby ordered as follows:  Section 1. All executive departments and agencies of the Federal Government shall be closed and their employees excused from duty for the last half of the scheduled workday on Christmas Eve, December 24, 1998, except as provided in section 2 below.  Sec. 2. The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons.  Sec. 3. Thursday, December 24, 1998, shall be considered as falling within the scope of [AUTHORITY] and of [AUTHORITY] and 6103(b) and other similar statutes insofar as they relate to the pay and leave of employees of the United States.  Sec. 4. This order shall apply to executive departments and agencies of the Federal Government only and is not intended to direct or otherwise implicate departments or agencies of State or local governments.  William J. Clinton  The White House,  December 17, 1998.  [Filed with the Office of the Federal Register, 8:45 a.m., December 21, 1998]","segments":[{"segment_id":"1310:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. All executive departments and agencies of the Federal Government shall be closed and their employees excused from duty for the last half of the scheduled workday on Christmas Eve, December 24, 1998, except as provided in section 2 below. Sec. 2. The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons. Sec. 3. Thursday, Dec istmas Eve, December 24, 1998\",\"evidence\":\"Section 1. All executive departments and agencies of the Federal Government shall be closed and their employees excused from duty for the last half of the scheduled workday on Christmas Eve, December 24, 1998, except as provided in section 2 below.\",\"evidence_start\":32,\"evidence_end\":280,\"confidence\":1.0},{\"segment_id\":\"1310:oa:001\",\"function_id\":\"1310:of:002\",\"label\":\"Authorize agency heads to maintain essential operations and staff\",\"actor\":\"heads of executive departments and agencies\",\"action\":\"may determine that certain offices and installations must remain open and certain employees must remain on duty\",\"target\":\"offices, installations, and employees\",\"mechanism\":\"head determination\",\"effect\":\"remain open and remain on duty for the full scheduled workday\",\"condition\":\"for reasons of national security or defense or for other essential public reasons\",\"timing\":\"December 24, 1998\",\"evidence\":\"Sec. 2. The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons.\",\"evidence_start\":281,\"evidence_end\":631,\"confidence\":1.0},{\"segment_id\":\"1310:oa:001\",\"function_id\":\"1310:of:003\",\"label\":\"Apply pay and leave statutes to Christmas Eve workday\",\"actor\":\"\",\"action\":\"shall be considered as falling within the scope of statutes\",\"target\":\"pay and leave of employees of the United States\",\"mechanism\":\"statutory inclusion\",\"effect\":\"statutory pay and leave rules apply\",\"condition\":\"insofar as they relate to the pay and leave of employees of the United States\",\"timing\":\"Thursday, December 24, 1998\",\"evidence\":\"Sec. 3. Thursday, December 24, 1998, shall be considered as falling within the scope of [AUTHORITY] and of [AUTHORITY] and 6103(b) and other similar statutes insofar as they relate to the pay and leave of employees of the United States.\",\"evidence_start\":632,\"evidence_end\":868,\"confidence\":1.0},{\"segment_id\":\"1310:oa:001\",\"function_id\":\"1310:of:004\",\"label\":\"Limit order application to Federal executive departments and agencies\",\"actor\":\"This order\",\"action\":\"shall apply to executive departments and agencies of the Federal Government only\",\"target\":\"executive departments and agencies of the Federal Government\",\"mechanism\":\"\",\"effect\":\"not intended to direct or otherwise implicate departments or agencies of State or local governments\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"Sec. 4. This order shall apply to executive departments and agencies of the Federal Government only and is not intended to direct or otherwise implicate departments or agencies of State or local governments.\",\"evidence_start\":869,\"evidence_end\":1076,\"confidence\":1.0}],\"notes\":\"\"}"},{"document_id":"1234","document_type":"executive_order","identifier":"13185","title":"strengthen the federal government university research partnership","date":"December 28, 2000","url":"https://www.presidency.ucsb.edu/documents/executive-order-13185-strengthen-the-federal-government-university-research-partnership","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], and in order to keep the Federal Government-University research partnership strong, it is hereby ordered as follows:  Section 1. Principles of the Government-University Partnership. The partnership in science and technology that has evolved between the Federal Government and American universities has yielded benefits that are vital to each. It continues to prove exceptionally productive, successfully promoting the discovery of knowledge, stimulating technological innovation, improving the quality of life, educating and training the next generation of scientists and engineers, and contributing to America’s economic prosperity and national security. In order to reaffirm and strengthen this partnership, this order sets forth the following guiding and operating principles that are fully described in the April 1999 National Science and Technology Council report, \"Renewing the Government-University Partnership.\" These principles shall provide the framework for the development and analysis of all future Federal policies, rules, and regulations for the Federal Government-University research partnership.  (a) The guiding principles that shall govern interactions between the Federal Government and universities that perform research are: (1) Research is an investment in the future; (2) The integration of research and education is vital; (3) Excellence is promoted when investments are guided by merit review; and (4) Research must be conducted with integrity. (b) The operating principles that shall assist agencies, universities, individual researchers, and auditing and regulatory bodies in implementing the guiding principles are: (1) Agency cost-sharing policies and practices must be transparent; (2) Partners should respect the merit review process; (3) Agencies and universities should manage research in a cost-efficient manner; (4) Accountability and accounting are not the same; (5) The benefits of simplicity in policies and practices should be weighed against the costs; (6) Change should be justified by need and the process made transparent. (c) Each executive branch department or agency that supports research at universities shall regularly review its existing policies and procedures to ensure that they meet the spirit and intent of the guiding and operating principles stated above.  Sec. 2. Office of Science and Technology (OSTP) Review of the Government-University Research Partnership. (a) The OSTP, in conjunction with the National Science and Technology Council, shall conduct a regular review of the Government-University research partnership and prepare a report on the status of the partnership. The OSTP should receive input from all departments or agencies that have a major impact on the Government-University partnership through their support of research and education, policy making, regulatory activities, and research administra tion. In addition, OSTP may seek the input of the National Science Board and the President’s Committee of Advisors for Science and Technology, as well as other stakeholders, such as State and local governments, industry, the National Academy of Sciences, and the Federal Demonstration Partnership.  (b) The purpose of the review and the report is to determine the overall health of the Government-University research partnership, being mindful of the guiding and operating principles stated above. The report should include recommendations on how to improve the Government- University partnership.  (c) The Director of OSTP shall deliver the report to the President.  Sec. 3. Judicial Review. This order does not create any enforceable rights against the United States, its agencies, its officers, or any person.  William J. Clinton  THE WHITE HOUSE,  December 28, 2000.","segments":[{"segment_id":"1234:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. Principles of the Government-University Partnership. The partnership in science and technology that has evolved between the Federal Government and American universities has yielded benefits that are vital to each. It continues to prove exceptionally productive, successfully promoting the discovery of knowledge, stimulating technological innovation, improving the quality of life, educating and training the next generation of scientists and engineers, and contributing to America’s economic prosperity and national security."},{"segment_id":"1234:oa:002","segment_index":2,"text":"In order to reaffirm and strengthen this partnership, this order sets for s vital; (3) Excellence is promoted when investments are guided by merit review; and (4) Research must be conducted with integrity\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(a) The guiding principles that shall govern interactions between the Federal Government and universities that perform research are: (1) Research is an investment in the future; (2) The integration of research and education is vital; (3) Excellence is promoted when investments are guided by merit review; and (4) Research must be conducted with integrity.\",\"evidence_start\":457,\"evidence_end\":807,\"confidence\":1.0},{\"segment_id\":\"1234:oa:003\",\"function_id\":\"of_3\",\"label\":\"Provide operating principles to assist agencies and entities in implementing guiding principles\",\"actor\":\"operating principles\",\"action\":\"shall assist\",\"target\":\"agencies, universities, individual researchers, and auditing and regulatory bodies\",\"mechanism\":\"implementing the guiding principles\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(b) The operating principles that shall assist agencies, universities, individual researchers, and auditing and regulatory bodies in implementing the guiding principles are: (1) Agency cost-sharing policies and practices must be transparent; (2) Partners should respect the merit review process; (3) Agencies and universities should manage research in a cost-efficient manner; (4) Accountability and accounting are not the same; (5) The benefits of simplicity in policies and practices should be weighed against the costs; (6) Change should be justified by need and the process made transparent.\",\"evidence_start\":0,\"evidence_end\":574,\"confidence\":1.0},{\"segment_id\":\"1234:oa:003\",\"function_id\":\"of_4\",\"label\":\"Require executive departments and agencies to regularly review research policies and procedures\",\"actor\":\"Each executive branch department or agency that supports research at universities\",\"action\":\"shall regularly review\",\"target\":\"its existing policies and procedures\",\"mechanism\":\"\",\"effect\":\"ensure that they meet the spirit and intent of the guiding and operating principles stated above\",\"condition\":\"\",\"timing\":\"regularly\",\"evidence\":\"(c) Each executive branch department or agency that supports research at universities shall regularly review its existing policies and procedures to ensure that they meet the spirit and intent of the guiding and operating principles stated above.\",\"evidence_start\":575,\"evidence_end\":803,\"confidence\":1.0},{\"segment_id\":\"1234:oa:004\",\"function_id\":\"of_5\",\"label\":\"Conduct regular review of research partnership and prepare status report\",\"actor\":\"The OSTP, in conjunction with the National Science and Technology Council\",\"action\":\"shall conduct\",\"target\":\"regular review of the Government-University research partnership and prepare a report on the status of the partnership\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"regular\",\"evidence\":\"(a) The OSTP, in conjunction with the National Science and Technology Council, shall conduct a regular review of the Government-University research partnership and prepare a report on the status of the partnership.\",\"evidence_start\":0,\"evidence_end\":212,\"confidence\":1.0},{\"segment_id\":\"1234:oa:004\",\"function_id\":\"of_6\",\"label\":\"Authorize OSTP to seek input from advisory bodies and external stakeholders\",\"actor\":\"OSTP\",\"action\":\"may seek\",\"target\":\"input of the National Science Board and the President’s Committee of Advisors for Science and Technology, as well as other stakeholders, such as State and local governments, industry, the National Academy of Sciences, and the Federal Demonstration Partnership\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"In addition, OSTP may seek the input of the National Science Board and the President’s Committee of Advisors for Science and Technology, as well as other stakeholders, such as State and local governments, industry, the National Academy of Sciences, and the Federal Demonstration Partnership.\",\"evidence_start\":460,\"evidence_end\":740,\"confidence\":1.0},{\"segment_id\":\"1234:oa:004\",\"function_id\":\"of_7\",\"label\":\"Direct Director of OSTP to deliver research partnership report to the President\",\"actor\":\"The Director of OSTP\",\"action\":\"shall deliver\",\"target\":\"the report to the President\",\"mechanism\":\"\",\"effect\":\"\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"(c) The Director of OSTP shall deliver the report to the President.\",\"evidence_start\":1044,\"evidence_end\":1106,\"confidence\":1.0}],\"notes\":\"\"}"},{"document_id":"1137","document_type":"executive_order","identifier":"13282","title":"adjustments certain rates pay","date":"December 31, 2002","url":"https://www.presidency.ucsb.edu/documents/executive-order-13282-adjustments-certain-rates-pay","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], including the laws cited herein, it is hereby ordered as follows:  Section 1. Statutory Pay Systems. The rates of basic pay or salaries of the statutory pay systems (as defined in [AUTHORITY], as adjusted under [AUTHORITY], are set forth on the schedules attached hereto and made a part hereof:  (a) The General Schedule ([AUTHORITY] at Schedule 1;  (b) The Foreign Service Schedule ([AUTHORITY] at Schedule 2; and  (c) The schedules for the Veterans Health Administration of the Department of Veterans Affairs ([AUTHORITY], 7404; section 301(a) of [AUTHORITY]–40) at Schedule  3.  Sec. 2. Senior Executive Service. The rates of basic pay for senior executives in the Senior Executive Service, as adjusted under [AUTHORITY], are set forth on Schedule 4 attached hereto and made a part hereof.  Sec. 3. Executive Salaries. The rates of basic pay or salaries for the following offices and positions are set forth on the schedules attached hereto and made a part hereof:  (a) The Executive Schedule ([AUTHORITY] at Schedule 5; (b) The Vice President ([AUTHORITY] and the Congress ([AUTHORITY] at Schedule 6; and (c) Justices and judges ([AUTHORITY], 44(d), 135, 252, and 461(a), and section 140 of [AUTHORITY]–92) at Schedule 7.  Sec. 4. Uniformed Services. Pursuant to section 601(a)–(b) of [AUTHORITY]–314, the rates of monthly basic pay ([AUTHORITY] for members of the uniformed services and the rate of monthly cadet or midshipman pay ([AUTHORITY] are set forth on Schedule 8 attached hereto and made a part hereof.  Sec. 5. Locality-Based Comparability Payments.  (a) Pursuant to [AUTHORITY], locality-based comparability payments shall be paid in accordance with Schedule 9 attached hereto and made a part hereof. (b) The Director of the Office of Personnel Management shall take such actions as may be necessary to implement these payments and to publish appropriate notice of such payments in the Federal Register.  Sec. 6. Administrative Law Judges. The rates of basic pay for administrative law judges, as adjusted under [AUTHORITY], are set forth on Schedule 10 attached hereto and made a part hereof.  Sec. 7. Effective Dates. Schedule 8 is effective on January 1, 2003. The other schedules contained herein are effective on the first day of the first applicable pay period beginning on or after January 1, 2003.  Sec. 8. Prior Order Superseded. [AUTHORITY] of December 28, 2001, is superseded. GEORGE W. BUSH  The White House,  December 31, 2002.  [Filed with the Office of the Federal Register, 8:45 a.m., January 7, 2003]","segments":[{"segment_id":"1137:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. Statutory Pay Systems. The rates of basic pay or salaries of the statutory pay systems (as defined in [AUTHORITY], as adjusted under [AUTHORITY], are set forth on the schedules attached hereto and made a part hereof: (a) The General Schedule ([AUTHORITY] at Sch dministrative law judges, as adjusted under [AUTHORITY], are set forth on Schedule 10 attached hereto and made a part hereof.\",\"evidence_start\":197,\"evidence_end\":383,\"confidence\":0.95},{\"function_id\":\"of_1137_08\",\"segment_id\":\"SEGMENT 1137:oa:003\",\"label\":\"Establish effective dates for pay schedules\",\"actor\":\"President\",\"action\":\"establish effective dates\",\"target\":\"pay schedules contained in Executive Order\",\"mechanism\":\"\",\"effect\":\"makes Schedule 8 effective January 1, 2003, and all other schedules effective on the first day of the first applicable pay period on or after January 1, 2003\",\"condition\":\"\",\"timing\":\"January 1, 2003 / first day of first applicable pay period beginning on or after January 1, 2003\",\"evidence\":\"Sec. 7. Effective Dates. Schedule 8 is effective on January 1, 2003. The other schedules contained herein are effective on the first day of the first applicable pay period beginning on or after January 1, 2003.\",\"evidence_start\":384,\"evidence_end\":591,\"confidence\":0.95},{\"function_id\":\"of_1137_09\",\"segment_id\":\"SEGMENT 1137:oa:003\",\"label\":\"Supersede prior pay order\",\"actor\":\"President\",\"action\":\"supersede\",\"target\":\"Executive Order of December 28, 2001\",\"mechanism\":\"\",\"effect\":\"replaces the prior annual pay adjustment Executive Order\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"Sec. 8. Prior Order Superseded. [AUTHORITY] of December 28, 2001, is superseded.\",\"evidence_start\":592,\"evidence_end\":668,\"confidence\":0.95}],\"notes\":\"\"}"},{"document_id":"819","document_type":"executive_order","identifier":"13600","title":"establishing the presidents global development council","date":"February 09, 2012","url":"https://www.presidency.ucsb.edu/documents/executive-order-13600-establishing-the-presidents-global-development-council","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], it is hereby ordered as follows:  Section 1. Policy. To help protect national security and further American economic, humanitarian, and strategic interests in the world, it is the policy of the Federal Government to promote and elevate development as a core pillar of American power and chart a course for development, diplomacy, and defense to reinforce and complement one another. As stated in the 2010 National Security Strategy and the Presidential Policy Directive on Global Development, the successful pursuit of development is essential to advancing our national security objectives: security, prosperity, respect for universal values, and a just and sustainable international order. The effectiveness of this development policy will depend in large measure on how we engage with partners, beneficiaries of our development assistance, and stakeholders. We will use evidence-based decision-making in all areas of U.S. development policy and programs, and we commit to foster development expertise and learning worldwide.  Sec. 2. Establishment. There is established the President's Global Development Council (Council). The Council shall be established for administrative purposes within the United States Agency for International Development (USAID) subject to the foreign policy and budgetary guidance of the Secretary of State.  Sec. 3. Membership. The membership of the Council shall be as follows:  (a) The Council shall be composed of the officials described in paragraph (b) of this section and not more than 12 individuals from outside the Federal Government appointed by the President. Appointed members of the Council may serve as representatives of a variety of sectors, including, among others, institutions of higher education, non-profit and philanthropic organizations, civil society, and private industry.  (b) The Secretary of State, the Secretary of the Treasury, the Secretary of Defense, the USAID Administrator, and the [AUTHORITY] Officer of the Millennium Challenge Corporation shall serve as non-voting members of the Council and may designate, to perform the Council functions of the member, a senior-level official who is part of the member's department, agency, or office, and who is a full-time officer or employee of the Federal Government.  (c) The President shall designate a member of the Council to serve as Chair and another member to serve as Vice Chair. The Chair shall convene and preside at meetings of the Council, determine meeting agendas, and direct its work. The Vice Chair shall perform the duties of the Chair in the absence of the Chair and shall perform such other functions as the Chair may assign.  (d) The term of office of members appointed by the President from outside the Federal Government shall be 2 years, and such members shall be eligible for reappointment and may continue to serve after the expiration of their terms until the President appoints a successor. A member appointed to fill a vacancy shall serve only for the unexpired term of such vacancy.  Sec. 4. Mission and Functions. The Council shall advise and support the President, through the National Security Staff and the National Economic Council staff, in furtherance of the policy set forth in section 1 of this order. The Council shall meet regularly and shall:  (a) inform the policy and practice of U.S. global development policy and programs by providing advice to the President and other senior officials on issues including:  (i) innovative, scalable approaches to development with proven demonstrable impact, particularly on sustainable economic growth and good governance;  (ii) areas for enhanced collaboration between the Federal Government and public and private sectors to advance development policy;  (iii) best practices for and effectiveness of research and development in low and middle income economies; and  (iv) long-term solutions to issues central to strategic planning for U.S. development efforts;  (b) support new and existing public-private partnerships by:  (i) identifying key areas for enhanced collaboration and any barriers to collaboration; and  (ii) recommending concrete efforts that the private and public sectors together can take to promote economic development priorities and initiatives; and  (c) increase awareness and action in support of development by soliciting public input on current and emerging issues in the field of global development as well as bringing to the President's attention concerns and ideas that would inform policy options.  Sec. 5. Administration of the Council. (a) The heads of executive departments and agencies shall assist and provide information to the Council, consistent with applicable law, as may be necessary to carry out the functions of the Council.  (b) Funding and administrative support for the Council shall be provided by USAID to the extent permitted by law and within existing appropriations.  (c) The USAID Administrator shall appoint an Executive Director who shall be a Federal officer or employee of USAID and serve as a liaison to the Administrator and the Executive Office of the President and consult with relevant executive departments, agencies, and offices on matters and activities pertaining to the Council.  (d) The members of the Council who are appointed from outside the Federal Government shall serve without compensation for their work on the Council. Members of the Council may, however, receive travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the Government service ([AUTHORITY]  (e) Insofar as [AUTHORITY] (FACA), as amended ([AUTHORITY], may apply to the Council, any functions of the President under FACA, except that of reporting to the Congress, shall be performed by the USAID Administrator in accordance with the guidelines issued by the Administrator of General Services.  Sec. 6. Termination. The Council shall terminate 2 years after the date of this order, unless renewed by the President.  BARACK OBAMA  The White House,  February 9, 2012","segments":[{"segment_id":"819:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. Policy. To help protect national security and further American economic, humanitarian, and strategic interests in the world, it is the policy of the Federal Government to promote and elevate development as a core pillar of American power and chart a course for development, diplomacy, and defense to reinforce and complement one another. As stated in the 2010 National Security Strategy and the Presidential Policy Directive on Global Development, the successful pursuit of development is essential to advancing our national security objectives: security, prosperity, respect for universal values, and a just and sustainable international order. The effectiveness of this development policy will depend in large measure on how we engage with partners, beneficiaries of our development assistance, and stakeholders. We will use evidence-based decision-making in all areas of U.S. development policy and programs, and we commit to foster development expertise and learning worldwide. Sec. 2. Establishment. There is established the President's Global Development Council (Council). The Council shall be established for administrative purposes within the United States Agency for International Development (USAID) subject to the foreign policy and budgetary guidance of the Secretary of State. Sec. 3. Membership. The membership of the Council shall be as follows: (a) The Council shall be composed of the officials described in paragraph (b) of this section and not more than 12 individuals from outside the Federal Government appointed by the President. Appointed members of the Council may serve as representatives of a variety of sectors, including, among others, institutions of higher education, non-profit and philanthropic organizations, civil society, and private industry. (b) The Secretary of State, the Secretary of the Treasury, the Secretary of Defense, the U function highlight(text,fs,cls){let rs=[];for(const f of fs){let n=f.evidence||'',p=0,i;if(!n)continue;while((i=text.indexOf(n,p))>=0){rs.push([i,i+n.length,cls]);p=i+n.length}}let points=new Set([0,text.length]);rs.forEach(x=>{points.add(x[0]);points.add(x[1])});let q=[...points].sort((a,b)=>a-b),out='';for(let i=0;i<q.length-1;i++){let a=q[i],b=q[i+1],m=rs.find(x=>x[0]<=a&&x[1]>=b);out+=(m?'<mark class="'+m[2]+'">':'')+esc(text.slice(a,b))+(m?'</mark>':'')}return out}
function field(k,v){return v?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':''}
function card(f,k){return '<article class="function"><h4>'+esc(f.function_id)+' · '+esc(f.label)+'</h4><dl class="fields">'+field('Actor',f.actor)+field('Action',f.action)+field('Target',f.target)+field('Mechanism',f.mechanism)+field('Effect',f.effect)+field('Condition',f.condition)+field('Timing',f.timing)+field('Confidence',f.confidence)+'</dl><div class="evidence"><b>'+esc(k)+' evidence</b><br>'+esc(f.evidence||'')+'<br><span class="muted">offsets '+esc(f.evidence_start)+'–'+esc(f.evidence_end)+'</span></div></article>'}
function sidebarRender(){let q=document.getElementById('search').value.toLowerCase(),out='';DATA.documents.forEach((d,i)=>{let hay=String(d.document_id)+' '+d.title+' '+d.document_type;if(q&&!hay.toLowerCase().includes(q))return;out+='<button class="nav '+(i===index?'active':'')+'" data-i="'+i+'">'+esc(d.document_type.replaceAll('_',' '))+' · '+esc(title(d))+'<small>'+esc(d.date)+' · '+d.policy_functions.length+' policy · '+d.operative_functions.length+' operative</small></button>'});sidebar.innerHTML=out;sidebar.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{index=+b.dataset.i;render()});document.getElementById('count').textContent=(index+1)+' / '+DATA.documents.length}
function render(){sidebarRender();let d=DATA.documents[index];if(!d){main.innerHTML='<div class="card">No matching directives.</div>';return}let warning=DATA.audit_errors.filter(e=>String(e.request_id||'').includes(d.request_id));let segs=d.segments.map(s=>{let fs=d.operative_functions.filter(f=>f.segment_id===s.segment_id);return '<div class="segment"><h4>'+esc(s.segment_id)+' · '+fs.length+' functions</h4><div class="segment-text">'+highlight(s.text,fs,'operative')+'</div>'+fs.map(f=>card(f,'Operative')).join('')+'</div>'}).join('');let ground=d.grounding_metadata?JSON.stringify(d.grounding_metadata,null,2):'No Google Search grounding metadata was returned.';main.innerHTML='<section class="card"><h2>'+esc(title(d))+'</h2><div class="muted">'+esc(meta(d))+'</div><span class="badge">Authority-masked source</span><span class="badge">'+esc(d.model||'Gemini')+' · '+esc(d.model_version||'')+'</span><span class="badge '+(d.grounding_metadata?'':'warn')+'">'+(d.grounding_metadata?'Search grounding used':'Search grounding not invoked')+'</span></section>'+(warning.length?'<section class="audit warn"><b>Audit warning</b><ul>'+warning.map(e=>(e.errors||[]).map(x=>'<li>'+esc(x)+'</li>').join('')).join('')+'</ul></section>':'')+'<section class="source"><h3>Initial directive supplied to Flash</h3><div class="muted">'+esc(DATA.authority_policy)+'</div><div class="source-text">'+highlight(d.source_text,d.policy_functions,'policy')+'</div></section><div class="columns"><section class="section"><h3>Policy functions ('+d.policy_functions.length+')</h3>'+(d.policy_functions.length?d.policy_functions.map(f=>card(f,'Policy')).join(''):'<p class="muted">None returned.</p>')+'</section><section class="section"><h3>Operative functions ('+d.operative_functions.length+')</h3>'+(segs||'<p class="muted">No operative segments.</p>')+'</section></div><section class="card raw"><details><summary>Raw validated Flash JSON</summary><pre>'+esc(d.raw_response)+'</pre></details><details><summary>Grounding metadata</summary><pre>'+esc(ground)+'</pre></details></section>'}
