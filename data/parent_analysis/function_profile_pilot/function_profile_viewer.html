"evidence\": \"(b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings. Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees. (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waived as provided in Section 4.3(b) for persons who: (1) are engaged in historical research projects, or (2) previously have occupied policy-making positions to which they were appointed by the President. (b) Waivers under Section 4.3(a) may be granted only if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee. Part 5 Implementation and Review Sec. 5.1 Policy Direction.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 1424,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:016\",\n      \"function_id\": \"2063:of:016\",\n      \"label\": \"Establish oversight structure, ISOO authorities, and agency general responsibilities\",\n      \"actor\": \"National Security Council / Administrator of General Services / ISOO Director / Agencies\",\n      \"action\": \"provide policy direction, delegate functions, oversight, and administer programs\",\n      \"target\": \"information security program and executive agency compliance\",\n      \"mechanism\": \"delegating GSA oversight to ISOO Director, establishing binding directives, on-site reviews, regulation reviews, annual reports, senior agency official designations, access controls, and contingency plans\",\n      \"effect\": \"Creates comprehensive administrative governance and oversight structure for executive branch information security\",\n      \"condition\": \"If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access\",\n      \"timing\": \"at least annually\",\n      \"evidence\": \"(a) The National Security Council shall provide overall policy direction for the information security program. (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office. Sec. 5.2 Information Security Oversight Office. (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority to appoint a staff for the Office.(b) The Director shall: (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies; (f) oversee agency actions to ensure compliance with this Order and implementing directives; (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal; (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal; * Ibid. (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval; (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program; (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program; (8) report at least annually to the President through the National Security Council on the implementation of this Order; and (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program. Sec. 5.3 General Responsibilities. Agencies that originate or handle classified information shall: (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order; (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas. Sec. 5.4 Sanctions.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 3959,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:017\",\n      \"function_id\": \"2063:of:017\",\n      \"label\": \"Report violations to agency heads\",\n      \"actor\": \"ISOO Director\",\n      \"action\": \"shall make a report\",\n      \"target\": \"agency heads or senior agency officials\",\n      \"mechanism\": \"reporting potential violations of the order or implementing directives to agency leadership\",\n      \"effect\": \"Initiates agency corrective action upon discovery of information security violations\",\n      \"condition\": \"If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred\",\n      \"timing\": \"\",\n      \"evidence\": \"(a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 328,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:018\",\n      \"function_id\": \"2063:of:018\",\n      \"label\": \"Establish administrative sanctions and agency enforcement obligations\",\n      \"actor\": \"Agency heads / Senior agency officials / Federal officers, employees, contractors, licensees, and grantees\",\n      \"action\": \"subject to sanctions and ensure corrective action\",\n      \"target\": \"personnel violating classification standards and administrative discipline system\",\n      \"mechanism\": \"imposing reprimands, suspensions, removals, loss of access, or loss of classification authority, and requiring prompt corrective action\",\n      \"effect\": \"Deters unauthorized disclosures and classification violations through mandatory administrative sanctions\",\n      \"condition\": \"if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified...; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order...; or (3) knowingly and willfully violate any other provision...\",\n      \"timing\": \"whenever a violation under Section 5.4(b) occurs\",\n      \"evidence\": \"(b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or (3) knowingly and willfully violate any other provision of this Order or implementing directive. (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 978,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:019\",\n      \"function_id\": \"2063:of:019\",\n      \"label\": \"Notify ISOO of classification disclosure violations\",\n      \"actor\": \"Agency heads / Senior agency officials\",\n      \"action\": \"shall ensure notification\",\n      \"target\": \"ISOO Director\",\n      \"mechanism\": \"providing prompt notification to ISOO upon occurrence of unauthorized disclosure or improper classification violations\",\n      \"effect\": \"Ensures centralized oversight of significant information security violations\",\n      \"condition\": \"whenever a violation under Section 5.4 (b)(1) or (2) occurs\",\n      \"timing\": \"promptly\",\n      \"evidence\": \"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 169,\n      \"confidence\": 1.0\n    }\n  ],\n  \"notes\": \"\"\n}\n```"},{"document_id":"1375","document_type":"executive_order","identifier":"13044","title":"amending executive order 12752 implementation the agricultural trade","date":"April 18, 1997","url":"https://www.presidency.ucsb.edu/documents/executive-order-13044-amending-executive-order-12752-implementation-the-agricultural-trade","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], and in order to provide for carrying out the provisions of the Agricultural Trade Development and [AUTHORITY], as amended by [AUTHORITY] ([AUTHORITY]), it is hereby ordered that:  (1) The first sentence of section 1(a) of [AUTHORITY] be amended by deleting the words \"developing countries\" and inserting the words \"developing countries and private entities\" in lieu thereof;  (2) Sections 4(a) and (c) be deleted; and  (3) Sections 4(b), (d), (e), (f), and (g) be renumbered as sections 4(a), (b) 43:oa:002\",\n      \"function_id\": \"of-5\",\n      \"label\": \"Designate Career Executive Board Chairman\",\n      \"actor\": \"President of the United States\",\n      \"action\": \"designate\",\n      \"target\": \"Chairman of the Career Executive Board\",\n      \"mechanism\": \"presidential designation\",\n      \"effect\": \"Empowers the President to designate the Chairman of the Board from among its members from time to time.\",\n      \"condition\": \"\",\n      \"timing\": \"from time to time\",\n      \"evidence\": \"The Chairman of the Board shall be designated from time to time by the President from among the members of the Board.\",\n      \"evidence_start\": 659,\n      \"evidence_end\": 778,\n      \"confidence\": 1.0\n    }\n  ],\n  \"notes\": \"\"\n}\n```"},{"document_id":"3943","document_type":"executive_order","identifier":"10479","title":"establishing the government contract committee","date":"August 13, 1953","url":"https://www.presidency.ucsb.edu/documents/executive-order-10479-establishing-the-government-contract-committee","source_text":"WHEREAS it is in the interest of the Nation's economy and security to promote the fullest utilization of all available manpower; and  WHEREAS it is the policy of the United States Government to promote equal employment opportunity for all qualified persons employed or seeking employment on government contracts because such persons are entitled to fair and equitable treatment in all aspects of employment on work paid for from public funds; and  WHEREAS it is the obligation of the contracting agencies of the United States Government and government contractors to insure compliance with, and successful execution of, the equal employment opportunity program of the United States Government; and  WHEREAS existing executive orders require the government contracting agencies to include in their contracts a provision obligating the government contractor not to discriminate against any employee or applicant for employment because of race, creed, color, or national origin and obligating the government contractor to include a similar provision in all subcontracts; and  WHEREAS a review and analysis of existing practices and procedures of government contracting agencies show that the practices and procedures relating to compliance with the nondiscrimination provisions must be revised and strengthened to eliminate discrimination in all aspects of employment:  NOW, THEREFORE, by virtue of the authority vested in me by [AUTHORITY] and statutes, and as President of the United States, and pursuant to the authority conferred by and subject to the provisions of section 214 of [AUTHORITY]. [AUTHORITY], ([AUTHORITY], it is ordered as follows:  SECTION 1. The head of each contracting agency of the Government of the United States shall be primarily responsible for obtaining compliance by any contractor or subcontractor with the said nondiscrimination provisions of any contract entered into, amended, or modified by his agency and of any subcontract thereunder, and shall take appropriate measures to bring about the said compliance.  SEC. 2. The head of each contracting agency shall take appropriate measures, including but not limited to the establishment of compliance procedures, to carry out the responsibility set forth in section 1 hereof.  SEC. 3. There is hereby established the Government Contract Committee, hereinafter referred to as the Committee. The Committee shall be composed of fourteen members as follows:  (a) One representative of the following-named agencies to be designated by the respective heads of such agencies: the Atomic Energy Commission, the Department of Commerce, the Department of Defense, the Department of Justice, the Department of Labor, and the General Services Administration.  (b) Eight other members to be appointed by the President. The Chairman and Vice Chairman shall be designated by the President.  SEC. 4. The Committee shall make recommendations to the contracting agencies for improving and making more effective the nondiscrimination provisions of government contracts. All contracting agencies of the Government are directed and authorized to cooperate with the Committee and, to the extent permitted by law, to furnish the Committee such information and assistance as it may require in the performance of its functions under this order. The Committee shall establish such rules as may be necessary for the performance of its functions under this order, and shall make annual or semiannual reports on its progress to the President.  SEC 5. The Committee may receive complaints of alleged violations of the nondiscrimination provisions of government contracts. Complaints received shall be transmitted by the Committee to the appropriate contracting agencies to be processed in accordance with the agencies' procedure for handling such complaints. Each contracting agency shall report to the Committee the action taken with respect to all complaints received by the agency, including those transmitted by the Committee. The Committee shall review and analyze the reports submitted to it by the contracting agencies.  SEC 6. The Committee shall encourage the furtherance of an educational program by employer, labor, civic, educational, religious, and other voluntary non-governmental groups in order to eliminate or reduce the basic causes and costs of discrimination in employment.  SEC. 7. The Committee is authorized to establish and maintain cooperative relationships with agencies of state and local governments, as well as with non-governmental bodies, to assist in achieving the purposes of this order.  SEC. 8. The government agencies (except the Department of Justice) designated in section 3 (a) of this order shall defray such necessary expenses of the Committee as may be authorized by law, Including section 214 of [AUTHORITY], [AUTHORITY] ([AUTHORITY]; provided that no agency shall supply more than 50% of the funds necessary to carry out the purposes of this order. The Department of Labor shall provide necessary space and facilities for the Committee. In the case of the Department of Justice the contribution shall be limited to the rendering of legal services.  SEC. 9. [AUTHORITY] of December 5, 1951 (16 P. R. 12303) is hereby revoked and the Committee on Government Contract Compliance established thereby is abolished All records and property of the said Committee are transferred to the Government Contract Committee. The latter Committee shall wind up any outstanding affairs of the abolished Committee.  DWIGHT D. EISENHOWER  THE WHITE HOUSE,  August 13, 1953.","segments":[{"segment_id":"3943:oa:001","segment_index":1,"text":"The head of each contracting agency of the Government of the United States shall be primarily responsible for obtaining compliance by any contractor or subcontractor with the said nondiscrimination provisions of any contract entered into, amended, or modified by his agency and of any subcontract thereunder, and shall take appropriate measures to bring about the said compliance. SEC. 2."},{"segment_id":"3943:oa:002","segment_index":2,"text":"The head of each contracting agency shall take appropriate measures, including but not limited to the establishment of compliance procedures, to carry out the responsibility set forth in section 1 hereof. SEC. 3."},{"segment_id":"3943:oa:003","segment_index":3,"text":"There is hereby established the Government Contract Committee, hereinafter referred to as the Committee. The Committee shall be composed of fourteen members as follows: (a) One representative of the following-named agencies to be designated by the respective heads of such agencies: the Atomic Energy Commission, the Department of Commerce, the Department of Defense, the Department of Justice, the Department of Labor, and the General Services Administration. (b) Eight other members to be appointed by the President. The Chairman and Vice Chairman shall be designated by the President. SEC. 4."},{"segment_id":"3943:oa:004","segment_index":4,"text":"The Committee shall make recommendations to the contracting agencies for improving and making more effective the nondiscrimination provisions of government contracts. All contracting agencies of the Government are directed and authorized to cooperate with the Committee and, to the extent permitted by law, to furnish the Committee such information and assistance as it may require in the performance of its functions under this order."},{"segment_id":"3943:oa:005","segment_index":5,"text":"The Committee shall establish such rules as may be necessary for the performance of its functions under this order,"},{"segment_id":"3943:oa:006","segment_index":6,"text":"and shall make annual or semiannual reports on its progress to the President. SEC 5. The Committee may receive complaints of alleged violations of the nondiscrimination provisions of government contracts. Complaints received shall be transmitted by the Committee to the appropriate contracting agencies to be processed in accordance with the agencies' procedure for handling such complaints."},{"segment_id":"3943:oa:007","segment_index":7,"text":"Each contracting agency shall report to the Committee the action taken with respect to all complaints received by the agency, including those transmitted by the Committee."},{"segment_id":"3943:oa:008","segment_index":8,"text":"The Committee shall review and analyze the reports submitted to it by the contracting agencies. SEC 6. The Committee shall encourage the furtherance of an educational program by employer, labor, civic, educational, religious, and other voluntary non-governmental groups in order to eliminate or reduce the basic causes and costs of discrimination in employment. SEC. 7."},{"segment_id":"3943:oa:009","segment_index":9,"text":"The Committee is authorized to establish and maintain cooperative relationships with agencies of state and local governments, as well as with non-governmental bodies, to assist in achieving the purposes of this order. SEC. 8."},{"segment_id":"3943:oa:010","segment_index":10,"text":"The government agencies (except the Department of Justice) designated in section 3 (a) of this order shall defray such necessary expenses of the Committee as may be authorized by law, Including section 214 of [AUTHORITY], [AUTHORITY] ([AUTHORITY]; provided that no agency shall supply more than 50% of the funds necessary to carry out the purposes of this order. The Department of Labor shall provide necessary space and facilities for the Committee. In the case of the Department of Justice the contribution shall be limited to the rendering of legal services."},{"segment_id":"3943:oa:011","segment_index":11,"text":"SEC. 9. [AUTHORITY] of December 5, 1951 (16 P. R. 12303) is hereby revoked and the Committee on Government Contract Compliance established thereby is abolished All records and property of the said Committee are transferred to the Government Contract Committee. The latter Committee shall wind up any outstanding affairs of the abolished Committee."}],"policy_functions":[{"function_id":"3943:pf:001","label":"Promoting equal employment opportunity on government contracts","actor":"United States Government","action":"promote","target":"equal employment opportunity for all qualified persons employed or seeking employment on government contracts","mechanism":"establishing agency and contractor obligations to insure compliance with non-discrimination provisions","effect":"fair and equitable treatment in all aspects of employment on work paid for from public funds","condition":"","timing":"","evidence":"it is the policy of the United States Government to promote equal employment opportunity for all qualified persons employed or seeking employment on government contracts because such persons are entitled to fair and equitable treatment in all aspects of employment on work paid for from public funds","evidence_start":142,"evidence_end":441,"confidence":"high"}, nction of prior committee and transfer of functions/assets to new Committee\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"[AUTHORITY] of December 5, 1951 (16 P. R. 12303) is hereby revoked and the Committee on Government Contract Compliance established thereby is abolished All records and property of the said Committee are transferred to the Government Contract Committee. The latter Committee shall wind up any outstanding affairs of the abolished Committee.\",\n      \"evidence_start\": 8,\n      \"evidence_end\": 353,\n      \"confidence\": 0.95\n    }\n  ],\n  \"notes\": \"\"\n}\n```"},{"document_id":"1310","document_type":"executive_order","identifier":"13109","title":"half day closing executive departments and agencies the federal","date":"December 17, 1998","url":"https://www.presidency.ucsb.edu/documents/executive-order-13109-half-day-closing-executive-departments-and-agencies-the-federal","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], it is hereby ordered as follows:  Section 1. All executive departments and agencies of the Federal Government shall be closed and their employees excused from duty for the last half of the scheduled workday on Christmas Eve, December 24, 1998, except as provided in section 2 below.  Sec. 2. The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons.  Sec. 3. Thursday, December 24, 1998, shall be considered as falling within the scope of [AUTHORITY] and of [AUTHORITY] and 6103(b) and other similar statutes insofar as they relate to the pay and leave of employees of the United States.  Sec. 4. This order shall apply to executive departments and agencies of the Federal Government only and is not intended to direct or otherwise implicate departments or agencies of State or local governments.  William J. Clinton  The White House,  December 17, 1998.  [Filed with the Office of the Federal Register, 8:45 a.m., December 21, 1998]","segments":[{"segment_id":"1310:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. All executive departments and agencies of the Federal Government shall be closed and their employees excused from duty for the last half of the scheduled workday on Christmas Eve, December 24, 1998, except as provided in section 2 below. Sec. 2. The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons. Sec. 3. Thursday, December 24, 1998, shall be considered as falling within the scope of [AUTHORITY] and of [AUTHORITY] and 6103(b) and other similar statutes insofar as they relate to the pay and leave of employees of the United States. Sec. 4. This order shall apply to executive departments and agencies of the Federal Government only and is not intended to direct or otherwise implicate departments or agencies of State or local governments."}],"policy_functions":[{"function_id":"1310:pf:001","label":"Grant half-day holiday leave and pay coverage to Federal employees","actor":"President","action":"order","target":"executive departments and agencies of the Federal Government and their employees","mechanism":"half-day closing and classification of Christmas Eve under pay and leave statutes","effect":"Employees excused from duty for the last half of the scheduled workday on Christmas Eve, with statutory pay and leave protections applied","condition":"except as determined by agency heads for national security, defense, or essential public utive departments and agencies\",\"action\":\"may determine\",\"target\":\"certain offices, installations, and employees\",\"mechanism\":\"agency head determination\",\"effect\":\"requires certain offices to remain open and employees to remain on duty for the full scheduled workday\",\"condition\":\"for reasons of national security or defense or for other essential public reasons\",\"timing\":\"December 24, 1998\",\"evidence\":\"The heads of executive departments and agencies may determine that certain offices and installations of their organizations, or parts thereof, must remain open and that certain employees must remain on duty for the full scheduled workday on December 24, 1998, for reasons of national security or defense or for other essential public reasons.\",\"evidence_start\":291,\"evidence_end\":647,\"confidence\":1.0},{\"function_id\":\"1310:of:003\",\"segment_id\":\"SEGMENT 1310:oa:001\",\"label\":\"Apply pay and leave statutory protections to Christmas Eve half-day closing\",\"actor\":\"President\",\"action\":\"shall be considered\",\"target\":\"Thursday, December 24, 1998\",\"mechanism\":\"statutory inclusion under pay and leave laws\",\"effect\":\"brings the date within the scope of pay and leave statutes for United States employees\",\"condition\":\"\",\"timing\":\"Thursday, December 24, 1998\",\"evidence\":\"Thursday, December 24, 1998, shall be considered as falling within the scope of [AUTHORITY] and of [AUTHORITY] and 6103(b) and other similar statutes insofar as they relate to the pay and leave of employees of the United States.\",\"evidence_start\":656,\"evidence_end\":886,\"confidence\":1.0},{\"function_id\":\"1310:of:004\",\"segment_id\":\"SEGMENT 1310:oa:001\",\"label\":\"Limit scope of order to Federal executive departments and agencies\",\"actor\":\"President\",\"action\":\"shall apply\",\"target\":\"executive departments and agencies of the Federal Government only\",\"mechanism\":\"express scope limitation\",\"effect\":\"excludes State or local governments from direction or implication\",\"condition\":\"\",\"timing\":\"\",\"evidence\":\"This order shall apply to executive departments and agencies of the Federal Government only and is not intended to direct or otherwise implicate departments or agencies of State or local governments.\",\"evidence_start\":895,\"evidence_end\":1098,\"confidence\":1.0}],\"notes\":\"\"}"},{"document_id":"1234","document_type":"executive_order","identifier":"13185","title":"strengthen the federal government university research partnership","date":"December 28, 2000","url":"https://www.presidency.ucsb.edu/documents/executive-order-13185-strengthen-the-federal-government-university-research-partnership","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], and in order to keep the Federal Government-University research partnership strong, it is hereby ordered as follows:  Section 1. Principles of the Government-University Partnership. The partnership in science and technology that has evolved between the Federal Government and American universities has yielded benefits that are vital to each. It continues to prove exceptionally productive, successfully promoting the discovery of knowledge, stimulating technological innovation, improving the quality of life, educating and training the next generation of scientists and engineers, and contributing to America’s economic prosperity and national security. In order to reaffirm and strengthen this partnership, this order sets forth the following guiding and operating principles that are fully described in the April 1999 National Science and Technology Council report, \"Renewing the Government-University Partnership.\" These principles shall provide the framework for the development and analysis of all future Federal policies, rules, and regulations for the Federal Government-University research partnership.  (a) The guiding principles that shall govern interactions between the Federal Government and universities that perform research are: (1) Research is an investment in the future; (2) The integration of research and education is vital; (3) Excellence is promoted when investments are guided by merit review; and (4) Research must be conducted with integrity. (b) The operating principles that shall assist agencies, universities, individual researchers, and auditing and regulatory bodies in implementing the guiding principles are: (1) Agency cost-sharing policies and practices must be transparent; (2) Partners should respect the merit review process; (3) Agencies and universities should manage research in a cost-efficient manner; (4) Accountability and accounting are not the same; (5) The benefits of simplicity in policies and practices should be weighed against the costs; (6) Change should be justified by need and the process made transparent. (c) Each executive branch department or agency that supports research at universities shall regularly review its existing policies and procedures to ensure that they meet the spirit and intent of the guiding and operating principles stated above.  Sec. 2. Office of Science and Technology (OSTP) Review of the Government-University Research Partnership. (a) The OSTP, in conjunction with the National Science and Technology Council, shall conduct a regular review of the Government-University research partnership and prepare a report on the status of the partnership. The OSTP should receive input from all departments or agencies that have a major impact on the Government-University partnership through their support of research and education, policy making, regulatory activities, and research administra tion. In addition, OSTP may seek the input of the National Science Board and the President’s Committee of Advisors for Science and Technology, as well as other stakeholders, such as State and local governments, industry, the National Academy of Sciences, and the Federal Demonstration Partnership.  (b) The purpose of the review and the report is to determine the overall health of the Government-University research partnership, being mindful of the guiding and operating principles stated above. The report should include recommendations on how to improve the Government- University partnership.  (c) The Director of OSTP shall deliver the report to the President.  Sec. 3. Judicial Review. This order does not create any enforceable rights against the United States, its agencies, its officers, or any person.  William J. Clinton  THE WHITE HOUSE,  December 28, 2000.","segments":[{"segment_id":"1234:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. Principles of the Government-University Partnership. The partnership in science and technology that has evolved between the Federal Government and American universities has yielded benefits that are vital to each. It continues to prove exceptionally productive, successfully promoting the discovery of knowledge, stimulating technological innovation, improving the quality of life, educating and training the next generation of scientists and engineers, and contributing to America’s economic prosperity and national security."},{"segment_id":"1234:oa:002","segment_index":2,"text":"In order to reaffirm and strengthen this partnership, this order sets forth the following guiding and operating principles that are fully described in the April 1999 National Science and Technology Council report, \"Renewing the Government-University Partnership.\" These principles shall provide the framework for the development and analysis of all future Federal policies, rules, and regulations for the Federal Government-University research partnership. (a) The guiding principles that shall govern interactions between the Federal Government and universities that perform research are: (1) Research is an investment in the future; (2) The integration of research and education is vital; (3) Excellence is promoted when investments are guided by merit revi urposes within the United States Agency for International Development (USAID) subject to the foreign policy and budgetary guidance of the Secretary of State.  Sec. 3. Membership. The membership of the Council shall be as follows:  (a) The Council shall be composed of the officials described in paragraph (b) of this section and not more than 12 individuals from outside the Federal Government appointed by the President. Appointed members of the Council may serve as representatives of a variety of sectors, including, among others, institutions of higher education, non-profit and philanthropic organizations, civil society, and private industry.  (b) The Secretary of State, the Secretary of the Treasury, the Secretary of Defense, the USAID Administrator, and the [AUTHORITY] Officer of the Millennium Challenge Corporation shall serve as non-voting members of the Council and may designate, to perform the Council functions of the member, a senior-level official who is part of the member's department, agency, or office, and who is a full-time officer or employee of the Federal Government.  (c) The President shall designate a member of the Council to serve as Chair and another member to serve as Vice Chair. The Chair shall convene and preside at meetings of the Council, determine meeting agendas, and direct its work. The Vice Chair shall perform the duties of the Chair in the absence of the Chair and shall perform such other functions as the Chair may assign.  (d) The term of office of members appointed by the President from outside the Federal Government shall be 2 years, and such members shall be eligible for reappointment and may continue to serve after the expiration of their terms until the President appoints a successor. A member appointed to fill a vacancy shall serve only for the unexpired term of such vacancy.  Sec. 4. Mission and Functions. The Council shall advise and support the President, through the National Security Staff and the National Economic Council staff, in furtherance of the policy set forth in section 1 of this order. The Council shall meet regularly and shall:  (a) inform the policy and practice of U.S. global development policy and programs by providing advice to the President and other senior officials on issues including:  (i) innovative, scalable approaches to development with proven demonstrable impact, particularly on sustainable economic growth and good governance;  (ii) areas for enhanced collaboration between the Federal Government and public and private sectors to advance development policy;  (iii) best practices for and effectiveness of research and development in low and middle income economies; and  (iv) long-term solutions to issues central to strategic planning for U.S. development efforts;  (b) support new and existing public-private partnerships by:  (i) identifying key areas for enhanced collaboration and any barriers to collaboration; and  (ii) recommending concrete efforts that the private and public sectors together can take to promote economic development priorities and initiatives; and  (c) increase awareness and action in support of development by soliciting public input on current and emerging issues in the field of global development as well as bringing to the President's attention concerns and ideas that would inform policy options.  Sec. 5. Administration of the Council. (a) The heads of executive departments and agencies shall assist and provide information to the Council, consistent with applicable law, as may be necessary to carry out the functions of the Council.  (b) Funding and administrative support for the Council shall be provided by USAID to the extent permitted by law and within existing appropriations.  (c) The USAID Administrator shall appoint an Executive Director who shall be a Federal officer or employee of USAID and serve as a liaison to the Administrator and the Executive Office of the President and consult with relevant executive departments, agencies, and offices on matters and activities pertaining to the Council.  (d) The members of the Council who are appointed from outside the Federal Government shall serve without compensation for their work on the Council. Members of the Council may, however, receive travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving intermittently in the Government service ([AUTHORITY]  (e) Insofar as [AUTHORITY] (FACA), as amended ([AUTHORITY], may apply to the Council, any functions of the President under FACA, except that of reporting to the Congress, shall be performed by the USAID Administrator in accordance with the guidelines issued by the Administrator of General Services.  Sec. 6. Termination. The Council shall terminate 2 years after the date of this order, unless renewed by the President.  BARACK OBAMA  The White House,  February 9, 2012","segments":[{"segment_id":"819:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Section 1. Policy. To help protect national security and further American economic, humanitarian, and strategic interests in the world, it is the policy of the Federal Government to promote and elevate development as a core pillar of American power and chart a course for development, diplomacy, and defense to reinforce and complement one another. As stated in the 2010 National Security Strategy and the Presidential Policy Directive on Global Development, the successful pursuit of development is essential to advancing our national security objectives: security, prosperity, respect for universal values, and a just and sustainable international order. The effectiveness of this development policy will depend in large measure on how we engage with partners, beneficiaries of our development assistance, and stakeholders. We will use evidence-based decision-making in all areas of U.S. development policy and programs, and we commit to foster development expertise and learning worldwide. Sec. 2. Establishment. There is e e after the expiration of their terms until the President appoints a successor. A member appointed to fill a vacancy shall serve only for the unexpired term of such vacancy. Sec. 4. Mission and Functions. The Council shall advise and support the President, through the National Security Staff and the National Economic Council staff, in furtherance of the policy set forth in section 1 of this order. The Council shall meet regularly and shall: (a) inform the policy and practice of U.S. global development policy and programs by providing advice to the President and other senior officials on issues including: (i) innovative, scalable approaches to development with proven demonstrable impact, particularly on sustainable economic growth and good governance; (ii) areas for enhanced collaboration between the Federal Government and public and private sectors to advance development policy; (iii) best practices for and effectiveness of research and development in low and middle income economies; and (iv) long-term solutions to issues central to strategic planning for U.S. development efforts; (b) support new and existing public-private partnerships by: (i) identifying key areas for enhanced collaboration and any barriers to collaboration; and (ii) recommending concrete efforts that the private and public sectors together can take to promote economic development priorities and initiatives; and (c) increase awareness and action in support of development by soliciting public input on current and emerging issues in the field of global development as well as bringing to the President's attention concerns and ideas that would inform policy options. Sec. 5. Administration of the Council."},{"segment_id":"819:oa:006","segment_index":6,"text":"(a) The heads of executive departments and agencies shall assist and provide information to the Council, consistent with applicable law, as may be necessary to carry out the functions of the Council. (b) Funding and administrative support for the
