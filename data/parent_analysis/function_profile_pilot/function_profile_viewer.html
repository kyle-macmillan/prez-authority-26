ommittee shall be composed of the Secretary of Defense, the Secretary of the Treasury, the Secretary of Commerce, the Administrator of the National Aeronautics and Space Administration, the Administrator of the Federal Aviation Agency, and such other members as the President may from time to time appoint. The Secretary of Defense shall serve as Chairman of the Committee.  Sec. 2. The Committee shall study, and shall advise and make recommendations to the President with regard to, all aspects of the supersonic transport program. The Committee shall devote particular attention to the financial aspects of the program and shall maintain close coordination with the Director of the Bureau of the Budget in this regard.  Sec. 3. All Federal departments and agencies shall cooperate with the Committee and furnish it with such information and assistance, not inconsistent with law, as it may require in the performance of its duties.  Sec. 4. Members of the Committee who are officers or employees of the Federal Government shall receive no additional compensation by reason of such membership. Other members of the Committee shall be entitled to receive compensation and travel expenses, including per diem in lieu of subsistence, as authorized by law for persons serving the government intermittently ([AUTHORITY]  Sec. 5. Each Federal department and agency represented on the Committee shall furnish necessary assistance to the Committee in accordance with section 214 of [AUTHORITY], [AUTHORITY] ([AUTHORITY] Such assistance may include the detailing of employees, including consultants and experts, to the Committee to perform such functions consistent with the purposes of this Order as the Committee may assign.  LYNDON B. JOHNSON  The White House,  April 1, 1964.","segments":[{"segment_id":"3271:oa:001","segment_index":1,"text":"There is hereby established the President's Advisory Committee on Supersonic Transport (hereinafter referred to as the Committee). The Committee shall be compos -significant-malicious","source_text":"By the authority vested in me as President by [AUTHORITY] and [AUTHORITY], including [AUTHORITY] ([AUTHORITY]) (IEEPA), [AUTHORITY] ([AUTHORITY]) (NEA), [AUTHORITY],  I, Barack Obama, President of the United States of America, find that the increasing prevalence and severity of malicious cyber-enabled activities originating from, or directed by persons located, in whole or in substantial part, outside the United States constitute an unusual and extraordinary threat to the national security, foreign policy, and economy of the United States. I hereby declare a national emergency to deal with this threat.  Accordingly, I hereby order:  Section 1. (a) All property and interests in property that are in the United States, that hereafter come within the United States, or that are or hereafter come within the possession or control of any United States person of the following persons are blocked and may not be transferred, paid, exported, withdrawn, or otherwise dealt in:  (i) any person determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, to be responsible for or complicit in, or to have engaged in, directly or indirectly, cyber-enabled activities originating from, or directed by persons located, in whole or in substantial part, outside the United States that are reasonably likely to result in, or have materially contributed to, a significant threat to the national security, foreign policy, or economic health or financial stability of the United States and that have the purpose or effect of:  (A) harming, or otherwise significantly compromising the provision of services by, a computer or network of computers that support one or more entities in a critical infrastructure sector;  (B) significantly compromising the provision of services by one or more entities in a critical infrastructure sector;  (C) causing a significant disruption to the availability of a computer or network of computers; or  (D) causing a significant misappropriation of funds or economic resources, trade secrets, personal identifiers, or financial information for commercial or competitive advantage or private financial gain; or  (ii) any person determined by the Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State:  (A) to be responsible for or complicit in, or to have engaged in, the receipt or use for commercial or competitive advantage or private financial gain, or by a commercial entity, outside the United States of trade secrets misappropriated through cyber-enabled means, knowing they have been misappropriated, where the misappropriation of such trade secrets is reasonably likely to result in, or has materially contributed to, a significant threat to the national security, foreign policy, or economic health or financial stability of the United States;  (B) to have materially assisted, sponsored, or provided financial, material, or technological support for, or goods or services in support of, any activity described in subsections (a)(i) or (a)(ii)(A) of this section or any person whose property and interests in property are blocked pursuant to this order;  (C) to be owned or controlled by, or to have acted or purported to act for or on behalf of, directly or indirectly, any person whose property and interests in property are blocked pursuant to this order; or  (D) to have attempted to engage in any of the activities described in subsections (a)(i) and (a)(ii)(A)-(C) of this section.  (b) The prohibitions in subsection (a) of this section apply except to the extent provided by statutes, or in regulations, orders, directives, or licenses that may be issued pursuant to this order, and notwithstanding any contract entered into or any license or permit granted prior to the effective date of this order.  Sec. 2. I hereby determine that the making of donations of the type of articles specified in section 203(b)(2) of IEEPA ([AUTHORITY] by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to section 1 of this order would seriously impair my ability to deal with the national emergency declared in this order, and I hereby prohibit such donations as provided by section 1 of this order.  Sec. 3. The prohibitions in section 1 of this order include but are not limited to:  (a) the making of any contribution or provision of funds, goods, or services by, to, or for the benefit of any person whose property and interests in property are blocked pursuant to this order; and  (b) the receipt of any contribution or provision of funds, goods, or services from any such person.  Sec. 4. I hereby find that the unrestricted immigrant and nonimmigrant entry into the United States of aliens determined to meet one or more of the criteria in section 1(a) of this order would be detrimental to the interests of the United States, and I hereby suspend entry into the United States, as immigrants or nonimmigrants, of such persons. Such persons shall be treated as persons covered by section 1 of [AUTHORITY] of July 24, 2011 (Suspension of Entry of Aliens Subject to United Nations Security Council Travel Bans and [AUTHORITY] Sanctions).  Sec. 5. (a) Any transaction that evades or avoids, has the purpose of evading or avoiding, causes a violation of, or attempts to violate any of the prohibitions set forth in this order is prohibited.  (b) Any conspiracy formed to violate any of the prohibitions set forth in this order is prohibited.  Sec. 6. For the purposes of this order:  (a) the term \"person\" means an individual or entity; (b) the term \"entity\" means a partnership, association, trust, joint venture, corporation, group, subgroup, or other organization;  (c) the term \"United States person\" means any United States citizen, permanent resident alien, entity organized under [AUTHORITY] or any jurisdiction within the United States (including foreign branches), or any person in the United States;  (d) the term \"critical infrastructure sector\" means any of the designated critical infrastructure sectors identified in Presidential Policy Directive 21; and  (e) the term \"misappropriation\" includes any taking or obtaining by improper means, without permission or consent, or under false pretenses.  Sec. 7. For those persons whose property and interests in property are blocked pursuant to this order who might have a constitutional presence in the United States, I find that because of the ability to transfer funds or other assets instantaneously, prior notice to such persons of measures to be taken pursuant to this order would render those measures ineffectual. I therefore determine that for these measures to be effective in addressing the national emergency declared in this order, there need be no prior notice of a listing or determination made pursuant to section 1 of this order.  Sec. 8. The Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, is hereby authorized to take such actions, including the promulgation of rules and regulations, and to employ all powers granted to the President by IEEPA as may be necessary to carry out the purposes of this order. The Secretary of the Treasury may redelegate any of these functions to other officers and agencies of the United States Government consistent with applicable law. All agencies of the United States Government are hereby directed to take all appropriate measures within their authority to carry out the provisions of this order.  Sec. 9. The Secretary of the Treasury, in consultation with the Attorney General and the Secretary of State, is hereby authorized to submit the recurring and final reports to the Congress on the national emergency declared in this order, consistent with section 401(c) of the NEA ([AUTHORITY] and section 204(c) of IEEPA ([AUTHORITY]  BARACK OBAMA  The White House,  April 1, 2015.","segments":[{"segment_id":"725:oa:  decision, relating to inspection of certain interest equalization tax information returns by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks, approved by me this date.  [AUTHORITY] of September 3, 1964, is hereby superseded.  This order shall be effective upon its filing for publication in the Federal Register.  LYNDON B. JOHNSON  The White House,  April 2, 1965.","segments":[{"segment_id":"3209:oa:001","segment_index":1,"text":"it is hereby ordered that any information return made by a commercial bank under [AUTHORITY] shall be open to inspection by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks. Such inspection shall be in accordance and upon compliance with the rules and regulations prescribed by the Secretary of the Treasury in a Treasury decision, relating to inspection of certain interest equalization tax information returns by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks, approved by me this date."},{"segment_id":"3209:oa:002","segment_index":2,"text":"[AUTHORITY] of September 3, 1964, is hereby superseded. This order shall be effective upon its filing for publication in the Federal Register."}],"policy_functions":[{"function_id":"pf1","label":"Permit inspection of interest equalization tax information returns","actor":"President","action":"order","target":"information returns made by commercial banks","mechanism":"making tax returns open to inspection in accordance with Treasury regulations","effect":"allows the Board of Governors of the Federal Reserve System and Federal Reserve Banks to inspect commercial bank interest equalization tax returns","condition":"","timing":"effective upon filing for publication in the Federal Register","evidence":"it is hereby ordered that any information return made by a commercial bank under [AUTHORITY] shall be open to inspection by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks. S ion in the Federal Register.","evidence_start":0,"evidence_end":142,"confidence":"high","segment_id":"3209:oa:002"}],"request_id":"function-profile-v1:3209","model":"gemini-3.6-flash","model_version":"gemini-3.6-flash","grounding_metadata":null,"raw_response":"{\"document_id\":\"3209\",\"policy_functions\":[{\"function_id\":\"pf1\",\"label\":\"Permit inspection of interest equalization tax information returns\",\"actor\":\"President\",\"action\":\"order\",\"target\":\"information returns made by commercial banks\",\"mechanism\":\"making tax returns open to inspection in accordance with Treasury regulations\",\"effect\":\"allows the Board of Governors of the Federal Reserve System and Federal Reserve Banks to inspect commercial bank interest equalization tax returns\",\"condition\":\"\",\"timing\":\"effective upon filing for publication in the Federal Register\",\"evidence\":\"it is hereby ordered that any information return made by a commercial bank under [AUTHORITY] shall be open to inspection by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks. Such inspection shall be in accordance and upon compliance with the rules and regulations prescribed by the Secretary of the Treasury in a Treasury decision, relating to inspection of certain interest equalization tax information returns by the Board of Governors of the Federal Reserve System and the Federal Reserve Banks, approved by me this date.\",\"evidence_start\":207,\"evidence_end\":780,\"confidence\":0.95}],\"operative_functions\":[{\"segment_id\":\"3209:oa:001\",\"function_id\":\"of1\",\"label\":\"Authorize inspection of commercial bank information returns\",\"actor\":\"President\",\"action\":\"order\",\"target\":\"information return made by a commercial bank\",\"mechanism\":\"opening returns to inspection in accordance with Treasury rules and regulations\",\"effect\":\"permits Federal Reserve inspection of tax returns subject to Treasury regulations\",\"condition\":\"\",\"timing\" ed disclosure. Information may not be classified under this Order unless its disclosure reasonably could be expected to cause damage to the national security.  Now, by the authority vested in me as President by [AUTHORITY] and [AUTHORITY], it is hereby ordered as follows:  Part 1 Original Classification  Section 1.1 Classification Levels.  (a) National security information (hereinafter \"classified information\") shall be classified at one of the following three levels:  (1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security.  (2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security.  (3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security.  (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information.  (c) If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days. If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days.  Sec. 1.2 Classification Authority.  (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by:  (1) the President;  (2) agency heads and officials designated by the President in the Federal Register, and  (3) officials delegated this authority pursuant to Section 1.2(d).  (b) Secret. The authority to classify information originally as Secret may be exercised only by:  (1) agency heads and officials designated by the President in the Federal Register,  (2) officials with original Top Secret classification authority; and  (3) officials delegated such authority pursuant to Section 1.2(d).  (c) Confidential. The authority to classify information originally as Confidential may be exercised only by:  (1) agency heads and officials designated by the President in the Federal Register,  (2) officials with original Top Secret or Secret classification authority; and  (3) officials delegated such authority pursuant to Section 1.2(d).  (d) Delegation of Original Classification Authority.  (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority.  (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head.  (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head.  * The citation should read \"Section 5.3(a)\". [ White House correction]  (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head.  (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order. It shall identify the official delegated the authority by name or position title. Delegated classification authority includes the authority to classify information at the level granted and lower levels of classification.  (e) Exceptional Cases. When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office. The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination.  Sec. 1.3 Classification Categories.  (a) Information shall be considered for classification if it concerns:  (1) military plans, weapons, or operations;  (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security;  (3) foreign government information;  (4) intelligence activities (including special activities), or intelligence sources or methods;  (5) foreign relations or foreign activities of the United States;  (6) scientific, technological, or economic matters relating to the national security;  (7) United States Government programs for safeguarding nuclear materials or facilities;  (8) cryptology;  (9) a confidential source; or  (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office.  (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security.  (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security.  (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information.  Sec. 1.4 Duration of Classification.  (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified.  (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions.  (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order.  Sec. 1.5 Identification and Markings.  (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information:  (1) one of the three classification levels defined in Section 1.1;  (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official;  (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \"Originating Agency's Determination Required.\"  (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers.  (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office.  (d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information.  (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b).  Sec. 1.6 Limitations on Classification.  (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security.  (b) Basic scientific research information not clearly related to the national security may not be classified.  (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office.  (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority.  Part 2 Derivative Classification  Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority.  (b) Persons who apply derivative classification markings shall:  (1) observe and respect original classification decisions; and  (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources.  Sec. 2.2 Classification Guides.  (a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information.  (b) Each guide shall be approved personally and in writing by an official who:  (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and  * Ibid.  (2) is authorized to classify information originally at the highest level of classification prescribed in the guide.  (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers.  Part 3 Declassification and Downgrading  Sec. 3.1 Declassification Authority.  (a) Information shall be declassified or downgraded as soon as national security considerations permit. Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order.  (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). *  * Ibid.  (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal.  (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders.  Sec. 3.2 Transferred Information.  (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order.  (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information.  (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines.  Sec. 3.3 Systematic Review for Declassification.  (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads.  (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States.  (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods.  Sec. 3.4 Mandatory Review for Declassification.  (a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if:  (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and  (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort.  (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY]. Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal.  (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law.  (d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request.  (e) The Secretary of Defense shall develop special procedures for the review of cryptologic information, and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies. The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States.  (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order:  (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order.  (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section.  Part 4 Safeguarding  Sec. 4.1 General Restrictions on Access.  (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes.  (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons.  (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch.  (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency.  Sec. 4.2 Special Access Programs.  (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence.  (b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings.  Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees.  (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waived as provided in Section 4.3(b) for persons who:  (1) are engaged in historical research projects, or  (2) previously have occupied policy-making positions to which they were appointed by the President.  (b) Waivers under Section 4.3(a) may be granted only if the originating agency:  (1) determines in writing that access is consistent with the interest of national security;  (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and  (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee.  Part 5 Implementation and Review  Sec. 5.1 Policy Direction.  (a) The National Security Council shall provide overall policy direction for the information security program.  (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office.  Sec. 5.2 Information Security Oversight Office.  (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority  to appoint a staff for the Office.(b) The Director shall:  (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies;  (f) oversee agency actions to ensure compliance with this Order and implementing directives;  (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal;  (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal;  * Ibid.  (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval;  (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program;  (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program;  (8) report at least annually to the President through the National Security Council on the implementation of this Order; and  (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program.  Sec. 5.3 General Responsibilities.  Agencies that originate or handle classified information shall:  (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order;  (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and  (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas.  Sec. 5.4 Sanctions.  (a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken.  * Ibid.  (b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they:  (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders;  (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or  (3) knowingly and willfully violate any other provision of this Order or implementing directive.  (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation.  (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs. Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs.  * Ibid  Part 6 General Provisions  Sec. 6.1 Definitions.  (a) \"Agency\" has the meaning provided at [AUTHORITY]  (b) \"Information\" means any information or material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government.  (c) \"National security information\" means information that has been determined pursuant to this Order or any predecessor order to require protection against unauthorized disclosure and that is so designated.  (d) \"Foreign government information\" means:  (1) information provided by a foreign government or governments, an international organization of governments, or any element thereof with the expectation, expressed or implied, that the information, the source of the information, or both, are to be held in confidence; or  (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence.  (e) \"National security\" means the national defense or foreign relations of the United States.  (f) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation, expressed or implied, that the information or relationship, or both, be held in confidence.  (g) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure, together with a classification designation signifying the level of protection required.  Sec. 6.2 General.  (a) Nothing in this Order shall supersede any requirement made by or under [AUTHORITY], as amended. \"Restricted Data\" and \"Formerly Restricted Data\" shall be handled, protected, classified, downgraded, and declassified in conformity with the provisions of [AUTHORITY], as amended, and regulations issued under that Act.  (b) The Attorney General, upon request by the head of an agency or the Director of the Information Security Oversight Office, shall render an interpretation of this Order with respect to any question arising","segments":[{"segment_id":"2063:oa:001","segment_index":1,"text":"it is hereby ordered as follows: Part 1 Original Classification Section 1.1 Classification Levels. (a) National security information (hereinafter \"classified information\") shall be classified at one of the following three levels: (1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security. (2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security. (3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security. (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information."},{"segment_id":"2063:oa:002","segment_index":2,"text":"(c) If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days."},{"segment_id":"2063:oa:003","segment_index":3,"text":"If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days. Sec. 1.2 Classification Authority. (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register, and (3) officials delegated this authority pursuant to Section 1.2(d). (b) Secret. The authority to classify information originally as Secret may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (c) Confidential. The authority to classify information originally as Confidential may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret or Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (d) Delegation of Original Classification Authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head. (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head. * The citation should read \"Section 5.3(a)\". [ White House correction] (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head. (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order."},{"segment_id":"2063:oa:004","segment_index":4,"text":"It shall identify the official delegated the authority by name or position title. Delegated classification authority includes the authority to classify information at the level granted and lower levels of classification. (e) Exceptional Cases. When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office."},{"segment_id":"2063:oa:005","segment_index":5,"text":"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.3 Classification Categories. (a) Information shall be considered for classification if it concerns: (1) military plans, weapons, or operations; (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security; (3) foreign government information; (4) intelligence activities (including special activities), or intelligence sources or methods; (5) foreign relations or foreign activities of the United States; (6) scientific, technological, or economic matters relating to the national security; (7) United States Government programs for safeguarding nuclear materials or facilities; (8) cryptology; (9) a confidential source; or (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office. (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security. (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security. (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information. Sec. 1.4 Duration of Classification. (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified. (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions. (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order. Sec. 1.5 Identification and Markings. (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information: (1) one of the three classification levels defined in Section 1.1; (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official; (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \"Originating Agency's Determination Required.\" (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office."},{"segment_id":"2063:oa:006","segment_index":6,"text":"(d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information. (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b). Sec. 1.6 Limitations on Classification. (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office. (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority. Part 2 Derivative Classification Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources. Sec. 2.2 Classification Guides."},{"segment_id":"2063:oa:007","segment_index":7,"text":"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and * Ibid. (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. Part 3 Declassification and Downgrading Sec. 3.1 Declassification Authority. (a) Information shall be declassified or downgraded as soon as national security considerations permit."},{"segment_id":"2063:oa:008","segment_index":8,"text":"Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order. (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). * * Ibid. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal. (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders. Sec. 3.2 Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order. (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines. Sec. 3.3 Systematic Review for Declassification. (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads. (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States. (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods. Sec. 3.4 Mandatory Review for Declassification."},{"segment_id":"2063:oa:009","segment_index":9,"text":"(a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort. (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY]."},{"segment_id":"2063:oa:010","segment_index":10,"text":"Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal. (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law."},{"segment_id":"2063:oa:011","segment_index":11,"text":"(d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request."},{"segment_id":"2063:oa:012","segment_index":12,"text":"(e) The Secretary of Defense shall develop special procedures for the review of cryptologic information,"},{"segment_id":"2063:oa:013","segment_index":13,"text":"and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies."},{"segment_id":"2063:oa:014","segment_index":14,"text":"The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States. (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order: (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order. (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section. Part 4 Safeguarding Sec. 4.1 General Restrictions on Access. (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes. (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons. (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch. (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency. Sec. 4.2 Special Access Programs. (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence."},{"segment_id":"2063:oa:015","segment_index":15,"text":"(b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings. Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees. (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waived as provided in Section 4.3(b) for persons who: (1) are engaged in historical research projects, or (2) previously have occupied policy-making positions to which they were appointed by the President. (b) Waivers under Section 4.3(a) may be granted only if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee. Part 5 Implementation and Review Sec. 5.1 Policy Direction."},{"segment_id":"2063:oa:016","segment_index":16,"text":"(a) The National Security Council shall provide overall policy direction for the information security program. (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office. Sec. 5.2 Information Security Oversight Office. (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority to appoint a staff for the Office.(b) The Director shall: (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies; (f) oversee agency actions to ensure compliance with this Order and implementing directives; (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal; (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal; * Ibid. (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval; (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program; (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program; (8) report at least annually to the President through the National Security Council on the implementation of this Order; and (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program. Sec. 5.3 General Responsibilities. Agencies that originate or handle classified information shall: (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order; (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas. Sec. 5.4 Sanctions."},{"segment_id":"2063:oa:017","segment_index":17,"text":"(a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken. * Ibid."},{"segment_id":"2063:oa:018","segment_index":18,"text":"(b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or (3) knowingly and willfully violate any other provision of this Order or implementing directive. (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs."},{"segment_id":"2063:oa:019","segment_index":19,"text":"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs. * Ibid Part 6 General Provisions Sec. 6.1 Definitions. (a) \"Agency\" has the meaning provided at [AUTHORITY] (b) \"Information\" means any information or material, regardless of its physical form or characteristics, that is owned by, produced by or for, or is under the control of the United States Government. (c) \"National security information\" means information that has been determined pursuant to this Order or any predecessor order to require protection against unauthorized disclosure and that is so designated. (d) \"Foreign government information\" means: (1) information provided by a foreign government or governments, an international organization of governments, or any element thereof with the expectation, expressed or implied, that the information, the source of the information, or both, are to be held in confidence; or (2) information produced by the United States pursuant to or as a result of a joint arrangement with a foreign government or governments or an international organization of governments, or any element thereof, requiring that the information, the arrangement, or both, are to be held in confidence. (e) \"National security\" means the national defense or foreign relations of the United States. (f) \"Confidential source\" means any individual or organization that has provided, or that may reasonably be expected to provide, information to the United States on matters pertaining to the national security with the expectation, expressed or implied, that the information or relationship, or both, be held in confidence. (g) \"Original classification\" means an initial determination that information requires, in the interest of national security, protection against unauthorized disclosure, together with a classification designation signifying the level of protection required. Sec. 6.2 General."}],"policy_functions":[{"function_id":"2063:pf:001","label":"Establish system for national security information","actor":"President","action":"prescribes","target":"uniform system for classifying, declassifying, and safeguarding national security information","mechanism":"Executive Order prescribing classification levels, delegation authorities, declassification rules, safeguarding standards, oversight mechanisms, and sanctions","effect":"Standardizes the management and protection of national security information across the executive branch","condition":"","timing":"","evidence":"This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information.","evidence_start":0,"evidence_end":118,"confidence":"high"}],"operative_functions":[{"function_id":"2063:of:001","label":"Establish classification levels","actor":"President","action":"order","target":"national security information","mechanism":"establishing three classification levels (Top Secret, Secret, Confidential) based on potential damage to national security and restricting other terms","effect":"Standardizes classification levels and thresholds across agencies","condition":"","timing":"","evidence":"National security information (hereinafter \"classified information\") shall be classified at one of the following three levels: (1) \"Top Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security. (2) \"Secret\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security. (3) \"Confidential\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security. (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information.","evidence_start":103,"evidence_end":839,"confidence":"high","segment_id":"2063:oa:001"},{"function_id":"2063:of:002","label":"Safeguard information during classification doubt","actor":"Executive branch personnel","action":"shall safeguard","target":"information subject to reasonable doubt about classification ne
