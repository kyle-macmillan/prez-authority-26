ed","mechanism":"treating unclassified information as classified pending OCA determination within 30 days","effect":"Prevents unauthorized disclosure while classification determinations are pending","condition":"If there is reasonable doubt about the need to classify information","timing":"pending a determination by an original classification authority, who shall make this determination within thirty (30) days","evidence":"If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days.","evidence_start":4,"evidence_end":245,"confidence":"high","segment_id":"2063:oa:002"},{"function_id":"2063:of:003","label":"Regulate classification level doubt and original classification authority delegations","actor":"President / Agency heads / Original classification authorities","action":"limit and delegate","target":"original classification authority at Top Secret, Secret, and Confidential levels","mechanism":"prescribing specific designation pathways, requiring written delegations, and restricting redelegation","effect":"Restricts original classification authority to authorized officials and minimizes delegating authority","condition":"","timing":"","evidence":"If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days. Sec. 1.2 Classification Authority. (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register, and (3) officials delegated this authority pursuant to Section 1.2(d). (b) Secret. The authority to classify information originally as Secret may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (c) Confidential. The authority to classify information originally as Confidential may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret or Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (d) Delegation of Original Classification Authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head. (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head. * The citation should read \"Section 5.3(a)\". [ White House correction] (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head. (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order.","evidence_start":0,"evidence_end":2905,"confidence":"high","segment_id":"2063:oa:003"},{"function_id":"2063:of:004","label":"Process classification requests in non-originating agencies and exceptional cases","actor":"Agency employees, contractors, grantees, and agencies with subject matter interest","action":"protect and transmit","target":"information originated without original classification authority believed to require classification","mechanism":"transmitting information to the agency with appropriate subject matter interest or ISOO Director for determination within 30 days","effect":"Ensures unclassified origins are properly evaluated for classification by authorized agencies","condition":"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification","timing":"promptly / within thirty (30) days","evidence":"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office.","evidence_start":244,"evidence_end":1023,"confidence":"high","segment_id":"2063:oa:004"},{"function_id":"2063:of:005","label":"Establish classification standards, categories, duration, and ISOO notification","actor":"ISOO Director / Original classification authorities / Agency heads","action":"determine, classify, and mark","target":"national security information across designated categories","mechanism":"prescribing eligible categories, damage standard determinations, mandatory document markings, duration rules, and ISOO waiver/category notifications","effect":"Defines eligibility and marking requirements for original classification","condition":"","timing":"at the time the information is originally classified","evidence":"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.3 Classification Categories. (a) Information shall be considered for classification if it concerns: (1) military plans, weapons, or operations; (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security; (3) foreign government information; (4) intelligence activities (including special activities), or intelligence sources or methods; (5) foreign relations or foreign activities of the United States; (6) scientific, technological, or economic matters relating to the national security; (7) United States Government programs for safeguarding nuclear materials or facilities; (8) cryptology; (9) a confidential source; or (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office. (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security. (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security. (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information. Sec. 1.4 Duration of Classification. (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified. (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions. (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order. Sec. 1.5 Identification and Markings. (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information: (1) one of the three classification levels defined in Section 1.1; (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official; (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \"Originating Agency's Determination Required.\" (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office.","evidence_start":0,"evidence_end":4322,"confidence":"high","segment_id":"2063:oa:005"},{"function_id":"2063:of:006","label":"Define limitations on classification and reclassification rules","actor":"President / Agency heads / Designated officials","action":"prohibit, reclassify, and apply derivative classification rules","target":"unclassified information, basic scientific research, previously declassified information, and derivative markings","mechanism":"prohibiting improper classification purposes, authorizing written reclassification under specific conditions with ISOO reporting, and prescribing derivative classification requirements","effect":"Prevents abuse of classification authority and regulates derivative classification and reclassification","condition":"if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered","timing":"promptly","evidence":"(d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information. (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b). Sec. 1.6 Limitations on Classification. (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office. (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority. Part 2 Derivative Classification Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources. Sec. 2.2 Classification Guides.","evidence_start":0,"evidence_end":2928,"confidence":"high","segment_id":"2063:oa:006"},{"function_id":"2063:of:007","label":"Require classification guides and govern declassification timing","actor":"Agencies with original classification authority / Agency heads","action":"prepare, approve, waive, and declassify","target":"classification guides and classified information","mechanism":"requiring written approval for classification guides, permitting agency head waivers with ISOO notification, and mandating declassification as soon as national security permits","effect":"Ensures uniform derivative classification and timely declassification","condition":"for good cause (for waivers)","timing":"as soon as national security considerations permit","evidence":"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and * Ibid. (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. Part 3 Declassification and Downgrading Sec. 3.1 Declassification Authority. (a) Information shall be declassified or downgraded as soon as national security considerations permit.","evidence_start":0,"evidence_end":951,"confidence":"high","segment_id":"2063:oa:007"},{"function_id":"2063:of:008","label":"Establish declassification authorities, transferred info rules, and systematic review","actor":"Agencies / ISOO Director / Archivist of the United States / Secretary of Defense / Director of Central Intelligence","action":"coordinate, declassify, review, and establish special procedures","target":"classified information, transferred records, National Archives holdings, cryptologic, and intelligence information","mechanism":"specifying who holds declassification authority, ISOO declassification order authority with NSC appeal, Archivist systematic review, and agency head/special systematic review procedures","effect":"Provides clear mechanisms for declassification across agency transfers, historical archives, and specialized compartments","condition":"If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order","timing":"systematically / in accordance with procedures and time frames prescribed in ISOO directives","evidence":"Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order. (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). * * Ibid. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal. (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders. Sec. 3.2 Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order. (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines. Sec. 3.3 Systematic Review for Declassification. (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads. (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States. (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods. Sec. 3.4 Mandatory Review for Declassification.","evidence_start":0,"evidence_end":3961,"confidence":"high","segment_id":"2063:oa:008"},{"function_id":"2063:of:009","label":"Establish mandatory declassification review requirements and presidential exemptions","actor":"Originating agencies","action":"subject to review","target":"classified information requested by eligible requesters","mechanism":"requiring review when requested by citizens, permanent residents, or government entities with sufficient specificity, while exempting presidential advice and presidential papers","effect":"Provides a public mandatory review pathway while protecting presidential records","condition":"if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort","timing":"","evidence":"(a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort. (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY].","evidence_start":0,"evidence_end":780,"confidence":"high","segment_id":"2063:oa:009"},{"function_id":"2063:of:010","label":"Establish review procedures and appeals for presidential papers","actor":"Archivist of the United States / ISOO Director / National Security Council","action":"develop review procedures and adjudicate appeals","target":"presidential papers or records","mechanism":"providing agency consultation and sequential appeals to ISOO Director and National Security Council","effect":"Establishes administrative review and appeal rights for presidential material declassification decisions","condition":"","timing":"promptly","evidence":"Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal. (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law.","evidence_start":0,"evidence_end":880,"confidence":"high","segment_id":"2063:oa:010"},{"function_id":"2063:of:011","label":"Mandate agency mandatory review procedures","actor":"Agency heads","action":"shall develop procedures","target":"mandatory declassification review processing and administrative appeals","mechanism":"establishing agency-level processing and administrative appeal mechanisms for denied mandatory review requests","effect":"Ensures standardized agency processing of mandatory declassification review requests","condition":"","timing":"","evidence":"(d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request.","evidence_start":0,"evidence_end":305,"confidence":"high","segment_id":"2063:oa:011"},{"function_id":"2063:of:012","label":"Develop special review procedures for cryptologic information","actor":"Secretary of Defense","action":"shall develop special procedures","target":"cryptologic information declassification review","mechanism":"establishing dedicated review procedures for cryptologic materials","effect":"Protects sensitive cryptologic sources and methods during declassification review","condition":"","timing":"","evidence":"(e) The Secretary of Defense shall develop special procedures for the review of cryptologic information,","evidence_start":0,"evidence_end":104,"confidence":"high","segment_id":"2063:oa:012"},{"function_id":"2063:of:013","label":"Develop special review procedures for intelligence information","actor":"Director of Central Intelligence","action":"shall develop special procedures","target":"intelligence activities, sources, or methods information declassification review","mechanism":"establishing dedicated review procedures after consultation with affected agencies","effect":"Protects intelligence sources and methods during declassification review","condition":"","timing":"","evidence":"and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies.","evidence_start":0,"evidence_end":252,"confidence":"high","segment_id":"2063:oa:013"},{"function_id":"2063:of:014","label":"Establish special review procedures for National Archives and response rules","actor":"Archivist of the United States / Federal agencies","action":"develop procedures and respond to requests","target":"accessioned National Archives information and information requests under FOIA or mandatory review","mechanism":"authorizing Glomar responses when existence is classifiable and requiring referral of third-party agency documents to originators","effect":"Regulates disclosure responses and referrals across executive agencies","condition":"whenever the fact of its existence or non-existence is itself classifiable under this Order","timing":"","evidence":"The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States. (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order: (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order. (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section. Part 4 Safeguarding Sec. 4.1 General Restrictions on Access. (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes. (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons. (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch. (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency. Sec. 4.2 Special Access Programs. (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence.","evidence_start":0,"evidence_end":2812,"confidence":"high","segment_id":"2063:oa:014"},{"function_id":"2063:of:015","label":"Establish SAP accounting and access rules for historical researchers and former presidential appointees","actor":"Agency heads / ISOO Director / Originating agencies","action":"establish accounting system and grant access waivers","target":"Special Access Programs and access restrictions for historical researchers and former presidential appointees","mechanism":"granting non-delegable ISOO access to SAP accountings and allowing written security waivers under specified conditions","effect":"Ensures oversight of SAPs while permitting controlled access for historical research and former appointees","condition":"if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information...; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received...","timing":"","evidence":"(b) Each agency head shall establish and maintain a system of accounting for special access programs. The Director of the Information Security Oversight Office, consistent with the provisions of Section 5.2(b)(4), shall have non-delegable access to all such accountings. Sec. 4.3 Access by Historical Researchers and Former Presidential Appointees. (a) The requirement in Section 4.1(a) that access to classified information may be granted only as is essential to the accomplishment of authorized and lawful Government purposes may be waived as provided in Section 4.3(b) for persons who: (1) are engaged in historical research projects, or (2) previously have occupied policy-making positions to which they were appointed by the President. (b) Waivers under Section 4.3(a) may be granted only if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information from unauthorized disclosure or compromise, and ensures that the information is safeguarded in a manner consistent with this Order; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received while serving as a presidential appointee. Part 5 Implementation and Review Sec. 5.1 Policy Direction.","evidence_start":0,"evidence_end":1344,"confidence":"high","segment_id":"2063:oa:015"},{"function_id":"2063:of:016","label":"Establish oversight structure, ISOO authorities, and agency general responsibilities","actor":"National Security Council / Administrator of General Services / ISOO Director / Agencies","action":"provide policy direction, delegate functions, oversight, and administer programs","target":"information security program and executive agency compliance","mechanism":"delegating GSA oversight to ISOO Director, establishing binding directives, on-site reviews, regulation reviews, annual reports, senior agency official designations, access controls, and contingency plans","effect":"Creates comprehensive administrative governance and oversight structure for executive branch information security","condition":"If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access","timing":"at least annually","evidence":"(a) The National Security Council shall provide overall policy direction for the information security program. (b) The Administrator of General Services shall be responsible for implementing and monitoring the program established pursuant to this Order. The Administrator shall delegate the implementation and monitorship functions of this program to the Director of the Information Security Oversight Office. Sec. 5.2 Information Security Oversight Office. (a) The Information Security Oversight Office shall have a full-time Director appointed by the Administrator of General Services subject to approval by the President. The Director shall have the authority to appoint a staff for the Office.(b) The Director shall: (1) develop, in consultation with the agencies, and promulgate, subject to the approval of the National Security Council, directives for the implementation of this Order, which shall be binding on the agencies; (f) oversee agency actions to ensure compliance with this Order and implementing directives; (3) review all agency implementing regulations and agency guidelines for systematic declassification review. The Director shall require any regulation or guideline to be changed if it is not consistent with this Order or implementing directives. Any such decision by the Director may be appealed to the National Security Council. The agency regulation or guideline shall remain in effect pending a prompt decision on the appeal; (4) have the authority to conduct on-site reviews of the information security program of each agency that generates or handles classified information and to require of each agency those reports, information, and other cooperation that may be necessary to fulfill the Director's responsibilities. If these reports, inspections, or access to specific categories of classified information would pose an exceptional national security risk, the affected agency head or the senior official designated under Section 5.3(a)(1)* may deny access. The Director may appeal denials to the National Security Council. The denial of access shall remain in effect pending a prompt decision on the appeal; * Ibid. (5) review requests for original classification authority from agencies or officials not granted original classification authority and, if deemed appropriate, recommend presidential approval; (6) consider and take action on complaints and suggestions from persons within or outside the Government with respect to the administration of the information security program; (7) have the authority to prescribe, after consultation with affected agencies, standard forms that will promote the implementation of the information security program; (8) report at least annually to the President through the National Security Council on the implementation of this Order; and (9) have the authority to convene and chair interagency meetings to discuss matters pertaining to the information security program. Sec. 5.3 General Responsibilities. Agencies that originate or handle classified information shall: (a) designate a senior agency official to direct and administer its information security program, which shall include an active oversight and security education program to ensure effective implementation of this Order; (c) establish procedures to prevent unnecessary access to classified information, including procedures that (i) require that a demonstrable need for access to classified information is established before initiating administrative clearance procedures, and (ii) ensure that the number of persons granted access to classified information is limited to the minimum consistent with operational and security requirements and needs; and (d) develop special contingency plans for the protection of classified information used in or near hostile or potentially hostile areas. Sec. 5.4 Sanctions.","evidence_start":0,"evidence_end":3850,"confidence":"high","segment_id":"2063:oa:016"},{"function_id":"2063:of:017","label":"Report violations to agency heads","actor":"ISOO Director","action":"shall make a report","target":"agency heads or senior agency officials","mechanism":"reporting potential violations of the order or implementing directives to agency leadership","effect":"Initiates agency corrective action upon discovery of information security violations","condition":"If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred","timing":"","evidence":"(a) If the Director of the Information Security Oversight Office finds that a violation of this Order or its implementing directives may have occurred, the Director shall make a report to the head of the agency or to the senior official designated under Section 5.3(a)(1)* so that corrective steps, if appropriate, may be taken.","evidence_start":0,"evidence_end":328,"confidence":"high","segment_id":"2063:oa:017"},{"function_id":"2063:of:018","label":"Establish administrative sanctions and agency enforcement obligations","actor":"Agency heads / Senior agency officials / Federal officers, employees, contractors, licensees, and grantees","action":"subject to sanctions and ensure corrective action","target":"personnel violating classification standards and administrative discipline system","mechanism":"imposing reprimands, suspensions, removals, loss of access, or loss of classification authority, and requiring prompt corrective action","effect":"Deters unauthorized disclosures and classification violations through mandatory administrative sanctions","condition":"if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified...; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order...; or (3) knowingly and willfully violate any other provision...","timing":"whenever a violation under Section 5.4(b) occurs","evidence":"(b) Officers and employees of the United States Government, and its contractors, licensees, and grantees shall be subject to appropriate sanctions if they: (1) knowingly, willfully, or negligently disclose to unauthorized persons information properly classified under this Order or predecessor orders; (2.) knowingly and willfully classify or continue the classification of information in violation of this Order or any implementing directive; or (3) knowingly and willfully violate any other provision of this Order or implementing directive. (c) Sanctions may include reprimand, suspension without pay, removal, termination of classification authority, loss or denial of access to classified information, or other sanctions in accordance with applicable law and agency regulation. (d) Each agency head or the senior official designated under Section 5.3(a)(1)* shall ensure that appropriate and prompt corrective action is taken whenever a violation under Section 5.4(b) occurs.","evidence_start":0,"evidence_end":980,"confidence":"high","segment_id":"2063:oa:018"},{"function_id":"2063:of:019","label":"Notify ISOO of classification disclosure violations","actor":"Agency heads / Senior agency officials","action":"shall ensure notification","target":"ISOO Director","mechanism":"providing prompt notification to ISOO upon occurrence of unauthorized disclosure or improper classification violations","effect":"Ensures centralized oversight of significant information security violations","condition":"whenever a violation under Section 5.4 (b)(1) or (2) occurs","timing":"promptly","evidence":"Either shall ensure that the Director of the Information Security Oversight Office is promptly notified whenever a violation under Section 5.4 (b)(1) or (2) occurs.","evidence_start":0,"evidence_end":164,"confidence":"high","segment_id":"2063:oa:019"}],"request_id":"function-profile-v1:2063","model":"gemini-3.6-flash","model_version":"gemini-3.6-flash","grounding_metadata":null,"raw_response":"```json\n{\n  \"document_id\": \"2063\",\n  \"policy_functions\": [\n    {\n      \"function_id\": \"2063:pf:001\",\n      \"label\": \"Establish system for national security information\",\n      \"actor\": \"President\",\n      \"action\": \"prescribes\",\n      \"target\": \"uniform system for classifying, declassifying, and safeguarding national security information\",\n      \"mechanism\": \"Executive Order prescribing classification levels, delegation authorities, declassification rules, safeguarding standards, oversight mechanisms, and sanctions\",\n      \"effect\": \"Standardizes the management and protection of national security information across the executive branch\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"This Order prescribes a uniform system for classifying, declassifying, and safeguarding national security information.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 105,\n      \"confidence\": 1.0\n    }\n  ],\n  \"operative_functions\": [\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:001\",\n      \"function_id\": \"2063:of:001\",\n      \"label\": \"Establish classification levels\",\n      \"actor\": \"President\",\n      \"action\": \"order\",\n      \"target\": \"national security information\",\n      \"mechanism\": \"establishing three classification levels (Top Secret, Secret, Confidential) based on potential damage to national security and restricting other terms\",\n      \"effect\": \"Standardizes classification levels and thresholds across agencies\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"National security information (hereinafter \\\"classified information\\\") shall be classified at one of the following three levels: (1) \\\"Top Secret\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause exceptionally grave damage to the national security. (2) \\\"Secret\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause serious damage to the national security. (3) \\\"Confidential\\\" shall be applied to information, the unauthorized disclosure of which reasonably could be expected to cause damage to the national security. (b) Except as otherwise provided by statute, no other terms shall be used to identify classified information.\",\n      \"evidence_start\": 91,\n      \"evidence_end\": 822,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:002\",\n      \"function_id\": \"2063:of:002\",\n      \"label\": \"Safeguard information during classification doubt\",\n      \"actor\": \"Executive branch personnel\",\n      \"action\": \"shall safeguard\",\n      \"target\": \"information subject to reasonable doubt about classification need\",\n      \"mechanism\": \"treating unclassified information as classified pending OCA determination within 30 days\",\n      \"effect\": \"Prevents unauthorized disclosure while classification determinations are pending\",\n      \"condition\": \"If there is reasonable doubt about the need to classify information\",\n      \"timing\": \"pending a determination by an original classification authority, who shall make this determination within thirty (30) days\",\n      \"evidence\": \"If there is reasonable doubt about the need to classify information, it shall be safeguarded as if it were classified pending a determination by an original classification authority, who shall make this determination within thirty (30) days.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 235,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:003\",\n      \"function_id\": \"2063:of:003\",\n      \"label\": \"Regulate classification level doubt and original classification authority delegations\",\n      \"actor\": \"President / Agency heads / Original classification authorities\",\n      \"action\": \"limit and delegate\",\n      \"target\": \"original classification authority at Top Secret, Secret, and Confidential levels\",\n      \"mechanism\": \"prescribing specific designation pathways, requiring written delegations, and restricting redelegation\",\n      \"effect\": \"Restricts original classification authority to authorized officials and minimizes delegating authority\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"If there is reasonable doubt about the appropriate level of classification, it shall be safeguarded at the higher level of classification pending a determination by an original classification authority, who shall make this determination within thirty (30) days. Sec. 1.2 Classification Authority. (a) Top Secret. The authority to classify information originally as Top Secret may be exercised only by: (1) the President; (2) agency heads and officials designated by the President in the Federal Register, and (3) officials delegated this authority pursuant to Section 1.2(d). (b) Secret. The authority to classify information originally as Secret may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (c) Confidential. The authority to classify information originally as Confidential may be exercised only by: (1) agency heads and officials designated by the President in the Federal Register, (2) officials with original Top Secret or Secret classification authority; and (3) officials delegated such authority pursuant to Section 1.2(d). (d) Delegation of Original Classification Authority. (1) Delegations of original classification authority shall be limited to the minimum required to administer this Order. Agency heads are responsible for ensuring that designated subordinate officials have a demonstrable and continuing need to exercise this authority. (2) Original Top Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Section 1.2(a)(2); and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Top Secret classification authority by the agency head. (3) Original Secret classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2) and 1.2(b)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original Secret classification authority by the agency head. * The citation should read \\\"Section 5.3(a)\\\". [ White House correction] (4) Original Confidential classification authority may be delegated only by the President; an agency head or official designated pursuant to Sections 1.2(a)(2), 1.2(b)(1) and 1.2(c)(1); an official with original Top Secret classification authority; and the senior official designated under Section 5.3(a)(1),* provided that official has been delegated original classification authority by the agency head. (5) Each delegation of original classification authority shall be in writing and the authority shall not be redelegated except as provided in this Order.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 2865,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:004\",\n      \"function_id\": \"2063:of:004\",\n      \"label\": \"Process classification requests in non-originating agencies and exceptional cases\",\n      \"actor\": \"Agency employees, contractors, grantees, and agencies with subject matter interest\",\n      \"action\": \"protect and transmit\",\n      \"target\": \"information originated without original classification authority believed to require classification\",\n      \"mechanism\": \"transmitting information to the agency with appropriate subject matter interest or ISOO Director for determination within 30 days\",\n      \"effect\": \"Ensures unclassified origins are properly evaluated for classification by authorized agencies\",\n      \"condition\": \"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification\",\n      \"timing\": \"promptly / within thirty (30) days\",\n      \"evidence\": \"When an employee, contractor, licensed, or grantee of an agency that does not have original classification authority originates information believed by that person to require classification, the information shall be protected in a manner consistent with this Order and its implementing directives. The information shall be transmitted promptly as provided under this Order or its implementing directives to the agency that has appropriate subject matter interest and classification authority with respect to this information. That agency shall decide within thirty (30) days whether to classify this information. If it is not clear which agency has classification responsibility for this information, it shall be sent to the Director of the Information Security Oversight Office.\",\n      \"evidence_start\": 218,\n      \"evidence_end\": 1022,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:005\",\n      \"function_id\": \"2063:of:005\",\n      \"label\": \"Establish classification standards, categories, duration, and ISOO notification\",\n      \"actor\": \"ISOO Director / Original classification authorities / Agency heads\",\n      \"action\": \"determine, classify, and mark\",\n      \"target\": \"national security information across designated categories\",\n      \"mechanism\": \"prescribing eligible categories, damage standard determinations, mandatory document markings, duration rules, and ISOO waiver/category notifications\",\n      \"effect\": \"Defines eligibility and marking requirements for original classification\",\n      \"condition\": \"\",\n      \"timing\": \"at the time the information is originally classified\",\n      \"evidence\": \"The Director shall determine the agency having primary subject matter interest and forward the information, with appropriate recommendations, to that agency for a classification determination. Sec. 1.3 Classification Categories. (a) Information shall be considered for classification if it concerns: (1) military plans, weapons, or operations; (2) the vulnerabilities or capabilities of systems, installations, projects, or plans relating to the national security; (3) foreign government information; (4) intelligence activities (including special activities), or intelligence sources or methods; (5) foreign relations or foreign activities of the United States; (6) scientific, technological, or economic matters relating to the national security; (7) United States Government programs for safeguarding nuclear materials or facilities; (8) cryptology; (9) a confidential source; or (10) other categories of information that are related to the national security and that require protection against unauthorized disclosure as determined by the President or by agency heads or other officials who have been delegated original classification authority by the President. Any determination made under this subsection shall be reported promptly to the Director of the Information Security Oversight Office. (b) Information that is determined to concern one or more of the categories in Section 1.3(a) shall be classified when an original classification authority also determines that its unauthorized disclosure, either by itself or in the context of other information, reasonably could be expected to cause damage to the national security. (c) Unauthorized disclosure of foreign government information, the identity of a confidential foreign source, or intelligence sources or methods is presumed to cause damage to the national security. (d) Information classified in accordance with Section 1.3 shall not be declassified automatically as a result of any unofficial publication or inadvertent or unauthorized disclosure in the United States or abroad of identical or similar information. Sec. 1.4 Duration of Classification. (a) Information shall be classified as long as required by national security considerations. When it can be determined, a specific date or event for declassification shall be set by the original classification authority at the time the information is originally classified. (b) Automatic declassification determinations under predecessor orders shall remain valid unless the classification is extended by an authorized official of the originating agency. These extensions may be by individual documents or categories of information. The agency shall be responsible for notifying holders of the information of such extensions. (c) Information classified under predecessor orders and marked for declassification review shall remain classified until reviewed for declassification under the provisions of this Order. Sec. 1.5 Identification and Markings. (a) At the time of original classification, the following information shall be shown on the face of all classified documents, or clearly associated with other forms of classified information in a manner appropriate to the medium involved, unless this information itself would reveal a confidential source or relationship not otherwise evident in the document or information: (1) one of the three classification levels defined in Section 1.1; (2) the identity of the original classification authority if other than the person whose name appears as the approving or signing official; (3) the agency and office of origin; and (4) the date or event for declassification, or the notation \\\"Originating Agency's Determination Required.\\\" (b) Each classified document shall, by marking or other means, indicate which portions are classified, with the applicable classification level, and which portions are not classified. Agency heads may, for good cause, grant and revoke waivers of this requirement for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. (c) Marking designations implementing the provisions of this Order, including abbreviations, shall conform to the standards prescribed in implementing directives issued by the Information Security Oversight Office.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 4434,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:006\",\n      \"function_id\": \"2063:of:006\",\n      \"label\": \"Define limitations on classification and reclassification rules\",\n      \"actor\": \"President / Agency heads / Designated officials\",\n      \"action\": \"prohibit, reclassify, and apply derivative classification rules\",\n      \"target\": \"unclassified information, basic scientific research, previously declassified information, and derivative markings\",\n      \"mechanism\": \"prohibiting improper classification purposes, authorizing written reclassification under specific conditions with ISOO reporting, and prescribing derivative classification requirements\",\n      \"effect\": \"Prevents abuse of classification authority and regulates derivative classification and reclassification\",\n      \"condition\": \"if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered\",\n      \"timing\": \"promptly\",\n      \"evidence\": \"(d) Foreign government information shall either retain its original classification or be assigned a United States classification that shall ensure a degree of protection at least equivalent to that required by the entity that furnished the information. (e) Information assigned a level of classification under predecessor orders shall be considered as classified at that level of classification despite the omission of other required markings. Omitted markings may be inserted on a document by the officials specified in Section 3.1(b). Sec. 1.6 Limitations on Classification. (a) In no case shall information be classified in order to conceal violations of law, inefficiency, or administrative error; to prevent embarrassment to a person, organization, or agency; to restrain competition; or to prevent or delay the release of information that does not require protection in the interest of national security. (b) Basic scientific research information not clearly related to the national security may not be classified. (c) The President or an agency head or official designated under Sections 1.2(a)(2), 1.2(b)(1), or 1.2(c)(1) may reclassify information previously declassified and disclosed if it is determined in writing that (1) the information requires protection in the interest of national security; and (2) the information may reasonably be recovered. These reclassification actions shall be reported promptly to the Director of the Information Security Oversight Office. (d) Information may be classified or reclassified after an agency has received a request for it under the Freedom of [AUTHORITY] ([AUTHORITY] or [AUTHORITY] ([AUTHORITY], or the mandatory review provisions of this Order (Section 3.4) if such classification meets the requirements of this Order and is accomplished personally and on a document-by-document basis by the agency head, the deputy agency head, the senior agency official designated under Section 5.3(a)(1), * or an official with original Top Secret classification authority. Part 2 Derivative Classification Sec. 2.1 Use of Derivative Classification. (a) Derivative classification is (1) the determination that information is in substance the same as information currently classified, and (2) the application of the same classification markings. Persons who only reproduce, extract, or summarize classified information, or who only apply classification markings derived from source material or as directed by a classification guide, need not possess original classification authority. (b) Persons who apply derivative classification markings shall: (1) observe and respect original classification decisions; and (2) carry forward to any newly created documents any assigned authorized markings. The declassification date or event that provides the longest period of classification shall be used for documents classified on the basis of multiple sources. Sec. 2.2 Classification Guides.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 2865,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:007\",\n      \"function_id\": \"2063:of:007\",\n      \"label\": \"Require classification guides and govern declassification timing\",\n      \"actor\": \"Agencies with original classification authority / Agency heads\",\n      \"action\": \"prepare, approve, waive, and declassify\",\n      \"target\": \"classification guides and classified information\",\n      \"mechanism\": \"requiring written approval for classification guides, permitting agency head waivers with ISOO notification, and mandating declassification as soon as national security permits\",\n      \"effect\": \"Ensures uniform derivative classification and timely declassification\",\n      \"condition\": \"for good cause (for waivers)\",\n      \"timing\": \"as soon as national security considerations permit\",\n      \"evidence\": \"(a) Agencies with original classification authority shall prepare classification guides to facilitate the proper and uniform derivative classification of information. (b) Each guide shall be approved personally and in writing by an official who: (1) has program or supervisory responsibility over the information or is the senior agency official designated under Section 5.3(a)(1); * and * Ibid. (2) is authorized to classify information originally at the highest level of classification prescribed in the guide. (c) Agency heads may, for good cause, grant and revoke waivers of the requirement to prepare classification guides for specified classes of documents or information. The Director of the Information Security Oversight Office shall be notified of any waivers. Part 3 Declassification and Downgrading Sec. 3.1 Declassification Authority. (a) Information shall be declassified or downgraded as soon as national security considerations permit.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 962,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:008\",\n      \"function_id\": \"2063:of:008\",\n      \"label\": \"Establish declassification authorities, transferred info rules, and systematic review\",\n      \"actor\": \"Agencies / ISOO Director / Archivist of the United States / Secretary of Defense / Director of Central Intelligence\",\n      \"action\": \"coordinate, declassify, review, and establish special procedures\",\n      \"target\": \"classified information, transferred records, National Archives holdings, cryptologic, and intelligence information\",\n      \"mechanism\": \"specifying who holds declassification authority, ISOO declassification order authority with NSC appeal, Archivist systematic review, and agency head/special systematic review procedures\",\n      \"effect\": \"Provides clear mechanisms for declassification across agency transfers, historical archives, and specialized compartments\",\n      \"condition\": \"If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order\",\n      \"timing\": \"systematically / in accordance with procedures and time frames prescribed in ISOO directives\",\n      \"evidence\": \"Agencies shall coordinate their review of classified information with other agencies that have a direct interest in the subject matter. Information that continues to meet the classification requirements prescribed by Section 1.3 despite the passage of time will continue to be protected in accordance with this Order. (b) Information shall be declassified or downgraded by the official who authorized the original classification, if that official is still serving in the same position; the originator's successor; a supervisory official of either; or officials delegated such authority in writing by the agency head or the senior agency official designated pursuant to Section 5.3(a)(1). * * Ibid. (c) If the Director of the Information Security Oversight Office determines that information is classified in violation of this Order, the Director may require the information to be declassified by the agency that originated the classification. Any such decision by the Director may be appealed to the National Security Council. The information shall remain classified, pending a prompt decision on the appeal. (d) The provisions of this Section shall also apply to agencies that, under the terms of this Order, do not have original classification authority, but that had Such authority under predecessor orders. Sec. 3.2 Transferred Information. (a) In the case of classified information transferred in conjunction with a transfer of functions, and not merely for storage purposes, the receiving agency shall be deemed to be the originating agency for purposes of this Order. (b) In the case of classified information that is not officially transferred as described in Section 3.2(a), but that originated in an agency that has ceased to exist and for which there is no successor agency, each agency in possession of such information shall be deemed to be the originating agency for purposes of this Order. Such information may be declassified or downgraded by the agency in possession after consultation with any other agency that has an interest in the subject matter of the information. (c) Classified information accessioned into the National Archives of the United States shall be declassified or downgraded by the Archivist of the United States in accordance with this Order, the directives of the Information Security Oversight Office, and agency guidelines. Sec. 3.3 Systematic Review for Declassification. (a) The Archivist of the United States shall, in accordance with procedures and time frames prescribed in the Information Security Oversight Office's directives implementing this Order, systematically review for declassification or downgrading (1) classified records accessioned into the National Archives of the United States, and (2) classified presidential papers or records under the Archivist's control. Such information shall be reviewed by the Archivist for declassification or downgrading in accordance with systematic review guidelines that shall be provided by the head of the agency that originated the information, or in the case of foreign government information, by the Director of the Information Security Oversight Office in consultation with interested agency heads. (b) Agency heads may conduct internal systematic review programs for classified information originated by their agencies contained in records determined by the Archivist to be permanently valuable but that have not been accessioned into the National Archives of the United States. (c) After consultation with affected agencies, the Secretary of Defense may establish special procedures for systematic review for declassification of classified cryptologic information, and the Director of Central Intelligence may establish special procedures for systematic review for declassification of classified information pertaining to intelligence activities (including special activities), or intelligence sources or methods. Sec. 3.4 Mandatory Review for Declassification.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 3719,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:009\",\n      \"function_id\": \"2063:of:009\",\n      \"label\": \"Establish mandatory declassification review requirements and presidential exemptions\",\n      \"actor\": \"Originating agencies\",\n      \"action\": \"subject to review\",\n      \"target\": \"classified information requested by eligible requesters\",\n      \"mechanism\": \"requiring review when requested by citizens, permanent residents, or government entities with sufficient specificity, while exempting presidential advice and presidential papers\",\n      \"effect\": \"Provides a public mandatory review pathway while protecting presidential records\",\n      \"condition\": \"if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort\",\n      \"timing\": \"\",\n      \"evidence\": \"(a) Except as provided in Section 3.4(b), all information classified under this Order or predecessor orders shall be subject to a review for declassification by the originating agency, if: (1) the request is made by a United States citizen or permanent resident alien, a federal agency, or a State or local government; and (2) the request describes the document or material containing the information with sufficient specificity to enable the agency to locate it with a reasonable amount of effort. (b) Information originated by a President, the White House Staff, by committees, commissions, or boards appointed by the President, or others specifically providing advice and counsel to a President or acting on behalf of a President is exempted from the provisions of [AUTHORITY].\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 780,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:010\",\n      \"function_id\": \"2063:of:010\",\n      \"label\": \"Establish review procedures and appeals for presidential papers\",\n      \"actor\": \"Archivist of the United States / ISOO Director / National Security Council\",\n      \"action\": \"develop review procedures and adjudicate appeals\",\n      \"target\": \"presidential papers or records\",\n      \"mechanism\": \"providing agency consultation and sequential appeals to ISOO Director and National Security Council\",\n      \"effect\": \"Establishes administrative review and appeal rights for presidential material declassification decisions\",\n      \"condition\": \"\",\n      \"timing\": \"promptly\",\n      \"evidence\": \"Review procedures developed by the Archivist shall provide for consultation with agencies having primary subject matter interest and shall be consistent with the provisions of applicable laws or lawful agreements that pertain to the respective presidential papers or records. Any decision by the Archivist may be appealed to the Director of the Information Security Oversight Office. Agencies with primary subject matter interest shall be notified promptly of the Director's decision on such appeals and may further appeal to the National Security Council. The information shall remain classified pending a prompt decision on the appeal. (c) Agencies conducting a mandatory review for declassification shall declassify information no longer requiring protection under this Order. They shall release this information unless withholding is otherwise authorized under applicable law.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 898,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:011\",\n      \"function_id\": \"2063:of:011\",\n      \"label\": \"Mandate agency mandatory review procedures\",\n      \"actor\": \"Agency heads\",\n      \"action\": \"shall develop procedures\",\n      \"target\": \"mandatory declassification review processing and administrative appeals\",\n      \"mechanism\": \"establishing agency-level processing and administrative appeal mechanisms for denied mandatory review requests\",\n      \"effect\": \"Ensures standardized agency processing of mandatory declassification review requests\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"(d) Agency heads shall develop procedures to process requests for the mandatory review of classified information. These procedures shall apply to information classified under this or predecessor orders. They shall also provide a means for administratively appealing a denial of a mandatory review request.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 310,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:012\",\n      \"function_id\": \"2063:of:012\",\n      \"label\": \"Develop special review procedures for cryptologic information\",\n      \"actor\": \"Secretary of Defense\",\n      \"action\": \"shall develop special procedures\",\n      \"target\": \"cryptologic information declassification review\",\n      \"mechanism\": \"establishing dedicated review procedures for cryptologic materials\",\n      \"effect\": \"Protects sensitive cryptologic sources and methods during declassification review\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"(e) The Secretary of Defense shall develop special procedures for the review of cryptologic information,\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 105,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:013\",\n      \"function_id\": \"2063:of:013\",\n      \"label\": \"Develop special review procedures for intelligence information\",\n      \"actor\": \"Director of Central Intelligence\",\n      \"action\": \"shall develop special procedures\",\n      \"target\": \"intelligence activities, sources, or methods information declassification review\",\n      \"mechanism\": \"establishing dedicated review procedures after consultation with affected agencies\",\n      \"effect\": \"Protects intelligence sources and methods during declassification review\",\n      \"condition\": \"\",\n      \"timing\": \"\",\n      \"evidence\": \"and the Director of Central Intelligence shall develop special procedures for the review of information pertaining to intelligence activities (including special activities), or intelligence sources or methods, after consultation with affected agencies.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 250,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:014\",\n      \"function_id\": \"2063:of:014\",\n      \"label\": \"Establish special review procedures for National Archives and response rules\",\n      \"actor\": \"Archivist of the United States / Federal agencies\",\n      \"action\": \"develop procedures and respond to requests\",\n      \"target\": \"accessioned National Archives information and information requests under FOIA or mandatory review\",\n      \"mechanism\": \"authorizing Glomar responses when existence is classifiable and requiring referral of third-party agency documents to originators\",\n      \"effect\": \"Regulates disclosure responses and referrals across executive agencies\",\n      \"condition\": \"whenever the fact of its existence or non-existence is itself classifiable under this Order\",\n      \"timing\": \"\",\n      \"evidence\": \"The Archivist shall develop special procedures for the review of information accessioned into the National Archives of the United States. (f) In response to a request for information under the Freedom of [AUTHORITY], [AUTHORITY], or the mandatory review provisions of this Order: (1) An agency shall refuse to confirm or deny the existence or non-existence of requested information whenever the fact of its existence or non-existence is itself classifiable under this Order. (2) When an agency receives any request for documents in its custody that were classified by another agency, it shall refer copies of the request and the requested documents to the originating agency for processing, and may, after consultation with the originating agency, inform the requester of the referral. In cases in which the originating agency determines in writing that a response under Section 3.4(f)(1) is required, the referring agency shall respond to the requester in accordance with that Section. Part 4 Safeguarding Sec. 4.1 General Restrictions on Access. (a) A person is eligible for access to classified information provided that a determination of trustworthiness has been made by agency heads or designated officials and provided that such access is essential to the accomplishment of lawful and authorized Government purposes. (b) Controls shall be established by each agency to ensure that classified information is used, processed, stored, reproduced, transmitted, and destroyed only under conditions that will provide adequate protection and prevent access by unauthorized persons. (c) Classified information shall not be disseminated outside the executive branch except under conditions that ensure that the information will be given protection equivalent to that afforded within the executive branch. (d) Except as provided by directives issued by the President through the National Security Council, classified information originating in one agency may not be disseminated outside any other agency to which it has been made available without the consent of the originating agency. For purposes of this Section, the Department of Defense shall be considered one agency. Sec. 4.2 Special Access Programs. (a) Agency heads designated pursuant to Section 1.2(a) may create special access programs to control access, distribution, and protection of particularly sensitive information classified pursuant to this Order or predecessor orders. Such programs may be created or continued only at the written direction of these agency heads. For special access programs pertaining to intelligence activities (including special activities but not including military operational, strategic and tactical programs), or intelligence sources or methods, this function will be exercised by the Director of Central Intelligence.\",\n      \"evidence_start\": 0,\n      \"evidence_end\": 2697,\n      \"confidence\": 1.0\n    },\n    {\n      \"segment_id\": \"SEGMENT 2063:oa:015\",\n      \"function_id\": \"2063:of:015\",\n      \"label\": \"Establish SAP accounting and access rules for historical researchers and former presidential appointees\",\n      \"actor\": \"Agency heads / ISOO Director / Originating agencies\",\n      \"action\": \"establish accounting system and grant access waivers\",\n      \"target\": \"Special Access Programs and access restrictions for historical researchers and former presidential appointees\",\n      \"mechanism\": \"granting non-delegable ISOO access to SAP accountings and allowing written security waivers under specified conditions\",\n      \"effect\": \"Ensures oversight of SAPs while permitting controlled access for historical research and former appointees\",\n      \"condition\": \"if the originating agency: (1) determines in writing that access is consistent with the interest of national security; (2) takes appropriate steps to protect classified information...; and (3) limits the access granted to former presidential appointees to items that the person originated, reviewed, signed, or received...\",\n      \"timing\": \"\",\n      \
